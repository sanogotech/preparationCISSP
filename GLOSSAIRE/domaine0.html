<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Glossaire D0 · Généralités transverses 360°</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap">
<style>/* Layout : portail de révision — barre de navigation fixe, en-tête de domaine, sections empilées avec sommaire */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#101B2B; --muted:#5A6879; --line:#D7DEE7;
  --accent:#1F4E9E; --accent-soft:#E3EBF8; --on-accent:#FFFFFF;
  --ok:#2E7D46; --ok-soft:#E3F2E8; --bad:#B3262F; --bad-soft:#FBE7E8; --warn:#B0680A;
  --hl:#FFF4D6; --hl-ink:#6B4B00;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-quote:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}

/* Barre du portail */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.pbar-in{display:flex;align-items:center;gap:14px;padding-block:9px;overflow-x:auto;scrollbar-width:none}
.pbar-in::-webkit-scrollbar{display:none}
.logo{font-family:var(--f-disp);font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo span{color:var(--accent)}
.pnav{display:flex;gap:4px}
.pnav a{font-family:var(--f-mono);font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);padding:5px 9px;border-radius:6px;white-space:nowrap}
.pnav a:hover{background:var(--sunk);color:var(--ink)}
.pnav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

/* En-tête de page */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero-in{padding-block:26px 18px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.hero h1 .code{color:var(--accent);margin-right:10px}
.en{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pitch{max-width:72ch;margin:0;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.stat{display:flex;flex-direction:column;gap:2px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:150px;text-decoration:none;color:var(--ink)}
.stat b{font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
a.stat:hover{border-color:var(--accent)}
.toc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.toc::-webkit-scrollbar{display:none}
.toc a{font-size:13px;font-weight:500;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)}
.toc a:hover{color:var(--ink);border-color:var(--accent)}

main{padding-block:10px 60px}
.sec{padding-top:34px;scroll-margin-top:60px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h .n{font-family:var(--f-mono);font-size:13px;color:var(--accent);margin-right:8px}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}

/* Objectifs */
.obj{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:8px}
.obj li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.obj b{font-family:var(--f-mono);color:var(--accent);font-size:13px}

/* Concepts */
.concepts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.concept h3{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
.concept h3 i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.concept p{margin:0;font-size:14.5px}

/* Schémas */
.schemas{display:flex;flex-direction:column;gap:14px}
.schema h3{font-size:18px;margin-bottom:12px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 130px;min-width:0;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:7px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.flow .st b{font-family:var(--f-disp);font-size:15px}
.flow .st span{font-size:12.5px;color:var(--muted)}
.flow .ar{align-self:center;color:var(--muted);font-family:var(--f-mono)}
.cycle-back{margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:4px}
.stack .ly{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:14px}
.stack .ly b{font-family:var(--f-disp);font-size:15px}
.stack .ly span{color:var(--muted)}
.note{margin:10px 0 0;font-size:13px;color:var(--hl-ink);background:var(--hl);display:inline-block;padding:4px 10px;border-radius:6px}

/* Tableaux */
.tables{display:flex;flex-direction:column;gap:14px}
.tables h3{font-size:18px;margin-bottom:10px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td:first-child{font-weight:600}

/* Scénarios */
.scens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.scen .sit{margin:0;font-size:14.5px}
.scen .q{margin:0;font-weight:600;font-family:var(--f-disp);font-size:16px;color:var(--accent)}
.scen .ans{background:var(--ok-soft);border-radius:7px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.scen .ans p{margin:0}
.scen .why{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:13.5px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Quiz */
.quiz{max-width:820px}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--muted)}
.qz-prog{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:14px}
.qz-prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qz-q{font-family:var(--f-disp);font-size:20px;font-weight:600;margin:0 0 14px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--bg);border-left:4px solid var(--muted);font-size:14.5px}
.fb.ok{border-left-color:var(--ok)}.fb.ko{border-left-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.qz-end{display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1}
.score small{font-size:18px;color:var(--muted);font-weight:500}
.review{display:flex;flex-direction:column;gap:8px}
.review div{background:var(--bg);border-radius:7px;padding:10px 12px;font-size:14px}
.review b{color:var(--bad)}

/* Glossaire */
.glo-s{max-width:320px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.glo td:first-child{font-family:var(--f-mono);font-size:13px}

/* Checklist */
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-width:820px}
.chk label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14.5px}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;max-width:820px;margin-bottom:10px}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1 1 220px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pager a.next{text-align:right}
.foot{margin-top:30px;font-size:12px;color:var(--muted)}

@media (max-width:760px){
  .hero h1{font-size:26px}
  .concepts,.scens{grid-template-columns:minmax(0,1fr)}
  .stack .ly{grid-template-columns:minmax(0,1fr);gap:2px}
  .flow .ar{display:none}
  .flow .st{flex-basis:100%}
  .stat{min-width:0;flex:1 1 40%}
}
/* Glossaire : barre d'outils, cartes de concepts, flashcards, liste A–Z */
.pnav span.off{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--line);padding:5px 9px;white-space:nowrap}
.gbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:18px}
.gbar .inp,.gbar .sel{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.gbar .inp{flex:1 1 220px;min-width:0}
.gbar .sel{flex:0 1 230px;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:7px 12px;font-size:13.5px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.gcount{font-size:13.5px;color:var(--muted);margin:14px 0 4px}
.gcount b{color:var(--ink)}
.th-h{font-family:var(--f-disp);font-size:20px;font-weight:700;margin:24px 0 10px;display:flex;gap:10px;align-items:baseline}
.th-h .n{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.th-h small{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted)}
.gcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
.gc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:70px}
.gc.known{border-color:var(--ok)}
.gc.rev{border-color:var(--warn)}
.gc.flash-target{box-shadow:0 0 0 3px var(--accent-soft)}
.gc-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.gc-h .num{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.gc-h h3{font-size:18px;font-weight:600;line-height:1.25}
.gc-h h3 .enx{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--accent)}
.gc-tags{grid-column:2;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.wa{background:var(--hl);color:var(--hl-ink)}
.gc .def{margin:0;font-size:14.5px}
.gc-more{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.blk{background:var(--bg);border-radius:7px;padding:8px 11px}
.blk h4{margin:0 0 2px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.blk p{margin:0;font-size:14px}
.blk.tip{background:var(--accent-soft)}.blk.tip h4{color:var(--accent)}
.blk.nu h4{color:var(--warn)}
.sag{margin:0;padding:2px 0 2px 12px;border-left:2px solid var(--accent);font-family:var(--f-quote);font-style:italic;font-size:16px}
.gc-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gc-acts .btn{padding:5px 10px;font-size:13px}
.lnk{border:0;background:none;color:var(--accent);font-size:13px;padding:0;text-decoration:underline}
.fc{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:12px;padding:26px;min-height:320px;display:flex;flex-direction:column;gap:12px;cursor:pointer;max-width:780px}
.fc .t{font-family:var(--f-disp);font-size:28px;font-weight:700;line-height:1.15;text-wrap:balance}
.fc .t .enx{display:block;font-family:var(--f-body);font-size:16px;font-weight:500;color:var(--accent);margin-top:4px}
.fc .hint{margin-top:auto;font-size:13px;color:var(--muted)}
.fc-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;max-width:780px;justify-content:center}
.az-letters{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}
.az-letters a{font-family:var(--f-mono);font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:5px;padding:3px 8px;background:var(--surface)}
.az td:first-child{white-space:normal;min-width:200px}
.az td:first-child small{display:block;font-family:var(--f-mono);font-weight:500;color:var(--accent);font-size:12px}
.az tr.lt td{background:var(--bg);font-family:var(--f-disp);font-size:18px;font-weight:700;color:var(--accent)}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
/* Accueil du glossaire */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:10px}
.dt{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:150px}
a.dt:hover{border-color:var(--accent)}
.dt .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dt .cd{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--accent)}
.dt h3{font-size:17px;font-weight:600}
.dt p{margin:0;font-size:13px;color:var(--muted)}
.dt .pg{margin-top:auto;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.dt .pg i{display:block;height:100%;background:var(--ok)}
.dt.soon{background:transparent;border-style:dashed}
.dt.soon h3{color:var(--muted)}
.st-ok{font-size:11px;font-family:var(--f-mono);color:var(--ok);background:var(--ok-soft);padding:1px 7px;border-radius:999px}
.st-soon{font-size:11px;font-family:var(--f-mono);color:var(--muted);background:var(--sunk);padding:1px 7px;border-radius:999px}
.grp{font-family:var(--f-disp);font-size:16px;font-weight:600;color:var(--muted);margin:20px 0 8px}
.res{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.res a{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px}
.res a:hover{border-color:var(--accent)}
.res a b{font-family:var(--f-mono);color:var(--accent);font-size:12px}
.res a span small{color:var(--accent);font-weight:500}
.res a span em{display:block;font-style:normal;color:var(--muted);font-size:13px}
@media (max-width:760px){.gcards{grid-template-columns:minmax(0,1fr)}.fc{padding:20px 18px}.fc .t{font-size:23px}}
</style>

<script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const LETTERS="ABCD";

/* Moteur de quiz : mode « learn » (correction immédiate) ou « exam » (correction à la fin) */
function Quiz(el,questions,cfg){
  cfg=cfg||{};
  let qs,i,ans,timer,deadline;
  function start(list){
    qs=(list||questions).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:shuffle(q.opts.map((t,k)=>({t,ok:k===q.a})))}));
    i=0;ans=[];
    clearInterval(timer);
    if(cfg.minutes){deadline=Date.now()+cfg.minutes*60000;timer=setInterval(tick,1000)}
    render();
  }
  function tick(){const r=deadline-Date.now();const t=el.querySelector(".qz-time");if(t)t.textContent=fmt(r);if(r<=0){clearInterval(timer);finish(true)}}
  const fmt=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,"0")}`};
  function render(){
    if(i>=qs.length)return finish(false);
    const q=qs[i],a=ans[i],good=ans.filter(x=>x&&x.ok).length;
    el.innerHTML=`<div class="qz-top"><span>Question <b>${i+1}</b> / ${qs.length}${q.d&&cfg.showDom?` · <span class="en">${q.d}</span>`:""}</span>
      <span>${cfg.mode==="exam"?(cfg.minutes?`Temps restant <b class="qz-time">${fmt(deadline-Date.now())}</b>`:""):`Score <b>${good}</b> / ${ans.filter(Boolean).length}`}</span></div>
      <div class="qz-prog"><i style="width:${i/qs.length*100}%"></i></div>
      <p class="qz-q">${esc(q.q)}</p>
      <div class="opts">${q.opts.map((o,k)=>{
        let cls="opt";
        if(a){ if(cfg.mode==="exam"){if(a.k===k)cls+=" picked"} else {if(o.ok)cls+=" good";else if(a.k===k)cls+=" wrong"} }
        return `<button class="${cls}" type="button" data-k="${k}"${a&&cfg.mode!=="exam"?" disabled":""}><span class="k">${LETTERS[k]}</span><span>${esc(o.t)}</span></button>`}).join("")}</div>
      ${a&&cfg.mode!=="exam"?`<div class="fb ${a.ok?"ok":"ko"}"><b>${a.ok?"Bonne réponse.":"Pas tout à fait."}</b>${esc(q.ex)}</div>`:""}
      <div class="row" style="margin-top:14px">
        ${cfg.mode==="exam"?`<button class="btn primary" type="button" data-nav="next"${a?"":" disabled"}>${i+1<qs.length?"Valider et continuer":"Terminer l'examen"}</button><button class="btn" type="button" data-nav="stop">Arrêter et voir le résultat</button>`
          :`${a?`<button class="btn primary" type="button" data-nav="next">${i+1<qs.length?"Question suivante":"Voir mon score"}</button>`:""}`}
      </div>`;
  }
  el.addEventListener("click",e=>{
    const o=e.target.closest(".opt");
    if(o&&!o.disabled&&i<qs.length){const k=+o.dataset.k;if(cfg.mode!=="exam"&&ans[i])return;ans[i]={k,ok:qs[i].opts[k].ok};render();return}
    const n=e.target.closest("[data-nav]");if(!n||n.disabled)return;
    if(n.dataset.nav==="next"){i++;render()}
    else if(n.dataset.nav==="stop")finish(false);
    else if(n.dataset.nav==="again")start();
    else if(n.dataset.nav==="errors"){const wrong=qs.filter((q,k)=>!ans[k]||!ans[k].ok).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:q.opts.map(o=>o.t),a:q.opts.findIndex(o=>o.ok)}));start(wrong)}
  });
  function finish(timeout){
    clearInterval(timer);
    const total=qs.length,good=qs.filter((q,k)=>ans[k]&&ans[k].ok).length,pct=Math.round(good/total*100);
    const per={};qs.forEach((q,k)=>{if(!q.d)return;per[q.d]=per[q.d]||[0,0];per[q.d][1]++;if(ans[k]&&ans[k].ok)per[q.d][0]++});
    if(cfg.onDone)cfg.onDone({pct,good,total,per});
    const wrong=qs.map((q,k)=>({q,a:ans[k]})).filter(x=>!x.a||!x.a.ok);
    el.innerHTML=`<div class="qz-end">
      ${timeout?`<p class="note">Temps écoulé : les questions sans réponse comptent comme fausses.</p>`:""}
      <div class="score">${pct} %<small> · ${good} / ${total} bonnes réponses</small></div>
      <p style="margin:0">${pct>=80?"Excellent niveau : vous êtes prêt sur ce périmètre.":pct>=70?"Bon niveau, proche du seuil de réussite. Revoyez les erreurs ci-dessous.":"Niveau à consolider : relisez les concepts et les fiches, puis recommencez."}</p>
      ${Object.keys(per).length>1?`<div class="tblw"><table><thead><tr><th>Domaine</th><th>Score</th></tr></thead><tbody>${Object.keys(per).sort().map(d=>`<tr><td>${d}</td><td>${per[d][0]} / ${per[d][1]} (${Math.round(per[d][0]/per[d][1]*100)} %)</td></tr>`).join("")}</tbody></table></div>`:""}
      <div class="row"><button class="btn primary" type="button" data-nav="again">Recommencer</button>${wrong.length?`<button class="btn" type="button" data-nav="errors">Refaire seulement mes ${wrong.length} erreur${wrong.length>1?"s":""}</button>`:""}</div>
      ${wrong.length?`<h3 style="font-size:17px;margin-top:6px">Correction des erreurs</h3><div class="review">${wrong.map(x=>`<div><p style="margin:0 0 4px;font-weight:600">${esc(x.q.q)}</p><p style="margin:0">Bonne réponse : <strong>${esc(x.q.opts.find(o=>o.ok).t)}</strong>${x.a?` · votre réponse : <b>${esc(x.q.opts[x.a.k].t)}</b>`:" · sans réponse"}</p><p style="margin:4px 0 0;color:var(--muted)">${esc(x.q.ex)}</p></div>`).join("")}</div>`:""}
    </div>`;
  }
  return {start};
}
</script>
<script>const GD={"code": "D0", "num": 0, "name": "Généralités transverses 360°", "en": "Cross-domain foundations", "pitch": "Le socle commun aux 8 domaines : le vocabulaire, les principes et les réflexes qui reviennent partout dans l'examen. À maîtriser avant tout le reste.", "themes": ["Fondamentaux de la sécurité", "Vocabulaire du risque", "Principes de conception", "Contrôles de sécurité", "Gouvernance", "Gestion des risques", "Conformité, éthique et droit", "Référentiels", "Menaces et attaques", "Opérations et cycle de vie"], "items": [[1, "Sécurité de l'information", "Information security", "Protection de l'information et des systèmes contre l'accès, l'usage, la divulgation, la modification ou la destruction non autorisés, quel que soit le support (numérique, papier, oral).", "Une banque protège aussi bien ses bases de données que les dossiers papier de ses clients et les conversations au guichet.", "La cybersécurité ne couvre que le numérique ; la sécurité de l'information est plus large.", "Une information n'a pas de forme : elle a une valeur.", "L'examen raisonne en sécurité de l'information, pas seulement en informatique.", "D1"], [1, "Triade CIA", "CIA triad", "Les trois propriétés fondamentales à protéger : confidentialité, intégrité et disponibilité. Toute mesure de sécurité sert au moins l'une d'elles.", "Le chiffrement sert la confidentialité, l'empreinte SHA-256 l'intégrité, la redondance la disponibilité.", "Les trois propriétés sont en tension : renforcer l'une peut affaiblir une autre.", "Trois pieds font tenir le tabouret.", "Identifiez la propriété menacée dans le scénario : la bonne réponse protège celle-là.", "D1 · D3"], [1, "Confidentialité", "Confidentiality", "Garantir que seules les personnes autorisées accèdent à l'information.", "Chiffrement des données clients, contrôle d'accès aux dossiers RH.", "Confidentialité (protéger l'information) et vie privée (droits de la personne) ne sont pas synonymes.", "Un secret partagé avec tous n'est plus un secret.", "Menaces typiques : écoute, vol, ingénierie sociale, divulgation accidentelle.", "D2 · D3 · D5"], [1, "Intégrité", "Integrity", "Garantir que l'information n'est pas modifiée de façon non autorisée, accidentelle ou malveillante, et reste exacte et complète.", "Hachage d'un fichier téléchargé, contrôle de double saisie d'un virement.", "L'intégrité couvre aussi les erreurs involontaires, pas seulement les attaques.", "Une donnée fausse est plus dangereuse qu'une donnée absente.", "Modèles d'intégrité : Biba et Clark-Wilson.", "D3 · D8"], [1, "Disponibilité", "Availability", "Garantir l'accès à l'information et aux services en temps voulu pour les utilisateurs autorisés.", "Cluster redondant, sauvegardes, protection anti-DDoS, groupe électrogène.", "Pour un hôpital ou une usine, la disponibilité est souvent prioritaire sur la confidentialité.", "Un coffre inaccessible ne sert à personne.", "DoS, pannes, sinistres et ransomwares sont des atteintes à la disponibilité.", "D7"], [1, "Triade DAD", "DAD triad", "Le contraire de CIA : divulgation (disclosure), altération (alteration), destruction. Elle décrit ce que l'attaquant cherche à provoquer.", "Une fuite de base clients est une divulgation ; un ransomware provoque une destruction de fait.", "DAD sert à analyser l'impact d'un incident, CIA à concevoir la protection.", "Connais le mal pour choisir le remède.", "Divulgation ↔ confidentialité, altération ↔ intégrité, destruction ↔ disponibilité.", "D1"], [1, "Authenticité", "Authenticity", "Garantir que l'information ou l'entité est bien celle qu'elle prétend être (origine vérifiée).", "Un certificat TLS prouve l'identité du site ; un mail signé DKIM prouve le domaine d'envoi.", "L'authenticité porte sur l'origine ; l'intégrité sur le contenu.", "Un nom connu ne garantit pas l'expéditeur.", "Contrôles typiques : signatures, certificats, authentification mutuelle.", "D3 · D4"], [1, "Non-répudiation", "Nonrepudiation", "Impossibilité pour l'auteur d'une action de nier l'avoir réalisée.", "Un contrat signé numériquement avec la clé privée du DG.", "Un HMAC ne donne pas la non-répudiation, car la clé est partagée.", "Ma signature engage ma main.", "Seule la signature numérique (clé privée) apporte la non-répudiation.", "D3"], [1, "IAAA", "Identification, Authentication, Authorization, Accountability", "Séquence du contrôle d'accès : déclarer son identité, la prouver, recevoir des droits, rendre compte de ses actions.", "Saisir son identifiant, son mot de passe et son code MFA, accéder au logiciel de paie, être journalisé.", "L'identification seule ne prouve rien : un identifiant n'est pas un secret.", "Pas de responsabilité sans identité.", "L'imputabilité exige des identités uniques et des journaux.", "D5"], [1, "Hexade de Parker", "Parkerian hexad", "Extension de CIA à six propriétés : confidentialité, possession (contrôle), intégrité, authenticité, disponibilité, utilité.", "Une clé USB chiffrée volée : la confidentialité tient, mais la possession est perdue.", "Utile pour nuancer CIA ; l'examen reste centré sur CIA.", "Voir plus large n'empêche pas de viser juste.", "Utilité : une donnée chiffrée dont on a perdu la clé est disponible mais inutile.", "D1"], [2, "Actif", "Asset", "Tout ce qui a de la valeur pour l'organisation : informations, systèmes, personnes, locaux, réputation, savoir-faire.", "Base clients, serveur de paiement, ingénieur clé, marque.", "La valeur s'apprécie aussi du point de vue de l'attaquant.", "On ne protège bien que ce que l'on connaît.", "L'inventaire des actifs est le point de départ de toute analyse de risque.", "D1 · D2"], [2, "Menace", "Threat", "Tout événement ou action potentielle pouvant nuire à un actif.", "Ransomware, incendie, erreur humaine, employé malveillant.", "Une menace n'est dangereuse que s'il existe une vulnérabilité exploitable.", "Le loup rôde ; reste à savoir si la porte est ouverte.", "Menaces naturelles, humaines (intentionnelles ou non), techniques, environnementales.", "D1"], [2, "Agent de menace", "Threat agent / Threat actor", "L'entité qui concrétise la menace : cybercriminel, État, hacktiviste, initié, nature.", "Un groupe de ransomware est l'agent ; le chiffrement des données est la menace.", "On distingue capacité, motivation et opportunité de l'agent.", "Connais ton adversaire et connais-toi toi-même.", "La modélisation des menaces commence par identifier les agents probables.", "D1 · D8"], [2, "Vulnérabilité", "Vulnerability", "Faiblesse d'un actif, d'un processus ou d'un contrôle qui peut être exploitée par une menace.", "Logiciel non corrigé, mot de passe par défaut, absence de procédure de départ.", "Une vulnérabilité peut être technique, humaine ou organisationnelle.", "La fissure invisible fait tomber le mur.", "Les vulnérabilités connues sont référencées CVE et notées CVSS.", "D6 · D7"], [2, "Exploit", "Exploit", "Code ou technique qui tire parti d'une vulnérabilité pour obtenir un effet non autorisé.", "Un script exploitant une faille Apache Struts pour exécuter du code à distance.", "Vulnérabilité = faiblesse ; exploit = moyen de l'utiliser.", "L'arme ne fait rien sans la cible.", "Une exploitation active connue élève la priorité de correction.", "D6 · D7"], [2, "Risque", "Risk", "Possibilité qu'une menace exploite une vulnérabilité et cause un impact sur un actif. Risque = Menace × Vulnérabilité × Impact.", "Ransomware (menace) + absence de sauvegarde hors ligne (vulnérabilité) + arrêt de la facturation (impact).", "Sans actif, menace ou vulnérabilité, il n'y a pas de risque.", "Pas de feu sans combustible, comburant et étincelle.", "Pas de contrôle sans risque identifié, pas de risque sans propriétaire.", "D1"], [2, "Exposition", "Exposure", "Situation dans laquelle un actif peut subir une perte du fait d'une menace.", "Un serveur de base de données exposé sur Internet.", "L'exposition est souvent mesurée par le facteur d'exposition (EF) en analyse quantitative.", "Ce qui est à découvert attire la pluie.", "EF = pourcentage de la valeur de l'actif perdu lors d'un incident.", "D1"], [2, "Impact", "Impact", "Conséquence d'un incident : financière, opérationnelle, juridique, réputationnelle, humaine.", "Amende du régulateur, perte de clients, arrêt de production.", "L'impact se mesure dans le temps : il grandit avec la durée d'interruption.", "Le coût d'une crise se paie longtemps après.", "Le BIA mesure l'impact d'une interruption heure par heure.", "D1 · D7"], [2, "Vraisemblance", "Likelihood", "Probabilité qu'un scénario de risque se réalise sur une période donnée.", "Une attaque de phishing est très probable ; un séisme à Abidjan l'est peu.", "Vraisemblance qualitative (faible, moyenne, élevée) ou quantitative (ARO).", "L'improbable n'est pas l'impossible.", "ARO = nombre d'occurrences attendues par an.", "D1"], [2, "Surface d'attaque", "Attack surface", "Ensemble des points par lesquels un attaquant peut tenter d'entrer ou d'extraire des données.", "Ports ouverts, API publiques, comptes, employés, fournisseurs.", "Réduire la surface d'attaque est souvent plus efficace qu'ajouter des contrôles.", "Moins de portes, moins de gardes.", "Désactiver les services inutiles relève du durcissement (hardening).", "D3 · D4"], [3, "Moindre privilège", "Least privilege", "Chacun ne reçoit que les droits strictement nécessaires à sa fonction, pour la durée nécessaire.", "Un comptable n'est pas administrateur de son poste.", "Trop restreindre pousse au contournement : prévoir un processus d'exception.", "On ne donne pas toutes les clés au gardien du portail.", "S'applique aussi aux programmes, comptes de service et processus.", "D5 · D7"], [3, "Besoin d'en connaître", "Need to know", "Accès limité aux seules informations nécessaires à la mission, même avec l'habilitation suffisante.", "Un agent habilité « Secret » n'accède qu'aux dossiers de son projet.", "Moindre privilège = droits ; besoin d'en connaître = informations.", "Savoir plus que nécessaire, c'est porter plus que nécessaire.", "Dans un système MAC, l'habilitation ne suffit pas : il faut aussi le besoin d'en connaître.", "D5 · D7"], [3, "Défense en profondeur", "Defense in depth", "Superposer des contrôles de natures différentes pour qu'une défaillance n'ouvre pas tout.", "MFA, EDR, segmentation et sauvegardes immuables contre un même ransomware.", "Empiler sans cohérence crée de la complexité, donc des failles.", "Plusieurs murs valent mieux qu'un rempart.", "Synonyme fréquent à l'examen : layering (protection en couches).", "D3"], [3, "Séparation des tâches", "Separation (segregation) of duties", "Aucune personne seule ne réalise une opération sensible de bout en bout.", "Celui qui crée un fournisseur ne valide pas son paiement.", "Risque résiduel : la collusion.", "Celui qui compte l'argent ne tient pas la caisse.", "Complétée par la rotation des postes et les congés obligatoires.", "D1 · D5 · D7"], [3, "Sécurité par défaut", "Secure by default", "Les produits et systèmes sont livrés avec les réglages les plus sûrs activés.", "Comptes créés désactivés, ports fermés, mots de passe par défaut interdits.", "La sécurité par défaut doit rester utilisable, sinon elle est désactivée.", "Ce qui est sûr au départ le reste plus facilement.", "Associée à security by design et privacy by default.", "D3 · D8"], [3, "Défaillance sécurisée", "Fail secure / Fail safe", "En cas de panne, le système se met dans un état sûr. Fail secure protège les actifs (verrouille) ; fail safe protège les personnes (déverrouille).", "Une porte de salle serveurs reste verrouillée en coupure ; une issue de secours s'ouvre en cas d'incendie.", "Quand des vies sont en jeu, fail safe l'emporte toujours.", "Une panne ne doit pas devenir une porte ouverte.", "Une erreur applicative doit refuser l'accès, jamais l'accorder.", "D3 · D7 · D8"], [3, "Économie des mécanismes", "Economy of mechanism (Keep it simple)", "Un mécanisme simple est plus facile à comprendre, tester et sécuriser.", "Réduire 1 200 règles de pare-feu à 300 règles documentées.", "Simplifier demande du temps et du courage politique.", "La complexité est l'ennemie de la sécurité.", "Fait partie des principes de Saltzer et Schroeder.", "D3"], [3, "Conception ouverte", "Open design", "La sécurité ne doit pas dépendre du secret de la conception, mais du secret des clés (principe de Kerckhoffs).", "Utiliser AES, public et éprouvé, plutôt qu'un algorithme maison secret.", "L'obscurité peut ajouter une couche, jamais être la seule protection.", "Ce qui ne survit qu'au secret ne survit pas longtemps.", "La « sécurité par l'obscurité » n'est jamais la bonne réponse.", "D3"], [3, "Zero Trust", "Zero Trust", "Aucune confiance implicite liée à la position réseau : chaque requête est authentifiée, autorisée et vérifiée en continu.", "Accès à une application conditionné à l'identité, au MFA et à l'état du poste.", "C'est une démarche progressive (NIST SP 800-207), pas un produit.", "Faire confiance, c'est bien ; vérifier, c'est mieux.", "Mots-clés : never trust, always verify, assume breach, least privilege.", "D3 · D4 · D5"], [3, "Partir du principe de la compromission", "Assume breach", "On conçoit en supposant que l'attaquant est déjà à l'intérieur : détection, confinement et reprise sont prévus.", "Segmentation interne, surveillance des comportements, exercices de crise.", "Ne justifie pas d'abandonner la prévention.", "Ce n'est pas « si », c'est « quand ».", "Une réponse qui ne mise que sur la prévention est incomplète.", "D7"], [4, "Contrôle de sécurité", "Security control", "Toute mesure qui réduit un risque : politique, technologie, dispositif physique ou processus.", "Une politique d'accès, un pare-feu, un badge, une revue mensuelle.", "Un contrôle doit être proportionné au risque et à la valeur de l'actif.", "Un outil sans méthode est un jouet coûteux.", "On classe un contrôle à la fois par type et par fonction.", "D1"], [4, "Mesure préventive et contre-mesure", "Safeguard vs Countermeasure", "Le safeguard est mis en place avant l'incident ; la contre-mesure répond à une menace identifiée ou en cours.", "Une politique de sauvegarde (safeguard) ; le blocage d'une IP attaquante (contre-mesure).", "Les deux termes sont souvent employés comme synonymes.", "Prévoir n'empêche pas de réagir.", "Dans les questions, « countermeasure » désigne souvent tout contrôle.", "D1"], [4, "Contrôle administratif", "Administrative (managerial) control", "Contrôle fondé sur des règles et des processus : politiques, procédures, formation, vérifications.", "Politique de mots de passe, vérification des antécédents à l'embauche.", "Sans application et contrôle, il reste lettre morte.", "Une règle sans contrôle n'est qu'un souhait.", "Aussi appelé contrôle de gestion (managerial).", "D1"], [4, "Contrôle technique", "Technical (logical) control", "Contrôle mis en œuvre par la technologie : logiciels, matériels, configurations.", "Pare-feu, chiffrement, MFA, EDR.", "Il dépend des personnes qui le configurent et le surveillent.", "La machine applique ce que l'humain a pensé.", "Aussi appelé contrôle logique.", "D3 · D4 · D5"], [4, "Contrôle physique", "Physical control", "Contrôle qui protège les lieux et le matériel.", "Clôture, badge, sas, caméra, gardien.", "Sans sécurité physique, aucune sécurité logique ne tient.", "Le mur arrête le passant, pas le déterminé.", "Ordre classique : dissuader, retarder, détecter, évaluer, réagir.", "D3 · D7"], [4, "Contrôle préventif", "Preventive control", "Empêche l'incident de se produire.", "Serrure, MFA, séparation des tâches.", "Aucun contrôle préventif n'est infaillible : il faut aussi détecter.", "Mieux vaut prévenir que guérir.", "Les contrôles préventifs sont généralement privilégiés en premier.", "D1"], [4, "Contrôle détectif", "Detective control", "Identifie qu'un incident a eu lieu ou est en cours.", "Caméra, IDS, revue des journaux, congés obligatoires.", "Un contrôle détectif sans réaction ne sert à rien.", "La sentinelle qui dort ne protège pas le camp.", "La rotation des postes est aussi un contrôle détectif.", "D6 · D7"], [4, "Contrôle correctif", "Corrective control", "Limite les dégâts et corrige après un incident.", "Antivirus qui met en quarantaine, correctif appliqué après une faille.", "Correctif (réparer le système) ≠ récupération (restaurer l'activité).", "Réparer vite évite de payer longtemps.", "Récupération : sauvegardes, site de secours.", "D7"], [4, "Contrôle dissuasif", "Deterrent control", "Décourage l'attaquant de passer à l'acte.", "Panneau « site sous vidéosurveillance », bannière de connexion légale.", "Il n'arrête pas un attaquant déterminé.", "La peur du gendarme fait l'honnête homme.", "Une bannière de connexion aide aussi aux poursuites.", "D1 · D3"], [4, "Contrôle compensatoire", "Compensating control", "Alternative au contrôle requis quand celui-ci est impossible, avec une efficacité comparable.", "Journalisation et revue mensuelle à la place d'une séparation des tâches dans une petite équipe.", "Il doit être justifié, documenté et réévalué.", "Quand on ne peut pas fermer la porte, on surveille le couloir.", "D'autres fonctions existent : directif (consigne) et de récupération.", "D1"], [5, "Gouvernance de la sécurité", "Security governance", "Ensemble des responsabilités et pratiques de la direction pour orienter la sécurité, fixer l'appétit pour le risque et superviser les résultats.", "Un comité trimestriel présidé par la direction générale valide la feuille de route sécurité.", "Gouvernance = diriger et superviser ; management = planifier et exécuter.", "L'eau descend de la montagne.", "Le facteur de succès n°1 est le soutien de la haute direction.", "D1"], [5, "Haute direction", "Senior management", "Les dirigeants qui portent la responsabilité ultime de la sécurité et acceptent le risque résiduel.", "La DG signe la PSSI et l'acceptation des risques majeurs.", "Ils délèguent l'exécution, jamais la responsabilité.", "Qui signe, assume.", "« Qui est responsable en dernier ressort ? » : la haute direction.", "D1"], [5, "RSSI / CISO", "Chief Information Security Officer", "Responsable du programme de sécurité : il conseille la direction, pilote les risques et coordonne les équipes.", "Le CISO présente les KRI au comité d'audit.", "Il conseille et pilote ; il n'accepte pas seul les risques.", "Le CISO éclaire, la direction déclare.", "Rattacher le CISO hors de la DSI évite les conflits d'intérêts.", "D1"], [5, "People, Process, Technology", "People, Process, Technology (PPT)", "La sécurité repose sur des personnes compétentes, des processus définis et des technologies adaptées, dans cet ordre.", "Un SIEM sans analystes ni procédure de traitement des alertes ne détecte rien d'utile.", "La technologie vient outiller une organisation déjà pensée.", "Un outil sans méthode est un jouet coûteux.", "Méfiez-vous de la réponse « acheter un outil » si une réponse processus est plus fondamentale.", "D1"], [5, "Politique de sécurité", "Security policy", "Document de haut niveau, obligatoire et stable, qui exprime les intentions et engagements de la direction.", "PSSI signée par le DG.", "Une politique trop longue n'est ni lue ni appliquée.", "Une règle sans contrôle n'est qu'un souhait.", "La politique est approuvée par la direction et revue régulièrement.", "D1"], [5, "Norme interne", "Standard", "Exigence obligatoire et précise qui met en œuvre la politique.", "« Tous les disques des portables sont chiffrés en AES-256 ».", "Ne pas confondre avec une norme externe (ISO).", "La précision évite l'interprétation.", "Standard = obligatoire, spécifique, mesurable.", "D1"], [5, "Référence minimale", "Baseline", "Niveau minimal de sécurité ou de configuration obligatoire pour une catégorie de systèmes.", "Baseline CIS appliquée à tous les serveurs Windows.", "On l'adapte par scoping et tailoring.", "Le socle avant les étages.", "Une dérive par rapport à la baseline doit être détectée.", "D1 · D2 · D7"], [5, "Procédure", "Procedure", "Instructions détaillées, étape par éta e.", "Les KRI alertent quand on approche de la tolérance.", "D1"], [6, "Risque inhérent", "Inherent risk", "Niveau de risque avant toute mesure de contrôle.", "Le risque d'un site web exposé, sans aucune protection.", "Sert de point de comparaison pour mesurer l'efficacité des contrôles.", "On mesure le chemin depuis le point de départ.", "Inhérent − effet des contrôles = résiduel.", "D1"], [6, "Risque résiduel", "Residual risk", "Risque restant après la mise en place des contrôles. Il doit être formellement accepté.", "Note signée par la direction pour un système legacy isolé.", "Le risque zéro n'existe pas.", "Le zéro risque est le risque de ne rien faire.", "Il est accepté par le propriétaire ou la direction, jamais par le CISO seul.", "D1"], [6, "Analyse quantitative", "Quantitative risk analysis", "Chiffrage monétaire du risque : SLE = AV × EF ; ALE = SLE × ARO.", "Actif 100 M FCFA, EF 40 %, ARO 0,5 → ALE 20 M FCFA par an.", "Les chiffres reposent sur des estimations : précision souvent illusoire.", "Ce qui se chiffre se défend devant le comité.", "Valeur d'un contrôle = ALE avant − ALE après − coût annuel.", "D1"], [6, "Analyse qualitative", "Qualitative risk analysis", "Évaluation par échelles (faible, moyen, élevé), ateliers et avis d'experts.", "Matrice 5×5 vraisemblance × impact, méthode Delphi.", "Rapide mais subjective ; l'approche hybride combine les deux.", "Mieux vaut une boussole qu'une carte fausse.", "Delphi = avis anonymes et itératifs jusqu'au consensus.", "D1"], [6, "Traitement du risque", "Risk treatment / response", "Quatre options : réduire, transférer, éviter, accepter.", "Assurance (transférer), arrêt d'un service (éviter), MFA (réduire).", "Ignorer ou nier le risque n'est jamais acceptable.", "Ce qu'on ignore finit par nous rattraper.", "On transfère le risque financier, jamais la responsabilité.", "D1"], [6, "Propriétaire du risque", "Risk owner", "Personne responsable d'un risque, qui décide de son traitement et en supporte l'impact.", " utoriser un système : Prepare, Categorize, Select, Implement, Assess, Authorize, Monitor.", "Autorisation d'exploiter (ATO) d'un nouveau système.", "Conçu pour les systèmes fédéraux américains, largement adopté ailleurs.", "Pour chaque système, installer, auditer, autoriser, monitorer.", "L'étape Authorize débouche sur l'ATO signée par un responsable.", "D1"], [8, "NIST SP 800-53", "NIST SP 800-53", "Catalogue de contrôles de sécurité et de vie privée, organisé en familles.", "Sélectionner une baseline faible, modérée ou élevée.", "Catalogue de contrôles, pas une méthode de gestion des risques.", "Le bon outil dans la bonne boîte.", "Utilisé dans l'étape Select du RMF.", "D1 · D2"], [8, "COBIT", "COBIT", "Référentiel de gouvernance et de management des technologies de l'information (ISACA).", "Aligner les objectifs IT sur les objectifs métier.", "Plus orienté gouvernance que contrôles techniques.", "Gouverner, c'est relier la technique au but.", "Associé à l'audit des SI.", "D1"], [8, "ITIL", "ITIL", "Référentiel de bonnes pratiques de gestion des services informatiques : incidents, problèmes, changements, configuration.", "Processus de gestion des changements avec CAB.", "ITIL organise les services ; la sécurité s'y intègre.", "L'ordre au quotidien prépare le calme dans la crise.", "Le vocabulaire de change management de l'examen vient en partie d'ITIL.", "D7"], [8, "CIS Controls", "CIS Critical Security Controls", "Liste priorisée de 18 groupes de contrôles techniques, avec des niveaux de mise en œuvre (IG1 à IG3).", "Une PME commence par l'IG1 : inventaire, configuration sûre, sauvegardes.", "Très opérationnel, moins orienté gouvernance.", "Commence par ce qui protège le plus.", "Les CIS Benchmarks fournissent des baselines de configuration.", "D1 · D7"], [8, "PCI DSS", "Payment Card Industry Data Security Standard", "Norme contractuelle imposée par les réseaux de cartes à toute entité qui traite des données de cartes bancaires.", "Un commerçant en ligne réduit son périmètre en tokenisant les cartes.", "Norme contractuelle, pas une loi.", "Moins on touche aux cartes, moins on porte de risque.", "Les contrôles compensatoires y sont formellement encadrés.", "D1 · D2"], [8, "Common Criteria", "Common Criteria (ISO/IEC 15408)", "Cadre international d'évaluation des produits de sécurité : Protection Profile, Security Target, niveaux EAL1 à EAL7.", "Un pare-feu certifié EAL4+ pour un ministère.", "Un EAL élevé mesure la rigueur de l'évaluation, pas l'absence de failles.", "Le label rassure, la configuration protège.", "PP = besoin ; ST = prétentions du produit ; EAL = profondeur.", "D3"], [9, "Ingénierie sociale", "Social engineering", "Manipulation psychologique pour obtenir une information ou une action : urgence, autorité, confiance, peur.", "Faux appel du « support informatique » demandant un code MFA.", "La technologie seule ne la bloque pas.", "La serrure ne protège pas de celui qui ouvre la porte.", "Meilleure parade : sensibilisation et procédures de vérification.", "D1 · D5"], [9, "Hameçonnage", "Phishing", "Message frauduleux imitant une source de confiance pour voler des identifiants ou installer un malware.", "Faux mail de la banque avec lien vers une page de connexion imitée.", "Spear phishing = ciblé ; whaling = dirigeants ; smishing = SMS ; vishing = voix.", "Un nom connu ne garantit pas l'expéditeur.", "MFA résistant au phishing (FIDO2) et signalement facile.", "D1 · D4 · D5"], [9, "Logiciel malveillant", "Malware", "Programme conçu pour nuire : virus, ver, cheval de Troie, ransomware, rootkit, spyware, bombe logique.", "Un ver se propage seul ; un cheval de Troie se fait passer pour légitime.", "Virus = a besoin d'un hôte ; ver = autonome.", "On goûte l'eau du puits avant de la servir.", "Défenses : EDR, listes d'autorisation, correctifs, moindre privilège.", "D7 · D8"], [9, "Rançongiciel", "Ransomware", "Malware qui chiffre les données et exige une rançon, souvent avec vol préalable (double extorsion).", "Paraly ctifs critiques sous 15 jours.", "Prioriser par risque réel, pas seulement par score CVSS.", "Le toit se répare quand il fait beau.", "Correctif impossible : contrôle compensatoire.", "D6 · D7"], [10, "Journalisation et surveillance", "Logging and monitoring", "Collecter, protéger et analyser les traces pour détecter et enquêter.", "SIEM centralisé, horloges synchronisées, conservation d'un an.", "Tout journaliser noie l'analyse : choisir les événements utiles.", "Les traces racontent l'histoire, encore faut-il les lire.", "Protéger l'intégrité des journaux : l'attaquant cherche à les effacer.", "D6 · D7"], [10, "Incident de sécurité", "Security incident", "Événement qui menace la confidentialité, l'intégrité ou la disponibilité.", "Compromission d'un compte administrateur.", "Tout incident est un événement ; l'inverse est faux.", "On creuse le puits avant d'avoir soif.", "Étapes ISC2 : détection, réponse, atténuation, rapport, reprise, remédiation, leçons apprises.", "D7"], [10, "Continuité d'activité", "Business continuity (BCP)", "Maintenir les activités critiques pendant et après une perturbation, y compris en mode dégradé.", "Procédure manuelle d'encaissement si le système tombe.", "Le PCA est un sujet métier, pas seulement informatique.", "La pirogue a besoin de rameurs, pas seulement d'une coque.", "Le BIA précède la stratégie de continuité.", "D1 · D7"], [10, "Reprise après sinistre", "Disaster recovery (DRP)", "Restaurer les systèmes informatiques après un sinistre selon les objectifs RTO et RPO.", "Bascule sur un site de secours chaud.", "Une sauvegarde ne vaut que si la restauration fonctionne.", "La sauvegarde est un espoir ; la restauration est une preuve.", "Retour au site principal : les applications les moins critiques d'abord.", "D7"], [10, "Sensibilisation, formation, éducation", "Awareness, training, education", "Sensibilisation pour tous, formation pour un rôle, éducation pour un métier.", "Capsules mensuelles de 5 minutes, formation au code sécu <script>(function(){
const d=GD, K=d.code, kKey="gl-known-"+K, rKey="gl-rev-"+K;
const C=d.items.map((x,i)=>({i,n:i+1,th:x[0],fr:x[1],en:x[2],def:x[3],ex:x[4],nu:x[5],sag:x[6],tip:x[7],dom:x[8]}));
C.forEach(c=>c.hay=norm([c.fr,c.en,c.def,c.ex,c.nu,c.tip,c.dom].join(" ")));
const known=new Set(store.get(kKey,[])), rev=new Set(store.get(rKey,[]));
const open=new Set();
const F={q:"",th:"",st:"all",view:"cards"};
const save=()=>{store.set(kKey,[...known]);store.set(rKey,[...rev]);stats()};
const pad=n=>String(n).padStart(3,"0");

document.getElementById("app").innerHTML=`
<section class="hero"><div class="wrap hero-in">
  <div class="eyebrow">Glossaire 360 · Domaine ${d.num}${d.num===0?" · socle transverse":d.num<=8?" · CBK CISSP":" · bonus"}</div>
  <h1><span class="code">${K}</span>${esc(d.name)}</h1>
  <div class="en">${esc(d.en)}</div>
  <p class="pitch">${esc(d.pitch)}</p>
  <div class="stats">
    <div class="stat"><b>${C.length}</b><span>concepts détaillés</span></div>
    <div class="stat"><b id="s-k">0</b><span>concepts connus</span></div>
    <div class="stat"><b id="s-r">0</b><span>à revoir</span></div>
  </div>
  <div class="meter" style="max-width:none;margin:4px 0 0"><i id="s-m"></i></div>
</div></section>
<main class="wrap">
  <div class="gbar">
    <input class="inp" id="q" type="search" placeholder="Chercher un terme, en français ou en anglais…" aria-label="Chercher">
    <select class="sel" id="th" aria-label="Sous-thème"><option value="">Tous les sous-thèmes</option>${d.themes.map((t,k)=>`<option value="${k+1}">${k+1}. ${esc(t)}</option>`).join("")}</select>
    <select class="sel" id="st" aria-label="Progression"><option value="all">Tous les concepts</option><option value="todo">Pas encore connus</option><option value="rev">À revoir</option><option value="known">Connus</option></select>
    <div class="seg" role="group" aria-label="Affichage">
      <button type="button" data-v="cards" aria-pressed="true">Fiches</button><button type="button" data-v="flash" aria-pressed="false">Flashcards</button><button type="button" data-v="az" aria-pressed="false">Liste A–Z</button><button type="button" data-v="test" aria-pressed="false">Auto-test</button>
    </div>
  </div>
  <p class="gcount" id="cnt"></p>
  <div id="view"></div>
  <p class="foot">Votre progression est enregistrée dans ce navigateur. Les termes anglais entre parenthèses sont ceux de l'examen.</p>
</main>`;

function stats(){$("#s-k").textContent=known.size;$("#s-r").textContent=rev.size;$("#s-m").style.width=(known.size/C.length*100)+"%"}
function list(){return C.filter(c=>(!F.q||F.q.split(/\s+/).every(w=>c.hay.includes(w)))&&(!F.th||String(c.th)===F.th)&&
  (F.st==="all"||(F.st==="todo"&&!known.has(c.n))||(F.st==="rev"&&rev.has(c.n))||(F.st==="known"&&known.has(c.n))))}
function card(c){const o=open.has(c.n);
  return `<article class="gc${known.has(c.n)?" known":rev.has(c.n)?" rev":""}" id="c${c.n}" data-n="${c.n}">
  <div class="gc-h"><span class="num">${pad(c.n)}</span><h3>${esc(c.fr)} <span class="enx">(${esc(c.en)})</span></h3>
  <div class="gc-tags">${c.dom.split(" · ").map(x=>`<span class="tag">${x}</span>`).join("")}${known.has(c.n)?`<span class="tag ok">✓ connu</span>`:""}${rev.has(c.n)?`<span class="tag wa">↻ à revoir</span>`:""}</div></div>
  <p class="def">${esc(c.def)}</p>
  ${o?`<div class="gc-more">
    <div class="blk"><h4>Exemple</h4><p>${esc(c.ex)}</p></div>
    <div class="blk nu"><h4>Nuance</h4><p>${esc(c.nu)}</p></div>
    <div class="blk tip"><h4>Tip examen</h4><p>${esc(c.tip)}</p></div>
    <p class="sag">${esc(c.sag)}</p></div>`:""}
  <div class="gc-acts"><button class="lnk" type="button" data-a="open">${o?"Masquer le détail":"Exemple, nuance, sagesse et tip"}</button>
    <span style="flex:1"></span>
    <button class="btn${known.has(c.n)?" primary":""}" type="button" data-a="known">${known.has(c.n)?"✓ Connu":"Je connais"}</button>
    <button class="btn" type="button" data-a="rev">${rev.has(c.n)?"Retirer":"À revoir"}</button></div>
</article>`}
function mark(kind,n){if(kind==="known"){if(known.has(n))known.delete(n);else{known.add(n);rev.delete(n)}}else{if(rev.has(n))rev.delete(n);else{rev.add(n);known.delete(n)}}save()}

let deck=[],pos=0,flip=false;
function render(){
  const L=list();
  $("#cnt").innerHTML=`<b>${L.length}</b> concept${L.length>1?"s":""} sur ${C.length}`;
  const v=$("#view");
  if(F.view==="cards"){
    if(!L.length){v.innerHTML=`<div class="empty">Aucun concept ne correspond.</div>`;return}
    const by=new Map();L.forEach(c=>{if(!by.has(c.th))by.set(c.th,[]);by.get(c.th).push(c)});
    v.innerHTML=[...by].map(([t,cs])=>`<h2 class="th-h"><span class="n">${String(t).padStart(2,"0")}</span>${esc(d.themes[t-1])} <small>${cs.length}</small></h2><div class="gcards">${cs.map(card).join("")}</div>`).join("");
  } else if(F.view==="flash"){
    deck=L.map(c=>c.n);if(pos>=deck.length)pos=0;flash();
  } else if(F.view==="az"){
    const s=L.slice().sort((a,b)=>a.fr.localeCompare(b.fr,"fr"));
    const letters=[...new Set(s.map(c=>norm(c.fr)[0].toUpperCase()))];
    let last="";
    v.innerHTML=`<div class="az-letters">${letters.map(l=>`<a href="#az-${l}">${l}</a>`).join("")}</div><div class="card"><div class="tblw"><table class="az"><thead><tr><th>Terme</th><th>Définition</th></tr></thead><tbody>${s.map(c=>{const l=norm(c.fr)[0].toUpperCase();const head=l!==last?`<tr class="lt" id="az-${l}"><td colspan="2">${l}</td></tr>`:"";last=l;return head+`<tr><td>${esc(c.fr)}<small>${esc(c.en)}</small></td><td>${esc(c.def)}</td></tr>`}).join("")}</tbody></table></div></div>`;
  } else {
    const pool=L.length>=4?L:C;
    const qs=shuffle(pool).slice(0,Math.min(20,pool.length)).map(c=>{const others=shuffle(C.filter(x=>x.n!==c.n)).slice(0,3);
      return {q:"Quel terme correspond à cette définition ? « "+c.def+" »",opts:[c.fr+" ("+c.en+")",...others.map(o=>o.fr+" ("+o.en+")")],a:0,ex:c.tip}});
    v.innerHTML=`<p class="pitch" style="font-size:14px;color:var(--muted);margin:0 0 10px">20 définitions tirées des concepts affichés : retrouvez le bon terme.</p><div class="card quiz" id="qz"></div>`;
    Quiz($("#qz"),qs,{mode:"learn"}).start();
  }
}
function flash(){
  const v=$("#view");
  if(!deck.length){v.innerHTML=`<div class="empty">Aucun concept ne correspond.</div>`;return}
  const c=C[deck[pos]-1];
  v.innerHTML=`<div class="fc" id="fc" tabindex="0" role="button" aria-label="Retourner la carte">
    <div class="eyebrow">${pad(c.n)} · ${esc(d.themes[c.th-1])} · carte ${pos+1} / ${deck.length}${known.has(c.n)?" · ✓ connu":rev.has(c.n)?" · ↻ à revoir":""}</div>
    <div class="t">${esc(c.fr)}<span class="enx">(${esc(c.en)})</span></div>
    ${flip?`<p style="margin:0">${esc(c.def)}</p><div class="blk tip"><h4>Tip examen</h4><p>${esc(c.tip)}</p></div><p class="sag">${esc(c.sag)}</p>`:`<p class="hint">Donnez la définition de tête, puis cliquez pour retourner la carte (ou Espace).</p>`}
  </div>
  <div class="fc-nav"><button class="btn" type="button" data-f="prev">← Précédente</button><button class="btn" type="button" data-f="shuf">Mélanger</button><button class="btn" type="button" data-f="rev">À revoir</button><button class="btn primary" type="button" data-f="known">Je connais</button><button class="btn" type="button" data-f="next">Suivante →</button></div>`;
}
const go=k=>{pos=(pos+k+deck.length)%deck.length;flip=false;flash()};
$("#view").addEventListener("click",e=>{
  if(F.view==="flash"){
    if(e.target.closest("#fc")){flip=!flip;flash();return}
    const b=e.target.closest("[data-f]");if(!b||!deck.length)return;const f=b.dataset.f,n=deck[pos];
    if(f==="next")go(1);else if(f==="prev")go(-1);else if(f==="shuf"){deck=shuffle(deck);pos=0;flip=false;flash()}
    else{if(f==="known"){known.add(n);rev.delete(n)}else{rev.add(n);known.delete(n)}save();go(1)}
    return}
  if(F.view!=="cards")return;
  const el=e.target.closest(".gc");if(!el)return;const n=+el.dataset.n;const a=e.target.closest("[data-a]");if(!a)return;
  if(a.dataset.a==="open"){open.has(n)?open.delete(n):open.add(n)}else mark(a.dataset.a,n);
  e.target.closest(".gc").outerHTML=card(C[n-1]);
});
document.addEventListener("keydown",e=>{if(F.view!=="flash"||/INPUT|SELECT/.test(document.activeElement.tagName))return;
  if(e.key===" "){e.preventDefault();flip=!flip;flash()}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1)});
$("#q").addEventListener("input",e=>{F.q=norm(e.target.value.trim());render()});
$("#th").addEventListener("change",e=>{F.th=e.target.value;render()});
$("#st").addEventListener("change",e=>{F.st=e.target.value;render()});
$$(".seg button").forEach(b=>b.addEventListener("click",()=>{F.view=b.dataset.v;$$(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));pos=0;flip=false;render()}));

stats();
const h=location.hash.match(/^#c(\d+)$/);
if(h&&C[+h[1]-1]){open.add(+h[1]);render();const el=$("#c"+h[1]);if(el){el.classList.add("flash-target");el.scrollIntoView({block:"center"})}}
else{open.add(1);render()}
})();
</script>
</body></html>

<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Glossaire D1 · Sécurité et gestion des risques</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap">
<style>/* Layout : portail de révision — barre de navigation fixe, en-tête de domaine, sections empilées avec sommaire */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#101B2B; --muted:#5A6879; --line:#D7DEE7;
  --accent:#1F4E9E; --accent-soft:#E3EBF8; --on-accent:#FFFFFF;
  --ok:#2E7D46; --ok-soft:#E3F2E8; --bad:#B3262F; --bad-soft:#FBE7E8; --warn:#B0680A;
  --hl:#FFF4D6; --hl-ink:#6B4B00;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-quote:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}

/* Barre du portail */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.pbar-in{display:flex;align-items:center;gap:14px;padding-block:9px;overflow-x:auto;scrollbar-width:none}
.pbar-in::-webkit-scrollbar{display:none}
.logo{font-family:var(--f-disp);font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo span{color:var(--accent)}
.pnav{display:flex;gap:4px}
.pnav a{font-family:var(--f-mono);font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);padding:5px 9px;border-radius:6px;white-space:nowrap}
.pnav a:hover{background:var(--sunk);color:var(--ink)}
.pnav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

/* En-tête de page */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero-in{padding-block:26px 18px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.hero h1 .code{color:var(--accent);margin-right:10px}
.en{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pitch{max-width:72ch;margin:0;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.stat{display:flex;flex-direction:column;gap:2px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:150px;text-decoration:none;color:var(--ink)}
.stat b{font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
a.stat:hover{border-color:var(--accent)}
.toc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.toc::-webkit-scrollbar{display:none}
.toc a{font-size:13px;font-weight:500;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)}
.toc a:hover{color:var(--ink);border-color:var(--accent)}

main{padding-block:10px 60px}
.sec{padding-top:34px;scroll-margin-top:60px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h .n{font-family:var(--f-mono);font-size:13px;color:var(--accent);margin-right:8px}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}

/* Objectifs */
.obj{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:8px}
.obj li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.obj b{font-family:var(--f-mono);color:var(--accent);font-size:13px}

/* Concepts */
.concepts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.concept h3{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
.concept h3 i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.concept p{margin:0;font-size:14.5px}

/* Schémas */
.schemas{display:flex;flex-direction:column;gap:14px}
.schema h3{font-size:18px;margin-bottom:12px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 130px;min-width:0;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:7px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.flow .st b{font-family:var(--f-disp);font-size:15px}
.flow .st span{font-size:12.5px;color:var(--muted)}
.flow .ar{align-self:center;color:var(--muted);font-family:var(--f-mono)}
.cycle-back{margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:4px}
.stack .ly{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:14px}
.stack .ly b{font-family:var(--f-disp);font-size:15px}
.stack .ly span{color:var(--muted)}
.note{margin:10px 0 0;font-size:13px;color:var(--hl-ink);background:var(--hl);display:inline-block;padding:4px 10px;border-radius:6px}

/* Tableaux */
.tables{display:flex;flex-direction:column;gap:14px}
.tables h3{font-size:18px;margin-bottom:10px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td:first-child{font-weight:600}

/* Scénarios */
.scens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.scen .sit{margin:0;font-size:14.5px}
.scen .q{margin:0;font-weight:600;font-family:var(--f-disp);font-size:16px;color:var(--accent)}
.scen .ans{background:var(--ok-soft);border-radius:7px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.scen .ans p{margin:0}
.scen .why{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:13.5px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Quiz */
.quiz{max-width:820px}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--muted)}
.qz-prog{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:14px}
.qz-prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qz-q{font-family:var(--f-disp);font-size:20px;font-weight:600;margin:0 0 14px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--bg);border-left:4px solid var(--muted);font-size:14.5px}
.fb.ok{border-left-color:var(--ok)}.fb.ko{border-left-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.qz-end{display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1}
.score small{font-size:18px;color:var(--muted);font-weight:500}
.review{display:flex;flex-direction:column;gap:8px}
.review div{background:var(--bg);border-radius:7px;padding:10px 12px;font-size:14px}
.review b{color:var(--bad)}

/* Glossaire */
.glo-s{max-width:320px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.glo td:first-child{font-family:var(--f-mono);font-size:13px}

/* Checklist */
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-width:820px}
.chk label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14.5px}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;max-width:820px;margin-bottom:10px}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1 1 220px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pager a.next{text-align:right}
.foot{margin-top:30px;font-size:12px;color:var(--muted)}

@media (max-width:760px){
  .hero h1{font-size:26px}
  .concepts,.scens{grid-template-columns:minmax(0,1fr)}
  .stack .ly{grid-template-columns:minmax(0,1fr);gap:2px}
  .flow .ar{display:none}
  .flow .st{flex-basis:100%}
  .stat{min-width:0;flex:1 1 40%}
}
/* Glossaire : barre d'outils, cartes de concepts, flashcards, liste A–Z */
.pnav span.off{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--line);padding:5px 9px;white-space:nowrap}
.gbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:18px}
.gbar .inp,.gbar .sel{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.gbar .inp{flex:1 1 220px;min-width:0}
.gbar .sel{flex:0 1 230px;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:7px 12px;font-size:13.5px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.gcount{font-size:13.5px;color:var(--muted);margin:14px 0 4px}
.gcount b{color:var(--ink)}
.th-h{font-family:var(--f-disp);font-size:20px;font-weight:700;margin:24px 0 10px;display:flex;gap:10px;align-items:baseline}
.th-h .n{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.th-h small{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted)}
.gcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
.gc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:70px}
.gc.known{border-color:var(--ok)}
.gc.rev{border-color:var(--warn)}
.gc.flash-target{box-shadow:0 0 0 3px var(--accent-soft)}
.gc-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.gc-h .num{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.gc-h h3{font-size:18px;font-weight:600;line-height:1.25}
.gc-h h3 .enx{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--accent)}
.gc-tags{grid-column:2;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.wa{background:var(--hl);color:var(--hl-ink)}
.gc .def{margin:0;font-size:14.5px}
.gc-more{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.blk{background:var(--bg);border-radius:7px;padding:8px 11px}
.blk h4{margin:0 0 2px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.blk p{margin:0;font-size:14px}
.blk.tip{background:var(--accent-soft)}.blk.tip h4{color:var(--accent)}
.blk.nu h4{color:var(--warn)}
.sag{margin:0;padding:2px 0 2px 12px;border-left:2px solid var(--accent);font-family:var(--f-quote);font-style:italic;font-size:16px}
.gc-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gc-acts .btn{padding:5px 10px;font-size:13px}
.lnk{border:0;background:none;color:var(--accent);font-size:13px;padding:0;text-decoration:underline}
.fc{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:12px;padding:26px;min-height:320px;display:flex;flex-direction:column;gap:12px;cursor:pointer;max-width:780px}
.fc .t{font-family:var(--f-disp);font-size:28px;font-weight:700;line-height:1.15;text-wrap:balance}
.fc .t .enx{display:block;font-family:var(--f-body);font-size:16px;font-weight:500;color:var(--accent);margin-top:4px}
.fc .hint{margin-top:auto;font-size:13px;color:var(--muted)}
.fc-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;max-width:780px;justify-content:center}
.az-letters{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}
.az-letters a{font-family:var(--f-mono);font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:5px;padding:3px 8px;background:var(--surface)}
.az td:first-child{white-space:normal;min-width:200px}
.az td:first-child small{display:block;font-family:var(--f-mono);font-weight:500;color:var(--accent);font-size:12px}
.az tr.lt td{background:var(--bg);font-family:var(--f-disp);font-size:18px;font-weight:700;color:var(--accent)}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
/* Accueil du glossaire */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:10px}
.dt{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:150px}
a.dt:hover{border-color:var(--accent)}
.dt .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dt .cd{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--accent)}
.dt h3{font-size:17px;font-weight:600}
.dt p{margin:0;font-size:13px;color:var(--muted)}
.dt .pg{margin-top:auto;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.dt .pg i{display:block;height:100%;background:var(--ok)}
.dt.soon{background:transparent;border-style:dashed}
.dt.soon h3{color:var(--muted)}
.st-ok{font-size:11px;font-family:var(--f-mono);color:var(--ok);background:var(--ok-soft);padding:1px 7px;border-radius:999px}
.st-soon{font-size:11px;font-family:var(--f-mono);color:var(--muted);background:var(--sunk);padding:1px 7px;border-radius:999px}
.grp{font-family:var(--f-disp);font-size:16px;font-weight:600;color:var(--muted);margin:20px 0 8px}
.res{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.res a{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px}
.res a:hover{border-color:var(--accent)}
.res a b{font-family:var(--f-mono);color:var(--accent);font-size:12px}
.res a span small{color:var(--accent);font-weight:500}
.res a span em{display:block;font-style:normal;color:var(--muted);font-size:13px}
@media (max-width:760px){.gcards{grid-template-columns:minmax(0,1fr)}.fc{padding:20px 18px}.fc .t{font-size:23px}}
</style>

<script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const LETTERS="ABCD";

/* Moteur de quiz : mode « learn » (correction immédiate) ou « exam » (correction à la fin) */
function Quiz(el,questions,cfg){
  cfg=cfg||{};
  let qs,i,ans,timer,deadline;
  function start(list){
    qs=(list||questions).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:shuffle(q.opts.map((t,k)=>({t,ok:k===q.a})))}));
    i=0;ans=[];
    clearInterval(timer);
    if(cfg.minutes){deadline=Date.now()+cfg.minutes*60000;timer=setInterval(tick,1000)}
    render();
  }
  function tick(){const r=deadline-Date.now();const t=el.querySelector(".qz-time");if(t)t.textContent=fmt(r);if(r<=0){clearInterval(timer);finish(true)}}
  const fmt=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,"0")}`};
  function render(){
    if(i>=qs.length)return finish(false);
    const q=qs[i],a=ans[i],good=ans.filter(x=>x&&x.ok).length;
    el.innerHTML=`<div class="qz-top"><span>Question <b>${i+1}</b> / ${qs.length}${q.d&&cfg.showDom?` · <span class="en">${q.d}</span>`:""}</span>
      <span>${cfg.mode==="exam"?(cfg.minutes?`Temps restant <b class="qz-time">${fmt(deadline-Date.now())}</b>`:""):`Score <b>${good}</b> / ${ans.filter(Boolean).length}`}</span></div>
      <div class="qz-prog"><i style="width:${i/qs.length*100}%"></i></div>
      <p class="qz-q">${esc(q.q)}</p>
      <div class="opts">${q.opts.map((o,k)=>{
        let cls="opt";
        if(a){ if(cfg.mode==="exam"){if(a.k===k)cls+=" picked"} else {if(o.ok)cls+=" good";else if(a.k===k)cls+=" wrong"} }
        return `<button class="${cls}" type="button" data-k="${k}"${a&&cfg.mode!=="exam"?" disabled":""}><span class="k">${LETTERS[k]}</span><span>${esc(o.t)}</span></button>`}).join("")}</div>
      ${a&&cfg.mode!=="exam"?`<div class="fb ${a.ok?"ok":"ko"}"><b>${a.ok?"Bonne réponse.":"Pas tout à fait."}</b>${esc(q.ex)}</div>`:""}
      <div class="row" style="margin-top:14px">
        ${cfg.mode==="exam"?`<button class="btn primary" type="button" data-nav="next"${a?"":" disabled"}>${i+1<qs.length?"Valider et continuer":"Terminer l'examen"}</button><button class="btn" type="button" data-nav="stop">Arrêter et voir le résultat</button>`
          :`${a?`<button class="btn primary" type="button" data-nav="next">${i+1<qs.length?"Question suivante":"Voir mon score"}</button>`:""}`}
      </div>`;
  }
  el.addEventListener("click",e=>{
    const o=e.target.closest(".opt");
    if(o&&!o.disabled&&i<qs.length){const k=+o.dataset.k;if(cfg.mode!=="exam"&&ans[i])return;ans[i]={k,ok:qs[i].opts[k].ok};render();return}
    const n=e.target.closest("[data-nav]");if(!n||n.disabled)return;
    if(n.dataset.nav==="next"){i++;render()}
    else if(n.dataset.nav==="stop")finish(false);
    else if(n.dataset.nav==="again")start();
    else if(n.dataset.nav==="errors"){const wrong=qs.filter((q,k)=>!ans[k]||!ans[k].ok).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:q.opts.map(o=>o.t),a:q.opts.findIndex(o=>o.ok)}));start(wrong)}
  });
  function finish(timeout){
    clearInterval(timer);
    const total=qs.length,good=qs.filter((q,k)=>ans[k]&&ans[k].ok).length,pct=Math.round(good/total*100);
    const per={};qs.forEach((q,k)=>{if(!q.d)return;per[q.d]=per[q.d]||[0,0];per[q.d][1]++;if(ans[k]&&ans[k].ok)per[q.d][0]++});
    if(cfg.onDone)cfg.onDone({pct,good,total,per});
    const wrong=qs.map((q,k)=>({q,a:ans[k]})).filter(x=>!x.a||!x.a.ok);
    el.innerHTML=`<div class="qz-end">
      ${timeout?`<p class="note">Temps écoulé : les questions sans réponse comptent comme fausses.</p>`:""}
      <div class="score">${pct} %<small> · ${good} / ${total} bonnes réponses</small></div>
      <p style="margin:0">${pct>=80?"Excellent niveau : vous êtes prêt sur ce périmètre.":pct>=70?"Bon niveau, proche du seuil de réussite. Revoyez les erreurs ci-dessous.":"Niveau à consolider : relisez les concepts et les fiches, puis recommencez."}</p>
      ${Object.keys(per).length>1?`<div class="tblw"><table><thead><tr><th>Domaine</th><th>Score</th></tr></thead><tbody>${Object.keys(per).sort().map(d=>`<tr><td>${d}</td><td>${per[d][0]} / ${per[d][1]} (${Math.round(per[d][0]/per[d][1]*100)} %)</td></tr>`).join("")}</tbody></table></div>`:""}
      <div class="row"><button class="btn primary" type="button" data-nav="again">Recommencer</button>${wrong.length?`<button class="btn" type="button" data-nav="errors">Refaire seulement mes ${wrong.length} erreur${wrong.length>1?"s":""}</button>`:""}</div>
      ${wrong.length?`<h3 style="font-size:17px;margin-top:6px">Correction des erreurs</h3><div class="review">${wrong.map(x=>`<div><p style="margin:0 0 4px;font-weight:600">${esc(x.q.q)}</p><p style="margin:0">Bonne réponse : <strong>${esc(x.q.opts.find(o=>o.ok).t)}</strong>${x.a?` · votre réponse : <b>${esc(x.q.opts[x.a.k].t)}</b>`:" · sans réponse"}</p><p style="margin:4px 0 0;color:var(--muted)">${esc(x.q.ex)}</p></div>`).join("")}</div>`:""}
    </div>`;
  }
  return {start};
}
</script>
<script>const GD={"code": "D1", "num": 1, "name": "Sécurité et gestion des risques", "en": "Security and Risk Management", "pitch": "Le domaine le plus lourd (16 %) et la clé du raisonnement CISSP : éthique, gouvernance, documentation, risques, droit, continuité et sécurité du personnel.", "themes": ["Éthique professionnelle", "Gouvernance et organisation", "Documentation de sécurité", "Analyse des risques", "Traitement et pilotage des risques", "Modélisation des menaces", "Droit et réglementation", "Propriété intellectuelle et enquêtes", "Continuité d'activité", "Personnel, tiers et sensibilisation"], "items": [[1, "Canon 1 : protéger la société", "Protect society, the common good, necessary public trust and confidence, and the infrastructure", "Premier canon du code (ISC)² : le professionnel protège la société, le bien commun et la confiance du public avant toute autre considération.", "Signaler une faille qui menace un service public même si l'employeur préférerait se taire.", "C'est le canon prioritaire en cas de conflit avec les autres.", "Le bien de tous passe avant l'intérêt d'un seul.", "Si une réponse sert la société contre l'employeur, elle l'emporte souvent.", "D1"], [1, "Canon 2 : agir honorablement", "Act honorably, honestly, justly, responsibly, and legally", "Le professionnel agit avec honnêteté, justice, responsabilité et dans le respect de la loi.", "Refuser de falsifier un rapport d'audit.", "L'honnêteté envers le client n'autorise pas à enfreindre la loi.", "L'intégrité, c'est faire juste même quand personne ne regarde.", "Ne jamais choisir une réponse qui implique un mensonge ou une illégalité.", "D1"], [1, "Canon 3 : servir les mandants", "Provide diligent and competent service to principals", "Le professionnel rend un service diligent et compétent à ses employeurs et clients.", "Refuser une mission hors de ses compétences ou la confier à un expert.", "Ce canon passe après la société et l'honnêteté.", "Promettre peu, livrer bien.", "Les mandants nnaire.", "Il faut le déclarer, même s'il n'a pas encore influencé la décision.", "On ne sert pas deux maîtres rivaux.", "La bonne réponse consiste à divulguer le conflit et se retirer de la décision.", "D1"], [1, "Lanceur d'alerte", "Whistleblowing", "Signalement de bonne foi d'un acte illégal ou dangereux, avec protection contre les représailles.", "Ligne éthique anonyme pour signaler une fraude.", "Le canal interne est privilégié avant le canal externe lorsque c'est possible.", "La vérité dite tôt coûte moins cher.", "Un dispositif d'alerte est un contrôle détectif.", "D1"], [1, "Responsabilité professionnelle", "Professional accountability", "Le professionnel répond de ses décisions et de leurs conséquences.", "Le CISO documente son avis défavorable sur une mise en production.", "Être responsable de son avis ne signifie pas décider à la place de la direction.", "Ce qui n'est pas écrit n'a pas été dit.", "Documenter et escalader est la réponse attendue face à un risque critique ignoré.", "D1"], [2, "Conseil d'administration", "Board of directors", "Organe qui supervise la direction et fixe les orientations stratégiques, y compris l'appétit pour le risque cyber.", "Le conseil reçoit chaque trimestre un tableau de bord des risques cyber.", "Il supervise ; il ne gère pas les opérations de sécurité.", "Le gouvernail ne rame pas, il dirige.", "La cybersécurité est un risque d'entreprise porté jusqu'au conseil.", "D1"], [2, "Comité de pilotage sécurité", "Security steering committee", "Instance de direction qui arbitre les priorités, budgets et risques de sécurité.", "Comité trimestriel réunissant DG, DSI, CISO, juridique et métiers.", "Sans décideurs métier autour de la table, il devient un comité technique.", "Décider ensemble, c'est porter ensemble.", "Il assure l'alignement entre sécurité et objectifs métier.", "D1"], [2, "Comité d'audit", "Audit committee", "Comité du conseil qui supervise l'audit interne, le contrôle interne et la gestion des risques.", "L'audit interne présente ses constats sécurité au comité d'audit.", "L'audit doit lui rendre compte pour rester indépendant.", "On ne se juge pas soi-même.", "L'indépendance de l'audit passe par ce rattachement.", "D1 · D6"], [2, "Positionnement de la fonction sécurité", "Security function placement", "Rattachement hiérarchique de la sécurité, idéalement indépendant de la DSI pour éviter les conflits d'intérêts.", "Le CISO rapporte au directeur des risques ou au DG.", "Un rattachement à la DSI reste courant, mais l'indépendance doit être garantie.", "Le contrôleur ne dépend pas du contrôlé.", "Une sécurité sous la DSI peut voir ses alertes filtrées.", "D1"], [2, "Plan stratégique", "Strategic plan", "Plan à long terme (3 à 5 ans) qui aligne la sécurité sur la mission et la stratégie.", "Feuille de route vers le Zero Trust sur 3 ans.", "Il doit être revu chaque année.", "Sans cap, aucun vent n'est favorable.", "Stratégique = long terme ; tactique = moyen ; opérationnel = court.", "D1"], [2, "Plan tactique", "Tactical plan", "Plan à moyen terme (environ un an) qui décline le plan stratégique en projets.", "Projet de déploiement du MFA dans l'année.", "Il fait le lien entre vision et action.", "Le chemin se trace par étapes.", "Exemples : plan de formation annuel, plan de recrutement.", "D1"], [2, "Plan opérationnel", "Operational plan", "Plan à court terme, très détaillé, mis à jour souvent.", "Planning mensuel des campagnes de correctifs.", "Il dépend des plans tactique et stratégique.", "Le pas d'aujourd'hui fait la route de demain.", "Il contient ressources, échéances et procédures.", "D1"], [2, "Charte du programme de sécurité", "Security program charter", "Document qui établit le mandat, le périmètre, l'autorité et les responsabilités de la fonction sécurité.", "Charte signée par le DG donnant au CISO l'autorité de suspendre un accès à risque.", "Sans charte, l'autorité du CISO est contestable.", "L'autorité se donne par écrit.", "Elle formalise le soutien de la direction.", "D1"], [2, "Fusions et acquisitions", "Mergers and acquisitions (M&A)", "Opération où deux organisations se rapprochent ; la sécurité doit évaluer les risques avant et pendant l'intégration.", "Audit de sécurité de la cible avant le rachat.", "Le risque de la cible devient le vôtre dès la signature.", "On n'achète pas la maison sans visiter la cave.", "La due diligence sécurité précède la connexion des réseaux.", "D1"], [2, "Cession", "Divestiture", "Vente ou séparation d'une activité ; il faut séparer données, accès et systèmes proprement.", "Retirer les accès des équipes cédées et transférer uniquement leurs données.", "Les comptes et données oubliés deviennent des fuites.", "On ferme la porte quand l'invité sort.", "Désapprovisionner les accès et assainir les supports.", "D1 · D2"], [3, "Politique réglementaire", "Regulatory policy", "Politique imposée pour satisfaire une loi ou une réglementation.", "Politique de conservation des données comptables pendant 10 ans.", "Son contenu n'est pas négociable en interne.", "La loi ne se discute pas, elle s'applique.", "Les trois types de politiques : réglementaire, consultative, informative.", "D1"], [3, "Politique consultative", "Advisory policy", "Politique qui décrit les comportements attendus et les conséquences en cas de manquement.", "Politique d'usage d'Internet avec sanctions prévues.", "Malgré son nom, elle s'applique et peut être sanctionnée.", "La règle prévenue protège mieux que la règle surprise.", "C'est le type le plus courant en entreprise.", "D1"], [3, "Politique informative", "Informative policy", "Politique qui informe ou éduque, sans obligation de comportement particulière.", "Note expliquant les objectifs de la sécurité de l'entreprise.", "Elle n'est pas contraignante.", "Informer, c'est déjà protéger.", "Elle soutient la sensibilisation.", "D1"], [3, "Politique organisationnelle", "Organizational (program) policy", "Politique générale qui établit le programme de sécurité, ses objectifs et ses responsabilités.", "PSSI de l'entreprise signée par le DG.", "Elle reste stable et de haut niveau.", "Le tronc porte les branches.", "Elle donne autorité au programme de sécurité.", "D1"], [3, "Politique thématique", "Issue-specific policy", "Politique consacrée à un sujet précis.", "Politique BYOD, politique de messagerie, politique cloud.", "Elle évolue plus souvent que la politique générale.", "Chaque sujet mérite sa règle claire.", "Exemples typiques d'examen : e-mail, Internet, BYOD.", "D1"], [3, "Politique spécifique à un système", "System-specific policy", "Politique qui fixe les règles de sécurité d'un système donné.", "Règles d'accès et de configuration du système de paie.", "Elle est très technique et détaillée.", "Chaque coffre a sa combinaison.", "Souvent proche d'une norme technique.", "D1"], [3, "Politique d'usage acceptable", "Acceptable use policy (AUP)", "Règles d'utilisation des ressources informatiques de l'organisation par les utilisateurs.", "Interdiction d'installer des logiciels non approuvés.", "Elle doit être signée et rappelée régulièrement.", "La règle connue évite la faute innocente.", "Faire signer l'AUP soutient les sanctions ultérieures.", "D1"], [3, "Déclaration d'applicabilité", "Statement of Applicability (SoA)", "Document ISO 27001 qui liste les mesures retenues ou exclues et justifie chaque choix.", "L'entreprise exclut les mesures de développement car elle n'en fait pas.", "Chaque exclusion doit être justifiée.", "Dire ce qu'on fait et pourquoi.", "Pièce centrale de la certification ISO 27001.", "D1"], [3, "Exception à la politique", "Policy exception / waiver", "Dérogation temporaire, approuvée et documentée, à une exigence de la politique.", "Un système industriel exempté de correctifs mensuels, avec isolement compensatoire.", "Une exception doit avoir une date d'expiration et un propriétaire.", "Une exception permanente est une politique cachée.", "Exception = acceptation de risque formelle.", "D1"], [3, "Revue des politiques", e attendue : ALE = SLE × ARO.", "SLE 50 M × ARO 0,1 = ALE 5 M FCFA par an.", "Elle permet de comparer au coût annuel d'un contrôle.", "Ce qui se chiffre se défend.", "ALE = SLE × ARO = AV × EF × ARO.", "D1"], [4, "Valeur d'une contre-mesure", "Safeguard value", "Bénéfice annuel d'un contrôle : ALE avant − ALE après − coût annuel du contrôle.", "20 − 4 − 8 = 8 M FCFA de bénéfice par an.", "Une valeur négative signifie que le contrôle coûte plus qu'il ne protège.", "Le remède ne doit pas coûter plus que le mal.", "Le coût inclut achat, exploitation, maintenance et formation.", "D1"], [4, "Méthode Delphi", "Delphi technique", "Technique qualitative : des experts répondent anonymement en plusieurs tours jusqu'au consensus.", "Estimer la vraisemblance d'une attaque ciblée sans données historiques.", "L'anonymat évite l'influence des personnalités dominantes.", "La sagesse du groupe sans le bruit du groupe.", "Mot-clé : anonyme et itératif.", "D1"], [4, "Matrice des risques", "Risk matrix / heat map", "Grille vraisemblance × impact qui visualise et priorise les risques.", "Matrice 5×5 colorée présentée au comité.", "Simple mais subjective.", "Une image claire vaut un long discours.", "Outil typique de l'analyse qualitative.", "D1"], [4, "Analyse des écarts", "Gap analysis", "Comparaison entre l'état actuel et l'état cible pour identifier les actions à mener.", "Écart entre les pratiques actuelles et ISO 27001.", "Elle n'évalue pas le risque, mais la conformité ou la maturité.", "Savoir où l'on est pour savoir où aller.", "Point de départ d'une feuille de route.", "D1"], [5, "Atténuation du risque", "Risk mitigation / reduction", "Mettre en place des contrôles pour réduire la vraisemblance ou l'impact.", "Déployer le MFA pour réduire le risque de vol d'identifiants.", "On ne supprime jamais le risque, on le réduit.", "Chaque mur ralentit l'attaquant.", "Traitement le plus fréquent.", "D1"], [5, "Transfert du risque", "Risk transfer / sharing", "Faire porter tout ou partie blic.", "Une page de synthèse pour le conseil, un détail pour les équipes.", "Trop de détails empêchent la décision.", "On ne parle pas au chef comme au mécanicien.", "Le langage de la direction : impact financier, réglementaire, réputation.", "D1"], [5, "Modèle de maturité des risques", "Risk maturity model (RMM)", "Échelle qui mesure la maturité du programme de gestion des risques (ad hoc, préliminaire, défini, intégré, optimisé).", "Passer d'une gestion au cas par cas à un processus intégré.", "Le niveau de maturité n'est pas une fin en soi.", "On ne gravit pas la montagne d'un seul bond.", "Les modèles de maturité vont toujours du chaotique à l'optimisé.", "D1"], [5, "Autorisation d'exploiter", "Authorization to operate (ATO)", "Décision formelle d'un responsable d'accepter le risque d'un système et de l'autoriser en production.", "Le directeur signe l'ATO après l'évaluation des contrôles.", "C'est une décision de direction, pas une validation technique.", "La signature vaut engagement.", "Étape Authorize du NIST RMF.", "D1"], [6, "Modélisation des menaces", "Threat modeling", "Démarche structurée pour identifier ce qui peut mal tourner dans un système et comment y répondre.", "Atelier sur l'architecture d'une API de paiement avant le développement.", "Plus elle est faite tôt, moins elle coûte.", "Celui qui prévoit l'orage ne se fait pas surprendre.", "Approche proactive (conception) ou réactive (après incident).", "D1 · D8"], [6, "STRIDE", "STRIDE", "Méthode Microsoft de classement des menaces : usurpation, falsification, répudiation, divulgation, déni de service, élévation de privilèges.", "Analyser chaque flux d'un DFD selon les six catégories.", "Chaque lettre correspond à une propriété de sécurité violée.", "Nommer la menace, c'est déjà la combattre.", "S→authentification, T→intégrité, R→non-répudiation, I→confidentialité, D→disponibilité, E→autorisation.", "D1 · D8"], [6, "PASTA", "Process for Attack Simulation and Threat Analysis", "Méthode en 7 étapes centrée sur le risque métier, de la définition des objectifs à l'analyse des risques et impacts.", "Modéliser les menaces d'une banque en ligne à partir de ses objectifs métier.", "Plus lourde que STRIDE, mais orientée business.", "Partir du but pour trouver la menace.", "PASTA = orientée risque et attaquant.", "D1"], [6, "DREAD", "DREAD", "Système de notation des menaces : dommages, reproductibilité, exploitabilité, utilisateurs affectés, découvrabilité.", "Noter chaque menace de 1 à 10 sur les cinq critères.", "Notation subjective, aujourd'hui moins utilisée.", "Mesurer pour prioriser.", "DREAD sert à prioriser, STRIDE à identifier.", "D1"], [6, "VAST", "Visual, Agile and Simple Threat modeling", "Méthode de modélisation adaptée à l'agile et aux grandes organisations, intégrée aux outils de développement.", "Modélisation automatisée à chaque sprint.", "Conçue pour passer à l'échelle.", "La sécurité suit le rythme du projet.", "Associée au DevOps et à l'agilité.", "D1 · D8"], [6, "Arbre d'attaque", "Attack tree", "Diagramme hiérarchique : l'objectif de l'attaquant à la racine, les moyens d'y parvenir dans les branches.", "Objectif « voler la base clients » décomposé en phishing, injection SQL, initié.", "Il aide à voir les chemins les moins chers pour l'attaquant.", "Chaque branche est une porte à surveiller.", "On peut pondérer les branches par coût ou probabilité.", "D1"], [6, "Diagramme de flux de données", "Data flow diagram (DFD)", "Représentation des processus, stockages, flux et entités externes d'un système.", "DFD d'une application mobile vers une API et une base de données.", "Base de la modélisation STRIDE.", "On ne protège bien que ce que l'on voit.", "Les frontières de confiance s'y tracent.", "D1 · D8"], [6, "Frontière de confiance", "Trust boundary", "Limite où le niveau de confiance change entre deux composants.", "Entre Internet et le serveur web, entre l'application et la base.", "Chaque franchissement exige validation et contrôle.", "À chaque front ôte d'Ivoire, France), droit coutumier, droit religieux, systèmes mixtes.", "La Côte d'Ivoire relève du droit civil codifié.", "Une multinationale doit composer avec plusieurs systèmes.", "Chaque terre a sa loi.", "L'examen cite surtout common law, civil law, customary, religious.", "D1"], [7, "Loi ivoirienne sur les données personnelles", "Law 2013-450 (Côte d'Ivoire)", "Loi relative à la protection des données à caractère personnel, sous le contrôle de l'ARTCI.", "Déclaration d'un traitement de données clients auprès de l'ARTCI.", "Les obligations s'appliquent aussi aux sous-traitants.", "La donnée d'autrui est un dépôt.", "Vérifier l'autorité compétente avant tout traitement.", "D1 · D2"], [7, "Loi ivoirienne sur la cybercriminalité", "Law 2013-451 (Côte d'Ivoire)", "Loi relative à la lutte contre la cybercriminalité : intrusions, fraudes informatiques, atteintes aux données.", "Plainte auprès de la Plateforme de lutte contre la cybercriminalité (PLCC).", "Elle complète le code pénal pour les infractions numériques.", "Le crime numérique reste un crime.", "Préserver les preuves pour une éventuelle procédure.", "D1 · D7"], [7, "RGPD", "General Data Protection Regulation (GDPR)", "Règlement européen de protection des données, applicable dès qu'on traite des données de personnes dans l'UE.", "Une entreprise ivoirienne vendant en ligne à des clients européens.", "Amendes jusqu'à 4 % du chiffre d'affaires mondial ou 20 M€.", "La loi suit la personne, pas le serveur.", "Notification de violation à l'autorité sous 72 heures.", "D1 · D2"], [7, "Convention de Malabo", "African Union Convention on Cyber Security and Personal Data Protection", "Convention de l'Union africaine sur la cybersécurité et la protection des données, entrée en vigueur en 2023.", "Base d'harmonisation des lois nationales africaines.", "Sa mise en œuvre dépend de chaque État.", "Ensemble, on va plus loin.", "Référence continentale pour l'Afrique.", "D1"], [7, "Convention de Budapest", "Budapest Convention on Cybercrime", "Traité du Conseil de l'Europe (2001) qui harmonise la répression de la cybercriminalité et la coopération internationale.", "Demande d'entraide pour obtenir des données hébergées à l'étranger.", "Ouvert aux pays non européens.", "Le crime n'a pas de frontière, la justice doit en avoir moins.", "Premier traité international sur la cybercriminalité.", "D1"], [7, "Contrôles à l'exportation", "Export controls", "Restrictions sur l'exportation de technologies sensibles, dont certains produits de chiffrement.", "Vérifier les licences avant de livrer un logiciel de chiffrement à l'étranger.", "Les règles varient selon les pays (ITAR, EAR, Wassenaar).", "Ce qui protège peut aussi armer.", "L'arrangement de Wassenaar encadre les biens à double usage.", "D1 · D3"], [8, "Brevet", "Patent", "Protection d'une invention nouvelle, inventive et industrielle, en échange de sa publication, pour environ 20 ans.", "Un nouveau procédé de chiffrement matériel.", "La publication révèle l'invention à tous.", "Publier pour protéger.", "Le brevet protège l'idée mise en œuvre, pas le code ligne par ligne.", "D1"], [8, "Droit d'auteur", "Copyright", "Protection automatique des œuvres originales, y compris les logiciels, pendant la vie de l'auteur plus 70 ans en général.", "Le code source d'une application.", "Il protège l'expression, pas l'idée.", "L'œuvre appartient à celui qui la crée.", "Pas besoin d'enregistrement pour être protégé.", "D1"], [8, "Marque", "Trademark", "Signe distinctif (nom, logo, slogan) protégé pour identifier des produits ou services.", "Le nom et le logo d'une banque.", "Renouvelable indéfiniment s'il est utilisé.", "Le nom est une promesse.", "Le typosquatting peut porter atteinte aux marques.", "D1"], [8, "Secret d'affaires", "Trade secret", "Information confidentielle qui procure un avantage concurrentiel et fait l'objet de mesures de protection.", "Une recette, un algorithme de scoring interne.", "Protégé sans limite de durée, mais perdu s'il ils d'un projet demandés par le tribunal.", "Une bonne gestion documentaire réduit fortement son coût.", "Ce qui est bien rangé se retrouve vite.", "Le modèle EDRM commence par la gouvernance de l'information.", "D1 · D7"], [9, "Plan de continuité d'activité", "Business continuity plan (BCP)", "Ensemble des stratégies et procédures pour maintenir les activités critiques pendant une perturbation.", "Fonctionnement dégradé des agences en cas de panne du système central.", "Il couvre les personnes, locaux, fournisseurs, pas seulement l'informatique.", "La pirogue a besoin de rameurs, pas seulement d'une coque.", "Première étape : périmètre et soutien de la direction ; puis BIA.", "D1 · D7"], [9, "Analyse d'impact sur l'activité", "Business impact analysis (BIA)", "Identification des processus critiques et mesure de l'impact de leur interruption dans le temps.", "Le paiement ne tolère que 4 heures d'arrêt, la paie 3 jours.", "Elle est conduite avec les métiers, pas seulement l'IT.", "On sauve d'abord ce qui fait vivre la maison.", "Le BIA précède la stratégie et le plan.", "D1 · D7"], [9, "Durée maximale d'interruption tolérable", "Maximum tolerable downtime (MTD)", "Durée au-delà de laquelle l'interruption cause un dommage grave ou irréversible.", "MTD de 24 h pour la facturation.", "Aussi appelée MTPD ou MAO.", "Chaque activité a son seuil de rupture.", "MTD ≥ RTO + WRT.", "D1 · D7"], [9, "Objectif de délai de reprise", "Recovery time objective (RTO)", "Délai cible pour restaurer un système après une interruption.", "Restaurer la messagerie en 4 heures.", "Plus le RTO est court, plus la solution coûte cher.", "Le temps de reprise a un prix.", "Le RTO doit être inférieur au MTD.", "D1 · D7"], [9, "Objectif de point de reprise", "Recovery point objective (RPO)", "Quantité maximale de données que l'on accepte de perdre, exprimée en temps.", "RPO de 15 minutes : réplication quasi continue.", "Il détermine la fréquence des sauvegardes.", "On compte ce que l'on peut perdre avant de tomber.", "RPO = données ; RTO = temps.", "D1 · D7"], [9, "Temps de reprise du travail", "Work recovery time (WRT)", "Temps nécessaire après la restauration pour vérifier les données et reprendre l'activité.", "Contrôle de cohérence des écritures après restauration.", "Souvent oublié dans les calculs.", "Remettre la machine en marche n'est pas reprendre le travail.", "MTD = RTO + WRT au maximum.", "D1 · D7"], [9, "Fonction métier critique", "Critical business function", "Activité dont l'interruption menace la survie ou les obligations de l'organisation.", "Encaissement, paiement des salaires, production.", "Ce sont les métiers qui la désignent.", "Tout n'est pas vital, mais le vital est tout.", "Le BIA les classe par priorité.", "D1 · D7"], [9, "Point unique de défaillance", "Single point of failure (SPOF)", "Composant dont la panne arrête tout un service.", "Un seul lien Internet, un seul administrateur qui connaît le système.", "Un SPOF peut être humain ou fournisseur.", "Ne mets pas toute ta récolte dans un seul grenier.", "La redondance élimine les SPOF.", "D1 · D7"], [9, "Stratégie de continuité", "Continuity strategy", "Choix des moyens pour atteindre les objectifs du BIA : sites, redondance, procédures manuelles, fournisseurs alternatifs.", "Accord avec un second fournisseur d'énergie.", "Le coût doit être proportionné aux impacts évités.", "Le plan B se prépare avant que le A ne tombe.", "Elle suit le BIA et précède le plan.", "D1 · D7"], [9, "Maintien du plan", "Plan maintenance", "Mise à jour régulière du plan après changements, tests et incidents.", "Mise à jour de l'annuaire de crise à chaque départ.", "Un plan obsolète est dangereux en crise.", "Le plan vit, ou il meurt.", "Revue au moins annuelle.", "D1 · D7"], [10, "Vérification des antécédents", "Background check / pre-employment screening", "Contrôles avant l'embauche : diplômes, références, casier judiciaire si légal.", "Vérification renforcée pour un administrateur système.", "Proportionnée au poste et conforme au droit local.", "On connaît l'hôte avant de lui ouvrir.", "Contrôle préventif administratif.", "D1"], [10, "Accord de confidentialité", "Non-disclosure agreement (NDA)", "Contrat qui interdit de divulguer des informations confidentielles.", "NDA signé par un prestataire avant un audit.", "Il protège juridiquement les secrets d'affaires.", "La parole donnée doit être écrite.", "Il survit souvent à la fin du contrat.", "D1"], [10, "Clause de non-concurrence", "Non-compete agreement", "Engagement de ne pas travailler pour un concurrent pendant une durée et une zone définies.", "Un ingénieur clé s'engage pour 12 mois.", "Sa validité dépend du droit du travail local.", "On ne part pas avec le savoir du maître.", "Complète la protection des secrets d'affaires.", "D1"], [10, "Procédure de départ", "Termination / offboarding", "Retrait des accès, restitution du matériel et rappel des obligations au départ d'un employé.", "Comptes désactivés pendant l'entretien de licenciement.", "Un licenciement hostile exige une coordination étroite avec les RH.", "On ferme la porte quand l'invité sort.", "Retirer les accès avant ou pendant l'entretien et escorter.", "D1 · D5"], [10, "Rotation des postes", "Job rotation", "Changer régulièrement les personnes de poste pour détecter les fraudes et éviter la dépendance.", "Rotation annuelle des opérateurs de trésorerie.", "Exige documentation et formation.", "Le masque tombe quand le porteur change.", "Contrôle détectif et dissuasif.", "D1 · D7"], [10, "Congés obligatoires", "Mandatory vacation", "Imposer des congés consécutifs pour que les irrégularités soient découvertes en l'absence de la personne.", "Deux semaines consécutives pour les traders.", "Contrôle détectif.", "L'absence révèle ce que la présence cachait.", "Typique des métiers financiers.", "D1 · D7"], [10, "Accord de niveau de service", "Service level agreement (SLA)", "Engagement contractuel mesurable d'un fournisseur : disponibilité, délais, pénalités     <input class="inp" id="q" type="search" placeholder="Chercher un terme, en français ou en anglais…" aria-label="Chercher">
    <select class="sel" id="th" aria-label="Sous-thème"><option value="">Tous les sous-thèmes</option>${d.themes.map((t,k)=>`<option value="${k+1}">${k+1}. ${esc(t)}</option>`).join("")}</select>
    <select class="sel" id="st" aria-label="Progression"><option value="all">Tous les concepts</option><option value="todo">Pas encore connus</option><option value="rev">À revoir</option><option value="known">Connus</option></select>
    <div class="seg" role="group" aria-label="Affichage">
      <button type="button" data-v="cards" aria-pressed="true">Fiches</button><button type="button" data-v="flash" aria-pressed="false">Flashcards</button><button type="button" data-v="az" aria-pressed="false">Liste A–Z</button><button type="button" data-v="test" aria-pressed="false">Auto-test</button>
    </div>
  </div>
  <p class="gcount" id="cnt"></p>
  <div id="view"></div>
  <p class="foot">Votre progression est enregistrée dans ce navigateur. Les termes anglais entre parenthèses sont ceux de l'examen.</p>
</main>`;

function stats(){$("#s-k").textContent=known.size;$("#s-r").textContent=rev.size;$("#s-m").style.width=(known.size/C.length*100)+"%"}
function list(){return C.filter(c=>(!F.q||F.q.split(/\s+/).every(w=>c.hay.includes(w)))&&(!F.th||String(c.th)===F.th)&&
  (F.st==="all"||(F.st==="todo"&&!known.has(c.n))||(F.st==="rev"&&rev.has(c.n))||(F.st==="known"&&known.has(c.n))))}
function card(c){const o=open.has(c.n);
  return `<article class="gc${known.has(c.n)?" known":rev.has(c.n)?" rev":""}" id="c${c.n}" data-n="${c.n}">
  <div class="gc-h"><span class="num">${pad(c.n)}</span><h3>${esc(c.fr)} <span class="enx">(${esc(c.en)})</span></h3>
  <div class="gc-tags">${c.dom.split(" · ").map(x=>`<span class="tag">${x}</span>`).join("")}${known.has(c.n)?`<span class="tag ok">✓ connu</span>`:""}${rev.has(c.n)?`<span class="tag wa">↻ à revoir</span>`:""}</div></div>
  <p class="def">${esc(c.def)}</p>
  ${o?`<div class="gc-more">
    <div class="blk"><h4>Exemple</h4><p>${esc(c.ex)}</p></div>
    <div class="blk nu"><h4>Nuance</h4><p>${esc(c.nu)}</p></div>
    <div class="blk tip"><h4>Tip examen</h4><p>${esc(c.tip)}</p></div>
    <p class="sag">${esc(c.sag)}</p></div>`:""}
  <div class="gc-acts"><button class="lnk" type="button" data-a="open">${o?"Masquer le détail":"Exemple, nuance, sagesse et tip"}</button>
    <span style="flex:1"></span>
    <button class="btn${known.has(c.n)?" primary":""}" type="button" data-a="known">${known.has(c.n)?"✓ Connu":"Je connais"}</button>
    <button class="btn" type="button" data-a="rev">${rev.has(c.n)?"Retirer":"À revoir"}</button></div>
</article>`}
function mark(kind,n){if(kind==="known"){if(known.has(n))known.delete(n);else{known.add(n);rev.delete(n)}}else{if(rev.has(n))rev.delete(n);else{rev.add(n);known.delete(n)}}save()}

let deck=[],pos=0,flip=false;
function render(){
  const L=list();
  $("#cnt").innerHTML=`<b>${L.length}</b> concept${L.length>1?"s":""} sur ${C.length}`;
  const v=$("#view");
  if(F.view==="cards"){
    if(!L.length){v.innerHTML=`<div class="empty">Aucun concept ne correspond.</div>`;return}
    const by=new Map();L.forEach(c=>{if(!by.has(c.th))by.set(c.th,[]);by.get(c.th).push(c)});
    v.innerHTML=[...by].map(([t,cs])=>`<h2 class="th-h"><span class="n">${String(t).padStart(2,"0")}</span>${esc(d.themes[t-1])} <small>${cs.length}</small></h2><div class="gcards">${cs.map(card).join("")}</div>`).join("");
  } else if(F.view==="flash"){
    deck=L.map(c=>c.n);if(pos>=deck.length)pos=0;flash();
  } else if(F.view==="az"){
    const s=L.slice().sort((a,b)=>a.fr.localeCompare(b.fr,"fr"));
    const letters=[...new Set(s.map(c=>norm(c.fr)[0].toUpperCase()))];
    let last="";
    v.innerHTML=`<div class="az-letters">${letters.map(l=>`<a href="#az-${l}">${l}</a>`).join("")}</div><div class="card"><div class="tblw"><table class="az"><thead><tr><th>Terme</th><th>Définition</th></tr></thead><tbody>${s.map(c=>{const l=norm(c.fr)[0].toUpperCase();const head=l!==last?`<tr class="lt" id="az-${l}"><td colspan="2">${l}</td></tr>`:"";last=l;return head+`<tr><td>${esc(c.fr)}<small>${esc(c.en)}</small></td><td>${esc(c.def)}</td></tr>`}).join("")}</tbody></table></div></div>`;
  } else {
    const pool=L.length>=4?L:C;
    const qs=shuffle(pool).slice(0,Math.min(20,pool.length)).map(c=>{const others=shuffle(C.filter(x=>x.n!==c.n)).slice(0,3);
      return {q:"Quel terme correspond à cette définition ? « "+c.def+" »",opts:[c.fr+" ("+c.en+")",...others.map(o=>o.fr+" ("+o.en+")")],a:0,ex:c.tip}});
    v.innerHTML=`<p class="pitch" style="font-size:14px;color:var(--muted);margin:0 0 10px">20 définitions tirées des concepts affichés : retrouvez le bon terme.</p><div class="card quiz" id="qz"></div>`;
    Quiz($("#qz"),qs,{mode:"learn"}).start();
  }
}
function flash(){
  const v=$("#view");
  if(!deck.length){v.innerHTML=`<div class="empty">Aucun concept ne correspond.</div>`;return}
  const c=C[deck[pos]-1];
  v.innerHTML=`<div class="fc" id="fc" tabindex="0" role="button" aria-label="Retourner la carte">
    <div class="eyebrow">${pad(c.n)} · ${esc(d.themes[c.th-1])} · carte ${pos+1} / ${deck.length}${known.has(c.n)?" · ✓ connu":rev.has(c.n)?" · ↻ à revoir":""}</div>
    <div class="t">${esc(c.fr)}<span class="enx">(${esc(c.en)})</span></div>
    ${flip?`<p style="margin:0">${esc(c.def)}</p><div class="blk tip"><h4>Tip examen</h4><p>${esc(c.tip)}</p></div><p class="sag">${esc(c.sag)}</p>`:`<p class="hint">Donnez la définition de tête, puis cliquez pour retourner la carte (ou Espace).</p>`}
  </div>
  <div class="fc-nav"><button class="btn" type="button" data-f="prev">← Précédente</button><button class="btn" type="button" data-f="shuf">Mélanger</button><button class="btn" type="button" data-f="rev">À revoir</button><button class="btn primary" type="button" data-f="known">Je connais</button><button class="btn" type="button" data-f="next">Suivante →</button></div>`;
}
const go=k=>{pos=(pos+k+deck.length)%deck.length;flip=false;flash()};
$("#view").addEventListener("click",e=>{
  if(F.view==="flash"){
    if(e.target.closest("#fc")){flip=!flip;flash();return}
    const b=e.target.closest("[data-f]");if(!b||!deck.length)return;const f=b.dataset.f,n=deck[pos];
    if(f==="next")go(1);else if(f==="prev")go(-1);else if(f==="shuf"){deck=shuffle(deck);pos=0;flip=false;flash()}
    else{if(f==="known"){known.add(n);rev.delete(n)}else{rev.add(n);known.delete(n)}save();go(1)}
    return}
  if(F.view!=="cards")return;
  const el=e.target.closest(".gc");if(!el)return;const n=+el.dataset.n;const a=e.target.closest("[data-a]");if(!a)return;
  if(a.dataset.a==="open"){open.has(n)?open.delete(n):open.add(n)}else mark(a.dataset.a,n);
  e.target.closest(".gc").outerHTML=card(C[n-1]);
});
document.addEventListener("keydown",e=>{if(F.view!=="flash"||/INPUT|SELECT/.test(document.activeElement.tagName))return;
  if(e.key===" "){e.preventDefault();flip=!flip;flash()}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1)});
$("#q").addEventListener("input",e=>{F.q=norm(e.target.value.trim());render()});
$("#th").addEventListener("change",e=>{F.th=e.target.value;render()});
$("#st").addEventListener("change",e=>{F.st=e.target.value;render()});
$$(".seg button").forEach(b=>b.addEventListener("click",()=>{F.view=b.dataset.v;$$(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));pos=0;flip=false;render()}));

stats();
const h=location.hash.match(/^#c(\d+)$/);
if(h&&C[+h[1]-1]){open.add(+h[1]);render();const el=$("#c"+h[1]);if(el){el.classList.add("flash-target");el.scrollIntoView({block:"center"})}}
else{open.add(1);render()}
})();
</script>
</body></html>

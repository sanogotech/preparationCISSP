<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Glossaire D5 · Gestion des identités et des accès</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap">
<style>/* Layout : portail de révision — barre de navigation fixe, en-tête de domaine, sections empilées avec sommaire */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#101B2B; --muted:#5A6879; --line:#D7DEE7;
  --accent:#1F4E9E; --accent-soft:#E3EBF8; --on-accent:#FFFFFF;
  --ok:#2E7D46; --ok-soft:#E3F2E8; --bad:#B3262F; --bad-soft:#FBE7E8; --warn:#B0680A;
  --hl:#FFF4D6; --hl-ink:#6B4B00;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-quote:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}

/* Barre du portail */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.pbar-in{display:flex;align-items:center;gap:14px;padding-block:9px;overflow-x:auto;scrollbar-width:none}
.pbar-in::-webkit-scrollbar{display:none}
.logo{font-family:var(--f-disp);font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo span{color:var(--accent)}
.pnav{display:flex;gap:4px}
.pnav a{font-family:var(--f-mono);font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);padding:5px 9px;border-radius:6px;white-space:nowrap}
.pnav a:hover{background:var(--sunk);color:var(--ink)}
.pnav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

/* En-tête de page */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero-in{padding-block:26px 18px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.hero h1 .code{color:var(--accent);margin-right:10px}
.en{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pitch{max-width:72ch;margin:0;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.stat{display:flex;flex-direction:column;gap:2px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:150px;text-decoration:none;color:var(--ink)}
.stat b{font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
a.stat:hover{border-color:var(--accent)}
.toc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.toc::-webkit-scrollbar{display:none}
.toc a{font-size:13px;font-weight:500;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)}
.toc a:hover{color:var(--ink);border-color:var(--accent)}

main{padding-block:10px 60px}
.sec{padding-top:34px;scroll-margin-top:60px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h .n{font-family:var(--f-mono);font-size:13px;color:var(--accent);margin-right:8px}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}

/* Objectifs */
.obj{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:8px}
.obj li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.obj b{font-family:var(--f-mono);color:var(--accent);font-size:13px}

/* Concepts */
.concepts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.concept h3{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
.concept h3 i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.concept p{margin:0;font-size:14.5px}

/* Schémas */
.schemas{display:flex;flex-direction:column;gap:14px}
.schema h3{font-size:18px;margin-bottom:12px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 130px;min-width:0;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:7px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.flow .st b{font-family:var(--f-disp);font-size:15px}
.flow .st span{font-size:12.5px;color:var(--muted)}
.flow .ar{align-self:center;color:var(--muted);font-family:var(--f-mono)}
.cycle-back{margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:4px}
.stack .ly{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:14px}
.stack .ly b{font-family:var(--f-disp);font-size:15px}
.stack .ly span{color:var(--muted)}
.note{margin:10px 0 0;font-size:13px;color:var(--hl-ink);background:var(--hl);display:inline-block;padding:4px 10px;border-radius:6px}

/* Tableaux */
.tables{display:flex;flex-direction:column;gap:14px}
.tables h3{font-size:18px;margin-bottom:10px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td:first-child{font-weight:600}

/* Scénarios */
.scens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.scen .sit{margin:0;font-size:14.5px}
.scen .q{margin:0;font-weight:600;font-family:var(--f-disp);font-size:16px;color:var(--accent)}
.scen .ans{background:var(--ok-soft);border-radius:7px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.scen .ans p{margin:0}
.scen .why{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:13.5px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Quiz */
.quiz{max-width:820px}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--muted)}
.qz-prog{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:14px}
.qz-prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qz-q{font-family:var(--f-disp);font-size:20px;font-weight:600;margin:0 0 14px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--bg);border-left:4px solid var(--muted);font-size:14.5px}
.fb.ok{border-left-color:var(--ok)}.fb.ko{border-left-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.qz-end{display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1}
.score small{font-size:18px;color:var(--muted);font-weight:500}
.review{display:flex;flex-direction:column;gap:8px}
.review div{background:var(--bg);border-radius:7px;padding:10px 12px;font-size:14px}
.review b{color:var(--bad)}

/* Glossaire */
.glo-s{max-width:320px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.glo td:first-child{font-family:var(--f-mono);font-size:13px}

/* Checklist */
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-width:820px}
.chk label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14.5px}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;max-width:820px;margin-bottom:10px}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1 1 220px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pager a.next{text-align:right}
.foot{margin-top:30px;font-size:12px;color:var(--muted)}

@media (max-width:760px){
  .hero h1{font-size:26px}
  .concepts,.scens{grid-template-columns:minmax(0,1fr)}
  .stack .ly{grid-template-columns:minmax(0,1fr);gap:2px}
  .flow .ar{display:none}
  .flow .st{flex-basis:100%}
  .stat{min-width:0;flex:1 1 40%}
}
/* Glossaire : barre d'outils, cartes de concepts, flashcards, liste A–Z */
.pnav span.off{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--line);padding:5px 9px;white-space:nowrap}
.gbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:18px}
.gbar .inp,.gbar .sel{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.gbar .inp{flex:1 1 220px;min-width:0}
.gbar .sel{flex:0 1 230px;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:7px 12px;font-size:13.5px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.gcount{font-size:13.5px;color:var(--muted);margin:14px 0 4px}
.gcount b{color:var(--ink)}
.th-h{font-family:var(--f-disp);font-size:20px;font-weight:700;margin:24px 0 10px;display:flex;gap:10px;align-items:baseline}
.th-h .n{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.th-h small{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted)}
.gcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
.gc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:70px}
.gc.known{border-color:var(--ok)}
.gc.rev{border-color:var(--warn)}
.gc.flash-target{box-shadow:0 0 0 3px var(--accent-soft)}
.gc-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.gc-h .num{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.gc-h h3{font-size:18px;font-weight:600;line-height:1.25}
.gc-h h3 .enx{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--accent)}
.gc-tags{grid-column:2;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.wa{background:var(--hl);color:var(--hl-ink)}
.gc .def{margin:0;font-size:14.5px}
.gc-more{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.blk{background:var(--bg);border-radius:7px;padding:8px 11px}
.blk h4{margin:0 0 2px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.blk p{margin:0;font-size:14px}
.blk.tip{background:var(--accent-soft)}.blk.tip h4{color:var(--accent)}
.blk.nu h4{color:var(--warn)}
.sag{margin:0;padding:2px 0 2px 12px;border-left:2px solid var(--accent);font-family:var(--f-quote);font-style:italic;font-size:16px}
.gc-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gc-acts .btn{padding:5px 10px;font-size:13px}
.lnk{border:0;background:none;color:var(--accent);font-size:13px;padding:0;text-decoration:underline}
.fc{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:12px;padding:26px;min-height:320px;display:flex;flex-direction:column;gap:12px;cursor:pointer;max-width:780px}
.fc .t{font-family:var(--f-disp);font-size:28px;font-weight:700;line-height:1.15;text-wrap:balance}
.fc .t .enx{display:block;font-family:var(--f-body);font-size:16px;font-weight:500;color:var(--accent);margin-top:4px}
.fc .hint{margin-top:auto;font-size:13px;color:var(--muted)}
.fc-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;max-width:780px;justify-content:center}
.az-letters{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}
.az-letters a{font-family:var(--f-mono);font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:5px;padding:3px 8px;background:var(--surface)}
.az td:first-child{white-space:normal;min-width:200px}
.az td:first-child small{display:block;font-family:var(--f-mono);font-weight:500;color:var(--accent);font-size:12px}
.az tr.lt td{background:var(--bg);font-family:var(--f-disp);font-size:18px;font-weight:700;color:var(--accent)}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
/* Accueil du glossaire */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:10px}
.dt{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:150px}
a.dt:hover{border-color:var(--accent)}
.dt .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dt .cd{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--accent)}
.dt h3{font-size:17px;font-weight:600}
.dt p{margin:0;font-size:13px;color:var(--muted)}
.dt .pg{margin-top:auto;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.dt .pg i{display:block;height:100%;background:var(--ok)}
.dt.soon{background:transparent;border-style:dashed}
.dt.soon h3{color:var(--muted)}
.st-ok{font-size:11px;font-family:var(--f-mono);color:var(--ok);background:var(--ok-soft);padding:1px 7px;border-radius:999px}
.st-soon{font-size:11px;font-family:var(--f-mono);color:var(--muted);background:var(--sunk);padding:1px 7px;border-radius:999px}
.grp{font-family:var(--f-disp);font-size:16px;font-weight:600;color:var(--muted);margin:20px 0 8px}
.res{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.res a{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px}
.res a:hover{border-color:var(--accent)}
.res a b{font-family:var(--f-mono);color:var(--accent);font-size:12px}
.res a span small{color:var(--accent);font-weight:500}
.res a span em{display:block;font-style:normal;color:var(--muted);font-size:13px}
@media (max-width:760px){.gcards{grid-template-columns:minmax(0,1fr)}.fc{padding:20px 18px}.fc .t{font-size:23px}}
</style>

<script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const LETTERS="ABCD";

/* Moteur de quiz : mode « learn » (correction immédiate) ou « exam » (correction à la fin) */
function Quiz(el,questions,cfg){
  cfg=cfg||{};
  let qs,i,ans,timer,deadline;
  function start(list){
    qs=(list||questions).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:shuffle(q.opts.map((t,k)=>({t,ok:k===q.a})))}));
    i=0;ans=[];
    clearInterval(timer);
    if(cfg.minutes){deadline=Date.now()+cfg.minutes*60000;timer=setInterval(tick,1000)}
    render();
  }
  function tick(){const r=deadline-Date.now();const t=el.querySelector(".qz-time");if(t)t.textContent=fmt(r);if(r<=0){clearInterval(timer);finish(true)}}
  const fmt=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,"0")}`};
  function render(){
    if(i>=qs.length)return finish(false);
    const q=qs[i],a=ans[i],good=ans.filter(x=>x&&x.ok).length;
    el.innerHTML=`<div class="qz-top"><span>Question <b>${i+1}</b> / ${qs.length}${q.d&&cfg.showDom?` · <span class="en">${q.d}</span>`:""}</span>
      <span>${cfg.mode==="exam"?(cfg.minutes?`Temps restant <b class="qz-time">${fmt(deadline-Date.now())}</b>`:""):`Score <b>${good}</b> / ${ans.filter(Boolean).length}`}</span></div>
      <div class="qz-prog"><i style="width:${i/qs.length*100}%"></i></div>
      <p class="qz-q">${esc(q.q)}</p>
      <div class="opts">${q.opts.map((o,k)=>{
        let cls="opt";
        if(a){ if(cfg.mode==="exam"){if(a.k===k)cls+=" picked"} else {if(o.ok)cls+=" good";else if(a.k===k)cls+=" wrong"} }
        return `<button class="${cls}" type="button" data-k="${k}"${a&&cfg.mode!=="exam"?" disabled":""}><span class="k">${LETTERS[k]}</span><span>${esc(o.t)}</span></button>`}).join("")}</div>
      ${a&&cfg.mode!=="exam"?`<div class="fb ${a.ok?"ok":"ko"}"><b>${a.ok?"Bonne réponse.":"Pas tout à fait."}</b>${esc(q.ex)}</div>`:""}
      <div class="row" style="margin-top:14px">
        ${cfg.mode==="exam"?`<button class="btn primary" type="button" data-nav="next"${a?"":" disabled"}>${i+1<qs.length?"Valider et continuer":"Terminer l'examen"}</button><button class="btn" type="button" data-nav="stop">Arrêter et voir le résultat</button>`
          :`${a?`<button class="btn primary" type="button" data-nav="next">${i+1<qs.length?"Question suivante":"Voir mon score"}</button>`:""}`}
      </div>`;
  }
  el.addEventListener("click",e=>{
    const o=e.target.closest(".opt");
    if(o&&!o.disabled&&i<qs.length){const k=+o.dataset.k;if(cfg.mode!=="exam"&&ans[i])return;ans[i]={k,ok:qs[i].opts[k].ok};render();return}
    const n=e.target.closest("[data-nav]");if(!n||n.disabled)return;
    if(n.dataset.nav==="next"){i++;render()}
    else if(n.dataset.nav==="stop")finish(false);
    else if(n.dataset.nav==="again")start();
    else if(n.dataset.nav==="errors"){const wrong=qs.filter((q,k)=>!ans[k]||!ans[k].ok).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:q.opts.map(o=>o.t),a:q.opts.findIndex(o=>o.ok)}));start(wrong)}
  });
  function finish(timeout){
    clearInterval(timer);
    const total=qs.length,good=qs.filter((q,k)=>ans[k]&&ans[k].ok).length,pct=Math.round(good/total*100);
    const per={};qs.forEach((q,k)=>{if(!q.d)return;per[q.d]=per[q.d]||[0,0];per[q.d][1]++;if(ans[k]&&ans[k].ok)per[q.d][0]++});
    if(cfg.onDone)cfg.onDone({pct,good,total,per});
    const wrong=qs.map((q,k)=>({q,a:ans[k]})).filter(x=>!x.a||!x.a.ok);
    el.innerHTML=`<div class="qz-end">
      ${timeout?`<p class="note">Temps écoulé : les questions sans réponse comptent comme fausses.</p>`:""}
      <div class="score">${pct} %<small> · ${good} / ${total} bonnes réponses</small></div>
      <p style="margin:0">${pct>=80?"Excellent niveau : vous êtes prêt sur ce périmètre.":pct>=70?"Bon niveau, proche du seuil de réussite. Revoyez les erreurs ci-dessous.":"Niveau à consolider : relisez les concepts et les fiches, puis recommencez."}</p>
      ${Object.keys(per).length>1?`<div class="tblw"><table><thead><tr><th>Domaine</th><th>Score</th></tr></thead><tbody>${Object.keys(per).sort().map(d=>`<tr><td>${d}</td><td>${per[d][0]} / ${per[d][1]} (${Math.round(per[d][0]/per[d][1]*100)} %)</td></tr>`).join("")}</tbody></table></div>`:""}
      <div class="row"><button class="btn primary" type="button" data-nav="again">Recommencer</button>${wrong.length?`<button class="btn" type="button" data-nav="errors">Refaire seulement mes ${wrong.length} erreur${wrong.length>1?"s":""}</button>`:""}</div>
      ${wrong.length?`<h3 style="font-size:17px;margin-top:6px">Correction des erreurs</h3><div class="review">${wrong.map(x=>`<div><p style="margin:0 0 4px;font-weight:600">${esc(x.q.q)}</p><p style="margin:0">Bonne réponse : <strong>${esc(x.q.opts.find(o=>o.ok).t)}</strong>${x.a?` · votre réponse : <b>${esc(x.q.opts[x.a.k].t)}</b>`:" · sans réponse"}</p><p style="margin:4px 0 0;color:var(--muted)">${esc(x.q.ex)}</p></div>`).join("")}</div>`:""}
    </div>`;
  }
  return {start};
}
</script>
<script>const GD={"code": "D5", "num": 5, "name": "Gestion des identités et des accès", "en": "Identity and Access Management (IAM)", "pitch": "Qui est qui, qui peut faire quoi, et comment le prouver : identification, authentification, autorisation, fédération, cycle de vie des accès et attaques sur les identités.", "themes": ["Fondamentaux de l'identité", "Facteurs d'authentification", "Mots de passe et secrets", "Biométrie", "Modèles d'autorisation", "SSO et fédération", "Kerberos et annuaires", "Cycle de vie des accès", "Privilèges et sessions", "Accès physique et attaques"], "items": [[1, "Identité numérique", "Digital identity", "Ensemble des attributs qui représentent une personne, un service ou un équipement dans un système.", "Compte, attributs RH, certificats d'un employé.", "Une personne peut avoir plusieurs identités (utilisateur, administrateur).", "Une identité, un cycle de vie.", "L'IAM gère des identités, pas seulement des comptes.", "D5"], [1, "Sujet et objet", "Subject and object", "Le sujet est l'entité active qui demande l'accès ; l'objet est la ressource passive accédée.", "Un utilisateur (sujet) lit un fichier (objet).", "Un programme peut être sujet puis objet selon le contexte.", "Qui agit, sur quoi.", "Vocabulaire de base des modèles d'accès.", "D5 · D3"], [1, "Identification", "Identification", "Déclaration d'une identité par le sujet.", "Saisie d'un identifiant, présentation d'un badge.", "Elle ne prouve rien : un identifiant n'est pas un secret.", "Dire son nom n'est pas prouver qui l'on est.", "Première étape de IAAA.", "D5"], [1, "Authentification", "Authentication", "Vérification que le sujet est bien celui qu'il prétend être.", "Mot de passe et code MFA.", "Authentifier n'est pas autoriser.", "Prouver avant d'entrer.", "Elle s'appuie sur un ou plusieurs facteurs.", "D5"], [1, "Autorisation", "Authorization", "Attribution des droits d'accès à un sujet authentifié.", "Le rôle « comptable » donne accès au logiciel de paie.", "Qui je suis ≠ ce que je peux faire.", "La clé ouvre certaines portes, pas toutes.", "Modèles : DAC, MAC, RBAC, ABAC.", "D5"], [1, "Imputabilité", "Accountability", "Capacité de rattacher chaque action à une identité unique grâce à l'audit.", "Journal montrant qui a modifié un virement.", "Impossible avec des comptes partagés.", "Pas de responsabilité sans identité.", "Exige identification unique + journalisation.", "D5 · D7"], [1, "Identifiant unique", "Unique identifier", "Chaque sujet possède un identifiant qui ne désigne que lui et n'est pas réattribué.", "Matricule utilisé comme identifiant de compte.", "Réutiliser l'identifiant d'un ancien employé brouille les traces.", "Un nom pour une seule personne.", "Fondement de l'imputabilité.", "D5"], [1, "Preuve d'identité", "Identity proofing", "Vérification de l'identité réelle d'une personne avant de lui créer un compte.", "Contrôle de la pièce d'identité à l'embauche.", "Un compte créé sur une fausse identité rend tout le reste inutile.", "Bien connaître avant d'enregistrer.", "NIST SP 800-63A : niveaux IAL.", "D5"], [1, "Niveaux d'assurance", "Assurance levels (IAL / AAL / FAL)", "Niveaux NIST de confiance : preuve d'identité (IAL), authentification (AAL), fédération (FAL).", "AAL3 exige un authentificateur matériel résistant au phishing.", "Le niveau doit correspondre au risque de l'application.", "La confiance se gradue selon l'enjeu.", "NIST SP 800-63.", "D5"], [1, "Identités non humaines", "Non-person entities / machine identities", "Identités des services, applications, équipements et objets.", "Certificats des serveurs, comptes de service, identités cloud.", "Souvent plus nombreuses que les identités humaines et moins surveillées.", "La machine aussi doit montrer patte blanche.", "Inventorier, attribuer un propriétaire, faire tourner les secrets.", "D5"], [2, "Ce que l'on sait", "Something you know (Type 1)", "Facteur fondé sur une connaissance : mot de passe, PIN, réponse secrète.", "Code PIN d'une carte.", "Le plus faible : il se devine, se vole, se partage.", "Un secret dit est un secret perdu.", "Mot de passe + PIN = un seul type de facteur.", "D5"], [2, "Ce que l'on possède", "Something you have (Type 2)", "Facteur fondé sur un objet : carte, jeton, téléphone, clé de sécurité.", "Clé FIDO2 branchée en USB.", "Il peut être perdu ou volé : on le combine à un autre facteur.", "La clé dans la poche se garde.", "Carte à puce = type 2.", "D5"], [2, "Ce que l'on est", "Something you are (Type 3)", "Facteur biométrique : empreinte, iris, visage, voix.", "Reconnaissance faciale sur un smartphone.", "Ne se change pas en cas de compromission.", "Le corps ne s'oublie pas, mais ne se remplace pas.", "Type 3 = biométrie.", "D5"], [2, "Lieu et comportement", "Somewhere you are / Something you do", "Facteurs complémentaires : localisation, réseau, manière de taper ou de signer.", "Refus d'une connexion depuis un pays inhabituel.", "Plutôt des signaux de risque que des facteurs autonomes.", "Le contexte trahit l'imposteur.", "Utilisés dans l'authentification adaptative.", "D5"], [2, "Authentification multifacteur", "Multifactor authentication (MFA)", "Combinaison d'au moins deux types de facteurs différents.", "Mot de passe + application d'authentification.", "Deux éléments du même type ne font pas du MFA.", "Deux verrous différents valent mieux que deux identiques.", "Le MFA bloque la grande majorité des attaques sur les comptes.", "D5"], [2, "Authentification forte", "Strong authentication", "Authentification qui résiste aux attaques courantes, souvent multifacteur et résistante au phishing.", "Carte à puce avec PIN pour les administrateurs.", "« Forte » dépend du contexte et du niveau d'assurance visé.", "La force se mesure à l'attaque qu'on repousse.", "Viser des facteurs résistants au phishing pour les comptes sensibles.", "D5"], [2, "Jeton synchrone", "Synchronous token (TOTP)", "Jeton qui génère un code à partir de l'heure courante.", "Code à 6 chiffres renouvelé toutes les 30 secondes.", "Exige une horloge synchronisée.", "Le temps fait la clé.", "TOTP = Time-based One-Time Password.", "D5"], [2, "Jeton asynchrone", "Asynchronous token (HOTP / challenge-response)", "Jeton qui génère un code à partir d'un compteur ou d'un défi envoyé par le serveur.", "Calculette bancaire qui répond à un défi.", "Le compteur peut se désynchroniser.", "Répondre à la question, pas à l'horloge.", "HOTP = HMAC-based One-Time Password.", "D5"], [2, "Carte à puce", "Smart card / PIV", "Carte contenant une puce qui stocke des clés et certificats, souvent protégée par PIN.", "Carte d'agent public pour se connecter et signer.", "Combinée au PIN, elle offre deux facteurs.", "La puce garde le secret, le PIN garde la puce.", "Carte à puce + PIN = MFA.", "D5"], [2, "FIDO2 et clés d'accès", "FIDO2 / WebAuthn / Passkeys", "Authentification par clé cryptographique liée au domaine du site, résistante au phishing.", "Connexion sans mot de passe avec une clé de sécurité.", "Un faux site ne peut pas utiliser la clé du vrai.", "La clé ne s'ouvre que devant la bonne porte.", "Facteur le plus résistant au phishing.", "D5"], [3, "Politique de mots de passe moderne", "Password policy (NIST SP 800-63B)", "Privilégier la longueur, interdire les mots de passe compromis, éviter les règles de composition et les changements forcés sans raison.", "Phrase de passe de 15 caractères, contrôlée contre les listes de fuites.", "Certains régulateurs imposent encore d'anciennes règles.", "Une longue phrase vaut mieux qu'un mot compliqué.", "Changer seulement en cas de suspicion de compromission.", "D5"], [3, "Phrase de passe", "Passphrase", "Mot de passe long formé de plusieurs mots, facile à retenir et difficile à casser.", "« Manguier-pluie-Abidjan-2026 ».", "Éviter les citations célèbres.", "La longueur fait la force.", "Plus résistante qu'un mot court complexe.", "D5"], [3, "Gestionnaire de mots de passe", "Password manager", "Coffre qui génère et stocke des mots de passe uniques pour chaque service.", "Un mot de passe différent pour chaque site.", "Le coffre devient une cible : MFA obligatoire.", "Mieux vaut un coffre bien gardé que cent post-it.", "Supprime la réutilisation des mots de passe.", "D5"], [3, "Sel", "Salt", "Valeur aléatoire ajoutée à chaque mot de passe avant hachage.", "Deux utilisateurs au même mot de passe ont des empreintes différentes.", "Le sel n'est pas secret ; il rend les tables précalculées inutiles.", "À chaque plat son sel.", "Contre les tables arc-en-ciel.", "D5 · D3"], [3, "Hachage lent des mots de passe", "Password hashing (bcrypt, scrypt, Argon2, PBKDF2)", "Fonctions de hachage volontairement lentes pour freiner la force brute.", "Stockage des mots de passe en Argon2.", "Un hachage rapide (SHA-256 seul) est inadapté aux mots de passe.", "Ralentir l'attaquant, c'est déjà le vaincre.", "Jamais de stockage en clair ni de chiffrement réversible.", "D5 · D8"], [3, "Mot de passe à usage unique", "One-time password (OTP)", "Mot de passe valable une seule fois.", "Code reçu pour valider une transaction.", "Un OTP par SMS est vulnérable au SIM swapping.", "Ce qui sert une fois ne sert pas au voleur.", "Contre le rejeu.", "D5"], [3, "Questions secrètes", "Cognitive password / Security questions", "Questions personnelles utilisées pour vérifier l'identité ou réinitialiser un compte.", "« Nom de votre premier animal ».", "Les réponses se trouvent souvent sur les réseaux sociaux.", "Ce que tout le monde peut chercher n'est pas secret.", "Facteur faible ; à éviter pour les comptes sensibles.", "D5"], [3, "Réinitialisation en libre-service", "Self-service password reset", "Procédure permettant à l'utilisateur de réinitialiser son mot de passe après vérification.", "Réinitialisation après validation par MFA.", "Procédure souvent visée par l'ingénierie sociale.", "La porte de secours doit être aussi solide que l'entrée.", "Vérifier l'identité aussi fortement qu'à la connexion.", "D5"], [3, "Authentification sans mot de passe", "Passwordless authentication", "Connexion par clé cryptographique, biométrie locale ou lien sécurisé, sans mot de passe.", "Windows Hello ou passkeys.", "Supprime le vol de mot de passe, pas toutes les attaques.", "Ce qui n'existe pas ne se vole pas.", "Souvent fondée sur FIDO2.", "D5"], [3, "Rotation des secrets", "Secret rotation", "Changement régulier des clés, jetons et mots de passe techniques.", "Rotation automatique des mots de passe des comptes de service.", "Pour les humains, éviter les changements forcés sans raison.", "Le secret qui vieillit s'use.", "Coffre et automatisation facilitent la rotation.", "D5"], [4, "Biométrie physiologique", "Physiological biometrics", "Mesure de caractéristiques physiques : empreinte, iris, rétine, visage, géométrie de la main, veines.", "Lecteur d'empreintes à l'entrée de la salle des coffres.", "Plus stable que la biométrie comportementale.", "Le corps signe sans stylo.", "Rétine = très précise mais intrusive.", "D5"], [4, "Biométrie comportementale", "Behavioral biometrics", "Mesure de comportements : dynamique de frappe, signature, voix, démarche.", "Détection d'un imposteur par sa manière de taper.", "Plus variable selon l'état de la personne.", "Les gestes trahissent la personne.", "Souvent utilisée en authentification continue.", "D5"], [4, "Taux de faux rejets", "False rejection rate (FRR) – Type I error", "Pourcentage d'utilisateurs légitimes rejetés à tort.", "Un employé doit poser trois fois son doigt.", "Gênant mais pas dangereux.", "Trop sévère, on bloque les siens.", "Type I = gêne.", "D5"], [4, "Taux de fausses acceptations", "False acceptance rate (FAR) – Type II error", "Pourcentage d'imposteurs acceptés à tort.", "Un intrus entre avec une empreinte proche.", "L'erreur la plus grave pour la sécurité.", "Trop souple, on laisse entrer les autres.", "Type II = Intrus admis.", "D5"], [4, "Taux d'erreur croisé", "Crossover error rate (CER / EER)", "Point où FAR = FRR ; indicateur de précision d'un système biométrique.", "Comparer deux lecteurs sur leur CER.", "Plus il est bas, plus le système est précis.", "Le point d'équilibre dit la qualité.", "Critère de choix d'un système biométrique.", "D5"], [4, "Enrôlement", "Enrollment", "Capture initiale des caractéristiques biométriques d'une personne pour créer son modèle de référence.", "Prise de plusieurs empreintes au premier jour.", "Un enrôlement de mauvaise qualité dégrade tout le système.", "Un bon départ fait un bon parcours.", "Durée d'enrôlement : critère d'acceptabilité (environ 2 minutes).", "D5"], [4, "Débit biométrique", "Throughput rate", "Temps nécessaire pour traiter une authentification biométrique.", "Un portique qui doit accepter une personne toutes les 6 secondes.", "Un débit trop lent provoque des contournements.", "La file trop longue ouvre la porte de côté.", "Repère classique : environ 6 à 10 secondes par personne.", "D5"], [4, "Iris et rétine", "Iris vs Retina scan", "L'iris est mesuré à distance, de façon peu intrusive ; la rétine, très précise, exige de s'approcher et peut révéler des informations de santé.", "Lecteur d'iris dans un aéroport.", "La rétine soulève des questions de vie privée.", "Regarder sans fouiller.", "Rétine = plus précise, moins acceptée.", "D5"], [4, "Détection du vivant", "Liveness detection / Anti-spoofing", "Vérification que la caractéristique présentée vient d'une personne vivante présente.", "Rejet d'une photo ou d'un faux doigt en silicone.", "Les deepfakes renforcent ce besoin.", "Le portrait n'est pas la personne.", "Contre l'usurpation biométrique.", "D5"], [4, "Acceptabilité biométrique", "Biometric acceptance", "Critère de choix : facilité d'usage, intrusivité, respect de la vie privée et de la culture.", "Préférer le visage à la rétine pour les employés.", "Un système refusé par les utilisateurs échoue.", "La meilleure serrure est celle qu'on utilise.", "Critères : précision (CER), débit, enrôlement, acceptabilité.", "D5"], [5, "Contrôle d'accès discrétionnaire", "Discretionary Access Control (DAC)", "Le propriétaire de la ressource décide qui y accède, souvent via des listes de contrôle d'accès.", "Partage d'un dossier par son créateur.", "Souple mais propice aux droits excessifs et aux chevaux de Troie.", "La clé confiée au propriétaire voyage vite.", "DAC = Discrétion du propriétaire.", "D5"], [5, "Contrôle d'accès obligatoire", "Mandatory Access Control (MAC)", "Le système impose l'accès selon les étiquettes de classification et les habilitations.", "Système militaire où l'utilisateur ne peut pas partager un document « Secret ».", "Très strict, peu flexible.", "La règle ne se négocie pas.", "MAC = Militaire ; non discrétionnaire.", "D5 · D3"], [5, "Contrôle d'accès basé sur les rôles", "Role-Based Access Control (RBAC)", "Les droits sont attribués à des rôles, et les utilisateurs aux rôles.", "Rôle « agent d'accueil » avec ses droits standard.", "Risque d'explosion du nombre de rôles.", "La fonction donne la clé, pas la personne.", "Facilite le moindre privilège et les mutations.", "D5"], [5, "Contrôle d'accès par règles", "Rule-based access control", "Des règles globales s'appliquent à tous les sujets.", "Règles de pare-feu, accès autorisé de 7 h à 19 h.", "Uniforme, peu adapté aux cas individuels.", "La règle vaut pour tous.", "Ne pas confondre avec role-based.", "D5"], [5, "Contrôle d'accès basé sur les attributs", "Attribute-Based Access Control (ABAC)", "Décision fondée sur des attributs du sujet, de l'objet, de l'action et du contexte.", "Accès autorisé si service = finance ET poste géré ET heure ouvrée.", "Très fin, mais complexe à concevoir et auditer.", "Le contexte complète l'identité.", "Base du Zero Trust ; langage XACML.", "D5"], [5, "Contrôle d'accès basé sur le risque", "Risk-based / Adaptive access control", "L'accès s'adapte au niveau de risque calculé en temps réel.", "MFA supplémentaire si la connexion vient d'un pays inhabituel.", "Dépend de la qualité des signaux de risque.", "Plus le danger monte, plus la porte se ferme.", "Aussi appelé authentification adaptative.", "D5"], [5, "Liste de contrôle d'accès", "Access Control List (ACL)", "Liste attachée à un objet qui indique quels sujets ont quels droits.", "Droits NTFS d'un dossier partagé.", "Vue centrée sur l'objet.", "Chaque porte connaît ses visiteurs.", "ACL = colonne de la matrice d'accès.", "D5"], [5, "Matrice et capacités", "Access control matrix / Capability table", "Matrice sujets × objets avec les droits ; une table de capacités liste les droits d'un sujet.", "Liste des droits d'un utilisateur sur toutes les ressources.", "Capacités = vue centrée sur le sujet ; ACL = sur l'objet.", "Chaque visiteur porte ses laissez-passer.", "Capability = ligne ; ACL = colonne.", "D5 · D3"], [5, "Contrôle dépendant du contenu", "Content-dependent access control", "L'accès dépend du contenu de l'objet demandé.", "Un utilisateur voit les dossiers clients sauf ceux marqués VIP.", "Plus fin, mais plus coûteux en traitement.", "Ce qui est dit décide qui peut l'entendre.", "Souvent mis en œuvre par des vues de base de données.", "D5"], [5, "Contrôle dépendant du contexte", "Context-dependent access control", "L'accès dépend du contexte : heure, lieu, séquence d'actions.", "Validation d'un paiement autorisée seulement après saisie.", "Le contexte s'ajoute à l'identité.", "Le bon moment fait le bon accès.", "Exemple classique : un pare-feu à états.", "D5"], [6, "Authentification unique", "Single Sign-On (SSO)", "Une seule authentification donne accès à plusieurs applications.", "Connexion unique à toutes les applications SaaS de l'entreprise.", "Point unique de défaillance : MFA obligatoire.", "Une seule clé bien gardée vaut mieux que vingt égarées.", "Facilite aussi la désactivation au départ.", "D5"], [6, "Fédération d'identités", "Federated identity", "Relation de confiance entre domaines d'identité pour réutiliser une authentification.", "Les employés d'un partenaire accèdent avec leur propre identité.", "La confiance accordée au partenaire doit être contractualisée.", "On fait confiance au passeport d'un pays ami.", "SSO entre organisations différentes.", "D5"], [6, "Fournisseur d'identité", "Identity Provider (IdP)", "Service qui authentifie l'utilisateur et émet des assertions ou jetons.", "Microsoft Entra ID, Okta, Keycloak.", "Une compromission de l'IdP ouvre toutes les applications.", "Le gardien des clés doit être le mieux gardé.", "Composant central de la fédération.", "D5"], [6, "Fournisseur de service", "Service Provider (SP) / Relying Party (RP)", "Application qui fait confiance à l'IdP pour authentifier ses utilisateurs.", "Application SaaS qui accepte l'assertion SAML de l'entreprise.", "Elle doit valider la signature et la validité du jeton.", "On vérifie le tampon avant d'ouvrir.", "SP en SAML, RP en OpenID Connect.", "D5"], [6, "SAML 2.0", "Security Assertion Markup Language", "Standard XML d'échange d'assertions d'authentification et d'attributs entre IdP et SP.", "SSO d'entreprise vers une application SaaS.", "Plutôt adapté au web d'entreprise qu'aux applications mobiles.", "Le message signé porte la confiance.", "Trois rôles : principal (utilisateur), IdP, SP.", "D5"], [6, "Assertion", "Assertion", "Déclaration signée par l'IdP sur l'authentification et les attributs d'un utilisateur.", "« Awa s'est authentifiée par MFA à 9 h et appartient au service finance ».", "Une assertion non signée ou expirée doit être rejetée.", "La parole écrite et signée fait foi.", "Types : authentification, attribut, autorisation.", "D5"], [6, "OAuth 2.0", "OAuth 2.0", "Cadre d'autorisation déléguée : une application obtient un jeton d'accès limité sans connaître le mot de passe.", "Une application accède au calendrier de l'utilisateur avec son consentement.", "OAuth n'est pas un protocole d'authentification.", "Prêter la clé d'une pièce, pas de la maison.", "Piège : OAuth = autorisation.", "D5"], [6, "OpenID Connect", "OpenID Connect (OIDC)", "Couche d'authentification construite sur OAuth 2.0, avec un jeton d'identité.", "Bouton « Se connecter avec… ».", "C'est OIDC qui authentifie, pas OAuth seul.", "Ajouter le nom à la clé.", "Utilise des jetons JWT (ID token).", "D5"], [6, "Jeton JWT", "JSON Web Token (JWT)", "Jeton compact et signé qui transporte des informations (claims) entre parties.", "ID token d'OpenID Connect.", "Un JWT signé n'est pas chiffré : ne pas y mettre de secrets.", "Le sceau protège le contenu, il ne le cache pas.", "Valider signature, émetteur, audience et expiration.", "D5 · D8"], [6, "SCIM", "System for Cross-domain Identity Management", "Standard qui automatise la création, la mise à jour et la suppression des comptes dans les applications.", "Création automatique des comptes SaaS à l'arrivée.", "Il automatise aussi les départs, souvent oubliés.", "Ce qui est automatique n'est pas oublié.", "Provisionnement standardisé.", "D5"], [7, "Kerberos", "Kerberos", "Protocole d'authentification à tickets fondé sur la cryptographie symétrique et un tiers de confiance.", "Ouverture de session dans un domaine Active Directory.", "Exige des horloges synchronisées.", "Le ticket ouvre la porte, pas le nom.", "Le mot de passe ne circule pas sur le réseau.", "D5"], [7, "Centre de distribution de clés", "Key Distribution Center (KDC)", "Composant central de Kerberos regroupant l'AS et le TGS.", "Contrôleur de domaine Active Directory.", "Point unique de défaillance et cible majeure.", "Celui qui distribue les clés doit être imprenable.", "KDC = AS + TGS.", "D5"], [7, "Service d'authentification", "Authentication Service (AS)", "Partie du KDC qui authentifie l'utilisateur et lui délivre un TGT.", "Première étape d'une ouverture de session.", "Il ne donne pas accès aux services directement.", "D'abord le passeport, ensuite les visas.", "AS → TGT.", "D5"], [7, "Service d'octroi de tickets", "Ticket Granting Service (TGS)", "Partie du KDC qui délivre des tickets de service sur présentation du TGT.", "Obtenir un ticket pour un serveur de fichiers.", "Il ne revoit pas le mot de passe.", "Le passeport donne droit aux visas.", "TGT → TGS → ticket de service.", "D5"], [7, "Ticket d'octroi de tickets", "Ticket Granting Ticket (TGT)", "Ticket prouvant que l'utilisateur s'est authentifié, utilisé pour demander des tickets de service.", "Valable quelques heures pendant la journée de travail.", "Volé, il permet d'usurper l'utilisateur (pass-the-ticket).", "Le passeport volé ouvre les frontières.", "Durée de vie limitée.", "D5"], [7, "Ticket de service", "Service ticket", "Ticket présenté à un service précis pour y accéder.", "Ticket pour accéder à l'intranet.", "Chaque service a son ticket.", "Un visa par pays.", "Le serveur vérifie le ticket sans contacter le KDC.", "D5"], [7, "Golden Ticket", "Golden Ticket attack", "Forge de TGT à partir de la clé du compte krbtgt, donnant un accès illimité au domaine.", "Persistance d'un attaquant après compromission d'un contrôleur de domaine.", "Réinitialiser deux fois le mot de passe krbtgt pour l'éradiquer.", "Qui forge les passeports contrôle les frontières.", "Silver Ticket = forge d'un ticket de service.", "D5 · D7"], [7, "Kerberoasting", "Kerberoasting", "Demande de tickets de service puis cassage hors ligne du mot de passe des comptes de service.", "Compte de service au mot de passe faible cassé en quelques heures.", "Contre-mesure : mots de passe longs ou comptes gérés.", "Le compte oublié est le premier attaqué.", "Cible : comptes de service avec SPN.", "D5"], [7, "Annuaire LDAP", "Lightweight Directory Access Protocol (LDAP)", "Protocole d'accès aux annuaires d'identités.", "Active Directory interrogé par une application.", "LDAP en clair expose les identifiants ; utiliser LDAPS.", "L'annuaire se consulte, il ne se crie pas.", "Ports 389 (LDAP) et 636 (LDAPS).", "D5 · D4"], [7, "SESAME", "Secure European System for Applications in a Multi-vendor Environment", "Extension européenne de Kerberos ajoutant la cryptographie asymétrique.", "Projet historique d'authentification multi-fournisseurs.", "Peu utilisé aujourd'hui, mais cité à l'examen.", "Améliorer l'existant plutôt que tout refaire.", "Corrige le stockage de clés symétriques de Kerberos.", "D5"], [8, "Approvisionnement", "Provisioning", "Création des comptes et attribution des droits à l'arrivée ou au changement de poste.", "Comptes créés automatiquement depuis le SIRH.", "Les droits doivent correspondre au rôle, pas à l'ancien titulaire.", "Bien commencer, c'est déjà protéger.", "Automatiser via workflows d'approbation.", "D5"], [8, "Désapprovisionnement", "Deprovisioning", "Retrait des droits et désactivation des comptes au départ ou au changement de rôle.", "Comptes désactivés le jour du départ.", "Les comptes de prestataires sont souvent oubliés.", "On ferme la porte quand l'invité sort.", "Désactiver d'abord, supprimer ensuite selon la rétention.", "D5"], [8, "Arrivée, mobilité, départ", "Joiner-Mover-Leaver (JML)", "Les trois moments du cycle de vie d'une identité.", "Mover : retrait des anciens droits au changement de service.", "Le point faible est souvent le Mover.", "Les droits suivent la personne, pas l'habitude.", "JML = cycle de vie des accès.", "D5"], [8, "Accumulation de privilèges", "Privilege creep", "Droits qui s'accumulent au fil des mutations sans être retirés.", "Un employé garde ses droits comptables après son passage aux achats.", "Crée aussi des conflits de séparation des tâches.", "Le jardin non désherbé se couvre de ronces.", "Se corrige par des revues d'accès.", "D5"], [8, "Revue des accès", "Access review", "Vérification périodique que chaque droit est encore justifié.", "Revue trimestrielle des accès financiers.", "Une revue « tout valider » ne sert à rien.", "Ce qui n'est pas revu se périme.", "Faite par le manager ou le propriétaire, pas par l'IT.", "D5 · D6"], [8, "Certification des accès", "Access certification / attestation", "Validation formelle et tracée des droits par le responsable lors d'une campagne de revue.", "Le manager atteste les droits de son équipe dans l'outil IGA.", "L'attestation engage celui qui signe.", "Qui signe, assume.", "Preuve exigée par les auditeurs.", "D5 · D6"], [8, "Ingénierie des rôles", "Role engineering / Role mining", "Conception des rôles à partir des métiers et de l'analyse des droits existants.", "Regrouper les droits communs des agents d'accueil en un rôle.", "Trop de rôles rendent le RBAC ingérable.", "Peu de rôles, bien pensés.", "Préalable à un RBAC efficace.", "D5"], [8, "Comptes orphelins", "Orphaned accounts", "Comptes sans propriétaire actif, souvent hérités d'anciens employés ou projets.", "Compte d'un prestataire parti depuis un an encore actif.", "Cible idéale : personne ne remarque son usage.", "Ce qui appartient à tous n'appartient à personne.", "À détecter en rapprochant annuaire et SIRH.", "D5"], [8, "Comptes temporaires et invités", "Temporary and guest accounts", "Comptes à durée limitée pour stagiaires, prestataires, visiteurs.", "Compte stagiaire expirant automatiquement à la fin du stage.", "Toujours fixer une date d'expiration.", "L'invité repart, sa clé aussi.", "Désactivation automatique à échéance.", "D5"], [8, "Gouvernance des identités", "Identity Governance and Administration (IGA)", "Outils et processus qui pilotent le cycle de vie, les revues et la conformité des accès.", "Plateforme IGA qui détecte les conflits de séparation des tâches.", "La gouvernance sans données RH fiables échoue.", "Ce qui n'est gouverné est gaspillé.", "IGA = cycle de vie + revues + conformité.", "D5"], [9, "Gestion des accès à privilèges", "Privileged Access Management (PAM)", "Contrôle, coffre, attribution temporaire et enregistrement des accès d'administration.", "Bastion qui coffre les mots de passe administrateurs et enregistre les sessions.", "Le PAM devient lui-même une cible critique.", "Le pouvoir se prête, il ne se donne pas.", "Les ransomwares visent les comptes d'administration.", "D5 · D7"], [9, "Compte d'urgence", "Break-glass account", "Compte à privilèges réservé ité avant une action sensible.", "Code MFA demandé avant un virement important.", "Limite l'impact d'une session volée.", "Pour les grandes portes, on redemande le passeport.", "Complète l'authentification adaptative.", "D5"], [9, "Comptes partagés", "Shared / generic accounts", "Comptes utilisés par plusieurs personnes.", "Compte « admin » utilisé par toute l'équipe.", "Détruit l'imputabilité.", "Une signature collective n'engage personne.", "Remplacer par des comptes nominatifs et une élévation tracée.", "D5"], [9, "Modèle d'administration par niveaux", "Tiered administration model", "Séparation des comptes d'administration par niveau de criticité (contrôleurs de domaine, serveurs, postes).", "Un administrateur de postes ne se connecte jamais à un contrôleur de domaine.", "Empêche la récupération d'identifiants critiques sur des postes exposés.", "Chaque étage a ses clés.", "Limite les mouvements latéraux.", "D5"], [10, "Badges et cartes de proximité", "Badges / Proximity cards", "Cartes qui contrôlent l'accès physique ; certaines peuvent être clonées.", "Badge RFID pour entrer dans les bureaux.", "Les cartes basse fréquence se clonent facilement.", "La carte ouvre la porte, pas la conscience.", "Combiner avec un PIN ou la biométrie pour les zones sensibles.", "D5 · D3"], [10, "Gestion des visiteurs", "Visitor management", "Enregistrement, badge visible, escorte et restitution du badge à la sortie.", "Registre d'accueil et badge visiteur temporaire.", "Les prestataires réguliers sont aussi des visiteurs.", "L'hôte garde les clés de sa maison.", "Escorte obligatoire en zone sensible.", "D5 · D7"], [10, "Talonnage", "Tailgating / Piggybacking", "Entrer derrière une personne autorisée sans s'authentifier.", "Un inconnu entre en tenant la porte aux bras chargés.", "Piggybacking implique souvent l'accord de la personne.", "L'uniforme n'est pas une autorisation.", "Contre-mesures : sas, tourniquets, sensibilisation.", "D5 · D3"], [10, "Bourrage d'identifiants", "Credential stuffing", "Réutilisation automatisée d'identifiants volés ailleurs.", "Comptes clients piratés après une fuite d'un autre site.", "Exploite la réutilisation des mots de passe.", "Une seule clé pour toutes les portes, c'est une seule clé à voler.", "MFA et détection des connexions anormales.", "D5"], [10, "Pulvérisation de mots de passe", "Password spraying", "Essai d'un mot de passe courant sur de nombreux comptes pour éviter le verrouillage.", "« Bienvenue2026 » testé sur 500 comptes.", "Contourne les seuils de verrouillage par compte.", "Peu d'essais partout, c'est beaucoup au total.", "Interdire les mots de passe courants, détecter les échecs répartis.", "D5"], [10, "Force brute et dictionnaire", "Brute-force / Dictionary attack", "Essai de toutes les combinaisons ou de mots d'une liste.", "Attaque par dictionnaire sur un portail web.", "Hors ligne, rien ne la freine sauf la longueur et le hachage lent.", "La patience vient à bout des petites serrures.", "Verrouillage, MFA, mots de passe longs.", "D5"], [10, "Tables arc-en-ciel", "Rainbow tables", "Tables précalculées d'empreintes de mots de passe pour les retrouver rapidement.", "Casser une base de mots de passe hachés sans sel.", "Le sel les rend inutiles.", "Le sel gâche la recette du voleur.", "Contre-mesure : sel + hachage lent.", "D5 · D3"], [10, "Pass-the-hash", "Pass-the-hash", "Utilisation de l'empreinte d'un mot de passe volée en mémoire pour s'authentifier, sans le mot de passe lui-même.", "Mouvement latéral dans un domaine Windows.", "Changer le mot de passe ne suffit pas si l'attaquant reste présent.", "L'empreinte suffit à ouvrir quand on la présente.", "Contre-mesures : administration par niveaux, Credential Guard, LAPS.", "D5 · D7"], [10, "Fatigue MFA", "MFA fatigue / Push bombing", "Envoi répété de demandes MFA jusqu'à ce que l'utilisateur accepte par lassitude.", "Un prestataire accepte la 30e notification à minuit.", "Le MFA par simple notification y est vulnérable.", "L'insistance n'est pas une preuve.", "Number matching ou FIDO2, limitation des demandes.", "D5"], [10, "Détournement de carte SIM", "SIM swapping", "L'attaquant obtient le transfert du numéro de la victime sur sa carte SIM pour recevoir ses codes SMS.", "Vol de comptes mobile money via les codes SMS.", "Exploite les procédures de l'opérateur.", "Le numéro n'est pas la personne.", "Éviter le SMS comme facteur pour les comptes sensibles.", "D5"]]};</script>
<script>(function(){
const d=GD, K=d.code, kKey="gl-known-"+K, rKey="gl-rev-"+K;
const C=d.items.map((x,i)=>({i,n:i+1,th:x[0],fr:x[1],en:x[2],def:x[3],ex:x[4],nu:x[5],sag:x[6],tip:x[7],dom:x[8]}));
C.forEach(c=>c.hay=norm([c.fr,c.en,c.def,c.ex,c.nu,c.tip,c.dom].join(" ")));
const known=new Set(store.get(kKey,[])), rev=new Set(store.get(rKey,[]));
const open=new Set();
const F={q:"",th:"",st:"all",view:"cards"};
const save=()=>{store.set(kKey,[...known]);store.set(rKey,[...rev]);stats()};
const pad=n=>String(n).padStart(3,"0");

document.getElementById("app").innerHTML=`
<section class="hero"><div class="wrap hero-in">
  <div class="eyebrow">Glossaire 360 · Domaine ${d.num}${d.num===0?" · socle transverse":d.num<=8?" · CBK CISSP":" · bonus"}</div>
  <h1><span class="code">${K}</span>${esc(d.name)}</h1>
  <div class="en">${esc(d.en)}</div>
  <p class="pitch">${esc(d.pitch)}</p>
  <div class="stats">
    <div class="stat"><b>${C.length}</b><span>concepts détaillés</span></div>
    <div class="stat"><b id="s-k">0</b><span>concepts connus</span></div>
    <div class="stat"><b id="s-r">0</b><span>à revoir</span></div>
  </div>
  <div class="meter" style="max-width:none;margin:4px 0 0"><i id="s-m"></i></div>
</div></section>
<main class="wrap">
  <div class="gbar">
    <input class="inp" id="q" type="search" placeholder="Chercher un terme, en français ou en anglais…" aria-label="Chercher">
    <select class="sel" id="th" aria-label="Sous-thème"><option value="">Tous les sous-thèmes</option>${d.themes.map((t,k)=>`<option value="${k+1}">${k+1}. ${esc(t)}</option>`).join("")}</select>
    <select class="sel" id="st" aria-label="Progression"><option value="all">Tous les concepts</option><option value="todo">Pas encore connus</option><option value="rev">À revoir</option><option value="known">Connus</option></select>
    <div class="seg" role="group" aria-label="Affichage">
      <button type="button" data-v="cards" aria-pressed="true">Fiches</button><button type="button" data-v="flash" aria-pressed="false">Flashcards</button><button type="button" data-v="az" aria-pressed="false">Liste A–Z</button><button type="button" data-v="test" aria-pressed="false">Auto-test</button>
    </div>
  </div>
  <p class="gcount" id="cnt"></p>
  <div id="view"></div>
  <p class="foot">Votre progression est enregistrée dans ce navigateur. Les termes anglais entre parenthèses sont ceux de l'examen.</p>
</main>`;

function stats(){$("#s-k").textContent=known.size;$("#s-r").textContent=rev.size;$("#s-m").style.width=(known.size/C.length*100)+"%"}
function list(){return C.filter(c=>(!F.q||F.q.split(/\s+/).every(w=>c.hay.includes(w)))&&(!F.th||String(c.th)===F.th)&&
  (F.st==="all"||(F.st==="todo"&&!known.has(c.n))||(F.st==="rev"&&rev.has(c.n))||(F.st==="known"&&known.has(c.n))))}
function card(c){const o=open.has(c.n);
  return `<article class="gc${known.has(c.n)?" known":rev.has(c.n)?" rev":""}" id="c${c.n}" data-n="${c.n}">
  <div class="gc-h"><span class="num">${pad(c.n)}</span><h3>${esc(c.fr)} <span class="enx">(${esc(c.en)})</span></h3>
  <div class="gc-tags">${c.dom.split(" · ").map(x=>`<span class="tag">${x}</span>`).join("")}${known.has(c.n)?`<span class="tag ok">✓ connu</span>`:""}${rev.has(c.n)?`<span class="tag wa">↻ à revoir</span>`:""}</div></div>
  <p class="def">${esc(c.def)}</p>
  ${o?`<div class="gc-more">
    <div class="blk"><h4>Exemple</h4><p>${esc(c.ex)}</p></div>
    <div class="blk nu"><h4>Nuance</h4><p>${esc(c.nu)}</p></div>
    <div class="blk tip"><h4>Tip examen</h4><p>${esc(c.tip)}</p></div>
    <p class="sag">${esc(c.sag)}</p></div>`:""}
  <div class="gc-acts"><button class="lnk" type="button" data-a="open">${o?"Masquer le détail":"Exemple, nuance, sagesse et tip"}</button>
    <span style="flex:1"></span>
    <button class="btn${known.has(c.n)?" primary":""}" type="button" data-a="known">${known.has(c.n)?"✓ Connu":"Je connais"}</button>
    <button class="btn" type="button" data-a="rev">${rev.has(c.n)?"Retirer":"À revoir"}</button></div>
</article>`}
function mark(kind,n){if(kind==="known"){if(known.has(n))known.delete(n);else{known.add(n);rev.delete(n)}}else{if(rev.has(n))rev.delete(n);else{rev.add(n);known.delete(n)}}save()}

let deck=[],pos=0,flip=false;
function render(){
  const L=list();
  $("#cnt").innerHTML=`<b>${L.length}</b> concept${L.length>1?"s":""} sur ${C.length}`;
  const v=$("#view");
  if(F.view==="cards"){
    if(!L.length){v.innerHTML=`<div class="empty">Aucun concept ne correspond.</div>`;return}
    const by=new Map();L.forEach(c=>{if(!by.has(c.th))by.set(c.th,[]);by.get(c.th).push(c)});
    v.innerHTML=[...by].map(([t,cs])=>`<h2 class="th-h"><span class="n">${String(t).padStart(2,"0")}</span>${esc(d.themes[t-1])} <small>${cs.length}</small></h2><div class="gcards">${cs.map(card).join("")}</div>`).join("");
  } else if(F.view==="flash"){
    deck=L.map(c=>c.n);if(pos>=deck.length)pos=0;flash();
  } else if(F.view==="az"){
    const s=L.slice().sort((a,b)=>a.fr.localeCompare(b.fr,"fr"));
    const letters=[...new Set(s.map(c=>norm(c.fr)[0].toUpperCase()))];
    let last="";
    v.innerHTML=`<div class="az-letters">${letters.map(l=>`<a href="#az-${l}">${l}</a>`).join("")}</div><div class="card"><div class="tblw"><table class="az"><thead><tr><th>Terme</th><th>Définition</th></tr></thead><tbody>${s.map(c=>{const l=norm(c.fr)[0].toUpperCase();const head=l!==last?`<tr class="lt" id="az-${l}"><td colspan="2">${l}</td></tr>`:"";last=l;return head+`<tr><td>${esc(c.fr)}<small>${esc(c.en)}</small></td><td>${esc(c.def)}</td></tr>`}).join("")}</tbody></table></div></div>`;
  } else {
    const pool=L.length>=4?L:C;
    const qs=shuffle(pool).slice(0,Math.min(20,pool.length)).map(c=>{const others=shuffle(C.filter(x=>x.n!==c.n)).slice(0,3);
      return {q:"Quel terme correspond à cette définition ? « "+c.def+" »",opts:[c.fr+" ("+c.en+")",...others.map(o=>o.fr+" ("+o.en+")")],a:0,ex:c.tip}});
    v.innerHTML=`<p class="pitch" style="font-size:14px;color:var(--muted);margin:0 0 10px">20 définitions tirées des concepts affichés : retrouvez le bon terme.</p><div class="card quiz" id="qz"></div>`;
    Quiz($("#qz"),qs,{mode:"learn"}).start();
  }
}
function flash(){
  const v=$("#view");
  if(!deck.length){v.innerHTML=`<div class="empty">Aucun concept ne correspond.</div>`;return}
  const c=C[deck[pos]-1];
  v.innerHTML=`<div class="fc" id="fc" tabindex="0" role="button" aria-label="Retourner la carte">
    <div class="eyebrow">${pad(c.n)} · ${esc(d.themes[c.th-1])} · carte ${pos+1} / ${deck.length}${known.has(c.n)?" · ✓ connu":rev.has(c.n)?" · ↻ à revoir":""}</div>
    <div class="t">${esc(c.fr)}<span class="enx">(${esc(c.en)})</span></div>
    ${flip?`<p style="margin:0">${esc(c.def)}</p><div class="blk tip"><h4>Tip examen</h4><p>${esc(c.tip)}</p></div><p class="sag">${esc(c.sag)}</p>`:`<p class="hint">Donnez la définition de tête, puis cliquez pour retourner la carte (ou Espace).</p>`}
  </div>
  <div class="fc-nav"><button class="btn" type="button" data-f="prev">← Précédente</button><button class="btn" type="button" data-f="shuf">Mélanger</button><button class="btn" type="button" data-f="rev">À revoir</button><button class="btn primary" type="button" data-f="known">Je connais</button><button class="btn" type="button" data-f="next">Suivante →</button></div>`;
}
const go=k=>{pos=(pos+k+deck.length)%deck.length;flip=false;flash()};
$("#view").addEventListener("click",e=>{
  if(F.view==="flash"){
    if(e.target.closest("#fc")){flip=!flip;flash();return}
    const b=e.target.closest("[data-f]");if(!b||!deck.length)return;const f=b.dataset.f,n=deck[pos];
    if(f==="next")go(1);else if(f==="prev")go(-1);else if(f==="shuf"){deck=shuffle(deck);pos=0;flip=false;flash()}
    else{if(f==="known"){known.add(n);rev.delete(n)}else{rev.add(n);known.delete(n)}save();go(1)}
    return}
  if(F.view!=="cards")return;
  const el=e.target.closest(".gc");if(!el)return;const n=+el.dataset.n;const a=e.target.closest("[data-a]");if(!a)return;
  if(a.dataset.a==="open"){open.has(n)?open.delete(n):open.add(n)}else mark(a.dataset.a,n);
  e.target.closest(".gc").outerHTML=card(C[n-1]);
});
document.addEventListener("keydown",e=>{if(F.view!=="flash"||/INPUT|SELECT/.test(document.activeElement.tagName))return;
  if(e.key===" "){e.preventDefault();flip=!flip;flash()}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1)});
$("#q").addEventListener("input",e=>{F.q=norm(e.target.value.trim());render()});
$("#th").addEventListener("change",e=>{F.th=e.target.value;render()});
$("#st").addEventListener("change",e=>{F.st=e.target.value;render()});
$$(".seg button").forEach(b=>b.addEventListener("click",()=>{F.view=b.dataset.v;$$(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));pos=0;flip=false;render()}));

stats();
const h=location.hash.match(/^#c(\d+)$/);
if(h&&C[+h[1]-1]){open.add(+h[1]);render();const el=$("#c"+h[1]);if(el){el.classList.add("flash-target");el.scrollIntoView({block:"center"})}}
else{open.add(1);render()}
})();
</script>
</body></html>

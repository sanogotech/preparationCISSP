<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Glossaire D3 · Architecture et ingénierie de sécurité</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap">
<style>/* Layout : portail de révision — barre de navigation fixe, en-tête de domaine, sections empilées avec sommaire */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#101B2B; --muted:#5A6879; --line:#D7DEE7;
  --accent:#1F4E9E; --accent-soft:#E3EBF8; --on-accent:#FFFFFF;
  --ok:#2E7D46; --ok-soft:#E3F2E8; --bad:#B3262F; --bad-soft:#FBE7E8; --warn:#B0680A;
  --hl:#FFF4D6; --hl-ink:#6B4B00;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-quote:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}

/* Barre du portail */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.pbar-in{display:flex;align-items:center;gap:14px;padding-block:9px;overflow-x:auto;scrollbar-width:none}
.pbar-in::-webkit-scrollbar{display:none}
.logo{font-family:var(--f-disp);font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo span{color:var(--accent)}
.pnav{display:flex;gap:4px}
.pnav a{font-family:var(--f-mono);font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);padding:5px 9px;border-radius:6px;white-space:nowrap}
.pnav a:hover{background:var(--sunk);color:var(--ink)}
.pnav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

/* En-tête de page */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero-in{padding-block:26px 18px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.hero h1 .code{color:var(--accent);margin-right:10px}
.en{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pitch{max-width:72ch;margin:0;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.stat{display:flex;flex-direction:column;gap:2px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:150px;text-decoration:none;color:var(--ink)}
.stat b{font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
a.stat:hover{border-color:var(--accent)}
.toc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.toc::-webkit-scrollbar{display:none}
.toc a{font-size:13px;font-weight:500;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)}
.toc a:hover{color:var(--ink);border-color:var(--accent)}

main{padding-block:10px 60px}
.sec{padding-top:34px;scroll-margin-top:60px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h .n{font-family:var(--f-mono);font-size:13px;color:var(--accent);margin-right:8px}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}

/* Objectifs */
.obj{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:8px}
.obj li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.obj b{font-family:var(--f-mono);color:var(--accent);font-size:13px}

/* Concepts */
.concepts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.concept h3{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
.concept h3 i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.concept p{margin:0;font-size:14.5px}

/* Schémas */
.schemas{display:flex;flex-direction:column;gap:14px}
.schema h3{font-size:18px;margin-bottom:12px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 130px;min-width:0;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:7px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.flow .st b{font-family:var(--f-disp);font-size:15px}
.flow .st span{font-size:12.5px;color:var(--muted)}
.flow .ar{align-self:center;color:var(--muted);font-family:var(--f-mono)}
.cycle-back{margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:4px}
.stack .ly{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:14px}
.stack .ly b{font-family:var(--f-disp);font-size:15px}
.stack .ly span{color:var(--muted)}
.note{margin:10px 0 0;font-size:13px;color:var(--hl-ink);background:var(--hl);display:inline-block;padding:4px 10px;border-radius:6px}

/* Tableaux */
.tables{display:flex;flex-direction:column;gap:14px}
.tables h3{font-size:18px;margin-bottom:10px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td:first-child{font-weight:600}

/* Scénarios */
.scens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.scen .sit{margin:0;font-size:14.5px}
.scen .q{margin:0;font-weight:600;font-family:var(--f-disp);font-size:16px;color:var(--accent)}
.scen .ans{background:var(--ok-soft);border-radius:7px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.scen .ans p{margin:0}
.scen .why{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:13.5px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Quiz */
.quiz{max-width:820px}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--muted)}
.qz-prog{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:14px}
.qz-prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qz-q{font-family:var(--f-disp);font-size:20px;font-weight:600;margin:0 0 14px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--bg);border-left:4px solid var(--muted);font-size:14.5px}
.fb.ok{border-left-color:var(--ok)}.fb.ko{border-left-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.qz-end{display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1}
.score small{font-size:18px;color:var(--muted);font-weight:500}
.review{display:flex;flex-direction:column;gap:8px}
.review div{background:var(--bg);border-radius:7px;padding:10px 12px;font-size:14px}
.review b{color:var(--bad)}

/* Glossaire */
.glo-s{max-width:320px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.glo td:first-child{font-family:var(--f-mono);font-size:13px}

/* Checklist */
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-width:820px}
.chk label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14.5px}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;max-width:820px;margin-bottom:10px}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1 1 220px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pager a.next{text-align:right}
.foot{margin-top:30px;font-size:12px;color:var(--muted)}

@media (max-width:760px){
  .hero h1{font-size:26px}
  .concepts,.scens{grid-template-columns:minmax(0,1fr)}
  .stack .ly{grid-template-columns:minmax(0,1fr);gap:2px}
  .flow .ar{display:none}
  .flow .st{flex-basis:100%}
  .stat{min-width:0;flex:1 1 40%}
}
/* Glossaire : barre d'outils, cartes de concepts, flashcards, liste A–Z */
.pnav span.off{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--line);padding:5px 9px;white-space:nowrap}
.gbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:18px}
.gbar .inp,.gbar .sel{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.gbar .inp{flex:1 1 220px;min-width:0}
.gbar .sel{flex:0 1 230px;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:7px 12px;font-size:13.5px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.gcount{font-size:13.5px;color:var(--muted);margin:14px 0 4px}
.gcount b{color:var(--ink)}
.th-h{font-family:var(--f-disp);font-size:20px;font-weight:700;margin:24px 0 10px;display:flex;gap:10px;align-items:baseline}
.th-h .n{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.th-h small{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted)}
.gcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
.gc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:70px}
.gc.known{border-color:var(--ok)}
.gc.rev{border-color:var(--warn)}
.gc.flash-target{box-shadow:0 0 0 3px var(--accent-soft)}
.gc-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.gc-h .num{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.gc-h h3{font-size:18px;font-weight:600;line-height:1.25}
.gc-h h3 .enx{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--accent)}
.gc-tags{grid-column:2;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.wa{background:var(--hl);color:var(--hl-ink)}
.gc .def{margin:0;font-size:14.5px}
.gc-more{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.blk{background:var(--bg);border-radius:7px;padding:8px 11px}
.blk h4{margin:0 0 2px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.blk p{margin:0;font-size:14px}
.blk.tip{background:var(--accent-soft)}.blk.tip h4{color:var(--accent)}
.blk.nu h4{color:var(--warn)}
.sag{margin:0;padding:2px 0 2px 12px;border-left:2px solid var(--accent);font-family:var(--f-quote);font-style:italic;font-size:16px}
.gc-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gc-acts .btn{padding:5px 10px;font-size:13px}
.lnk{border:0;background:none;color:var(--accent);font-size:13px;padding:0;text-decoration:underline}
.fc{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:12px;padding:26px;min-height:320px;display:flex;flex-direction:column;gap:12px;cursor:pointer;max-width:780px}
.fc .t{font-family:var(--f-disp);font-size:28px;font-weight:700;line-height:1.15;text-wrap:balance}
.fc .t .enx{display:block;font-family:var(--f-body);font-size:16px;font-weight:500;color:var(--accent);margin-top:4px}
.fc .hint{margin-top:auto;font-size:13px;color:var(--muted)}
.fc-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;max-width:780px;justify-content:center}
.az-letters{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}
.az-letters a{font-family:var(--f-mono);font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:5px;padding:3px 8px;background:var(--surface)}
.az td:first-child{white-space:normal;min-width:200px}
.az td:first-child small{display:block;font-family:var(--f-mono);font-weight:500;color:var(--accent);font-size:12px}
.az tr.lt td{background:var(--bg);font-family:var(--f-disp);font-size:18px;font-weight:700;color:var(--accent)}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
/* Accueil du glossaire */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:10px}
.dt{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:150px}
a.dt:hover{border-color:var(--accent)}
.dt .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dt .cd{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--accent)}
.dt h3{font-size:17px;font-weight:600}
.dt p{margin:0;font-size:13px;color:var(--muted)}
.dt .pg{margin-top:auto;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.dt .pg i{display:block;height:100%;background:var(--ok)}
.dt.soon{background:transparent;border-style:dashed}
.dt.soon h3{color:var(--muted)}
.st-ok{font-size:11px;font-family:var(--f-mono);color:var(--ok);background:var(--ok-soft);padding:1px 7px;border-radius:999px}
.st-soon{font-size:11px;font-family:var(--f-mono);color:var(--muted);background:var(--sunk);padding:1px 7px;border-radius:999px}
.grp{font-family:var(--f-disp);font-size:16px;font-weight:600;color:var(--muted);margin:20px 0 8px}
.res{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.res a{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px}
.res a:hover{border-color:var(--accent)}
.res a b{font-family:var(--f-mono);color:var(--accent);font-size:12px}
.res a span small{color:var(--accent);font-weight:500}
.res a span em{display:block;font-style:normal;color:var(--muted);font-size:13px}
@media (max-width:760px){.gcards{grid-template-columns:minmax(0,1fr)}.fc{padding:20px 18px}.fc .t{font-size:23px}}
</style>

<script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const LETTERS="ABCD";

/* Moteur de quiz : mode « learn » (correction immédiate) ou « exam » (correction à la fin) */
function Quiz(el,questions,cfg){
  cfg=cfg||{};
  let qs,i,ans,timer,deadline;
  function start(list){
    qs=(list||questions).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:shuffle(q.opts.map((t,k)=>({t,ok:k===q.a})))}));
    i=0;ans=[];
    clearInterval(timer);
    if(cfg.minutes){deadline=Date.now()+cfg.minutes*60000;timer=setInterval(tick,1000)}
    render();
  }
  function tick(){const r=deadline-Date.now();const t=el.querySelector(".qz-time");if(t)t.textContent=fmt(r);if(r<=0){clearInterval(timer);finish(true)}}
  const fmt=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,"0")}`};
  function render(){
    if(i>=qs.length)return finish(false);
    const q=qs[i],a=ans[i],good=ans.filter(x=>x&&x.ok).length;
    el.innerHTML=`<div class="qz-top"><span>Question <b>${i+1}</b> / ${qs.length}${q.d&&cfg.showDom?` · <span class="en">${q.d}</span>`:""}</span>
      <span>${cfg.mode==="exam"?(cfg.minutes?`Temps restant <b class="qz-time">${fmt(deadline-Date.now())}</b>`:""):`Score <b>${good}</b> / ${ans.filter(Boolean).length}`}</span></div>
      <div class="qz-prog"><i style="width:${i/qs.length*100}%"></i></div>
      <p class="qz-q">${esc(q.q)}</p>
      <div class="opts">${q.opts.map((o,k)=>{
        let cls="opt";
        if(a){ if(cfg.mode==="exam"){if(a.k===k)cls+=" picked"} else {if(o.ok)cls+=" good";else if(a.k===k)cls+=" wrong"} }
        return `<button class="${cls}" type="button" data-k="${k}"${a&&cfg.mode!=="exam"?" disabled":""}><span class="k">${LETTERS[k]}</span><span>${esc(o.t)}</span></button>`}).join("")}</div>
      ${a&&cfg.mode!=="exam"?`<div class="fb ${a.ok?"ok":"ko"}"><b>${a.ok?"Bonne réponse.":"Pas tout à fait."}</b>${esc(q.ex)}</div>`:""}
      <div class="row" style="margin-top:14px">
        ${cfg.mode==="exam"?`<button class="btn primary" type="button" data-nav="next"${a?"":" disabled"}>${i+1<qs.length?"Valider et continuer":"Terminer l'examen"}</button><button class="btn" type="button" data-nav="stop">Arrêter et voir le résultat</button>`
          :`${a?`<button class="btn primary" type="button" data-nav="next">${i+1<qs.length?"Question suivante":"Voir mon score"}</button>`:""}`}
      </div>`;
  }
  el.addEventListener("click",e=>{
    const o=e.target.closest(".opt");
    if(o&&!o.disabled&&i<qs.length){const k=+o.dataset.k;if(cfg.mode!=="exam"&&ans[i])return;ans[i]={k,ok:qs[i].opts[k].ok};render();return}
    const n=e.target.closest("[data-nav]");if(!n||n.disabled)return;
    if(n.dataset.nav==="next"){i++;render()}
    else if(n.dataset.nav==="stop")finish(false);
    else if(n.dataset.nav==="again")start();
    else if(n.dataset.nav==="errors"){const wrong=qs.filter((q,k)=>!ans[k]||!ans[k].ok).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:q.opts.map(o=>o.t),a:q.opts.findIndex(o=>o.ok)}));start(wrong)}
  });
  function finish(timeout){
    clearInterval(timer);
    const total=qs.length,good=qs.filter((q,k)=>ans[k]&&ans[k].ok).length,pct=Math.round(good/total*100);
    const per={};qs.forEach((q,k)=>{if(!q.d)return;per[q.d]=per[q.d]||[0,0];per[q.d][1]++;if(ans[k]&&ans[k].ok)per[q.d][0]++});
    if(cfg.onDone)cfg.onDone({pct,good,total,per});
    const wrong=qs.map((q,k)=>({q,a:ans[k]})).filter(x=>!x.a||!x.a.ok);
    el.innerHTML=`<div class="qz-end">
      ${timeout?`<p class="note">Temps écoulé : les questions sans réponse comptent comme fausses.</p>`:""}
      <div class="score">${pct} %<small> · ${good} / ${total} bonnes réponses</small></div>
      <p style="margin:0">${pct>=80?"Excellent niveau : vous êtes prêt sur ce périmètre.":pct>=70?"Bon niveau, proche du seuil de réussite. Revoyez les erreurs ci-dessous.":"Niveau à consolider : relisez les concepts et les fiches, puis recommencez."}</p>
      ${Object.keys(per).length>1?`<div class="tblw"><table><thead><tr><th>Domaine</th><th>Score</th></tr></thead><tbody>${Object.keys(per).sort().map(d=>`<tr><td>${d}</td><td>${per[d][0]} / ${per[d][1]} (${Math.round(per[d][0]/per[d][1]*100)} %)</td></tr>`).join("")}</tbody></table></div>`:""}
      <div class="row"><button class="btn primary" type="button" data-nav="again">Recommencer</button>${wrong.length?`<button class="btn" type="button" data-nav="errors">Refaire seulement mes ${wrong.length} erreur${wrong.length>1?"s":""}</button>`:""}</div>
      ${wrong.length?`<h3 style="font-size:17px;margin-top:6px">Correction des erreurs</h3><div class="review">${wrong.map(x=>`<div><p style="margin:0 0 4px;font-weight:600">${esc(x.q.q)}</p><p style="margin:0">Bonne réponse : <strong>${esc(x.q.opts.find(o=>o.ok).t)}</strong>${x.a?` · votre réponse : <b>${esc(x.q.opts[x.a.k].t)}</b>`:" · sans réponse"}</p><p style="margin:4px 0 0;color:var(--muted)">${esc(x.q.ex)}</p></div>`).join("")}</div>`:""}
    </div>`;
  }
  return {start};
}
</script>
<script>const GD={"code": "D3", "num": 3, "name": "Architecture et ingénierie de sécurité", "en": "Security Architecture and Engineering", "pitch": "Concevoir des systèmes sûrs par construction : principes, modèles formels, matériel, architectures modernes, cryptographie et sécurité physique des sites.", "themes": ["Principes de conception sécurisée", "Modèles de sécurité", "Évaluation et assurance", "Architecture matérielle et systèmes", "Vulnérabilités des architectures", "Cryptographie symétrique et hachage", "Cryptographie asymétrique et PKI", "Attaques cryptanalytiques", "Sécurité des sites", "Environnement et incendie"], "items": [[1, "Principes de Saltzer et Schroeder", "Saltzer and Schroeder design principles", "Huit principes de conception sécurisée publiés en 1975 : économie des mécanismes, défauts sûrs, médiation complète, conception ouverte, séparation des privilèges, moindre privilège, moindre mécanisme commun, acceptabilité psychologique.", "Une architecture évaluée principe par principe en revue de conception.", "Ils restent la base des principes modernes (Zero Trust, secure by design).", "Les vieux principes font les murs solides.", "Retenir surtout : moindre privilège, défauts sûrs, médiation complète, conception ouverte.", "D3"], [1, "Moindre mécanisme commun", "Least common mechanism", "Limiter les mécanismes partagés entre utilisateurs, car chaque élément partagé peut devenir un canal de fuite.", "Éviter qu'un même répertoire temporaire serve à tous les utilisateurs.", "Le partage réduit les coûts mais augmente le risque.", "Ce qui est commun à tous profite aussi à l'intrus.", "Lié au risque de canaux cachés.", "D3"], [1, "Acceptabilité psychologique", "Psychological acceptability", "Un mécanisme de sécurité doit être simple à utiliser, sinon les utilisateurs le contournent.", "Authentification sans mot de passe par clé FIDO2 plutôt que règles complexes.", "La meilleure sécurité théorique échoue si elle est contournée.", "La meilleure serrure est celle qu'on utilise.", "Équilibre sécurité et utilisabilité.", "D3 · D5"], [1, "Médiation complète", "Complete mediation", "Chaque accès à chaque objet est vérifié à chaque fois.", "Une API vérifie les droits à chaque requête, pas seulement à la connexion.", "Les caches d'autorisation créent des fenêtres de risque.", "Le gardien contrôle chaque passage.", "Le moniteur de référence la met en œuvre.", "D3 · D8"], [1, "Séparation des privilèges", "Separation of privilege", "Une action sensible exige plusieurs conditions ou plusieurs personnes.", "Deux clés nécessaires pour ouvrir le coffre (contrôle à deux personnes).", "Proche de la séparation des tâches, appliquée aux mécanismes.", "Deux clés valent mieux qu'une.", "Exemples : split knowledge, dual control.", "D3 · D5"], [1, "Zones de confiance", "Trust zones", "Découpage de l'architecture en zones de niveaux de confiance différents, séparées par des contrôles.", "Internet, DMZ, zone applicative, zone base de données.", "Le Zero Trust réduit la confiance accordée même à l'intérieur des zones.", "À chaque frontière, son contrôle.", "Les flux entre zones doivent être filtrés et journalisés.", "D3 · D4"], [1, "Confidentialité dès la conception", "Privacy by design", "Intégrer la protection des données personnelles dès la conception et par défaut.", "Application qui ne collecte la localisation que si nécessaire.", "Exigée par le RGPD.", "Ce qu'on ne collecte pas ne peut pas fuir.", "Sept principes de Cavoukian.", "D3 · D2"], [1, "Responsabilité partagée", "Shared responsibility model", "Répartition des responsabilités de sécurité entre fournisseur cloud et client selon IaaS, PaaS ou SaaS.", "En IaaS, le client corrige ses machines virtuelles.", "Le client reste toujours responsable de ses données et de ses accès.", "Louer la maison ne dispense pas de fermer sa porte.", "Plus on monte vers le SaaS, plus le fournisseur prend en charge.", "D3"], [1, "SASE", "Secure Access Service Edge", "Convergence des fonctions réseau (SD-WAN) et de sécurité (ZTNA, SWG, CASB, FWaaS) livrées depuis le cloud.", "Utilisateurs nomades protégés par le même service où qu'ils soient.", "Concept d'architecture, pas un produit unique.", "La sécurité suit l'utilisateur.", "Ajouté aux principes de conception du plan 2024.", "D3 · D4"], [1, "Ingénierie de la sécurité des systèmes", "Systems security engineering (NIST SP 800-160)", "Intégration de la sécurité dans tout le cycle d'ingénierie d'un système, des besoins au retrait.", "Exigences de sécurité définies avec les exigences fonctionnelles.", "La sécurité ajoutée à la fin coûte plus cher et protège moins.", "On ne pose pas les fondations après le toit.", "Approche cycle de vie, objectif 3.10.", "D3 · D8"], [2, "Modèle à états", "State machine model", "Un système est sûr s'il démarre dans un état sûr et que chaque transition aboutit à un état sûr.", "Un système qui reste sûr même en cas d'erreur de démarrage.", "Base de nombreux modèles formels, dont Bell-LaPadula.", "D'un pas sûr à un pas sûr.", "Secure state = toutes les transitions préservent la sécurité.", "D3"], [2, "Modèle de flux d'information", "Information flow model", "Contrôle les flux d'information entre niveaux de sécurité, quelle qu'en soit la direction.", "Empêcher l'information de passer d'un niveau haut à un niveau bas.", "Aide à repérer les canaux cachés.", "L'eau suit la pente, l'information aussi.", "Bell-LaPadula et Biba sont aussi des modèles de flux.", "D3"], [2, "Non-interférence", "Noninterference model", "Les actions d'un niveau élevé ne doivent avoir aucun effet observable par un niveau inférieur.", "Un utilisateur bas niveau ne peut pas déduire l'activité d'un utilisateur haut niveau.", "Vise à empêcher l'inférence et les canaux cachés.", "Le silence ne doit rien révéler.", "Variante plus stricte des modèles de flux.", "D3"], [2, "Modèle en treillis", "Lattice-based model", "Les sujets et objets sont placés dans un treillis de niveaux avec bornes supérieures et inférieures.", "Niveaux combinés à des compartiments (projets).", "Fondement du contrôle d'accès obligatoire.", "Chacun à sa place, entre ses bornes.", "Associé au MAC.", "D3 · D5"], [2, "Bell-LaPadula", "Bell-LaPadula model", "Modèle de confidentialité : pas de lecture au-dessus (simple security), pas d'écriture en dessous (propriété étoile), strong star = seulement à son niveau.", "Un agent « Secret » ne lit pas le « Top Secret » et n'écrit pas dans le « Public ».", "Ne traite ni l'intégrité ni les canaux cachés.", "Ce que tu sais ne descend pas l'escalier.", "No read up, no write down.", "D3"], [2, "Biba", "Biba model", "Modèle d'intégrité : pas de lecture en dessous, pas d'écriture au-dessus.", "Un processus fiable ne lit pas de données non vérifiées.", "Miroir de Bell-LaPadula ; ne protège pas la confidentialité.", "L'eau propre ne se mélange pas à l'eau sale.", "No read down, no write up.", "D3"], [2, "Clark-Wilson", "Clark-Wilson model", "Modèle d'intégrité commerciale : accès aux données contraintes uniquement via des procédures certifiées, avec séparation des tâches.", "Un caissier modifie les comptes uniquement via l'application bancaire.", "Plus adapté au monde de l'entreprise que Biba.", "Le chemin contrôlé garde la donnée juste.", "CDI, UDI, TP, IVP ; triplet sujet-programme-objet.", "D3"], [2, "Brewer-Nash", "Brewer-Nash (Chinese Wall) model", "Accès dynamique : après avoir consulté un client, l'accès à ses concurrents est bloqué.", "Un consultant de la banque A n'accède plus à la banque B.", "Protège contre les conflits d'intérêts.", "On ne sert pas deux maîtres rivaux.", "Mot-clé : conflit d'intérêts.", "D3"], [2, "Graham-Denning", "Graham-Denning model", "Huit règles de protection pour créer, supprimer et transférer en toute sécurité des sujets, objets et droits.", "Règles de délégation de droits d'un objet.", "Porte sur la gestion des droits, pas sur les niveaux.", "Donner un droit est un acte qui se contrôle.", "8 règles ; HRU l'étend avec une matrice d'accès.", "D3"], [2, "Take-Grant", "Take-Grant model", "Graphe orienté décrivant comment les droits se transmettent : prendre, accorder, créer, supprimer.", "Analyse de la propagation des droits dans un système.", "Utile pour détecter des chemins de fuite de privilèges.", "Un droit transmis peut en appeler d'autres.", "Take, grant, create, remove.", "D3"], [3, "Critères communs", "Common Criteria (ISO/IEC 15408)", "Cadre international d'évaluation de la sécurité des produits informatiques.", "Pare-feu certifié EAL4+.", "Une certification ne vaut que pour la configuration évaluée.", "Le label rassure, la configuration protège.", "A remplacé TCSEC et ITSEC.", "D3"], [3, "Profil de protection", "Protection Profile (PP)", "Expression des besoins de sécurité pour une catégorie de produits, indépendamment d'un fabricant.", "Profil de protection pour les cartes à puce.", "C'est la demande du client.", "Dire ce que l'on veut avant de choisir.", "PP = besoin.", "D3"], [3, "Cible de sécurité", "Security Target (ST)", "Description des fonctions de sécurité que le produit prétend fournir.", "Le fabricant décrit ce que son pare-feu garantit.", "C'est l'offre du fabricant.", "Promettre clairement pour être vérifié.", "ST = prétentions ; TOE = produit évalué.", "D3"], [3, "Niveau d'assurance de l'évaluation", "Evaluation Assurance Level (EAL)", "Profondeur de l'évaluation, de EAL1 (testé fonctionnellement) à EAL7 (conception vérifiée formellement).", "EAL5 pour une puce de passeport.", "Un EAL élevé ne signifie pas un produit plus fonctionnel.", "La rigueur du test, pas la force du produit.", "EAL1 fonctionnel, EAL4 conçu méthodiquement, EAL7 formel.", "D3"], [3, "Livre orange", "TCSEC (Orange Book)", "Ancien critère américain d'évaluation des systèmes de confiance, avec des classes D, C, B, A.", "Historique : systèmes militaires classés B2.", "Remplacé par les Common Criteria.", "Connaître l'histoire aide à lire le présent.", "Centré sur la confidentialité.", "D3"], [3, "ITSEC", "ITSEC", "Ancien critère européen qui séparait fonctionnalité et assurance.", "Historique européen avant les Common Criteria.", "Remplacé par les Common Criteria.", "Le passé éclaire les normes d'aujourd'hui.", "Introduisait la distinction fonctionnalité / assurance.", "D3"], [3, "Certification", "Certification", "Évaluation technique détaillée des contrôles d'un système dans son environnement.", "Évaluation de la conformité d'un système avant production.", "Ce n'est pas une décision d'exploitation.", "Mesurer avant de décider.", "Certification = technique.", "D3 · D1"], [3, "Accréditation", "Accreditation / Authorization", "Décision formelle de la direction d'accepter le risque et d'autoriser l'exploitation du système.", "Le directeur signe l'autorisation d'exploiter.", "Accréditation = décision ; certification = évaluation.", "La signature vaut engagement.", "Dans le RMF : Authorize / ATO.", "D3 · D1"], [3, "Base informatique de confiance", "Trusted Computing Base (TCB)", "Ensemble des composants matériels, logiciels et firmware qui assurent la politique de sécurité.", "Noyau, mécanismes d'authentification, TPM.", "Plus la TCB est petite, plus elle est vérifiable.", "Peu d'éléments, bien gardés.", "Une faille dans la TCB compromet tout le système.", "D3"], [3, "Moniteur de référence", "Reference monitor", "Concept abstrait qui contrôle chaque accès : toujours invoqué, inviolable, vérifiable.", "Le noyau qui vérifie chaque ouverture de fichier.", "Le noyau de sécurité (security kernel) est sa mise en œuvre.", "Le gardien doit voir toutes les portes.", "Mnémo TIV : toujours invoqué, inviolable, vérifiable.", "D3"], [4, "Anneaux de protection", "Protection rings", "Niveaux de privilège du processeur : anneau 0 pour le noyau, anneau 3 pour les applications.", "Une application ne peut pas accéder directement au matériel.", "Plus le numéro est bas, plus le privilège est élevé.", "Plus on approche du cœur, plus la porte est gardée.", "Ring 0 = noyau ; ring 3 = utilisateur.", "D3"], [4, "Mode noyau et mode utilisateur", "Kernel mode / User mode", "Le processeur exécute le code privilégié en mode noyau et les applications en mode utilisateur.", "Un appel système fait passer temporairement en mode noyau.", "Un pilote vulnérable donne accès au mode noyau.", "Le pouvoir se prête, il ne se donne pas.", "Lié aux anneaux de protection.", "D3"], [4, "Isolation des processus", "Process isolation", "Chaque processus dispose de son propre espace mémoire, inaccessible aux autres.", "Un navigateur isole chaque onglet dans un processus.", "Les failles matérielles (Spectre, Meltdown) ont contourné cette isolation.", "Chaque chambre a sa clé.", "Fondement de la multitâche sécurisée.", "D3"], [4, "Module de plateforme sécurisée", "Trusted Platform Module (TPM)", "Puce sur la carte mère qui stocke clés et mesures d'intégrité du démarrage.", "BitLocker stocke sa clé dans le TPM.", "Lié à une machine précise.", "Le secret soudé à la machine.", "Sert au démarrage mesuré et au chiffrement de disque.", "D3 · D2"], [4, "Module matériel de sécurité", "Hardware Security Module (HSM)", "Équipement dédié et certifié qui génère, stocke et utilise des clés cryptographiques.", "HSM d'une autorité de certification ou d'une banque.", "Plus robuste et coûteux qu'un TPM.", "Le coffre des clés a son propre coffre.", "Souvent certifié FIPS 140-2/140-3.", "D3"], [4, "Démarrage sécurisé", "Secure boot / Measured boot", "Secure boot n'exécute que du code signé ; measured boot enregistre une empreinte de chaque étape.", "Blocage d'un bootkit au démarrage.", "Les deux sont complémentaires.", "Bien commencer, c'est déjà protéger.", "S'appuie sur l'UEFI et le TPM.", "D3"], [4, "Hyperviseur", "Hypervisor", "Logiciel qui exécute des machines virtuelles. Type 1 : directement sur le matériel. Type 2 : sur un système hôte.", "VMware ESXi (type 1), VirtualBox (type 2).", "Le type 1 offre une surface d'attaque plus réduite.", "Le gardien des maisons voisines doit être sûr.", "Compromettre l'hyperviseur, c'est compromettre toutes les VM.", "D3"], [4, "Conteneurs", "Containers", "Environnements isolés qui partagent le noyau de l'hôte.", "Applications déployées dans des conteneurs Docker orchestrés par Kubernetes.", "Isolation plus faible qu'une VM.", "Voisins proches, murs fins.", "Images signées, analyse des vulnérabilités, pas d'exécution en root.", "D3 · D8"], [4, "Micrologiciel", "Firmware / UEFI", "Logiciel bas niveau intégré au matériel, qui s'exécute avant le système.", "Mise à jour du firmware d'un routeur.", "Une compromission y survit à la réinstallation du système.", "Ce qui est enfoui est difficile à nettoyer.", "Mettre à jour et vérifier la signature des firmwares.", "D3"], [4, "Mémoire protégée", "Memory protection", "Mécanismes qui empêchent un processus d'accéder à la mémoire d'un autre ou d'exécuter des données.", "DEP empêche l'exécution du code placé sur la pile.", "Contournable par des techniques avancées (ROP).", "Chaque espace a ses limites.", "ASLR et DEP compliquent l'exploitation des dépassements de tampon.", "D3 · D8"], [5, "Agrégation", "Aggregation", "Combinaison d'informations peu sensibles qui devient sensible une fois réunie.", "Les plannings de déplacement réunis révèlent l'emploi du temps du DG.", "Le tout peut être plus sensible que chaque partie.", "Plusieurs gouttes font la rivière.", "Contrôler l'accès aux combinaisons de données.", "D3 · D2"], [5, "Inférence", "Inference", "Déduction d'une information cachée à partir d'informations accessibles.", "Déduire un salaire individuel en comparant deux moyennes.", "L'attaquant n'a pas besoin d'accès direct.", "Plusieurs indices font une preuve.", "Contre-mesures : polyinstanciation, perturbation, restriction des requêtes.", "D3 · D2"], [5, "Polyinstanciation", "Polyinstantiation", "Plusieurs versions d'un même enregistrement selon le niveau d'habilitation de l'utilisateur.", "Un navire affiché « en mission de ravitaillement » aux bas niveaux.", "Elle évite l'inférence, mais complique la cohérence.", "Chacun voit ce qu'il doit voir.", "Contre-mesure classique de l'inférence.", "D3"], [5, "Canal caché", "Covert channel", "Communication non prévue qui contourne la politique de sécurité. Temporel (timing) ou de stockage.", "Moduler l'usage du processeur pour transmettre des bits.", "Difficile à détecter et à supprimer totalement.", "Là où la parole est interdite, on parle par signes.", "Covert timing channel / covert storage channel.", "D3"], [5, "Évasion de machine virtuelle", "VM escape", "Attaque qui permet de sortir d'une VM pour atteindre l'hyperviseur ou d'autres VM.", "Exploitation d'une faille de pilote virtuel.", "Rare mais critique.", "Un mur fin entre voisins se perce.", "Correctifs de l'hyperviseur et séparation des charges sensibles.", "D3"], [5, "Objets connectés", "Internet of Things (IoT)", "Équipements connectés aux ressources limitées, souvent mal sécurisés et rarement mis à jour.", "Caméras IP avec mot de passe par défaut.", "Ils se comptent par milliers et échappent souvent à l'inventaire.", "Ce qui est petit peut ouvrir grand.", "Segmenter, changer les mots de passe, inventorier.", "D3 · D4"], [5, "Systèmes de contrôle industriels", "ICS / SCADA", "Systèmes qui pilotent des processus physiques ; la disponibilité et la sûreté priment.", "Automates d'une usine de traitement d'eau.", "Un correctif mal testé peut arrêter la production.", "Ce qui fait tourner l'usine ne se redémarre pas à la légère.", "Segmentation forte, surveillance passive, accès distant contrôlé.", "D3 · D4"], [5, "Systèmes embarqués et temps réel", "Embedded and real-time systems", "Systèmes dédiés intégrés à des équipements, souvent avec contraintes de temps strictes.", "Calculateur de voiture, dispositif médical.", "Mises à jour difficiles, durée de vie longue.", "Ce qui ne se met pas à jour doit être isolé.", "Contrôles : firmware signé, segmentation, durcissement.", "D3"], [5, "Informatique sans serveur", "Serverless computing", "Fonctions exécutées à la demande par le fournisseur cloud, sans gestion de serveurs.", "Fonction déclenchée à chaque dépôt de fichier.", "Moins d'infrastructure à gérer, mais plus de permissions et d'API à sécuriser.", "Moins de murs, plus de portes.", "Risques : permissions excessives, injection d'événements, secrets.", "D3"], [5, "Microservices et informatique en périphérie", "Microservices / Edge computing", "Applications découpées en petits services communiquant par API ; traitements rapprochés de la source des données.", "Plateforme de paiement en 40 microservices.", "La surface d'attaque se déplace vers les API et les échanges.", "Plus de pièces, plus de serrures.", "Authentification mutuelle (mTLS) entre services.", "D3 · D8"], [6, "Chiffrement symétrique", "Symmetric encryption", "Une même clé secrète chiffre et déchiffre. Rapide, adapté aux gros volumes.", "AES pour chiffrer un disque.", "Problème : distribuer la clé en sécurité.", "Le même secret ouvre et ferme.", "Nombre de clés : n(n−1)/2.", "D3"], [6, "Chiffrement par bloc et par flot", "Block cipher / Stream cipher", "Bloc : chiffre des blocs de taille fixe. Flot : chiffre bit à bit ou octet par octet avec un flux de clé.", "AES (bloc), ChaCha20 (flot).", "Un flux de clé réutilisé casse le chiffrement par flot.", "Chaque outil a son rythme.", "RC4 est un chiffrement par flot cassé.", "D3"], [6, "AES", "Advanced Encryption Standard (Rijndael)", "Standard symétrique par blocs de 128 bits, avec clés de 128, 192 ou 256 bits.", "AES-256 pour les données sensibles.", "Sa sécurité dépend aussi du mode utilisé.", "Le standard éprouvé vaut mieux que le secret maison.", "Remplaçant de DES depuis 2001.", "D3"], [6, "DES et Triple DES", "DES / 3DES", "DES : clé effective de 56 bits, cassé. 3DES : trois passes, aujourd'hui obsolète.", "Systèmes anciens à migrer vers AES.", "Le double DES ne gagne presque rien (meet-in-the-middle).", "Le vieux rempart ne tient plus.", "DES : bloc 64 bits, 16 tours.", "D3"], [6, "Mode ECB", "Electronic Codebook (ECB)", "Chaque bloc est chiffré indépendamment : des blocs identiques donnent des chiffrés identiques.", "L'image d'un logo chiffrée en ECB reste reconnaissable.", "À proscrire pour les données réelles.", "Le masque qui laisse voir les traits ne cache rien.", "Seul mode sans vecteur d'initialisation.", "D3"], [6, "Mode CBC", "Cipher Block Chaining (CBC)", "Chaque bloc clair est combiné au bloc chiffré précédent avant chiffrement ; nécessite un IV.", "Chiffrement de fichiers dans d'anciens protocoles.", "Sensible aux attaques par oracle de remplissage (padding oracle).", "Chaque maillon dépend du précédent.", "Une erreur se propage au bloc suivant.", "D3"], [6, "Chiffrement authentifié", "Authenticated encryption (GCM)", "Mode qui assure à la fois confidentialité et intégrité, comme AES-GCM.", "TLS 1.3 utilise uniquement des modes authentifiés.", "Réutiliser un nonce avec GCM est catastrophique.", "Cacher et sceller en un seul geste.", "AEAD = Authenticated Encryption with Associated Data.", "D3"], [6, "Vecteur d'initialisation", "Initialization vector (IV) / Nonce", "Valeur aléatoire ou unique qui garantit que deux chiffrements du même message diffèrent.", "Nouvel IV pour chaque paquet chiffré.", "Un IV prévisible ou réutilisé affaiblit le chiffrement.", "Ne jamais repasser deux fois par le même chemin.", "WEP a été cassé en partie à cause de ses IV trop courts.", "D3"], [6, "Fonction de hachage", "Hash function", "Fonction à sens unique qui produit une empreinte de taille fixe ; toute modification change l'empreinte.", "SHA-256 d'un fichier téléchargé.", "Un hachage ne prouve pas l'origine.", "L'empreinte ne ment pas.", "MD5 et SHA-1 sont obsolètes ; SHA-2 et SHA-3 recommandés.", "D3"], [6, "HMAC", "Hash-based Message Authentication Code", "Hachage combiné à une clé secrète partagée : prouve l'intégrité et l'origine entre deux parties.", "Signature des messages d'une API avec une clé partagée.", "Pas de non-répudiation : la clé est partagée.", "Le secret partagé lie, il ne désigne pas.", "HMAC = intégrité + authentification, sans non-répudiation.", "D3"], [7, "Chiffrement asymétrique", "Asymmetric (public key) encryption", "Paire de clés : la publique chiffre ou vérifie, la privée déchiffre ou signe.", "Échange de clé de session dans TLS.", "Beaucoup plus lent que le symétrique.", "Ce que l'un ferme, seul l'autre ouvre.", "Nombre de clés : 2n.", "D3"], [7, "RSA", "RSA", "Algorithme asymétrique fondé sur la difficulté de factoriser de grands nombres.", "Clés RSA de 2048 ou 3072 bits pour les certificats.", "Menacé à terme par l'informatique quantique.", "Le grand nombre garde le secret.", "Utilisé pour le chiffrement et la signature.", "D3"], [7, "Cryptographie sur courbes elliptiques", "Elliptic Curve Cryptography (ECC)", "Asymétrique fondée sur les courbes elliptiques ; sécurité égale avec des clés plus courtes.", "ECC 256 bits ≈ RSA 3072 bits ; idéal pour les mobiles.", "Également vulnérable au quantique.", "Petite clé, grande force.", "Adaptée aux appareils à ressources limitées.", "D3"], [7, "Diffie-Hellman", "Diffie-Hellman key exchange", "Protocole permettant à deux parties d'établir une clé secrète commune sur un canal non sûr.", "ECDHE dans TLS pour la confidentialité persistante.", "Sans authentification, il est vulnérable à l'homme du milieu.", "Se mettre d'accord sans jamais se montrer le secret.", "Il échange des clés ; il ne chiffre pas les données.", "D3"], [7, "Signature numérique", "Digital signature", "Empreinte du message chiffrée avec la clé privée de l'émetteur : intégrité, authenticité, non-répudiation.", "Mise à jour logicielle signée par l'éditeur.", "Elle prouve l'origine, pas l'innocuité du contenu.", "Ma signature engage ma main.", "Signer avec MA privée ; vérifier avec SA publique.", "D3"], [7, "Certificat X.509", "X.509 certificate", "Document signé par une autorité de certification qui lie une clé publique à une identité.", "Certificat TLS d'un site bancaire.", "Un certificat expiré ou révoqué ne doit plus être accepté.", "La confiance se délègue, elle se vérifie aussi.", "Contient : sujet, émetteur, clé publique, validité, signature.", "D3"], [7, "Autorité de certification", "Certificate Authority (CA) / Registration Authority (RA)", "La CA signe les certificats ; la RA vérifie l'identité des demandeurs.", "CA interne pour les certificats des serveurs.", "La CA racine doit rester hors ligne.", "La racine protège tout l'arbre.", "Compromission de la CA = tous ses certificats douteux.", "D3"], [7, "Révocation des certificats", "CRL / OCSP", "CRL : liste des certificats révoqués. OCSP : vérification en ligne de l'état d'un certificat.", "Révocation immédiate après fuite d'une clé privée.", "L'OCSP stapling évite de solliciter la CA à chaque connexion.", "Ce qui a perdu la confiance doit le savoir publiquement.", "Révoquer dès qu'une clé privée est compromise.", "D3"], [7, "Séquestre de clés", "Key escrow / Key recovery", "Copie des clés confiée à un tiers de confiance pour pouvoir récupérer les données.", "Récupération des fichiers chiffrés d'un employé parti.", "Le séquestre est lui-même une cible.", "Le double de la clé se garde mieux que l'original.", "Associer au contrôle à deux personnes (split knowledge).", "D3"], [7, "Cryptographie post-quantique", "Post-quantum cryptography", "Algorithmes résistants aux ordinateurs quantiques, standardisés par le NIST en 2024 (ML-KEM, ML-DSA).", "Inventaire des usages de RSA et ECC pour planifier la migration.", "Les données chiffrées aujourd'hui peuvent être déchiffrées demain (« récolter maintenant »).", "Prévoir l'orage avant qu'il n'éclate.", "Commencer par l'inventaire cryptographique (crypto-agilité).", "D3"], [8, "Force brute", "Brute-force attack", "Essai de toutes les clés possibles jusqu'à trouver la bonne.", "Casser une clé DES de 56 bits.", "Contrée par la longueur de clé.", "La patience vient à bout des petites serrures.", "Le facteur de travail mesure l'effort nécessaire.", "D3"], [8, "Texte chiffré seul", "Ciphertext-only attack", "L'attaquant ne dispose que de textes chiffrés.", "Interception de messages chiffrés.", "La plus difficile pour l'attaquant.", "Moins on en sait, plus le chemin est long.", "Souvent combinée à l'analyse de fréquence.", "D3"], [8, "Texte clair connu", "Known-plaintext attack", "L'attaquant possède des paires de textes clairs et chiffrés.", "Formules de politesse connues dans des messages chiffrés.", "Exploitée historiquement contre Enigma.", "Un mot connu ouvre souvent le reste.", "Il connaît des paires, sans les choisir.", "D3"], [8, "Texte clair choisi", "Chosen-plaintext attack", "L'attaquant choisit des textes clairs et obtient leur chiffrement.", "Faire chiffrer des données choisies par un service.", "Plus puissante que le texte clair connu.", "Qui choisit la question oriente la réponse.", "Variante : texte chiffré choisi (chosen-ciphertext).", "D3"], [8, "Attaque des anniversaires", "Birthday attack", "Exploite la probabilité élevée de collisions pour trouver deux messages de même empreinte.", "Collisions MD5 utilisées pour forger des certificats.", "Le facteur de travail d'une collision est la racine carrée de l'espace.", "À 23 personnes, deux partagent souvent un anniversaire.", "Contre-mesure : hachages longs (SHA-256 et plus).", "D3"], [8, "Attaque par le milieu", "Meet-in-the-middle attack", "Attaque qui chiffre d'un côté et déchiffre de l'autre pour se rejoindre au milieu.", "Raison pour laquelle le 2DES n'apporte presque rien.", "À ne pas confondre avec l'homme du milieu (MITM réseau).", "Deux murs l'un derrière l'autre ne valent pas toujours le double.", "Explique le passage direct de DES à 3DES.", "D3"], [8, "Attaque par canal auxiliaire", "Side-channel attack", "Exploitation de fuites physiques : temps de calcul, consommation, émissions électromagnétiques.", "Mesurer la consommation d'une carte à puce pour retrouver sa clé.", "L'algorithme peut être sûr et l'implémentation vulnérable.", "Le corps trahit ce que la bouche tait.", "TEMPEST concerne les émanations électromagnétiques.", "D3"], [8, "Attaque par rejeu", "Replay attack", "Réutilisation d'un message ou jeton intercepté pour se faire passer pour l'émetteur.", "Rejouer une demande d'authentification capturée.", "Contrée par horodatage, nonces et numéros de séquence.", "Ce qui a servi hier ne doit pas servir demain.", "Kerberos utilise l'horodatage contre le rejeu.", "D3 · D5"], [8, "Analyse de fréquence", "Frequency analysis", "Étude de la fréquence des lettres pour casser les chiffrements par substitution.", "Casser un chiffre de César.", "Inefficace contre les algorithmes modernes.", "Les habitudes trahissent.", "Exemple d'attaque par texte chiffré seul.", "D3"], [8, "Attaque par injection de fautes", "Fault injection attack", "Provoquer des erreurs matérielles (tension, laser) pour extraire des secrets.", "Perturber l'alimentation d'une puce pendant un calcul RSA.", "Attaque d'implémentation, pas d'algorithme.", "Le geste brusque fait tomber le secret.", "Contre-mesures matérielles des HSM et cartes à puce.", "D3"], [9, "Prévention par l'aménagement", "Crime Prevention Through Environmental Design (CPTED)", "Approche qui réduit la délinquance par la conception des lieux.", "Accueil vitré, chemins dégagés, éclairage des parkings.", "Elle complète, sans remplacer, les contrôles techniques.", "Un lieu bien pensé décourage le malveillant.", "Trois stratégies : surveillance naturelle, contrôle naturel des accès, renforcement territorial.", "D3"], [9, "Surveillance naturelle", "Natural surveillance", "Aménagement qui maximise la visibilité des lieux par les occupants et passants.", "Fenêtres donnant sur l'entrée, haies basses.", "La visibilité dissuade sans caméra.", "Ce qui est vu est protégé.", "Stratégie CPTED.", "D3"], [9, "Contrôle naturel des accès", "Natural access control", "Guider les personnes vers les entrées contrôlées par l'aménagement.", "Chemins, bornes et végétation qui mènent à l'accueil.", "Réduit les entrées dérobées.", "Le chemin tracé conduit au gardien.", "Stratégie CPTED.", "D3"], [9, "Renforcement territorial", "Territorial reinforcement", "Marquer clairement les limites de propriété pour signaler le contrôle des lieux.", "Clôtures, signalétique, marquage au sol.", "Crée un sentiment d'appartenance et de surveillance.", "Chez soi, on veille mieux.", "Stratégie CPTED.", "D3"], [9, "Sas d'accès", "Mantrap / Access control vestibule", "Espace à deux portes où une seule peut s'ouvrir à la fois, contre le talonnage.", "Entrée du datacenter avec badge et biométrie.", "Doit permettre l'évacuation en cas d'urgence.", "Une porte à la fois, une personne à la fois.", "Contre le tailgating et le piggybacking.", "D3 · D7"], [9, "Clôtures et barrières", "Fencing and bollards", "Barrières physiques qui dissuadent et retardent ; les bornes bloquent les véhicules.", "Clôture de 2,4 m avec barbelés autour d'un site sensible.", "Environ 1 m arrête le passant, 2,4 m freine l'intrus déterminé.", "Le mur arrête le passant, pas le déterminé.", "Bornes (bollards) contre les attaques à la voiture-bélier.", "D3"], [9, "Éclairage de sécurité", "Security lighting", "Éclairage qui dissuade, facilite la surveillance et la détection.", "Projecteurs à détection de mouvement autour du site.", "Un éclairage mal orienté éblouit les gardiens.", "La lumière chasse l'intrus.", "Repère classique : environ 2 pieds-bougies à 8 pieds de hauteur.", "D3"], [9, "Emplacement de la salle serveurs", "Server room placement", "Salle au cœur du bâtiment, sans fenêtres, ni au sous-sol (inondation) ni au dernier étage (toit).", "Salle serveurs au premier étage central.", "Éviter la proximité de canalisations d'eau.", "Le trésor dort au centre de la maison.", "Accès restreint et journalisé.", "D3"], [9, "Locaux techniques", "Wiring closets / Intermediate distribution frames", "Locaux de câblage réseau, souvent négligés mais critiques.", "Armoire réseau d'étage verrouillée et surveillée.", "Un accès au local technique permet d'écouter ou couper le réseau.", "Les petites portes ouvrent les grandes salles.", "À protéger comme la salle serveurs.", "D3 · D4"], [9, "Zones à accès restreint", "Restricted and work area security", "Zones de sécurité concentriques avec contrôles croissants, y compris salles de preuves et de supports.", "Salle de stockage des preuves avec registre d'accès.", "Les visiteurs doivent être escortés.", "Plus on avance, plus on prouve.", "Les contrôles se renforcent vers le centre.", "D3 · D7"], [10, "Classes de feu", "Fire classes", "Classification américaine : A combustibles ordinaires, B liquides, C électrique, D métaux, K cuisine. Le feu exige combustible, comburant et chaleur.", "Feu électrique en salle serveurs : classe C.", "Les classes européennes diffèrent ; l'examen utilise les classes américaines.", "Pas de feu sans combustible, comburant et chaleur.", "Classe C : ne pas utiliser d'eau tant que le courant n'est pas coupé.", "D3"], [10, "Détection incendie", "Fire detection", "Détecteurs de fumée (ionisation, optique), de chaleur (seuil ou vitesse d'élévation) et de flamme (infrarouge, UV).", "Détection précoce par aspiration (VESDA) en salle serveurs.", "La détection de fumée est plus précoce que celle de chaleur.", "Le feu se voit d'abord à sa fumée.", "La détection déclenche alarme et extinction.", "D3"], [10, "Sprinkler sous eau", "Wet pipe system", "Canalisations remplies d'eau en permanence ; l'eau sort dès qu'une tête fond.", "Bureaux classiques.", "Risque de fuite et de déclenchement accidentel sur les serveurs.", "L'eau prête est aussi l'eau qui fuit.", "Le plus courant et le plus simple.", "D3"], [10, "Sprinkler sous air", "Dry pipe system", "Canalisations remplies d'air comprimé ; l'eau n'arrive qu'en cas de déclenchement.", "Entrepôts non chauffés exposés au gel.", "Réaction un peu plus lente.", "Attendre le signal avant d'agir.", "Adapté aux zones froides.", "D3"], [10, "Système déluge", "Deluge system", "Toutes les têtes ouvertes déversent simultanément de grandes quantités d'eau.", "Sites industriels à haut risque.", "Inadapté aux équipements informatiques.", "Noyer le feu noie aussi les machines.", "Jamais pour une salle serveurs.", "D3"], [10, "Système à pré-action", "Pre-action system", "Canalisations sèches qui se remplissent sur alarme ; l'eau ne sort que si une tête fond aussi.", "Salle serveurs protégée par pré-action.", "Deux conditions limitent les déclenchements accidentels.", "Deux signaux avant d'agir.", "Meilleure option à eau pour les datacenters.", "D3"], [10, "Extinction par gaz", "Gaseous fire suppression", "Gaz qui éteignent sans eau : inertes (argon, azote) ou chimiques (FM-200). Le halon est interdit pour sa nocivité.", "Salle d'archives protégée par gaz inerte.", "Évacuer avant le déclenchement : risque pour les personnes.", "Protéger les machines sans oublier les hommes.", "Halon interdit (couche d'ozone).", "D3"], [10, "Onduleur et groupe électrogène", "UPS and generator", "L'onduleur assure la continuité immédiate ; le groupe électrogène prend le relais sur la durée.", "Onduleur 15 minutes, groupe électrogène pour plusieurs jours.", "Un groupe non testé tombe le jour où on en a besoin.", "Prévoir l'ombre avant la panne.", "Tester régulièrement sous charge ; prévoir le carburant.", "D3 · D7"], [10, "Perturbations électriques", "Power anomalies", "Fault (perte brève), blackout (perte longue), sag (baisse brève), brownout (baisse longue), spike (surtension brève), surge (surtension longue), inrush (appel au démarrage).", "Brownout fréquent lors des délestages.", "Momentané vs prolongé : retenir les paires.", "Le courant instable abîme en silence.", "Perte : fault/blackout ; baisse : sag/brownout ; hausse : spike/surge.", "D3"], [10, "Climatisation et humidité", "HVAC and humidity", "Contrôle de la température et de l'humidité pour protéger les équipements.", "Humidité entre 40 et 60 % en salle serveurs.", "Trop sec : électricité statique ; trop humide : corrosion.", "La chaleur et l'eau sont des attaquants silencieux.", "Pression positive pour éviter l'entrée de poussière et fumée.", "D3"]]};</script>

  <p class="gcount" id="cnt"></p>
  <div id="view"></div>
  <p class="foot">Votre progression est enregistrée dans ce navigateur. Les termes anglais entre parenthèses sont ceux de l'examen.</p>
</main>`;

function stats(){$("#s-k").textContent=known.size;$("#s-r").textContent=rev.size;$("#s-m").style.width=(known.size/C.length*100)+"%"}
function list(){return C.filter(c=>(!F.q||F.q.split(/\s+/).every(w=>c.hay.includes(w)))&&(!F.th||String(c.th)===F.th)&&
  (F.st==="all"||(F.st==="todo"&&!known.has(c.n))||(F.st==="rev"&&rev.has(c.n))||(F.st==="known"&&known.has(c.n))))}
function card(c){const o=open.has(c.n);
  return `<article class="gc${known.has(c.n)?" known":rev.has(c.n)?" rev":""}" id="c${c.n}" data-n="${c.n}">
  <div class="gc-h"><span class="num">${pad(c.n)}</span><h3>${esc(c.fr)} <span class="enx">(${esc(c.en)})</span></h3>
  <div class="gc-tags">${c.dom.split(" · ").map(x=>`<span class="tag">${x}</span>`).join("")}${known.has(c.n)?`<span class="tag ok">✓ connu</span>`:""}${rev.has(c.n)?`<span class="tag wa">↻ à revoir</span>`:""}</div></div>
  <p class="def">${esc(c.def)}</p>
  ${o?`<div class="gc-more">
    <div class="blk"><h4>Exemple</h4><p>${esc(c.ex)}</p></div>
    <div class="blk nu"><h4>Nuance</h4><p>${esc(c.nu)}</p></div>
    <div class="blk tip"><h4>Tip examen</h4><p>${esc(c.tip)}</p></div>
    <p class="sag">${esc(c.sag)}</p></div>`:""}
  <div class="gc-acts"><button class="lnk" type="button" data-a="open">${o?"Masquer le détail":"Exemple, nuance, sagesse et tip"}</button>
    <span style="flex:1"></span>
    <button class="btn${known.has(c.n)?" primary":""}" type="button" data-a="known">${known.has(c.n)?"✓ Connu":"Je connais"}</button>
    <button class="btn" type="button" data-a="rev">${rev.has(c.n)?"Retirer":"À revoir"}</button></div>
</article>`}
function mark(kind,n){if(kind==="known"){if(known.has(n))known.delete(n);else{known.add(n);rev.delete(n)}}else{if(rev.has(n))rev.delete(n);else{rev.add(n);known.delete(n)}}save()}

let deck=[],pos=0,flip=false;
function render(){
  const L=list();
  $("#cnt").innerHTML=`<b>${L.length}</b> concept${L.length>1?"s":""} sur ${C.length}`;
  const v=$("#view");
  if(F.view==="cards"){
    if(!L.length){v.innerHTML=`<div class="empty">Aucun concept ne correspond.</div>`;return}
    const by=new Map();L.forEach(c=>{if(!by.has(c.th))by.set(c.th,[]);by.get(c.th).push(c)});
    v.innerHTML=[...by].map(([t,cs])=>`<h2 class="th-h"><span class="n">${String(t).padStart(2,"0")}</span>${esc(d.themes[t-1])} <small>${cs.length}</small></h2><div class="gcards">${cs.map(card).join("")}</div>`).join("");
  } else if(F.view==="flash"){
    deck=L.map(c=>c.n);if(pos>=deck.length)pos=0;flash();
  } else if(F.view==="az"){
    const s=L.slice().sort((a,b)=>a.fr.localeCompare(b.fr,"fr"));
    const letters=[...new Set(s.map(c=>norm(c.fr)[0].toUpperCase()))];
    let last="";
    v.innerHTML=`<div class="az-letters">${letters.map(l=>`<a href="#az-${l}">${l}</a>`).join("")}</div><div class="card"><div class="tblw"><table class="az"><thead><tr><th>Terme</th><th>Définition</th></tr></thead><tbody>${s.map(c=>{const l=norm(c.fr)[0].toUpperCase();const head=l!==last?`<tr class="lt" id="az-${l}"><td colspan="2">${l}</td></tr>`:"";last=l;return head+`<tr><td>${esc(c.fr)}<small>${esc(c.en)}</small></td><td>${esc(c.def)}</td></tr>`}).join("")}</tbody></table></div></div>`;
  } else {
    const pool=L.length>=4?L:C;
    const qs=shuffle(pool).slice(0,Math.min(20,pool.length)).map(c=>{const others=shuffle(C.filter(x=>x.n!==c.n)).slice(0,3);
      return {q:"Quel terme correspond à cette définition ? « "+c.def+" »",opts:[c.fr+" ("+c.en+")",...others.map(o=>o.fr+" ("+o.en+")")],a:0,ex:c.tip}});
    v.innerHTML=`<p class="pitch" style="font-size:14px;color:var(--muted);margin:0 0 10px">20 définitions tirées des concepts affichés : retrouvez le bon terme.</p><div class="card quiz" id="qz"></div>`;
    Quiz($("#qz"),qs,{mode:"learn"}).start();
  }
}
function flash(){
  const v=$("#view");
  if(!deck.length){v.innerHTML=`<div class="empty">Aucun concept ne correspond.</div>`;return}
  const c=C[deck[pos]-1];
  v.innerHTML=`<div class="fc" id="fc" tabindex="0" role="button" aria-label="Retourner la carte">
    <div class="eyebrow">${pad(c.n)} · ${esc(d.themes[c.th-1])} · carte ${pos+1} / ${deck.length}${known.has(c.n)?" · ✓ connu":rev.has(c.n)?" · ↻ à revoir":""}</div>
    <div class="t">${esc(c.fr)}<span class="enx">(${esc(c.en)})</span></div>
    ${flip?`<p style="margin:0">${esc(c.def)}</p><div class="blk tip"><h4>Tip examen</h4><p>${esc(c.tip)}</p></div><p class="sag">${esc(c.sag)}</p>`:`<p class="hint">Donnez la définition de tête, puis cliquez pour retourner la carte (ou Espace).</p>`}
  </div>
  <div class="fc-nav"><button class="btn" type="button" data-f="prev">← Précédente</button><button class="btn" type="button" data-f="shuf">Mélanger</button><button class="btn" type="button" data-f="rev">À revoir</button><button class="btn primary" type="button" data-f="known">Je connais</button><button class="btn" type="button" data-f="next">Suivante →</button></div>`;
}
const go=k=>{pos=(pos+k+deck.length)%deck.length;flip=false;flash()};
$("#view").addEventListener("click",e=>{
  if(F.view==="flash"){
    if(e.target.closest("#fc")){flip=!flip;flash();return}
    const b=e.target.closest("[data-f]");if(!b||!deck.length)return;const f=b.dataset.f,n=deck[pos];
    if(f==="next")go(1);else if(f==="prev")go(-1);else if(f==="shuf"){deck=shuffle(deck);pos=0;flip=false;flash()}
    else{if(f==="known"){known.add(n);rev.delete(n)}else{rev.add(n);known.delete(n)}save();go(1)}
    return}
  if(F.view!=="cards")return;
  const el=e.target.closest(".gc");if(!el)return;const n=+el.dataset.n;const a=e.target.closest("[data-a]");if(!a)return;
  if(a.dataset.a==="open"){open.has(n)?open.delete(n):open.add(n)}else mark(a.dataset.a,n);
  e.target.closest(".gc").outerHTML=card(C[n-1]);
});
document.addEventListener("keydown",e=>{if(F.view!=="flash"||/INPUT|SELECT/.test(document.activeElement.tagName))return;
  if(e.key===" "){e.preventDefault();flip=!flip;flash()}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1)});
$("#q").addEventListener("input",e=>{F.q=norm(e.target.value.trim());render()});
$("#th").addEventListener("change",e=>{F.th=e.target.value;render()});
$("#st").addEventListener("change",e=>{F.st=e.target.value;render()});
$$(".seg button").forEach(b=>b.addEventListener("click",()=>{F.view=b.dataset.v;$$(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));pos=0;flip=false;render()}));

stats();
const h=location.hash.match(/^#c(\d+)$/);
if(h&&C[+h[1]-1]){open.add(+h[1]);render();const el=$("#c"+h[1]);if(el){el.classList.add("flash-target");el.scrollIntoView({block:"center"})}}
else{open.add(1);render()}
})();
</script>
</body></html>

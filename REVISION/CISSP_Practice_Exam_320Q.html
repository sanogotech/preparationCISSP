B[6] = [
["Rules of engagement", "During a pentest, the tester discovers that a partner's server is reachable through the client's network but it is not listed in the scope.", "What should the tester do?", ["Stop and confirm with the client before testing it", "Test it since it is reachable from the client network", "Test it quickly and mention it in the appendix", "Test it only with non-intrusive tools"], "Testing outside the authorized scope can be illegal; scope changes require written approval.", "Tester hors périmètre peut être illégal ; tout changement de périmètre exige une approbation écrite.", "Même un outil « non intrusif » reste un test non autorisé."],
["Test knowledge", "A company wants a pentest that simulates an external attacker with no prior knowledge of its systems.", "Which approach is MOST appropriate?", ["Black-box testing", "White-box testing", "Gray-box testing", "Code review"], "Black-box testing gives the tester no internal information, simulating an outsider.", "Le test en boîte noire ne donne aucune information interne : il simule un attaquant externe.", "Le white box offre une meilleure couverture pour le même budget."],
["Coverage", "With a limited budget, the CISO wants the pentest that finds the most vulnerabilities in the time available.", "Which approach is BEST?", ["White-box testing with documentation and access", "Black-box testing without any information", "A red team exercise over three months", "An unauthenticated external scan"], "Sharing knowledge lets testers focus on finding flaws rather than spending time on reconnaissance.", "Partager l'information permet aux testeurs de chercher les failles plutôt que de passer du temps en reconnaissance.", "Le réalisme (boîte noire) et la couverture (boîte blanche) sont des objectifs différents."],
["Social engineering tests", "The security team plans a phishing simulation and a physical intrusion test of the headquarters.", "What is required FIRST?", ["Written approval from senior management, with HR and legal involved", "An announcement to all employees one week before", "Approval from the IT helpdesk manager", "A signed waiver from each employee"], "Social engineering tests affect people; senior management approval and HR/legal involvement are essential.", "Les tests d'ingénierie sociale touchent les personnes : l'accord de la direction et l'implication des RH et du juridique sont essentiels.", "Annoncer le test le rendrait inutile."],
["Log review", "Investigators cannot reconstruct an attack timeline because server and firewall logs show inconsistent times.", "Which control should have been in place?", ["Centralized time synchronization using NTP", "Longer log retention", "More verbose logging levels", "Log compression"], "Accurate correlation and evidence require synchronized clocks across systems.", "La corrélation et la valeur probante exigent des horloges synchronisées.", "Les journaux doivent aussi être protégés en intégrité."],
["Misuse cases", "Testers verify that the password reset feature works, but not how an attacker could abuse it.", "Which technique should be added?", ["Misuse and abuse case testing", "Regression testing", "Load testing", "Unit testing"], "Misuse cases model attacker behavior against features to reveal security flaws.", "Les cas d'abus modélisent le comportement d'un attaquant face à une fonctionnalité.", "Ils se définissent dès la conception (D8)."],
["Interface testing", "A mobile app's backend APIs are tested only through the app's user interface.", "What is the MAIN gap?", ["APIs can be called directly, bypassing UI controls", "The UI will be too slow for testers", "The app store will reject the app", "Users will see more error messages"], "Attackers call APIs directly; interface testing must test APIs independently of the UI.", "Un attaquant appelle directement les API ; il faut les tester indépendamment de l'interface.", "Lien avec la validation côté serveur (D8)."],
["Regression", "A patch fixing an XSS flaw accidentally reintroduced a previously fixed SQL injection.", "Which practice would MOST likely have caught this?", ["Automated regression testing including security tests", "A one-time penetration test last year", "Increasing code comments", "User acceptance testing by business users"], "Regression tests verify that changes do not reintroduce old defects.", "Les tests de non-régression vérifient qu'un changement ne réintroduit pas d'anciens défauts.", "Ils doivent être automatisés dans le pipeline CI/CD."],
["Code review", "A team wants a formal, structured code review process with defined roles, checklists and metrics.", "Which method is described?", ["Fagan inspection", "Fuzzing", "Dynamic analysis", "Black-box testing"], "Fagan inspections are formal reviews with planning, preparation, inspection meetings and follow-up.", "L'inspection de Fagan est une revue formelle : planification, préparation, réunion, suivi.", "La revue par les pairs informelle est moins rigoureuse."],
["SOC 1", "External financial auditors want assurance over a payroll provider's controls affecting the client's financial statements over the past year.", "Which report is MOST appropriate?", ["SOC 1 Type II", "SOC 2 Type I", "SOC 3", "ISO 27001 certificate"], "SOC 1 addresses controls relevant to financial reporting; Type II covers operating effectiveness over a period.", "Le SOC 1 porte sur les contrôles liés à l'information financière ; le Type II couvre une période.", "Pour la sécurité, on demanderait un SOC 2."],
["ISO audits", "A company obtained ISO 27001 certification two years ago and believes no further audits are needed.", "Which statement is MOST accurate?", ["Surveillance audits occur periodically and recertification every three years", "Certification is permanent once obtained", "Only internal audits are required afterwards", "A new certification is needed every month"], "ISO certification requires periodic surveillance audits and recertification at the end of the cycle.", "La certification ISO exige des audits de surveillance périodiques et un renouvellement en fin de cycle.", "Les audits internes et la revue de direction restent obligatoires."],
["Audit independence", "The internal audit team reports to the CIO, whose department it audits.", "What is the BEST change?", ["Have internal audit report to the audit committee or board", "Have internal audit report to the CISO", "Outsource only the report writing", "Reduce the scope of IT audits"], "Independence requires reporting to a body not responsible for the audited activities.", "L'indépendance exige de rendre compte à une instance non responsable des activités auditées.", "Le comité d'audit est le rattachement classique."],
["MTTD", "The SOC wants to measure how long attackers remain undetected in the environment.", "Which metric is MOST relevant?", ["Mean time to detect", "Mean time between failures", "Recovery point objective", "Number of blocked emails"], "MTTD measures the average delay between compromise and detection.", "Le MTTD mesure le délai moyen entre la compromission et la détection.", "Le MTTR mesure ensuite la réponse ou la réparation."],
["CVSS vs EPSS", "Two vulnerabilities have CVSS scores of 9.8 and 7.5. The 7.5 is listed in CISA KEV and has a high EPSS score; the 9.8 has no known exploit.", "Which should be prioritized?", ["The 7.5, because it is actively exploited", "The 9.8, because its CVSS score is higher", "Both equally, in alphabetical order", "Neither until the next scan"], "Active exploitation and likelihood are strong prioritization factors beyond severity alone.", "L'exploitation active et la probabilité sont des facteurs de priorisation au-delà de la seule gravité.", "Il faut aussi tenir compte de l'exposition et de la valeur de l'actif."],
["BAS", "A company wants continuous, automated validation that its EDR and SIEM detect common attacker techniques.", "Which approach is MOST suitable?", ["Breach and attack simulation mapped to MITRE ATT&CK", "An annual manual penetration test", "A SOC 2 Type I audit", "A user awareness survey"], "BAS tools continuously simulate techniques to validate detection and prevention controls.", "Les outils BAS simulent en continu des techniques d'attaque pour valider détection et prévention.", "Ils complètent les red teams, ils ne les remplacent pas."],
["ISCM", "A regulator expects the bank to make risk decisions based on up-to-date security information rather than annual snapshots.", "Which program BEST meets this expectation?", ["Information security continuous monitoring", "An annual external audit", "A one-time risk assessment", "Quarterly management meetings only"], "ISCM (NIST SP 800-137) provides ongoing awareness of threats, vulnerabilities and control effectiveness.", "L'ISCM (NIST SP 800-137) fournit une vision continue des menaces, vulnérabilités et de l'efficacité des contrôles.", "Il alimente les décisions de risque."],
["Account review", "An audit of the ERP shows 120 users with the 'SuperUser' role, including interns.", "What should the auditor recommend?", ["Review privileged access with owners and remove excess rights", "Delete the ERP 'SuperUser' role immediately", "Give all users the same role for consistency", "Accept the situation if no incident has occurred"], "Account management reviews must ensure least privilege, with owners validating access.", "La revue des comptes doit garantir le moindre privilège, avec validation par les owners.", "Supprimer le rôle brutalement pourrait bloquer le métier."],
["DR test results", "During a parallel DR test, the recovery site restored systems in 6 hours, but the RTO is 4 hours.", "What should be done?", ["Document the gap, analyze causes and update the plan", "Change the RTO to 6 hours in the report", "Consider the test successful since systems recovered", "Stop DR tests until next year"], "Tests exist to reveal gaps; results must drive improvements and be reported to management.", "Les tests servent à révéler les écarts ; les résultats doivent conduire à des améliorations et être remontés.", "Modifier l'objectif sans décision métier fausse la gouvernance."],
["False positives", "The SIEM generates hundreds of false-positive alerts daily, and analysts start ignoring them.", "What is the BEST approach?", ["Tune detection rules and thresholds based on analysis", "Disable all alerts from the noisiest sources", "Hire more analysts to read all alerts", "Lower log retention to reduce volume"], "Tuning reduces noise while preserving detection; alert fatigue increases the risk of missing real attacks.", "Le réglage réduit le bruit tout en préservant la détection ; la fatigue d'alerte fait rater de vraies attaques.", "Désactiver des sources crée des angles morts."],
["Scan timing", "A vulnerability scan crashed an old industrial controller during production hours.", "What is the BEST improvement?", ["Coordinate scans with owners and use OT-safe scanning windows", "Stop scanning industrial systems entirely", "Scan with more aggressive settings to finish faster", "Scan only from the Internet"], "Testing must consider operational impact, especially for fragile OT systems.", "Les tests doivent tenir compte de l'impact opérationnel, surtout pour les systèmes industriels fragiles.", "En OT, on privilégie la surveillance passive."],
["Third-party audit", "A cloud provider's customers each want to audit its data centers, causing disruption.", "What is the BEST approach for the provider?", ["Provide independent third-party audit reports to customers", "Refuse all audit requests", "Allow each customer a full on-site audit", "Publish internal audit reports publicly"], "Independent reports (SOC 2, ISO 27001) give customers assurance without countless individual audits.", "Des rapports indépendants (SOC 2, ISO 27001) rassurent les clients sans multiplier les audits individuels.", "Le droit d'audit contractuel peut rester pour les cas justifiés."],
["Sampling", "An auditor cannot review all 50,000 access changes made during the year.", "What is the MOST appropriate method?", ["Statistical or risk-based sampling with documented criteria", "Review only the first 100 changes", "Ask the IT manager which changes to review", "Skip the review due to volume"], "Sampling must be representative or risk-based and documented to support conclusions.", "L'échantillonnage doit être représentatif ou fondé sur le risque, et documenté.", "Laisser l'audité choisir l'échantillon compromet l'indépendance."],
["Management review", "The ISMS has been in place for a year, but executives never reviewed its performance.", "Which activity is missing?", ["A formal management review of the ISMS", "A new penetration test", "A larger security budget", "An additional firewall"], "Management review evaluates ISMS performance and decides on improvements and resources.", "La revue de direction évalue la performance du SMSI et décide des améliorations et des ressources.", "Exigence explicite de l'ISO 27001."],
["AI red teaming", "A bank deploys a customer-facing chatbot built on a large language model.", "Which testing is MOST important before go-live?", ["Adversarial testing for prompt injection and data leakage", "Load testing of the chatbot interface only", "Spell-checking all chatbot answers", "A SOC 1 audit of the chatbot provider"], "AI systems need adversarial (red team) testing for jailbreaks, injection and sensitive data disclosure.", "Les systèmes d'IA exigent des tests adverses (red team) : jailbreak, injection, divulgation de données.", "Tendance 2025-2026 : le red teaming IA devient une pratique standard."],
["Compliance check", "A team confirms each quarter that firewall configurations match the approved baseline using automated tools.", "What type of activity is this?", ["A compliance or configuration check", "A penetration test", "A third-party audit", "A tabletop exercise"], "Compliance checks compare configurations with baselines; they are narrower than audits or pentests.", "Un contrôle de conformité compare les configurations à une référence ; il est plus restreint qu'un audit ou un pentest.", "SCAP permet d'automatiser ces vérifications."],
];

B[7] = [
["Best evidence", "In a fraud case, the company presents a printed copy of an email instead of the original electronic message.", "Which rule may the opposing party invoke?", ["The best evidence rule", "The hearsay rule", "The exclusionary rule", "The prudent person rule"], "The best evidence rule prefers original evidence over copies when available.", "La règle de la meilleure preuve privilégie l'original lorsqu'il est disponible.", "Une copie peut être admise si l'original est indisponible et sa fidélité prouvée."],
["Log admissibility", "Defense lawyers argue that firewall logs are hearsay and should be excluded.", "What strengthens the logs' admissibility?", ["Showing they are generated routinely, protected and unaltered", "Printing them in color", "Having a manager summarize them in a memo", "Deleting irrelevant entries before presenting them"], "Records created in the regular course of business with integrity controls are generally admissible.", "Les enregistrements produits dans le cours normal de l'activité, avec des contrôles d'intégrité, sont généralement recevables.", "Supprimer des entrées compromettrait l'intégrité de la preuve."],
["Insider threat", "An employee in the finance department suddenly downloads large volumes of files at night, unusual for her role.", "Which technology is BEST suited to detect such behavior?", ["UEBA", "Signature-based antivirus", "Stateless firewall", "Vulnerability scanner"], "UEBA establishes baselines and detects anomalous user behavior, useful for insider threats.", "L'UEBA établit des comportements de référence et détecte les anomalies, utile contre les menaces internes.", "Ce n'est pas une preuve de malveillance : il faut enquêter avec RH et juridique."],
["Egress monitoring", "Attackers exfiltrated data by uploading it slowly to a cloud storage service over several weeks.", "Which control would MOST likely have detected this?", ["Egress monitoring with DLP and traffic anomaly detection", "Inbound firewall rules on the perimeter", "Antivirus signature updates", "Password complexity rules"], "Monitoring outbound traffic and data movement detects exfiltration that inbound controls miss.", "La surveillance des flux sortants détecte l'exfiltration que les contrôles entrants ne voient pas.", "Les attaquants utilisent souvent des services cloud légitimes."],
["FIM", "Attackers modified a web server's configuration file to add a malicious redirect, and nobody noticed for weeks.", "Which control would have detected the change quickly?", ["File integrity monitoring", "Full disk encryption", "Network address translation", "Load balancing"], "File integrity monitoring alerts on unauthorized changes to critical files.", "La surveillance de l'intégrité des fichiers alerte sur les modifications non autorisées.", "PCI DSS l'exige pour les fichiers critiques."],
["Sandboxing", "A company receives many emails with unknown attachments that bypass signature-based antivirus.", "Which control is MOST effective?", ["Detonate attachments in a sandbox before delivery", "Increase the mailbox size limit", "Block all emails from external senders", "Ask users to forward suspicious emails to IT"], "Sandboxing analyzes behavior of unknown files in isolation before they reach users.", "Le bac à sable analyse le comportement des fichiers inconnus en isolement avant leur livraison.", "Les malwares évolués détectent parfois les sandbox : défense en profondeur."],
["Allowlisting", "Kiosk computers in bank branches only need to run three applications, but users install unauthorized software.", "What is the MOST effective control?", ["Application allowlisting", "Antivirus with daily updates", "Weekly reimaging of the kiosks", "User awareness posters"], "Allowlisting permits only approved software, ideal for fixed-function systems.", "L'*allowlisting* n'autorise que les logiciels approuvés, idéal pour des systèmes à usage fixe.", "Plus efficace que l'approche par signatures pour ce cas."],
["Threat intelligence", "A bank wants to automatically share and receive indicators of compromise with other banks in the region.", "Which standards are commonly used?", ["STIX and TAXII", "SAML and OIDC", "SNMP and Syslog", "SCAP and CVSS"], "STIX describes threat information; TAXII transports it between parties.", "STIX décrit l'information sur les menaces ; TAXII la transporte.", "Les ISAC sectoriels facilitent ce partage."],
["Standard change", "The service desk resets user passwords dozens of times per day following a documented, low-risk procedure.", "How should these changes be classified?", ["Standard changes, pre-approved", "Emergency changes requiring ECAB", "Normal changes requiring CAB each time", "Unauthorized changes"], "Low-risk, repeatable changes with documented procedures are pre-approved standard changes.", "Les changements répétitifs à faible risque, avec procédure documentée, sont des changements standard pré-approuvés.", "Le CAB se concentre ainsi sur les changements à risque."],
["Configuration drift", "Servers built from a hardened image gradually diverge from it as administrators make manual changes.", "What is the BEST control?", ["Automated configuration management detecting drift from the baseline", "Rebuild servers only after incidents", "Allow manual changes if documented later", "Disable administrator accounts permanently"], "Configuration management tools enforce and monitor baselines, detecting unauthorized drift.", "Les outils de gestion de configuration imposent et surveillent les références, et détectent les dérives.", "L'Infrastructure as Code facilite cette maîtrise."],
["Patch testing", "A monthly OS patch broke a critical banking application last year, so the team now delays all patches by six months.", "What is the BEST approach?", ["Test patches in a representative environment and deploy by risk", "Keep delaying patches for six months", "Install patches in production without testing", "Stop patching the banking servers"], "A balanced patch process tests quickly and prioritizes by risk rather than avoiding patches.", "Un processus équilibré teste rapidement et priorise selon le risque, au lieu d'éviter les correctifs.", "Six mois d'exposition aux vulnérabilités connues est un risque majeur."],
["Event vs incident", "The SIEM reports 300 failed logins on one account from a single IP within 5 minutes.", "What should the analyst do FIRST?", ["Triage the event to determine whether it is an incident", "Declare a major incident and notify the regulator", "Ignore it since the logins failed", "Delete the account immediately"], "Not every event is an incident; triage qualifies severity before escalation.", "Tout événement n'est pas un incident ; le tri qualifie la gravité avant l'escalade.", "Notifier un régulateur trop tôt peut être injustifié."],
["Communication", "During a major breach, an engineer posts technical details on social media, and journalists start calling staff.", "What should have prevented this?", ["A communication plan with designated spokespersons", "A stronger firewall policy", "More detailed logging", "Encryption of all emails"], "Incident response plans define who communicates externally, protecting legal and reputational interests.", "Le plan de réponse définit qui communique à l'extérieur, pour protéger les intérêts juridiques et l'image.", "La communication fait partie du *reporting*."],
["Root cause", "The same phishing-based compromise has occurred three times in a year. Each time the team reimaged the affected laptop.", "What is missing?", ["Root cause analysis and corrective actions", "Faster reimaging procedures", "More laptops in stock", "A larger antivirus license"], "Without root cause analysis and remediation, incidents recur.", "Sans analyse de cause racine et actions correctives, les incidents se répètent.", "Le *lessons learned* doit produire des actions suivies."],
["RAID", "A file server must tolerate the failure of any single disk while making efficient use of capacity.", "Which RAID level is MOST appropriate?", ["RAID 5", "RAID 0", "RAID 1 with two disks", "JBOD"], "RAID 5 uses distributed parity, tolerating one disk failure with good capacity efficiency.", "Le RAID 5 utilise une parité répartie : il tolère la perte d'un disque avec une bonne efficacité.", "RAID 6 tolère deux pannes ; RAID 0 aucune."],
["Reliability", "A vendor states its storage array has an MTBF of 200,000 hours and an MTTR of 4 hours.", "What do these values describe?", ["Average time between failures and average time to repair", "Recovery point and recovery time objectives", "Maximum tolerable downtime and work recovery time", "Backup frequency and retention period"], "MTBF measures reliability; MTTR measures maintainability.", "Le MTBF mesure la fiabilité ; le MTTR la rapidité de réparation.", "Ces données éclairent les choix de redondance."],
["Remote journaling", "A bank wants to transmit database transaction logs continuously to its backup site to minimize data loss.", "Which technique is described?", ["Remote journaling", "Electronic vaulting", "Tape rotation", "Differential backup"], "Remote journaling sends transaction logs continuously; electronic vaulting transfers data in batches.", "Le *remote journaling* transmet les journaux de transactions en continu ; l'*electronic vaulting* par lots.", "Cela réduit le RPO."],
["Warm site", "A company needs to recover within 48 hours, has a moderate budget and can tolerate loading data from backups.", "Which recovery site is MOST appropriate?", ["Warm site", "Hot site", "Cold site", "Mobile site"], "A warm site has equipment but needs data and configuration, typically recovering in hours to days.", "Le site tiède dispose du matériel mais nécessite de charger les données : reprise en heures ou jours.", "Le choix découle du RTO et du budget."],
["Reciprocal agreement", "Two regional banks agree to host each other's critical systems in case of disaster.", "What is the MAIN weakness of this arrangement?", ["Capacity and enforceability are uncertain during a real disaster", "It is always more expensive than a hot site", "It requires identical staff in both banks", "It is prohibited by all regulators"], "Reciprocal agreements are cheap but hard to enforce, and the partner may lack capacity or be affected too.", "Les accords réciproques sont peu coûteux mais difficiles à faire respecter, et le partenaire peut manquer de capacité.", "Il y a aussi des enjeux de confidentialité entre concurrents."],
["Parallel test", "The DR team activates the recovery site and processes real transactions there while production keeps running.", "Which test is this?", ["Parallel test", "Full interruption test", "Tabletop exercise", "Checklist review"], "In a parallel test, the recovery site operates alongside production without stopping it.", "Dans un test parallèle, le site de secours fonctionne en même temps que la production, sans l'arrêter.", "Le *full interruption* arrête réellement la production."],
["Duress", "A cashier is forced at gunpoint to open the vault.", "Which control helps her alert security discreetly?", ["A duress code or silent alarm", "A longer vault PIN", "A second CCTV camera", "A mandatory vacation policy"], "Duress codes trigger silent alerts while appearing to comply, protecting the employee's safety.", "Un code de contrainte déclenche une alerte silencieuse tout en semblant obéir, pour protéger l'employée.", "La sécurité des personnes prime sur les biens."],
["Travel security", "Executives travel to a country with high risk of device searches and espionage.", "What is the BEST practice?", ["Provide clean loaner devices with minimal data and VPN", "Let them use personal phones to avoid scrutiny", "Disable encryption to avoid border issues", "Store all documents in email for easy access"], "Loaner devices with minimal data limit exposure; they are wiped or inspected on return.", "Des appareils de prêt avec un minimum de données limitent l'exposition ; ils sont réinitialisés au retour.", "Respecter aussi les lois locales sur le chiffrement."],
["MDR", "A mid-size company cannot staff a 24/7 SOC but needs continuous detection and response.", "What is the MOST suitable option?", ["A managed detection and response provider with clear SLAs", "Turning off alerts at night", "Buying more security tools without staff", "Relying only on annual pentests"], "MDR services provide 24/7 monitoring and response; the company keeps accountability and oversight.", "Les services MDR assurent surveillance et réponse 24/7 ; l'entreprise garde la responsabilité et le pilotage.", "On externalise la tâche, pas la responsabilité."],
["EDR tampering", "During an intrusion, attackers used a vulnerable signed driver to disable the EDR agents.", "Which measure BEST mitigates this technique?", ["Vulnerable driver blocklists and EDR tamper protection with alerting", "Removing the EDR to avoid conflicts", "Allowing users local admin rights", "Disabling Windows updates"], "Attackers use 'bring your own vulnerable driver' techniques; blocklists and tamper protection reduce the risk.", "Les attaquants utilisent des pilotes vulnérables signés ; les listes de blocage et la protection anti-altération réduisent le risque.", "Tendance 2025-2026 : les « EDR killers » sont courants dans les rançongiciels."],
["Ransom payment", "Ransomware encrypted critical systems, and backups are partly damaged. The attackers demand payment.", "Who should decide whether to pay?", ["Senior management, advised by legal, law enforcement and experts", "The SOC analyst on duty", "The IT administrator who discovered the attack", "The cyber insurance broker alone"], "Paying is a business decision with legal, ethical and sanctions implications; management decides with expert advice.", "Payer est une décision métier aux implications juridiques, éthiques et de sanctions ; la direction décide avec des experts.", "Payer ne garantit ni la restitution ni l'absence de fuite."],

en:["Week 1 – IAAA, factor types and MFA, biometrics (FAR, FRR, CER), password best practice (NIST 800-63B), assurance levels (IAL, AAL, FAL).","Week 2 – SSO and federation: Kerberos step by step, SAML, OAuth 2.0 vs OIDC, SCIM; access control models (DAC, MAC, RBAC, ABAC) with one example each.","Week 3 – Identity lifecycle (JML), access reviews, PAM, identity attacks; 15 mini-cases and 40 Domain 5 questions in Learn mode.","Week 4 (towards 100%) – Exam mode; focus on process answers (fix the leaver process, not just the accounts)."],
fr:["Semaine 1 – IAAA, types de facteurs et MFA, biométrie (FAR, FRR, CER), bonnes pratiques des mots de passe (NIST 800-63B), niveaux d'assurance (IAL, AAL, FAL).","Semaine 2 – SSO et fédération : Kerberos pas à pas, SAML, OAuth 2.0 vs OIDC, SCIM ; modèles d'accès (DAC, MAC, RBAC, ABAC) avec un exemple chacun.","Semaine 3 – Cycle de vie des identités (JML), revues des accès, PAM, attaques sur les identités ; 15 mini-cas et 40 questions D5 en mode Learn.","Semaine 4 (vers 100 %) – Mode Exam ; privilégier les réponses « processus » (corriger le processus de départ, pas seulement les comptes)."]},
6: {weeks:2, plus:1, daily:"45 min",
en:["Week 1 – Audit strategy and independence, rules of engagement, scan vs pentest, test types (black/gray/white box, red/blue/purple), false positives vs negatives, SAST/DAST/SCA/fuzzing.","Week 2 – SOC reports (1/2/3, Type I/II), monitoring (synthetic vs RUM, ISCM, BAS), metrics (KPI vs KRI), prioritization (CVSS, EPSS, KEV); 15 mini-cases and 40 Domain 6 questions in Learn mode.","Week 3 (towards 100%) – Exam mode; check that you always pick 'authorization first' and 'auditor reports' reflexes."],
fr:["Semaine 1 – Stratégie et indépendance de l'audit, règles d'engagement, scan vs pentest, types de tests (boîte noire/grise/blanche, red/blue/purple), faux positifs vs faux négatifs, SAST/DAST/SCA/fuzzing.","Semaine 2 – Rapports SOC (1/2/3, Type I/II), surveillance (transactions synthétiques vs RUM, ISCM, BAS), métriques (KPI vs KRI), priorisation (CVSS, EPSS, KEV) ; 15 mini-cas et 40 questions D6 en mode Learn.","Semaine 3 (vers 100 %) – Mode Exam ; vérifier que les réflexes « autorisation d'abord » et « l'auditeur rapporte » sont acquis."]},
7: {weeks:3, plus:1, daily:"45–60 min",
en:["Week 1 – Investigations and evidence: types, admissibility, chain of custody, order of volatility, forensic process; logging and monitoring tools (SIEM, SOAR, UEBA, EDR).","Week 2 – Incident management steps, change and patch management, emergency changes, malware types; recite the incident sequence from memory.","Week 3 – Backups (full, incremental, differential, immutable), RAID, recovery sites, DR test types; 15 mini-cases and 40 Domain 7 questions in Learn mode.","Week 4 (towards 100%) – Exam mode with FIRST/NEXT/LAST questions; validate the 'contain first, lessons learned last' reflex."],
fr:["Semaine 1 – Investigations et preuves : types, recevabilité, chaîne de possession, ordre de volatilité, processus forensique ; outils de journalisation et de surveillance (SIEM, SOAR, UEBA, EDR).","Semaine 2 – Étapes de gestion d'incident, gestion des changements et des correctifs, changements d'urgence, types de malwares ; réciter de mémoire la séquence d'incident.","Semaine 3 – Sauvegardes (complète, incrémentale, différentielle, immuable), RAID, sites de secours, types de tests PRA ; 15 mini-cas et 40 questions D7 en mode Learn.","Semaine 4 (vers 100 %) – Mode Exam avec les questions FIRST/NEXT/LAST ; valider le réflexe « contenir d'abord, retour d'expérience en dernier »."]},
8: {weeks:2, plus:1, daily:"45 min",
en:["Week 1 – Secure SDLC and shift left, development models (spiral = risk), DevSecOps, maturity models (CMMI, SAMM), secure coding: each flaw with its specific fix (SQLi, XSS, CSRF, SSRF, IDOR, overflows).","Week 2 – Software supply chain (SBOM, SCA, SLSA, code signing, escrow), databases (ACID, aggregation, inference), AI security (prompt injection, excessive agency); 15 mini-cases and 40 Domain 8 questions in Learn mode.","Week 3 (towards 100%) – Exam mode; drill 'client-side validation is not security' and 'signed is not safe' until automatic."],
fr:["Semaine 1 – SDLC sécurisé et shift left, modèles de développement (spirale = risque), DevSecOps, modèles de maturité (CMMI, SAMM), codage sécurisé : chaque faille avec sa correction propre (SQLi, XSS, CSRF, SSRF, IDOR, débordements).","Semaine 2 – Chaîne logicielle (SBOM, SCA, SLSA, signature, escrow), bases de données (ACID, agrégation, inférence), sécurité de l'IA (injection de prompt, excessive agency) ; 15 mini-cas et 40 questions D8 en mode Learn.","Semaine 3 (vers 100 %) – Mode Exam ; travailler « la validation côté client n'est pas de la sécurité » et « signé ne veut pas dire sûr » jusqu'à ce que ce soit automatique."]},
};


const DN={1:"Security and Risk Management",2:"Asset Security",3:"Security Architecture and Engineering",4:"Communication and Network Security",5:"Identity and Access Management",6:"Security Assessment and Testing",7:"Security Operations",8:"Software Development Security"};
const W={1:16,2:10,3:13,4:13,5:13,6:12,7:13,8:10};
let cfg={doms:[1,2,3,4,5,6,7,8],per:20,mode:"learn",lang:"both"},quiz=[],idx=0,ans=[],flags=[],t0=0,tick=null,limit=0;
const app=document.getElementById('app');
const POOL={};
function buildPool(){for(const k in OV){const [d,i]=k.split('.').map(Number);Q[d][i-1][2]=OV[k];}
 for(const k in OV2){const [d,i]=k.split('.').map(Number);B[d][i-1][3]=OV2[k];}
 for(let d=1;d<=8;d++){POOL[d]=Q[d].map((q,i)=>({id:d+'a'+i,t:q[0],sc:q[1],st:S[d][i],o:q[2],en:q[3],fr:q[4],nu:q[5]}))
  .concat(B[d].map((q,i)=>({id:d+'b'+i,t:q[0],sc:q[1],st:q[2],o:q[3],en:q[4],fr:q[5],nu:q[6]})));}}
buildPool();
let SEEN={};try{SEEN=JSON.parse(localStorage.getItem('cissp320_seen')||'{}')}catch(e){SEEN={}}
function saveSeen(){try{localStorage.setItem('cissp320_seen',JSON.stringify(SEEN))}catch(e){}}
function seenStats(){let s=0;for(let d=1;d<=8;d++)POOL[d].forEach(q=>{if(SEEN[q.id])s++});return s}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
const L="ABCD";
function home(){
 stopTimer();
 app.innerHTML=`<div class="card"><h2>🎯 CISSP Practice Exam</h2>
 <p>Each question is a realistic <b>scenario of 2 to 4 sentences</b>, written in the style of the real exam. Often <b>two or three answers look correct</b>, but only one is the <b>BEST</b> answer from a risk-management and governance perspective. Read the keyword (<i>FIRST, BEST, MOST</i>) carefully.</p>
 <h3>1. Domains</h3>
 <div class="grid">${Object.keys(DN).map(d=>`<label class="dom"><input type="checkbox" ${cfg.doms.includes(+d)?'checked':''} onchange="tg(${d},this.checked)"><span><b>D${d}</b> ${DN[d]} <span class="hint">(${W[d]}%)</span></span></label>`).join('')}</div>
 <div class="nav" style="justify-content:flex-start"><button class="btn2" onclick="cfg.doms=[1,2,3,4,5,6,7,8];home()">Select all</button><button class="btn2" onclick="cfg.doms=[];home()">Clear</button></div>
 <h3>2. Questions per domain</h3>
 <div class="seg">${[10,20,40].map(n=>`<button class="${cfg.per===n?'on':''}" onclick="cfg.per=${n};home()">${n} per domain${n===40?' (all)':''}</button>`).join('')}</div>
 <p class="hint">🔀 Every attempt draws a <b>new random order of questions</b> and <b>new positions for the answers</b>. With 10 or 20 per domain, <b>questions you have not seen yet are served first</b> (seen so far: <b>${seenStats()}</b> / 320). <a href="#" onclick="SEEN={};saveSeen();home();return false">Reset rotation</a></p>
 <h3>3. Mode</h3>
 <div class="seg"><button class="${cfg.mode==='learn'?'on':''}" onclick="cfg.mode='learn';home()">📘 Learn mode – instant feedback</button><button class="${cfg.mode==='exam'?'on':''}" onclick="cfg.mode='exam';home()">⏱️ Exam mode – results at the end</button></div>
 <p class="hint">${cfg.mode==='exam'?'Exam mode: timer at about 1 min 12 s per question (CISSP pace), no feedback until the end, questions can be flagged for review.':'Learn mode: after each answer you get the explanation in English and French, plus the exam nuance or a real-world lesson (REX).'}</p>
 <h3>4. Explanation language</h3>
 <div class="seg">${[["both","English + Français"],["en","English only"],["fr","Français seulement"]].map(([k,v])=>`<button class="${cfg.lang===k?'on':''}" onclick="cfg.lang='${k}';home()">${v}</button>`).join('')}</div>
 <div class="nav"><span class="hint">Total: <b>${cfg.doms.length*cfg.per}</b> questions · pass mark 70% · per-domain level and revision advice at the end</span>
 <button class="btn" ${cfg.doms.length?'':'disabled'} onclick="start()">Start ▶</button></div></div>`;
}
function tg(d,on){cfg.doms=on?[...new Set([...cfg.doms,d])].sort():cfg.doms.filter(x=>x!==d);home()}
function start(){
 quiz=[];
 cfg.doms.forEach(d=>{const pick=shuffle(POOL[d]).sort((a,b)=>(SEEN[a.id]||0)-(SEEN[b.id]||0)).slice(0,cfg.per);pick.forEach(q=>{SEEN[q.id]=(SEEN[q.id]||0)+1;quiz.push({d,q})})});
 saveSeen();
 quiz=shuffle(quiz).map(({d,q})=>{const o=shuffle([0,1,2,3]);return{d,topic:q.t,scen:q.sc,stem:q.st,opts:o.map(k=>q.o[k]),a:o.indexOf(0),en:q.en,fr:q.fr,nu:q.nu}});
 idx=0;ans=Array(quiz.length).fill(null);flags=Array(quiz.length).fill(false);
 if(cfg.mode==='exam'){limit=Math.round(quiz.length*72);t0=Date.now();startTimer()}
 render();
}
function startTimer(){const el=document.getElementById('timer');el.style.display='block';tick=setInterval(()=>{const r=limit-Math.floor((Date.now()-t0)/1000);
 if(r<=0){stopTimer();results(true);return}el.textContent='⏱ '+Math.floor(r/60)+':'+String(r%60).padStart(2,'0');el.style.background=r<300?'rgba(192,0,0,.6)':''},1000)}
function stopTimer(){if(tick)clearInterval(tick);tick=null;const el=document.getElementById('timer');if(el)el.style.display='none'}
function expl(q){let h='';if(cfg.lang!=='fr')h+=`<div class="lang"><b>🇬🇧 Why:</b> ${md(q.en)}</div>`;if(cfg.lang!=='en')h+=`<div class="lang"><b>🇫🇷 Pourquoi :</b> ${md(q.fr)}</div>`;
 return h+`<div class="nuance"><b>🎯 Nuance / REX :</b> ${md(q.nu)}</div>`}
function render(){
 const q=quiz[idx],learn=cfg.mode==='learn',done=learn&&ans[idx]!==null;
 app.innerHTML=`<div class="card"><div class="meta"><span>Question ${idx+1} / ${quiz.length}</span><span>${learn?'Correct so far: '+ans.filter((a,i)=>a!==null&&a===quiz[i].a).length:'Answered: '+ans.filter(a=>a!==null).length+' / '+quiz.length}</span></div>
 <div class="prog"><div style="width:${(idx+1)/quiz.length*100}%"></div></div>
 <span class="tag">D${q.d} · ${DN[q.d]}</span>${learn?`<span class="tag">${esc(q.topic)}</span>`:''}${flags[idx]?'<span class="flag">⚑ flagged</span>':''}
 <div class="scen">${esc(q.scen)}</div><div class="stem">${esc(q.stem)}</div>
 ${q.opts.map((o,i)=>{let c='';if(done){if(i===q.a)c='good';else if(i===ans[idx])c='bad'}else if(ans[idx]===i)c='sel';
  return `<button class="opt ${c}" ${done?'disabled':''} onclick="pick(${i})"><span class="l">${L[i]}</span><span>${esc(o)}</span></button>`}).join('')}
 ${done?`<div class="fb ${ans[idx]===q.a?'good':'bad'}"><b>${ans[idx]===q.a?'✅ Correct – this is the BEST answer.':'❌ Not the best answer. The BEST answer is '+L[q.a]+'.'}</b>${expl(q)}</div>`:''}
 <div class="nav"><div><button class="btn2" onclick="if(confirm('Quit and lose progress?'))home()">✕ Quit</button>
 ${!learn?`<button class="btn2" onclick="flags[idx]=!flags[idx];render()">${flags[idx]?'Unflag':'⚑ Flag'}</button>`:''}</div>
 <div>${idx>0&&!learn?'<button class="btn2" onclick="idx--;render()">◀ Previous</button> ':''}
 ${idx<quiz.length-1?`<button class="btn" ${learn&&!done?'disabled':''} onclick="idx++;render()">Next ▶</button>`:`<button class="btn" ${learn&&!done?'disabled':''} onclick="finish()">See results 🏁</button>`}</div></div>
 ${!learn?`<p class="hint">Note: the real CISSP CAT exam does not allow going back. Use “Previous” only for practice.</p>`:''}</div>`;
 window.scrollTo({top:0});
}
function pick(i){ans[idx]=i;render()}
function finish(){const un=ans.filter(a=>a===null).length;if(un&&!confirm(un+' question(s) unanswered. Finish anyway?'))return;stopTimer();results(false)}

function planHTML(d,p){const x=P[d];if(!x)return '';const both=cfg.lang==='both',en=cfg.lang!=='fr',fr=cfg.lang!=='en';
 const tot=x.weeks+x.plus;
 let h=`<div class="plan"><h5>🚀 ${en?'Recovery plan: from '+p+'% to 85%, then aim for 100%':''}${both?' · ':''}${fr?'Plan de remontée : de '+p+' % à 85 %, puis viser 100 %':''}</h5>`;
 h+=`<div>${en?`⏱ <b>Reasonable timeframe:</b> ${x.weeks} weeks to reach 85%, about ${tot} weeks to approach 100% · ${x.daily} per day, 5 days a week.`:''}${both?'<br>':''}${fr?`⏱ <b>Délai raisonnable :</b> ${x.weeks} semaines pour atteindre 85 %, environ ${tot} semaines pour approcher 100 % · ${x.daily} par jour, 5 jours sur 7.`:''}</div>`;
 const M={2:[70],3:[65,75],4:[62,70,78]}[x.weeks]||[65,75];
 h+=`<div class="miles"><span>${en?'Now':'Aujourd’hui'}: ${p}%</span>${M.map((m,i)=>`<span>${en?'End of week '+(i+1):'Fin semaine '+(i+1)}: ≥ ${m}%</span>`).join('')}<span>${en?'End of week '+x.weeks:'Fin semaine '+x.weeks}: ≥ 85% 🎯</span><span>${en?'Week '+tot:'Semaine '+tot}: 95–100% 🏆</span></div>`;
 if(en)h+=`<ol>${x.en.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;
 if(fr)h+=`${en?'<div class="hint" style="margin-top:6px"><b>🇫🇷 En français</b></div>':''}<ol>${x.fr.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;
 h+=`<div class="hint">${en?'✅ Validation rule: 85% reached when you score ≥ 85% on 40 fresh questions of this domain in Exam mode, twice in a row. Aim for 100% by explaining aloud why each wrong option is not the BEST answer.':''}${both?'<br>':''}${fr?'✅ Règle de validation : 85 % est atteint quand vous obtenez au moins 85 % sur 40 questions de ce domaine en mode Exam, deux fois de suite. Pour viser 100 %, expliquez à voix haute pourquoi chaque mauvaise option n’est pas la MEILLEURE réponse.':''}</div></div>`;
 return h}
function globalPlan(doms,by){const weak=doms.filter(d=>{const p=Math.round(by[d].g/by[d].n*100);return p<=60});if(!weak.length)return '';
 const w=weak.reduce((a,d)=>a+P[d].weeks,0),par=Math.max(...weak.map(d=>P[d].weeks)),en=cfg.lang!=='fr',fr=cfg.lang!=='en';
 const est=weak.length<2?w:Math.max(par,Math.ceil(w/2));
 return `<div class="gplan"><b>${en?'📅 Overall revision schedule':''}${en&&fr?' · ':''}${fr?'📅 Calendrier global de révision':''}</b><br>
 ${en?`${weak.length} domain(s) at 60% or below: ${weak.map(d=>'D'+d).join(', ')}. Working on them one after the other takes about <b>${w} weeks</b>; with two daily sessions (one domain in the morning, another in the evening) it takes about <b>${est} weeks</b>.${weak.length>=5?' With this many domains to rebuild, plan your exam date at least '+(est+2)+' weeks from now.':''} Start with the heaviest exam weight (D1 16%, then D3/D4/D5/D7 13%).`:''}
 ${en&&fr?'<br>':''}${fr?`${weak.length} domaine(s) à 60 % ou moins : ${weak.map(d=>'D'+d).join(', ')}. En les traitant l’un après l’autre, comptez environ <b>${w} semaines</b> ; avec deux sessions par jour (un domaine le matin, un autre le soir), environ <b>${est} semaines</b>.${weak.length>=5?' Avec autant de domaines à reconstruire, fixez la date d’examen à au moins '+(est+2)+' semaines.':''} Commencez par le poids d’examen le plus élevé (D1 16 %, puis D3/D4/D5/D7 13 %).`:''}</div>`}

function level(p){return p>=80?['L3','Proficient']:p>=60?['L2','Near proficient']:['L1','Below proficiency']}
function results(timeout){
 const ok=ans.filter((a,i)=>a===quiz[i].a).length,pct=Math.round(ok/quiz.length*100);
 const by={};quiz.forEach((q,i)=>{by[q.d]=by[q.d]||{g:0,n:0,miss:[]};by[q.d].n++;if(ans[i]===q.a)by[q.d].g++;else by[q.d].miss.push(q.topic)});
 const doms=Object.keys(by).map(Number).sort((a,b)=>by[a].g/by[a].n-by[b].g/by[b].n);
 // weighted score using official weights
 let wsum=0,wtot=0;doms.forEach(d=>{wsum+=W[d]*by[d].g/by[d].n;wtot+=W[d]});const wpct=Math.round(wsum/wtot*100);
 app.innerHTML=`<div class="card"><h2>🏁 Results${timeout?' (time is up)':''}</h2>
 <div class="score ${pct>=70?'pass':'fail'}">${pct}%</div>
 <p style="text-align:center">${ok} / ${quiz.length} correct · Weighted by official domain weights: <b>${wpct}%</b><br>
 ${pct>=70?'<b class="pass">Above the 70% practice threshold. Keep consolidating your weakest domains.</b>':'<b class="fail">Below the 70% practice threshold. Follow the revision plan below, starting with your weakest domains.</b>'}</p>
 <h3>Level by domain (weakest first)</h3>
 <table><tr><th>Domain</th><th>Score</th><th style="width:28%">Mastery</th><th>Level</th></tr>
 ${doms.map(d=>{const p=Math.round(by[d].g/by[d].n*100),[c,l]=level(p),col=p>=80?'var(--ok)':p>=60?'#E6A700':'var(--ko)';
 return `<tr><td><b>D${d}</b> ${DN[d]}</td><td>${by[d].g}/${by[d].n} (${p}%)</td><td><div class="bar"><div style="width:${p}%;background:${col}"></div></div></td><td><span class="lvl ${c}">${l}</span></td></tr>`}).join('')}</table>
 <p class="hint">Levels mirror the CISSP score report wording: Proficient (≥ 80%), Near proficient (60–79%), Below proficiency (&lt; 60%). This is a practice estimate, not an official score.</p>
 <div class="nav"><button class="btn2" onclick="home()">⚙ New configuration</button><button class="btn" onclick="start()">🔄 Retake (new order & new questions)</button></div></div>
 <div class="card"><h2>📚 Revision recommendations by domain</h2>
 ${globalPlan(doms,by)}
 ${doms.map(d=>{const p=Math.round(by[d].g/by[d].n*100),r=R[d],txt=p>=80?r.strong:p>=60?r.mid:r.weak;
 return `<div class="rec"><h4>D${d} – ${DN[d]} · ${p}% <span class="lvl ${level(p)[0]}">${level(p)[1]}</span></h4><p style="margin:4px 0">${esc(txt)}</p>
 ${by[d].miss.length?`<b>Topics missed in this test:</b> ${by[d].miss.map(esc).join(' · ')}<br>`:''}
 <b>Classic traps to re-check:</b><ul>${r.traps.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>${p<=60?planHTML(d,p):''}</div>`}).join('')}
 </div>
 <div class="card"><h2>📝 Detailed review</h2><p class="hint">Each question with the best answer, the explanation in English and French, and the exam nuance.</p>
 ${quiz.map((q,i)=>{const g=ans[i]===q.a;return `<div class="rev ${g?'o':'k'}"><span class="tag">D${q.d}</span><span class="tag">${esc(q.topic)}</span>${flags[i]?'<span class="flag">⚑</span>':''}
 <div style="margin:6px 0"><b>${i+1}.</b> ${esc(q.scen)} <b>${esc(q.stem)}</b></div>
 ${g?'✅ ':'❌ Your answer: '+(ans[i]===null?'<i>none</i>':L[ans[i]]+'. '+esc(q.opts[ans[i]]))+'<br>✅ '}<b>Best answer: ${L[q.a]}. ${esc(q.opts[q.a])}</b>${expl(q)}</div>`}).join('')}</div>`;
 window.scrollTo({top:0});
}
home();
</script>
</body></html>

["API security", "By changing /api/accounts/1001 to /1002, a user sees another customer's account.", ["Broken object-level authorization; enforce authorization checks server-side for every object", "SQL injection; use parameterized queries", "Insufficient logging; enable monitoring", "Weak encryption; enforce TLS 1.3"], "BOLA/IDOR is the top OWASP API risk; each object access must be authorized on the server.", "Le BOLA / IDOR est le premier risque de l'OWASP API : chaque accès à un objet doit être autorisé côté serveur.", "Des identifiants aléatoires compliquent l'attaque mais ne remplacent pas le contrôle d'autorisation."],
["AI agent", "An AI assistant reads emails and can initiate supplier payments. A crafted email instructs it to pay a new account.", ["Limit the agent's privileges and require human approval for sensitive actions", "Use a larger language model", "Train users to write safer prompts", "Disable logging of agent actions"], "This combines indirect prompt injection and excessive agency. Least privilege and human-in-the-loop are the governance controls.", "Injection de prompt indirecte et *excessive agency* : le moindre privilège et la validation humaine sont les contrôles de gouvernance.", "Un modèle plus grand n'élimine pas l'injection de prompt."],
["AI-generated code", "Developers accept AI-suggested code without review, including a dependency that does not exist and was later registered by attackers.", ["Review and test AI-generated code like any code, with dependency verification and SCA", "Ban AI tools entirely", "Trust code from reputable AI tools", "Only review code longer than 100 lines"], "AI output is untrusted input; code review, SCA and package allowlists address risks such as slopsquatting.", "La sortie de l'IA est une entrée non fiable ; revue, SCA et liste d'autorisation des paquets contrent des risques comme le *slopsquatting*.", "Interdire peut être disproportionné ; gouverner est la réponse CISSP."],
["Maturity", "An organization measures its development processes quantitatively and now wants continuous improvement.", ["Level 5 – Optimizing", "Level 4 – Quantitatively Managed", "Level 3 – Defined", "Level 2 – Managed"], "CMMI levels: Initial, Managed, Defined, Quantitatively Managed, Optimizing.", "Niveaux CMMI : Initial, Managed, Defined, Quantitatively Managed, Optimizing.", "Le niveau 4 mesure ; le niveau 5 améliore en continu."],
];

B[1] = [
["Qualitative risk", "A telecom operator must rank 40 emerging threats quickly. Reliable loss data is not available, and the experts disagree strongly when discussing in meetings.", "Which technique is MOST appropriate?", ["Delphi technique with anonymous expert rounds", "Quantitative ALE calculation for each threat", "Monte Carlo simulation of financial losses", "A single workshop with a majority vote"], "When data is scarce, qualitative methods are suitable. The Delphi technique gathers anonymous expert opinions in rounds, avoiding dominance and groupthink.", "Sans données fiables, on privilégie le qualitatif ; la méthode Delphi recueille des avis anonymes en plusieurs tours, sans effet de groupe.", "Le quantitatif exige des données fiables ; sans elles, les chiffres donnent une fausse précision."],
["Risk appetite", "The board of a microfinance institution states it will accept moderate operational risk to expand quickly into rural markets, but no risk of regulatory sanctions.", "What has the board defined?", ["Its risk appetite", "Its residual risk", "Its inherent risk", "Its risk register"], "Risk appetite is the amount and type of risk an organization is willing to pursue to meet its objectives. It guides all risk decisions.", "L'appétence au risque est le type et le niveau de risque qu'une organisation accepte pour atteindre ses objectifs.", "La tolérance est l'écart acceptable autour de cette appétence."],
["Total vs residual risk", "After deploying MFA, EDR and backups, a bank's risk team still estimates a moderate probability of a successful ransomware attack.", "How is this remaining risk BEST described?", ["Residual risk, to be accepted by management", "Total risk, to be eliminated by more controls", "Inherent risk, which controls cannot change", "Secondary risk, created by the new controls"], "Residual risk is what remains after controls. It must be compared with the risk appetite and formally accepted.", "Le risque résiduel est ce qui reste après les contrôles ; il est comparé à l'appétence et accepté formellement.", "Le risque zéro n'existe pas : viser à éliminer tout risque n'est pas réaliste."],
["Policy approval", "The CISO has drafted a new information security policy. The IT director wants to publish it immediately on the intranet.", "What should happen FIRST?", ["Senior management approves and endorses the policy", "The IT director publishes it with a cover email", "The legal team rewrites it as a set of procedures", "Each department adapts it to its own needs"], "Policies express management intent and must be approved by senior management to have authority.", "Une politique exprime la volonté de la direction : elle doit être approuvée par celle-ci pour avoir autorité.", "Les procédures et normes découlent ensuite de la politique."],
["CISO reporting", "A CISO reports to the CIO. Security findings about IT operations are regularly downplayed before reaching the executive committee.", "What is the BEST organizational improvement?", ["Have the CISO report independently of IT operations", "Add more security engineers to the IT department", "Require the CIO to approve all security reports", "Move security monitoring to an external provider"], "Independence from the functions being assessed avoids conflicts of interest and ensures risks reach decision-makers.", "L'indépendance vis-à-vis des fonctions contrôlées évite les conflits d'intérêts et fait remonter les risques.", "Ce n'est pas une question de moyens mais de gouvernance."],
["Job rotation", "A bank wants a control that reduces dependency on key individuals and can also reveal irregularities in treasury operations.", "Which control BEST meets both goals?", ["Job rotation", "Background checks", "Non-disclosure agreements", "Security awareness training"], "Job rotation trains backups (reducing single points of failure) and lets new staff discover anomalies (detective).", "La rotation des postes forme des remplaçants (moins de dépendance) et permet de découvrir des anomalies (détection).", "Les congés obligatoires détectent aussi, mais réduisent moins la dépendance aux personnes."],
["Two-person rule", "Opening the vault holding the bank's master cryptographic keys requires two officers to be present, each holding a different key.", "Which principle is applied?", ["Dual control (two-person rule)", "Separation of duties", "Least privilege", "Need to know"], "Dual control requires two people to act together for the same sensitive operation.", "Le double contrôle exige deux personnes pour la même opération sensible.", "La séparation des tâches répartit des tâches différentes entre plusieurs personnes."],
["Split knowledge", "A master key is divided into three components held by three custodians; no single custodian knows the full key.", "Which concept does this illustrate?", ["Split knowledge", "Dual control", "Key escrow", "Separation of duties"], "Split knowledge ensures no individual has enough information to perform a sensitive operation alone.", "Avec la connaissance partagée, personne ne détient seul l'information complète.", "Elle est souvent combinée au double contrôle pour les cérémonies de clés."],
["Onboarding", "A company hires a new database administrator who will access customer financial data from day one.", "Which control should be completed BEFORE access is granted?", ["Background verification and signed confidentiality agreement", "Mandatory vacation scheduling for the first year", "Periodic access recertification by the data owner", "Exit interview checklist preparation"], "Pre-employment screening and NDAs are preventive controls that must occur before granting access to sensitive data.", "La vérification préalable et l'accord de confidentialité sont préventifs : ils précèdent l'accès aux données sensibles.", "Les autres contrôles interviennent plus tard dans le cycle de l'emploi."],
["Third-party contracts", "A hospital outsources its patient records system. The contract covers price and uptime but nothing about security incidents.", "Which clause is MOST important to add?", ["Breach notification and right-to-audit clauses", "A higher uptime percentage in the SLA", "A longer contract term to secure pricing", "A clause transferring all liability to the vendor"], "Incident notification and audit rights let the hospital meet its own obligations and verify the vendor's controls.", "La notification d'incident et le droit d'audit permettent à l'hôpital de remplir ses obligations et de vérifier les contrôles.", "On ne transfère jamais totalement la responsabilité : la clause D est illusoire."],
["Trade secret", "A company's unique credit-scoring algorithm gives it a competitive advantage. Management does not want to disclose how it works.", "Which protection is MOST suitable?", ["Trade secret protection with NDAs and access controls", "A patent, which publicly describes the algorithm", "A trademark registered for the algorithm's name", "Copyright, which protects the underlying idea"], "Trade secrets protect confidential business information as long as reasonable secrecy measures are maintained.", "Le secret commercial protège une information confidentielle tant que des mesures raisonnables de confidentialité sont maintenues.", "Un brevet impose la publication et expire après 20 ans."],
["Copyright", "A developer copies large parts of a competitor's source code into the company's product.", "Which intellectual property right is MOST directly infringed?", ["Copyright", "Trademark", "Patent", "Trade secret"], "Source code is protected as a literary work by copyright.", "Le code source est protégé par le droit d'auteur, comme une œuvre littéraire.", "Le droit d'auteur protège l'expression, pas l'idée."],
["Investigations", "A former employee sues the company for unfair dismissal, claiming the security logs used against him were altered.", "Which standard of proof applies to this case?", ["Preponderance of the evidence", "Beyond a reasonable doubt", "Clear and present danger", "No standard, since it is an internal matter"], "Civil cases use preponderance of the evidence; criminal cases require proof beyond a reasonable doubt.", "Au civil, on retient la prépondérance de la preuve ; au pénal, l'au-delà du doute raisonnable.", "La qualité des preuves (intégrité des journaux) reste déterminante."],
["Export controls", "A software company wants to sell an encryption product to customers in several countries.", "What should the company check FIRST?", ["Import and export restrictions on cryptography", "The customers' internal security policies", "Whether competitors use the same algorithms", "The product's Common Criteria EAL level"], "Cryptography is subject to import/export controls (for example the Wassenaar Arrangement and national laws).", "La cryptographie est soumise à des contrôles d'import et d'export (Arrangement de Wassenaar, lois nationales).", "Le non-respect peut entraîner des sanctions pénales."],
["Data localization", "A pan-African bank wants to centralize customer data from five countries in a single data center abroad.", "What is the MOST important issue to assess?", ["Transborder data flow and data localization laws", "Network latency between the five countries", "The data center's physical security tier", "Exchange rate risk on hosting costs"], "Many countries regulate cross-border transfers of personal or financial data; legal compliance must be assessed before architecture choices.", "De nombreux pays encadrent les transferts transfrontaliers de données personnelles ou financières ; la conformité vient avant l'architecture.", "Mindset : le juridique et le risque précèdent la technique."],
["Management liability", "Under NIS2, a regulator finds that executives never approved or supervised cybersecurity risk measures.", "What is the MOST likely consequence?", ["Executives can be held personally accountable", "Only the CISO can be sanctioned", "The IT provider bears the liability", "No consequence if no incident occurred"], "NIS2 requires management bodies to approve and oversee cybersecurity measures and can hold them accountable.", "NIS2 impose aux dirigeants d'approuver et de superviser les mesures de cybersécurité, et peut engager leur responsabilité.", "Tendance de fond : la cybersécurité devient une responsabilité du conseil d'administration."],
["AI governance", "Employees paste customer data into public generative AI tools to draft emails. No policy exists.", "What should the organization do FIRST?", ["Define an AI acceptable use policy based on a risk assessment", "Block all AI websites at the proxy immediately", "Buy an enterprise AI license for every employee", "Train employees on prompt engineering techniques"], "Governance starts with a risk-based policy (allowed tools, data classes, approvals), followed by technical controls and training.", "La gouvernance commence par une politique fondée sur le risque (outils autorisés, données, validations), puis viennent les contrôles et la formation.", "Bloquer sans alternative pousse souvent vers un shadow AI encore moins visible."],
["Privacy principles", "A retailer collected phone numbers for delivery and now wants to use them for political campaign messages for a partner.", "Which privacy principle would be violated?", ["Purpose limitation", "Data accuracy", "Storage limitation", "Security safeguards"], "Data collected for one purpose cannot be reused for an incompatible purpose without a legal basis.", "Des données collectées pour une finalité ne peuvent pas servir une finalité incompatible sans base légale.", "Principe OCDE / RGPD de limitation des finalités."],
["MTD", "A BIA shows that if online payments stop for more than 8 hours, the company will lose its banking license.", "What does the 8-hour value represent?", ["Maximum tolerable downtime", "Recovery point objective", "Work recovery time", "Mean time to repair"], "MTD is the longest interruption the business can tolerate before irreversible damage. RTO must be lower.", "La MTD est l'interruption maximale tolérable avant un dommage irréversible ; le RTO doit être inférieur.", "RTO + WRT ≤ MTD."],
["RPO", "An e-commerce site can tolerate losing at most 15 minutes of orders.", "Which metric is defined, and what does it drive?", ["The RPO; it drives backup or replication frequency", "The RTO; it drives the choice of recovery site", "The MTD; it drives insurance coverage", "The WRT; it drives staff testing time"], "The RPO is the maximum acceptable data loss measured in time; it determines backup or replication frequency.", "Le RPO est la perte de données maximale acceptable ; il dicte la fréquence des sauvegardes ou de la réplication.", "Le RTO, lui, concerne le délai de reprise."],
["Ethics reporting", "A CISSP learns that a colleague, also certified, is falsifying audit evidence for a client.", "What should the CISSP do?", ["Report the violation through appropriate channels, including ISC2 if needed", "Ignore it, since it concerns another person's client", "Confront the colleague publicly on social media", "Correct the evidence secretly to protect the client"], "Members must act honorably and support the profession, which includes reporting ethics violations through proper channels.", "Les membres doivent agir avec honneur et protéger la profession, ce qui inclut le signalement des violations par les bons canaux.", "La dénonciation publique ou la correction secrète violent elles-mêmes le Code."],
["Awareness metrics", "A security team reports that 100% of employees completed annual training, yet phishing incidents keep rising.", "Which metric BEST shows the program's real effectiveness?", ["Phishing report rate and time to report", "Training completion percentage", "Number of training modules published", "Average quiz score after training"], "Behavioral metrics show whether training changes behavior; completion rates only show participation.", "Les indicateurs de comportement montrent si la formation change les pratiques ; le taux de complétion ne mesure que la participation.", "Le taux de signalement est un indicateur clé d'une culture de sécurité."],
["ISO 27001", "During ISO 27001 certification, the auditor asks why certain Annex A controls are not implemented.", "Which document should answer this question?", ["The Statement of Applicability", "The risk treatment plan budget", "The incident response plan", "The business continuity plan"], "The SoA lists Annex A controls, whether they apply and the justification for inclusion or exclusion.", "La déclaration d'applicabilité liste les contrôles de l'annexe A, leur applicabilité et la justification.", "Elle découle de l'analyse et du traitement des risques."],
["Governance frameworks", "A company wants a framework focused on IT governance, aligning IT processes with business goals and defining management objectives.", "Which framework is MOST suitable?", ["COBIT", "ISO 27002", "NIST SP 800-53", "PCI DSS"], "COBIT is an IT governance and management framework. ISO 27002 and SP 800-53 are control catalogs; PCI DSS is a sector standard.", "COBIT est un cadre de gouvernance des SI ; ISO 27002 et SP 800-53 sont des catalogues de contrôles ; PCI DSS est sectoriel.", "COSO cible le contrôle interne global."],
["Risk transfer limits", "A company outsources its SOC to a managed provider and believes security monitoring risk is now fully transferred.", "Which statement is MOST accurate?", ["The task is outsourced but accountability remains with the company", "Accountability moves to the provider under the contract", "Risk is avoided because the company no longer monitors", "Risk is shared equally by both parties by law"], "Outsourcing transfers execution, not accountability. The company must oversee the provider through SLAs, reports and audits.", "L'externalisation transfère l'exécution, pas la responsabilité ; l'entreprise doit superviser le prestataire (SLA, rapports, audits).", "Principe clé du D1, souvent piégé à l'examen."],
];

B[2] = [
["Data steward", "Customer addresses are inconsistent across the CRM, billing and delivery systems, causing failed deliveries and complaints.", "Which role is BEST placed to define standards and fix data quality?", ["Data steward", "Data custodian", "Data processor", "System administrator"], "The data steward is responsible for data quality, definitions and consistency on behalf of the business.", "Le data steward est responsable de la qualité, des définitions et de la cohérence des données pour le métier.", "Le custodian assure la protection technique, pas la qualité métier."],
["DPO", "A company processes health data at large scale and wants a role that advises on GDPR obligations and monitors compliance independently.", "Which role should be designated?", ["Data protection officer", "Data owner", "Chief information officer", "Data custodian"], "The DPO advises, monitors compliance and is the contact point for the supervisory authority, with independence.", "Le DPO conseille, contrôle la conformité et sert d'interlocuteur à l'autorité, en toute indépendance.", "Le DPO ne doit pas décider des finalités : c'est le rôle du responsable de traitement."],
["Declassification", "A project plan classified Confidential becomes public once the product is launched.", "What should happen to the document's classification?", ["The owner declassifies it per the classification policy", "It keeps its original level permanently", "The custodian deletes it after the launch", "IT automatically relabels it as Public"], "Classification is reviewed over time; the owner can declassify when sensitivity decreases, following the policy.", "La classification est revue dans le temps ; l'owner peut déclassifier quand la sensibilité diminue.", "Sur-classifier inutilement augmente les coûts de protection."],
["Categorization", "A system's confidentiality impact is low, integrity impact is high and availability impact is moderate.", "Using FIPS 199 high-water mark, how is it categorized?", ["High", "Moderate", "Low", "It depends on the data volume"], "The overall categorization is the highest impact among C, I and A.", "La catégorisation globale correspond au plus haut impact parmi C, I et A.", "On parle de *high-water mark*."],
["Paper disposal", "An insurer must dispose of thousands of paper claim files containing medical information.", "Which method is MOST appropriate?", ["Cross-cut shredding or pulping by a certified provider", "Recycling them in standard paper bins", "Strip-cut shredding by office staff", "Storing them in a locked basement indefinitely"], "Sensitive paper requires secure destruction (cross-cut, pulping, incineration) with a certificate.", "Le papier sensible exige une destruction sûre (coupe croisée, réduction en pâte, incinération) avec certificat.", "La coupe en bandes permet parfois une reconstitution."],
["Removable media", "Engineers transfer production data with personal USB sticks; one stick was lost in a taxi.", "What is the BEST control?", ["Block unapproved removable media and require encrypted approved devices", "Ask engineers to label their USB sticks with their names", "Allow USB sticks but scan them with antivirus", "Ban all data transfers between systems"], "Device control combined with encrypted, managed media addresses both loss and malware risks while allowing business needs.", "Le contrôle des périphériques et des supports chiffrés gérés traite la perte et les logiciels malveillants sans bloquer le métier.", "Tout interdire est disproportionné."],
["Media classification", "Backup tapes containing Secret and Unclassified data are stored together in an offsite vault.", "How should the tapes be handled?", ["As Secret, the highest level they contain", "As Unclassified, since most data is unclassified", "According to the label of the first backup set", "As Confidential, an average of both levels"], "Media must be protected at the highest classification of data it contains.", "Un support est protégé au niveau de la donnée la plus sensible qu'il contient.", "Cela s'applique aussi au transport et à la destruction."],
["Tokenization", "A merchant wants to reduce PCI DSS scope while still allowing refunds on past card transactions.", "Which approach is MOST suitable?", ["Tokenize card numbers via a secure token vault", "Hash card numbers with SHA-256 in the database", "Mask the card numbers when displayed on screen", "Encrypt the database with a key stored on the same server"], "Tokens replace card data in systems; only the vault maps them back, reducing scope while enabling refunds.", "Les jetons remplacent les numéros de carte ; seul le coffre fait la correspondance, ce qui réduit le périmètre PCI.", "Le hachage empêcherait le remboursement : c'est irréversible."],
["Masking", "Developers need realistic customer data to test a new billing feature.", "What is the BEST practice?", ["Use masked or synthetic data in test environments", "Copy production data to test with stricter passwords", "Give developers read-only access to production", "Use production data but delete it after testing"], "Test environments are less protected; masked or synthetic data avoids exposing real personal data.", "Les environnements de test sont moins protégés ; des données masquées ou synthétiques évitent d'exposer des données réelles.", "La minimisation s'applique aussi aux tests."],
["Anonymization", "A ministry publishes an 'anonymized' dataset with age, postal code and diagnosis. Journalists re-identify several patients.", "What was the main weakness?", ["Quasi-identifiers allowed re-identification by inference", "The dataset was not encrypted at rest", "The publication site lacked TLS", "Names should have been hashed with MD5"], "Removing names is not enough; combinations of quasi-identifiers can re-identify individuals.", "Retirer les noms ne suffit pas : la combinaison de quasi-identifiants permet la ré-identification.", "D'où les techniques de généralisation, de k-anonymat ou de confidentialité différentielle."],
["Shadow AI", "Monitoring shows staff uploading contract documents to unapproved AI services.", "Which control BEST provides visibility and enforcement?", ["A CASB with DLP policies for AI services", "A stateful firewall rule on port 443", "Full-disk encryption on laptops", "A yearly user awareness email"], "A CASB with DLP discovers cloud and AI usage and can block sensitive uploads.", "Un CASB avec DLP découvre les usages cloud et IA et peut bloquer l'envoi de données sensibles.", "Il faut aussi une politique d'usage de l'IA et des outils approuvés."],
["Lifecycle", "A new HR application will create employee evaluation records.", "When should these records be classified?", ["At creation, by the data owner", "When they are first archived", "After the first security audit", "When they are shared externally"], "Classification at creation ensures protections apply throughout the lifecycle.", "Classifier à la création garantit une protection tout au long du cycle de vie.", "Classifier tard laisse une période sans protection adaptée."],
["DSPM", "A company has thousands of cloud storage buckets and databases across three cloud providers and no idea where sensitive data resides.", "Which capability BEST addresses this?", ["Data security posture management with automated discovery", "A quarterly manual spreadsheet inventory", "A network IDS in each cloud region", "A web application firewall for each application"], "DSPM discovers and classifies data across cloud stores and highlights exposure and misconfigurations.", "Le DSPM découvre et classifie les données dans le cloud et signale expositions et mauvaises configurations.", "Il complète l'inventaire, il ne remplace pas la gouvernance."],
["System owner", "A payroll application processes data owned by HR, but a separate manager is responsible for the application's operation, budget and security plan.", "What is this manager's role?", ["System owner", "Data owner", "Data steward", "Data subject"], "The system owner is accountable for a system's operation and security controls; the data owner is accountable for the data.", "Le propriétaire du système répond du système et de ses contrôles ; le propriétaire des données répond des données.", "Une même personne peut parfois cumuler les deux rôles."],
["Software assets", "An audit reveals unlicensed software and unpatched applications installed by users on corporate laptops.", "Which practice BEST addresses this?", ["Software asset management with an approved software list", "Annual license purchase for all popular software", "Allowing users admin rights to update software", "Network-based antivirus scanning only"], "Software asset management inventories software, controls licenses and supports patching and allowlisting.", "La gestion des actifs logiciels inventorie, contrôle les licences et facilite correctifs et listes d'autorisation.", "Retirer les droits d'administration local aide aussi."],
["Data sovereignty", "A government agency wants to use a SaaS whose data may be replicated to data centers in other jurisdictions.", "What is the MOST important requirement to verify?", ["Contractual guarantees on data location and applicable law", "The SaaS provider's uptime history", "The number of available user interface languages", "The provider's pricing model"], "Data location determines applicable law and potential foreign access; it must be contractually guaranteed.", "La localisation des données détermine le droit applicable et les accès étrangers possibles ; elle doit être garantie par contrat.", "C'est un sujet de souveraineté autant que de conformité."],
["Data in transit", "A branch office sends daily transaction files to headquarters over the Internet using FTP.", "What is the BEST improvement?", ["Use SFTP or FTPS with strong authentication", "Compress the files before sending them", "Send the files at night when traffic is low", "Rename the files to hide their content"], "FTP sends data and credentials in cleartext. SFTP or FTPS protect confidentiality and integrity in transit.", "FTP transmet données et identifiants en clair ; SFTP ou FTPS les protègent en transit.", "Renommer un fichier relève de l'obscurité, pas de la sécurité."],
["BYOK", "A bank wants to keep control over the encryption keys protecting its data in a cloud database.", "Which approach BEST meets this goal?", ["Bring your own key with keys in a customer-controlled HSM", "Provider-managed keys with default rotation", "Disable encryption and rely on access control", "Store the keys in the application's configuration file"], "Customer-managed keys keep control over access and enable crypto-shredding at exit.", "Les clés gérées par le client gardent le contrôle et permettent le crypto-shredding en sortie.", "Stocker les clés avec l'application annule l'intérêt du chiffrement."],
["Public bucket", "A security review finds a cloud storage bucket with customer ID scans accessible to anyone with the URL.", "What should be done FIRST?", ["Remove public access, then assess exposure through access logs", "Rename the bucket to an unpredictable name", "Encrypt the files and keep public access", "Notify customers before changing anything"], "Contain first by removing public access, then investigate access logs to determine whether notification is required.", "Contenir d'abord en supprimant l'accès public, puis analyser les journaux pour décider d'une notification.", "Un nom aléatoire n'est pas un contrôle d'accès."],
["Integrity verification", "A company distributes large data files to partners and wants them to verify the files were not altered in transit.", "What is the simplest suitable mechanism?", ["Publish SHA-256 hashes through a separate trusted channel", "Compress the files with a password", "Send the files twice and compare them", "Use MD5 checksums in the same email"], "Hashes allow integrity verification; publishing them separately prevents an attacker from replacing both file and hash.", "Les empreintes permettent de vérifier l'intégrité ; les publier par un canal séparé empêche de remplacer fichier et empreinte.", "Pour prouver l'origine, il faut une signature numérique."],
["Media transport", "Backup tapes are sent weekly to an offsite vault by courier.", "Which combination BEST protects them?", ["Encryption, tamper-evident packaging and chain of custody", "A trusted courier and a locked bag", "Labeling the tapes with their content description", "Sending tapes by regular registered mail"], "Encryption protects confidentiality; tamper-evident packaging and chain of custody provide integrity and accountability.", "Le chiffrement protège la confidentialité ; les scellés et la chaîne de possession assurent intégrité et traçabilité.", "Étiqueter le contenu en clair aide les voleurs."],
["Archiving", "Regulations require keeping loan records for 10 years. The company is changing its document management system next year.", "What is the MAIN risk to address?", ["Long-term readability and integrity of archived records", "The cost of storage media", "The speed of the new search engine", "User training on the new interface"], "Archives must remain readable, complete and intact for the retention period despite technology changes.", "Les archives doivent rester lisibles, complètes et intègres pendant toute la durée de conservation, malgré les changements technologiques.", "Formats ouverts, migrations planifiées et contrôles d'intégrité."],
["E-discovery", "A regulator requests all emails about a specific product between 2022 and 2024 within 30 days.", "Which capability is MOST helpful?", ["Indexed, retained email archives with legal hold capabilities", "Daily incremental backups of mail servers", "Users' personal exports of their mailboxes", "A larger mailbox quota for all users"], "E-discovery requires searchable, preserved records; backups are not designed for legal search.", "L'e-discovery exige des archives indexées et préservées ; les sauvegardes ne sont pas faites pour la recherche juridique.", "Une bonne rétention réduit aussi le volume à analyser."],
["Hardware EOL", "Network switches will reach end-of-life next year; the vendor will stop selling them but support continues for three more years.", "What is the BEST action now?", ["Plan replacement before end-of-support while keeping them patched", "Replace all switches immediately", "Ignore the notice until support ends", "Disable firmware updates to avoid changes"], "EOL means no longer sold; EOS is the critical date when patches stop. Plan the lifecycle accordingly.", "EOL : plus vendu ; EOS : fin des correctifs, la vraie échéance critique. On planifie en conséquence.", "Remplacer tout de suite peut être disproportionné."],
["Privacy by design", "A mobile app team wants to collect users' precise location continuously 'for future features'.", "What should the security architect recommend?", ["Collect only data needed for defined purposes, with privacy by design", "Collect everything now and encrypt it", "Collect the data but anonymize it after five years", "Let users opt out in the settings menu"], "Privacy by design and minimization require collecting only what is necessary for a defined purpose.", "La protection dès la conception et la minimisation imposent de ne collecter que le nécessaire pour une finalité définie.", "Chiffrer une donnée inutile reste une collecte excessive."],
];

B[3] = [
["Reference monitor", "An architect describes a component that must mediate every access, be tamperproof and be small enough to be fully verified.", "What is being described?", ["The reference monitor concept", "The trusted platform module", "The hypervisor", "The security perimeter"], "The reference monitor must be always invoked, tamperproof and verifiable; the security kernel implements it.", "Le moniteur de référence doit être toujours invoqué, inviolable et vérifiable ; le noyau de sécurité l'implémente.", "Le TPM est une puce matérielle, pas un concept d'arbitrage des accès."],
["Protection rings", "A device driver with a vulnerability allows an attacker to take full control of the operating system.", "Why is this so severe?", ["Drivers often run in ring 0 with kernel privileges", "Drivers run in ring 3 with user privileges", "Drivers are outside the trusted computing base", "Drivers cannot be patched once installed"], "Code in ring 0 runs with the highest privilege; compromising it compromises the whole system.", "Le code en ring 0 s'exécute avec les plus hauts privilèges : le compromettre compromet tout le système.", "REX : CrowdStrike 2024 a montré l'impact d'un composant noyau défaillant."],
["TPM", "A company wants laptops to detect if the boot loader or firmware has been tampered with before releasing disk encryption keys.", "Which technology BEST supports this?", ["TPM with measured or secure boot", "A hardware security module in the data center", "Antivirus scanning at login", "BIOS administrator password"], "The TPM stores measurements of the boot chain and can seal keys so they are released only if integrity is verified.", "Le TPM mesure la chaîne de démarrage et scelle les clés, libérées seulement si l'intégrité est vérifiée.", "Le HSM protège des clés d'entreprise, pas le démarrage d'un poste."],
["HSM", "A payment processor needs to generate and protect master keys with FIPS 140-3 validated hardware and strict dual control.", "Which solution is MOST appropriate?", ["A hardware security module", "A TPM on each server", "An encrypted key file on a hardened server", "A password manager"], "HSMs are dedicated, tamper-resistant devices for key generation, storage and use.", "Le HSM est un équipement dédié et résistant à l'effraction pour générer, stocker et utiliser les clés.", "FIPS 140-3 est la référence de validation des modules cryptographiques."],
["Common Criteria", "A ministry must choose a firewall evaluated against a protection profile with the highest practical assurance for commercial products.", "Which statement is MOST accurate?", ["Higher EAL means more rigorous evaluation, not necessarily more features", "EAL7 means the product has the most security features", "EAL1 is the most rigorous level of evaluation", "Common Criteria certification guarantees no vulnerabilities"], "EAL levels reflect assurance (depth of evaluation), not functionality, and do not guarantee absence of flaws.", "Le niveau EAL reflète la rigueur de l'évaluation, pas les fonctionnalités, et ne garantit pas l'absence de failles.", "PP = besoin, ST = affirmations du fournisseur, TOE = cible évaluée."],
["Covert channel", "Two processes that are not allowed to communicate exchange data by one process filling the disk to 100% and the other checking free space.", "What type of attack is this?", ["A covert storage channel", "A covert timing channel", "A side-channel power analysis", "A TOCTOU race condition"], "Using a shared resource's state (disk space) to signal is a storage channel; modulating time is a timing channel.", "Utiliser l'état d'une ressource partagée est un canal de stockage ; moduler le temps est un canal temporel.", "Contre-mesures : analyse des canaux cachés, isolation des ressources."],
["Side channel", "Researchers extract an encryption key from a smart card by measuring tiny variations in its power consumption.", "Which countermeasure BEST addresses this?", ["Constant-time, power-balanced implementations and shielding", "Longer keys with the same implementation", "Switching from AES to 3DES", "Storing the key in a different file"], "Side-channel attacks exploit physical leakage; implementation hardening is needed, not just longer keys.", "Les attaques par canal auxiliaire exploitent des fuites physiques ; il faut durcir l'implémentation, pas seulement allonger la clé.", "Les HSM certifiés intègrent ces protections."],
["TEMPEST", "An embassy is concerned that screens and cables emit signals that could be captured from outside the building.", "Which countermeasure is MOST appropriate?", ["TEMPEST shielding, zoning or Faraday cages", "Encrypting all files on the workstations", "Installing a stronger firewall", "Using longer screen-lock passwords"], "Electromagnetic emanations are addressed by shielding, distance (zoning) and white noise.", "Les émanations électromagnétiques se traitent par blindage, zonage et bruit blanc.", "Le chiffrement des fichiers ne protège pas ce qui s'affiche à l'écran."],
["Virtualization", "A cloud provider hosts multiple customers' VMs on the same hypervisor. A vulnerability allows code in one VM to run on the host.", "What is this risk called, and what reduces it most?", ["VM escape; hypervisor patching and hardening", "VM sprawl; an inventory of virtual machines", "Hyperjacking; antivirus in each guest", "Snapshot leakage; encrypted snapshots"], "VM escape breaks isolation between guests and host; keeping the hypervisor patched and minimal is key.", "La fuite de VM rompt l'isolation ; il faut maintenir l'hyperviseur à jour et minimal.", "Le VM sprawl est un problème de gouvernance, pas d'isolation."],
["Containers", "A team deploys containers from public images and runs them as root with privileged mode for convenience.", "What is the BEST improvement?", ["Use signed, scanned images and run as non-root without privileged mode", "Add antivirus inside each container image", "Increase the container restart frequency", "Move containers to larger virtual machines"], "Containers share the host kernel; least privilege and trusted images limit breakout and supply-chain risks.", "Les conteneurs partagent le noyau de l'hôte ; le moindre privilège et des images de confiance limitent les risques.", "Le mode privilégié supprime une grande partie de l'isolation."],
["Microservices", "Dozens of microservices communicate internally over plain HTTP, assuming the internal network is trusted.", "Which approach aligns with Zero Trust?", ["Mutual TLS and service-level authorization between services", "A stronger perimeter firewall around the cluster", "Moving all services into a single VLAN", "Logging all HTTP requests in the SIEM"], "Zero Trust requires authenticating and authorizing every service call, typically via mTLS and a service mesh.", "Le Zero Trust exige d'authentifier et d'autoriser chaque appel entre services, généralement par mTLS et un service mesh.", "Le réseau interne n'est pas une zone de confiance."],
["ICS", "A water utility wants to send sensor data from its control network to the corporate network without any possibility of inbound traffic.", "Which technology is MOST appropriate?", ["A unidirectional gateway (data diode)", "A stateful firewall with strict rules", "A VPN between the two networks", "A shared VLAN with ACLs"], "Data diodes physically enforce one-way flow, ideal for protecting critical OT networks.", "La diode de données impose physiquement un flux unidirectionnel, idéal pour protéger les réseaux industriels critiques.", "Modèle Purdue et IEC 62443 pour la segmentation OT."],
["Diffie-Hellman", "Two servers use Diffie-Hellman to agree on a session key, but no certificates or signatures are exchanged.", "What is the MAIN weakness?", ["Vulnerability to man-in-the-middle attacks", "The key exchange is too slow", "The session key is sent in cleartext", "It cannot generate keys longer than 56 bits"], "Unauthenticated DH can be intercepted by a MITM who negotiates separate keys with each side.", "Un Diffie-Hellman non authentifié peut être intercepté par un attaquant intermédiaire.", "On l'authentifie avec des certificats ou signatures."],
["Forward secrecy", "A server's private RSA key was stolen. The company fears that years of recorded TLS traffic can now be decrypted.", "Which feature would have prevented this?", ["Perfect forward secrecy using ephemeral key exchange", "Longer RSA keys of 4096 bits", "Certificate pinning in client applications", "More frequent certificate renewal"], "With ephemeral (EC)DHE, session keys are not derivable from the long-term private key.", "Avec un échange éphémère (EC)DHE, les clés de session ne se déduisent pas de la clé privée à long terme.", "TLS 1.3 impose la confidentialité persistante."],
["Revocation", "A web server's certificate private key was compromised. Clients must stop trusting the certificate quickly.", "What should be done?", ["Revoke the certificate and rely on OCSP or CRL checking", "Wait for the certificate to expire", "Change the server's IP address", "Reissue the same certificate with a new date"], "Revocation published through CRL/OCSP lets clients reject compromised certificates before expiry.", "La révocation, publiée par CRL ou OCSP, permet de rejeter un certificat compromis avant son expiration.", "L'OCSP stapling améliore performances et vie privée."],
["Key escrow", "A company wants to recover encrypted business data if an employee leaves or loses their key.", "Which mechanism addresses this need?", ["Key escrow or recovery agents under strict controls", "Using the same key for all employees", "Disabling encryption on business documents", "Emailing keys to the IT manager"], "Key escrow or recovery agents allow authorized recovery while maintaining controls such as dual control.", "Le séquestre de clés ou les agents de récupération permettent une récupération autorisée sous contrôles stricts.", "Ne jamais séquestrer les clés de signature : cela affaiblirait la non-répudiation."],
["Birthday attack", "An attacker generates many document variants to find two with the same short hash value, one benign and one malicious.", "Which attack is this, and what mitigates it?", ["Birthday attack; use longer hash outputs such as SHA-256", "Rainbow table attack; add salts", "Brute force; lock out accounts", "Replay attack; add timestamps"], "Birthday attacks exploit collision probability; longer digests make collisions infeasible.", "L'attaque des anniversaires exploite la probabilité de collision ; des empreintes plus longues la rendent impraticable.", "MD5 et SHA-1 sont vulnérables aux collisions."],
["One-time pad", "A cryptography trainee claims a one-time pad is unbreakable.", "Under which condition is this true?", ["The key is truly random, as long as the message and never reused", "The key is at least 256 bits long", "The algorithm is kept secret", "The message is compressed first"], "The OTP is theoretically unbreakable only if all three conditions hold; reuse breaks it.", "Le masque jetable n'est incassable que si la clé est aléatoire, aussi longue que le message et jamais réutilisée.", "Sa gestion des clés le rend impraticable à grande échelle."],
["Signature process", "Explain how Moussa signs a contract digitally so that anyone can verify it.", "Which sequence is correct?", ["Hash the contract, then encrypt the hash with Moussa's private key", "Encrypt the contract with the recipient's public key", "Hash the contract, then encrypt the hash with Moussa's public key", "Encrypt the contract with a shared symmetric key"], "The signature is the hash encrypted with the signer's private key; verifiers use the public key.", "La signature est l'empreinte chiffrée avec la clé privée du signataire ; on vérifie avec sa clé publique.", "Le hachage rend la signature rapide sur de gros documents."],
["Kerckhoffs", "A vendor claims its proprietary encryption algorithm is secure because nobody knows how it works.", "Which principle does this violate?", ["Kerckhoffs's principle: only the key should be secret", "Defense in depth", "Least privilege", "Separation of duties"], "Security should not depend on algorithm secrecy; public, peer-reviewed algorithms are preferred.", "La sécurité ne doit pas reposer sur le secret de l'algorithme ; on préfère des algorithmes publics et éprouvés.", "C'est le principe d'*open design*."],
["CPTED", "A new bank branch is being designed. The security consultant recommends clear sightlines, good lighting and landscaping that guides visitors to the entrance.", "Which approach is this?", ["Crime Prevention Through Environmental Design", "Defense in depth through layered firewalls", "Zero Trust architecture", "Security through obscurity"], "CPTED uses natural surveillance, natural access control and territorial reinforcement to deter crime.", "Le CPTED utilise la surveillance naturelle, le contrôle d'accès naturel et le renforcement territorial.", "Ce sont des contrôles physiques dissuasifs et préventifs."],
["Tailgating", "Staff at a data center hold the door for colleagues who forgot their badges.", "Which control BEST prevents this?", ["A mantrap (access control vestibule) plus awareness", "A sign reminding staff to badge in", "CCTV recording of the entrance", "Longer badge PIN codes"], "A mantrap enforces one person per authentication; awareness addresses the social aspect.", "Le sas impose une personne par authentification ; la sensibilisation traite l'aspect humain.", "La vidéo détecte après coup, elle n'empêche pas."],
["Power", "A data center experiences frequent prolonged low-voltage periods that cause equipment to reboot.", "What is the problem, and the BEST protection?", ["Brownouts; online UPS with voltage regulation", "Spikes; surge protectors", "Blackouts; a second utility contract", "Faults; more frequent backups"], "A brownout is prolonged low voltage; online UPS units regulate voltage continuously.", "Le brownout est une sous-tension prolongée ; un onduleur en ligne régule la tension en continu.", "Spike = pic bref, sag = creux bref, blackout = coupure prolongée."],
["Environment", "A server room's humidity is measured at 20%, and technicians report static shocks.", "What should be done?", ["Increase humidity to the recommended range of about 40–60%", "Lower the temperature to 10°C", "Increase airflow from outside the building", "Install additional fire extinguishers"], "Low humidity causes static discharge; high humidity causes condensation and corrosion.", "Une humidité basse provoque de l'électricité statique ; trop élevée, de la condensation et de la corrosion.", "Pression positive et contrôle de la température complètent."],
["Fire classes", "A fire starts in a generator room where diesel fuel has leaked.", "Which fire class is this, and which agent is suitable?", ["Class B; foam, CO₂ or dry chemical", "Class A; water", "Class C; water mist", "Class D; sand only"], "Flammable liquids are class B (US); water can spread the fire.", "Les liquides inflammables sont de classe B (US) ; l'eau peut propager le feu.", "Classes US : A solides, B liquides, C électrique, D métaux, K cuisine."],

["SASE", "A company with many remote users and SaaS applications wants consistent security policies without backhauling traffic to headquarters.", "Which architecture fits BEST?", ["SASE combining SD-WAN with cloud-delivered security", "More bandwidth to the headquarters firewall", "A full-tunnel VPN for every user", "A DMZ in each branch office"], "SASE delivers networking and security (SWG, CASB, ZTNA, FWaaS) from the cloud, close to users.", "Le SASE fournit réseau et sécurité (SWG, CASB, ZTNA, FWaaS) depuis le cloud, près des utilisateurs.", "SSE désigne la partie sécurité seule."],

["PCI segmentation", "A retailer wants to reduce the number of systems in scope for PCI DSS.", "What is the MOST effective approach?", ["Segment the cardholder data environment from other networks", "Encrypt all internal email traffic", "Apply PCI controls only to web servers", "Use VLANs without filtering between them"], "Proper segmentation isolates the CDE, reducing scope; VLANs without filtering are not sufficient.", "Une segmentation effective isole l'environnement des données de carte et réduit le périmètre ; des VLAN sans filtrage ne suffisent pas.", "La segmentation doit être testée régulièrement."],
["Bastion host", "Administrators connect directly from their workstations to production servers via RDP and SSH.", "What is the BEST improvement?", ["Route admin access through a hardened, monitored jump server", "Give each administrator a static public IP", "Allow RDP only during business hours", "Change default ports for RDP and SSH"], "A bastion/jump host centralizes, hardens and records administrative access.", "Le bastion centralise, durcit et enregistre les accès d'administration.", "Changer de port relève de l'obscurité, pas d'un vrai contrôle."],

["Break-glass", "During an outage of the identity provider, administrators could not log in to restore services.", "What should have been in place?", ["Monitored break-glass emergency accounts with sealed credentials", "Shared admin passwords posted in the data center", "MFA disabled for all administrators", "A single local admin account for everyone"], "Break-glass accounts provide emergency access with strong protection and alerting on use.", "Les comptes d'urgence offrent un accès de secours, fortement protégés et surveillés.", "Toute utilisation doit déclencher une alerte et une revue."],

["Account lockout", "Locking accounts after 3 failed attempts has allowed an attacker to lock out all executives before a key meeting.", "What is the BEST balance?", ["Progressive delays, smart lockout and MFA with monitoring", "Disable lockout completely", "Lock accounts permanently after one failure", "Remove passwords and use usernames only"], "Lockout can enable denial of service; throttling, smart lockout and MFA balance security and availability.", "Le verrouillage peut provoquer un déni de service ; la temporisation et le MFA équilibrent sécurité et disponibilité.", "Disponibilité = élément de la triade CIA."],
["Role explosion", "A company has created 2,300 RBAC roles for 1,500 employees, and nobody understands them.", "What is the BEST improvement?", ["Rationalize roles and add attributes for contextual rules", "Give everyone a single broad role", "Switch entirely to discretionary access control", "Create new roles for every exception"], "Role engineering reduces role explosion; ABAC attributes handle context without new roles.", "La rationalisation des rôles limite leur prolifération ; les attributs ABAC gèrent le contexte sans créer de rôles.", "Les modèles hybrides RBAC + ABAC sont courants."],
["Content-dependent", "HR managers can see employees' records except the salary field unless the employee is in their own department.", "Which access control technique is this?", ["Content-dependent access control", "Constrained interface", "Discretionary access control", "Rule-based time restrictions"], "Access depends on the content of the data (salary field, department value).", "L'accès dépend du contenu de la donnée (champ salaire, valeur du service).", "Le context-dependent dépend de la situation (heure, lieu, séquence)."],
["Context-dependent", "A payment can only be approved after it has been created and reviewed, and only during business hours.", "Which technique is applied?", ["Context-dependent access control", "Content-dependent access control", "Discretionary access control", "Capability tables"], "Context-dependent control considers sequence, time or location of the request.", "Le contrôle dépendant du contexte considère la séquence, l'heure ou le lieu.", "Exemple classique : la séquence d'actions obligatoire."],
["ACL vs capability", "A system stores, for each user, the list of objects and operations the user may access.", "What is this structure called?", ["A capability list", "An access control list", "A security label", "A clearance level"], "Capability lists are attached to subjects; ACLs are attached to objects.", "Les listes de capacités sont attachées aux sujets ; les ACL aux objets.", "Ce sont les lignes et les colonnes d'une matrice d'accès."],
["MAC compartments", "An analyst holds a Top Secret clearance but cannot read a Top Secret file labeled with the 'NUCLEAR' compartment.", "Why is access denied?", ["She lacks need to know for that compartment", "Her clearance is lower than the file's level", "The file owner has not shared it with her", "Top Secret files can never be read"], "MAC requires both sufficient clearance and need to know for the compartments.", "Le MAC exige à la fois une habilitation suffisante et le besoin d'en connaître pour les compartiments.", "Ce n'est pas le propriétaire qui décide : il ne s'agit pas de DAC."],
["Access recertification", "During quarterly reviews, managers approve all access without checking because the lists are too long.", "What is the BEST improvement?", ["Risk-based reviews focused on privileged and unusual access", "Stop reviews since they add no value", "Let IT approve all access instead of managers", "Review access only once every three years"], "Effective reviews prioritize high-risk entitlements and give owners actionable information.", "Des revues efficaces ciblent les droits à risque et donnent aux owners des informations exploitables.", "La revue « tamponnée » sans analyse est un anti-pattern fréquent."],
["SCIM", "A company uses 40 SaaS applications and accounts are created manually in each, often with delays and errors.", "Which standard BEST automates provisioning?", ["SCIM", "SAML", "LDAP", "Kerberos"], "SCIM automates user provisioning and deprovisioning across cloud applications.", "SCIM automatise la création et la suppression des comptes dans les applications cloud.", "SAML fédère l'authentification, il ne provisionne pas."],
["Third-party identity", "Contractors access internal systems using accounts created manually, without end dates.", "What is the BEST practice?", ["Sponsored accounts with expiration dates and periodic review", "Shared contractor accounts per vendor", "Permanent accounts to avoid re-creation", "Personal email addresses as usernames"], "Third-party identities need a sponsor, limited duration and regular review.", "Les identités de tiers exigent un sponsor, une durée limitée et une revue régulière.", "Ce sont souvent des comptes orphelins oubliés."],
["Non-human identities", "An AI agent uses a long-lived API key with administrator rights to manage cloud resources.", "What is the BEST approach?", ["Scoped, short-lived credentials with monitoring and human approval", "Keep the key but store it in the agent's prompt", "Share the key with other agents for efficiency", "Give the agent the CISO's personal account"], "Non-human identities require least privilege, short-lived credentials, monitoring and approval for sensitive actions.", "Les identités non humaines exigent moindre privilège, identifiants de courte durée, surveillance et validation des actions sensibles.", "État de l'art 2026 : les identités machines dépassent largement les humaines."],

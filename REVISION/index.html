rex:["Sécurité Built-in, jamais Bolt-on.","Configuration Drift → IaC et gestion des changements.","BLP = secret militaire ; Biba = intégrité ; Clark-Wilson = fraude comptable ; Brewer-Nash = conflit d'intérêts.","Approche basée sur le risque : on choisit un contrôle parce que l'analyse le justifie.","Contrôles compensatoires pour l'équipement obsolète (Air-gap, surveillance).","Swap/Paging : les secrets en RAM peuvent finir sur disque.","Fibre / câbles blindés contre l'écoute EMR.","Architecture (segmentation) plutôt que « installer un outil » pour SCADA/IoT.","AES, RSA/ECC, SHA-256 ; jamais MD5, SHA-1, DES, WEP.","La crypto tombe par l'implémentation (side-channel) et la gestion des clés.","Salle serveurs au centre du bâtiment ; wiring closets réservés à l'IT.","Pre-Action pour un data center ; Life Safety : Fail Safe pour les issues."],
etat:["Cryptographie post-quantique : FIPS 203 (ML-KEM), 204 (ML-DSA), 205 (SLH-DSA) publiés en août 2024 ; HQC sélectionné en 2025 ; dépréciation de RSA/ECC visée vers 2030–2035 (NIST IR 8547).","Crypto-agilité et inventaire cryptographique (CBOM).","Zero Trust (NIST SP 800-207) et architecture SASE.","Confidential Computing et attestation matérielle.","Sécurité des conteneurs et Kubernetes (images signées, policy as code).","Sécurité OT : IEC 62443, modèle Purdue."],
bp:["Appliquer les principes de Saltzer & Schroeder (moindre privilège, fail-safe defaults, complete mediation, open design…).","Durcissement (CIS Benchmarks) et images de référence.","HSM pour les clés critiques, rotation et séparation des rôles de gestion des clés.","TLS 1.3 + AEAD (AES-GCM, ChaCha20-Poly1305).","Segmentation des environnements OT/IT.","Exercices d'évacuation et tests des systèmes anti-incendie."],
tips:["BLP: no read up, no write down (confidentiality). Biba: no read down, no write up (integrity).","Symmetric keys: N(N−1)/2; asymmetric: 2N.","Sign with your private key; encrypt for someone with their public key.","Life safety: doors fail safe; systems fail secure.","Pre-action sprinklers are the preferred water-based suppression for data centers."]},
4:{fr:"Sécurité des communications et des réseaux",en:"Communication and Network Security",w:13,
sub:["4.1 Architecture réseau et sécurité (OSI, TCP/IP, IPsec, segmentation, SDN, sans fil)","4.2 Composants réseau sécurisés (pare-feu, NAC, câblage, endpoints)","4.3 Canaux de communication sécurisés (voix, accès distant, données, tiers)"],
rex:["Defense in Depth : segmentation (VLAN, DMZ) + IDS + WAF + chiffrement.","Telnet/FTP → SSH/SFTP, toujours.","Zero Trust : aucune confiance implicite liée au réseau interne.","802.1X sur toute prise RJ45 accessible.","BYOD → NAC avec Health check.","Accountability non transférable au MSP/cloud ; contrat et SLA sont les leviers.","Jamais RDP 3389 ou SSH 22 exposés sur Internet ; VPN/bastion préalable.","Ne jamais faire confiance au FAI : chiffrer soi-même (IPsec, TLS).","Broadcast → Routeur ; Collision → Switch.","Placer le contrôle à la bonne couche : SYN Flood → Stateful (L4) ; SQLi → WAF (L7)."],
etat:["SASE / SSE (ZTNA, SWG, CASB, FWaaS) remplace progressivement les VPN d'accès distant.","Wi-Fi 6E/7 avec WPA3 obligatoire.","TLS 1.3 généralisé, ECH (Encrypted Client Hello) en déploiement, DoH/DoT.","RPKI pour sécuriser BGP.","DMARC obligatoire pour les gros expéditeurs (Google/Yahoo 2024).","Hybrid PQC dans TLS (X25519MLKEM768 déployé par les grands navigateurs)."],
bp:["Segmenter par niveau de confiance et micro-segmenter les charges critiques.","Désactiver protocoles et suites obsolètes (SSLv3, TLS 1.0/1.1, SMBv1, WEP).","Centraliser l'AAA (RADIUS/TACACS+) avec MFA pour l'administration.","Superviser les flux (NetFlow, NDR) et protéger les ports SPAN/TAP.","SPF + DKIM + DMARC p=reject.","Documenter l'architecture réseau et revoir les règles de pare-feu périodiquement."],
tips:["Memorize the OSI layers top-down: All People Seem To Need Data Processing.","IPsec: AH = integrity only; ESP = confidentiality + integrity; tunnel mode protects the whole packet.","TACACS+ encrypts the full payload; RADIUS encrypts only the password.","DNSSEC provides integrity, not confidentiality.","Evil twin impersonates; rogue AP is unauthorized on the LAN."]},
5:{fr:"Gestion des identités et des accès (IAM)",en:"Identity and Access Management",w:13,
sub:["5.1 Contrôle d'accès physique et logique","5.2 Identification et authentification","5.3 Identité fédérée","5.4 Mécanismes d'autorisation","5.5 Cycle de vie du provisionnement","5.6 Systèmes d'authentification"],
rex:["Le physique prime sur le logique.","People, Processes, Technology, Physical spaces.","Kerberos : synchronisation d'horloge (~5 min) et KDC = SPOF.","Biométrie : le CER le plus bas gagne.","MFA = au moins deux catégories différentes.","SSO = clés du royaume → MFA obligatoire.","Fédération : confiance formalisée juridiquement.","OAuth = délégation d'accès.","RBAC = réponse par défaut pour l'entreprise ; DAC risqué ; MAC rigide.","Accès adaptatif = Risk-Based Access Control.","Départ : révocation immédiate (Deprovisioning).","PAM + Just-in-Time ; plus de rotation forcée des mots de passe."],
etat:["Passkeys (FIDO2/WebAuthn) déployées massivement : MFA résistant au phishing.","NIST SP 800-63-4 (version finale 2025) : niveaux IAL/AAL/FAL révisés, passkeys synchronisables reconnues.","ITDR (Identity Threat Detection and Response).","Gouvernance des identités non humaines (comptes de service, clés API, agents IA).","Zero Standing Privileges et CIEM pour le cloud.","Identité décentralisée (portefeuille EUDI, Verifiable Credentials)."],
bp:["Un identifiant unique par personne, aucun compte partagé.","Automatiser Joiner-Mover-Leaver via IGA, SCIM et RBAC.","Revues d'accès trimestrielles pour les droits sensibles.","MFA résistant au phishing pour administrateurs et accès distants.","PAM : coffre, rotation, enregistrement de session, JIT.","Tiering Active Directory et protection contre Pass-the-Hash/Ticket."],
tips:["Identification is a claim; authentication proves it; authorization grants rights; accountability traces actions.","Type I error = false rejection; Type II error = false acceptance.","SAML = XML assertions (enterprise SSO); OAuth = delegated authorization; OIDC = authentication on OAuth.","Privilege creep happens during job transfers.","Kerberos tickets: TGT from the AS, service ticket from the TGS."]},
6:{fr:"Évaluation et tests de la sécurité",en:"Security Assessment and Testing",w:12,
sub:["6.1 Stratégies d'évaluation, de test et d'audit","6.2 Tests de sécurité et gestion des vulnérabilités","6.3 Collecte des données des processus de sécurité","6.4 Analyse et rapports","6.5 Audits de sécurité"],
rex:["Layered Assurance : interne → externe → tiers.","Autorisation écrite et Rules of Engagement avant tout scan.","Le client signe l'acceptation des risques (ex. SCADA).","Preuves techniques + preuves administratives.","Evidence-based assurance : pas de promesses orales.","Une exception sans date de fin = risque caché.","Rapport clair, actionnable, auditable.","Fournisseur cloud non auditable → SOC 2 Type II.","Indépendance : l'IT n'audite jamais son propre travail."],
etat:["CVSS v4.0 (2023) + priorisation par EPSS et catalogue CISA KEV.","CTEM (Continuous Threat Exposure Management) et BAS.","Tests TLPT obligatoires sous DORA pour la finance européenne (TIBER-EU).","Purple teaming basé sur MITRE ATT&CK.","Audit continu (Continuous Controls Monitoring) et GRC automatisée."],
bp:["Programme de scans authentifiés réguliers avec SLA de remédiation par criticité.","Pentests annuels et après changement majeur, plus Bug Bounty / VDP.","Tableaux de bord KPI/KRI pour la direction.","Gestion formelle des exceptions (propriétaire, expiration, compensation).","Échantillonnage statistique et preuves horodatées pour les audits.","Tests de restauration et de DRP planifiés."],
tips:["Vulnerability assessment finds; penetration test exploits.","False negatives are more dangerous than false positives.","SOC 1 = financial; SOC 2 = security trust services; SOC 3 = public; Type II = over a period.","Black box = no knowledge; white box = full knowledge; gray box = partial.","KPIs measure performance; KRIs signal risk."]},
7:{fr:"Opérations de sécurité",en:"Security Operations",w:13,
sub:["7.1 Investigations","7.2 Journalisation et surveillance","7.3 Gestion des configurations","7.4 Concepts fondamentaux des opérations","7.5 Protection des ressources","7.6 Gestion des incidents","7.7 Détection et prévention","7.8 Vulnérabilités et correctifs","7.9 Gestion des changements","7.10 Stratégies de récupération","7.11 Processus de reprise","7.12 Tests du DRP","7.13 Maintenance du plan (BC)","7.14 Sécurité physique","7.15 Sécurité du personnel"],
rex:["Agir comme si la preuve allait au tribunal ; chaîne de traçabilité.","Ne jamais toucher l'original : image bit-à-bit, bloqueur d'écriture.","Logs centralisés, chiffrés, WORM ; normalisation par le SIEM.","Golden Image automatisée ; traiter la dérive par la cause racine.","SoD impossible → logs + revue par un tiers.","Sauvegardes chiffrées avant de quitter le site ; désactiver les protocoles obsolètes.","IR : contenir et restaurer, pas contre-attaquer ; Lessons Learned obligatoire.","Ne pas éteindre un poste infecté : l'isoler.","Honeypot = Threat Intelligence, pas poursuite (Entrapment).","Patch critique : test d'abord.","L'héroïsme est un défaut : Emergency Change + ECAB.","Pas de rollback = rejet du changement.","RAID ≠ sauvegarde ; site de secours justifié par le BIA/RTO.","Feu : évacuation d'abord ; déclaration du sinistre par un cadre désigné.","Full Interruption en dernier, avec l'aval du Board.","DRP non maintenu = cause n°1 d'échec ; copies papier hors site.","Badge perdu : désactiver d'abord.","Ordinateur de voyage d'un pays à risque : quarantaine et effacement."],
etat:["NIST SP 800-61 Rev. 3 (avril 2025) aligné sur CSF 2.0.","XDR, SOAR et SOC augmentés par l'IA (copilotes d'analyse).","Sauvegardes immuables et règle 3-2-1-1-0 face aux ransomwares.","Obligations de notification : NIS2 (alerte précoce 24 h, notification 72 h), SEC 8-K (4 jours ouvrés après détermination de matérialité), DORA.","ISO/IEC 22301:2019 et ISO/IEC 27031 pour la continuité."],
bp:["Playbooks d'incident testés (ransomware, compromission de messagerie, fuite de données).","Synchronisation NTP de toutes les sources de logs.","CMDB et baselines vérifiées automatiquement.","Gestion des correctifs pilotée par le risque (KEV en priorité).","Exercices de crise réguliers impliquant la direction et la communication.","Programme Insider Threat respectueux de la vie privée."],
tips:["Order of volatility: registers/cache, RAM, network state, processes, disk, remote logs, archives.","NIST IR: Preparation; Detection & Analysis; Containment, Eradication & Recovery; Post-incident Activity.","Differential restore = full + last differential; incremental restore = full + all incrementals.","DRP tests from least to most disruptive: checklist, walkthrough, simulation, parallel, full interruption.","Enticement is legal; entrapment is not."]},
8:{fr:"Sécurité du développement logiciel",en:"Software Development Security",w:10,
sub:["8.1 Sécurité dans le SDLC","8.2 Contrôles dans l'écosystème de développement","8.3 Efficacité de la sécurité logicielle","8.4 Impact des logiciels acquis","8.5 Codage sécurisé"],
rex:["Plus la faille est découverte tard, plus elle coûte cher (jusqu'à 100×).","Shift Left : tester au moment de l'écriture.","Secret Scanning dans le CI/CD contre les clés dans Git.","Dev → Test/QA → Staging → Production.","Log4j → SCA + SBOM.","SAST en développement ; DAST en test/QA.","COTS vulnérable : l'entreprise reste responsable.","Jamais de confiance aveugle envers un éditeur : preuves indépendantes.","Validation côté serveur, toujours.","Fail Securely : session fermée, erreur générique."],
etat:["NIST SSDF (SP 800-218) et attestations de développement sécurisé.","SBOM (SPDX, CycloneDX), SLSA, Sigstore pour la provenance des artefacts.","EU Cyber Resilience Act : obligations de gestion des vulnérabilités et de signalement (à partir de 2026–2027).","Langages memory-safe (Rust) encouragés par CISA/NSA.","OWASP Top 10 for LLM Applications et sécurité des assistants de code IA.","OWASP Top 10 web 2021 (édition 2025 en préparation) et API Security Top 10 2023."],
bp:["Exigences de sécurité dans le backlog et la Definition of Done.","Threat modeling par fonctionnalité sensible.","Pipeline DevSecOps : SAST, SCA, secret scanning, IaC scanning, DAST, signature.","Dépôts de dépendances internes et versions épinglées.","Revue de code par les pairs avec protection des branches.","Clauses contractuelles : SBOM, SLA de correctifs, droit d'audit, séquestre."],
tips:["Security requirements first: it is cheapest to fix flaws in requirements and design.","Parameterized queries beat blacklists against injection.","XSS abuses user trust in a site; CSRF abuses site trust in a browser.","CMMI: Initial, Managed, Defined, Quantitatively Managed, Optimizing.","Spiral model = risk-driven iterations."]}

["Le fournisseur refuse l'audit sur site. Que demander ?",["Un rapport SOC 2 Type II et une certification ISO 27001 à jour","Une attestation sur l'honneur","Un pentest non autorisé de son infrastructure","Rien, le contrat suffit"],"Les attestations indépendantes fournissent une assurance fondée sur des preuves.","REX fiches : fournisseur cloud non auditable → SOC 2 Type II."],

["Usine de traitement d'eau",3,"Une usine utilise un automate SCADA sous Windows XP, non patchable, indispensable à la production. Un audit révèle qu'il est joignable depuis le réseau bureautique.",[

["Que faire du RDP exposé ?",["Le retirer d'Internet et passer par un bastion ou un ZTNA avec MFA","Le déplacer sur le port 3390","Le laisser avec un mot de passe complexe","Bloquer uniquement les IP étrangères"],"Les ports d'administration exposés sont une cible majeure.","Jamais 3389 ou 22 exposés directement."],
["Évolution cible de l'accès distant ?",["Accès par application fondé sur l'identité et la posture (Zero Trust / ZTNA)","VPN plein tunnel pour tous","Réseau à plat","Confiance par adresse IP interne"],"Pas de confiance implicite liée au réseau.","NIST SP 800-207."]]],

["Quelle leçon pour les sauvegardes ?",["Ajouter des copies immuables ou hors ligne (3-2-1-1-0) et tester les restaurations","Passer en RAID 1","Synchroniser en temps réel vers le cloud","Garder une seule copie sur le NAS"],"Les attaquants ciblent d'abord les sauvegardes en ligne.","Une sauvegarde non testée n'est pas une sauvegarde."]]],

 const act=store.get('cissp:act',{});act[today()]=(act[today()]||0)+1;store.set('cissp:act',act);

 else if(!ok){L.cards[id]={box:1,due:L.lc}}
 store.set('cissp:leit',L);

function pool(lang,doms){return doms.reduce((a,d)=>a+DATA[d][lang].length,0)}

 <div class="panel setup" style="margin-top:20px">

function fixCount(lang){const c=cfg[lang],av=pool(lang,c.doms);if(c.count>av){const ok=T[lang].counts.filter(n=>n<=av);c.count=ok.length?ok[ok.length-1]:av}}

/* ---------- sessions ---------- */
function weighted(lang,doms,total,order){
 total=Math.min(total,pool(lang,doms));let alloc={};
 if(doms.length===1){alloc[doms[0]]=total}else{
  const wsum=doms.reduce((a,d)=>a+META[d].w,0);let used=0;
  const raw=doms.map(d=>({d,x:total*META[d].w/wsum}));
  raw.forEach(r=>{alloc[r.d]=Math.min(Math.floor(r.x),DATA[r.d][lang].length);used+=alloc[r.d]});
  raw.sort((a,b)=>(b.x-Math.floor(b.x))-(a.x-Math.floor(a.x)));
  let i=0;while(used<total&&i<400){const r=raw[i%raw.length];if(alloc[r.d]<DATA[r.d][lang].length){alloc[r.d]++;used++}i++}}
 let ids=[];doms.forEach(d=>{let idx=DATA[d][lang].map((_,i)=>i);idx=order==='seq'?idx:shuffle(idx);idx.slice(0,alloc[d]).forEach(i=>ids.push(`${lang}:${d}:${i}`))});
 return order==='seq'||doms.length===1?ids:shuffle(ids);
}
function newSession(o){return Object.assign({kind:'quiz',ui:'fr',mode:'learn',cur:0,done:false,flags:[],lock:[],title:''},o,{ans:o.qs.map(()=>({k:null,c:null}))})}
function startQuiz(lang){const c=cfg[lang];store.set('cissp:cfg:'+lang,c);const doms=c.doms.length?c.doms:[1];
 session=newSession({kind:'quiz',ui:lang,mode:c.mode,qs:weighted(lang,doms,c.count,c.order).map(prep)});go(lang==='fr'?'quiz':'english')}
function persistSim(){if(session&&session.kind==='sim')store.set('cissp:sim',session)}

 const settle=()=>{if(learn&&a.k!=null&&a.c!=null&&!s.lock[s.cur]){s.lock[s.cur]=true;const ok=q.opts[a.k].ok;record(q.id,ok,a.c,s.kind);}};

 keyH=e=>{const k=e.key.toUpperCase();const i='ABCD'.indexOf(k);if(k.length===1&&i>=0){const b=app.querySelector(`.opt[data-k="${i}"]`);if(b&&!b.disabled)b.click()}else if(['1','2','3'].includes(e.key)){const b=app.querySelector(`[data-c="${CERTS[+e.key-1]}"]`);if(b&&!b.disabled)b.click()}else if(e.key==='Enter'){const n=$('#next');if(n&&!n.disabled){e.preventDefault();n.click()}}};

  logSession(s.kind==='quiz'?(s.ui==='fr'?'Quiz FR':'Quiz EN'):sim?'Simulateur':s.kind==='leitner'?'Carnet d\'erreurs':s.kind==='case'?'Étude de cas':'Angles morts',s.qs.length,good);
  if(sim){store.del('cissp:sim');const h=store.get('cissp:simhist',[]);h.unshift({t:Date.now(),n:s.qs.length,good,used:Math.round((Math.min(Date.now(),s.endAt)-s.startAt)/60000)});store.set('cissp:simhist',h.slice(0,20))}
 }

 </div>
 <h2 style="margin:24px 0 12px">${t.review}</h2>
 <div class="stack" style="gap:8px">${s.qs.map((q,i)=>{const a=s.ans[i],ok=isOk(i),c=q.opts.find(o=>o.ok);return `
  <details class="rev" ${!ok?'open':''}><summary><span class="mark ${ok?'ok':'ko'}">${ok?'✓':'✗'}</span><span>${i+1}. ${kw(q.q)}${a.c?` <span class="ctag c-${a.c}">${t[a.c]}</span>`:''}</span></summary>
  <div class="body">${q.ctx?`<div class="ctx" style="margin:0">${kw(q.ctx)}</div>`:''}${!ok?`<div><b>${t.your} :</b> ${a.k==null?t.none:kw(q.opts[a.k].t)}</div>`:''}<div><b>${t.good} :</b> ${kw(c.t)}</div><div>${kw(q.e)}</div><div class="rex"><b>${t.rex}</b>${kw(q.r)}</div></div></details>`}).join('')}</div>`;

/* ---------- N°1 simulateur ---------- */
function startSim(n,cat){const ids=weighted('en',DOMS,n,'rand');const min=n>=100?180:90;

function simBar(){return `<div class="simbar"><span class="mono" id="clock">--:--:--</span><span>${session.ans.filter(a=>a.k!=null).length}/${session.qs.length} answered · ${session.flags.filter(Boolean).length} marked${session.cat?' · CAT rule: no going back':''}</span></div>`}
function simGrid(){const s=session;return `<details class="gridwrap" ${s.cat?'':'open'}><summary>Navigation grid</summary><div class="grid">${s.qs.map((q,i)=>`<button class="gcell ${i===s.cur?'cur':''} ${s.ans[i].k!=null?'done':''} ${s.flags[i]?'flag':''}" data-i="${i}" ${s.cat&&i!==s.cur?'disabled':''} aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div><div class="legend"><span><i class="lg done"></i>answered</span><span><i class="lg flag"></i>marked</span><span><i class="lg cur"></i>current</span></div></details>`}
function startSimClock(){stopTimer();const upd=()=>{const s=session;if(!s||s.kind!=='sim'||s.done){stopTimer();return}const left=Math.max(0,s.endAt-Date.now());const el=$('#clock');if(el){const h=Math.floor(left/3600000),m=Math.floor(left/60000)%60,se=Math.floor(left/1000)%60;el.textContent=`${h}:${String(m).padStart(2,'0')}:${String(se).padStart(2,'0')}`;el.classList.toggle('late',left<10*60000)}if(left<=0){s.done=true;persistSim();renderResult()}};upd();timer=setInterval(upd,1000)}
function askSubmit(){const s=session,un=s.ans.filter(a=>a.k==null).length,fl=s.flags.filter(Boolean).length;
 $('#confirm').innerHTML=`<div class="confirm"><b>Submit the exam?</b><span>${un} unanswered · ${fl} marked for review. Unanswered questions count as wrong.</span><div class="row"><button class="btn" id="cno">Keep working</button><button class="btn primary" id="cyes">Submit</button></div></div>`;

 if(session&&session.kind==='sim'){if(session.done)return renderResult();return renderQ()}

  <article class="panel"><div class="eyebrow">Format CAT minimum</div><h3>100 questions · 3 h</h3><p>Le CAT s'arrête entre 100 et 150 questions selon votre niveau. 100 questions pondérées exactement comme l'examen.</p><button class="btn primary" data-sim="100">Start · 100 Q</button></article>
  <article class="panel"><div class="eyebrow">Format court</div><h3>50 questions · 1 h 30</h3><p>Même cadence (1,8 min par question) pour un entraînement en milieu de semaine.</p><button class="btn" data-sim="50">Start · 50 Q</button></article>
 </div>
 <label class="toggle"><input type="checkbox" id="cat"> Règle CAT stricte : aucun retour arrière, ni grille de navigation (comme le vrai examen)</label>

 ${hist.length?`<div class="panel" style="margin-top:16px"><h3>Dernières simulations</h3><table class="ctable" style="margin-top:8px"><tr><th>Date</th><th>Score</th><th>%</th><th>Durée</th></tr>${hist.map(h=>`<tr><td>${new Date(h.t).toLocaleDateString('fr-FR')}</td><td class="mono">${h.good}/${h.n}</td><td class="mono">${Math.round(h.good/h.n*100)} %</td><td class="mono">${h.used} min</td></tr>`).join('')}</table></div>`:''}

/* ---------- N°2 Leitner ---------- */
function leit(){return store.get('cissp:leit',{lc:0,cards:{},mastered:0})}
function leitDue(){const L=leit();return Object.values(L.cards).filter(c=>c.due<=L.lc+1).length}
function startLeitner(all){const L=leit();L.lc++;store.set('cissp:leit',L);
 let ids=Object.keys(L.cards).filter(id=>all||L.cards[id].due<=L.lc);ids.sort((a,b)=>L.cards[a].box-L.cards[b].box);ids=ids.slice(0,20);
 if(!ids.length)return viewLeitner();
 session=newSession({kind:'leitner',ui:'fr',mode:'learn',qs:shuffle(ids).map(prep),title:'Carnet d\'erreurs'});go('carnet')}
function viewLeitner(){
 if(session&&session.kind==='leitner')return renderQ();
 const L=leit(),ids=Object.keys(L.cards),box=[1,2,3].map(b=>ids.filter(id=>L.cards[id].box===b));
 const due=ids.filter(id=>L.cards[id].due<=L.lc+1).length;
 app.innerHTML=`
 <div class="eyebrow">N°2 · Répétition espacée</div>
 <h1>Carnet d'erreurs</h1>
 <p class="lede">Chaque erreur, dans n'importe quel quiz, entre en boîte 1. Une bonne réponse la fait monter d'une boîte et espace son retour ; une erreur la renvoie en boîte 1. Réussie en boîte 3, elle est maîtrisée et sort du carnet.</p>
 <div class="boxes">${[1,2,3].map(b=>`<div class="box b${b}"><div class="eyebrow">Boîte ${b}</div><b>${box[b-1].length}</b><span>${b===1?'revient à chaque séance':b===2?'revient toutes les 2 séances':'revient toutes les 4 séances'}</span></div>`).join('')}<div class="box bm"><div class="eyebrow">Maîtrisées</div><b>${L.mastered}</b><span>sorties du carnet</span></div></div>
 <div class="row" style="margin:16px 0"><button class="btn primary" id="lgo" ${due?'':'disabled'}>Réviser les cartes dues · ${Math.min(due,20)}</button><button class="btn" id="lall" ${ids.length?'':'disabled'}>Réviser tout le carnet (20 max.)</button><span class="hint">Séance n°${L.lc+1}</span></div>
 ${ids.length?`<div class="panel"><h3>Cartes en cours</h3><div style="overflow-x:auto;margin-top:8px"><table class="ctable"><tr><th>Boîte</th><th>Domaine</th><th>Question</th></tr>${ids.sort((a,b)=>L.cards[a].box-L.cards[b].box).slice(0,60).map(id=>{const it=item(id);return `<tr><td class="mono">${L.cards[id].box}</td><td class="mono">D${it.d}</td><td>${kw(it.q.length>140?it.q.slice(0,140)+'…':it.q)}</td></tr>`}).join('')}</table></div>${ids.length>60?`<p class="hint">… et ${ids.length-60} autres.</p>`:''}</div>`:`<div class="panel empty">Le carnet est vide. Faites un quiz : vos erreurs y apparaîtront automatiquement.</div>`}`;
 $('#lgo').onclick=()=>startLeitner(false);$('#lall').onclick=()=>startLeitner(true);
}

/* ---------- N°3/4/10 progression ---------- */
function predict(){const h=store.get('cissp:hist',{});const dom={};DOMS.forEach(d=>dom[d]={n:0,s:0,ok:0,m:0});
 Object.keys(h).forEach(id=>{const d=idDom(id),r=h[id];dom[d].n++;if(r.ok){dom[d].ok++;dom[d].s+=CW[r.c]||.75}});
 let sc=0,answered=0;DOMS.forEach(d=>{const x=dom[d];x.m=x.n?x.s/x.n:0;sc+=META[d].w*x.m;answered+=x.n});
 return{dom,score:Math.round(sc),answered,covered:DOMS.filter(d=>dom[d].n>=10).length}}
function streak(){const act=store.get('cissp:act',{});let n=0;const d=new Date();if(!act[today()])d.setDate(d.getDate()-1);
 for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(act[k]){n++;d.setDate(d.getDate()-1)}else break}return n}
function startBlind(){const h=store.get('cissp:hist',{});const ids=Object.keys(h).filter(id=>!h[id].ok&&h[id].c==='sure');if(!ids.length)return;
 session=newSession({kind:'blind',ui:'fr',mode:'learn',qs:pick(ids,20).map(prep),title:'Angles morts'});renderQ()}
function viewProgress(){
 if(session&&session.kind==='blind')return renderQ();
 const P=predict(),h=store.get('cissp:hist',{}),act=store.get('cissp:act',{}),goal=store.get('cissp:goal',30),ses=store.get('cissp:sessions',[]);
 const cs={};CERTS.forEach(c=>cs[c]={g:0,n:0});Object.values(h).forEach(r=>{const c=r.c||'hesit';cs[c].n++;if(r.ok)cs[c].g++});
 const blind=Object.keys(h).filter(id=>!h[id].ok&&h[id].c==='sure').length;
 const days=[];const d0=new Date();d0.setDate(d0.getDate()-34);for(let i=0;i<35;i++){const d=new Date(d0);d.setDate(d0.getDate()+i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');days.push([k,act[k]||0,d])}
 const todayN=act[today()]||0;
 const gap=70-P.score;
 app.innerHTML=`
 <div class="eyebrow">N°3 · N°4 · N°10</div>
 <h1>Progression et score prédit</h1>
 <p class="lede">Calculé à partir de la dernière réponse donnée à chaque question, tous quiz confondus. Une bonne réponse vaut 1 si vous étiez « Sûr », 0,75 si « Hésitant » et 0,25 « Au hasard ».</p>
 <div class="fgrid" style="margin-top:20px">
  <section class="panel full"><div class="predict">
   <div class="ring big" style="--p:${P.score}"><b>${P.answered?P.score:'—'}<small>/100</small></b></div>
   <div class="stack" style="gap:8px;min-width:0">
    <div class="eyebrow">N°4 · Score prédit sur 100 questions pondérées</div>
    <h2>${!P.answered?'Pas encore de données':P.score>=70?'Au-dessus du seuil indicatif de 70/100':`À ${gap} point${gap>1?'s':''} du seuil indicatif de 70/100`}</h2>
    <span class="pill ${P.covered===8?'ok':'mid'}">Fiabilité : ${P.covered}/8 domaines avec au moins 10 réponses</span>
    <p style="font-size:13px;color:var(--muted);margin:0">Un domaine non travaillé compte pour 0 : la prédiction reste prudente tant que la couverture est incomplète. Le seuil officiel est de 700/1000 en score pondéré.</p>
   </div></div>
   <div style="overflow-x:auto;margin-top:16px"><table class="ctable ptable"><tr><th>Domaine</th><th>Poids</th><th>Réponses</th><th>Justes</th><th>Maîtrise</th><th>Points /100</th></tr>
   ${DOMS.map(d=>{const x=P.dom[d];return `<tr><td>D${d} · ${esc(META[d].fr)}</td><td class="mono">${META[d].w}</td><td class="mono">${x.n}</td><td class="mono">${x.ok}</td><td><div class="mbar"><i style="width:${Math.round(x.m*100)}%" class="${x.m>=.8?'g':x.m>=.7?'m':'b'}"></i><span class="mono">${x.n?Math.round(x.m*100)+' %':'—'}</span></div></td><td class="mono">${(META[d].w*x.m).toFixed(1)} / ${META[d].w}</td></tr>`}).join('')}</table></div></section>
  <section class="panel"><h3>N°3 · Calibration de la certitude</h3><div style="overflow-x:auto;margin-top:10px"><table class="ctable"><tr><th>Déclaré</th><th>Réponses</th><th>Taux de réussite</th></tr>${CERTS.map(c=>`<tr><td>${T.fr[c]}</td><td class="mono">${cs[c].n}</td><td class="mono">${cs[c].n?Math.round(cs[c].g/cs[c].n*100)+' %':'—'}</td></tr>`).join('')}</table></div>
   <p style="font-size:13px;color:var(--muted);margin:10px 0">Bien calibré : « Sûr » proche de 100 %, « Au hasard » proche de 25 %.</p>
   <div class="row"><span class="pill ${blind?'ko':'ok'}">${blind} angle${blind>1?'s':''} mort${blind>1?'s':''}</span><button class="btn" id="blind" ${blind?'':'disabled'}>Réviser mes erreurs « Sûr »</button></div></section>
  <section class="panel"><h3>N°10 · Objectif et régularité</h3>
   <div class="row" style="margin-top:10px"><div class="stat"><b>${todayN}/${goal}</b><span>aujourd'hui</span></div><div class="stat"><b>${streak()}</b><span>jour${streak()>1?'s':''} de série</span></div><div class="stat"><b>${Object.keys(h).length}</b><span>questions vues /504</span></div></div>
   <div class="row" style="margin-top:12px"><label for="goal" class="hint">Objectif quotidien</label><select id="goal">${[10,20,30,50,80,100].map(n=>`<option ${n===goal?'selected':''}>${n}</option>`).join('')}</select></div>
   <div class="heat" aria-label="Activité des 35 derniers jours">${days.map(([k,n,d])=>`<i title="${d.toLocaleDateString('fr-FR')} : ${n} réponse${n>1?'s':''}" class="l${n===0?0:n<goal/2?1:n<goal?2:3} ${k===today()?'now':''}"></i>`).join('')}</div>
   <div class="legend"><span><i class="lg l0"></i>0</span><span><i class="lg l1"></i>&lt; ½ objectif</span><span><i class="lg l2"></i>&lt; objectif</span><span><i class="lg l3"></i>objectif atteint</span></div></section>
  <section class="panel full"><h3>Historique des séances</h3>${ses.length?`<div style="overflow-x:auto;margin-top:8px"><table class="ctable"><tr><th>Date</th><th>Activité</th><th>Score</th></tr>${ses.slice(0,15).map(x=>`<tr><td>${new Date(x.t).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(x.kind)}</td><td class="mono">${x.good}/${x.n} · ${Math.round(x.good/x.n*100)} %</td></tr>`).join('')}</table></div>`:'<p class="hint" style="margin-top:8px">Aucune séance terminée pour l\'instant.</p>'}</section>
  <section class="panel full"><h3>Sauvegarder ou transférer ma progression</h3>
   <p style="font-size:13.5px;color:var(--muted);margin:6px 0 10px">La progression est stockée dans ce navigateur. Copiez le code pour la conserver ou la transférer sur un autre appareil, puis collez-le ici pour la restaurer.</p>
   <div class="row"><button class="btn" id="exp">Générer et copier mon code</button><button class="btn" id="imp">Restaurer depuis un code</button><button class="btn" id="rst">Tout remettre à zéro</button></div>
   <textarea id="code" rows="3" placeholder="Votre code de sauvegarde apparaît ici, ou collez un code pour le restaurer." aria-label="Code de sauvegarde"></textarea><div id="pmsg" class="hint"></div></section>
 </div>`;
 $('#goal').onchange=e=>{store.set('cissp:goal',+e.target.value);viewProgress()};
 $('#blind').onclick=startBlind;
 $('#exp').onclick=()=>{const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('cissp:')&&k!=='cissp:sim')o[k]=localStorage.getItem(k)}}catch(e){}
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(o))));const ta=$('#code');ta.value=code;
  const done=m=>{$('#pmsg').textContent=m};try{navigator.clipboard.writeText(code).then(()=>done('Code copié dans le presse-papiers.'),()=>{ta.select();done('Sélectionnez et copiez le code ci-dessus.')})}catch(e){ta.select();done('Sélectionnez et copiez le code ci-dessus.')}};
 $('#imp').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#code').value.trim()))));let n=0;Object.keys(o).forEach(k=>{if(k.startsWith('cissp:')){localStorage.setItem(k,o[k]);n++}});$('#pmsg').textContent=n+' éléments restaurés.';setTimeout(viewProgress,700)}catch(e){$('#pmsg').textContent='Code invalide : vérifiez qu\'il a été copié en entier.'}};
 $('#rst').onclick=()=>{$('#pmsg').innerHTML='Effacer toute la progression (scores, carnet, historique) ? <button class="btn" id="rno">Annuler</button> <button class="btn danger" id="ryes">Effacer</button>';
  $('#rno').onclick=()=>{$('#pmsg').textContent=''};$('#ryes').onclick=()=>{try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('cissp:'))ks.push(k)}ks.forEach(k=>localStorage.removeItem(k))}catch(e){}viewProgress()}};
}

function viewAteliers(){
 if(session&&session.kind==='case')return renderQ();

 const tiles=INNOV.filter(x=>x[3].startsWith('ateliers'));

 <div class="igrid" style="margin-top:20px">${tiles.map(([n,t,d,dst])=>`<button class="icard" data-a="${dst.split(':')[1]}"><span class="inum">N°${n}</span><b>${esc(t)}</b><span>${esc(d)}</span></button>`).join('')}</div>`;

/* N°5 */
let myth=null;
function mythSetup(){const best=store.get('cissp:myth:best',null);
 app.innerHTML=`${back()}<div class="eyebrow">N°5 · Vrai ou faux en 8 secondes</div><h1>Mindset ou mythe ?</h1><p class="lede">Une affirmation, 8 secondes pour trancher. Le temps écoulé compte comme une erreur. ${MYTHS.length} affirmations issues des pièges des fiches.</p>
 <div class="panel" style="margin-top:16px"><div class="row"><button class="btn primary" data-n="10">Série de 10</button><button class="btn" data-n="20">Série de 20</button><button class="btn" data-n="${MYTHS.length}">Toutes (${MYTHS.length})</button>${best!=null?`<span class="hint">Meilleur : ${best} %</span>`:''}</div>
 <p class="hint" style="margin-top:10px">Clavier : V = Vrai · F = Faux · Entrée = suivante.</p></div>`;
 bindBack();app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{myth={items:pick(MYTHS,+b.dataset.n),i:0,res:[]};mythQ()});
}
function mythQ(){const m=myth,it=m.items[m.i],dur=8000;let t0=Date.now(),answered=false;
 app.innerHTML=`${back()}<div class="qhead"><span>D${it[3]} · Mindset ou mythe ?</span><span>${m.i+1} / ${m.items.length}</span></div>
 <div class="tbar"><i id="tb"></i></div>
 <div class="panel myth"><p class="qtext" style="text-align:center">${kw(it[0])}</p>
 <div class="row" style="justify-content:center"><button class="btn big tf" data-v="1">Vrai</button><button class="btn big tf" data-v="0">Faux</button></div><div id="mf"></div></div>`;
 bindBack();
 const answer=v=>{if(answered)return;answered=true;stopTimer();const ok=v===null?false:(v===it[1]);m.res.push({it,ok,v});
  app.querySelectorAll('.tf').forEach(b=>{b.disabled=true;if((b.dataset.v==='1')===it[1])b.classList.add('right');else if(v!==null&&(b.dataset.v==='1')===v)b.classList.add('wrong')});
  $('#mf').innerHTML=`<div class="feedback" style="margin-top:16px"><div class="verdict ${ok?'ok':'ko'}">${v===null?'Temps écoulé. ':''}${ok?'Exact.':'Raté.'} C'est ${it[1]?'VRAI':'FAUX'}.</div><div>${kw(it[2])}</div></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" id="mn">${m.i<m.items.length-1?'Suivante':'Résultat'}</button></div>`;
  $('#mn').onclick=()=>{m.i++;m.i<m.items.length?mythQ():mythEnd()};$('#mn').focus()};
 app.querySelectorAll('.tf').forEach(b=>b.onclick=()=>answer(b.dataset.v==='1'));
 keyH=e=>{const k=e.key.toUpperCase();if(k==='V')answer(true);else if(k==='F')answer(false);else if(e.key==='Enter'){const n=$('#mn');if(n){e.preventDefault();n.click()}}};
 stopTimer();timer=setInterval(()=>{const p=Math.min(1,(Date.now()-t0)/dur);const b=$('#tb');if(b){b.style.width=(100-p*100)+'%';b.classList.toggle('late',p>.7)}if(p>=1)answer(null)},100);
}
function mythEnd(){keyH=null;const m=myth,g=m.res.filter(r=>r.ok).length,p=Math.round(g/m.res.length*100);const b=store.get('cissp:myth:best',null);if(b==null||p>b)store.set('cissp:myth:best',p);
 const act=store.get('cissp:act',{});act[today()]=(act[today()]||0)+m.res.length;store.set('cissp:act',act);logSession('Mindset ou mythe',m.res.length,g);
 app.innerHTML=`${back()}<div class="panel"><div class="result-hero"><div class="ring" style="--p:${p}"><b>${p}%</b></div><div class="stack" style="gap:8px"><div class="eyebrow">Mindset ou mythe ?</div><h2>${g} / ${m.res.length}</h2><div class="row"><button class="btn primary" id="ma">Nouvelle série</button></div></div></div></div>
 <div class="stack" style="gap:8px;margin-top:16px">${m.res.map(r=>`<details class="rev" ${r.ok?'':'open'}><summary><span class="mark ${r.ok?'ok':'ko'}">${r.ok?'✓':'✗'}</span><span>${kw(r.it[0])} <b>${r.it[1]?'VRAI':'FAUX'}</b></span></summary><div class="body">${kw(r.it[2])}</div></details>`).join('')}</div>`;
 bindBack();$('#ma').onclick=mythSetup}

/* N°6 */
let ord=null;
function orderGame(idx){if(idx==null)idx=ord&&ord.done?(ord.idx+1)%SEQS.length:ord?ord.idx:Math.floor(Math.random()*SEQS.length);
 if(!ord||ord.idx!==idx)ord={idx,pool:shuffle(SEQS[idx][2].map((s,i)=>i)),pick:[],done:false};
 const S=SEQS[idx],o=ord;
 app.innerHTML=`${back()}<div class="eyebrow">N°6 · Le bon ordre · D${S[1]}</div><h1>${esc(S[0])}</h1><p class="lede">Touchez les étapes dans l'ordre chronologique. Touchez une étape placée pour la retirer.</p>
 <div class="row" style="margin:14px 0"><label class="hint" for="seqsel">Processus</label><select id="seqsel">${SEQS.map((x,i)=>`<option value="${i}" ${i===idx?'selected':''}>${esc(x[0])}</option>`).join('')}</select></div>
 <div class="fgrid">
  <section class="panel"><h3>Étapes disponibles</h3><div class="stepool">${o.pool.filter(i=>!o.pick.includes(i)).map(i=>`<button class="step" data-p="${i}" ${o.done?'disabled':''}>${esc(S[2][i])}</button>`).join('')||'<span class="hint">Toutes les étapes sont placées.</span>'}</div></section>
  <section class="panel"><h3>Votre ordre</h3><ol class="stepol">${o.pick.map((i,pos)=>`<li><button class="step placed ${o.done?(i===pos?'right':'wrong'):''}" data-r="${pos}" ${o.done?'disabled':''}>${esc(S[2][i])}</button></li>`).join('')}</ol></section>
 </div>
 ${o.done?`<div class="feedback" style="margin-top:16px"><div class="verdict ${o.pick.every((i,p)=>i===p)?'ok':'ko'}">${o.pick.filter((i,p)=>i===p).length} / ${S[2].length} étapes bien placées.</div><div><b>Ordre correct :</b><ol style="margin:6px 0 0;padding-left:20px">${S[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div class="rex"><b>À retenir</b>${esc(S[3])}</div></div>`:''}
 <div class="row" style="margin-top:16px;justify-content:flex-end">${o.done?`<button class="btn" id="oretry">Recommencer</button><button class="btn primary" id="onext">Processus suivant</button>`:`<button class="btn" id="oreset" ${o.pick.length?'':'disabled'}>Effacer</button><button class="btn primary" id="ocheck" ${o.pick.length===S[2].length?'':'disabled'}>Vérifier</button>`}</div>`;
 bindBack();
 $('#seqsel').onchange=e=>{ord=null;orderGame(+e.target.value)};
 app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{o.pick.push(+b.dataset.p);orderGame(idx)});
 app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{o.pick.splice(+b.dataset.r,1);orderGame(idx)});
 const c=$('#ocheck');if(c)c.onclick=()=>{o.done=true;const g=o.pick.filter((i,p)=>i===p).length;const act=store.get('cissp:act',{});act[today()]=(act[today()]||0)+1;store.set('cissp:act',act);logSession('Le bon ordre',S[2].length,g);orderGame(idx)};
 const r=$('#oreset');if(r)r.onclick=()=>{o.pick=[];orderGame(idx)};
 const rt=$('#oretry');if(rt)rt.onclick=()=>{ord=null;orderGame(idx)};

}

/* N°7 */
const R=(a,b,s=1)=>a+s*Math.floor(Math.random()*((b-a)/s+1));
const $$=n=>fmtN(n)+' $';
const GEN=[
 ()=>{const av=R(50,900,10)*1000,ef=R(10,80,5);return{t:'SLE',q:`Un serveur vaut ${$$(av)}. Un incendie détruirait ${ef} % de sa valeur. Quelle est la SLE ?`,a:av*ef/100,u:'$',s:`SLE = AV × EF = ${$$(av)} × ${ef} % = ${$$(av*ef/100)}`}},
 ()=>{const sle=R(5,200,5)*1000,n=R(2,20);return{t:'ALE',q:`Une perte unitaire (SLE) de ${$$(sle)} survient une fois tous les ${n} ans. Quelle est l'ALE ?`,a:sle/n,u:'$',s:`ARO = 1/${n} = ${fmtN(1/n)} ; ALE = SLE × ARO = ${$$(sle)} / ${n} = ${$$(sle/n)}`}},
 ()=>{const av=R(100,1000,50)*1000,ef=R(10,60,5),aro=[0.5,1,2,3,4][R(0,4)];const a=av*ef/100*aro;return{t:'ALE',q:`Actif : ${$$(av)} · EF : ${ef} % · ARO : ${fmtN(aro)}. Quelle est l'ALE ?`,a,u:'$',s:`SLE = ${$$(av)} × ${ef} % = ${$$(av*ef/100)} ; ALE = SLE × ${fmtN(aro)} = ${$$(a)}`}},
 ()=>{const b=R(20,200,5)*1000,af=R(1,Math.floor(b/1000/2))*1000,c=R(5,120,5)*1000,v=b-af-c;return{t:'CBA',q:`ALE avant contrôle : ${$$(b)} · ALE après : ${$$(af)} · coût annuel du contrôle : ${$$(c)}. Quelle est la valeur du contrôle (négative si non rentable) ?`,a:v,u:'$',s:`Valeur = ${$$(b)} − ${$$(af)} − ${$$(c)} = ${$$(v)} → ${v>0?'achat justifié':'rejeter : accepter le risque ou chercher moins cher'}`}},
 ()=>{const b=R(30,300,10)*1000,af=R(1,Math.floor(b/2000))*1000;return{t:'CBA',q:`Un contrôle ferait passer l'ALE de ${$$(b)} à ${$$(af)}. Quel est le coût annuel maximal justifiable ?`,a:b-af,u:'$',s:`Coût max = ALE avant − ALE après = ${$$(b-af)}`}},
 ()=>{const n=R(10,500);return{t:'Clés',q:`Combien de clés faut-il pour ${n} utilisateurs en chiffrement symétrique (une clé par paire) ?`,a:n*(n-1)/2,u:'clés',s:`N(N−1)/2 = ${n} × ${n-1} / 2 = ${fmtN(n*(n-1)/2)}`}},
 ()=>{const n=R(10,5000);return{t:'Clés',q:`Combien de clés faut-il pour ${n} utilisateurs en chiffrement asymétrique ?`,a:2*n,u:'clés',s:`2N = 2 × ${n} = ${fmtN(2*n)} (une paire par utilisateur)`}},
 ()=>{const mtd=R(8,96,4),rto=R(2,mtd,2),wrt=R(1,24);const v=mtd-rto-wrt;return{t:'BCP',q:`MTD : ${mtd} h · RTO : ${rto} h · WRT : ${wrt} h. Quelle est la marge en heures (négative en cas de dépassement) ?`,a:v,u:'h',s:`Marge = MTD − (RTO + WRT) = ${mtd} − ${rto+wrt} = ${v} h → ${v>=0?'plan conforme':'plan non conforme : réduire RTO ou WRT'}`}}
];
let calc=null;
function calcGame(){if(!calc||calc.i>=calc.items.length&&calc.ended){calc={items:shuffle(GEN).concat(shuffle(GEN)).slice(0,8).map(g=>g()),i:0,res:[],ans:null}}
 const c=calc;if(c.i>=c.items.length)return calcEnd();
 const p=c.items[c.i],shown=c.ans!=null;
 app.innerHTML=`${back()}<div class="eyebrow">N°7 · Atelier formules · données aléatoires</div><h1>Exercice ${c.i+1} / ${c.items.length}</h1>
 <div class="panel" style="margin-top:16px"><span class="pill mid">${p.t}</span><p class="qtext">${esc(p.q)}</p>
 <div class="row"><input id="cin" class="num" inputmode="decimal" autocomplete="off" placeholder="Votre réponse" aria-label="Votre réponse" ${shown?'disabled':''} value="${shown?esc(c.ans):''}"><span class="hint">${p.u}</span><button class="btn primary" id="cgo" ${shown?'hidden':''}>Vérifier</button></div>
 ${shown?`<div class="feedback" style="margin-top:14px"><div class="verdict ${c.res[c.i]?'ok':'ko'}">${c.res[c.i]?'Juste.':'Faux. Réponse attendue : '+fmtN(p.a)+' '+p.u}</div><div class="formula">${esc(p.s)}</div></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" id="cnext">${c.i<c.items.length-1?'Exercice suivant':'Résultat'}</button></div>`:''}
 <p class="hint" style="margin-top:10px">Saisissez un nombre sans unité ; espaces et virgules acceptés. Tolérance de 1 %.</p></div>`;
 bindBack();
 const check=()=>{const raw=$('#cin').value;const v=parseFloat(raw.replace(/\s| |\$/g,'').replace(',','.'));if(isNaN(v))return;const ok=Math.abs(v-p.a)<=Math.max(1,Math.abs(p.a)*.01);c.ans=raw;c.res[c.i]=ok;calcGame()};
 if(!shown){$('#cgo').onclick=check;$('#cin').onkeydown=e=>{if(e.key==='Enter')check()};$('#cin').focus()}
 else{$('#cnext').onclick=()=>{c.i++;c.ans=null;calcGame()};$('#cnext').focus()}
}
function calcEnd(){const c=calc,g=c.res.filter(Boolean).length;c.ended=true;const act=store.get('cissp:act',{});act[today()]=(act[today()]||0)+c.items.length;store.set('cissp:act',act);logSession('Atelier formules',c.items.length,g);
 app.innerHTML=`${back()}<div class="panel"><div class="result-hero"><div class="ring" style="--p:${Math.round(g/c.items.length*100)}"><b>${g}/${c.items.length}</b></div><div class="stack" style="gap:8px"><div class="eyebrow">Atelier formules</div><h2>${g===c.items.length?'Sans faute':'Revoyez les formules ratées'}</h2><div class="formula">SLE = AV × EF · ALE = SLE × ARO · Valeur = ALE avant − ALE après − coût</div><div class="row"><button class="btn primary" id="cagain">Nouvelle série (nouveaux chiffres)</button></div></div></div></div>`;
 bindBack();$('#cagain').onclick=()=>{calc=null;calcGame()}}

/* N°8 */
let mt=null;
function matchGame(){if(!mt){const pool=GLOSS.filter(g=>{const a=g[0].toLowerCase(),b=g[1].toLowerCase();return a!==b&&!a.startsWith(b)&&!b.startsWith(a.split(' ')[0])});const items=pick(pool,6);mt={items,right:shuffle(items.map((x,i)=>i)),sel:null,ok:[],err:0,t0:Date.now(),end:null}}
 const m=mt,best=store.get('cissp:match:best',null);
 app.innerHTML=`${back()}<div class="eyebrow">N°8 · Associations éclair</div><h1>Reliez chaque terme à sa traduction</h1><p class="lede">Touchez un terme anglais puis sa traduction. Chronomètre et erreurs comptent.</p>
 <div class="row" style="margin:12px 0"><span class="pill mid mono" id="mtime">0 s</span><span class="pill ${m.err?'ko':'ok'}">${m.err} erreur${m.err>1?'s':''}</span>${best!=null?`<span class="hint">Record : ${best} s sans erreur</span>`:''}</div>
 <div class="match"><div class="mcol">${m.items.map((g,i)=>`<button class="mitem ${m.ok.includes(i)?'right':''} ${m.sel===i?'sel':''}" data-l="${i}" ${m.ok.includes(i)?'disabled':''}><b>${esc(g[0])}</b></button>`).join('')}</div>
 <div class="mcol">${m.right.map(i=>`<button class="mitem ${m.ok.includes(i)?'right':''}" data-r="${i}" ${m.ok.includes(i)?'disabled':''}>${esc(m.items[i][1])}</button>`).join('')}</div></div>
 ${m.end?`<div class="feedback" style="margin-top:16px"><div class="verdict ok">Terminé en ${m.end} s avec ${m.err} erreur${m.err>1?'s':''}.</div><ul class="clean">${m.items.map(g=>`<li><b>${esc(g[0])}</b> : ${esc(g[2])}</li>`).join('')}</ul></div>`:''}
 <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn primary" id="mnew">${m.end?'Nouvelle grille':'Changer de grille'}</button></div>`;
 bindBack();
 app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{m.sel=+b.dataset.l;matchGame()});
 app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(m.sel==null)return;const r=+b.dataset.r;const hit=r===m.sel;if(hit){m.ok.push(r);m.sel=null;if(m.ok.length===m.items.length){m.end=Math.round((Date.now()-m.t0)/1000);stopTimer();if(!m.err){const bb=store.get('cissp:match:best',null);if(bb==null||m.end<bb)store.set('cissp:match:best',m.end)}const act=store.get('cissp:act',{});act[today()]=(act[today()]||0)+6;store.set('cissp:act',act);logSession('Associations éclair',6,Math.max(0,6-m.err))}}else{m.err++;b.classList.add('wrong')}setTimeout(matchGame,hit?0:250)});
 $('#mnew').onclick=()=>{mt=null;matchGame()};
 stopTimer();if(!m.end)timer=setInterval(()=>{const e=$('#mtime');if(e)e.textContent=Math.round((Date.now()-m.t0)/1000)+' s'},500);else{const e=$('#mtime');if(e)e.textContent=m.end+' s'}
}

/* N°9 */
function startCase(i){const c=CASES[i];session=newSession({kind:'case',ui:'fr',mode:'learn',qs:c[3].map((x,j)=>prep(`cas:${i}:${j}`)),title:c[0],caseIdx:i});go('ateliers')}
function casesList(){const done=store.get('cissp:hist',{});
 app.innerHTML=`${back()}<div class="eyebrow">N°9 · Études de cas en 3 décisions</div><h1>Études de cas</h1><p class="lede">Un scénario par domaine. Chaque décision s'enchaîne sur la précédente, comme dans les questions longues de l'examen.</p>
 <div class="dgrid" style="margin-top:16px">${CASES.map((c,i)=>{const n=c[3].filter((x,j)=>done[`cas:${i}:${j}`]&&done[`cas:${i}:${j}`].ok).length;return `<article class="dcard"><div class="num"><span>DOMAINE ${c[1]}</span><span>${n}/3 réussies</span></div><h3>${esc(c[0])}</h3><p style="font-size:13.5px;color:var(--muted);margin:0">${esc(c[2])}</p><div class="row"><button class="btn primary" data-c="${i}">Commencer</button></div></article>`}).join('')}</div>`;
 bindBack();app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>startCase(+b.dataset.c));
}

 const m=META[ficheDom];store.set('cissp:fiche',ficheDom);

 <h1>Domaine ${ficheDom} · ${esc(m.fr)}</h1>

  <section class="panel"><h3>État de l'art 2026</h3><ul class="clean" style="margin-top:10px">${m.etat.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>
  <section class="panel"><h3>Bonnes pratiques terrain</h3><ul class="clean" style="margin-top:10px">${m.bp.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>
  <section class="panel full" lang="en"><h3>Exam tips (English)</h3><ul class="clean" style="margin-top:10px">${m.tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>
 </div>
 <div class="row" style="margin-top:16px"><button class="btn primary" id="fq">Quiz FR sur ce domaine</button><button class="btn" id="eq">English quiz</button><button class="btn" id="cq">Étude de cas du domaine</button></div>`;
 app.querySelectorAll('.ftabs [data-d]').forEach(b=>b.onclick=()=>{ficheDom=+b.dataset.d;viewFiches()});

/* ---------- glossaire ---------- */
let gq='',gd=0;
function viewGloss(){
 app.innerHTML=`
 <div class="eyebrow">${GLOSS.length} termes · anglais → français</div>
 <h1>Glossaire CISSP</h1>
 <p class="lede">Les termes tels qu'ils apparaissent dans l'examen en anglais, avec leur traduction et une définition courte. Entraînez-vous avec l'atelier N°8 Associations éclair.</p>
 <div class="gtools"><input id="gs" type="search" placeholder="Rechercher un terme, un acronyme, une définition…" value="${esc(gq)}" aria-label="Rechercher">
 <select id="gd" aria-label="Filtrer par domaine"><option value="0">Tous les domaines</option>${DOMS.map(d=>`<option value="${d}" ${gd===d?'selected':''}>D${d} · ${esc(META[d].fr)}</option>`).join('')}</select></div>
 <div class="glist" id="gl"></div>`;
 const draw=()=>{const q=gq.toLowerCase();const items=GLOSS.filter(g=>(!gd||g[3]===gd)&&(!q||g.slice(0,3).join(' ').toLowerCase().includes(q))).sort((a,b)=>a[0].localeCompare(b[0]));
  $('#gl').innerHTML=items.length?items.map(g=>`<div class="gitem"><div class="t"><b>${esc(g[0])}</b><span>D${g[3]}</span></div><div class="fr">${esc(g[1])}</div><p>${esc(g[2])}</p></div>`).join(''):'<div class="empty">Aucun terme ne correspond.</div>'};
 $('#gs').oninput=e=>{gq=e.target.value;draw()};
 $('#gd').onchange=e=>{gd=+e.target.value;draw()};
 draw();
}

const start=(location.hash||'').replace('#','');
go(views[start]?start:'accueil',false);
})();

"This is privilege creep. Transfers must trigger removal of old access, and periodic access recertifications detect remaining excess permissions.",
"Exam tip: onboarding, transfers and offboarding are all part of identity lifecycle management."],
["What is the BEST practice for managing domain administrator access?",
["Use privileged access management with just-in-time elevation and session recording","Give each admin a permanent domain admin account","Share one admin account among the team","Disable logging for admin accounts to improve performance"],
"PAM vaults credentials, rotates them, grants time-bound elevation after approval, and records sessions for accountability. Standing privileges increase risk.",
"Exam tip: zero standing privileges is the modern target."],
["According to NIST SP 800-63B, which password policy is recommended?",
["Allow long passphrases, screen against breached passwords, and avoid arbitrary periodic rotation","Force rotation every 30 days","Require exactly 8 characters with all character types","Use security questions as a second factor"],
"Forced rotation encourages predictable patterns. Passwords should be changed upon evidence of compromise. MFA and password managers are encouraged.",
"Exam tip: modern answers favor passwordless and phishing-resistant MFA."],
["Which authentication method is MOST resistant to phishing?",
["FIDO2/WebAuthn security keys or passkeys","SMS one-time passcodes","Email magic links","Push notifications without number matching"],
"FIDO2 binds the cryptographic challenge to the legitimate origin, so credentials cannot be replayed on a fake site. SMS is vulnerable to SIM swapping and real-time phishing proxies.",
"Exam tip: 'phishing-resistant MFA' = FIDO2 or PKI-based smart cards."],
["What is the PRIMARY risk introduced by single sign-on?",
["Compromise of one credential grants access to all connected applications","Users must remember more passwords","Logging becomes impossible","Applications can no longer be federated"],
"SSO concentrates risk. Mitigate it with MFA, conditional access, and session monitoring.",
"Exam tip: SSO + MFA is the expected managerial answer."],
["A login system requires additional verification when a user signs in from a new country at an unusual hour. What is this?",
["Risk-based (adaptive) authentication","Mandatory access control","Discretionary access control","Static rule-based access"],
"Adaptive access evaluates context (location, device, behavior) and adjusts requirements dynamically, a key element of Zero Trust.",
"Exam tip: context-aware decisions = risk-based access control."],
["Which protocol standardizes automated account provisioning between an identity provider and SaaS applications?",
["SCIM","SAML","OIDC","TACACS+"],
"SCIM defines a REST API and schema for creating, updating and deleting user accounts, enabling fast and consistent deprovisioning across SaaS.",
"Exam tip: SSO without automated deprovisioning leaves orphan accounts."],
["Which attack uses a few common passwords against many accounts to avoid lockouts?",
["Password spraying","Credential stuffing","Brute force against a single account","Rainbow table attack"],
"Spraying spreads attempts across accounts. Credential stuffing replays breached username/password pairs. Both are mitigated by MFA, breached-password screening and anomaly detection.",
"Exam tip: lockout policies alone do not stop spraying."],
["What must occur BEFORE an organization issues credentials to a new employee?",
["Identity proofing","Authorization","Accountability review","Federation"],
"Identity proofing verifies that the person is who they claim to be (e.g., government ID checks). NIST SP 800-63 defines identity (IAL), authenticator (AAL) and federation (FAL) assurance levels.",
"Exam tip: identification is the claim; authentication is the proof."],
["Which access control model makes decisions using attributes such as department, time of day and data sensitivity?",
["Attribute-based access control","Role-based access control","Discretionary access control","Mandatory access control"],
"ABAC evaluates policies combining subject, object, action and environment attributes, enabling fine-grained, contextual decisions often expressed in XACML.",
"Exam tip: 'dynamic, fine-grained, contextual' → ABAC."],
["Which control BEST ensures accountability for actions on a shared server?",
["Unique user IDs with individual authentication and protected audit logs","A single shared administrator account","Disabling logging to protect privacy","Changing the shared password weekly"],
"Accountability requires that actions be traceable to individuals. Shared accounts make it impossible to determine who did what.",
"Exam tip: shared accounts break non-repudiation."],
["What is the main security weakness of PAP compared with CHAP?",
["PAP sends credentials in cleartext","PAP uses stronger hashing","PAP requires certificates","PAP cannot be used over PPP"],
"CHAP uses a challenge-response mechanism with a hash and can periodically re-authenticate. PAP transmits the password in cleartext.",
"Exam tip: never choose PAP as a secure option."],
["How should secrets used by applications and automation (service accounts, API keys) be managed?",
["Store them in a secrets vault with rotation, least privilege and no interactive logon","Hard-code them in source code","Share them by email with developers","Store them in a spreadsheet on a file share"],
"Non-human identities often outnumber users. Vaulting, short-lived credentials, managed identities and secret scanning in CI/CD reduce exposure.",
"Exam tip: secrets in Git repositories are a classic exam scenario."]
]};

DATA[6]={fr:[
["Qu'est-ce qu'un pentesteur doit obtenir AVANT tout scan ?",
["Une autorisation écrite et signée de la direction ([[Rules of Engagement]] / lettre d'autorisation)","L'accord oral de l'administrateur réseau","Un compte administrateur","Une copie des mots de passe"],
"Sans accord formel, le test devient un délit. Les règles d'engagement fixent périmètre, horaires, techniques autorisées, contacts d'urgence.",
"REX fiches : « Permission écrite obligatoire »."],
["Quel document fixe le périmètre, les horaires et les techniques autorisées d'un test d'intrusion ?",
["Les règles d'engagement ([[Rules of Engagement]] / [[RoE]])","Le BIA","Le SLA","La politique de mots de passe"],
"Les RoE incluent aussi la gestion des données découvertes et la procédure en cas d'incident (arrêt du test).",
"Le client signe l'acceptation des risques (ex. plantage SCADA)."],
["Un test où l'équipe ne dispose d'aucune information préalable sur la cible est un test :",
["En boîte noire ([[Black Box]] / [[Zero knowledge]])","En boîte blanche ([[White Box]])","En boîte grise ([[Gray Box]])","Double aveugle uniquement"],
"Boîte noire = simule un attaquant externe ; blanche = connaissance complète (code, architecture) ; grise = connaissance partielle.",
"Double-blind : ni le testeur ni l'équipe défensive ne sont informés à l'avance."],
["Quelle est la différence entre une évaluation de vulnérabilités et un test d'intrusion ?",
["Le scan identifie des vulnérabilités ; le pentest tente de les exploiter pour prouver l'impact","Ce sont des synonymes","Le scan exploite, le pentest liste","Le pentest est automatisé, le scan manuel"],
"Vulnerability assessment = large, automatisé, régulier. Penetration test = ciblé, manuel, démonstration de l'exploitabilité.",
"Phases pentest : Planification → Découverte → Attaque → Rapport."],
["Quel type de scan de vulnérabilités fournit les résultats les plus précis en se connectant avec des identifiants ?",
["Le scan authentifié ([[Credentialed Scan]])","Le scan non authentifié","Le ping sweep","Le scan de ports SYN"],
"Le scan authentifié voit les versions logicielles et configurations internes, réduisant faux positifs et faux négatifs.",
"Le scan non authentifié montre la vue d'un attaquant externe."],
["Quel standard fournit un score de gravité des vulnérabilités de 0 à 10 ?",
["[[CVSS]]","[[CVE]]","[[CWE]]","[[CPE]]"],
"CVE = identifiant de vulnérabilité ; CWE = catégorie de faiblesse ; CVSS = score (v4.0 depuis 2023) ; CPE = nommage de plateformes. Le tout est regroupé dans [[SCAP]].",
"État de l'art : prioriser avec [[EPSS]] et le catalogue CISA [[KEV]], pas seulement le CVSS."],
["Qu'est-ce qu'un faux négatif dans un scan ?",
["Une vulnérabilité réelle non détectée","Une alerte sur une vulnérabilité inexistante","Un scan interrompu","Un correctif mal appliqué"],
"Le faux négatif est le plus dangereux car il crée une fausse impression de sécurité. Le faux positif consomme du temps d'analyse.",
"Le scan authentifié réduit les deux."],
["Quel type de test évalue un code SANS l'exécuter ?",
["L'analyse statique ([[SAST]])","L'analyse dynamique ([[DAST]])","Le [[Fuzzing]]","Le test de charge"],
"SAST (white-box) analyse le code source en phase de développement. DAST teste l'application en exécution (black-box).",
"REX fiches (D8) : SAST = développement ; DAST = test/QA."],
["Quelle technique envoie des entrées aléatoires ou malformées pour faire planter un programme ?",
["Le [[Fuzzing]]","Le [[Regression Testing]]","La revue de code","Le [[Smoke Test]]"],
"Fuzzing par mutation (modifie des entrées valides) ou par génération (crée à partir de modèles). Révèle buffer overflows et erreurs de gestion d'exceptions.",
"Bon complément au SAST/DAST."],
["Après un correctif, quel test vérifie que les fonctionnalités existantes n'ont pas été cassées ?",
["Le test de non-régression ([[Regression Testing]])","Le test d'intrusion","Le test d'acceptation utilisateur uniquement","Le fuzzing"],
"La non-régression est indispensable même pour un patch urgent.",
"REX fiches (D7) : patch critique du vendredi → test minimal d'abord."],
["Quel test vérifie qu'un logiciel répond aux besoins métier avant mise en production ?",
["Le test d'acceptation utilisateur ([[UAT]])","Le test unitaire","Le fuzzing","Le test de pénétration externe"],
"L'UAT valide la conformité aux exigences fonctionnelles par les utilisateurs métier.",
"Ordre : unitaire → intégration → système → acceptation."],
["Quel test évalue le comportement d'une application face à des usages imprévus, comme un champ âge négatif ?",
["Le test de cas d'abus ([[Misuse Case Testing]])","Le test de performance","Le test de charge","Le test de sauvegarde"],
"Les cas d'abus modélisent comment un attaquant pourrait détourner une fonctionnalité.",
"Complément des cas d'utilisation (use cases)."],
["Quelle mesure vérifie le pourcentage de code exécuté par les tests ?",
["La couverture de code ([[Code Coverage]])","Le CVSS","Le MTTR","Le CER"],
"La couverture (lignes, branches, conditions) indique l'exhaustivité des tests, sans garantir leur qualité.",
"Métrique utile en CI/CD."],
["Qu'est-ce que le test synthétique ([[Synthetic Transaction]]) ?",
["Des transactions scriptées simulant un utilisateur pour mesurer disponibilité et performance","L'analyse des vrais utilisateurs ([[RUM]])","Une revue de code","Un audit SOC 2"],
"Synthetic monitoring = proactif et scripté. RUM ([[Real User Monitoring]]) = passif, vrais utilisateurs.",
"Les deux alimentent les SLA."],
["Quel indicateur mesure en priorité l'efficacité d'un programme de gestion des vulnérabilités ?",
["Le temps moyen de remédiation ([[MTTR]]) par niveau de criticité et le respect des SLA de correction","Le nombre de scans lancés","Le nombre d'outils achetés","Le nombre de pages du rapport"],
"Les [[KPI]] mesurent la performance ; les [[KRI]] signalent l'évolution du risque.",
"KPI = rétrospectif/performance ; KRI = prédictif/risque."],
["Quelle est la différence entre un [[KPI]] et un [[KRI]] ?",
["Le KPI mesure la performance d'un processus ; le KRI alerte sur une augmentation de l'exposition au risque","Ce sont des synonymes","Le KRI est financier uniquement","Le KPI est réservé aux auditeurs"],
"Exemple : KPI = % de systèmes patchés sous 30 jours ; KRI = nombre de vulnérabilités critiques exposées sur Internet.",
"Les deux alimentent les tableaux de bord de la direction."],
["Un auditeur interne relève directement du DSI dont il audite les systèmes. Quel problème ?",
["Un manque d'indépendance (conflit d'intérêts)","Aucun problème","Un problème de disponibilité","Un problème de chiffrement"],
"L'audit doit être indépendant ; l'audit interne rapporte idéalement au comité d'audit.",
"REX fiches : « Le principe d'Indépendance »."],
["Comment un RSSI valide-t-il la sécurité d'un futur fournisseur SaaS qu'il ne peut pas auditer ?",
["En exigeant un rapport [[SOC 2 Type II]]","En demandant une attestation sur l'honneur","En lançant un pentest non autorisé","En lisant le site marketing"],
"Le SOC 2 Type II évalue l'efficacité opérationnelle des contrôles sur une période (6–12 mois). Le Type I ne porte que sur la conception à une date donnée.",
"REX fiches : « Évaluation d'un fournisseur Cloud »."],
["Quel rapport SOC est destiné au grand public, sans détails sensibles ?",
["[[SOC 3]]","[[SOC 1]]","[[SOC 2 Type II]]","[[SOC 2 Type I]]"],
"SOC 1 = contrôles financiers (ICFR) ; SOC 2 = critères Trust Services (sécurité, disponibilité, intégrité du traitement, confidentialité, vie privée), à diffusion restreinte ; SOC 3 = version publique résumée.",
"Standards : SSAE 18 (US), ISAE 3402 (international)."],
["Quelle combinaison d'audits apporte la meilleure assurance ?",
["Audits internes fréquents, complétés par des audits externes et tiers ([[Layered Assurance]])","Uniquement un audit externe annuel","Uniquement l'auto-évaluation","Aucun audit si la conformité est atteinte"],
"Interne (1re/2e partie), externe (client), tiers indépendant (certification) se complètent.",
"REX fiches : « L'approche en couches »."],
["Une exception de sécurité est accordée sans date de fin. Quel est le risque ?",
["Elle devient un risque caché ([[Hidden Risk]]) oublié","Aucun risque","Elle améliore la disponibilité","Elle supprime le risque"],
"Toute exception doit avoir un propriétaire, une justification, des contrôles compensatoires et une date d'expiration.",
"REX fiches : « Les exceptions permanentes »."],
["Quelles caractéristiques doit avoir un bon rapport de test de sécurité ?",
["Clair, actionnable (priorités, responsables) et auditable","Long et très technique uniquement","Confidentiel au point de ne pas être partagé","Sans recommandations"],
"Il s'adresse aux publics techniques et non techniques (synthèse exécutive) et sert de preuve de diligence.",
"REX fiches : « Caractéristiques d'un bon rapport »."],
["Les auditeurs refusent les assurances orales. Qu'exigent-ils ?",
["Une assurance fondée sur des preuves ([[Evidence-based Assurance]])","Une promesse du RSSI","Un email du fournisseur","Un engagement verbal de la direction"],
"Preuves techniques (logs, configurations) et administratives (approbations, registres de formation) se complètent.",
"REX fiches : « L'exigence des auditeurs »."],
["Quelle technique d'échantillonnage permet de tirer des conclusions statistiquement valides sur une population de contrôles ?",
["L'échantillonnage statistique ([[Statistical Sampling]])","Le choix des dossiers préférés de l'auditeur","L'analyse de l'échantillon le plus récent seulement","Aucun échantillonnage"],
"L'échantillonnage statistique (aléatoire) permet d'extrapoler ; l'échantillonnage par jugement repose sur l'expertise.",
"Les journaux massifs exigent du [[Clipping Level]] ou du filtrage."],
["Qu'est-ce qu'un exercice [[Purple Team]] ?",
["Une collaboration entre attaquants (Red) et défenseurs (Blue) pour améliorer la détection","Une équipe de développeurs","Un audit financier","Un test de restauration"],
"Le Red Team émule un adversaire réel ; le Blue Team défend ; le Purple Team partage en continu pour améliorer les règles de détection (souvent via MITRE ATT&CK).",
"White Team = arbitres et organisateurs."],
["Quelle approche de test simule de façon continue les techniques adverses pour valider les contrôles ?",
["La simulation d'attaques et de brèches ([[BAS]] / [[Breach and Attack Simulation]])","Le scan annuel","La revue documentaire","Le fuzzing ponctuel"],
"Les outils BAS automatisent des scénarios MITRE ATT&CK pour mesurer en continu l'efficacité des défenses.",
"État de l'art : validation continue des contrôles ([[CTEM]])."],
["Quelle norme décrit l'audit des systèmes de management (ISO 27001 compris) ?",
["[[ISO 19011]]","ISO 9000","ISO 31000","ISO 22301"],
"ISO 19011 donne les lignes directrices d'audit. ISO 27007 la complète pour les SMSI ; ISO 31000 = management du risque ; ISO 22301 = continuité.",
"Audit de certification = tiers accrédité."],
["Qu'est-ce qu'une revue de compte ([[Account Review]]) sert à démontrer lors d'un audit ?",
["Que les droits sont régulièrement vérifiés et les comptes inactifs supprimés","Que les mots de passe sont forts","Que les sauvegardes sont chiffrées","Que le réseau est segmenté"],
"Les auditeurs testent souvent l'échantillon de départs pour vérifier la révocation effective.",
"Preuve = export horodaté + validation du manager."],
["Quel type de test DRP vérifie la reprise en activant le site secondaire SANS interrompre la production ?",
["Le test parallèle ([[Parallel Test]])","Le test d'interruption complète ([[Full Interruption]])","Le walkthrough","La revue documentaire"],
"Ordre de risque croissant : Checklist → Walkthrough/Tabletop → Simulation → Parallèle → Interruption complète.",
"REX fiches (D7) : le Full Interruption n'est réalisé qu'après réussite des autres."],
["Quel est l'objectif principal de la journalisation pour l'évaluation de la sécurité ?",
["Fournir des preuves pour la détection, l'investigation et l'audit","Remplir les disques","Remplacer les sauvegardes","Accélérer le réseau"],
"Logs centralisés, horodatés (NTP) et protégés (WORM, intégrité) constituent des preuves fiables.",
"Collecte de données = soutien à la surveillance continue ([[ISCM]])."],
["Que permet la surveillance continue de la sécurité (NIST SP 800-137, [[ISCM]]) ?",
["Maintenir une connaissance permanente des vulnérabilités, menaces et de l'efficacité des contrôles","Remplacer les audits","Supprimer les tests d'intrusion","Éviter toute journalisation"],
"L'ISCM nourrit les décisions de risque en quasi temps réel au lieu d'évaluations ponctuelles.",
"Étape « Monitor » du NIST RMF."],
["Quel test évalue la résistance du personnel à l'ingénierie sociale ?",
["Une campagne de phishing simulé encadrée par la direction","Un scan de ports","Un test de charge","Une revue de code"],
"Les campagnes doivent être autorisées, mesurées et suivies de formation, sans humiliation des employés.",
"Métrique : taux de clic et taux de signalement."],
["Qu'est-ce que le [[Interface Testing]] ?",
["La vérification des échanges entre composants (API, interfaces utilisateur, interfaces physiques)","Le test de l'écran d'accueil","Le test de bande passante","La revue des contrats"],
"Il teste les API, les UI et les interfaces physiques, incluant la gestion des erreurs et la validation des entrées.",
"Les API sont la surface d'attaque n°1 des applications modernes (OWASP API Top 10)."],
["Quel scan vérifie la configuration de systèmes contre une baseline comme les CIS Benchmarks ?",
["Un scan de conformité de configuration (via [[SCAP]] / [[XCCDF]])","Un scan de ports","Un fuzzing","Un test de charge"],
"SCAP automatise la vérification de conformité (XCCDF, OVAL) et la mesure de la dérive.",
"Lien avec la gestion des configurations (D7)."],
["Quelle est la première étape de la conception d'une stratégie d'évaluation ?",
["Définir les objectifs et le périmètre en fonction des risques et des exigences","Acheter un scanner","Lancer un pentest","Rédiger le rapport final"],
"Une stratégie d'évaluation est pilotée par les objectifs métier, les obligations réglementaires et le profil de risque.",
"Analyse avant action."],
["Qu'est-ce qu'un programme de [[Bug Bounty]] ?",
["Une récompense offerte à des chercheurs externes pour la divulgation responsable de vulnérabilités","Une amende pour les développeurs","Un pentest interne obligatoire","Un audit SOC"],
"Il complète les tests internes et s'appuie sur une politique de divulgation ([[Vulnerability Disclosure Policy]]) avec un périmètre clair.",
"Encadré juridiquement (safe harbor)."],
["Quand faut-il effectuer un test de sécurité sur une application critique ?",
["Tout au long du cycle de vie : conception, développement, avant production et périodiquement","Une seule fois après la mise en production","Uniquement après un incident","Jamais si l'éditeur est certifié"],
"Les tests continus (CI/CD) et périodiques détectent les vulnérabilités tôt et suivent l'évolution des menaces.",
"Shift left + tests en production (monitoring)."],
["Qui est le destinataire principal de la synthèse exécutive d'un rapport d'audit ?",
["La direction / le comité d'audit","Les développeurs","Les utilisateurs finaux","Les fournisseurs"],
"La synthèse exécutive présente les risques métier, la priorisation et les décisions attendues, sans jargon.",
"Communiquer le risque en termes métier."],
["Quel test vérifie qu'une application résiste à un volume de transactions élevé ?",
["Le test de charge / stress ([[Load Testing]] / [[Stress Testing]])","Le test unitaire","La revue de code","Le scan de vulnérabilités"],
"Il évalue la disponibilité et identifie les seuils de défaillance (lien avec DoS et planification de capacité).",
"La disponibilité est un pilier de la triade."],
["Quel type de test simule une attaque réelle et prolongée, sans prévenir les défenseurs, pour mesurer la capacité de détection ?",
["Un exercice [[Red Team]] (émulation d'adversaire)","Un scan de vulnérabilités authentifié","Une revue de code","Un test unitaire"],
"Le Red Team poursuit des objectifs (exfiltrer une donnée cible) avec les TTP d'un adversaire réel. Il mesure détection et réponse, pas seulement les vulnérabilités. Cadres : TIBER-EU, DORA TLPT pour le secteur financier.",
"État de l'art : DORA (applicable depuis janvier 2025) impose des tests TLPT aux entités financières critiques de l'UE."]
],
en:[
["What MUST a penetration tester obtain before starting any testing activity?",
["Written authorization from senior management defining scope and rules of engagement","Verbal approval from the network administrator","Administrator credentials","A list of all employee passwords"],
"Without written authorization, testing is legally indistinguishable from an attack. The rules of engagement define targets, timing, allowed techniques, data handling and emergency contacts.",
"Exam tip: 'get permission in writing' is always the first step."],
["Which statement BEST differentiates a vulnerability assessment from a penetration test?",
["A vulnerability assessment identifies weaknesses; a penetration test attempts to exploit them to demonstrate impact","A vulnerability assessment is always manual","A penetration test never produces a report","They are identical"],
"Vulnerability assessments are broad and often automated. Penetration tests are goal-oriented, use manual techniques and prove real-world exploitability.",
"Exam tip: penetration test phases are planning, discovery, attack and reporting."],
["A vulnerability scanner reports a critical flaw that the system does not actually have. What is this called?",
["False positive","False negative","True positive","True negative"],
"False positives waste analyst time; false negatives are more dangerous because real vulnerabilities go unnoticed. Credentialed scans reduce both.",
"Exam tip: a false negative creates a false sense of security."],
["Which scan type provides the MOST accurate view of missing patches on a server?",
["Authenticated (credentialed) scan","Unauthenticated external scan","Ping sweep","Banner grabbing"],
"With credentials, the scanner can inspect installed software, registry settings and configurations directly.",
"Exam tip: unauthenticated scans show the attacker's external view."],
["A CISO wants assurance about a SaaS provider's operating effectiveness of controls over the past year. Which report should be requested?",
["SOC 2 Type II","SOC 1 Type I","SOC 3","SOC 2 Type I"],
"SOC 2 Type II tests the operating effectiveness of controls over a period of time against the Trust Services Criteria. Type I only assesses design at a point in time; SOC 3 is a public summary.",
"Exam tip: 'over a period' → Type II."],
["Why must an internal audit function be independent of the IT department?",
["To avoid conflicts of interest and ensure objective findings","To reduce audit costs","To speed up remediation","To avoid documentation"],
"Auditors cannot objectively evaluate their own work or that of their direct managers. Internal audit typically reports to the audit committee of the board.",
"Exam tip: segregation between doers and checkers."],
["Which testing technique analyzes source code without executing it?",
["Static application security testing (SAST)","Dynamic application security testing (DAST)","Fuzzing","Penetration testing"],
"SAST finds issues such as injection flaws and hard-coded secrets early, in the IDE or CI pipeline. DAST tests the running application from the outside.",
"Exam tip: SAST = white-box, early; DAST = black-box, running app."],
["Which technique feeds malformed or random input into an application to find crashes?",
["Fuzzing","Regression testing","Code review","Synthetic monitoring"],
"Mutation fuzzing alters valid inputs; generation fuzzing builds inputs from models of the protocol. Fuzzing is effective at finding memory corruption and input-handling bugs.",
"Exam tip: fuzzing complements SAST and DAST."],
["Which metric BEST indicates how quickly an organization addresses discovered vulnerabilities?",
["Mean time to remediate (MTTR) by severity","Number of scans performed","Number of security tools deployed","Total vulnerabilities found"],
"MTTR compared with remediation SLAs shows process effectiveness. Raw counts can mislead because more scanning finds more issues.",
"Exam tip: KPIs measure performance; KRIs signal rising risk."],
["A security exception was approved two years ago with no expiration date. What is the MAIN concern?",
["The exception has become a hidden, unmanaged risk","The exception improves availability","There is no concern if no incident occurred","Exceptions never need review"],
"Exceptions must have an owner, compensating controls and an expiration date that forces reassessment.",
"Exam tip: permanent exceptions are a classic trap."],
["Which characteristics define an effective security test report?",
["Clear for technical and non-technical readers, actionable with priorities and owners, and auditable","Very long and purely technical","Shared only with the testers","Focused only on what went well"],
"Reports drive decisions. An executive summary, risk-based prioritization and clear remediation ownership make findings actionable and serve as evidence of due diligence.",
"Exam tip: findings without action plans have no value."],
["During which test are recovery systems brought online while primary systems continue normal processing?",
["Parallel test","Full interruption test","Tabletop exercise","Checklist review"],
"A parallel test validates the alternate site's capability without disrupting production. Full interruption actually shuts down primary operations and is the riskiest test.",
"Exam tip: never run full interruption without senior management approval and successful prior tests."],
["What is the PRIMARY purpose of a purple team exercise?",
["To improve detection and response through real-time collaboration between offensive and defensive teams","To audit financial controls","To replace all penetration tests","To test backup tapes"],
"Purple teaming shares attacker techniques with defenders as the exercise unfolds, tuning detections mapped to frameworks such as MITRE ATT&CK.",
"Exam tip: red = attack, blue = defend, white = referee, purple = collaboration."],
["Which framework standardizes vulnerability identifiers, scoring and configuration checks for automation?",
["SCAP","ITIL","COBIT","TOGAF"],
"SCAP bundles CVE, CVSS, CPE, CCE, XCCDF and OVAL to automate vulnerability and compliance assessment.",
"Exam tip: CVE identifies, CVSS scores, CWE categorizes weaknesses."],
["Beyond CVSS scores, which information BEST helps prioritize remediation in 2026 practice?",
["Evidence of active exploitation (e.g., CISA KEV) and exploit probability (EPSS) combined with asset criticality","The alphabetical order of CVE IDs","The vendor's marketing rating","The age of the vulnerability only"],
"CVSS measures severity, not likelihood. Combining exploitation intelligence and business context focuses effort on vulnerabilities that matter most.",
"Exam tip: risk = likelihood × impact; prioritize accordingly."],
["What type of monitoring uses scripted transactions to proactively test application availability?",
["Synthetic monitoring","Real user monitoring","Passive log review","Packet capture"],
"Synthetic transactions run on a schedule from various locations, detecting outages before users report them. RUM measures real user experience passively.",
"Exam tip: synthetic = proactive; RUM = passive."],
["Which audit approach provides the MOST comprehensive assurance?",
["A layered combination of internal, external and third-party audits","A single annual self-assessment","Vendor-provided marketing documents","Verbal confirmation from managers"],
"Internal audits provide frequent coverage, external audits add customer or regulator perspective, and independent third parties provide certification-level assurance.",
"Exam tip: layered assurance mirrors defense in depth."],
["What evidence do auditors prefer when evaluating a security process?",
["Documented, verifiable evidence such as logs, approvals and records","Verbal explanations from staff","Draft policies not yet approved","Vendor promises"],
"Evidence-based assurance requires artifacts that can be independently verified, combining technical and administrative evidence.",
"Exam tip: 'if it isn't documented, it didn't happen'."],
["Which test examines how an application behaves when users intentionally perform unexpected or malicious actions?",
["Misuse case testing","Unit testing","Load testing","Smoke testing"],
"Misuse (abuse) cases describe how an attacker might subvert functionality, such as entering negative quantities or skipping workflow steps.",
"Exam tip: use cases describe intended behavior; misuse cases describe attacker behavior."],
["What is the FIRST step in designing a security assessment strategy?",
["Define objectives and scope based on business risk and compliance requirements","Purchase a vulnerability scanner","Begin exploitation activities","Write the final report"],
"Assessments must be driven by organizational goals and risk. Tool selection and execution come after defining what must be validated and why.",
"Exam tip: analysis before action."]
]};

DATA[7]={fr:[
["Un enquêteur saisit le PC d'un suspect, encore allumé. Que faire en premier selon l'ordre de volatilité ?",
["Capturer la mémoire vive (RAM) puis réaliser une image bit-à-bit avec un bloqueur d'écriture ([[Write Blocker]])","Éteindre brutalement le PC","Ouvrir les dossiers de l'utilisateur pour chercher des preuves","Lancer un antivirus"],
"Ordre de volatilité ([[Order of Volatility]], RFC 3227) : registres/cache → RAM → état réseau/processus → disque → logs distants → archives. On ne travaille jamais sur l'original.",
"REX fiches : « Toucher l'original » est interdit ; on travaille sur une copie vérifiée par hash."],
["Comment prouver qu'une image forensique est identique à l'original ?",
["En comparant leurs empreintes cryptographiques ([[Hash]] SHA-256)","En comparant leur taille","En les ouvrant toutes les deux","Par une attestation de l'enquêteur"],
"Le hash calculé à l'acquisition puis à chaque analyse démontre l'intégrité de la preuve.",
"Documenter dans la chaîne de traçabilité ([[Chain of Custody]])."],
["Quelle information n'appartient PAS à la chaîne de traçabilité ?",
["L'opinion de l'enquêteur sur la culpabilité","Qui a collecté la preuve","Quand et où elle a été collectée","Chaque transfert de garde"],
"La chaîne de traçabilité documente qui, quoi, quand, où, comment, pour chaque manipulation.",
"Une rupture de la chaîne peut rendre la preuve irrecevable."],
["Quelle caractéristique rend une preuve recevable devant un tribunal ?",
["Pertinente, fiable/authentique, complète, obtenue légalement ([[Admissible]])","Volumineuse","Récente uniquement","Fournie par un témoin anonyme"],
"Les 5 règles de la preuve : authentique, exacte, complète, convaincante, recevable. La [[Best Evidence Rule]] privilégie l'original.",
"Hearsay ([[Hearsay]]) = preuve par ouï-dire, généralement irrecevable (exception : logs générés en routine)."],
["Pourquoi les journaux doivent-ils être centralisés et protégés ([[WORM]]) ?",
["Parce qu'un attaquant tente d'effacer ses traces ; cela garantit intégrité et non-répudiation","Pour réduire le coût du stockage","Pour accélérer les serveurs","Pour éviter le chiffrement"],
"Les logs sont la cible n°1 après intrusion. Centralisation, contrôle d'accès strict, intégrité et rétention adaptée.",
"REX fiches : « Protection des journaux »."],
["Quel est le plus grand défi technique de l'agrégation de journaux et comment le résoudre ?",
["L'hétérogénéité des formats, résolue par la normalisation ([[Normalization]]) du [[SIEM]]","Le manque de disques","Le chiffrement des logs","Le nombre d'utilisateurs"],
"Chaque système (Windows, Cisco, Linux) parle un format différent ; le SIEM normalise puis corrèle.",
"REX fiches : « Normalisation »."],
["Quelle technologie automatise la réponse aux alertes via des playbooks ?",
["[[SOAR]]","[[SIEM]] seul","[[NTP]]","[[DLP]]"],
"SOAR orchestre et automatise (enrichissement, isolement d'un poste, ticket). Le SIEM collecte, corrèle et alerte.",
"État de l'art : XDR et SOC assistés par IA."],
["Quelle solution surveille le comportement des postes et permet d'isoler une machine infectée à distance ?",
["[[EDR]] (Endpoint Detection and Response)","Un antivirus à signatures","Un pare-feu réseau","Un IDS"],
"L'EDR enregistre la télémétrie, détecte les comportements suspects et permet la réponse (isolement, kill process). XDR étend aux autres sources.",
"Défense moderne contre ransomware."],
["Quel est le but principal d'un [[Honeypot]] selon le CISSP ?",
["Étudier les tactiques des attaquants pour améliorer les défenses ([[Threat Intelligence]])","Piéger le pirate pour le poursuivre en justice","Remplacer le pare-feu","Stocker les sauvegardes"],
"Le piège juridique est l'[[Entrapment]] (incitation à commettre un délit), illégal. L'[[Enticement]] (laisser une opportunité) est acceptable.",
"REX fiches : « La finalité du Honeypot »."],
["Quelle est la première étape du cycle de réponse aux incidents NIST SP 800-61 ?",
["La préparation ([[Preparation]])","La détection et l'analyse","Le confinement","Les leçons apprises"],
"NIST : Préparation → Détection & Analyse → Confinement, Éradication & Récupération → Activités post-incident.",
"Mnémo fiches : Pirate Détecté, Confinement Exigé, Réseau Lavé."],
["Quel est l'objectif PRIORITAIRE de la réponse à incident ?",
["Contenir les dégâts et restaurer les opérations métier","Identifier l'IP de l'attaquant pour contre-attaquer","Publier un communiqué de presse","Réinstaller tous les serveurs"],
"La contre-attaque ([[Hack back]]) est illégale. L'objectif est de limiter l'impact et de revenir à la normale.",
"REX fiches : « L'objectif prioritaire de l'Incident Response »."],
["Un technicien éteint brutalement un poste infecté. Quelle erreur a-t-il commise ?",
["Il a détruit les preuves volatiles en RAM ; il fallait isoler le poste du réseau","Aucune erreur","Il aurait dû formater le disque","Il aurait dû redémarrer en mode sans échec"],
"Le confinement doit préserver les preuves : déconnexion réseau / isolement EDR plutôt qu'extinction.",
"REX fiches : « Ne pas détruire les preuves »."],
["Quand un processus de gestion d'incident est-il terminé ?",
["Après la rédaction du rapport post-incident ([[Lessons Learned]]) et l'amélioration des contrôles","Dès que le serveur redémarre","Dès que l'attaquant est identifié","Après le communiqué de presse"],
"Le retour d'expérience ajuste contrôles, procédures et formation.",
"REX fiches : phase très testée."],
["Un administrateur applique une modification non autorisée qui sauve un serveur. Comment juger son action ?",
["Comme une violation de politique ; il aurait dû suivre la procédure de changement d'urgence ([[Emergency Change]] / [[ECAB]])","Comme un acte héroïque à récompenser","Comme une bonne pratique","Comme une action neutre"],
"Le changement non autorisé crée une dérive ([[Configuration Drift]]) et complique les dépannages futurs.",
"REX fiches : « L'héroïsme est un défaut »."],
["Une demande de changement parfaitement planifiée n'a pas de plan de retour arrière. Que fait le [[CAB]] ?",
["Il la rejette","Il l'approuve si le demandeur est expérimenté","Il l'approuve en production uniquement la nuit","Il la transmet au fournisseur"],
"Le plan de repli ([[Rollback]] / [[Backout Plan]]) est obligatoire.",
"REX fiches : « L'absence du plan de repli »."],
["Un patch critique est publié un vendredi après-midi. Quelle est l'approche CISSP ?",
["Le tester d'abord dans un environnement de test, puis déployer selon la gestion des changements","Le déployer immédiatement partout","Attendre six mois","Ne jamais l'appliquer"],
"La précipitation casse les systèmes. Même en urgence, un test minimal de non-régression est exigé ; des mesures d'atténuation temporaires peuvent être appliquées.",
"REX fiches : « L'urgence vs La disponibilité »."],
["Des ports ouverts sur les serveurs de production ne figurent pas dans la baseline. Quelle est l'action managériale ?",
["Identifier pourquoi le processus de gestion des changements n'a pas été respecté et corriger la dérive","Fermer les ports sans enquête","Mettre à jour la baseline pour refléter la réalité","Ignorer l'écart"],
"La dérive révèle un défaut de processus ; on corrige la cause racine, pas uniquement le symptôme.",
"REX fiches : « Le traitement de la dérive »."],
["Pourquoi utiliser une image de référence ([[Golden Image]]) automatisée ?",
["Pour standardiser les déploiements et éliminer l'erreur humaine","Pour réduire la taille des disques","Pour éviter les mises à jour","Pour contourner le CAB"],
"La baseline sécurisée (durcie) est déployée de façon cohérente et vérifiable.",
"REX fiches : « La standardisation avant tout »."],
["Une PME n'a qu'un administrateur. Comment compenser l'absence de séparation des tâches ?",
["Journalisation stricte et revue régulière de ses actions par un tiers","Lui donner plus de droits","Supprimer les logs","Ne rien faire"],
"Contrôles compensatoires détectifs.",
"REX fiches : « Les contrôles compensatoires pour la SoD »."],
["Le RAID 1 est-il une sauvegarde ?",
["Non, c'est de la haute disponibilité : une suppression est répliquée instantanément","Oui, c'est la meilleure sauvegarde","Oui, s'il y a deux disques","Oui, contre les ransomwares"],
"Seule une vraie sauvegarde (idéalement hors ligne/immuable) protège contre l'erreur humaine et les ransomwares.",
"REX fiches : « Sauvegarde vs Haute Disponibilité »."],
["Quel niveau RAID combine répartition et parité distribuée, tolérant la perte d'un disque ?",
["[[RAID 5]]","RAID 0","RAID 1","RAID 10 sans miroir"],
"RAID 0 = striping (aucune tolérance) ; RAID 1 = miroir ; RAID 5 = parité distribuée (1 disque) ; RAID 6 = double parité (2 disques) ; RAID 10 = miroir + striping.",
"RAID = disponibilité, pas sauvegarde."],
["Quelle stratégie de sauvegarde moderne protège contre les ransomwares ?",
["La règle [[3-2-1]] (voire 3-2-1-1-0) avec une copie hors ligne/immuable et des tests de restauration","Une seule copie sur un NAS en ligne","La synchronisation cloud seule","Le RAID 1"],
"3 copies, 2 supports, 1 hors site ; +1 immuable/hors ligne ([[Air-gapped]] / [[Immutable]]) ; 0 erreur aux tests de restauration.",
"Les attaquants ciblent d'abord les sauvegardes."],
["Quel type de sauvegarde copie uniquement les fichiers modifiés depuis la dernière sauvegarde complète, sans réinitialiser le bit d'archive ?",
["La sauvegarde différentielle ([[Differential]])","La sauvegarde incrémentale ([[Incremental]])","La sauvegarde complète","Le snapshot"],
"Restauration différentielle = complète + dernière différentielle. Incrémentale = complète + toutes les incrémentales (sauvegarde rapide, restauration plus longue).",
"Piège fréquent sur le bit d'archive."],
["Quel site de secours est entièrement équipé et opérationnel en quelques heures ?",
["Le [[Hot Site]]","Le [[Cold Site]]","Le [[Warm Site]]","Le [[Mobile Site]] vide"],
"Hot = minutes/heures (cher) ; Warm = jours (équipement partiel) ; Cold = semaines (locaux + énergie). Le choix doit être justifié par le BIA et le RTO.",
"REX fiches : « Choix du site de secours »."],
["Qui peut déclarer formellement un sinistre et déclencher le DRP ?",
["Un cadre supérieur désigné dans le plan","N'importe quel technicien","Le fournisseur cloud","Le premier employé qui constate la panne"],
"Le basculement coûte cher et doit être décidé par une autorité désignée.",
"REX fiches : « La déclaration formelle »."],
["Quel test de DRP est le plus risqué ?",
["L'interruption complète ([[Full Interruption]])","Le test parallèle","La simulation","Le walkthrough"],
"Il arrête la production pour basculer réellement ; il exige l'approbation du Board et la réussite des tests précédents.",
"REX fiches : « La gestion des risques lors des tests »."],
["Quel est l'objectif principal d'un test de DRP ?",
["Identifier les lacunes du plan pour le mettre à jour et former le personnel","Vérifier que les serveurs s'allument","Remplir une obligation administrative","Tester le réseau Wi-Fi"],
"Un test qui révèle des faiblesses est un test réussi.",
"REX fiches : « Pourquoi tester ? »."],
["Pourquoi la plupart des plans de reprise échouent-ils lors d'un vrai sinistre ?",
["Parce qu'ils n'ont pas été maintenus à jour ni testés régulièrement","Parce qu'ils sont trop courts","Parce que le cloud est indisponible","Parce qu'ils sont imprimés"],
"Exemple : liste d'appels contenant des employés partis depuis 2 ans.",
"REX fiches : « La cause n°1 d'échec d'un DRP »."],
["Comment stocker le BCP/DRP ?",
["Avec des copies physiques sécurisées hors site, en plus des versions numériques accessibles","Uniquement sur un serveur chiffré interne","Uniquement dans le cloud","Dans la boîte mail du RSSI"],
"En cas de panne totale, la version numérique peut être inaccessible.",
"REX fiches : « Stockage du plan »."],
["Quel principe consiste à ne donner que le minimum de droits pour réaliser une tâche opérationnelle ?",
["Le moindre privilège ([[Least Privilege]])","La rotation des postes","Le [[Two-person integrity]]","La journalisation"],
"Concept fondamental des opérations de sécurité, avec Need to Know, SoD, rotation et congés obligatoires.",
"Appliquer aussi aux comptes de service."],
["Quel processus gère le cycle de vie des correctifs ?",
["Évaluer → Tester → Approuver ([[CAB]]) → Déployer → Vérifier → Documenter","Déployer → Tester → Évaluer","Approuver → Déployer sans test","Ignorer les correctifs non critiques"],
"Le patch management s'appuie sur l'inventaire, la priorisation par risque et la gestion des changements.",
"Vérifier après déploiement (scan) = boucle fermée."],
["Un cadre revient d'un pays à risque d'espionnage avec son ordinateur de voyage. Que faire ?",
["Lui interdire de le reconnecter, le mettre en quarantaine et l'effacer complètement","Le reconnecter après un scan antivirus","Le laisser télécharger ses emails","Le prêter à un collègue"],
"Les appareils de voyage sont considérés comme compromis (« burner » devices).",
"REX fiches : « Le retour de voyage »."],
["Quelle est la faiblesse la plus exploitée en sécurité physique ?",
["La courtoisie humaine (tenir la porte : [[Tailgating]])","Les serrures biométriques","Les caméras HD","Les badges RFID chiffrés"],
"La solution CISSP est la sensibilisation continue et des sas.",
"REX fiches : « Le maillon faible de la sécurité physique »."],
["Quel contrôle physique est principalement dissuasif et détectif ?",
["La vidéosurveillance ([[CCTV]])","Le sas","La serrure","La clôture de 2,4 m avec barbelés"],
"La caméra dissuade et enregistre mais n'empêche pas physiquement. Clôture : 1 m dissuade, 1,8–2,4 m empêche l'escalade.",
"Types de contrôles : préventif, détectif, correctif, dissuasif, compensatoire, de récupération, directif."],
["Quelle est la priorité absolue en sécurité du personnel lors d'une crise ?",
["La vie et la sécurité des personnes ([[Life Safety]] / [[Duty of Care]])","La protection des serveurs","La réputation","La continuité des ventes"],
"Inclut voyages, travail isolé, menaces, plans d'évacuation et exercices.",
"REX fiches : « La règle absolue »."],
["Quelle est la différence entre un événement et un incident ?",
["Un événement est tout fait observable ; un incident est un événement qui compromet ou menace la sécurité","Ce sont des synonymes","Un incident est toujours une catastrophe naturelle","Un événement nécessite toujours le DRP"],
"Tous les incidents sont des événements, l'inverse est faux. Le triage qualifie les événements.",
"Un sinistre ([[Disaster]]) est un incident majeur nécessitant le DRP."],
["Quel cadre décrit les tactiques et techniques des attaquants observées dans la réalité ?",
["[[MITRE ATT&CK]]","[[ITIL]]","[[COBIT]]","[[TOGAF]]"],
"ATT&CK structure les tactiques (le pourquoi) et techniques (le comment). La [[Cyber Kill Chain]] (Lockheed Martin) décrit 7 phases d'une intrusion.",
"Utilisé pour la détection, la threat intelligence et le purple teaming."],
["Quel est l'ordre du cycle du renseignement sur les menaces ([[Threat Intelligence]]) ?",
["Planification → Collecte → Traitement → Analyse/Production → Diffusion → Feedback","Collecte → Diffusion → Planification","Analyse → Collecte → Planification","Diffusion → Traitement → Collecte"],
"Formats d'échange : [[STIX]] (structure) et [[TAXII]] (transport).",
"REX BONUS 10 : ordre chronologique testé."],
["Qu'est-ce que l'[[UEBA]] apporte à un SOC ?",
["La détection d'anomalies comportementales des utilisateurs et entités (menaces internes, comptes compromis)","Le chiffrement des disques","La gestion des correctifs","Le contrôle d'accès physique"],
"L'UEBA établit des profils de référence et signale les déviations (connexion inhabituelle, volume anormal).",
"Utile contre les menaces internes ([[Insider Threat]])."],
["Quelle notion désigne la gestion des ressources (supports, matériel) tout au long de leur cycle de vie opérationnel ?",
["La protection des ressources / gestion des supports ([[Media Management]])","La gestion des incidents","La gestion des identités","La cryptanalyse"],
"Inclut l'étiquetage, le stockage sécurisé, le transport, la réutilisation et l'assainissement des supports.",
"Lien avec le D2 (assainissement NIST 800-88)."]
],
en:[
["During a fire in a data center, what should be the FIRST priority?",
["Ensure the safety and evacuation of all personnel","Activate the gas suppression system to protect servers","Back up critical databases","Contact the cloud provider"],
"Human life always takes precedence over assets and data. After people are safe, the organization focuses on continuity and asset protection.",
"Exam tip: any option that protects equipment at the expense of people is wrong."],
["An investigator must preserve evidence from a running compromised server. What should be collected FIRST?",
["Memory (RAM) contents","Hard disk image","Archived backups","Printed logs"],
"Following the order of volatility, the most volatile data (CPU cache, RAM, network connections, running processes) is captured first because it disappears when the system is powered down.",
"Exam tip: never work on the original; hash and document everything."],
["What is the PRIMARY purpose of maintaining a chain of custody?",
["To prove evidence integrity and that it was handled only by authorized individuals","To speed up investigations","To encrypt evidence","To identify the attacker"],
"The chain of custody documents who collected, handled, transferred and stored the evidence, when and why. Gaps can make evidence inadmissible.",
"Exam tip: treat every investigation as if it will go to court."],
["An incident responder powers off an infected workstation immediately. What is the MAIN problem with this action?",
["Volatile evidence is destroyed","The malware will spread faster","The disk will be encrypted","There is no problem"],
"Containment should preserve evidence: isolate the system from the network (e.g., via EDR) rather than shutting it down.",
"Exam tip: balance containment with forensics."],
["Which NIST SP 800-61 phase includes eradicating malware and restoring systems?",
["Containment, eradication and recovery","Preparation","Detection and analysis","Post-incident activity"],
"NIST phases: Preparation; Detection & Analysis; Containment, Eradication & Recovery; Post-incident Activity. NIST SP 800-61 Rev. 3 (2025) aligns incident response with CSF 2.0 functions.",
"Exam tip: lessons learned close the loop and update controls."],
["What is the PRIMARY goal of incident response?",
["Limit damage and restore normal business operations","Track and counterattack the attacker","Identify the attacker's nationality","Rebuild all systems from scratch"],
"Hacking back is illegal and risky. The CISSP focus is containment, recovery and continuous improvement.",
"Exam tip: business continuity drives incident priorities."],
["A system administrator makes an unauthorized change that prevents an outage. How should this be viewed?",
["As a policy violation; the emergency change process should have been followed","As exemplary behavior deserving a reward","As acceptable because the outcome was positive","As a minor documentation issue"],
"Unauthorized changes introduce configuration drift and undermine accountability. Emergency change procedures allow fast action with appropriate approval (ECAB) and later documentation.",
"Exam tip: good intentions never justify bypassing change management."],
["A change request lacks a rollback plan. What should the Change Advisory Board do?",
["Reject the request until a backout plan is provided","Approve it if the change is low risk","Approve it for weekend deployment","Escalate directly to production"],
"Every change must be reversible. Without a backout plan, a failed change can cause prolonged outages.",
"Exam tip: no rollback, no approval."],
["A critical patch is released on Friday afternoon. What should the security manager do?",
["Test it in a non-production environment, then deploy through change management with priority","Deploy it to all production servers immediately","Wait for the next quarterly maintenance window regardless of risk","Ignore it unless an exploit is reported"],
"Untested patches can break systems and reduce availability. Emergency processes allow accelerated testing and deployment, possibly with temporary mitigations.",
"Exam tip: speed is good, but not at the cost of untested production changes."],
["Why is RAID not considered a backup?",
["Deletions and corruption are replicated immediately across disks","RAID cannot store data","RAID is always slower","RAID requires tapes"],
"RAID provides availability against disk failure. Backups provide recoverability against deletion, corruption and ransomware.",
"Exam tip: availability ≠ recoverability."],
["Which backup approach BEST protects against ransomware?",
["Immutable or offline backups following the 3-2-1 rule, with regular restore tests","A mirrored RAID array","Real-time cloud sync","A single nightly backup on a network share"],
"Ransomware operators target online backups. Immutable storage and offline copies prevent encryption or deletion; restore tests prove recoverability.",
"Exam tip: an untested backup is not a backup."],
["Which recovery site provides the fastest recovery time?",
["Hot site","Warm site","Cold site","Reciprocal agreement"],
"Hot sites are fully equipped with current data and can operate within hours. The choice must be justified by BIA-defined RTO and cost.",
"Exam tip: reciprocal agreements are cheap but hard to enforce."],
["Who should declare a disaster and activate the DRP?",
["A designated senior manager","Any IT staff member","The help desk","The cloud provider"],
"Declaring a disaster triggers expensive failover and business decisions. Authority must be clearly assigned in the plan.",
"Exam tip: technicians execute; management declares."],
["What is the MOST common reason recovery plans fail during actual disasters?",
["They were not kept current or regularly tested","They are too detailed","They were stored offline","They involved too many people"],
"Organizations change constantly: staff, systems and vendors. Plans must be maintained through change management and exercised regularly.",
"Exam tip: maintain hard copies offsite in addition to digital versions."],
["What is the PRIMARY purpose of a honeypot?",
["To gather intelligence about attacker techniques and improve defenses","To entrap attackers for prosecution","To replace intrusion detection systems","To store sensitive data"],
"Honeypots deceive attackers and reveal tactics. Entrapment (inducing someone to commit a crime) is illegal; enticement (presenting an opportunity) is generally acceptable.",
"Exam tip: research and early detection, not prosecution."],
["Which security operations tool automates incident response through playbooks?",
["SOAR","SIEM","IDS","DLP"],
"SOAR integrates tools and automates repetitive tasks such as enrichment, ticketing and containment. SIEM aggregates, normalizes and correlates logs.",
"Exam tip: SIEM detects; SOAR responds."],
["Production servers show open ports not defined in the baseline. What is the BEST managerial response?",
["Investigate why change management was bypassed and remediate the drift","Update the baseline to match production","Ignore the deviation if services work","Disable all monitoring"],
"Drift indicates a process failure. Fixing only the symptom will allow it to recur.",
"Exam tip: root cause analysis over quick fixes."],
["A small company has only one IT administrator. How should it address the lack of separation of duties?",
["Implement compensating controls such as detailed logging and independent periodic review","Give the administrator unrestricted rights without oversight","Disable logging to protect privacy","Hire a second administrator immediately regardless of budget"],
"When SoD is not feasible, detective controls and independent oversight reduce the risk of fraud or errors.",
"Exam tip: compensating controls are a recurring exam theme."],
["An executive returns from a high-risk country and wants to reconnect a travel laptop to the corporate network. What should be done?",
["Quarantine the device and wipe/reimage it before any reconnection","Allow reconnection after an antivirus scan","Allow email synchronization only","Allow it if the executive approves"],
"Devices taken to high-risk regions should be assumed compromised. Use loaner devices and reimage them on return.",
"Exam tip: executives are high-value targets; policy applies to everyone."],
["An employee reports a lost access badge. What should happen FIRST?",
["Deactivate the lost badge in the access control system","Issue a replacement badge","Search the building for the badge","Review the CCTV footage"],
"Revocation removes the immediate risk. Replacement, investigation and review come after.",
"Exam tip: revoke first, replace later."]
]};

DATA[8]={fr:[
["À quelle phase du [[SDLC]] la sécurité doit-elle être intégrée en premier ?",
["Dès la phase des exigences ([[Requirements]])","Lors du déploiement","Après la mise en production","Lors des tests uniquement"],
"Plus une vulnérabilité est découverte tard, plus elle coûte cher (jusqu'à 100 fois en production).",
"REX fiches : « Le coût d'une faille »."],
["Que signifie « [[Shift Left]] » ?",
["Intégrer les tests et contrôles de sécurité le plus tôt possible dans le cycle de développement","Déplacer les serveurs vers un autre datacenter","Retarder les tests de sécurité","Externaliser le développement"],
"Tests dans l'IDE, revues de code, SAST et SCA dès le commit.",
"REX fiches : « Le concept de Shift Left »."],
["Un attaquant trouve des clés AWS valides dans un dépôt Git public. Quel contrôle aurait dû l'empêcher ?",
["L'analyse des secrets ([[Secret Scanning]]) dans le pipeline CI/CD avec blocage des commits","Un pare-feu applicatif","Un antivirus sur les postes","Un IDS réseau"],
"Les hooks pre-commit et le secret scanning bloquent les identifiants ; les secrets doivent résider dans un coffre ([[Vault]]). Révoquer immédiatement les clés exposées.",
"REX fiches : « Les fuites de code source »."],
["Quel ordre d'environnements le code doit-il suivre ?",
["Développement → Test/QA → Pré-production ([[Staging]]) → Production","Développement → Production","Test → Développement → Production","Production → Test"],
"La séparation des environnements protège la production ; les développeurs ne doivent pas avoir d'accès en écriture en production (SoD).",
"REX fiches : « Séparation des environnements »."],
["Quel outil identifie une bibliothèque open source vulnérable (ex. Log4j) intégrée à une application ?",
["L'analyse de composition logicielle ([[SCA]]) appuyée par un [[SBOM]]","Le SAST seul","Le DAST seul","Le WAF"],
"Le SCA inventorie les dépendances et les compare aux bases de vulnérabilités. Le SBOM (SPDX, CycloneDX) liste les composants.",
"REX fiches : « La vulnérabilité log4j (Supply Chain) »."],
["Quand le SAST et le DAST sont-ils réalisés ?",
["SAST pendant le développement (code source) ; DAST en test/QA sur l'application en exécution","Les deux après la production","DAST avant d'écrire le code","SAST uniquement en production"],
"[[IAST]] combine les deux via une instrumentation à l'exécution ; [[RASP]] protège l'application en production.",
"REX fiches : « Le moment du test »."],
["Où la validation des entrées doit-elle TOUJOURS être effectuée ?",
["Côté serveur ([[Server-side]])","Côté client uniquement (JavaScript)","Dans le navigateur","Dans le pare-feu uniquement"],
"La validation côté client est une commodité contournable via un proxy (Burp Suite).",
"REX fiches : « La règle absolue de la validation »."],
["Quelle est la meilleure défense contre l'injection SQL ?",
["Les requêtes paramétrées ([[Parameterized Queries]] / [[Prepared Statements]])","Le filtrage par liste noire","Le chiffrement de la base","Un mot de passe administrateur fort"],
"Les requêtes paramétrées séparent code et données. Compléments : validation par liste blanche, moindre privilège du compte BD, WAF.",
"OWASP Top 10 (2021) : Injection en A03."],
["Quelle vulnérabilité permet d'injecter un script exécuté dans le navigateur d'autres utilisateurs ?",
["Le [[XSS]] (Cross-Site Scripting)","Le [[CSRF]]","L'injection SQL","Le [[Buffer Overflow]]"],
"XSS stocké, réfléchi ou basé sur le DOM. Contre-mesures : encodage des sorties ([[Output Encoding]]), validation, [[CSP]], cookies HttpOnly.",
"XSS = le navigateur fait confiance au site ; CSRF = le site fait confiance au navigateur."],
["Quelle attaque force le navigateur authentifié d'une victime à exécuter une action non désirée ?",

["Quelle mesure réduit le risque d'utilisation de bibliothèques malveillantes ([[Typosquatting]], [[Dependency Confusion]]) ?",
["Utiliser des dépôts internes approuvés, épingler les versions et vérifier les signatures","Télécharger directement depuis n'importe quel miroir","Désactiver les mises à jour","Supprimer le gestionnaire de paquets"],

en:[
["At which SDLC phase is it MOST cost-effective to address security?",
["Requirements and design","Deployment","Maintenance","Disposal"],
"Fixing a defect discovered in production can cost many times more than addressing it during requirements or design. Threat modeling and security requirements prevent flaws from being built in.",
"Exam tip: security must be built in, not bolted on."],
["A developer committed AWS access keys to a public repository. What is the FIRST action?",
["Revoke and rotate the exposed keys immediately","Delete the commit history","Make the repository private","Notify all customers"],
"Once exposed, secrets must be assumed compromised; automated scanners harvest them within minutes. After revocation, clean history, investigate usage, and implement secret scanning in CI/CD.",
"Exam tip: preventive control = pre-commit secret scanning; secrets belong in a vault."],
["Which tool BEST identifies vulnerable open-source libraries used by an application?",
["Software composition analysis (SCA)","Static application security testing (SAST)","Dynamic application security testing (DAST)","Web application firewall (WAF)"],
"SCA inventories third-party components and matches them against vulnerability databases. A Software Bill of Materials (SBOM) documents these components for customers and incident response.",
"Exam tip: Log4Shell is the classic SCA/SBOM scenario."],
["Where must input validation be enforced to be effective?",
["On the server side","In client-side JavaScript only","In the browser cache","In HTML comments"],
"Client-side validation improves usability but can be bypassed with an intercepting proxy. Server-side validation, preferably allow-list based, is mandatory.",
"Exam tip: never trust the client."],
["What is the MOST effective defense against SQL injection?",
["Parameterized queries (prepared statements)","Blacklist filtering of keywords","Encrypting the database","Hiding error messages only"],
"Parameterized queries ensure user input is treated as data, not executable code. Defense in depth adds allow-list validation, least privilege database accounts and a WAF.",
"Exam tip: escaping and blacklists are weaker than parameterization."],
["Which vulnerability allows an attacker to execute scripts in other users' browsers via a vulnerable web application?",
["Cross-site scripting (XSS)","Cross-site request forgery (CSRF)","Server-side request forgery (SSRF)","SQL injection"],
"XSS exploits the user's trust in a site. Mitigations include context-aware output encoding, input validation, Content Security Policy and HttpOnly cookies.",
"Exam tip: CSRF exploits the site's trust in the user's browser."],
["How should an application behave when a critical component fails?",
["Fail securely by denying access and displaying a generic error","Grant access to avoid business disruption","Display detailed stack traces for debugging","Disable logging"],
"Failing securely protects confidentiality and integrity. Detailed errors leak information useful to attackers.",
"Exam tip: fail secure for systems; fail safe for people."],
["A vendor claims its product is completely secure. What should the security manager require?",
["Independent evidence such as third-party penetration tests, certifications or SOC reports","A signed statement from the vendor's sales team","Nothing, because the vendor is reputable","Access to the vendor's marketing brochure"],
"Assurance must be evidence-based. Contracts should also include security requirements, vulnerability disclosure commitments, patch SLAs and right-to-audit clauses.",
"Exam tip: trust, but verify."],
["Which mechanism protects a customer if a critical software vendor goes out of business?",
["Source code escrow","Non-disclosure agreement","Service level agreement","Open source license"],
"A trusted third party holds the source code and releases it under predefined conditions such as vendor bankruptcy or end of support.",
"Exam tip: escrow addresses continuity of supply."],
["Which development model explicitly incorporates risk analysis in each iteration?",
["Spiral model","Waterfall model","Big Bang model","Code-and-fix"],
"Boehm's spiral model cycles through planning, risk analysis, engineering and evaluation, making it suited to large, high-risk projects.",
"Exam tip: Waterfall is sequential; Agile is iterative and incremental; Spiral is risk-driven."],
["At CMMI level 3 (Defined), which statement is TRUE?",
["Processes are documented and standardized across the organization","Processes are unpredictable and reactive","Processes are only managed at the project level","Processes are continuously optimized using quantitative feedback"],
"CMMI levels: 1 Initial, 2 Managed, 3 Defined, 4 Quantitatively Managed, 5 Optimizing.",
"Exam tip: 'organization-wide standards' = level 3."],
["Which practice BEST describes 'shift left' in DevSecOps?",
["Integrating automated security testing and reviews early in development","Moving security reviews to after deployment","Assigning security only to operations","Running penetration tests annually"],
"Shift left embeds security into the developer workflow: IDE plugins, pre-commit hooks, SAST, SCA and IaC scanning in CI pipelines.",
"Exam tip: early feedback reduces cost and risk."],
["Which item provides a formal inventory of components contained in a software product?",
["Software Bill of Materials (SBOM)","Statement of Work (SOW)","Service Level Agreement (SLA)","Business Impact Analysis (BIA)"],
"SBOMs, in formats such as SPDX or CycloneDX, enable rapid identification of affected products when new component vulnerabilities emerge.",
"Exam tip: SBOMs are increasingly required by regulation and procurement."],
["Which OWASP Top 10 (2021) category ranks first?",
["Broken access control","Injection","Cryptographic failures","Security misconfiguration"],
"Broken access control includes insecure direct object references, privilege escalation and missing function-level checks. Authorization must be enforced server-side on every request.",
"Exam tip: OWASP lists awareness risks; it is not a compliance standard."],
["What is the PRIMARY risk when integrating a large language model into a customer-facing application?",
["Prompt injection leading to data leakage or unauthorized actions","Higher screen resolution requirements","Reduced need for authentication","Automatic elimination of vulnerabilities"],
"Untrusted input can override system instructions or make the model leak data or trigger tools. Mitigations include least-privilege tool access, output handling, input isolation, monitoring and human approval for sensitive actions.",
"Exam tip: AI governance frameworks include NIST AI RMF and ISO/IEC 42001."],
["Which control verifies that software has not been altered after it was published by the vendor?",
["Code signing","Code obfuscation","Compression","Load balancing"],
"A digital signature over the software proves origin and integrity. Signing keys must be protected, ideally in an HSM, because compromising them defeats the control.",
"Exam tip: supply-chain attacks may compromise the build itself, so protect pipelines too."],
["Developers have write access to production databases. Which principle is violated?",
["Separation of duties and environments","Defense in depth","Open design","Economy of mechanism"],
"Code should flow through test and staging via controlled deployment. Developer access to production undermines integrity, change control and accountability.",
"Exam tip: Dev → Test/QA → Staging → Production."],
["Which memory protection technique randomizes process address space to hinder exploitation?",
["Address Space Layout Randomization (ASLR)","Data Execution Prevention only","Garbage collection","Input sanitization"],
"ASLR makes it harder to predict addresses needed for exploits. DEP/NX prevents execution in data regions. Memory-safe languages remove whole classes of bugs.",
"Exam tip: buffer overflows are mitigated by bounds checking and safe languages."],
["Which NIST publication defines the Secure Software Development Framework (SSDF)?",
["NIST SP 800-218","NIST SP 800-53","NIST SP 800-88","NIST SP 800-37"],
"SSDF groups practices into Prepare the Organization, Protect the Software, Produce Well-Secured Software and Respond to Vulnerabilities. It underpins secure software attestation requirements.",
"Exam tip: SP 800-37 = RMF; SP 800-53 = control catalog; SP 800-88 = media sanitization."],
["Which approach BEST ensures security is considered when acquiring commercial software?",
["Include security requirements, vulnerability management obligations and audit rights in the procurement contract","Select the cheapest product and secure it later","Rely solely on online reviews","Let end users choose freely"],
"Procurement is where the buyer has maximum leverage. Contracts should cover patch timelines, SBOM provision, breach notification and independent assurance.",
"Exam tip: you cannot outsource accountability for acquired software."]
]};

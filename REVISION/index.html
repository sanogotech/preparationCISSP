<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portail de révision CISSP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : console de révision — bandeau d'en-tête, onglets, panneau de travail centré à 1100px ; les mots-clés anglais sont « surlignés au marqueur » comme dans un support de cours annoté */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E8ECF2; --ink:#14202E; --muted:#56657A; --line:#D3DAE4;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#E2E9FB;
  --kw:#FFE08A; --kw-ink:#3A2A00;
  --ok:#147A4B; --ok-soft:#DDF2E7; --bad:#B42318; --bad-soft:#FBE3E0; --warn:#9A5B00; --warn-soft:#FDF0D8;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151E29; --sunk:#1C2734; --ink:#E6ECF3; --muted:#9AA9BC; --line:#2A3746;
  --accent:#7EA2FF; --accent-ink:#0B1426; --accent-soft:#1E2B47;
  --kw:#5C4A12; --kw-ink:#FFE7A3;
  --ok:#5BD39A; --ok-soft:#12321F; --bad:#FF8A7E; --bad-soft:#3A1916; --warn:#F5B95A; --warn-soft:#3A2A10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151E29; --sunk:#1C2734; --ink:#E6ECF3; --muted:#9AA9BC; --line:#2A3746;
  --accent:#7EA2FF; --accent-ink:#0B1426; --accent-soft:#1E2B47;
  --kw:#5C4A12; --kw-ink:#FFE7A3;
  --ok:#5BD39A; --ok-soft:#12321F; --bad:#FF8A7E; --bad-soft:#3A1916; --warn:#F5B95A; --warn-soft:#3A2A10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:22px;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{font:500 13.5px var(--f-body);border:1px solid transparent;background:none;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}
nav.tabs button:hover{color:var(--ink);background:var(--sunk)}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible,input:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.4vw,44px);font-weight:800;line-height:1.05;letter-spacing:-.01em}
h2{font-size:24px;font-weight:750}
h3{font-size:17px;font-weight:700;font-stretch:90%}
.lede{color:var(--muted);max-width:68ch;margin:10px 0 0}
.eyebrow{font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kw{background:linear-gradient(transparent 12%,var(--kw) 12%,var(--kw) 88%,transparent 88%);color:var(--kw-ink);padding:0 3px;border-radius:2px;font-weight:500;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.mono{font-family:var(--f-mono)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{font:600 14px var(--f-body);border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{font:500 13px var(--f-body);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.label{font:600 12px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:110px}
/* Hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;margin-bottom:28px}
.hero > *{min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font:800 26px var(--f-display);font-stretch:80%;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
/* Domain grid */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.dcard .num{font:500 12px var(--f-mono);color:var(--muted);display:flex;justify-content:space-between}
.dcard h3{flex:1}
.wbar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--accent)}
.scores{display:flex;gap:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.scores b{color:var(--ink)}
.dcard .row{margin-top:auto}
.dcard .btn{padding:7px 10px;font-size:13px}
/* Quiz */
.setup{display:flex;flex-direction:column;gap:14px}
.setup .row{align-items:flex-start}
.setup .chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.progress{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:500 12.5px var(--f-mono);color:var(--muted)}
.qtext{font-size:18px;font-weight:600;line-height:1.45;margin:8px 0 16px;max-width:75ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:15px/1.45 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font:600 13px var(--f-mono);border:1px solid var(--line);border-radius:5px;min-width:26px;height:26px;display:grid;place-items:center;flex:none;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{margin-top:16px;border-radius:8px;padding:14px 16px;border:1px solid var(--line);background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.feedback .verdict{font-weight:700}
.feedback .verdict.ok{color:var(--ok)} .feedback .verdict.ko{color:var(--bad)}
.rex{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:14px}
.rex b{color:var(--warn);font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.result-hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring b{width:94px;height:94px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:800 28px var(--f-display);font-stretch:80%;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font:600 12px var(--f-body);padding:3px 9px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.ko{background:var(--bad-soft);color:var(--bad)} .pill.mid{background:var(--warn-soft);color:var(--warn)}
details.rev{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.rev summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:baseline;list-style:none}
details.rev summary::-webkit-details-marker{display:none}
details.rev .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.mark{font:700 13px var(--f-mono);flex:none;width:18px}
.mark.ok{color:var(--ok)} .mark.ko{color:var(--bad)}
/* Fiches */
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid > *{min-width:0}
.fgrid .full{grid-column:1/-1}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
ul.clean li::marker{color:var(--accent)}
.sub{columns:2;column-gap:24px;font-size:14px;color:var(--muted);margin:0;padding-left:18px}
/* Cheat sheet */
.cs{columns:3 300px;column-gap:14px}
.cs .panel{break-inside:avoid;margin-bottom:14px;padding:16px}
.cs h3{margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cs h3 small{font:500 11px var(--f-mono);color:var(--muted)}
.cs table{width:100%;border-collapse:collapse;font-size:13.5px}
.cs td,.cs th{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.cs th{font:600 11.5px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cs tr:last-child td{border-bottom:none}
.cs ol,.cs ul{margin:0;padding-left:20px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.formula{font:500 14px var(--f-mono);background:var(--sunk);padding:6px 10px;border-radius:6px;margin:4px 0}
/* Glossary */
.gtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.gtools input{font:15px var(--f-body);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);flex:1;min-width:200px}
.gtools select{font:14px var(--f-body);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gitem{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.gitem .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.gitem .t b{font-weight:600}
.gitem .t span{font:500 11px var(--f-mono);color:var(--muted);flex:none}
.gitem .fr{font-size:13px;color:var(--accent)}
.gitem p{margin:0;font-size:13.5px;color:var(--muted)}
.empty{color:var(--muted);padding:20px;text-align:center}
/* --- Innovations --- */
nav.tabs{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:thin}
nav.tabs button{flex:none}
.top .wrap{flex-wrap:wrap}
.top nav.tabs{margin-left:0;width:100%}
.hint{color:var(--muted);font-size:13px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.icard{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;color:var(--ink);font:inherit}
.icard:hover{border-color:var(--accent)}
.icard b{font-family:var(--f-display);font-stretch:88%;font-size:16.5px}
.icard span:last-child{font-size:13px;color:var(--muted);line-height:1.45}
.inum{font:600 11.5px var(--f-mono);color:var(--accent);letter-spacing:.06em}
.ctx{background:var(--sunk);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:12px;border-left:3px solid var(--accent)}
.cert{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.cchip:disabled[aria-pressed="true"]{opacity:1}
.cchip .mono{font-size:11px;color:var(--muted);margin-right:2px}
.cchip.c-sure[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok)}
.cchip.c-hesit[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn)}
.cchip.c-guess[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad)}
.ctag{font:600 11px var(--f-body);padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.ctag.c-sure{color:var(--ok);border-color:var(--ok)} .ctag.c-guess{color:var(--bad);border-color:var(--bad)} .ctag.c-hesit{color:var(--warn);border-color:var(--warn)}
.simbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;margin-bottom:12px;font-size:13px}
.simbar .mono{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.simbar .late{color:var(--kw)}
.gridwrap{margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.gridwrap summary{cursor:pointer;font-weight:600;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px;margin-top:10px}
.gcell{font:500 12px var(--f-mono);height:32px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;position:relative}
.gcell.done{background:var(--accent-soft);border-color:var(--accent)}
.gcell.flag::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.gcell.cur{outline:2px solid var(--ink);outline-offset:1px}
.gcell:disabled{cursor:default;opacity:.55}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;align-items:center}
.legend span{display:flex;gap:5px;align-items:center}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:var(--surface)}
.lg.done{background:var(--accent-soft);border-color:var(--accent)} .lg.flag{background:var(--warn)} .lg.cur{outline:2px solid var(--ink)}
.btn.flagged{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.big{font-size:17px;padding:14px 34px;min-width:140px}
.btn.back{margin-bottom:14px;padding:6px 12px;font-size:13px}
.confirm{margin-top:14px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ctable{width:100%;border-collapse:collapse;font-size:13.5px}
.ctable th,.ctable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ctable th{font:600 11.5px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ctable .warnrow td{background:var(--bad-soft)}
.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;border-top:4px solid var(--line)}
.box b{display:block;font:800 30px var(--f-display);font-stretch:80%;font-variant-numeric:tabular-nums}
.box span{font-size:12.5px;color:var(--muted)}
.box.b1{border-top-color:var(--bad)} .box.b2{border-top-color:var(--warn)} .box.b3{border-top-color:var(--accent)} .box.bm{border-top-color:var(--ok)}
.predict{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring.big{width:150px;height:150px}
.ring.big b{width:118px;height:118px;font-size:38px;display:flex;align-items:baseline;justify-content:center;padding-top:36px}
.ring.big small{font-size:14px;color:var(--muted);font-weight:500}
.mbar{display:flex;align-items:center;gap:8px;min-width:140px}
.mbar i{display:block;height:8px;border-radius:4px;background:var(--bad)}
.mbar i.m{background:var(--warn)} .mbar i.g{background:var(--ok)}
.mbar span{font-size:12.5px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px;max-width:240px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--sunk);border:1px solid var(--line);max-width:100%}
.heat i.l1,.lg.l1{background:color-mix(in srgb,var(--accent) 25%,var(--surface))}
.heat i.l2,.lg.l2{background:color-mix(in srgb,var(--accent) 55%,var(--surface))}
.heat i.l3,.lg.l3{background:var(--accent)}
.heat i.now{outline:2px solid var(--ink);outline-offset:1px}
.lg.l0{background:var(--sunk)}
textarea{width:100%;margin-top:10px;font:12.5px var(--f-mono);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
select{font:14px var(--f-body);padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.tbar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin:8px 0 16px}
.tbar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .1s linear}
.tbar i.late{background:var(--bad)}
.myth .qtext{font-size:20px;max-width:none;margin:12px auto 22px}
.tf:disabled{opacity:1}
.tf.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tf.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.stepool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.stepol{margin:10px 0 0;padding-left:24px;display:flex;flex-direction:column;gap:6px}
.step{font:14px var(--f-body);text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;width:auto}
.step:hover:not(:disabled){border-color:var(--accent)}
.step.placed{width:100%;background:var(--accent-soft);border-color:var(--accent)}
.step.right{background:var(--ok-soft);border-color:var(--ok)} .step.wrong{background:var(--bad-soft);border-color:var(--bad)}
input.num{font:600 18px var(--f-mono);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:220px;max-width:100%}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mitem{font:14px var(--f-body);text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-height:48px}
.mitem.sel{border-color:var(--accent);background:var(--accent-soft)}
.mitem.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mitem.wrong{background:var(--bad-soft);border-color:var(--bad)}
.simopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.simopts .panel{display:flex;flex-direction:column;gap:8px}
.simopts p{margin:0;color:var(--muted);font-size:14px;flex:1}
.simopts .btn{align-self:flex-start}
.toggle{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;cursor:pointer}
.dist{display:flex;flex-direction:column;gap:6px;margin-top:10px}

const DATA={};
DATA[1]={fr:[
["Un incendie se déclare dans le data center. Un technicien est encore à l'intérieur et des données non sauvegardées sont en jeu. Quelle est la PREMIÈRE action ?",
["Lancer l'évacuation et assurer la sécurité des personnes ([[Life Safety]])","Déclencher l'extinction au gaz pour sauver les serveurs","Lancer une sauvegarde d'urgence vers le cloud","Ouvrir le plan de reprise ([[DRP]]) et appeler le fournisseur"],
"La vie humaine est TOUJOURS la priorité n°1 du CISSP, avant la continuité de la mission et la protection des actifs. Aucune donnée ne vaut une vie.",
"REX fiches : ordre de priorité en cas de sinistre = 1) personnes, 2) continuité de la mission, 3) actifs (serveurs/données)."],
["Selon le code d'éthique de l'[[ISC2]], quel canon arrive en PREMIER ?",
["Protéger la société, le bien commun, la confiance du public et l'infrastructure ([[Protect society]])","Agir honorablement, honnêtement, justement, de façon responsable et légale","Fournir un service diligent et compétent aux mandants ([[Principals]])","Faire progresser et protéger la profession"],
"Les 4 canons sont ordonnés : 1) Société, 2) Honnêteté/légalité, 3) Mandants (employeur/client), 4) Profession. En cas de conflit, le canon supérieur l'emporte.",

["Vous découvrez que votre employeur commet une activité illégale (sans danger de mort immédiat). Que faites-vous en premier ?",
["Alerter le management via les canaux internes prévus ([[Whistleblowing]] procédural)","Contacter immédiatement la presse","Signaler directement aux autorités externes","Supprimer les preuves pour protéger l'entreprise"],
"Le CISSP valorise le respect des procédures : escalade interne d'abord, autorités ensuite si l'interne échoue (sauf danger immédiat pour des vies).",

["Pour un hôpital gérant des dossiers patients en temps réel, quel pilier de la triade est souvent PRIORITAIRE ?",
["L'intégrité et la disponibilité ([[Integrity]], [[Availability]])","La confidentialité uniquement","La non-répudiation","L'anonymat"],
"La confidentialité n'est pas toujours la priorité : une erreur de dosage (intégrité) ou un dossier inaccessible (disponibilité) peut tuer. Le contexte métier fixe la priorité de la triade [[CIA]].",
"Piège n°1 des fiches : « la Confidentialité par défaut ». Banque et hôpital privilégient souvent Intégrité et Disponibilité."],
["Qui porte la responsabilité ULTIME ([[Accountability]]) de la sécurité de l'information dans l'entreprise ?",
["Le conseil d'administration / la haute direction ([[Senior Management]])","Le RSSI ([[CISO]])","L'administrateur système","Le fournisseur cloud"],
"La responsabilité opérationnelle peut être déléguée, l'accountability jamais. Elle reste au Board / à la direction générale.",
"REX fiches : le CISO ou l'équipe technique ne portent jamais la responsabilité ultime."],
["Quelle notion désigne le fait d'ÉTUDIER et comprendre les risques avant d'agir (« savoir ») ?",
["La diligence raisonnable ([[Due Diligence]])","Le soin raisonnable ([[Due Care]])","La conformité ([[Compliance]])","La gouvernance"],
"Due Diligence = rechercher, évaluer, comprendre (penser avant). Due Care = agir de façon prudente et mettre en place les contrôles (faire). Leur absence fonde la négligence.",

["Une entreprise met en place des contrôles raisonnables après avoir identifié un risque. Cela illustre :",

["Une politique interne autorise un transfert de données que la loi locale sur la souveraineté interdit. Que prévaut ?",

["Non, la conformité ([[Compliance]]) est une base minimale ([[Baseline]]), pas une garantie de sécurité","Oui, PCI DSS garantit l'absence de vulnérabilité","Oui, si l'audit date de moins d'un an","Non, car PCI DSS ne concerne que les banques"],
"Compliance ≠ Security. La conformité démontre un niveau minimal à une date donnée ; la sécurité est un processus continu fondé sur le risque.",

["Votre sous-traitant cloud (Processor) perd les données personnelles de vos clients. Qui est responsable devant le régulateur RGPD ?",

["Quel est le délai de notification d'une violation de données à l'autorité de contrôle sous le [[GDPR]] ?",

"Budapest = cybercriminalité (coopération pénale), Wassenaar = export."],

["Lors d'une enquête administrative interne pour fraude d'un employé, comment manipuler les preuves ?",
["Comme si elles allaient finir au tribunal, avec une chaîne de traçabilité ([[Chain of Custody]])","Librement, puisqu'il s'agit d'une affaire interne","Uniquement par l'administrateur IT, sans impliquer les RH","Les effacer après la sanction"],
"Une enquête administrative peut devenir civile (contestation du licenciement) ou criminelle. La chaîne de traçabilité est non négociable.",

["Quel niveau de preuve est exigé dans une affaire PÉNALE ([[Criminal]]) ?",

["Quel document de gouvernance est OBLIGATOIRE, de haut niveau, et approuvé par la direction ?",

"REX fiches : « La Politique est Reine ». Avant tout changement technique, vérifier la politique."],

["La ligne directrice ([[Guideline]])","Le standard","La procédure","La politique"],

["Le contrôle double ([[Dual Control]] / [[Two-person rule]])","La séparation des tâches ([[Separation of Duties]])","La connaissance partagée ([[Split Knowledge]])","Le moindre privilège"],

["Une entreprise souscrit une cyber-assurance. Quelle stratégie de traitement du risque est appliquée ?",

["Une entreprise décide d'arrêter un service en ligne trop risqué. C'est :",

"Supprimer l'activité à l'origine du risque, c'est l'éviter. Coût : on renonce aussi au bénéfice métier.",

["Quelle méthode d'analyse de risque utilise des niveaux (Élevé/Moyen/Faible) et l'avis d'experts plutôt que des montants ?",

"Qualitatif = rapide, subjectif, matrices de couleurs. Quantitatif = valeurs monétaires (SLE, ALE). Delphi = consensus d'experts anonyme.",

"La modélisation des menaces est proactive. Ajouter la sécurité après coup ([[Bolt-on]]) est pénalisé à l'examen.",
"REX fiches : « Proactif vs Réactif »."],
["Dans [[STRIDE]], à quelle propriété de sécurité s'oppose la menace « Repudiation » ?",

"STRIDE : Spoofing↔Authentification, Tampering↔Intégrité, Repudiation↔Non-répudiation, Information disclosure↔Confidentialité, DoS↔Disponibilité, Elevation of privilege↔Autorisation.",
"PASTA = méthode centrée risque en 7 étapes ; DREAD = scoring (largement abandonné)."],
["Quelle méthode de modélisation des menaces est centrée sur le risque métier et comporte 7 étapes ?",
["[[PASTA]]","[[STRIDE]]","[[DREAD]]","[[VAST]]"],

["Votre prestataire de paie subit une compromission qui touche vos salariés. Quel domaine de gestion aurait dû l'anticiper ?",

"Le SCRM évalue fournisseurs et sous-traitants (questionnaires, audits, SOC 2, clauses contractuelles, droit d'audit).",

["Quel indicateur prouve le MIEUX l'efficacité d'un programme de sensibilisation ([[Security Awareness]]) ?",

"Awareness (tous, le quoi), Training (rôle, le comment), Education (experts, le pourquoi, souvent diplômante/certifiante).",

en:[
["Which of the following BEST describes the role of senior management in information security?",
["They hold ultimate accountability and must approve and support the security policy","They configure security controls on critical systems","They perform day-to-day monitoring of security events","They delegate all accountability to the CISO"],
"Senior management (the board and executives) owns risk and holds ultimate accountability. They set the tone at the top, approve policy, allocate budget and accept residual risk. Responsibility for execution can be delegated to the CISO and IT, but accountability cannot.",
"Exam tip: whenever the question asks who is 'ultimately responsible', pick senior management or the board, never the CISO, custodian or vendor."],
["A security manager is asked to justify a $50,000 annual control that reduces ALE from $40,000 to $15,000. What should the manager recommend?",
["Reject the control, because its cost exceeds the risk reduction","Approve the control, because it lowers ALE","Approve the control, because security always outweighs cost","Transfer the risk by buying a second control"],
"Value of the safeguard = ALE before − ALE after − annual cost = 40,000 − 15,000 − 50,000 = −25,000. A negative value means the control costs more than the loss it prevents, so accepting or finding a cheaper control is the rational business decision.",
"Exam tip: the exam often pads questions with irrelevant numbers. Isolate AV, EF, ARO and annual cost, then compute the cost-benefit result."],
["Which ISC2 Code of Ethics canon should take precedence when a conflict arises between an employer's interest and public safety?",
["Protect society, the common good, necessary public trust and confidence, and the infrastructure","Provide diligent and competent service to principals","Advance and protect the profession","Act honorably, honestly, justly, responsibly and legally"],
"The canons are applied in order. The first canon (society) outranks the duty to principals (employers and clients). A professional must not harm the public to satisfy an employer.",
"Exam tip: memorize the order Society → Honesty/Legality → Principals → Profession."],
["What is the primary difference between due diligence and due care?",
["Due diligence is researching and understanding risks; due care is acting on that knowledge by implementing reasonable controls","Due care is performed before due diligence","Due diligence applies only to legal issues; due care only to technology","They are identical and interchangeable"],
"Due diligence is the investigative, 'know' activity (assessments, vendor reviews). Due care is the 'do' activity: implementing what a prudent person would. Failing either can be considered negligence.",
"Exam tip: 'assessing a vendor before signing' = due diligence; 'patching the known vulnerability' = due care."],
["An organization stores EU residents' data with a US cloud provider. Which role does the organization play under GDPR?",
["Data controller","Data processor","Data subject","Supervisory authority"],
"The controller determines the purposes and means of processing; the processor acts on the controller's instructions. The controller remains accountable for the processor's actions and must have a Data Processing Agreement in place.",
"Exam tip: outsourcing the processing never outsources accountability."],
["Which is the FIRST step when creating a Business Continuity Plan?",
["Obtain senior management support and define the project scope and policy","Perform the Business Impact Analysis","Select a hot site","Test the recovery procedures"],
"Without management sponsorship there is no budget, authority or scope. The BIA follows project initiation, then preventive controls, recovery strategies, plan development, and testing/maintenance (NIST SP 800-34 sequence).",
"Exam tip: if 'BIA' and 'management approval' are both options for the FIRST step, choose management approval."],
["During a BIA, the finance department states it can survive 48 hours without its payment system. IT can restore it in 30 hours, and business validation takes 12 hours. What can be concluded?",
["The plan is acceptable because RTO + WRT (42h) is within the MTD (48h)","The plan fails because the RTO exceeds the MTD","The RPO must be increased to 48 hours","The WRT should be ignored for critical systems"],
"MTD is the total downtime the business can tolerate. Technical recovery (RTO) plus work recovery/validation time (WRT) must fit inside it: 30 + 12 = 42 ≤ 48.",
"Exam tip: RPO is about data loss (how far back you restore), not downtime."],
["Which risk response is being used when an organization stops offering a product because its risk is unacceptable?",
["Risk avoidance","Risk transference","Risk mitigation","Risk acceptance"],
"Avoidance eliminates the activity that creates the risk. It removes both the risk and the associated business benefit. Ignoring a risk (risk rejection) is never a valid response.",
"Exam tip: insurance = transfer; adding controls = mitigation; signed waiver by management = acceptance."],
["Which threat modeling approach maps directly to violated security properties such as authentication and integrity?",
["STRIDE","PASTA","Attack trees","DREAD"],
"STRIDE classifies threats: Spoofing (authentication), Tampering (integrity), Repudiation (non-repudiation), Information disclosure (confidentiality), Denial of service (availability), Elevation of privilege (authorization). It is typically applied to data-flow diagrams at design time.",
"Exam tip: PASTA is risk-centric (7 stages); STRIDE is threat-category-centric."],
["An employee has been terminated for misconduct. What should happen FIRST?",
["Disable the employee's logical and physical access","Conduct an exit interview","Retrieve company equipment","Notify the employee's coworkers"],
"Access revocation protects assets from a potentially hostile insider and should occur at the moment of notification. Equipment retrieval, NDA reminders and exit interviews follow.",
"Exam tip: for hostile terminations, coordinate with HR so accounts are disabled while the meeting is happening."],
["Which security control is BEST suited to detect ongoing fraud committed by a long-tenured employee?",
["Mandatory vacations","Background checks","Non-disclosure agreements","Acceptable use policy"],
"Mandatory vacations force someone else to perform the duties, revealing irregularities the fraudster could otherwise hide. Background checks are pre-employment preventive controls.",
"Exam tip: job rotation and mandatory vacation are both cited against fraud and collusion."],
["What is the BEST metric to demonstrate the effectiveness of a security awareness program to executives?",
["A measurable reduction in phishing click rates and an increase in employee incident reporting","The percentage of employees who completed the annual module","The number of training hours delivered","The cost per trained employee"],
"Effectiveness is about behavior change, not attendance. Simulated phishing trends and reporting rates show whether people actually act differently.",
"Exam tip: completion metrics show compliance; behavior metrics show effectiveness."],
["Which type of intellectual property protection requires public disclosure of the invention in exchange for exclusive rights?",
["Patent","Trade secret","Copyright","Trademark"],
"A patent grants roughly 20 years of exclusive rights but requires the invention to be published. Trade secrets remain protected only while kept secret through reasonable measures.",
"Exam tip: 'protect the formula without revealing it' = trade secret."],
["A company outsources its payroll processing to a third party. Which document BEST defines measurable service expectations?",
["Service Level Agreement (SLA)","Memorandum of Understanding (MOU)","Non-Disclosure Agreement (NDA)","Business Partnership Agreement (BPA)"],
"The SLA defines measurable commitments (availability, response times, penalties). An MOU is a less formal statement of intent; an NDA protects confidentiality; a BPA covers business partnership terms.",
"Exam tip: contracts and SLAs are your main levers of control over third parties, along with right-to-audit clauses."],
["Which statement about compliance is MOST accurate from a CISSP perspective?",
["Compliance establishes a minimum baseline but does not guarantee security","Compliance with a standard guarantees the absence of breaches","Compliance is optional if security controls are strong","Compliance replaces risk assessment"],
"Regulations define minimum expectations at a point in time. A risk-based security program goes beyond them and adapts to the organization's threat landscape.",
"Exam tip: laws and regulations override internal policy, but meeting them is a floor, not a ceiling."],
["Which document provides step-by-step instructions to perform a specific task?",
["Procedure","Policy","Guideline","Standard"],
"Policies state management intent; standards mandate specific technologies or configurations; baselines define minimum security levels; procedures are detailed steps; guidelines are optional recommendations.",
"Exam tip: only guidelines are discretionary."],
["Which framework is BEST for establishing a certifiable Information Security Management System?",
["ISO/IEC 27001","ISO/IEC 27002","COBIT","ITIL"],
"ISO 27001 defines ISMS requirements and is certifiable; it follows Plan-Do-Check-Act. ISO 27002 is the control guidance catalog (93 controls in 4 themes in the 2022 edition).",
"Exam tip: 'certify' or 'international standard for an ISMS' → ISO 27001."],
["Who should determine the classification level of a business data set?",
["The data owner","The data custodian","The system administrator","The security auditor"],
"Classification is business-driven. The owner (a senior business manager) understands the data's value and is accountable for it. The custodian implements protection.",
"Exam tip: owner decides, custodian implements, user follows."],
["A supply chain review shows a critical supplier refuses audits. What is the BEST action?",
["Require independent assurance such as a SOC 2 Type II report or ISO 27001 certificate, and assess the residual risk","Terminate all suppliers that refuse audits","Accept the supplier's verbal assurances","Ignore the issue because the supplier is contractually liable"],
"When direct audit is impossible, independent third-party attestations provide evidence-based assurance. The residual risk must then be evaluated and formally accepted or treated by management.",
"Exam tip: never accept 'trust us' from a vendor; require evidence."],
["NIST CSF 2.0 (2024) introduced which new core function?",
["Govern","Prevent","Audit","Comply"],
"CSF 2.0 has six functions: Govern, Identify, Protect, Detect, Respond, Recover. Govern covers organizational context, risk strategy, roles, policy and supply chain risk management.",
"Exam tip: the official CISSP outline still references CSF concepts; knowing the 2.0 update shows current-state awareness."]
]};

DATA[2]={fr:[
["Qui décide de la classification d'une donnée métier ?",
["Le propriétaire de la donnée ([[Data Owner]])","Le dépositaire ([[Data Custodian]])","L'administrateur système","Le DPO"],
"La classification est pilotée par le métier ([[Business-driven]]). Le Data Owner connaît la valeur de la donnée ; le custodian applique les protections décidées.",
"REX fiches : c'est l'Asset Owner, pas l'administrateur, qui fixe valeur et classification."],
["Quel rôle effectue les sauvegardes, applique les ACL et maintient les systèmes selon les consignes du propriétaire ?",
["Le dépositaire ([[Custodian]])","Le propriétaire ([[Owner]])","Le gestionnaire ([[Steward]])","L'utilisateur"],
"Le custodian (souvent l'IT) implémente les contrôles techniques au quotidien. Le Data Steward veille à la qualité et à l'usage métier de la donnée.",
"Owner décide, Custodian exécute, User respecte."],
["Quelle est la PREMIÈRE étape d'un programme de classification des données ?",
["Inventorier et identifier les actifs ([[Asset Inventory]])","Acheter un outil [[DLP]]","Chiffrer toutes les bases","Définir les durées de rétention"],
"On ne protège pas ce qu'on ne connaît pas. L'inventaire précède la valorisation, la classification, l'étiquetage puis la protection.",
"Sans inventaire, la classification et le DLP échouent."],
["Pourquoi un outil [[DLP]] échoue-t-il souvent après son déploiement ?",
["Parce que la classification des données n'a pas été faite en amont","Parce que le chiffrement TLS est trop faible","Parce que les pare-feu bloquent le DLP","Parce que les utilisateurs n'ont pas d'antivirus"],
"Le DLP ne protège que ce qu'il sait reconnaître : il dépend d'une classification et d'un étiquetage rigoureux.",
"REX fiches : « Conditions de succès d'un DLP »."],
["Quelle classification gouvernementale américaine correspond à des dommages « exceptionnellement graves » en cas de divulgation ?",
["[[Top Secret]]","[[Secret]]","[[Confidential]]","[[Unclassified]]"],
"Top Secret = exceptionnellement grave ; Secret = grave ; Confidential = dommage ; Unclassified (incl. CUI) = pas de dommage à la sécurité nationale.",
"Secteur privé typique : Confidentiel/Privé, Sensible, Interne, Public."],
["Quel état de la donnée est le PLUS difficile à protéger par chiffrement ?",
["La donnée en cours d'utilisation ([[Data in Use]])","La donnée au repos ([[Data at Rest]])","La donnée en transit ([[Data in Transit]])","La donnée archivée"],
"Pendant le traitement par le CPU, la donnée est généralement en clair en mémoire. Solutions émergentes : [[Confidential Computing]] (enclaves [[TEE]]) et chiffrement homomorphe.",
"REX fiches : « La limite du chiffrement »."],
["Comment détruire de façon fiable des données hébergées en [[SaaS]] ?",
["Par effacement cryptographique ([[Cryptographic Erasure]] / [[Crypto-shredding]])","Par démagnétisation des disques du fournisseur","Par broyage des serveurs","En supprimant le compte utilisateur"],
"On ne peut pas détruire physiquement les supports du fournisseur. On chiffre avec ses propres clés puis on détruit les clés, rendant les données illisibles.",
"REX fiches : « Destruction dans le Cloud »."],
["Quelle méthode est INEFFICACE pour assainir un [[SSD]] ?",
["La démagnétisation ([[Degaussing]])","La destruction physique (broyage)","L'effacement cryptographique","La commande d'effacement sécurisé du fabricant ([[Secure Erase]])"],
"Le degaussing agit sur les supports magnétiques. Les SSD (mémoire flash) n'y sont pas sensibles et le [[Wear leveling]] rend l'écrasement incomplet.",
"Référence : NIST SP 800-88 (Clear, Purge, Destroy)."],
["Selon NIST SP 800-88, quel niveau d'assainissement protège contre une récupération en laboratoire tout en permettant la réutilisation du support ?",
["[[Purge]]","[[Clear]]","[[Destroy]]","[[Format]]"],
"Clear = protège contre les outils non invasifs (réécriture). Purge = protège contre les techniques de laboratoire (degauss, crypto-erase, secure erase). Destroy = support inutilisable.",
"Le formatage seul n'est pas un assainissement."],
["Qu'est-ce que la [[Data Remanence]] ?",
["Les données résiduelles qui subsistent sur un support après une suppression","La durée de rétention légale","La réplication des données vers un site distant","La perte d'intégrité due au vieillissement"],
"Supprimer un fichier ou formater un disque laisse souvent des données récupérables. D'où les méthodes d'assainissement formelles.",
"Piège : « supprimer » ≠ « assainir »."],
["Garder des données au-delà de la durée nécessaire est considéré par le CISSP comme :",
["Une augmentation de l'exposition au risque","Une bonne pratique « au cas où »","Une obligation RGPD","Une mesure de disponibilité"],
"La sur-rétention accroît la surface d'attaque, les coûts et les risques juridiques ([[e-Discovery]]). La politique de rétention fixe des durées et la destruction en fin de vie.",
"REX fiches : « Le risque de la sur-rétention »."],
["Une machine SCADA critique tourne sous un OS en fin de support ([[EOS]]) non patchable. Que faire ?",
["Appliquer des contrôles compensatoires : segmentation stricte / isolation ([[Air-gap]])","La débrancher immédiatement","Installer un antivirus récent","Ignorer le risque car l'équipement fonctionne"],
"Remplacer peut être impossible à court terme. L'isolation réseau et la surveillance accrue réduisent le risque en attendant le remplacement planifié.",
"REX fiches : EOL ≠ EOS. EOS = plus de correctifs ni support."],
["Quelle est la différence entre [[EOL]] et [[EOS]] ?",
["EOL = fin de commercialisation ; EOS = fin du support et des correctifs","Ce sont des synonymes","EOS précède toujours EOL de 10 ans","EOL concerne le matériel, EOS uniquement le logiciel"],
"End of Life : le fabricant cesse de vendre ou de produire. End of Support : plus de mises à jour de sécurité, ce qui crée le vrai risque.",
"Le cycle de vie de l'actif doit anticiper ces dates (planification budgétaire)."],
["Quel principe de protection de la vie privée impose de ne collecter que les données strictement nécessaires ?",
["La minimisation des données ([[Data Minimization]])","La limitation de conservation","L'exactitude","La portabilité"],
"Principe RGPD art. 5 : minimisation. Il réduit l'impact potentiel d'une fuite et les coûts de protection.",
"Associé au [[Privacy by Design]] et au [[Privacy by Default]]."],
["Quelle technique remplace une donnée sensible par une valeur de substitution sans lien mathématique, la correspondance étant stockée dans un coffre ?",
["La tokenisation ([[Tokenization]])","Le hachage","Le chiffrement symétrique","Le masquage statique"],
"La tokenisation (très utilisée pour PCI DSS) réduit le périmètre de conformité : le token n'a aucune valeur hors du coffre ([[Token Vault]]).",
"Masquage = masquer à l'affichage ; pseudonymisation = réversible avec information additionnelle."],
["Selon le RGPD, des données pseudonymisées sont-elles toujours des données personnelles ?",
["Oui, car la ré-identification reste possible avec des informations additionnelles","Non, elles sont anonymes","Non, si elles sont chiffrées","Oui, seulement si elles contiennent un nom"],
"La pseudonymisation ([[Pseudonymization]]) est réversible ; seule l'anonymisation irréversible sort du champ du RGPD.",
"Piège classique : pseudonymisation ≠ anonymisation ([[Anonymization]])."],
["Une sauvegarde est perdue par un transporteur. Quelle est la cause racine selon le CISSP ?",
["Un échec de la politique de manipulation ([[Handling]]) des supports","Une erreur du transporteur uniquement","Un défaut du chiffrement","Une panne du logiciel de sauvegarde"],
"Les exigences de manipulation combinent contrôles physiques, procéduraux (journaux de mouvements) et chiffrement ; leur absence est un manquement de politique.",
"REX fiches : « Treating handling as just encrypt it » est un piège."],
["Quel est le BUT principal de l'étiquetage ([[Labeling]] / [[Marking]]) des actifs ?",
["Indiquer clairement le niveau de classification pour appliquer la bonne manipulation","Faciliter l'inventaire comptable","Remplacer le chiffrement","Identifier le fabricant"],
"Le marquage (lisible par l'humain) et l'étiquetage (métadonnées lisibles par les machines) déclenchent les règles de manipulation et de DLP.",
"Les supports non étiquetés doivent être traités au niveau de classification le plus élevé."],
["Un support non étiqueté est retrouvé dans une salle. Comment le traiter ?",
["Au niveau de classification le plus élevé jusqu'à vérification","Comme une donnée publique","Le jeter immédiatement","Le réutiliser après formatage"],
"Par prudence, un support d'origine inconnue est présumé sensible.",
"Principe de précaution face à l'inconnu."],
["Lors du provisionnement d'accès à un actif, quel enchaînement est attendu ?",
["Demander → Approuver → Émettre → Tracer → Révoquer","Émettre → Approuver → Demander","Créer le compte puis demander l'approbation","Accorder les droits admin puis réduire"],
"Le provisionnement est un processus formel documenté, appuyé sur le moindre privilège ([[Least Privilege]]).",
"REX fiches : le piège de la rapidité, donner trop de droits « pour gagner du temps »."],
["Dans un modèle IaaS, qui reste responsable de la classification et de la protection des données ?",
["Le client ([[Shared Responsibility Model]])","Le fournisseur cloud exclusivement","L'hébergeur physique","Personne, c'est contractuel"],
"Quel que soit le modèle (IaaS/PaaS/SaaS), les données, identités et accès restent sous la responsabilité du client.",
"REX fiches : « tes données = ton risque »."],
["Quel principe consiste à adapter une baseline de contrôles au contexte de l'organisation ?",
["L'adaptation ([[Tailoring]])","Le [[Scoping]]","La normalisation","La certification"],
"Scoping = sélectionner les contrôles applicables (retirer ceux qui ne s'appliquent pas). Tailoring = ajuster les contrôles retenus au contexte (paramètres, compensations).",
"Les deux personnalisent une baseline comme NIST SP 800-53."],
["Quel rôle RGPD est obligatoire pour les organismes traitant à grande échelle des données sensibles ?",
["Le délégué à la protection des données ([[DPO]])","Le RSSI","Le [[Data Custodian]]","L'auditeur externe"],
"Le DPO conseille, contrôle la conformité et coopère avec l'autorité. Il doit être indépendant.",
"Le DPO n'est pas responsable de la conformité : c'est le Controller."],
["Quel outil analyse les flux sortants pour empêcher l'exfiltration de numéros de carte bancaire ?",
["Un [[DLP]] réseau","Un [[IDS]] signature","Un proxy cache","Un [[HSM]]"],
"Le DLP réseau inspecte le trafic (y compris par déchiffrement TLS autorisé) et applique des politiques fondées sur la classification.",
"DLP endpoint, réseau et cloud ([[CASB]]) se complètent."],
["Quel contrôle protège les données sur un portable volé ?",
["Le chiffrement intégral du disque ([[Full Disk Encryption]])","Le pare-feu personnel","L'antivirus","Le VPN"],
"Le FDE (BitLocker, FileVault, LUKS) protège la donnée au repos, idéalement couplé au [[TPM]] et à une authentification pré-démarrage.",
"Le VPN protège le transit, pas le repos."],
["Le droit RGPD permettant à une personne de demander la suppression de ses données est :",
["Le droit à l'effacement ([[Right to be forgotten]])","Le droit de portabilité","Le droit d'opposition","Le droit de rectification"],
"Art. 17 RGPD, avec exceptions (obligations légales, intérêt public…). Il impose de savoir où se trouvent les données (inventaire, data mapping).",
"La cartographie des traitements (registre art. 30) est indispensable."],
["Quelle phase du cycle de vie de la donnée précède l'archivage ?",
["Le partage / l'utilisation ([[Share]] / [[Use]])","La création","La destruction","La classification initiale"],
"Cycle classique : Create → Store → Use → Share → Archive → Destroy. La classification intervient dès la création.",
"Chaque phase a ses contrôles (étiquetage, chiffrement, DLP, rétention, assainissement)."],
["Quel contrôle garantit qu'une donnée archivée reste lisible sur 20 ans ?",
["Une politique de migration des formats/supports et de gestion des clés à long terme","Une copie unique sur bande","Le chiffrement avec une clé jetable","Le stockage sur clés USB"],
"Disponibilité long terme = migration régulière des formats et supports, tests de restauration, conservation des clés de déchiffrement.",
"Une archive chiffrée sans clé est une donnée détruite."],
["Quel risque particulier pose la mémoire virtuelle ([[Paging file]]) pour les données sensibles ?",
["Des secrets en RAM peuvent être écrits en clair sur le disque","Elle accélère les attaques par force brute","Elle empêche le chiffrement des disques","Elle supprime les journaux"],
"Le swap transfère des pages mémoire sur disque ; un disque non chiffré peut alors contenir des mots de passe ou clés.",
"REX fiches (D3) : « Menaces de la mémoire virtuelle »."],
["Quel principe s'applique lorsqu'un utilisateur habilité « Secret » ne peut lire un dossier « Secret » que s'il en a besoin pour sa mission ?",
["Le besoin d'en connaître ([[Need to Know]])","Le moindre privilège","La séparation des tâches","La défense en profondeur"],
"L'habilitation ([[Clearance]]) ne suffit pas : il faut aussi un besoin métier justifié.",
"Clearance + Need to Know = accès en environnement MAC."],
["Quelle catégorie de données est visée par HIPAA ?",
["[[PHI]] (Protected Health Information)","[[PCI]] (cartes bancaires)","[[CUI]]","[[FERPA]]"],
"PHI = données de santé identifiantes. PII = données personnelles identifiantes. Cardholder data = PCI DSS.",
"PII ≠ PHI : la PHI est un sous-ensemble à protection renforcée."],
["Qu'est-ce que le [[Data Steward]] ?",
["Le responsable de la qualité, des métadonnées et du bon usage métier des données","Le propriétaire légal de la base","L'administrateur des sauvegardes","Le sous-traitant RGPD"],
"Le steward assure la gouvernance opérationnelle de la donnée (qualité, définitions, conformité d'usage).",
"Rôles à distinguer : Owner, Steward, Custodian, Processor, Controller, Subject."],
["Pour protéger des bandes de sauvegarde envoyées hors site, que faut-il exiger ?",
["Chiffrement avant départ et chaîne de traçabilité du transport","Un transporteur rapide","Des bandes de plus grande capacité","Une copie supplémentaire en interne seulement"],
"Les supports en transit sont une cible de choix : chiffrement, scellés, journal de mouvements, transporteur agréé.",
"REX fiches (D7) : « Les sauvegardes sont des cibles de choix »."],
["Quelle approche réduit le PLUS le périmètre de conformité PCI DSS d'un commerçant ?",
["La tokenisation ou l'externalisation du traitement des cartes","Le chiffrement des journaux","L'ajout d'un IDS","Une formation annuelle"],
"Moins de systèmes stockent ou traitent les données de carte, plus le périmètre ([[Scope]]) d'audit est réduit.",
"PCI DSS v4.0.1 est la version en vigueur depuis 2024–2025."],
["Une donnée est classée « Publique ». Quel niveau de protection appliquer ?",
["Une protection proportionnée à sa valeur, principalement l'intégrité et la disponibilité","Le même niveau que « Top Secret »","Aucune protection","Uniquement le chiffrement"],
"Protection proportionnelle : on ne met pas une donnée publique dans un coffre-fort, mais on protège son intégrité (ex. site web).",
"REX fiches : « Protection proportionnelle »."],
["Quelle est la meilleure méthode pour garantir qu'un disque dur contenant des données Top Secret ne sera jamais lu ?",
["La destruction physique (broyage, incinération, désintégration)","Le formatage rapide","Une réécriture en un passage","La suppression de la partition"],
"Pour les niveaux les plus sensibles, la destruction physique est la seule assurance totale.",
"Coût du support négligeable face au risque."],
["Qui est la personne concernée ([[Data Subject]]) au sens du RGPD ?",
["La personne physique identifiée ou identifiable à qui se rapportent les données","L'entreprise qui collecte","Le sous-traitant","L'autorité de contrôle"],
"Le data subject dispose des droits (accès, rectification, effacement, portabilité, opposition).",
"Seules les personnes physiques sont concernées, pas les entreprises."],
["Quel mécanisme technique applique la classification aux documents bureautiques même après qu'ils ont quitté l'entreprise ?",
["La gestion des droits numériques ([[DRM]] / [[IRM]])","Le pare-feu","Le VPN","Le RAID"],
"L'IRM chiffre le document et contrôle les droits (lecture, impression, expiration) partout où il circule.",
"Complément du DLP pour la donnée en mouvement hors périmètre."],
["Quel document formalise les durées de conservation par type de données ?",
["La politique / le calendrier de rétention ([[Retention Policy]] / [[Retention Schedule]])","Le BIA","Le registre des incidents","La charte informatique"],
"Elle concilie obligations légales, besoins métier et minimisation. Une suspension pour contentieux ([[Legal Hold]]) peut geler la destruction.",
"Legal Hold prime sur la destruction programmée."],
["Quel est l'objectif d'un inventaire des actifs matériels et logiciels à jour ?",
["Servir de base à la gestion des risques, des vulnérabilités et des configurations","Remplacer le registre comptable","Calculer le salaire des administrateurs","Choisir les couleurs des étiquettes"],
"CIS Controls 1 et 2 : inventaire des actifs matériels et logiciels. Sans inventaire, pas de patch management fiable ni de détection d'actifs non autorisés ([[Shadow IT]]).",
"État de l'art : outils CAASM pour un inventaire continu."]

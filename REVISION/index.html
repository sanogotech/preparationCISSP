en:[
["Who is PRIMARILY responsible for determining the classification of a data asset?",
["Data owner","Data custodian","Data processor","Security administrator"],
"The data owner is a business role accountable for the asset. They understand its value and the impact of its compromise, so they set classification, approve access and define handling. Custodians (often IT) implement these decisions.",
"Exam tip: classification is business-driven, never IT-driven."],
["An organization is moving to a SaaS platform and must ensure data is irrecoverable at contract end. What is the BEST approach?",
["Use cryptographic erasure by destroying customer-managed encryption keys","Degauss the provider's disks","Request physical shredding of the provider's servers","Delete all records through the user interface"],
"In multi-tenant cloud, you cannot access the physical media. Encrypting with keys you control (BYOK/HYOK) and destroying those keys renders all copies, including backups, unreadable.",
"Exam tip: cloud + sanitization = crypto-shredding."],
["Which sanitization method is LEAST effective for solid-state drives?",
["Degaussing","Cryptographic erase","Physical destruction","Manufacturer secure erase command"],
"SSDs store data in flash cells, not magnetic domains, so degaussing does nothing. Wear-leveling also leaves data in spare blocks that overwrites cannot reach. NIST SP 800-88 recommends crypto-erase, firmware secure erase or destruction.",
"Exam tip: magnetic media → degauss; flash media → crypto-erase or destroy."],
["What is the GREATEST risk of retaining data longer than required?",
["Increased exposure to breaches, legal discovery and regulatory penalties","Higher network latency","Loss of data integrity","Reduced backup performance"],
"Every record kept is a liability: it can be stolen, subpoenaed in e-discovery, or violate storage-limitation principles in privacy law. Retention schedules balance legal requirements with minimization.",
"Exam tip: 'keep everything just in case' is the wrong answer."],
["A DLP project fails to detect sensitive documents leaving the network. What is the MOST likely root cause?",
["Data was never properly classified and labeled","The firewall rules are too permissive","The SIEM is not correlating logs","Users lack antivirus software"],
"DLP engines rely on classification labels, fingerprints and patterns. Without upstream classification, the tool does not know what to protect, leading to false negatives or noise.",
"Exam tip: process before technology; classification precedes DLP."],
["Which data state is MOST difficult to protect with traditional encryption?",
["Data in use","Data at rest","Data in transit","Archived data"],
"Data must normally be decrypted in memory for processing. Confidential computing (hardware-based trusted execution environments) and homomorphic encryption are emerging solutions.",
"Exam tip: at rest → disk/database encryption; in transit → TLS/IPsec; in use → TEE/enclaves."],
["What is the difference between scoping and tailoring when applying a security baseline?",
["Scoping removes controls that do not apply; tailoring modifies the remaining controls to fit the organization","Scoping is done by auditors; tailoring by vendors","They are the same process","Tailoring removes controls; scoping adds new ones"],
"Organizations start from a baseline (e.g., NIST SP 800-53, CIS Benchmarks). Scoping selects what is relevant to the system; tailoring adjusts parameters and adds compensating controls.",
"Exam tip: both must be documented and justified by risk."],
["A legacy industrial controller running an unsupported OS cannot be replaced for two years. What should the security manager do?",
["Implement compensating controls such as network isolation and enhanced monitoring","Disconnect it immediately, regardless of business impact","Install a modern endpoint agent on it","Accept the risk without documentation"],
"End-of-support systems no longer receive patches. Isolation (segmentation, air gap, strict allow-lists) reduces exposure while management formally accepts the residual risk and plans replacement.",
"Exam tip: legacy + unpatchable = segment and monitor."],
["Which role ensures data quality, metadata and appropriate business use of data?",
["Data steward","Data custodian","Data subject","Data processor"],
"Stewards handle day-to-day governance of data meaning and quality. Custodians handle technical protection; owners hold accountability.",
"Exam tip: owner = accountable, steward = quality/governance, custodian = technical care."],
["Which technique BEST reduces PCI DSS scope for stored cardholder data?",
["Tokenization","Hashing passwords","Network address translation","Data mirroring"],
"Tokens have no exploitable value outside the token vault, so systems that only see tokens can be removed from the cardholder data environment.",
"Exam tip: tokenization substitutes data; encryption transforms data reversibly with a key."],
["Under GDPR, pseudonymized data is considered:",
["Personal data, because re-identification is possible with additional information","Anonymous data outside GDPR scope","Public data","Encrypted data exempt from breach notification"],
"Pseudonymization reduces risk and is encouraged, but only irreversible anonymization removes data from GDPR scope.",
"Exam tip: reversible = still personal data."],
["An unlabeled hard drive is found in a storage room. How should it be handled?",
["Treat it at the highest classification level until its contents are verified","Reuse it after a quick format","Dispose of it in regular trash","Return it to the vendor"],
"Unknown media are presumed sensitive. Proper procedure is to secure it, identify its owner and contents, and sanitize or destroy according to policy.",
"Exam tip: when in doubt, protect at the highest level."],
["What is the PRIMARY purpose of data labeling?",
["To ensure users and systems apply the correct handling requirements","To track asset depreciation","To identify hardware vendors","To replace encryption"],
"Labels (human-readable markings and machine-readable metadata) trigger handling rules: who may access, how to transmit, store and destroy the information.",
"Exam tip: labeling enables DLP, IRM and correct human behavior."],
["Which NIST SP 800-88 sanitization category renders media unusable?",
["Destroy","Purge","Clear","Erase"],
"Clear defeats simple non-invasive recovery; Purge defeats laboratory attacks while allowing reuse; Destroy (shred, disintegrate, incinerate, pulverize) makes media unusable.",
"Exam tip: highest sensitivity or damaged media → destroy."],
["During litigation, legal counsel issues a legal hold. What happens to the scheduled destruction of relevant records?",
["It is suspended until the hold is lifted","It continues according to the retention schedule","Records are moved to public storage","Only paper records are kept"],
"A legal hold overrides routine retention and destruction. Destroying data under hold can be considered spoliation of evidence.",
"Exam tip: legal obligations override internal schedules."],
["Which control BEST protects data on a lost corporate laptop?",
["Full disk encryption with pre-boot authentication","Host-based firewall","Antivirus software","Screen lock after 15 minutes"],
"FDE protects data at rest even if the drive is removed. Combined with TPM and pre-boot PIN, it defeats offline attacks.",
"Exam tip: theft scenario → encryption at rest."],
["Which principle states that only the data strictly necessary for a purpose should be collected?",
["Data minimization","Purpose limitation","Storage limitation","Accuracy"],
"Minimization reduces both privacy risk and breach impact. It is a core GDPR principle and part of privacy by design.",
"Exam tip: less data collected = less data to protect."],
["Which technology enforces usage restrictions on a document even after it leaves the corporate network?",
["Information Rights Management (IRM)","Network DLP","VPN","Web proxy"],
"IRM encrypts content and embeds policies (view, print, copy, expiry) enforced by an authorization service wherever the file travels.",
"Exam tip: persistent protection outside the perimeter = IRM/DRM."],
["Why is an accurate asset inventory foundational for security?",
["You cannot protect, patch or monitor assets you do not know exist","It is required to calculate payroll","It replaces the risk register","It eliminates shadow IT automatically"],
"Inventory feeds classification, risk assessment, vulnerability and configuration management. CIS Controls 1 and 2 are hardware and software inventory.",
"Exam tip: inventory is the FIRST step of asset security."],
["Under the shared responsibility model, which item is ALWAYS the customer's responsibility regardless of cloud service model?",
["Data and identity/access management","Physical security of the data center","Hypervisor patching","Network hardware maintenance"],
"In IaaS, PaaS and SaaS alike, customers own their data, who can access it, and how it is classified. Providers handle physical and lower-layer infrastructure.",
"Exam tip: 'your data, your risk'."]
]};

DATA[3]={fr:[
["Dans le modèle [[Bell-LaPadula]], quelle règle interdit à un sujet « Top Secret » d'écrire dans un objet « Secret » ?",
["La propriété étoile ([[*-Property]] : No Write Down)","La propriété de sécurité simple ([[Simple Security Property]] : No Read Up)","La propriété d'intégrité étoile","La règle de tranquillité forte"],
"Bell-LaPadula protège la confidentialité : No Read Up (simple) et No Write Down (étoile). La [[Strong Star Property]] limite lecture et écriture au même niveau.",
"REX fiches : « Bell-LaPadula vs Biba : le piège n°1 de l'examen »."],
["Un interne en médecine (faible niveau d'intégrité) modifie le dossier d'un patient critique. Quel modèle est violé ?",
["[[Biba]] (No Write Up)","[[Bell-LaPadula]]","[[Brewer-Nash]]","[[Graham-Denning]]"],
"Biba protège l'intégrité : No Read Down (simple integrity) et No Write Up (*-integrity). Un sujet de faible intégrité ne doit pas modifier un objet de haute intégrité.",
"Mnémo fiches : Biba = Bonnes données (intégrité)."],
["Un cabinet d'audit gère des clients concurrents. Quel modèle empêche dynamiquement les conflits d'intérêts ?",
["[[Brewer-Nash]] ([[Chinese Wall]])","[[Clark-Wilson]]","[[Biba]]","[[Take-Grant]]"],
"Brewer-Nash bloque l'accès aux données d'un concurrent dès qu'un sujet a accédé à celles d'un client de la même classe de conflit.",
"Mots-déclencheurs : « conflit d'intérêts » → Brewer-Nash."],
["Quel modèle s'appuie sur des transactions bien formées, des [[TP]] (programmes de transformation) et la séparation des tâches ?",
["[[Clark-Wilson]]","[[Bell-LaPadula]]","[[Lattice-based]]","[[State Machine]]"],
"Clark-Wilson : les utilisateurs ne manipulent jamais directement les données contraintes ([[CDI]]) ; ils passent par des TP validés ([[IVP]]). Triplet sujet-programme-objet.",
"Mots-déclencheurs : « transactions » + « séparation des tâches » → Clark-Wilson."],
["Quel principe de conception affirme qu'un système doit rester sûr même si son fonctionnement est public, seule la clé restant secrète ?",
["Le principe de [[Kerckhoffs]] (rejet de la [[Security through obscurity]])","Le moindre privilège","La défense en profondeur","La simplicité ([[Keep It Simple]])"],
"La sécurité doit reposer sur le secret de la clé, pas de l'algorithme. Les algorithmes publics et éprouvés (AES) sont préférés.",
"Ne jamais choisir à l'examen un algorithme propriétaire secret."],
["Quel principe stipule qu'en cas de panne, un système doit basculer dans un état sécurisé (refuser l'accès) ?",
["[[Fail Secure]] / [[Fail Closed]]","[[Fail Open]]","[[Fail Safe]] pour les portes en cas d'incendie","[[Fail Soft]]"],
"Pour les systèmes logiques, l'échec doit être sécurisé. Exception : la sécurité des personnes impose que les portes s'ouvrent ([[Fail Safe]]) lors d'un incendie.",
"Attention à la terminologie : Fail-safe protège les personnes, Fail-secure protège les actifs."],
["Quel composant du [[TCB]] est chargé de médiatiser TOUS les accès des sujets aux objets ?",
["Le moniteur de référence ([[Reference Monitor]]) implémenté par le noyau de sécurité ([[Security Kernel]])","Le pare-feu","L'hyperviseur","Le BIOS"],
"Le reference monitor doit être inviolable ([[Tamperproof]]), toujours invoqué ([[Always invoked]]) et vérifiable ([[Verifiable]]).",
"Le TCB est l'ensemble des composants matériels/logiciels de confiance ; son périmètre est le [[Security Perimeter]]."],
["Quel principe de conception Zero Trust résume le mieux l'approche moderne ?",
["« Ne jamais faire confiance, toujours vérifier » ([[Never trust, always verify]])","Faire confiance au réseau interne","Sécuriser uniquement le périmètre","Authentifier une seule fois par jour"],
"NIST SP 800-207 : pas de confiance implicite liée à l'emplacement réseau ; chaque requête est évaluée par un [[PDP]] et appliquée par un [[PEP]].",
"REX fiches : les réponses fondées sur la confiance implicite sont toujours fausses."],
["Un administrateur modifie manuellement un serveur hors procédure. Quel est le risque et la réponse CISSP ?",
["Une dérive de configuration ([[Configuration Drift]]), à traiter par l'[[IaC]] et la gestion des changements","Aucun risque si la modification fonctionne","Une meilleure disponibilité","Un risque uniquement juridique"],
"L'IaC (Terraform, Ansible) impose une configuration cohérente, versionnée et auditable.",
"REX fiches : « La dérive de configuration »."],
["Quelle évaluation produit un niveau d'assurance [[EAL]] de 1 à 7 ?",
["Les Critères Communs ([[Common Criteria]], ISO 15408)","ISO 27001","SOC 2","PCI DSS"],
"Common Criteria : [[Protection Profile]] (besoins), [[Security Target]] (déclaration du fournisseur), [[TOE]] (cible évaluée). EAL1 = testé fonctionnellement ; EAL7 = conception formellement vérifiée et testée.",
"Certification = évaluation technique ; Accréditation = acceptation formelle par la direction ([[ATO]])."],
["Quelle est la différence entre certification et accréditation ?",
["La certification évalue techniquement le système ; l'accréditation est l'acceptation formelle du risque par la direction","Elles sont identiques","L'accréditation précède toujours la certification","La certification est faite par l'utilisateur final"],
"Dans le NIST RMF, l'autorisation ([[Authorization]]) est accordée par un [[AO]] (Authorizing Official) après évaluation.",
"RMF : Prepare, Categorize, Select, Implement, Assess, Authorize, Monitor."],
["Quel chiffrement est SYMÉTRIQUE ?",
["[[AES]]","[[RSA]]","[[ECC]]","[[Diffie-Hellman]]"],
"Symétrique : AES, 3DES, ChaCha20, Twofish (une clé partagée, rapide). Asymétrique : RSA, ECC, DH, ElGamal (paire de clés, lent).",
"REX fiches : préférez AES, RSA/ECC et SHA-256 ; jamais MD5, SHA-1, DES ou WEP."],
["Combien de clés faut-il pour 50 utilisateurs en chiffrement symétrique (chaque paire ayant sa clé) ?",
["1 225","100","2 500","50"],
"Formule N(N−1)/2 = 50 × 49 / 2 = 1 225. En asymétrique : 2N = 100 clés.",
"BONUS 4 : le symétrique ne passe pas à l'échelle (scalabilité)."],
["Pour signer numériquement un message, l'expéditeur utilise :",
["Sa clé privée ([[Private Key]]) pour signer le condensat","La clé publique du destinataire","Sa clé publique","Une clé symétrique partagée"],
"Signature = hash du message chiffré avec la clé privée de l'émetteur ; vérification avec sa clé publique. Apporte intégrité, authenticité et non-répudiation.",
"Confidentialité = chiffrer avec la clé PUBLIQUE du destinataire."],
["Pour envoyer un message confidentiel à Bob, Alice chiffre avec :",
["La clé publique de Bob","La clé privée d'Alice","La clé privée de Bob","La clé publique d'Alice"],
"Seul Bob, détenteur de sa clé privée, peut déchiffrer.",
"Hybride en pratique : la clé publique chiffre une clé de session AES ([[Digital Envelope]])."],
["Quel service la signature numérique NE fournit-elle PAS ?",
["La confidentialité","L'intégrité","L'authentification de l'origine","La non-répudiation"],
"La signature ne cache pas le contenu. Pour la confidentialité, il faut chiffrer.",
"Un [[HMAC]] fournit intégrité et authenticité, mais pas la non-répudiation (clé partagée)."],
["Quel mode de chiffrement par blocs est à proscrire car des blocs clairs identiques produisent des blocs chiffrés identiques ?",
["[[ECB]] (Electronic Code Book)","[[GCM]]","[[CBC]]","[[CTR]]"],
"ECB laisse apparaître les motifs (exemple célèbre du pingouin). GCM est un mode authentifié ([[AEAD]]) recommandé.",
"État de l'art : AES-GCM ou ChaCha20-Poly1305 en TLS 1.3."],
["Quel mécanisme permet de vérifier en temps réel le statut de révocation d'un certificat ?",
["[[OCSP]] (Online Certificate Status Protocol)","[[CRL]] téléchargée une fois par mois","Le [[CSR]]","Le champ [[Subject]] du certificat"],
"La CRL est une liste périodique ; OCSP répond en temps réel ; l'[[OCSP Stapling]] évite la requête du client vers la CA.",
"Composants PKI : CA, RA, CRL/OCSP, certificats X.509."],
["Dans une PKI, quel rôle vérifie l'identité du demandeur avant l'émission du certificat ?",
["L'autorité d'enregistrement ([[RA]])","L'autorité de certification racine ([[Root CA]])","L'[[OCSP Responder]]","Le [[KDC]]"],
"La RA vérifie l'identité ; la CA signe et émet. Bonne pratique : CA racine hors ligne ([[Offline Root CA]]).",
"Kerberos/KDC relève du Domaine 5, pas de la PKI."],
["Quelle attaque exploite la consommation électrique ou le temps de calcul pour extraire une clé ?",
["L'attaque par canal auxiliaire ([[Side-Channel Attack]])","La force brute","L'attaque par dictionnaire","Le [[Birthday Attack]]"],
"La crypto moderne se casse rarement par les mathématiques ; les failles d'implémentation (timing, puissance, émissions EM) et la gestion des clés sont les vrais vecteurs.",
"REX fiches : « Les mathématiques vs l'humain »."],
["Quelle attaque cherche deux messages différents produisant le même condensat ?",
["L'attaque des anniversaires ([[Birthday Attack]]) / collision","Le [[Replay Attack]]","Le [[Rainbow Table]]","Le [[Known Plaintext]]"],
"Le paradoxe des anniversaires réduit l'effort à environ 2^(n/2) pour un hash de n bits. D'où l'abandon de MD5 et SHA-1.",
"Le sel ([[Salt]]) protège des rainbow tables, pas des collisions."],
["Quelle mesure protège le mieux des mots de passe stockés contre les [[Rainbow Tables]] ?",
["Un hachage lent salé ([[Salt]]) comme [[Argon2]], [[bcrypt]] ou [[PBKDF2]]","Le chiffrement AES avec une clé statique","MD5 avec un sel","Le stockage en Base64"],
"Le sel unique par utilisateur rend les tables précalculées inutiles ; les fonctions lentes ([[Key Stretching]]) freinent la force brute. Un [[Pepper]] secret peut s'ajouter.",
"Base64 est un encodage, pas un chiffrement."],
["Quelle est la menace principale de l'informatique quantique pour la cryptographie actuelle ?",
["L'algorithme de [[Shor]] casse RSA et ECC ; d'où la cryptographie post-quantique ([[PQC]])","Il rend AES-256 inutilisable","Il casse tous les hachages instantanément","Il n'a aucun impact"],
"Shor menace l'asymétrique. Grover réduit de moitié la sécurité symétrique (AES-256 reste robuste). NIST a publié en 2024 FIPS 203 ([[ML-KEM]]), 204 ([[ML-DSA]]) et 205 ([[SLH-DSA]]).",
"État de l'art 2026 : inventaire crypto et [[Crypto-agility]] face au risque [[Harvest now, decrypt later]]."],
["Quel composant matériel stocke et protège des clés cryptographiques avec certification FIPS 140-2/140-3 ?",
["Un [[HSM]] (Hardware Security Module)","Un [[TPM]] dans tous les cas","Un disque SSD","Un pare-feu"],
"Le HSM gère clés et opérations cryptographiques à haut niveau d'assurance (PKI, paiements). Le TPM est une puce de poste/serveur pour l'intégrité du démarrage et le stockage de clés locales.",
"Gestion des clés : génération, distribution, stockage, rotation, révocation, destruction."],
["Un attaquant capte un échange d'authentification puis le rejoue. Quelle contre-mesure est la PLUS efficace ?",
["Horodatages et [[Nonce]] (valeurs à usage unique)","Un mot de passe plus long","Le chiffrement ECB","Le stockage Base64"],
"Les nonces, horodatages et numéros de séquence invalident les messages rejoués ([[Replay Attack]]).",
"Kerberos utilise des horodatages, d'où la synchronisation d'horloge."],
["Où placer la salle serveurs dans un nouveau bâtiment ?",
["Au centre du bâtiment, loin des murs extérieurs, du rez-de-chaussée inondable et du toit","Au sous-sol pour la discrétion","Au dernier étage pour la vue","Près de l'entrée pour faciliter les livraisons"],
"Le cœur du bâtiment réduit l'exposition aux menaces externes, aux inondations et aux fuites de toiture.",
"REX fiches : « Design Core »."],
["Quel système d'extinction à eau est recommandé pour un data center ?",
["[[Pre-Action]]","[[Wet Pipe]]","[[Deluge]]","Extincteur à poudre universel"],
"Pre-action : les tuyaux se remplissent seulement après une première détection, puis la tête doit fondre. Il limite les dégâts en cas de fausse alarme ou de tuyau endommagé.",
"REX fiches : la réponse est toujours Pre-Action."],
["Quelle classe de feu concerne les équipements électriques (classification US) ?",
["Classe [[C]]","Classe [[A]]","Classe [[B]]","Classe [[K]]"],
"US : A = combustibles ordinaires, B = liquides inflammables, C = électrique, D = métaux, K = graisses de cuisine.",
"Couper l'alimentation transforme souvent un feu C en feu A/B."],
["Quelle approche CPTED utilise l'éclairage, les fenêtres et l'aménagement pour que les intrus se sentent observés ?",
["La surveillance naturelle ([[Natural Surveillance]])","Le contrôle d'accès naturel","Le renforcement territorial","Le [[Mantrap]]"],
"CPTED : Natural Access Control, Natural Surveillance, Territorial Reinforcement, Maintenance.",
"La sécurité physique commence par la conception du site."],
["Quel dispositif empêche le talonnage ([[Tailgating]] / [[Piggybacking]]) à l'entrée d'une zone sensible ?",
["Un sas ([[Mantrap]] / [[Access Control Vestibule]])","Une caméra seule","Un panneau d'avertissement","Un détecteur de fumée"],
"Le sas n'autorise qu'une personne à la fois, avec double porte et authentification.",
"Les caméras sont détectives/dissuasives, pas préventives."],
["Un hyperviseur de type 1 ([[Bare metal]]) se distingue d'un type 2 car :",
["Il s'exécute directement sur le matériel, sans OS hôte","Il nécessite un OS hôte comme Windows","Il ne gère qu'une seule VM","Il est réservé aux conteneurs"],
"Type 1 : ESXi, Hyper-V, KVM. Type 2 : VirtualBox, VMware Workstation. Risque majeur : l'évasion de VM ([[VM Escape]]).",
"[[VM Sprawl]] = prolifération de VM non gérées."],
["Quelle menace concerne la capacité d'un attaquant à déduire une information sensible en combinant des données non sensibles ?",
["L'inférence ([[Inference]])","L'agrégation ([[Aggregation]])","La polyinstanciation","L'injection"],
"Agrégation = combiner plusieurs données pour obtenir une information plus sensible. Inférence = déduire l'information. La [[Polyinstantiation]] contre l'inférence en bases de données.",
"Piège fréquent : agrégation (collecter) vs inférence (déduire)."],
["Quelle protection est la plus efficace contre l'interception des émissions électromagnétiques des câbles ?",
["Des câbles blindés ou la fibre optique ; [[TEMPEST]] pour les équipements","Le chiffrement ECB","Des câbles plus longs","Un antivirus"],
"La fibre est immunisée contre les EMI et ne rayonne pas. TEMPEST traite les émanations des équipements (cages de Faraday, brouillage).",
"REX fiches : « Protection EMR »."],
["Comment sécuriser un système ICS/SCADA ou IoT obsolète ?",
["Par la segmentation réseau et l'isolation, avec surveillance passive","En installant un antivirus agressif","En l'exposant sur Internet pour la maintenance","En appliquant tous les correctifs sans test"],
"Un antivirus pourrait le faire planter (perte de disponibilité). L'architecture prime sur l'outil (modèle Purdue, IEC 62443).",
"REX fiches : « Sécuriser les SCADA/ICS ou IoT obsolètes »."],
["Quelle vulnérabilité permet à un processus d'exploiter le délai entre la vérification d'une ressource et son utilisation ?",
["[[TOCTOU]] (Time Of Check to Time Of Use) / [[Race Condition]]","Le débordement de tampon","Le XSS","La [[Covert Channel]]"],
"L'état de la ressource change entre le contrôle et l'usage. Contre-mesures : opérations atomiques, verrous.",
"Covert channel de stockage ou de temps = communication non autorisée."],
["Quel principe de « Secure by Design » limite les fonctionnalités et services à ceux strictement nécessaires ?",
["La réduction de la surface d'attaque / [[Least Functionality]]","La redondance","La haute disponibilité","La virtualisation"],
"Désactiver services, ports et comptes inutiles (durcissement / [[Hardening]]) limite les vecteurs d'attaque.",
"Les CIS Benchmarks fournissent des baselines de durcissement."],
["Dans le modèle cloud, qui gère le système d'exploitation des machines virtuelles en [[IaaS]] ?",
["Le client","Le fournisseur","Le fournisseur et le client à parts égales","Personne"],
"IaaS : le fournisseur gère le physique, le réseau et l'hyperviseur ; le client gère OS, middleware, applications, données. En PaaS, l'OS est géré par le fournisseur.",
"SaaS : le client gère surtout données, identités et configuration."],
["Quel modèle d'architecture d'entreprise est dédié à la sécurité, avec une matrice 6×6 ?",
["[[SABSA]]","[[TOGAF]]","[[Zachman]]","[[ITIL]]"],
"SABSA part des besoins métier (couche contextuelle) jusqu'aux composants. TOGAF : architecture d'entreprise (ADM, BDAT). Zachman : matrice Qui/Quoi/Où/Quand/Pourquoi/Comment.",
"BONUS 6 : SABSA = Sécurité Architecture."],
["Quelle notion désigne un système capable de traiter plusieurs niveaux de classification avec des utilisateurs d'habilitations différentes ?",
["Le mode [[Multilevel]] (MLS)","Le mode [[Dedicated]]","Le mode [[System High]]","Le mode [[Compartmented]]"],
"Dedicated : tous ont habilitation + besoin d'en connaître pour tout. System High : habilitation pour tout, besoin pour une partie. Compartmented : habilitation pour tout, accès formel pour certaines parties. Multilevel : habilitations variables.",
"Modes historiques testés sous forme de définition."],
["Quel algorithme d'échange de clés permet d'établir un secret partagé sur un canal non sûr, sans l'authentifier ?",
["[[Diffie-Hellman]]","[[AES]]","[[SHA-256]]","[[RSA]] signature"],
"DH (et ECDHE) assure l'échange de clés ; sans authentification, il est vulnérable au [[MITM]]. ECDHE apporte la confidentialité persistante ([[Perfect Forward Secrecy]]).",
"TLS 1.3 impose (EC)DHE éphémère."]
],
en:[
["A military system must prevent a user cleared for Secret from reading Top Secret documents. Which model property enforces this?",
["Bell-LaPadula simple security property (no read up)","Bell-LaPadula *-property (no write down)","Biba simple integrity property","Clark-Wilson certification rule"],
"Bell-LaPadula is a confidentiality model. Its simple security property blocks reading objects at a higher level; its star property blocks writing to a lower level to prevent leakage. It does not address integrity.",
"Exam tip: 'secret', 'military', 'leakage' → Bell-LaPadula. 'corruption', 'trusted data' → Biba."],
["Which security model is BEST suited to prevent fraud in commercial accounting through well-formed transactions and separation of duties?",
["Clark-Wilson","Bell-LaPadula","Brewer-Nash","Lattice-based model"],
"Clark-Wilson enforces integrity via the access triple (subject–transformation procedure–constrained data item). Users can only change data through certified programs, and duties are separated.",
"Exam tip: transactions + SoD = Clark-Wilson."],
["Which algorithm should be selected for bulk encryption of data at rest?",
["AES-256","RSA-4096","SHA-256","MD5"],
"Symmetric algorithms are fast and suited to large volumes. RSA is slow and used for key exchange or signatures; SHA-256 is a hash (no encryption); MD5 is deprecated.",
"Exam tip: never pick DES, MD5, SHA-1, RC4 or WEP as a 'best' answer."],
["How many keys are required for 100 users to communicate privately using symmetric cryptography?",
["4,950","200","100","9,900"],
"N(N−1)/2 = 100 × 99 / 2 = 4,950. Asymmetric cryptography requires only 2N = 200 keys, which is why hybrid systems use public keys to distribute symmetric session keys.",
"Exam tip: symmetric scales poorly; asymmetric solves key distribution."],
["Which property of a digital signature provides non-repudiation?",
["The signature is created with the sender's private key, which only the sender possesses","The message is encrypted with the receiver's public key","A shared secret key is used","The message is compressed before sending"],
"Because only the signer has the private key, a valid signature binds them to the message. HMACs use a shared key, so either party could have produced them and they cannot provide non-repudiation.",
"Exam tip: integrity + authenticity + non-repudiation = digital signature; confidentiality requires encryption."],
["What is the PRIMARY reason organizations are planning migrations to post-quantum cryptography today?",
["Adversaries may harvest encrypted data now and decrypt it later once quantum computers can break RSA and ECC","AES-128 has already been broken by quantum computers","Hash functions no longer work","Quantum computers make TLS faster"],
"Shor's algorithm threatens public-key cryptography. Long-lived secrets intercepted today are at risk. NIST published FIPS 203 (ML-KEM), 204 (ML-DSA) and 205 (SLH-DSA) in 2024; crypto-agility and cryptographic inventories are the first steps.",
"Exam tip: Grover only halves symmetric strength, so AES-256 remains a sound choice."],
["Which fire suppression system is MOST appropriate for a data center?",
["Pre-action sprinkler system","Wet pipe system","Deluge system","Class A soda-acid extinguishers only"],
"Pre-action requires a detection event before water enters the pipes and then a sprinkler head must activate, reducing accidental water damage. Clean-agent gas systems (e.g., FM-200, inert gases) are also common, while Halon is banned for new installations.",
"Exam tip: life safety first; doors fail safe, systems fail secure."],
["A door controlling access to a server room loses power. For the server room (no egress role), which configuration is preferred?",
["Fail secure, the door remains locked","Fail open, the door unlocks","Fail soft, the door half opens","No preference"],
"Doors protecting assets should fail secure. Doors on evacuation routes must fail safe so people can exit. Life safety always overrides asset protection.",
"Exam tip: check whether the door is on an egress route before answering."],
["Which concept describes the combination of all hardware, firmware and software components that enforce the security policy?",
["Trusted Computing Base (TCB)","Reference monitor","Security perimeter","Ring 3"],
"The TCB is everything that must be trusted for security. The reference monitor is the abstract machine mediating access; the security kernel implements it; the security perimeter separates the TCB from the rest of the system.",
"Exam tip: reference monitor = tamperproof, always invoked, verifiable."],
["An attacker measures power consumption of a smart card to extract its key. What type of attack is this?",
["Side-channel attack","Brute-force attack","Chosen ciphertext attack","Birthday attack"],
"Side-channel attacks exploit physical leakage (timing, power, EM emissions, acoustic) rather than mathematical weaknesses. Countermeasures include constant-time code, shielding and noise injection.",
"Exam tip: modern crypto usually fails at implementation and key management, not math."],
["Which statement BEST describes a Zero Trust architecture as defined by NIST SP 800-207?",
["Access decisions are made per request based on identity, device posture and context, with no implicit trust from network location","All internal traffic is trusted once the VPN is established","A perimeter firewall is sufficient","Users are authenticated once per day"],
"Zero Trust uses a policy decision point (policy engine and administrator) and policy enforcement points to grant least-privilege, session-based access. Micro-segmentation and continuous verification are key elements.",
"Exam tip: any answer relying on 'internal network = trusted' is wrong."],
["What does an EAL7 rating under Common Criteria indicate?",
["The product design has been formally verified and tested","The product has been functionally tested only","The product is certified for use in any environment","The product is free of vulnerabilities"],
"EAL1 functionally tested; EAL2 structurally tested; EAL3 methodically tested and checked; EAL4 methodically designed, tested and reviewed; EAL5 semi-formally designed; EAL6 semi-formally verified; EAL7 formally verified design and tested. A higher EAL means more assurance, not more features.",
"Exam tip: Protection Profile = what the customer needs; Security Target = what the vendor claims."],
["Which block cipher mode should be AVOIDED because identical plaintext blocks produce identical ciphertext blocks?",
["ECB","GCM","CTR","CBC"],
"ECB encrypts each block independently, revealing patterns. GCM provides authenticated encryption (confidentiality + integrity) and is preferred in modern protocols.",
"Exam tip: AEAD modes (GCM, ChaCha20-Poly1305) are state of the art."],
["What is the MOST effective way to protect stored password hashes against precomputed rainbow table attacks?",
["Use a unique salt per password with a slow hashing algorithm such as Argon2 or bcrypt","Encrypt them with a single AES key","Use MD5 twice","Store them in a hidden directory"],
"A unique salt invalidates precomputed tables; slow, memory-hard algorithms make brute force expensive. OWASP currently recommends Argon2id.",
"Exam tip: hashing is one-way; encryption is reversible."],
["Which threat arises when a user combines several pieces of low-sensitivity information to deduce sensitive information?",
["Inference","Aggregation","Polyinstantiation","Data remanence"],
"Inference is deducing something you are not authorized to know. Aggregation is collecting multiple items whose combination is more sensitive. Polyinstantiation (multiple versions of a record at different levels) counters inference.",
"Exam tip: aggregation = collect; inference = deduce."],
["Which location is BEST for a critical data center inside a multi-story building?",
["A central, interior area on a middle floor","The basement for physical concealment","The top floor for easy cooling","Next to the loading dock"],
"Central placement avoids flood risk (basement), roof leaks (top floor) and external threats (perimeter walls).",
"Exam tip: wiring closets must be IT-only, never used for janitorial storage."],
["What is the MAIN security concern with Type 2 hypervisors compared with Type 1?",
["They run on top of a host operating system, increasing the attack surface","They cannot run multiple guests","They do not support networking","They are always unsupported"],
"Type 1 (bare metal) runs directly on hardware with a smaller attack surface. Type 2 inherits all vulnerabilities of the host OS. Both are exposed to VM escape.",
"Exam tip: VM sprawl and VM escape are the classic virtualization risks."],
["Which PKI component validates a requester's identity before a certificate is issued?",
["Registration Authority","Certificate Authority","Certificate Revocation List","OCSP responder"],
"The RA performs identity proofing and forwards approved requests to the CA, which signs certificates. Root CAs should be kept offline, with issuing CAs online.",
"Exam tip: OCSP = real-time status; CRL = periodic list."],
["Which design principle states that security should not depend on the secrecy of the design or algorithm?",
["Open design (Kerckhoffs's principle)","Economy of mechanism","Complete mediation","Psychological acceptability"],
"Saltzer and Schroeder's principles include economy of mechanism, fail-safe defaults, complete mediation, open design, separation of privilege, least privilege, least common mechanism and psychological acceptability.",
"Exam tip: security through obscurity is never the best answer."],
["How should a security architect protect a legacy SCADA system that cannot run endpoint security agents?",
["Isolate it through network segmentation with strict allow-listing and passive monitoring","Install a full antivirus suite","Expose it through a public IP for vendor support","Disable all logging to save resources"],
"Industrial systems prioritize availability and safety. Agents can disrupt real-time processes. Segmentation (Purdue model, IEC 62443 zones and conduits) and passive network monitoring are the standard approach.",
"Exam tip: architecture solutions beat 'install a tool' answers."]
]};

DATA[4]={fr:[
["Quel équipement segmente les domaines de diffusion ([[Broadcast Domains]]) ?",
["Le routeur (couche 3)","Le switch (couche 2)","Le hub (couche 1)","Le répéteur"],
"Le routeur ne transmet pas les broadcasts entre réseaux. Le switch segmente les domaines de collision ; les VLAN segmentent aussi le broadcast au niveau 2.",
"REX BONUS 9 : Broadcast → Routeur ; Collision → Switch."],
["À quelle couche OSI se situe l'[[ARP Spoofing]] ?",
["Couche 2 (Liaison de données)","Couche 3 (Réseau)","Couche 4 (Transport)","Couche 7 (Application)"],
"ARP relie IP et MAC sur le segment local. Contre-mesures : [[Dynamic ARP Inspection]], [[DHCP Snooping]], [[Port Security]], 802.1X.",
"Couche 2 : MAC flooding, VLAN hopping, ARP spoofing."],
["Quel contrôle protège le mieux contre un [[SYN Flood]] ?",
["Un pare-feu à états ([[Stateful]]) / [[SYN Cookies]] et protection anti-DDoS","Un WAF uniquement","Le chiffrement TLS","Un hub"],
"Le SYN flood épuise la table des connexions semi-ouvertes (couche 4). SYN cookies, limitation de débit et services de scrubbing DDoS sont les réponses.",
"REX BONUS 9 : placer le contrôle à la bonne couche."],
["Contre une injection SQL, quel contrôle réseau est le plus adapté ?",
["Un pare-feu applicatif web ([[WAF]]), en complément du code sécurisé","Un pare-feu à filtrage de paquets","Un switch manageable","Un IDS de couche 2"],
"L'injection SQL est une attaque de couche 7. Le WAF inspecte HTTP ; la vraie correction reste les requêtes paramétrées ([[Prepared Statements]]).",
"Défense en profondeur : code + WAF."],
["Un administrateur utilise Telnet pour gérer des routeurs. Quelle action corrective ?",
["Remplacer par [[SSH]]","Changer le port Telnet","Ajouter un mot de passe plus long","Utiliser FTP"],
"Telnet, FTP, HTTP, SNMPv1/v2c transmettent en clair. Remplacer par SSH, SFTP/FTPS, HTTPS, SNMPv3.",
"REX fiches : « Remplacer les protocoles clairs », toujours."],
["Quel protocole authentifie les équipements avant de leur donner accès à un port réseau filaire ou Wi-Fi ?",
["[[802.1X]] (avec [[EAP]] et RADIUS)","802.1Q","802.3","802.11a"],
"802.1X : supplicant (client), authenticator (switch/AP), authentication server (RADIUS). 802.1Q = étiquetage VLAN.",
"REX fiches : ne jamais laisser une prise RJ45 active en salle d'attente."],
["Un employé connecte son appareil personnel ([[BYOD]]). Quelle solution vérifie sa conformité avant accès ?",
["Le contrôle d'accès réseau ([[NAC]]) avec [[Health check]]","Un proxy web","Un IDS passif","Un VPN site-à-site"],
"Le NAC évalue la posture (antivirus, patchs, chiffrement) puis autorise, isole en VLAN de remédiation ou refuse.",
"REX fiches : « Appareils personnels (BYOD) »."],
["Quel mode IPsec chiffre l'ensemble du paquet IP d'origine, y compris l'en-tête ?",
["Le mode [[Tunnel]]","Le mode [[Transport]]","Le mode [[AH]] seul","Le mode passif"],
"Tunnel : nouveau paquet IP encapsulant l'original (VPN site-à-site). Transport : seule la charge utile est protégée (hôte à hôte).",
"AH = intégrité/authentification (pas de confidentialité) ; ESP = confidentialité + intégrité ; IKE = négociation des SA."],
["Quel composant IPsec fournit la confidentialité ?",
["[[ESP]] (Encapsulating Security Payload)","[[AH]] (Authentication Header)","[[IKE]]","[[ISAKMP]]"],
"AH n'offre pas de chiffrement et est incompatible avec le NAT. ESP chiffre et peut authentifier.",
"Piège classique : AH ≠ confidentialité."],
["Quelle version de TLS est l'état de l'art, ayant supprimé les suites non [[PFS]] et RSA key exchange ?",
["[[TLS 1.3]]","SSL 3.0","TLS 1.0","TLS 1.1"],
"TLS 1.3 (RFC 8446) : handshake réduit, uniquement suites AEAD, échange éphémère obligatoire. SSL et TLS 1.0/1.1 sont dépréciés (RFC 8996).",
"REX fiches (D7) : désactiver les protocoles obsolètes contre les [[Downgrade Attacks]]."],
["Quel triptyque protège un domaine de messagerie contre l'usurpation ([[Email Spoofing]]) ?",
["[[SPF]], [[DKIM]] et [[DMARC]]","SMTP, POP3 et IMAP","S/MIME, PGP et TLS","DNSSEC, BGP et ARP"],
"SPF liste les serveurs autorisés ; DKIM signe cryptographiquement ; DMARC définit la politique (none/quarantine/reject) et le reporting.",
"S/MIME et PGP chiffrent/signent le contenu de bout en bout."],
["Quelle extension protège l'intégrité et l'authenticité des réponses DNS ?",
["[[DNSSEC]]","DNS over UDP","[[DoH]] uniquement","[[NAT]]"],
"DNSSEC signe les enregistrements (anti cache poisoning) mais ne chiffre pas. DoH/DoT chiffrent les requêtes (confidentialité).",
"DNSSEC = intégrité ; DoH/DoT = confidentialité."],
["Quelle architecture place les serveurs publics dans une zone tampon entre Internet et le LAN ?",
["Une [[DMZ]] ([[Screened Subnet]])","Un VLAN natif","Un réseau à plat","Un intranet"],
"La DMZ, souvent entre deux pare-feu, limite l'impact d'une compromission des serveurs exposés.",
"Bastion host = hôte durci exposé."],
["Quel type de pare-feu examine le contenu applicatif, l'identité de l'utilisateur et intègre l'IPS ?",
["Un pare-feu nouvelle génération ([[NGFW]])","Un filtre de paquets statique","Un pare-feu à états de base","Un routeur avec ACL"],
"Générations : filtrage de paquets (L3/L4), stateful, proxy applicatif (L7), NGFW (DPI, identité, IPS, contrôle applicatif).",
"Le WAF est spécialisé dans les applications web HTTP."],
["Quelle attaque Wi-Fi consiste à créer un faux point d'accès avec le même SSID ?",
["[[Evil Twin]]","[[Bluejacking]]","[[War Driving]]","[[Smurf]]"],
"L'evil twin capte les connexions des victimes (MITM). Contre-mesures : WPA3-Enterprise avec validation de certificat, WIDS.",
"Rogue AP = point d'accès non autorisé branché au LAN interne."],
["Quel standard Wi-Fi est l'état de l'art, apportant [[SAE]] en remplacement du PSK ?",
["[[WPA3]]","[[WEP]]","WPA (TKIP)","WPA2-PSK avec TKIP"],
"WPA3 : SAE (Dragonfly) contre les attaques par dictionnaire hors ligne, PMF obligatoire, mode Enterprise 192 bits.",
"Ne jamais choisir WEP (RC4 cassé)."],
["Quelle attaque utilise des requêtes ICMP vers une adresse de broadcast avec l'IP usurpée de la victime ?",
["[[Smurf Attack]]","[[Fraggle]]","[[Teardrop]]","[[Ping of Death]]"],
"Smurf = ICMP amplifié ; Fraggle = variante UDP ; Teardrop = fragments chevauchants ; Ping of Death = paquet ICMP surdimensionné.",
"Contre-mesure : désactiver les broadcasts dirigés sur les routeurs."],
["Quel protocole de routage inter-domaines est sensible au détournement de préfixes ([[BGP Hijacking]]) ?",
["[[BGP]]","OSPF","RIP","EIGRP"],
"BGP fait fonctionner Internet entre systèmes autonomes. RPKI et ROV (Route Origin Validation) réduisent le risque.",
"État de l'art : RPKI largement déployé chez les opérateurs."],
["Quel est le principal avantage de la micro-segmentation ?",
["Limiter les déplacements latéraux ([[Lateral Movement]]) d'un attaquant","Augmenter la bande passante","Supprimer le besoin d'authentification","Réduire le nombre d'adresses IP"],
"Chaque charge de travail a des règles d'accès dédiées : pilier du Zero Trust.",
"Complète la segmentation VLAN/DMZ."],
["Dans une architecture [[SDN]], quel plan prend les décisions de routage ?",
["Le plan de contrôle ([[Control Plane]])","Le plan de données ([[Data Plane]])","Le plan de gestion physique","Le plan utilisateur"],
"Le SDN sépare contrôle (contrôleur centralisé) et données (équipements qui transmettent). Le contrôleur devient une cible critique.",
"Zero Trust réutilise cette séparation (PDP/PEP)."],
["Ne jamais exposer RDP (3389) ou SSH (22) directement sur Internet. Quelle alternative ?",
["Passer par un VPN, un bastion ou un accès [[ZTNA]] avec MFA","Changer le port par défaut seulement","Utiliser un mot de passe complexe uniquement","Autoriser toutes les IP"],
"Les ports d'administration exposés sont une cible majeure (ransomware). Le changement de port relève de l'obscurité.",
"REX fiches : « L'exposition des ports d'administration »."],
["Faut-il faire confiance au FAI pour protéger la confidentialité du trafic inter-sites ?",
["Non, chiffrer soi-même le trafic (IPsec, TLS)","Oui, si le contrat le prévoit","Oui, les liaisons MPLS sont chiffrées par défaut","Oui, le trafic d'un FAI est privé"],
"MPLS isole logiquement mais ne chiffre pas. Le chiffrement de bout en bout reste à la charge de l'entreprise.",
"REX fiches : « Chiffrement de bout en bout avec les FAI »."],
["À quelle couche OSI opère principalement le protocole [[TCP]] ?",
["Couche 4 (Transport)","Couche 3","Couche 5","Couche 2"],
"TCP (fiable, orienté connexion, handshake SYN/SYN-ACK/ACK) et UDP (sans connexion) sont en couche 4. Unité : segment/datagramme.",
"Mnémo : All People Seem To Need Data Processing (7→1)."],
["Quelle unité de données correspond à la couche 2 ?",
["La trame ([[Frame]])","Le paquet","Le segment","Le bit"],
"Couche 1 = bit ; 2 = trame ; 3 = paquet ; 4 = segment (TCP) / datagramme (UDP) ; 5–7 = données.",
"Encapsulation : données → segment → paquet → trame → bits."],
["Quel protocole AAA chiffre l'intégralité du paquet et sépare authentification, autorisation et comptabilité ?",
["[[TACACS+]]","[[RADIUS]]","[[Diameter]]","[[LDAP]]"],
"TACACS+ (TCP 49) chiffre tout le corps et sépare les fonctions AAA (idéal pour l'administration d'équipements). RADIUS (UDP) ne chiffre que le mot de passe.",
"Diameter = successeur de RADIUS (TCP/SCTP, réseaux mobiles)."],
["Quel VPN est privilégié pour l'accès distant via un simple navigateur ?",
["Le VPN [[TLS]]/SSL","Le VPN IPsec site-à-site","PPTP","L2TP sans IPsec"],
"Le VPN TLS traverse facilement pare-feu et NAT (443). PPTP est obsolète ; L2TP n'a pas de chiffrement natif.",
"État de l'art : ZTNA remplace progressivement les VPN d'accès distant."],
["Quel type d'attaque consiste à forger des étiquettes 802.1Q pour accéder à un autre VLAN ?",
["Le [[VLAN Hopping]] ([[Double Tagging]] / switch spoofing)","Le MAC flooding","Le DNS poisoning","Le SYN flood"],
"Contre-mesures : désactiver DTP, ne pas utiliser le VLAN natif pour les utilisateurs, ports d'accès fixes.",
"Attaque de couche 2."],
["Quelle technologie protège la voix sur IP contre l'écoute ?",
["[[SRTP]] et [[SIP]] sur TLS","RTP en clair","H.323 sans chiffrement","FTP"],
"SIP gère la signalisation, RTP le média. Leurs versions sécurisées (SIPS/TLS, SRTP) protègent confidentialité et intégrité.",
"VLAN voix séparé = bonne pratique."],
["Quel outil réseau passif détecte les intrusions en analysant une copie du trafic ?",
["Un [[NIDS]] connecté à un port [[SPAN]] ou un [[TAP]]","Un IPS en ligne","Un pare-feu","Un routeur"],
"L'IDS est passif (alerte). L'IPS est en ligne ([[Inline]]) et peut bloquer, au risque de faux positifs impactant la disponibilité.",
"Signature vs anomalie (comportementale)."],
["Quelle couche OSI est associée au détournement de session ([[Session Hijacking]]) ?",
["Couche 5 (Session)","Couche 2","Couche 1","Couche 6"],
"La couche session établit, maintient et termine les dialogues (RPC, NetBIOS). Les cookies de session web relèvent pratiquement de la couche 7.",
"Contre-mesures : jetons aléatoires, TLS, expiration de session."],
["Quel protocole de supervision est seul acceptable car il supporte authentification et chiffrement ?",
["[[SNMPv3]]","SNMPv1","SNMPv2c","Syslog UDP"],
"SNMPv1/v2c utilisent des « community strings » en clair. SNMPv3 apporte USM (authentification, chiffrement).",
"Changer les communautés « public »/« private » par défaut."],
["Qu'est-ce qu'un [[CDN]] apporte du point de vue sécurité ?",
["Une absorption des attaques DDoS et une distribution proche des utilisateurs","Le chiffrement des disques","L'authentification forte des employés","La gestion des correctifs"],
"Les CDN répartissent la charge et protègent l'origine ; ils intègrent souvent WAF et anti-bot.",
"Disponibilité = pilier de la triade."],
["Dans un réseau de stockage, quelle technologie converge le Fibre Channel sur Ethernet ?",
["[[FCoE]]","[[iSCSI]]","[[NFS]]","[[SMB]]"],
"FCoE encapsule FC dans Ethernet (sans IP). iSCSI transporte SCSI sur IP (à protéger avec IPsec/CHAP et réseau dédié).",
"Protocoles convergés : FCoE, iSCSI, MPLS, VoIP."],
["Quel est le principal risque d'un réseau Wi-Fi invité mal isolé ?",
["L'accès des visiteurs aux ressources internes","Une baisse de performance uniquement","Une consommation électrique accrue","L'absence de DHCP"],
"Le réseau invité doit être isolé (VLAN dédié, pas de route vers le LAN, portail captif, isolation client).",
"Segmentation = défense en profondeur."],
["Quel protocole remplace NetBIOS/WINS et doit être protégé contre l'empoisonnement de réponses LLMNR ?",
["Le DNS interne, en désactivant [[LLMNR]] et [[NBT-NS]]","FTP","SMTP","ARP"],
"LLMNR/NBT-NS permettent la capture de hachages NTLM (outils de type Responder). Désactivation par GPO recommandée.",
"Durcissement réseau Windows classique en pentest."],
["Quel type de câble est immunisé contre les interférences électromagnétiques ?",
["La fibre optique","Le câble UTP Cat5e","Le câble coaxial fin","Le câble STP Cat6"],
"La fibre transmet de la lumière : pas d'EMI ni de rayonnement exploitable, et le piquage est difficile à réaliser sans être détecté.",
"Câbles plénum ([[Plenum]]) obligatoires dans les faux plafonds (fumées moins toxiques)."],
["Quel principe s'applique à l'externalisation de la gestion réseau à un [[MSP]] ?",
["L'entreprise reste responsable ; SLA, contrat et droit d'audit sont ses leviers","La responsabilité est transférée au MSP","Aucun contrôle n'est nécessaire","Le MSP devient propriétaire des données"],
"Accountability non transférable. Exiger rapports SOC 2, clauses de notification d'incident et accès MFA.",
"REX fiches : « Le piège de la responsabilité dans le Cloud »."],
["Quelle topologie offre la meilleure tolérance aux pannes au prix d'un coût élevé ?",
["Le maillage complet ([[Full Mesh]])","Le bus","L'anneau simple","L'étoile avec un seul switch"],
"Chaque nœud est relié à tous les autres : pas de SPOF, mais nombre de liens N(N−1)/2.",
"Étoile = SPOF au centre."],
["Quel protocole est utilisé pour la synchronisation horaire, essentielle aux journaux et à Kerberos ?",
["[[NTP]] (idéalement authentifié / [[NTS]])","SNMP","DHCP","ICMP"],
"Des horloges cohérentes sont indispensables à la corrélation SIEM, à la valeur probante des logs et à Kerberos (tolérance ~5 min).",
"État de l'art : NTS (Network Time Security)."],
["Quel modèle réseau en 4 couches est utilisé dans la pratique ?",
["Le modèle [[TCP/IP]] (Accès réseau, Internet, Transport, Application)","Le modèle OSI à 9 couches","Le modèle SNA","Le modèle Purdue"],
"TCP/IP regroupe les couches OSI 5-6-7 en Application et 1-2 en Accès réseau.",
"Purdue = segmentation des réseaux industriels (ICS)."]

en:[
["Which device separates broadcast domains?",
["Router","Switch","Hub","Repeater"],
"Routers operate at Layer 3 and do not forward broadcasts between networks. Switches separate collision domains (each port is its own collision domain) but forward broadcasts within a VLAN.",
"Exam tip: broadcast → router (or VLAN); collision → switch."],
["A network administrator still uses Telnet and FTP for device management. What is the BEST recommendation?",
["Replace them with SSH and SFTP","Move them to non-standard ports","Restrict them to business hours","Add longer passwords"],
"Telnet and FTP send credentials in cleartext. Secure equivalents encrypt management traffic. Changing ports is security through obscurity.",
"Exam tip: cleartext protocol in a scenario → replace with its secure equivalent."],
["Which technology authenticates a device before granting it access to a switch port?",
["IEEE 802.1X","IEEE 802.1Q","IEEE 802.3","IEEE 802.11ac"],
"802.1X provides port-based network access control using EAP between the supplicant, the authenticator (switch/AP) and the authentication server (usually RADIUS).",
"Exam tip: open wall jacks in public areas must be disabled or protected by 802.1X."],
["Which IPsec component provides confidentiality?",
["Encapsulating Security Payload (ESP)","Authentication Header (AH)","Internet Key Exchange (IKE)","Security Association database"],
"AH provides integrity, data origin authentication and anti-replay but no encryption. ESP provides encryption and optionally integrity. IKE negotiates security associations.",
"Exam tip: AH breaks with NAT because it authenticates the IP header."],
["An organization wants to stop attackers from sending spoofed emails using its domain. Which combination is MOST effective?",
["SPF, DKIM and DMARC","SMTP authentication only","POP3 over TLS","Anti-virus scanning on the mail server"],
"SPF publishes authorized senders, DKIM adds a domain signature, and DMARC tells receivers how to handle failures and provides reporting. Together they make domain spoofing detectable and blockable.",
"Exam tip: DMARC 'p=reject' is the strongest enforcement policy."],
["Which DNS security extension provides origin authentication and integrity but NOT confidentiality?",
["DNSSEC","DNS over HTTPS","DNS over TLS","Split-horizon DNS"],
"DNSSEC uses digital signatures to prevent cache poisoning. DoH and DoT encrypt queries for privacy but do not validate record authenticity by themselves.",
"Exam tip: DNSSEC = integrity; DoH/DoT = confidentiality."],
["Which firewall type tracks the state of connections to allow return traffic automatically?",
["Stateful inspection firewall","Static packet filter","Circuit-level proxy","Application-level gateway"],
"Stateful firewalls maintain a state table of active sessions, providing better protection than static packet filters. NGFWs add deep packet inspection, user identity and IPS features.",
"Exam tip: SYN flood (Layer 4) → stateful firewall / SYN cookies."],
["What is the PRIMARY purpose of a screened subnet (DMZ)?",
["To isolate publicly accessible services from the internal network","To provide wireless access to guests","To store backups","To accelerate internal traffic"],
"A DMZ hosts services exposed to the Internet (web, mail relays, reverse proxies). If compromised, the attacker still faces another firewall before reaching internal assets.",
"Exam tip: defense in depth through layered segmentation."],
["Which wireless security protocol replaces the pre-shared key handshake with Simultaneous Authentication of Equals (SAE)?",
["WPA3-Personal","WPA2-Personal","WEP","WPA-TKIP"],
"SAE resists offline dictionary attacks and provides forward secrecy. WPA3 also mandates Protected Management Frames.",
"Exam tip: WEP and TKIP are never correct 'best' answers."],
["An attacker sets up an access point with the same SSID as the corporate network. What is this called?",
["Evil twin","Rogue access point","Bluesnarfing","War chalking"],
"An evil twin impersonates a legitimate network to intercept traffic. A rogue AP is an unauthorized AP connected to the internal network. Mitigations include WIDS/WIPS and EAP-TLS with certificate validation.",
"Exam tip: evil twin = impersonation; rogue AP = unauthorized connection to LAN."],
["Which AAA protocol encrypts the entire payload and separates authentication, authorization and accounting?",
["TACACS+","RADIUS","Kerberos","LDAP"],
"TACACS+ uses TCP port 49 and encrypts the whole body, making it ideal for device administration. RADIUS uses UDP and encrypts only the password.",
"Exam tip: network device admin → TACACS+; network access (Wi-Fi, VPN) → RADIUS."],
["A company relies on its ISP's MPLS network for site-to-site connectivity. What should the security architect recommend?",
["Encrypt traffic end-to-end using IPsec or TLS","Trust MPLS because it is private","Use Telnet for router management across MPLS","Remove all firewalls between sites"],
"MPLS separates traffic logically but does not encrypt it. The organization remains responsible for protecting its data in transit over third-party infrastructure.",
"Exam tip: never rely on a provider for confidentiality you can enforce yourself."],
["Which attack exploits trunking negotiation or double 802.1Q tags to reach another VLAN?",
["VLAN hopping","MAC flooding","ARP poisoning","DNS amplification"],
"Mitigations include disabling DTP, setting access ports explicitly, and not using the native VLAN for user traffic.",
"Exam tip: VLAN attacks are Layer 2."],
["What is the BEST control to limit an attacker's lateral movement after compromising one workstation?",
["Micro-segmentation with least-privilege network policies","A stronger perimeter firewall","Increasing bandwidth","Using a single flat network"],
"Lateral movement exploits implicit trust inside the network. Micro-segmentation restricts each workload to required flows, a core Zero Trust practice.",
"Exam tip: Zero Trust assumes breach."],
["Which statement about TLS 1.3 is TRUE?",
["It requires ephemeral key exchange, providing perfect forward secrecy","It supports static RSA key exchange","It allows RC4 cipher suites","It is deprecated"],
"TLS 1.3 removed static RSA and weak ciphers, shortened the handshake, and only supports AEAD cipher suites. TLS 1.0 and 1.1 were formally deprecated by RFC 8996.",
"Exam tip: disable legacy protocols to prevent downgrade attacks."],
["Which tool is used to send a copy of switch traffic to an IDS sensor?",
["SPAN port or network TAP","Proxy server","Load balancer","DHCP relay"],
"An IDS is passive and needs a copy of the traffic. An IPS is placed inline and can block, but false positives can affect availability.",
"Exam tip: IDS detects; IPS prevents."],
["In a Software-Defined Network, which component is the MOST critical security target?",
["The centralized controller (control plane)","Each individual cable","The data plane switches' LEDs","The end-user browser"],
"Compromise of the SDN controller lets an attacker reprogram the entire network. It must be hardened, segmented and strongly authenticated.",
"Exam tip: separation of control and data planes is also a Zero Trust concept."],
["Which protocol version should be used to securely monitor network devices?",
["SNMPv3","SNMPv1","SNMPv2c","Telnet-based MIB polling"],
"SNMPv3 adds the User-based Security Model with authentication and encryption. Earlier versions use cleartext community strings.",
"Exam tip: change default 'public' and 'private' communities if legacy versions remain."],
["Which OSI layer does a web application firewall primarily operate at?",
["Layer 7 (Application)","Layer 3 (Network)","Layer 4 (Transport)","Layer 2 (Data Link)"],
"WAFs inspect HTTP/HTTPS requests to detect attacks such as SQL injection and XSS. Pair them with secure coding; a WAF is a compensating layer, not a fix for vulnerable code.",
"Exam tip: match the control to the attack's layer."],
["Remote employees currently access internal apps through a full-tunnel VPN that grants broad network access. What is the MOST modern improvement?",
["Adopt Zero Trust Network Access granting per-application access based on identity and device posture","Increase the VPN session timeout","Allow split tunneling with no controls","Expose internal apps directly to the Internet"],
"ZTNA brokers access to specific applications after continuous verification, eliminating broad network-level trust and reducing the attack surface.",
"Exam tip: per-application, least-privilege access beats network-level access."]
]};

DATA[5]={fr:[
["Un mot de passe et un code PIN constituent-ils une authentification multifacteur ([[MFA]]) ?",
["Non, ce sont deux éléments du même facteur « ce que l'on sait » ([[Something you know]])","Oui, ce sont deux secrets différents","Oui, si le PIN fait 6 chiffres","Oui, si les deux sont changés tous les 30 jours"],
"Le MFA exige au moins deux catégories différentes : connaissance (Type 1), possession (Type 2, [[Something you have]]), caractéristique (Type 3, [[Something you are]]).",
"REX fiches : « Définition stricte du MFA »."],
["Quel critère détermine le MEILLEUR système biométrique ?",
["Le taux d'erreur croisé ([[CER]] / [[EER]]) le plus bas","Le prix le plus bas","Le [[FRR]] le plus élevé","La rapidité d'enrôlement uniquement"],
"Le CER est le point où le FRR (Type I, faux rejet) égale le FAR (Type II, fausse acceptation). Plus il est bas, plus le système est précis.",
"REX fiches : ne regardez ni le prix ni la technologie, regardez le CER."],
["Une erreur de Type II en biométrie correspond à :",
["Une fausse acceptation ([[FAR]]) d'un imposteur","Un faux rejet d'un utilisateur légitime","Un enrôlement raté","Une panne du capteur"],
"Type I = FRR (insupportable pour l'utilisateur). Type II = FAR (dangereux pour la sécurité). Dans un environnement haute sécurité, on privilégie un FAR bas.",
"Mnémo : Type II = « Intrus Introduit »."],
["Quelles sont les deux faiblesses majeures de [[Kerberos]] ?",
["La synchronisation des horloges et le [[KDC]] comme point unique de défaillance ([[SPOF]])","L'absence de chiffrement et l'usage de mots de passe en clair","La dépendance à SAML et à OAuth","L'impossibilité d'utiliser des tickets"],
"Kerberos utilise des horodatages (tolérance ~5 min) contre le rejeu ; si le KDC tombe, personne ne s'authentifie. Il faut redonder le KDC.",
"REX fiches : « Le talon d'Achille de Kerberos »."],
["Dans Kerberos, quel ticket l'utilisateur obtient-il d'abord auprès de l'[[AS]] ?",
["Le [[TGT]] (Ticket Granting Ticket)","Le ticket de service ([[ST]])","Un certificat X.509","Un jeton SAML"],
"Flux : AS délivre le TGT → le TGS délivre un ticket de service → le client présente le ticket au serveur applicatif. Le mot de passe ne transite jamais.",
"Attaques associées : [[Golden Ticket]], [[Pass-the-Ticket]], [[Kerberoasting]]."],
["Quel est le risque principal du [[SSO]] et sa mitigation ?",
["Un identifiant compromis ouvre toutes les applications ; imposer le MFA","Aucun risque si les mots de passe sont longs","Le SSO empêche l'audit ; le désactiver","Le SSO augmente le nombre de mots de passe"],
"Le SSO offre « les clés du royaume ». Le MFA et la surveillance des sessions réduisent ce risque.",
"REX fiches : « Le point de défaillance unique (SPOF) du SSO »."],
["Un utilisateur autorise l'application A à lire ses contacts sur l'application B sans donner son mot de passe. Quel protocole ?",
["[[OAuth 2.0]] (délégation d'autorisation)","[[SAML]]","[[Kerberos]]","[[RADIUS]]"],
"OAuth délègue des droits via des jetons d'accès ([[Access Token]]). Ce n'est pas un protocole d'authentification.",
"REX fiches : « Délégation d'accès (OAuth) »."],
["Quel protocole ajoute une couche d'authentification à OAuth 2.0 avec un [[ID Token]] au format JWT ?",
["[[OpenID Connect]] (OIDC)","SAML 2.0","LDAP","TACACS+"],
"OIDC = authentification moderne (web, mobile). SAML = assertions XML, fédération d'entreprise et SSO web. OAuth = autorisation.",
"Trio de pièges des fiches : SAML vs OAuth vs OIDC."],
["Dans [[SAML]], quelle entité authentifie l'utilisateur et émet l'assertion ?",
["Le fournisseur d'identité ([[IdP]])","Le fournisseur de service ([[SP]])","Le navigateur","L'annuaire LDAP du SP"],
"L'IdP authentifie et émet une assertion XML signée ; le SP (application) la consomme et accorde l'accès.",
"Fédération : le SP fait confiance à l'IdP du partenaire."],
["Lors d'une fédération d'identités avec un partenaire, comment formaliser la confiance ?",
["Par des contrats et accords (SLA, accords B2B) et des audits","Par un simple échange de certificats","Par la confiance mutuelle verbale","Par l'ouverture des pare-feu"],
"La confiance technique (certificats, métadonnées) doit être adossée à une confiance juridique et à des exigences de conformité.",
"REX fiches : « Fédération et Confiance (Trust) »."],
["Quel modèle de contrôle d'accès est le plus adapté à une entreprise en forte croissance ?",
["[[RBAC]] (Role-Based Access Control)","[[DAC]]","[[MAC]]","Les ACL individuelles"],
"Le RBAC gère les accès en masse via les profils de poste, simplifiant onboarding et offboarding. DAC devient ingérable, MAC est trop rigide pour le privé.",
"REX fiches : « La gestion à grande échelle »."],
["Dans quel modèle le propriétaire d'un fichier décide-t-il librement qui peut y accéder ?",
["[[DAC]] (Discretionary Access Control)","[[MAC]]","[[RBAC]]","[[ABAC]]"],
"DAC (ACL NTFS, permissions Unix) délègue la sécurité aux utilisateurs, ce que le CISSP juge risqué.",
"REX fiches : « Le piège du DAC »."],
["Quel modèle repose sur des étiquettes de sécurité imposées par le système et l'habilitation des sujets ?",
["[[MAC]] (Mandatory Access Control)","[[DAC]]","[[RBAC]]","[[Rule-based]]"],
"MAC : le système compare l'étiquette de l'objet à l'habilitation et au besoin d'en connaître du sujet. Usage militaire/gouvernemental (SELinux).",
"BONUS 7 : 3 MAC différents (Mandatory, Media, Message Authentication Code)."],
["Un système exige soudainement un MFA quand un utilisateur se connecte depuis un pays inhabituel. C'est :",
["Un contrôle d'accès adaptatif / basé sur le risque ([[Risk-Based Access Control]])","Un DAC","Un MAC","Une liste noire statique"],
"Le contexte (géolocalisation, appareil, heure, comportement) ajuste dynamiquement l'exigence d'authentification : principe Zero Trust.",
"REX fiches : « L'accès Adaptatif (Zero Trust) »."],
["Quel modèle prend des décisions en fonction d'attributs du sujet, de l'objet, de l'action et de l'environnement ?",
["[[ABAC]] (Attribute-Based Access Control)","[[RBAC]]","[[DAC]]","[[MAC]]"],
"ABAC (souvent via XACML) permet des politiques fines : « un médecin du service X peut lire les dossiers de ses patients pendant ses heures de garde ».",
"Plus flexible que RBAC, plus complexe à gouverner."],
["Quel est le processus complet d'accès dans l'ordre ?",
["Identification → Authentification → Autorisation → Traçabilité ([[IAAA]])","Autorisation → Identification → Authentification","Authentification → Identification → Audit","Traçabilité → Autorisation → Identification"],
"Identification = déclarer son identité ; Authentification = la prouver ; Autorisation = droits ; Accountability = audit/traçabilité.",
"Ajoutez parfois l'Audit en fin de chaîne."],
["Quelle est l'action la plus urgente lors du départ d'un employé ?",
["La révocation immédiate des accès logiques et physiques ([[Deprovisioning]])","La mise à jour de l'organigramme","L'archivage des emails après 6 mois","L'envoi d'un message de remerciement"],
"Le déprovisionnement automatisé via IAM réduit le risque de comptes orphelins.",
"REX fiches : « La gestion du départ d'un employé »."],
["Un employé change de service et conserve ses anciens droits. Comment s'appelle ce phénomène ?",
["L'accumulation de privilèges ([[Privilege Creep]] / [[Authorization Creep]])","L'élévation de privilèges par exploit","Le Pass-the-Hash","Le phishing"],
"Les transferts sont un piège classique. Il faut retirer les anciens droits et effectuer des revues d'accès ([[Access Review]] / [[Recertification]]).",
"REX fiches : « Onboarding vs Transfers »."],
["Quelle est la meilleure pratique pour les comptes à hauts privilèges ?",
["Un outil [[PAM]] avec accès [[Just-in-Time]] (JIT), coffre de mots de passe et enregistrement de session","Un compte admin permanent par administrateur","Un compte admin partagé pour toute l'équipe","Des mots de passe admin notés dans un fichier"],
"Le JIT accorde l'élévation pour une durée limitée et approuvée ; le PAM journalise et fait tourner les secrets.",
"REX fiches : « La gestion des comptes à hauts privilèges »."],
["Quelle politique de mots de passe est l'état de l'art (NIST SP 800-63B) ?",
["Longueur suffisante, vérification contre les mots de passe compromis, pas de rotation arbitraire, MFA / [[Passwordless]]","Rotation obligatoire tous les 30 jours","Complexité forcée avec 4 types de caractères et rotation mensuelle","Questions secrètes obligatoires"],
"La rotation forcée pousse à « Motdepasse1, Motdepasse2 ». On change le mot de passe en cas de compromission. Gestionnaires de mots de passe et [[Passkeys]] ([[FIDO2]]) sont privilégiés.",
"REX fiches : « Le changement de paradigme des mots de passe »."],
["Quelle méthode d'authentification résiste le mieux au phishing ?",
["[[FIDO2]]/[[WebAuthn]] ([[Passkeys]], clés de sécurité)","Code OTP par SMS","Questions secrètes","Mot de passe long"],
"FIDO2 lie cryptographiquement l'authentification à l'origine du site : un faux site ne peut pas réutiliser la réponse. Le SMS est vulnérable au [[SIM Swapping]].",
"État de l'art 2026 : MFA « phishing-resistant » exigé par de nombreux référentiels (CISA, NIST)."],
["Quel type de jeton génère un code basé sur le temps ?",
["[[TOTP]] (synchrone)","[[HOTP]] (asynchrone, compteur)","Carte à puce passive","Mot de passe statique"],
"TOTP (RFC 6238) varie toutes les 30 s ; HOTP (RFC 4226) avance avec un compteur d'événements.",
"Les deux relèvent du facteur possession."],
["Qu'est-ce que le [[Provisioning]] d'identité ?",
["La création, la modification et la suppression des comptes et droits au cours du cycle de vie","La seule création du compte","La vérification des journaux","La mise à jour du BIOS"],
"Cycle de vie IAM : enregistrement/preuve d'identité → provisionnement → revue → modification → révocation.",
"Automatiser via IGA et RBAC pour éviter les erreurs humaines."],
["Quelle vérification d'identité est requise AVANT de créer une identité numérique ?",
["La preuve d'identité ([[Identity Proofing]])","L'autorisation","La journalisation","Le [[Single Sign-On]]"],
"NIST SP 800-63A définit des niveaux d'assurance d'identité ([[IAL]]). Exemple : vérification de pièce d'identité lors de l'embauche.",
"IAL (preuve), AAL (authentification), FAL (fédération)."],
["Le principe de la sécurité physique en contrôle d'accès est :",
["La sécurité logique ne sert à rien sans sécurité physique","La sécurité physique est facultative si le chiffrement est fort","Seules les caméras comptent","Le contrôle physique relève uniquement des RH"],
"Un attaquant ayant accès au serveur peut voler les disques ou démarrer sur un autre support.",
"REX fiches : « La primauté du physique sur le logique »."],
["Un employé perd son badge. Première action ?",
["Désactiver immédiatement l'ancien badge dans le système","Lui en fournir un nouveau","Chercher le badge dans les locaux","Attendre 48 h"],
"La révocation prime sur la réémission.",
"REX fiches (D7) : « La gestion d'un badge perdu »."],
["Qu'est-ce que l'attaque [[Pass-the-Hash]] ?",
["La réutilisation d'un hachage NTLM capturé pour s'authentifier sans connaître le mot de passe","Le cassage d'un hachage par force brute","L'injection SQL dans un formulaire de connexion","Le vol d'un badge physique"],
"Mitigations : Credential Guard, LAPS, moindre privilège, tiering AD, désactivation de NTLM si possible.",
"Kerberos est aussi exposé (Pass-the-Ticket)."],
["Quelle technologie fédère des identités entre une entreprise et des applications SaaS via des assertions XML ?",
["[[SAML 2.0]]","[[OAuth 1.0]]","[[CHAP]]","[[NTLM]]"],
"SAML est le standard historique de SSO web d'entreprise ; OIDC le remplace progressivement pour les applications modernes.",
"[[SCIM]] automatise le provisionnement des comptes SaaS."],
["Quel protocole automatise le provisionnement des comptes entre un IdP et des applications SaaS ?",
["[[SCIM]]","[[SAML]]","[[LDAP]] anonyme","[[SNMP]]"],
"SCIM (System for Cross-domain Identity Management) crée, met à jour et supprime les comptes de façon standardisée.",
"Complète le SSO : SAML/OIDC authentifie, SCIM provisionne."],
["Quel principe empêche qu'un même utilisateur crée et approuve un paiement ?",
["La séparation des tâches ([[Separation of Duties]] / SoD)","Le moindre privilège","Le besoin d'en connaître","Le SSO"],
"La SoD répartit les étapes critiques entre plusieurs personnes. Une matrice SoD détecte les combinaisons toxiques de rôles.",
"Petite entreprise : contrôles compensatoires (logs + revue par un tiers)."],
["Que signifie le principe du moindre privilège ([[Least Privilege]]) ?",
["Accorder uniquement les droits minimaux nécessaires à la tâche, pour la durée nécessaire","Accorder les droits admin par défaut","Accorder tous les droits puis réduire","Accorder les droits selon l'ancienneté"],
"Il limite l'impact d'une compromission ou d'une erreur. Le JIT ajoute la dimension temporelle.",
"Least privilege = droits ; Need to know = information."],
["Quel modèle de contrôle d'accès utilise des règles globales appliquées à tous (ex. pare-feu, horaires) ?",
["[[Rule-Based Access Control]]","[[Role-Based Access Control]]","[[DAC]]","[[Lattice]]"],
"Rule-based : des règles s'appliquent uniformément (ACL de pare-feu, restrictions horaires), indépendamment de l'identité.",
"Attention à l'acronyme RBAC ambigu (Role vs Rule)."],
["Quelle attaque consiste à tester un même mot de passe courant sur de nombreux comptes ?",
["Le [[Password Spraying]]","Le [[Credential Stuffing]]","La force brute ciblée","Le [[Rainbow Table]]"],
"Spraying = 1 mot de passe × N comptes (évite le verrouillage). Credential stuffing = réutilisation de couples identifiant/mot de passe volés ailleurs.",
"Contre-mesure commune : MFA + détection d'anomalies."],
["Quelle méthode d'authentification par mot de passe envoie un défi plutôt que le mot de passe ?",
["[[CHAP]]","[[PAP]]","Telnet","HTTP Basic"],
"CHAP utilise un challenge/réponse hachée et peut se ré-authentifier périodiquement. PAP envoie le mot de passe en clair.",
"PAP est à proscrire."],
["Quel annuaire est souvent interrogé par les applications et doit utiliser [[LDAPS]] ?",
["[[LDAP]] (Active Directory, OpenLDAP)","DNS","SMTP","DHCP"],
"LDAP en clair (389) expose les identifiants ; LDAPS (636) ou StartTLS les chiffre.",
"Interdire les liaisons anonymes (anonymous bind)."],
["Quelle est la meilleure approche pour gérer les identités des clients (B2C) à grande échelle ?",
["Une plateforme [[CIAM]] avec authentification sociale/passkeys, consentement et protection anti-bot","Un annuaire AD interne partagé avec les employés","Des comptes locaux par application","Des mots de passe envoyés par email"],
"Le CIAM gère l'inscription, le consentement RGPD, le MFA adaptatif et la fédération avec les réseaux sociaux.",
"Séparer identités internes (workforce) et clients."],
["Qu'est-ce qu'un [[Service Account]] et comment le sécuriser ?",
["Un compte non humain utilisé par des applications ; le gérer via PAM/coffre, sans connexion interactive, avec rotation","Un compte invité","Un compte d'administrateur de domaine personnel","Un compte de messagerie partagé"],
"Les identités machines dépassent largement les identités humaines : secrets en coffre ([[Vault]]), identités gérées cloud, moindre privilège.",
"État de l'art : gouvernance des identités non humaines (NHI)."],
["Quel est l'objectif d'une revue d'accès périodique ?",
["Vérifier que les droits sont toujours justifiés et retirer les droits excessifs","Augmenter les privilèges","Changer tous les mots de passe","Supprimer tous les comptes"],
"Les managers/propriétaires certifient les accès de leurs équipes ; les écarts sont corrigés et tracés (preuve d'audit).",
"Contrôle détectif et correctif contre le privilege creep."],
["Quel facteur relève de « quelque chose que vous faites » ([[Something you do]]) ?",
["La dynamique de frappe ou la signature manuscrite (biométrie comportementale)","Une empreinte digitale","Un badge","Un code PIN"],
"La biométrie comportementale (frappe, démarche, voix) se distingue de la biométrie physiologique (empreinte, iris).",
"Le lieu ([[Somewhere you are]]) est souvent un facteur contextuel."],
["Quelle notion désigne la capacité de relier de manière univoque une action à un individu ?",
["La traçabilité / responsabilité ([[Accountability]])","La disponibilité","La confidentialité","L'agrégation"],
"Elle exige une identification unique (pas de comptes partagés), une authentification forte et des journaux protégés.",
"Comptes partagés = accountability impossible."]
],
en:[
["Which combination represents true multifactor authentication?",
["A password and a hardware token","A password and a PIN","A fingerprint and a palm scan","Two different passwords"],
"MFA requires factors from different categories: something you know, have, or are. A password and PIN are both knowledge; fingerprint and palm are both inherence.",
"Exam tip: count categories, not items."],
["When selecting a biometric system, which metric indicates the BEST overall accuracy?",
["The lowest crossover error rate (CER)","The lowest false rejection rate alone","The highest false acceptance rate","The fastest enrollment time"],
"The CER (or EER) is where FAR and FRR are equal. A lower CER means better balance between rejecting impostors and accepting legitimate users.",
"Exam tip: Type I = false rejection; Type II = false acceptance."],
["Users suddenly cannot authenticate to any resource in a Kerberos realm, though the network is up. What is the MOST likely cause?",
["The KDC is unavailable or clocks are out of synchronization","The users' passwords expired simultaneously","The SAML assertion was not signed","The firewall blocks port 443"],
"Kerberos depends on the KDC (single point of failure unless redundant) and on time synchronization (typically within 5 minutes) because tickets contain timestamps to prevent replay.",
"Exam tip: Kerberos weaknesses = KDC SPOF and time sync."],
["A user grants a photo printing website permission to access their cloud photo album without sharing their password. Which technology is being used?",
["OAuth 2.0","SAML 2.0","Kerberos","LDAP"],
"OAuth 2.0 is an authorization delegation framework issuing scoped access tokens. It does not by itself authenticate the user to the client; OpenID Connect adds that.",
"Exam tip: SAML = enterprise SSO with XML assertions; OAuth = delegated authorization; OIDC = authentication on top of OAuth."],
["In a SAML transaction, which party issues the assertion?",
["Identity provider","Service provider","User agent","Relying application's database"],
"The IdP authenticates the user and issues a signed XML assertion. The SP (relying party) validates the signature and grants access.",
"Exam tip: federation trust must be backed by contracts and agreements."],
["A rapidly growing company finds that managing permissions per user has become unmanageable. Which access control model should be adopted?",
["Role-based access control","Discretionary access control","Mandatory access control","Access control lists per user"],
"RBAC assigns permissions to roles aligned with job functions, simplifying onboarding, transfers and offboarding. MAC is too rigid for most commercial environments.",
"Exam tip: RBAC is the default managerial answer for enterprises."],
["Which access control model allows resource owners to grant permissions at their own discretion?",
["Discretionary access control","Mandatory access control","Role-based access control","Rule-based access control"],
"DAC delegates access decisions to owners, which is flexible but risky because owners are not security experts and permissions can propagate uncontrollably.",
"Exam tip: DAC is considered the least secure model."],
["An employee moved from finance to marketing and still has access to finance systems. What control failed?",
["Access review and deprovisioning during transfers","Background check","Mandatory vacation","Data classification"],

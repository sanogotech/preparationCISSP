Q[1] = [
["Risk ownership", "A critical legacy application cannot be patched for six months because the vendor no longer supports the current version. The CISO has documented compensating controls. The business unit wants to keep the application running.", ["Present the residual risk to senior management for formal acceptance", "Have the CISO sign the risk acceptance, since the CISO owns security", "Shut down the application immediately until a patch is available", "Document the exception in the vulnerability scanner and close the finding"], "Residual risk must be accepted by someone with the authority to do so: senior management or the designated risk owner. The CISO advises but does not accept risk on behalf of the business.", "Le risque résiduel doit être accepté par la direction ou le propriétaire du risque habilité. Le RSSI conseille mais n'accepte pas le risque à la place du métier.", "Piège : « le RSSI signe » semble responsable, mais c'est confondre conseil et décision (*accountability*)."],
["Fraud detection", "An internal audit shows that a payments clerk with 15 years of service has never taken more than two consecutive days off. She handles vendor reconciliations alone. Management wants a control that would reveal any ongoing irregularities.", ["Enforce mandatory vacations with another employee performing her duties", "Run a new background check on the clerk", "Implement separation of duties for future vendor creation", "Require the clerk to sign an updated code of conduct"], "Mandatory vacations are a detective control: while she is away, a colleague performs the work and anomalies surface. Separation of duties prevents future fraud but does not reveal what is already happening.", "Les congés obligatoires sont un contrôle de détection : le remplaçant découvre les anomalies. La séparation des tâches prévient la fraude future mais ne révèle pas une fraude en cours.", "REX : de nombreuses fraudes bancaires (dont l'affaire Kerviel) ont été découvertes ou facilitées par l'absence de congés."],
["Risk calculation", "A data center valued at $4,000,000 is located in a flood zone. Engineers estimate a flood would damage 30% of the facility and expect one flood every 20 years. A flood barrier would cost $70,000 per year and reduce the exposure factor to 5%.", ["The barrier is not cost-justified because its annual cost exceeds the annual loss it prevents", "The barrier is cost-justified because the SLE is $1,200,000", "The barrier is cost-justified because the ALE is $60,000", "The barrier should be purchased because risk must always be reduced"], "SLE = 4,000,000 × 0.30 = 1,200,000; ARO = 0.05; ALE = 60,000. After the barrier: SLE = 200,000; ALE = 10,000. Value = 60,000 − 10,000 − 70,000 = −20,000, so it is not cost-justified.", "ALE avant = 60 000 $, après = 10 000 $. Valeur du contrôle = 60 000 − 10 000 − 70 000 = −20 000 $ : le contrôle n'est pas rentable.", "Nuance : si la sécurité des personnes était en jeu, le calcul financier ne serait plus le seul critère."],
["Risk response", "A bank purchases a cyber insurance policy covering ransomware losses up to $10 million. The board believes ransomware is now 'handled' and proposes cutting the backup budget.", ["Explain that insurance transfers only financial impact; operational, legal and reputational consequences remain", "Agree, since the risk has been transferred to the insurer", "Agree, but only if the policy also covers regulatory fines", "Recommend cancelling the insurance, as it encourages risky behavior"], "Risk transference shifts part of the financial impact. Accountability, regulatory obligations, downtime and reputational damage remain with the bank, and insurers usually require controls such as backups and MFA.", "L'assurance transfère l'impact financier seulement. La responsabilité, les obligations réglementaires, l'arrêt d'activité et l'image restent à la banque ; les assureurs exigent d'ailleurs des sauvegardes et le MFA.", "Piège : « transférer le risque » ne veut jamais dire « transférer la responsabilité »."],
["BCP", "The board of a mobile-money operator asks the security manager to build a business continuity plan after a competitor suffered a week-long outage. The security manager has budget approval pending.", ["Obtain senior management commitment and define the plan's scope", "Conduct a business impact analysis to determine RTOs", "Select and contract a hot site", "Run a tabletop exercise with the operations team"], "The first step of BCP is securing senior management support (authority, budget) and defining the scope. The BIA comes next and drives recovery strategies such as the choice of site.", "La première étape d'un PCA est d'obtenir l'engagement de la direction et de définir le périmètre. La BIA vient ensuite et oriente les stratégies (choix du site).", "Les trois autres réponses sont de bonnes étapes, mais pas la PREMIÈRE."],
["Ethics", "While testing a hospital's infusion-pump network under contract, a CISSP finds a flaw that could let an attacker change medication doses. The hospital asks the consultant to keep the issue confidential and not inform the manufacturer.", ["Escalate through appropriate legal channels so that patient safety is protected, following the ISC2 canons", "Respect the client's request, since the consultant must serve the principal", "Publish the vulnerability on social media to force a fix", "Fix the pumps directly to avoid any harm"], "Canon 1 (protect society, the common good and the infrastructure) takes precedence over canon 3 (serve principals). Escalation must be legal and responsible, not public shaming or unauthorized changes.", "Le canon 1 (protéger la société) prime sur le canon 3 (servir le client). L'escalade doit être légale et responsable : pas de publication sauvage ni de modification non autorisée.", "Nuance : divulguer publiquement sans discernement violerait le canon 2 (agir honorablement et légalement)."],
["Personnel security", "A senior network administrator will be dismissed for misconduct on Friday at 3 p.m. He has VPN access, domain admin rights and knowledge of several shared service passwords.", ["Disable his accounts at the time of notification and rotate the shared credentials he knew", "Disable his accounts at the end of his notice period", "Ask him to hand over his passwords during the exit interview", "Monitor his activity for a week, then disable access"], "Access must be revoked at notification (or just before) for a hostile termination, and shared secrets he knew must be changed. Coordination between HR, management and IT is essential.", "Les accès doivent être coupés au moment de la notification (ou juste avant) lors d'un départ conflictuel, et les secrets partagés qu'il connaissait doivent être changés.", "Piège : les secrets partagés et les comptes de service sont souvent oubliés. C'est l'intérêt d'un PAM."],
["Policy framework", "A new document states: 'All laptops must use full-disk encryption with AES-256 and keys escrowed in the corporate key management service.' Another states: 'Users are encouraged to lock their screen when leaving their desk.'", ["The first is a standard; the second is a guideline", "The first is a policy; the second is a procedure", "Both are policies because they were approved by management", "The first is a baseline; the second is a standard"], "A standard specifies mandatory technologies or methods (AES-256, FDE). 'Encouraged' indicates a non-mandatory guideline.", "Une norme impose une technologie précise (AES-256, chiffrement intégral). « Encouragé » indique un guide, non obligatoire.", "Astuce : repérez les verbes. « must » = obligatoire, « should / encouraged » = recommandation."],
["Due care", "After a breach, a regulator finds that the company had identified the lack of MFA on remote access in a risk assessment two years earlier but never implemented it.", ["The company performed due diligence but failed to exercise due care", "The company failed due diligence but exercised due care", "The company exercised both due diligence and due care", "The company is not liable because the risk was documented"], "The risk assessment shows due diligence (knowing). Not acting on it is a failure of due care (doing what a prudent person would do), which can be considered negligence.", "L'analyse de risque montre la diligence (savoir). Ne pas agir est un manque de soin (*due care*), qui peut être qualifié de négligence.", "REX : Change Healthcare (2024), un portail d'accès à distance sans MFA a mené à une paralysie nationale."],
["Supply chain", "A microfinance institution plans to outsource its core banking system to a cloud provider in another country. The CIO wants to sign quickly to meet a deadline.", ["Perform due diligence on the provider, including independent assurance reports and contractual security clauses", "Sign the contract, since the provider becomes responsible for security", "Require the provider to sign an NDA, which covers all security risks", "Ask the provider for a list of its certifications on its website"], "Third-party risk management requires due diligence (SOC 2 Type II, ISO 27001, data location, right to audit, breach notification, exit clauses). Accountability stays with the institution.", "La gestion du risque fournisseur exige une *due diligence* : SOC 2 Type II, ISO 27001, localisation des données, droit d'audit, notification, réversibilité. La responsabilité reste à l'institution.", "REX 2026 : plusieurs banques ont été compromises via un même fournisseur partagé."],
["Threat modeling", "A development team is designing a patient portal. Before coding starts, the security architect wants to systematically identify threats such as identity spoofing, data tampering and privilege escalation.", ["Perform threat modeling using STRIDE during the design phase", "Schedule a penetration test after deployment", "Run a vulnerability scan on the development servers", "Calculate the ALE for each possible threat"], "STRIDE (Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege) is applied at design time to identify threats early.", "STRIDE s'applique dès la conception pour identifier les menaces tôt (usurpation, altération, répudiation, divulgation, déni de service, élévation de privilèges).", "Le pentest reste utile, mais trop tard pour une identification systématique des menaces."],
["Awareness", "Phishing simulations show a 28% click rate. The CEO suggests publicly naming employees who click, while the HR director proposes a single mandatory e-learning module.", ["Implement an ongoing, role-based awareness program with measured results and supporting technical controls", "Publicly name employees who click to create a deterrent effect", "Deploy the single e-learning module and close the issue", "Stop phishing simulations because they upset employees"], "Effective awareness is continuous, role-based and measured (click and report rates), and backed by technical controls such as phishing-resistant MFA and filtering. Shaming harms reporting culture.", "Une sensibilisation efficace est continue, adaptée aux rôles et mesurée (taux de clic et de signalement), avec des contrôles techniques (MFA anti-phishing, filtrage). Humilier nuit à la culture du signalement.", "Nuance : le taux de signalement est un meilleur indicateur que le seul taux de clic."],
["Compensating control", "A rural branch of a cooperative bank has only two staff members, so separation of duties for cash handling is impossible.", ["Implement compensating controls such as daily independent reconciliation by headquarters and video monitoring", "Accept the risk without additional controls", "Hire a third employee regardless of cost", "Rotate the two employees' duties every day"], "When a primary control is impractical, a compensating control should provide equivalent protection: independent review, monitoring and thresholds.", "Quand un contrôle principal est impossible, un contrôle compensatoire doit offrir une protection équivalente : revue indépendante, surveillance, seuils.", "Piège : « embaucher » peut être disproportionné ; l'examen privilégie la solution efficace et proportionnée."],
["Privacy law", "A company operating in the EU discovers that a database containing customer personal data was exposed for three days. The legal team wants to wait until the forensic report is final, in about three weeks.", ["Notify the supervisory authority within 72 hours of becoming aware, providing information in phases if needed", "Wait for the final forensic report to avoid incorrect notifications", "Notify only the affected customers, not the authority", "Notify only if the data was proven to be exfiltrated"], "Under the GDPR, a breach likely to result in a risk to individuals must be notified to the supervisory authority within 72 hours; information can be provided in phases.", "Le RGPD impose de notifier l'autorité sous 72 heures en cas de violation présentant un risque ; les informations peuvent être transmises par étapes.", "Nuance NIS2 : alerte précoce sous 24 h, notification sous 72 h, rapport final sous 1 mois."],
["Governance frameworks", "The board asks which framework function was added in NIST CSF 2.0 to emphasize leadership oversight, roles, policy and supply-chain risk management.", ["Govern", "Identify", "Protect", "Recover"], "NIST CSF 2.0 (2024) added the Govern function, placing governance at the center of Identify, Protect, Detect, Respond and Recover.", "Le NIST CSF 2.0 (2024) a ajouté la fonction Govern, au centre des cinq autres fonctions.", "État de l'art : le CSF 2.0 vise désormais toutes les organisations, pas seulement les infrastructures critiques."],
];

Q[2] = [
["Classification roles", "The IT manager of an insurance company has started labeling HR spreadsheets as 'Confidential' in the document management system. The HR director was not consulted.", ["The HR director, as data owner, should determine the classification", "The IT manager, as custodian, is best placed to classify data", "The CISO should classify all data centrally", "The DPO should classify all personal data"], "The data owner (a business manager) decides classification and access. The custodian implements protection; the CISO and DPO advise.", "Le propriétaire des données (manager métier) décide de la classification et des accès ; le dépositaire met en œuvre ; le RSSI et le DPO conseillent.", "Piège : le RSSI ou le DPO semblent légitimes, mais ils conseillent, ils ne possèdent pas la donnée."],
["Sanitization SSD", "A hospital will sell 300 laptops with SSDs that stored patient records to a refurbisher.", ["Use cryptographic or manufacturer secure erase (purge) and obtain a certificate of sanitization", "Degauss the SSDs before sale", "Perform a full format and reinstall the operating system", "Overwrite each drive three times with random data"], "Media leaving the organization requires at least purge. For SSDs, crypto erase or secure erase are appropriate; degaussing has no effect and overwriting is unreliable because of wear leveling.", "Un support qui quitte l'organisation exige au minimum le niveau Purge. Pour un SSD : *crypto erase* ou *secure erase*. Le dégaussage est sans effet, et l'écrasement est peu fiable (*wear leveling*).", "Nuance : pour des données très sensibles, la destruction physique reste l'option la plus sûre."],
["Cloud exit", "A company is terminating its IaaS contract. Its data was encrypted using keys stored in the company's own HSM. It has no access to the provider's physical disks.", ["Destroy the encryption keys (crypto-shredding)", "Request a degaussing certificate from the provider", "Delete all virtual machines and storage volumes", "Overwrite all volumes with zeros before deleting them"], "Crypto-shredding renders data unreadable without physical access to media. It requires encryption with customer-controlled keys from the start.", "Le crypto-shredding rend les données illisibles sans accès physique aux disques ; il suppose un chiffrement avec des clés maîtrisées dès le départ.", "Les options C et D laissent de la rémanence dans les infrastructures mutualisées."],
["Data states", "A research hospital wants to run analytics on patient data in a public cloud while preventing even the cloud provider's administrators from viewing data during processing.", ["Use confidential computing with hardware-based trusted execution environments", "Encrypt the data at rest with AES-256", "Use TLS 1.3 for all connections", "Pseudonymize the data before upload"], "Data in use is the hardest state to protect. Confidential computing (TEEs or enclaves) protects data while it is processed. The other options protect data at rest, in transit or reduce identifiability, but not processing.", "La donnée en cours d'utilisation est la plus difficile à protéger ; le *confidential computing* (enclaves) la protège pendant le traitement.", "Les trois distracteurs sont de bonnes pratiques, mais pour d'autres états de la donnée."],
["Legal hold", "A customer has sued the company. According to the retention schedule, emails related to the customer are due for automatic deletion next week.", ["Place the relevant data under legal hold and suspend deletion", "Follow the retention schedule, since policy must be applied consistently", "Archive the emails offline and delete the originals", "Anonymize the emails before deletion"], "Litigation requires preserving relevant evidence. A legal hold suspends the retention schedule for that data; deleting it could constitute spoliation.", "Un litige impose de préserver les preuves : le gel juridique suspend la destruction. Supprimer pourrait constituer une destruction de preuves.", "Nuance : le legal hold ne vise que les données pertinentes, pas toute l'entreprise."],
["Retention", "Marketing keeps prospect files dating back 15 years 'in case they become useful'. The DPO is concerned.", ["Apply the retention policy and data minimization, deleting data no longer needed", "Encrypt the old files and keep them", "Move the files to cheaper archival storage", "Ask prospects for consent to keep their data indefinitely"], "Data minimization and retention limits reduce breach exposure and legal risk. Encryption or archiving does not fix unnecessary retention.", "La minimisation et la limitation de conservation réduisent l'exposition et le risque juridique ; chiffrer ou archiver ne corrige pas une conservation inutile.", "REX : de nombreuses fuites portent sur des données d'anciens clients conservées sans nécessité."],
["Pseudonymization", "A bank's data science team replaces customer names with random IDs and stores the mapping table in a separate, restricted database before analyzing transaction patterns.", ["The data remains personal data under the GDPR because it can be re-identified", "The data is anonymous and outside the scope of the GDPR", "The data is tokenized and therefore only subject to PCI DSS", "The data is no longer sensitive because names are removed"], "Pseudonymization is reversible with additional information, so the data remains personal data. Only true anonymization removes it from GDPR scope.", "La pseudonymisation est réversible : la donnée reste personnelle. Seule une véritable anonymisation sort du champ du RGPD.", "Piège : la tokenisation est proche techniquement, mais la question porte sur le statut juridique."],
["Controller / processor", "A company outsources payroll to a specialized provider, which suffers a breach exposing employee salaries.", ["The company, as data controller, remains accountable to the regulator and its employees", "Only the payroll provider is accountable, as it caused the breach", "Accountability is shared equally by contract", "Nobody is accountable if the provider had ISO 27001 certification"], "The controller determines purposes and means and remains accountable. The processor has its own obligations, but outsourcing does not remove the controller's accountability.", "Le responsable de traitement détermine les finalités et moyens ; il reste responsable. Le sous-traitant a ses propres obligations.", "Mindset : on externalise la tâche, jamais la responsabilité."],
["Scoping & tailoring", "A security team adopts the NIST SP 800-53 moderate baseline for an industrial control system. Several wireless controls do not apply because the system has no wireless capability, and password length must be adjusted for the operator consoles.", ["Remove non-applicable controls through scoping, then adjust parameters through tailoring", "Apply all controls exactly as written", "Create a completely new set of controls", "Tailor by removing controls and scope by changing parameters"], "Scoping selects applicable controls; tailoring adjusts them (parameters, compensating controls) to the environment.", "Le scoping sélectionne les contrôles applicables ; le tailoring les ajuste (paramètres, compensations).", "La réponse D inverse les deux notions : c'est le piège classique."],
["High-water mark", "A reporting system aggregates public marketing data, internal financial data classified 'Sensitive' and merger plans classified 'Confidential'.", ["Categorize and protect the system at the Confidential level", "Protect it at the Sensitive level, the average of its data", "Classify each table separately and protect the system at Public level", "Protect it at the level of the most voluminous data type"], "The high-water mark principle requires protecting a system at the level of its most sensitive data.", "Le principe du *high-water mark* impose de protéger le système au niveau de sa donnée la plus sensible.", "Nuance : l'agrégation peut aussi créer une sensibilité supérieure à chaque élément pris isolément."],
["Asset inventory", "A new CISO joins a company that has never documented its systems. Several departments use unapproved SaaS tools and AI assistants.", ["Build an asset and data inventory, including shadow IT, before selecting controls", "Deploy a DLP solution to block unapproved SaaS immediately", "Block all external AI services at the firewall", "Classify all data as Confidential by default"], "You cannot protect what you do not know. The inventory, including shadow IT and AI, comes first, then classification, then controls.", "On ne protège pas ce qu'on ne connaît pas : l'inventaire (y compris le *shadow IT* et l'IA) vient d'abord, puis la classification, puis les contrôles.", "Bloquer tout peut nuire au métier sans analyse de risque."],
["DLP vs DRM", "A company sends confidential merger documents to an external law firm and wants to prevent printing, forwarding and access after the deal closes.", ["Digital/Information Rights Management (DRM/IRM)", "Data Loss Prevention (DLP)", "Full-disk encryption", "A CASB policy"], "DRM/IRM enforces usage rights after distribution, including expiry. DLP prevents data from leaving; FDE protects data at rest on devices.", "Le DRM contrôle l'usage après diffusion (impression, transfert, expiration) ; la DLP empêche la sortie ; le chiffrement de disque protège au repos.", "La DLP serait utile avant l'envoi, mais pas pour contrôler l'usage chez le destinataire."],
["Media reuse", "A hard drive from the finance department will be reused in the HR department of the same company, per policy.", ["Clear the drive using approved overwriting", "Physically destroy the drive", "Degauss the drive", "Format the drive"], "For internal reuse, clear (logical overwriting) is generally sufficient. Degaussing usually renders HDDs unusable, and destruction is unnecessary.", "Pour une réutilisation interne, le niveau Clear (écrasement) suffit généralement ; le dégaussage rend souvent le disque inutilisable.", "Le formatage n'est jamais un effacement sécurisé."],
["EOS systems", "A production server runs an operating system that reached end of support last year. The business application cannot be migrated for nine months.", ["Isolate the server, apply compensating controls and obtain documented risk acceptance while planning migration", "Keep it running unchanged because it is stable", "Immediately shut down the server", "Install a third-party antivirus and consider the risk resolved"], "End-of-support means no security patches. The best approach combines isolation, compensating controls, formal risk acceptance and a migration plan.", "La fin de support signifie plus de correctifs : isoler, compenser, faire accepter formellement le risque et planifier la migration.", "Nuance : EOL = n'est plus vendu ; EOS = n'est plus corrigé (le vrai risque)."],
["Labeling", "Users frequently email sensitive files externally because they do not know which files are sensitive. The DLP tool generates many false positives.", ["Implement consistent data labeling with human-readable and metadata labels used by the DLP", "Increase DLP blocking thresholds", "Disable external email", "Train users to recognize sensitive data without labels"], "Labels make classification visible to users and machine-readable for DLP, improving accuracy and user behavior.", "L'étiquetage rend la classification visible pour les utilisateurs et lisible pour la DLP, ce qui améliore la précision.", "Une DLP efficace dépend d'une classification fiable."],
];

Q[3] = [
["Security models", "In a military information system, an analyst cleared for Secret attempts to copy a paragraph from a Top Secret report into a document classified Confidential. The system blocks the action.", ["Bell-LaPadula *-property (no write down)", "Biba simple integrity property (no read down)", "Bell-LaPadula simple security property (no read up)", "Clark-Wilson separation of duties"], "Writing information to a lower classification would leak secrets. The Bell-LaPadula star property forbids writing down.", "Écrire vers un niveau inférieur ferait fuir des secrets : la *-property de Bell-LaPadula l'interdit (*no write down*).", "Piège : le sujet a déjà violé le *no read up* en lisant le Top Secret, mais l'action bloquée ici est l'écriture."],
["Integrity model", "A medical prescription system must not accept lab results from an uncertified external laboratory, to avoid contaminating trusted patient records.", ["Biba", "Bell-LaPadula", "Brewer-Nash", "Take-Grant"], "Biba protects integrity: a high-integrity subject must not read lower-integrity data (no read down) or write to higher-integrity levels (no write up).", "Biba protège l'intégrité : pas de lecture de données moins fiables (*no read down*), pas d'écriture vers un niveau plus fiable (*no write up*).", "Clark-Wilson protège aussi l'intégrité, mais par des transactions bien formées, pas par des niveaux."],
["Conflict of interest", "A consultant at an audit firm worked on Bank A's merger. The firm must ensure she cannot access files of Bank B, a competitor, while still allowing access to unrelated clients.", ["Brewer-Nash (Chinese Wall)", "Bell-LaPadula", "Role-based access control", "Graham-Denning"], "Brewer-Nash dynamically restricts access based on previous access to prevent conflicts of interest.", "Brewer-Nash restreint dynamiquement l'accès selon l'historique, pour éviter les conflits d'intérêts.", "RBAC est statique : il ne tient pas compte de l'historique des accès."],
["Asymmetric crypto", "Aminata must send a contract to Kouassi so that only Kouassi can read it AND he can verify it came from her.", ["Sign with Aminata's private key, then encrypt with Kouassi's public key", "Encrypt with Aminata's public key and sign with Kouassi's private key", "Encrypt with Kouassi's private key and sign with Aminata's public key", "Encrypt and sign with a shared symmetric key"], "Confidentiality uses the recipient's public key; authenticity and non-repudiation use the sender's private key.", "La confidentialité utilise la clé publique du destinataire ; l'authenticité et la non-répudiation, la clé privée de l'émetteur.", "Une clé symétrique partagée ne peut pas apporter de non-répudiation."],
["Non-repudiation", "A bank customer denies sending a high-value transfer order. The bank needs proof that will hold up legally.", ["Digital signature using the customer's private key backed by a PKI", "HMAC using a key shared between the customer and the bank", "TLS 1.3 encryption of the session", "SHA-256 hash of the transfer order"], "Only digital signatures with a key unique to the signer provide non-repudiation. HMAC uses a shared key, so either party could have produced it.", "Seule la signature numérique (clé propre au signataire) apporte la non-répudiation ; le HMAC repose sur une clé partagée.", "Le hachage assure l'intégrité, pas l'origine."],
["Password storage", "A breach reveals that an application stored passwords as unsalted MD5 hashes. The developers propose switching to unsalted SHA-256.", ["Use a slow, salted password hashing function such as Argon2id or bcrypt", "Switch to SHA-256 as proposed", "Encrypt passwords with AES-256 so they can be recovered", "Use SHA-1 with a global salt"], "Unique salts defeat rainbow tables, and slow functions resist brute force. Reversible encryption of passwords is a bad practice.", "Un sel unique neutralise les tables arc-en-ciel, et une fonction lente freine la force brute. Chiffrer les mots de passe de façon réversible est une mauvaise pratique.", "SHA-256 est un bon hachage, mais trop rapide pour des mots de passe."],
["Key management", "A company of 80 employees wants each pair of employees to communicate using a unique symmetric key.", ["3,160 keys", "160 keys", "6,400 keys", "80 keys"], "n(n−1)/2 = 80 × 79 / 2 = 3,160. This scalability problem is why asymmetric crypto (2n = 160 keys) is used for key exchange.", "n(n−1)/2 = 3 160 clés. C'est pourquoi on utilise l'asymétrique (2n = 160) pour échanger les clés.", "Piège : 160 est le nombre de clés en asymétrique."],
["Cipher modes", "An encrypted bitmap image still shows the outline of the original logo when viewed.", ["The image was encrypted in ECB mode; use an authenticated mode such as GCM", "The key length is too short; switch to AES-256", "The image should have been hashed instead", "RSA should be used instead of AES"], "ECB encrypts identical blocks identically, revealing patterns. GCM provides confidentiality and integrity.", "ECB chiffre des blocs identiques de façon identique, révélant les motifs ; GCM apporte confidentialité et intégrité.", "La longueur de clé n'a aucun rapport avec ce symptôme."],
["Accreditation", "An independent laboratory has evaluated a new system and confirmed it meets its security requirements. The project manager wants to go live tomorrow.", ["Senior management must formally authorize operation (accreditation/ATO)", "The laboratory's certification authorizes go-live", "The project manager can approve go-live after the evaluation", "The CISO must perform a second evaluation"], "Certification is the technical evaluation; accreditation (authorization to operate) is management's decision to accept the residual risk.", "La certification est l'évaluation technique ; l'accréditation (ATO) est la décision de la direction d'accepter le risque résiduel.", "Mindset : la direction décide, encore et toujours."],
["Shared responsibility", "Sensitive HR files in a SaaS collaboration tool were exposed because a user created a public sharing link. The company blames the SaaS provider.", ["The customer is responsible for data, identity and access configuration in SaaS", "The SaaS provider is responsible because it hosts the data", "Responsibility depends only on the contract's liability clause", "The user who created the link bears sole legal responsibility"], "In every cloud model, the customer remains responsible for its data, identities and access configuration.", "Dans tous les modèles cloud, le client reste responsable de ses données, identités et configurations d'accès.", "REX : de nombreuses fuites cloud viennent de mauvaises configurations côté client."],
["TOCTOU", "A program checks that a user may write to /tmp/report, then opens the file a moment later. An attacker replaces the file with a symbolic link to /etc/passwd in between.", ["A time-of-check to time-of-use (race condition) vulnerability", "A buffer overflow", "A covert timing channel", "A privilege escalation through maintenance hooks"], "TOCTOU exploits the gap between verification and use. Countermeasures include atomic operations and locking.", "Le TOCTOU exploite le délai entre vérification et utilisation ; parades : opérations atomiques, verrous.", "Il en résulte bien une élévation de privilèges, mais la vulnérabilité est le TOCTOU."],
["Post-quantum", "A government agency encrypts archives with RSA-2048 and must keep them confidential for 25 years. The minister asks what to do about quantum threats.", ["Start with a cryptographic inventory and a migration roadmap towards NIST PQC algorithms", "Immediately increase RSA keys to 8192 bits everywhere", "Wait until a large quantum computer is publicly announced", "Re-encrypt everything with SHA-3"], "'Harvest now, decrypt later' threatens long-lived secrets. An inventory, prioritization and crypto-agility come first; NIST plans to deprecate RSA/ECC after 2030.", "« Harvest now, decrypt later » menace les secrets de longue durée : inventaire, priorisation et crypto-agilité d'abord ; le NIST dépréciera RSA et ECC après 2030.", "SHA-3 est un hachage, pas un algorithme de chiffrement."],
["Fire suppression", "A new data center must have water-based fire suppression that minimizes the risk of accidental discharge on servers.", ["Pre-action sprinkler system", "Wet pipe sprinkler system", "Deluge system", "Halon system"], "Pre-action requires two events (detection, then heat at the sprinkler head) before water flows. Halon is banned; deluge suits high-hazard industrial areas.", "Le pré-action exige deux événements avant de libérer l'eau ; le halon est interdit ; le déluge sert aux risques industriels.", "Les gaz propres (FM-200, Novec) sont aussi courants, mais la question demande un système à eau."],
["Fail-safe", "An electronic lock on a server room door is configured to remain locked during a power failure. Operators sometimes work inside at night.", ["Configure the door as fail-safe so that people can exit during a failure", "Keep it fail-secure to protect the servers", "Add a CCTV camera to monitor the door", "Remove the lock and rely on guards"], "When human life may be at risk, fail-safe (unlocking) takes priority over protecting assets.", "Quand des vies peuvent être en jeu, le *fail-safe* (ouverture) prime sur la protection des biens.", "Mindset n°1 : *human safety first*."],
["IoT", "Hundreds of IP cameras with default passwords are installed on the same network as finance workstations. Some cameras cannot be patched.", ["Segment the cameras into an isolated network and change default credentials", "Install antivirus software on each camera", "Replace the cameras with analog CCTV", "Accept the risk because cameras hold no sensitive data"], "Embedded devices are best protected architecturally: segmentation, secure defaults, inventory and firmware management.", "Les équipements embarqués se protègent par l'architecture : segmentation, identifiants changés, inventaire, mises à jour.", "REX : le botnet Mirai (2016) exploitait des identifiants par défaut."],
];

Q[4] = [
["OSI layers", "A malicious insider sends forged ARP replies so that traffic to the default gateway passes through his workstation.", ["Layer 2; enable Dynamic ARP Inspection on switches", "Layer 3; add firewall rules on the router", "Layer 4; enable TCP SYN cookies", "Layer 7; deploy a web application firewall"], "ARP maps IP to MAC addresses at the Data Link layer. Dynamic ARP Inspection with DHCP snooping mitigates ARP poisoning.", "ARP relie IP et MAC en couche 2 ; la *Dynamic ARP Inspection* avec le *DHCP snooping* contre l'empoisonnement ARP.", "Piège : ARP manipule des adresses IP, ce qui fait penser à la couche 3."],
["IPsec", "Two branch offices must exchange all traffic securely over the Internet through their gateways. Both sites use NAT.", ["IPsec ESP in tunnel mode", "IPsec AH in tunnel mode", "IPsec AH in transport mode", "IPsec ESP in transport mode"], "ESP provides confidentiality; tunnel mode protects the whole original packet between gateways. AH provides no encryption and breaks with NAT.", "ESP chiffre ; le mode tunnel protège le paquet entier entre passerelles. AH ne chiffre pas et ne fonctionne pas avec le NAT.", "Le mode transport sert d'hôte à hôte."],
["DNS security", "Customers of a bank were redirected to a fake website after the resolver's cache was poisoned.", ["DNSSEC", "DNS over HTTPS", "Split-horizon DNS", "Increasing DNS TTL values"], "DNSSEC signs DNS records so that resolvers can verify integrity and origin. DoH encrypts queries but does not authenticate the data source.", "DNSSEC signe les enregistrements (intégrité, origine) ; DoH chiffre les requêtes sans authentifier les données.", "Retenez : DNSSEC = intégrité, DoH / DoT = confidentialité."],
["Wireless", "A company of 300 employees uses one WPA2 pre-shared key. A recently dismissed employee still knows it.", ["Deploy WPA3-Enterprise with 802.1X and EAP-TLS", "Change the pre-shared key every month", "Enable MAC address filtering", "Hide the SSID"], "Enterprise mode gives each user individual credentials or certificates that can be revoked. MAC filtering and hidden SSIDs are easily bypassed.", "Le mode Enterprise donne des identifiants ou certificats individuels révocables ; le filtrage MAC et le SSID caché se contournent facilement.", "Changer la clé partagée ne règle pas le problème de fond (pas d'identité individuelle)."],
["IDS/IPS", "The SOC wants to automatically block known exploit traffic aimed at its web servers, but fears disrupting legitimate users.", ["Deploy an IPS inline, tune it in detection mode first, then enable blocking", "Deploy an IDS on a SPAN port", "Deploy a honeypot in the DMZ", "Rely on the SIEM to block attacks"], "An IPS sits inline and can block. Starting in detection mode lets the team tune out false positives before blocking.", "L'IPS est en ligne et peut bloquer ; démarrer en mode détection permet d'éliminer les faux positifs avant de bloquer.", "L'IDS ne bloque pas : il alerte seulement."],
["Email security", "Attackers send invoices that appear to come from the company's CFO domain. The domain has SPF configured but nothing else.", ["Implement DKIM and DMARC with a reject policy", "Rely on SPF, which already prevents spoofing", "Block all emails containing invoices", "Enable TLS on the mail server"], "SPF authorizes sending servers, DKIM signs messages and DMARC sets the policy and reporting. Together they prevent domain spoofing.", "SPF autorise les serveurs, DKIM signe, DMARC définit la politique et les rapports : ensemble, ils empêchent l'usurpation du domaine.", "TLS protège le transport, pas l'identité de l'expéditeur."],
["DoS", "A public web server becomes unreachable. Logs show thousands of TCP connection requests that never complete the handshake.", ["SYN flood; enable SYN cookies and rate limiting", "Smurf attack; disable directed broadcasts", "Teardrop attack; patch the IP stack", "Ping of death; block ICMP"], "A SYN flood exhausts the half-open connection table. SYN cookies and anti-DDoS services mitigate it.", "Le SYN flood sature la table des connexions semi-ouvertes ; les SYN cookies et un service anti-DDoS l'atténuent.", "Le smurf utilise de l'ICMP en broadcast, pas des poignées de main TCP."],
["Remote access", "External auditors need access to a single HR application for three weeks. The CISO does not want them on the internal network.", ["Zero Trust Network Access granting per-application access", "Full-tunnel VPN", "Split-tunnel VPN", "Publishing RDP on the Internet with strong passwords"], "ZTNA grants access to specific applications based on identity and device posture without network-level access.", "Le ZTNA donne un accès par application, fondé sur l'identité et l'état du terminal, sans accès réseau.", "Un VPN met l'utilisateur sur le réseau : c'est contraire au moindre privilège."],
["Secure protocols", "Network devices are managed using Telnet and monitored using SNMPv1 from users' workstations.", ["Use SSH and SNMPv3 from a dedicated management network", "Keep Telnet but restrict it with ACLs", "Use SNMPv2c with strong community strings", "Use HTTP management interfaces"], "Telnet and SNMPv1/v2c transmit credentials in cleartext. SSH and SNMPv3 provide authentication and encryption; a dedicated management network adds defense in depth.", "Telnet et SNMPv1/v2c transmettent les identifiants en clair ; SSH et SNMPv3 authentifient et chiffrent.", "Les ACL réduisent l'exposition, mais pas l'écoute des identifiants en clair."],
["AAA", "The network team wants centralized administrator authentication for routers, with the entire payload encrypted and per-command authorization.", ["TACACS+", "RADIUS", "LDAP", "Kerberos"], "TACACS+ uses TCP, encrypts the whole payload and separates authentication, authorization and accounting, supporting command authorization.", "TACACS+ utilise TCP, chiffre tout le contenu et sépare l'AAA, avec autorisation commande par commande.", "RADIUS ne chiffre que le mot de passe ; il est courant pour l'accès réseau et le Wi-Fi."],
["VLAN", "During a pentest, the tester moves from the guest VLAN to the server VLAN by sending double-tagged frames.", ["VLAN hopping; disable DTP, use an unused native VLAN and enforce inter-VLAN filtering", "MAC flooding; enable port security", "ARP poisoning; enable DAI", "Rogue DHCP; enable DHCP snooping"], "Double tagging and switch spoofing are VLAN hopping techniques. VLANs alone are not a strong security boundary.", "Le double étiquetage et l'usurpation de switch sont des techniques de saut de VLAN ; un VLAN seul n'est pas une frontière forte.", "Il faut aussi un pare-feu ou des ACL entre les zones."],
["Network architecture", "A company hosts its public website and mail relay on the same flat network as employee workstations.", ["Place public services in a screened subnet (DMZ) between firewalls", "Install host-based antivirus on the web server", "Move the website to the cloud without other changes", "Encrypt all traffic with TLS"], "A DMZ isolates exposed services so that a compromise does not give direct access to the internal network.", "Une DMZ isole les services exposés pour qu'une compromission ne donne pas accès au réseau interne.", "Mindset : la segmentation et la défense en profondeur avant tout."],
["Wireless attack", "At a conference hotel, attendees connect to an access point with the same SSID as the official network, and their credentials are captured.", ["Evil twin attack", "Rogue access point", "Bluesnarfing", "War driving"], "An evil twin imitates a legitimate AP. A rogue AP is an unauthorized AP connected to your own network.", "L'*evil twin* imite un point d'accès légitime ; le *rogue AP* est un point d'accès non autorisé branché sur votre réseau.", "Protections : VPN / ZTNA, EAP-TLS avec vérification des certificats."],
["Cabling", "A defense ministry needs to connect two buildings with the medium most resistant to eavesdropping and electromagnetic interference.", ["Fiber optic cable", "Shielded twisted pair", "Coaxial cable", "Point-to-point microwave link"], "Fiber carries light, is immune to EMI and is very difficult to tap without detection.", "La fibre transporte de la lumière, est insensible aux interférences et très difficile à écouter sans être détectée.", "Le STP réduit les interférences mais reste plus facile à écouter."],
["Edge devices", "A vendor releases an emergency patch for a VPN gateway vulnerability that is being actively exploited worldwide.", ["Follow the emergency change process, patch with priority and hunt for indicators of compromise", "Wait for the quarterly maintenance window", "Patch immediately in production without any change record", "Disable the VPN permanently"], "Emergency changes are expedited but still controlled (ECAB, minimal testing, documentation), and you should check whether the device was already compromised.", "Le changement d'urgence est accéléré mais encadré (ECAB, test minimal, documentation) ; il faut aussi vérifier si l'équipement est déjà compromis.", "REX 2023-2026 : les passerelles VPN sont un vecteur d'entrée majeur."],
];

Q[5] = [
["MFA", "A banking application asks for a password and then a 6-digit PIN chosen by the user at enrollment. Marketing advertises it as 'two-factor authentication'.", ["It is single-factor authentication because both elements are something you know", "It is two-factor authentication because there are two steps", "It is multifactor authentication if the PIN expires", "It is two-factor authentication if the PIN is sent by SMS"], "MFA requires different factor types. A password and a PIN are both knowledge factors.", "Le MFA exige des types de facteurs différents ; mot de passe et PIN relèvent tous deux de « ce que je sais ».", "Nuance : un code reçu par SMS serait bien un second facteur (possession), mais un facteur faible."],
["Biometrics", "A bank compares three fingerprint readers for its vault: reader A has a CER of 2.5%, reader B 1.2% and reader C 0.6%. Reader A has the lowest FRR.", ["Choose reader C and tune it to minimize false acceptance", "Choose reader A for the best user experience", "Choose reader B as a balanced compromise", "Choose any reader, since CER does not matter for vaults"], "A lower CER indicates a more accurate system. For a vault, false acceptances (Type II) are the most critical errors.", "Un CER plus bas indique un système plus précis ; pour une salle des coffres, la fausse acceptation (Type II) est l'erreur la plus grave.", "Le FRR bas améliore le confort, pas la sécurité."],
["OAuth", "A travel app wants to read a user's calendar from another provider to suggest trips, without ever handling the user's password.", ["OAuth 2.0 with limited scopes", "SAML 2.0 assertions", "Kerberos tickets", "LDAP bind with the user's credentials"], "OAuth 2.0 provides delegated authorization through access tokens with limited scopes.", "OAuth 2.0 assure une autorisation déléguée par jetons d'accès à portée limitée.", "OpenID Connect ajouterait l'authentification de l'utilisateur au-dessus d'OAuth."],
["Federation", "A banking group wants employees to access an insurance partner's portal using their corporate credentials, without creating accounts at the partner.", ["Identity federation using SAML 2.0 or OpenID Connect", "Synchronize passwords to the partner's directory", "Create shared accounts for each department", "Use a VPN between the two companies"], "Federation establishes trust: the bank's IdP issues assertions that the partner's SP accepts.", "La fédération établit une confiance : l'IdP de la banque émet des assertions que le SP du partenaire accepte.", "Synchroniser les mots de passe chez un tiers étend la surface d'attaque."],
["Kerberos", "After a server's time zone was misconfigured, users can no longer authenticate to file shares in an Active Directory domain. Passwords have not changed.", ["Clock skew exceeds Kerberos tolerance; synchronize time with NTP", "The TGT has expired; users must reboot", "The certificate authority is unavailable", "The LDAP service account is locked"], "Kerberos relies on timestamps to prevent replay; skew beyond the tolerance (5 minutes by default) causes failures.", "Kerberos utilise des horodatages contre le rejeu ; un décalage au-delà de 5 minutes provoque des échecs.", "Le KDC est aussi un point de défaillance unique."],
["Privilege creep", "An audit finds that an employee who moved from finance to HR and then to procurement still has access to all three departments' systems.", ["Implement periodic access reviews and remove old rights on every role change", "Delete the employee's account and create a new one", "Increase logging on the employee's account", "Implement single sign-on"], "This is privilege creep caused by a weak 'mover' process. The fix is to correct the process: recertification and automatic removal on transfer.", "C'est l'accumulation de privilèges due à un processus *mover* défaillant : il faut des revues périodiques et le retrait automatique lors des mutations.", "L'examen préfère corriger le processus plutôt que le cas isolé."],
["Deprovisioning", "Thirty accounts of former employees are still active. HR notifies IT of departures by email, and IT sometimes misses them.", ["Automate deprovisioning from the HR system as the authoritative source", "Disable the thirty accounts and remind IT to read emails", "Set all accounts to expire every 90 days", "Require managers to report departures monthly"], "The root cause is a manual leaver process. Automating from the HR source of truth fixes it permanently.", "La cause racine est un processus de départ manuel ; l'automatiser depuis le système RH le corrige durablement.", "Désactiver les 30 comptes est nécessaire, mais ne suffit pas."],
["Access models", "A government agency requires that access to documents be determined by the system, based on users' clearances and documents' classification labels, and users cannot change permissions.", ["Mandatory Access Control (MAC)", "Discretionary Access Control (DAC)", "Role-Based Access Control (RBAC)", "Rule-based access control"], "MAC enforces access through labels and clearances set by the system; owners cannot change permissions.", "Le MAC impose l'accès via les étiquettes et habilitations ; les propriétaires ne peuvent pas modifier les droits.", "RBAC est aussi non discrétionnaire, mais il est fondé sur les rôles, pas sur des étiquettes."],
["ABAC", "A hospital wants doctors to access patient records only if they are assigned to the patient's ward, are using a managed device and are on shift.", ["Attribute-Based Access Control", "Discretionary Access Control", "Mandatory Access Control", "Role-Based Access Control alone"], "ABAC evaluates subject, object, action and environment attributes, enabling contextual decisions aligned with Zero Trust.", "L'ABAC évalue des attributs du sujet, de l'objet, de l'action et de l'environnement : des décisions contextuelles, alignées sur le Zero Trust.", "Le RBAC seul ne prend pas en compte l'état du terminal ou l'horaire."],
["PAM", "Domain administrators use their privileged accounts for email and web browsing. Several have been targeted by phishing.", ["Separate admin accounts, PAM with just-in-time access and dedicated admin workstations", "Remind administrators to be careful", "Require longer passwords for administrators", "Disable web browsing for all employees"], "Separating privileged from daily-use accounts and using PAM (vaulting, JIT, session recording) reduces credential theft and lateral movement.", "Séparer les comptes à privilèges des comptes du quotidien et utiliser un PAM (coffre, JIT, enregistrement) réduit le vol d'identifiants.", "Des mots de passe plus longs n'empêchent pas le vol par phishing."],
["MFA fatigue", "An attacker with a stolen password sends dozens of push notifications at night until the user approves one.", ["Enable number matching and move to phishing-resistant FIDO2 authentication", "Switch to SMS one-time passwords", "Increase the account lockout threshold", "Disable MFA at night"], "Number matching stops blind approvals; FIDO2/passkeys are phishing-resistant and immune to push bombing.", "La correspondance de nombres empêche les approbations aveugles ; FIDO2 / passkeys résistent au phishing et au *push bombing*.", "REX : plusieurs grandes compromissions de 2022-2023 ont utilisé la fatigue MFA."],
["Password attacks", "Logs show the password 'Bouake2026!' attempted once against 4,000 different accounts within an hour.", ["Password spraying", "Credential stuffing", "Brute-force attack", "Rainbow table attack"], "Password spraying tries one common password on many accounts to avoid lockouts. Credential stuffing reuses stolen username/password pairs.", "Le *password spraying* teste un mot de passe courant sur de nombreux comptes pour éviter le verrouillage ; le *credential stuffing* réutilise des couples volés.", "Parades : MFA, listes de mots de passe interdits, détection des anomalies."],
["Kerberos attack", "An attacker requests service tickets for accounts with SPNs and cracks them offline to recover service account passwords.", ["Kerberoasting; use long random passwords or managed service accounts", "Golden ticket; reset the KRBTGT password twice", "Pass-the-hash; enable Credential Guard", "Silver ticket; disable NTLM"], "Kerberoasting targets service tickets encrypted with service account passwords. Long passwords or gMSA make cracking impractical.", "Le Kerberoasting cible les tickets chiffrés avec le mot de passe des comptes de service ; des mots de passe longs ou des gMSA rendent le cassage impraticable.", "Le golden ticket suppose une compromission préalable du KRBTGT."],
["Accountability", "Operators in a control room share a single 'operator' account to save time during shift changes.", ["Accountability is lost; implement individual accounts with fast authentication such as SSO or badges", "This is acceptable if all actions are logged", "This is acceptable if the password is changed weekly", "This is acceptable in OT environments"], "Shared accounts prevent tying actions to individuals. Fast individual authentication preserves both usability and accountability.", "Les comptes partagés empêchent d'attribuer les actions ; une authentification individuelle rapide préserve ergonomie et traçabilité.", "Journaliser un compte partagé ne dit pas QUI a agi."],
["Password policy", "Users must change complex passwords every 30 days and write them on sticky notes. The CISO wants to follow current best practice.", ["Favor long passphrases, screen against breached passwords, remove arbitrary expiration and add MFA", "Shorten the expiration to 15 days", "Require 16-character complex passwords changed every 30 days", "Ban sticky notes and keep the policy"], "NIST SP 800-63B recommends length over complexity, no arbitrary periodic expiration and checks against compromised passwords.", "Le NIST SP 800-63B recommande la longueur plutôt que la complexité, pas d'expiration arbitraire et la vérification contre les mots de passe compromis.", "Des règles trop contraignantes produisent des comportements à risque."],
];

Q[6] = [
["Pentest authorization", "A project manager asks an external firm to 'test the new mobile banking app this weekend'. No contract amendment or scope document exists yet.", ["Obtain written authorization from the system owner and agree rules of engagement first", "Start with passive reconnaissance only, which needs no authorization", "Run an unauthenticated vulnerability scan to save time", "Test only during off-peak hours to avoid impact"], "Testing without written authorization and defined scope can be illegal and dangerous. Rules of engagement define targets, timing, exclusions and contacts.", "Tester sans autorisation écrite ni périmètre peut être illégal et dangereux ; les règles d'engagement fixent cibles, horaires, exclusions et contacts.", "Piège : même une reconnaissance « passive » doit s'inscrire dans un mandat."],
["Scan vs pentest", "The board asks whether an identified SQL injection could actually expose customer account data.", ["Conduct a penetration test to safely demonstrate the real impact", "Run another vulnerability scan with a different tool", "Perform a code review of the entire application", "Calculate the CVSS score"], "A penetration test exploits vulnerabilities in a controlled way to demonstrate business impact; a scan only identifies.", "Le test d'intrusion exploite de façon contrôlée pour démontrer l'impact métier ; le scan se contente d'identifier.", "Le score CVSS mesure la gravité, pas l'impact réel dans votre contexte."],
["Scan accuracy", "An unauthenticated external scan reports no vulnerabilities on a server that has not been patched for a year.", ["Perform a credentialed scan, as false negatives are likely", "Accept the result, since the server is not exposed", "Run the same scan again at night", "Replace the scanner with a port scanner"], "Unauthenticated scans miss many local vulnerabilities. Credentialed scans read installed versions and configurations, reducing false negatives.", "Un scan non authentifié manque de nombreuses vulnérabilités locales ; un scan authentifié lit versions et configurations.", "Le faux négatif est le résultat le plus dangereux."],
["Vendor assurance", "A SaaS payroll provider sends a marketing brochure stating 'bank-grade security' and a SOC 3 report.", ["Request a recent SOC 2 Type II report and review its scope, exceptions and complementary user entity controls", "Accept the SOC 3 report, since it is issued by an independent auditor", "Request a SOC 1 Type I report", "Request the brochure's technical annex"], "SOC 2 Type II covers security controls and their operating effectiveness over a period. SOC 3 is a public summary; SOC 1 addresses financial reporting controls.", "Le SOC 2 Type II couvre les contrôles de sécurité et leur efficacité sur une période ; le SOC 3 est un résumé public ; le SOC 1 concerne la finance.", "Nuance : pour une paie, le SOC 1 peut aussi intéresser les auditeurs financiers, mais la question porte sur la sécurité."],
["Auditor independence", "An internal auditor discovers that firewall rules allow unrestricted access to the database from the user network.", ["Document the finding and report it to management or the audit committee", "Fix the firewall rules immediately to reduce risk", "Notify the attackers' likely targets", "Wait for the next audit cycle"], "Auditors evaluate and report; implementing fixes would impair their independence.", "L'auditeur évalue et rapporte ; corriger lui-même compromettrait son indépendance.", "La remédiation appartient aux équipes opérationnelles, sous la responsabilité de la direction."],
["SCA", "An application uses more than 500 open-source libraries, some with known critical CVEs. The team wants continuous visibility.", ["Software Composition Analysis integrated into the CI/CD pipeline, with an SBOM", "Dynamic Application Security Testing", "A yearly penetration test", "Manual code review of every library"], "SCA identifies third-party components, their vulnerabilities and licenses, and should run continuously.", "La SCA identifie les composants tiers, leurs vulnérabilités et leurs licences, en continu.", "REX : Log4Shell (2021) a montré l'importance de savoir où se trouvent les composants."],
["Fuzzing", "A security team wants to find crashes and memory corruption in a file-parsing component that accepts uploaded documents.", ["Fuzz testing", "Regression testing", "Synthetic transactions", "User acceptance testing"], "Fuzzing feeds large volumes of malformed or random input to uncover crashes, overflows and input-validation flaws.", "Le fuzzing injecte des entrées malformées en masse pour révéler plantages, débordements et défauts de validation.", "Les tests de régression vérifient qu'un changement n'a rien cassé, pas la robustesse."],
["Monitoring", "A bank wants to know before customers do when the online payment flow stops working, including at night when traffic is low.", ["Synthetic transactions", "Real user monitoring", "Weekly log review", "Annual penetration testing"], "Synthetic transactions are scripted, proactive tests that run continuously, regardless of real traffic.", "Les transactions synthétiques sont des tests scriptés et proactifs, indépendants du trafic réel.", "Le RUM est passif : sans utilisateurs la nuit, il ne détecte rien."],
["Reporting", "The CISO must present pentest results to the board of directors.", ["Summarize business risk, trends, required decisions and remediation plan", "Present the full technical report with all findings", "Present only the CVSS scores of each vulnerability", "Present screenshots of successful exploits"], "Reports must be tailored to the audience. Executives need business risk and decisions, not raw technical detail.", "Le rapport s'adapte à l'audience : la direction veut le risque métier et les décisions à prendre, pas les détails techniques.", "Les détails restent dans l'annexe destinée aux équipes techniques."],
["Metrics", "Management wants an indicator that warns of increasing risk before an incident occurs.", ["A key risk indicator such as the percentage of critical systems unpatched beyond 30 days", "A key performance indicator such as tickets closed per month", "The number of incidents last year", "Mean time to repair"], "KRIs are leading indicators of risk exposure; KPIs measure past performance.", "Les KRI sont des indicateurs avancés de l'exposition au risque ; les KPI mesurent la performance passée.", "Le MTTR est utile mais mesure l'après-incident."],
["Prioritization", "A scan finds 1,500 vulnerabilities, including 60 rated critical by CVSS. Staff can fix about 100 per week.", ["Prioritize by risk using CVSS, exploitation likelihood (EPSS), known exploitation (KEV) and asset criticality", "Fix all critical CVSS findings in alphabetical order", "Fix the easiest vulnerabilities first to reduce the count", "Fix vulnerabilities in the order they were discovered"], "Risk-based prioritization combines severity, likelihood of exploitation, active exploitation and the asset's value and exposure.", "La priorisation par le risque combine gravité, probabilité d'exploitation, exploitation active et valeur de l'actif.", "Une vulnérabilité « moyenne » activement exploitée sur un actif exposé peut passer avant une « critique » interne."],
["Red team", "The SOC wants to evaluate its ability to detect and respond to a stealthy adversary over several weeks, without prior warning to analysts.", ["A red team exercise followed by purple teaming to improve detections", "A credentialed vulnerability scan", "A tabletop exercise", "A SOC 2 Type II audit"], "Red teams emulate realistic adversaries to test detection and response; purple teaming turns findings into improved detections.", "La red team simule un adversaire réaliste pour tester détection et réponse ; la purple team transforme les résultats en détections améliorées.", "Le tabletop teste les décisions, pas les capacités techniques de détection."],
["Backup verification", "Backup software reports 'success' every night, but no restoration test has been performed in two years.", ["Perform regular documented restoration tests to verify RPO and RTO", "Trust the success logs, which prove the backups work", "Add a second backup product", "Increase backup frequency"], "Only restore tests prove that backups are usable and that recovery objectives can be met.", "Seuls des tests de restauration prouvent que les sauvegardes sont utilisables et que le RPO / RTO sont tenables.", "REX : lors d'attaques par rançongiciel, des sauvegardes jamais testées se révèlent souvent inutilisables."],
["Exceptions", "A legacy application cannot support MFA until its next major release in six months.", ["Approve a time-bound exception with compensating controls and a review date", "Grant a permanent exception", "Ignore the requirement until the new release", "Block the application immediately"], "Exceptions should be formal, risk-accepted by the owner, compensated and temporary.", "Une exception doit être formelle, acceptée par le propriétaire du risque, compensée et temporaire.", "Bloquer peut être disproportionné si un contrôle compensatoire réduit le risque."],
["SAST", "A development team wants to detect injection flaws as early as possible, directly in the IDE and on each commit.", ["Static Application Security Testing", "Dynamic Application Security Testing", "Penetration testing before release", "Real user monitoring"], "SAST analyzes source code without executing it and can run early in the SDLC.", "Le SAST analyse le code source sans l'exécuter et peut tourner très tôt dans le cycle.", "Le SAST produit des faux positifs ; le DAST complète en recette."],

Q[7] = [

 <h3>Level by domain (weakest first)</h3>
 <table><tr><th>Domain</th><th>Score</th><th style="width:28%">Mastery</th><th>Level</th></tr>
 ${doms.map(d=>{const p=Math.round(by[d].g/by[d].n*100),[c,l]=level(p),col=p>=80?'var(--ok)':p>=60?'#E6A700':'var(--ko)';
 return `<tr><td><b>D${d}</b> ${DN[d]}</td><td>${by[d].g}/${by[d].n} (${p}%)</td><td><div class="bar"><div style="width:${p}%;background:${col}"></div></div></td><td><span class="lvl ${c}">${l}</span></td></tr>`}).join('')}</table>
 <p class="hint">Levels mirror the CISSP score report wording: Proficient (≥ 80%), Near proficient (60–79%), Below proficiency (&lt; 60%). This is a practice estimate, not an official score.</p>
 <div class="nav"><button class="btn2" onclick="home()">⚙ New configuration</button><button class="btn" onclick="start()">🔄 Retake with new questions</button></div></div>
 <div class="card"><h2>📚 Revision recommendations by domain</h2>
 ${doms.map(d=>{const p=Math.round(by[d].g/by[d].n*100),r=R[d],txt=p>=80?r.strong:p>=60?r.mid:r.weak;
 return `<div class="rec"><h4>D${d} – ${DN[d]} · ${p}% <span class="lvl ${level(p)[0]}">${level(p)[1]}</span></h4><p style="margin:4px 0">${esc(txt)}</p>
 ${by[d].miss.length?`<b>Topics missed in this test:</b> ${by[d].miss.map(esc).join(' · ')}<br>`:''}
 <b>Classic traps to re-check:</b><ul>${r.traps.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`}).join('')}
 </div>
 <div class="card"><h2>📝 Detailed review</h2><p class="hint">Each question with the best answer, the explanation in English and French, and the exam nuance.</p>
 ${quiz.map((q,i)=>{const g=ans[i]===q.a;return `<div class="rev ${g?'o':'k'}"><span class="tag">D${q.d}</span><span class="tag">${esc(q.topic)}</span>${flags[i]?'<span class="flag">⚑</span>':''}
 <div style="margin:6px 0"><b>${i+1}.</b> ${esc(q.scen)} <b>${esc(q.stem)}</b></div>
 ${g?'✅ ':'❌ Your answer: '+(ans[i]===null?'<i>none</i>':L[ans[i]]+'. '+esc(q.opts[ans[i]]))+'<br>✅ '}<b>Best answer: ${L[q.a]}. ${esc(q.opts[q.a])}</b>${expl(q)}</div>`}).join('')}</div>`;
 window.scrollTo({top:0});
}
home();
</script>
</body></html>

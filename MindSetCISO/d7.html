<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>CISSP D7 · Opérations de sécurité</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap">
<style>/* Layout : portail de révision — barre de navigation fixe, en-tête de domaine, sections empilées avec sommaire */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#101B2B; --muted:#5A6879; --line:#D7DEE7;
  --accent:#1F4E9E; --accent-soft:#E3EBF8; --on-accent:#FFFFFF;
  --ok:#2E7D46; --ok-soft:#E3F2E8; --bad:#B3262F; --bad-soft:#FBE7E8; --warn:#B0680A;
  --hl:#FFF4D6; --hl-ink:#6B4B00;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-quote:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}

/* Barre du portail */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.pbar-in{display:flex;align-items:center;gap:14px;padding-block:9px;overflow-x:auto;scrollbar-width:none}
.pbar-in::-webkit-scrollbar{display:none}
.logo{font-family:var(--f-disp);font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo span{color:var(--accent)}
.pnav{display:flex;gap:4px}
.pnav a{font-family:var(--f-mono);font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);padding:5px 9px;border-radius:6px;white-space:nowrap}
.pnav a:hover{background:var(--sunk);color:var(--ink)}
.pnav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

/* En-tête de page */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero-in{padding-block:26px 18px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.hero h1 .code{color:var(--accent);margin-right:10px}
.en{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pitch{max-width:72ch;margin:0;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.stat{display:flex;flex-direction:column;gap:2px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:150px;text-decoration:none;color:var(--ink)}
.stat b{font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
a.stat:hover{border-color:var(--accent)}
.toc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.toc::-webkit-scrollbar{display:none}
.toc a{font-size:13px;font-weight:500;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)}
.toc a:hover{color:var(--ink);border-color:var(--accent)}

main{padding-block:10px 60px}
.sec{padding-top:34px;scroll-margin-top:60px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h .n{font-family:var(--f-mono);font-size:13px;color:var(--accent);margin-right:8px}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}

/* Objectifs */
.obj{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:8px}
.obj li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.obj b{font-family:var(--f-mono);color:var(--accent);font-size:13px}

/* Concepts */
.concepts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.concept h3{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
.concept h3 i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.concept p{margin:0;font-size:14.5px}

/* Schémas */
.schemas{display:flex;flex-direction:column;gap:14px}
.schema h3{font-size:18px;margin-bottom:12px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 130px;min-width:0;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:7px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.flow .st b{font-family:var(--f-disp);font-size:15px}
.flow .st span{font-size:12.5px;color:var(--muted)}
.flow .ar{align-self:center;color:var(--muted);font-family:var(--f-mono)}
.cycle-back{margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:4px}
.stack .ly{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:14px}
.stack .ly b{font-family:var(--f-disp);font-size:15px}
.stack .ly span{color:var(--muted)}
.note{margin:10px 0 0;font-size:13px;color:var(--hl-ink);background:var(--hl);display:inline-block;padding:4px 10px;border-radius:6px}

/* Tableaux */
.tables{display:flex;flex-direction:column;gap:14px}
.tables h3{font-size:18px;margin-bottom:10px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td:first-child{font-weight:600}

/* Scénarios */
.scens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.scen .sit{margin:0;font-size:14.5px}
.scen .q{margin:0;font-weight:600;font-family:var(--f-disp);font-size:16px;color:var(--accent)}
.scen .ans{background:var(--ok-soft);border-radius:7px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.scen .ans p{margin:0}
.scen .why{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:13.5px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Quiz */
.quiz{max-width:820px}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--muted)}
.qz-prog{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:14px}
.qz-prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qz-q{font-family:var(--f-disp);font-size:20px;font-weight:600;margin:0 0 14px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--bg);border-left:4px solid var(--muted);font-size:14.5px}
.fb.ok{border-left-color:var(--ok)}.fb.ko{border-left-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.qz-end{display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1}
.score small{font-size:18px;color:var(--muted);font-weight:500}
.review{display:flex;flex-direction:column;gap:8px}
.review div{background:var(--bg);border-radius:7px;padding:10px 12px;font-size:14px}
.review b{color:var(--bad)}

/* Glossaire */
.glo-s{max-width:320px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.glo td:first-child{font-family:var(--f-mono);font-size:13px}

/* Checklist */
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-width:820px}
.chk label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14.5px}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;max-width:820px;margin-bottom:10px}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1 1 220px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pager a.next{text-align:right}
.foot{margin-top:30px;font-size:12px;color:var(--muted)}

@media (max-width:760px){
  .hero h1{font-size:26px}
  .concepts,.scens{grid-template-columns:minmax(0,1fr)}
  .stack .ly{grid-template-columns:minmax(0,1fr);gap:2px}
  .flow .ar{display:none}
  .flow .st{flex-basis:100%}
  .stat{min-width:0;flex:1 1 40%}
}
</style>
</head><body>
<header class="pbar"><div class="wrap pbar-in"><a class="logo" href="index.html">CISO <span>Portail</span></a><nav class="pnav" aria-label="Modules"><a href="index.html">Portail</a><a href="mindset.html">Mindset 150</a><a href="d1.html">D1</a><a href="d2.html">D2</a><a href="d3.html">D3</a><a href="d4.html">D4</a><a href="d5.html">D5</a><a href="d6.html">D6</a><a href="d7.html" aria-current="page">D7</a><a href="d8.html">D8</a></nav></div></header>
<div id="app"></div>
<script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const LETTERS="ABCD";

/* Moteur de quiz : mode « learn » (correction immédiate) ou « exam » (correction à la fin) */
function Quiz(el,questions,cfg){
  cfg=cfg||{};
  let qs,i,ans,timer,deadline;
  function start(list){
    qs=(list||questions).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:shuffle(q.opts.map((t,k)=>({t,ok:k===q.a})))}));
    i=0;ans=[];
    clearInterval(timer);
    if(cfg.minutes){deadline=Date.now()+cfg.minutes*60000;timer=setInterval(tick,1000)}
    render();
  }
  function tick(){const r=deadline-Date.now();const t=el.querySelector(".qz-time");if(t)t.textContent=fmt(r);if(r<=0){clearInterval(timer);finish(true)}}
  const fmt=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,"0")}`};
  function render(){
    if(i>=qs.length)return finish(false);
    const q=qs[i],a=ans[i],good=ans.filter(x=>x&&x.ok).length;
    el.innerHTML=`<div class="qz-top"><span>Question <b>${i+1}</b> / ${qs.length}${q.d&&cfg.showDom?` · <span class="en">${q.d}</span>`:""}</span>
      <span>${cfg.mode==="exam"?(cfg.minutes?`Temps restant <b class="qz-time">${fmt(deadline-Date.now())}</b>`:""):`Score <b>${good}</b> / ${ans.filter(Boolean).length}`}</span></div>
      <div class="qz-prog"><i style="width:${i/qs.length*100}%"></i></div>
      <p class="qz-q">${esc(q.q)}</p>
      <div class="opts">${q.opts.map((o,k)=>{
        let cls="opt";
        if(a){ if(cfg.mode==="exam"){if(a.k===k)cls+=" picked"} else {if(o.ok)cls+=" good";else if(a.k===k)cls+=" wrong"} }
        return `<button class="${cls}" type="button" data-k="${k}"${a&&cfg.mode!=="exam"?" disabled":""}><span class="k">${LETTERS[k]}</span><span>${esc(o.t)}</span></button>`}).join("")}</div>
      ${a&&cfg.mode!=="exam"?`<div class="fb ${a.ok?"ok":"ko"}"><b>${a.ok?"Bonne réponse.":"Pas tout à fait."}</b>${esc(q.ex)}</div>`:""}
      <div class="row" style="margin-top:14px">
        ${cfg.mode==="exam"?`<button class="btn primary" type="button" data-nav="next"${a?"":" disabled"}>${i+1<qs.length?"Valider et continuer":"Terminer l'examen"}</button><button class="btn" type="button" data-nav="stop">Arrêter et voir le résultat</button>`
          :`${a?`<button class="btn primary" type="button" data-nav="next">${i+1<qs.length?"Question suivante":"Voir mon score"}</button>`:""}`}
      </div>`;
  }
  el.addEventListener("click",e=>{
    const o=e.target.closest(".opt");
    if(o&&!o.disabled&&i<qs.length){const k=+o.dataset.k;if(cfg.mode!=="exam"&&ans[i])return;ans[i]={k,ok:qs[i].opts[k].ok};render();return}
    const n=e.target.closest("[data-nav]");if(!n||n.disabled)return;
    if(n.dataset.nav==="next"){i++;render()}
    else if(n.dataset.nav==="stop")finish(false);
    else if(n.dataset.nav==="again")start();
    else if(n.dataset.nav==="errors"){const wrong=qs.filter((q,k)=>!ans[k]||!ans[k].ok).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:q.opts.map(o=>o.t),a:q.opts.findIndex(o=>o.ok)}));start(wrong)}
  });
  function finish(timeout){
    clearInterval(timer);
    const total=qs.length,good=qs.filter((q,k)=>ans[k]&&ans[k].ok).length,pct=Math.round(good/total*100);
    const per={};qs.forEach((q,k)=>{if(!q.d)return;per[q.d]=per[q.d]||[0,0];per[q.d][1]++;if(ans[k]&&ans[k].ok)per[q.d][0]++});
    if(cfg.onDone)cfg.onDone({pct,good,total,per});
    const wrong=qs.map((q,k)=>({q,a:ans[k]})).filter(x=>!x.a||!x.a.ok);
    el.innerHTML=`<div class="qz-end">
      ${timeout?`<p class="note">Temps écoulé : les questions sans réponse comptent comme fausses.</p>`:""}
      <div class="score">${pct} %<small> · ${good} / ${total} bonnes réponses</small></div>
      <p style="margin:0">${pct>=80?"Excellent niveau : vous êtes prêt sur ce périmètre.":pct>=70?"Bon niveau, proche du seuil de réussite. Revoyez les erreurs ci-dessous.":"Niveau à consolider : relisez les concepts et les fiches, puis recommencez."}</p>
      ${Object.keys(per).length>1?`<div class="tblw"><table><thead><tr><th>Domaine</th><th>Score</th></tr></thead><tbody>${Object.keys(per).sort().map(d=>`<tr><td>${d}</td><td>${per[d][0]} / ${per[d][1]} (${Math.round(per[d][0]/per[d][1]*100)} %)</td></tr>`).join("")}</tbody></table></div>`:""}
      <div class="row"><button class="btn primary" type="button" data-nav="again">Recommencer</button>${wrong.length?`<button class="btn" type="button" data-nav="errors">Refaire seulement mes ${wrong.length} erreur${wrong.length>1?"s":""}</button>`:""}</div>
      ${wrong.length?`<h3 style="font-size:17px;margin-top:6px">Correction des erreurs</h3><div class="review">${wrong.map(x=>`<div><p style="margin:0 0 4px;font-weight:600">${esc(x.q.q)}</p><p style="margin:0">Bonne réponse : <strong>${esc(x.q.opts.find(o=>o.ok).t)}</strong>${x.a?` · votre réponse : <b>${esc(x.q.opts[x.a.k].t)}</b>`:" · sans réponse"}</p><p style="margin:4px 0 0;color:var(--muted)">${esc(x.q.ex)}</p></div>`).join("")}</div>`:""}
    </div>`;
  }
  return {start};
}
</script>
<script>const DOMD={"code": "D7", "name": "Opérations de sécurité", "en": "Security Operations", "w": 13, "pitch": "Faire vivre la sécurité au quotidien et tenir dans la crise : surveillance, enquêtes, incidents, correctifs, changements, sauvegardes, reprise et continuité.", "obj": [["7.1", "Comprendre et respecter les enquêtes (preuves, criminalistique, artefacts)"], ["7.2", "Conduire la journalisation et la surveillance (SIEM, SOAR, UEBA, renseignement sur les menaces)"], ["7.3", "Gérer la configuration (approvisionnement, baselines, automatisation)"], ["7.4", "Appliquer les concepts fondamentaux des opérations (besoin d'en connaître, moindre privilège, séparation des tâches, rotation, SLA)"], ["7.5", "Protéger les ressources (gestion des supports, techniques de protection)"], ["7.6", "Gérer les incidents (détection, réponse, atténuation, rapport, reprise, remédiation, leçons apprises)"], ["7.7", "Exploiter les mesures de détection et de prévention (pare-feu, IDS/IPS, listes blanches, sandbox, honeypots, anti-malware, IA)"], ["7.8", "Gérer les correctifs et les vulnérabilités"], ["7.9", "Participer à la gestion des changements"], ["7.10", "Mettre en œuvre les stratégies de reprise (sauvegardes, sites, résilience, haute disponibilité)"], ["7.11", "Mettre en œuvre les processus de reprise après sinistre (PRA)"], ["7.12", "Tester les plans de reprise"], ["7.13", "Participer à la planification et aux exercices de continuité (PCA)"], ["7.14", "Mettre en œuvre et gérer la sécurité physique"], ["7.15", "Traiter la sûreté et la sécurité du personnel (déplacements, urgence, contrainte)"]], "concepts": [["Enquêtes et preuves", "Une preuve recevable est pertinente, matérielle et compétente (obtenue légalement et fiable). Types : réelle (objet), documentaire, testimoniale, démonstrative. La meilleure preuve est l'original ; la règle du ouï-dire limite les témoignages indirects (les journaux tenus dans le cours normal des affaires y échappent généralement)."], ["Criminalistique numérique", "Identifier, préserver, collecter, examiner, analyser, présenter. On travaille sur une copie bit à bit vérifiée par empreinte, avec bloqueur d'écriture. Ordre de volatilité : registres et cache, mémoire, état réseau et processus, disque, journaux distants, archives."], ["Chaîne de possession", "Qui a collecté, quand, où, comment, qui a eu la preuve à chaque instant. Toute rupture peut rendre la preuve irrecevable."], ["Surveillance continue", "SIEM (collecte, normalisation, corrélation, alertes), SOAR (orchestration et automatisation de la réponse), UEBA (analyse comportementale des utilisateurs et entités), renseignement sur les menaces, chasse aux menaces (threat hunting)."], ["Concepts opérationnels", "Besoin d'en connaître, moindre privilège, séparation des tâches, contrôle à deux personnes, rotation des postes, congés obligatoires, gestion des comptes à privilèges, SLA et OLA avec les prestataires."], ["Gestion de configuration", "Baselines documentées, images durcies, inventaire, détection de dérive, infrastructure as code. Elle donne l'état connu à partir duquel la gestion des changements opère."], ["Gestion des changements", "Demande, analyse d'impact, approbation (CAB), test, planification, mise en œuvre, retour arrière possible, documentation, revue post-implémentation. Changements standards préapprouvés, changements d'urgence régularisés après coup."], ["Correctifs et vulnérabilités", "Inventaire, veille, évaluation, test, déploiement selon des délais par criticité, vérification. Contrôles compensatoires quand le correctif est impossible (isolement, virtual patching)."], ["Réponse aux incidents", "Détection, réponse (activer l'équipe), atténuation (confinement), rapport, reprise, remédiation (cause racine), leçons apprises. Un événement est une occurrence observable ; un incident est un événement qui menace la sécurité."], ["Prévention et détection", "Pare-feu, IDS/IPS (signatures, anomalies), listes d'autorisation d'applications (allowlisting), sandbox, honeypots et honeynets, anti-malware et EDR/XDR, outils fondés sur l'apprentissage automatique."], ["Sauvegardes", "Complète : tout, efface le bit d'archive. Incrémentielle : depuis la dernière sauvegarde, efface le bit ; sauvegarde rapide, restauration longue (complète + toutes les incrémentielles). Différentielle : depuis la dernière complète, n'efface pas le bit ; restauration = complète + dernière différentielle. Règle 3-2-1, copies immuables."], ["Sites de reprise", "Chaud (équipé et synchronisé, heures), tiède (équipé, données à charger, jours), froid (locaux et énergie, semaines), mobile, cloud, accord de réciprocité (peu fiable), multi-sites actifs."], ["Haute disponibilité", "RAID, clusters actif-actif ou actif-passif, répartition de charge, alimentation et réseau redondants, réplication synchrone (pas de perte, distance limitée) ou asynchrone (légère perte, longue distance)."], ["PRA et PCA", "Le PRA restaure l'informatique ; le PCA maintient les activités critiques, y compris en mode dégradé. Équipes, rôles, procédures de déclenchement, communication, retour au site principal (le moins critique revient en premier)."], ["Tests des plans", "Revue de checklist, walkthrough sur table, simulation, test parallèle (site de secours en même temps que la production), interruption complète (la plus réaliste et la plus risquée)."], ["Sécurité physique opérationnelle", "Contrôle d'accès périmétrique et intérieur, gestion des visiteurs, vidéosurveillance, gardiens, éclairage, détection d'intrusion, protection des supports et de la salle des preuves."], ["Sûreté du personnel", "Sécurité des déplacements (pays à risque, poste dédié), procédures d'urgence, formation, code de contrainte (duress) pour signaler discrètement une menace, gestion de crise sanitaire."]], "schemas": [{"t": "Cycle de réponse aux incidents (ISC2)", "kind": "flow", "items": [["Détection", "alerte, signalement"], ["Réponse", "activer l'équipe"], ["Atténuation", "confiner"], ["Rapport", "direction, régulateur"], ["Reprise", "restaurer"], ["Remédiation", "cause racine"], ["Leçons apprises", "améliorer"]], "note": "Mnémo : « Des Rats Attaquent, Rapidement Rattrapés, Repoussés, Leçon »."}, {"t": "Trois types de sauvegarde", "kind": "stack", "items": [["Complète", "tout · efface le bit d'archive · restauration simple"], ["Incrémentielle", "depuis la dernière sauvegarde · efface le bit · restauration = complète + toutes les incrémentielles"], ["Différentielle", "depuis la dernière complète · garde le bit · restauration = complète + dernière différentielle"]], "note": "Différentielle = Depuis la Dernière complète."}, {"t": "Tests de PRA, du plus léger au plus réaliste", "kind": "flow", "items": [["Checklist", "relecture"], ["Walkthrough", "sur table"], ["Simulation", "scénario joué"], ["Parallèle", "secours + production"], ["Interruption complète", "bascule réelle"]], "note": "« Lire, Marcher, Simuler, Doubler, Couper »."}], "tables": [{"t": "Sites de reprise", "head": ["Site", "Équipement", "Données", "Délai", "Coût"], "rows": [["Chaud", "Complet", "Synchronisées", "Minutes à heures", "Élevé"], ["Tiède", "Partiel ou complet", "À restaurer", "Heures à jours", "Moyen"], ["Froid", "Locaux, énergie", "Aucune", "Semaines", "Faible"], ["Mobile", "Conteneur équipé", "À restaurer", "Variable", "Moyen"], ["Cloud", "À la demande", "Répliquées", "Selon conception", "Variable"]]}, {"t": "Niveaux RAID", "head": ["RAID", "Principe", "Disques min.", "Tolérance"], "rows": [["0", "Agrégation (striping)", "2", "Aucune"], ["1", "Miroir", "2", "1 disque"], ["5", "Agrégation avec parité répartie", "3", "1 disque"], ["6", "Double parité", "4", "2 disques"], ["10 (1+0)", "Miroirs agrégés", "4", "1 disque par miroir"]]}, {"t": "Admissibilité des preuves", "head": ["Critère", "Signification"], "rows": [["Pertinente", "En lien avec les faits jugés"], ["Matérielle", "Importante pour l'affaire"], ["Compétente", "Obtenue légalement, fiable, avec chaîne de possession"], ["Meilleure preuve", "Original plutôt que copie lorsque possible"]]}], "scen": [["Le SOC détecte un poste qui communique avec un serveur de commande et contrôle connu.", "Que faire EN PREMIER ?", "Isoler le poste du réseau sans l'éteindre, puis activer la procédure de réponse aux incidents.", "Le confinement limite la propagation ; l'extinction détruirait les preuves en mémoire."], ["Un ransomware a chiffré les serveurs ; les sauvegardes en ligne sont aussi chiffrées.", "Quelle leçon pour la stratégie de sauvegarde ?", "Disposer de copies hors ligne ou immuables, isolées du domaine et testées régulièrement.", "Une sauvegarde accessible avec les mêmes identifiants que la production tombe avec elle."], ["Un correctif critique est publié pour une faille activement exploitée sur des serveurs exposés.", "Quelle approche ?", "Appliquer le processus de changement d'urgence : test accéléré, déploiement rapide, documentation et revue a posteriori.", "Le risque d'exploitation dépasse le risque d'un test réduit ; le processus d'urgence garde la traçabilité."], ["Après une bascule réussie vers le site de secours, le site principal est réparé.", "Quelles applications revenir en premier ?", "Les moins critiques d'abord, pour valider le site principal avant d'y ramener les activités critiques.", "On ne risque pas les activités vitales sur un site non encore éprouvé."], ["Un administrateur trouve des fichiers illicites sur le poste d'un collègue.", "Que doit-il faire ?", "Ne rien modifier, sécuriser le poste, prévenir la hiérarchie, le juridique et l'équipe d'enquête selon la procédure.", "Une manipulation non contrôlée peut détruire la valeur probante et exposer l'administrateur."], ["La direction veut tester le PRA sans aucun risque pour la production.", "Quel test proposer ?", "Un exercice sur table ou une simulation, puis un test parallèle quand l'équipe est prête.", "L'interruption complète est réservée aux plans matures, avec accord de la direction."], ["Un employé appelle le standard en utilisant le mot de code convenu pour signaler une contrainte.", "Que faire ?", "Appliquer discrètement la procédure de contrainte : alerter la sécurité et les autorités sans révéler la détection.", "Le code de contrainte protège la personne menacée ; la sécurité des personnes prime."]], "quiz": [["Quelle est la première étape du processus de réponse aux incidents selon l'(ISC)² ?", ["Réponse", "Détection", "Atténuation", "Rapport"], 1, "Détection, réponse, atténuation, rapport, reprise, remédiation, leçons apprises."], ["Une sauvegarde différentielle contient :", ["Les changements depuis la dernière sauvegarde, quelle qu'elle soit", "Les changements depuis la dernière sauvegarde complète", "Tout le système", "Uniquement les fichiers système"], 1, "Elle grossit jusqu'à la prochaine complète."], ["Quelle stratégie de sauvegarde offre la restauration la plus lente ?", ["Complète quotidienne", "Complète + différentielles", "Complète + incrémentielles", "Miroir"], 2, "Il faut restaurer la complète puis chaque incrémentielle dans l'ordre."], ["Quel site de secours offre la reprise la plus rapide ?", ["Froid", "Tiède", "Chaud", "Accord de réciprocité"], 2, "Le site chaud est équipé et synchronisé."], ["Quel niveau RAID n'offre aucune tolérance aux pannes ?", ["RAID 0", "RAID 1", "RAID 5", "RAID 6"], 0, "RAID 0 agrège sans redondance."], ["Lors d'une enquête, quelle donnée collecter en premier ?", ["Le disque dur", "La mémoire vive", "Les sauvegardes", "Les journaux archivés"], 1, "Ordre de volatilité : la mémoire disparaît à l'extinction."], ["Un système d'exploitation compromis doit être en priorité :", ["Éteint immédiatement", "Isolé du réseau", "Formaté", "Redémarré"], 1, "Isoler confine sans perdre les preuves volatiles."], ["Quel test de PRA fait fonctionner le site de secours en même temps que la production ?", ["Walkthrough", "Simulation", "Parallèle", "Interruption complète"], 2, "Le test parallèle valide le secours sans arrêter la production."], ["Le CAB intervient dans :", ["La réponse aux incidents", "La gestion des changements", "La gestion des correctifs uniquement", "L'audit"], 1, "Le Change Advisory Board évalue et approuve les changements."], ["Laisser une opportunité à un attaquant déjà intéressé grâce à un honeypot est :", ["De l'entrapment, illégal", "De l'enticement, généralement légal", "Une attaque", "Interdit dans tous les cas"], 1, "L'incitation passive est admise ; la provocation au délit ne l'est pas."], ["La règle 3-2-1 signifie :", ["3 sauvegardes par jour, 2 par semaine, 1 par mois", "3 copies, sur 2 supports différents, dont 1 hors site", "3 sites, 2 opérateurs, 1 cloud", "3 tests, 2 restaurations, 1 audit"], 1, "Elle protège contre la perte d'un support ou d'un site."], ["Une preuve obtenue illégalement sera probablement jugée :", ["Pertinente", "Non compétente donc irrecevable", "Meilleure preuve", "Matérielle"], 1, "La compétence suppose une collecte légale et fiable."], ["La rotation des postes est principalement un contrôle :", ["Correctif", "Détectif et dissuasif", "De récupération", "Compensatoire"], 1, "Un nouveau titulaire peut découvrir des irrégularités."], ["UEBA sert à :", ["Chiffrer les journaux", "Détecter les comportements anormaux d'utilisateurs et d'entités", "Gérer les correctifs", "Répartir la charge"], 1, "User and Entity Behavior Analytics."], ["Quelle réplication garantit zéro perte de données mais limite la distance ?", ["Asynchrone", "Synchrone", "Différée", "Par bande"], 1, "La réplication synchrone attend la confirmation du site distant."], ["Un changement d'urgence doit être :", ["Ignoré par le processus", "Réalisé puis documenté et revu après coup", "Interdit", "Approuvé uniquement par le développeur"], 1, "Le processus d'urgence garde la traçabilité."], ["Lors du retour au site principal, on rapatrie d'abord :", ["Les applications les plus critiques", "Les applications les moins critiques", "Toutes en même temps", "Les sauvegardes"], 1, "On valide le site principal avec le moins critique."], ["Un événement devient un incident lorsqu'il :", ["Est journalisé", "Menace la confidentialité, l'intégrité ou la disponibilité", "Est détecté par l'IDS", "Se produit la nuit"], 1, "Tout incident est un événement, l'inverse n'est pas vrai."], ["Le meilleur moyen d'empêcher l'exécution de logiciels non autorisés est :", ["Un antivirus à signatures", "Une liste d'autorisation d'applications (allowlisting)", "Un IDS", "Un pare-feu réseau"], 1, "Seules les applications approuvées peuvent s'exécuter."], ["Le code de contrainte (duress) permet :", ["De réinitialiser un mot de passe", "De signaler discrètement qu'on agit sous la menace", "De désactiver l'alarme", "D'ouvrir un sas"], 1, "Il alerte la sécurité sans que l'agresseur le sache."]], "glo": [["Chain of custody", "Chaîne de possession", "Traçabilité des manipulations d'une preuve."], ["Order of volatility", "Ordre de volatilité", "Collecter d'abord le plus éphémère."], ["Write blocker", "Bloqueur d'écriture", "Empêche toute modification du support analysé."], ["Hearsay", "Ouï-dire", "Témoignage indirect, souvent irrecevable."], ["Event / Incident", "Événement / Incident", "Occurrence observable / atteinte à la sécurité."], ["Containment", "Confinement", "Limiter l'extension d'un incident."], ["Root cause analysis", "Analyse des causes racines", "Recherche de l'origine profonde."], ["Change advisory board (CAB)", "Comité consultatif des changements", "Approuve les changements."], ["Hot / Warm / Cold site", "Site chaud / tiède / froid", "Niveaux de préparation des sites de reprise."], ["Mean time between failures (MTBF)", "Temps moyen entre pannes", "Fiabilité d'un composant."], ["Mean time to repair (MTTR)", "Temps moyen de réparation", "Délai de remise en état."], ["Tabletop exercise", "Exercice sur table", "Simulation discutée en salle."], ["Duress", "Contrainte", "Situation de menace sur une personne."], ["Allowlisting", "Liste d'autorisation", "Seul ce qui est approuvé s'exécute."]], "check": ["Je cite les 7 étapes de la réponse aux incidents dans l'ordre.", "Je connais l'ordre de volatilité.", "Je sais ce qui rend une preuve recevable et ce qu'est la chaîne de possession.", "Je distingue sauvegardes complète, incrémentielle et différentielle et leur restauration.", "Je compare les sites chaud, tiède et froid.", "Je connais RAID 0, 1, 5, 6 et 10.", "Je cite les 5 types de tests de PRA dans l'ordre.", "Je décris le processus de gestion des changements et le changement d'urgence.", "Je distingue enticement et entrapment.", "Je sais quoi rapatrier en premier sur le site principal.", "Je distingue PRA et PCA."]};const META={"count": 28, "prev": {"href": "d6.html", "label": "D6 · Évaluation et tests de sécurité"}, "next": {"href": "d8.html", "label": "D8 · Sécurité du développement logiciel"}};</script>
<script>(function(){

function schemaHTML(s){

}
const SECS=[["objectifs","Objectifs officiels"],["concepts","Concepts clés"],["schemas","Schémas"],["comparatifs","Comparatifs"],["scenarios","Scénarios d'examen"],["quiz","Quiz"],["glossaire","Glossaire FR-EN"],["checklist","Checklist"]];

document.getElementById("app").innerHTML=`
<section class="hero"><div class="wrap hero-in">

  <section class="sec" id="scenarios"><div class="sec-h"><h2><span class="n">05</span>Scénarios d'examen</h2><p>Réfléchissez en manager, puis révélez la réponse</p></div>

$$("[data-rev]").forEach(b=>b.addEventListener("click",()=>{const a=b.closest(".scen").querySelector(".ans");a.hidden=!a.hidden;b.textContent=a.hidden?"Voir la réponse":"Masquer la réponse"}));

function glo(){const q=norm($("#gs").value.trim());const rows=d.glo.filter(g=>!q||norm(g.join(" ")).includes(q));
  $("#gb").innerHTML=rows.length?rows.map(g=>`<tr><td>${esc(g[0])}</td><td>${esc(g[1])}</td><td>${esc(g[2])}</td></tr>`).join(""):`<tr><td colspan="3" style="font-weight:400;color:var(--muted)">Aucun terme trouvé.</td></tr>`}
$("#gs").addEventListener("input",glo);glo();
// Checklist

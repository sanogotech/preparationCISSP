<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>CISSP D3 · Architecture et ingénierie de sécurité</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap">
<style>/* Layout : portail de révision — barre de navigation fixe, en-tête de domaine, sections empilées avec sommaire */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#101B2B; --muted:#5A6879; --line:#D7DEE7;
  --accent:#1F4E9E; --accent-soft:#E3EBF8; --on-accent:#FFFFFF;
  --ok:#2E7D46; --ok-soft:#E3F2E8; --bad:#B3262F; --bad-soft:#FBE7E8; --warn:#B0680A;
  --hl:#FFF4D6; --hl-ink:#6B4B00;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-quote:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}

/* Barre du portail */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.pbar-in{display:flex;align-items:center;gap:14px;padding-block:9px;overflow-x:auto;scrollbar-width:none}
.pbar-in::-webkit-scrollbar{display:none}
.logo{font-family:var(--f-disp);font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo span{color:var(--accent)}
.pnav{display:flex;gap:4px}
.pnav a{font-family:var(--f-mono);font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);padding:5px 9px;border-radius:6px;white-space:nowrap}
.pnav a:hover{background:var(--sunk);color:var(--ink)}
.pnav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

/* En-tête de page */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero-in{padding-block:26px 18px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.hero h1 .code{color:var(--accent);margin-right:10px}
.en{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pitch{max-width:72ch;margin:0;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.stat{display:flex;flex-direction:column;gap:2px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:150px;text-decoration:none;color:var(--ink)}
.stat b{font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
a.stat:hover{border-color:var(--accent)}
.toc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.toc::-webkit-scrollbar{display:none}
.toc a{font-size:13px;font-weight:500;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)}
.toc a:hover{color:var(--ink);border-color:var(--accent)}

main{padding-block:10px 60px}
.sec{padding-top:34px;scroll-margin-top:60px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h .n{font-family:var(--f-mono);font-size:13px;color:var(--accent);margin-right:8px}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}

/* Objectifs */
.obj{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:8px}
.obj li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.obj b{font-family:var(--f-mono);color:var(--accent);font-size:13px}

/* Concepts */
.concepts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.concept h3{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
.concept h3 i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.concept p{margin:0;font-size:14.5px}

/* Schémas */
.schemas{display:flex;flex-direction:column;gap:14px}
.schema h3{font-size:18px;margin-bottom:12px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 130px;min-width:0;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:7px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.flow .st b{font-family:var(--f-disp);font-size:15px}
.flow .st span{font-size:12.5px;color:var(--muted)}
.flow .ar{align-self:center;color:var(--muted);font-family:var(--f-mono)}
.cycle-back{margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:4px}
.stack .ly{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:14px}
.stack .ly b{font-family:var(--f-disp);font-size:15px}
.stack .ly span{color:var(--muted)}
.note{margin:10px 0 0;font-size:13px;color:var(--hl-ink);background:var(--hl);display:inline-block;padding:4px 10px;border-radius:6px}

/* Tableaux */
.tables{display:flex;flex-direction:column;gap:14px}
.tables h3{font-size:18px;margin-bottom:10px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td:first-child{font-weight:600}

/* Scénarios */
.scens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.scen .sit{margin:0;font-size:14.5px}
.scen .q{margin:0;font-weight:600;font-family:var(--f-disp);font-size:16px;color:var(--accent)}
.scen .ans{background:var(--ok-soft);border-radius:7px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.scen .ans p{margin:0}
.scen .why{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:13.5px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Quiz */
.quiz{max-width:820px}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--muted)}
.qz-prog{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:14px}
.qz-prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qz-q{font-family:var(--f-disp);font-size:20px;font-weight:600;margin:0 0 14px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--bg);border-left:4px solid var(--muted);font-size:14.5px}
.fb.ok{border-left-color:var(--ok)}.fb.ko{border-left-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.qz-end{display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1}
.score small{font-size:18px;color:var(--muted);font-weight:500}
.review{display:flex;flex-direction:column;gap:8px}
.review div{background:var(--bg);border-radius:7px;padding:10px 12px;font-size:14px}
.review b{color:var(--bad)}

/* Glossaire */
.glo-s{max-width:320px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.glo td:first-child{font-family:var(--f-mono);font-size:13px}

/* Checklist */
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-width:820px}
.chk label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14.5px}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;max-width:820px;margin-bottom:10px}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1 1 220px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pager a.next{text-align:right}
.foot{margin-top:30px;font-size:12px;color:var(--muted)}

@media (max-width:760px){
  .hero h1{font-size:26px}
  .concepts,.scens{grid-template-columns:minmax(0,1fr)}
  .stack .ly{grid-template-columns:minmax(0,1fr);gap:2px}
  .flow .ar{display:none}
  .flow .st{flex-basis:100%}
  .stat{min-width:0;flex:1 1 40%}
}
</style>
</head><body>
<header class="pbar"><div class="wrap pbar-in"><a class="logo" href="index.html">CISO <span>Portail</span></a><nav class="pnav" aria-label="Modules"><a href="index.html">Portail</a><a href="mindset.html">Mindset 150</a><a href="d1.html">D1</a><a href="d2.html">D2</a><a href="d3.html" aria-current="page">D3</a><a href="d4.html">D4</a><a href="d5.html">D5</a><a href="d6.html">D6</a><a href="d7.html">D7</a><a href="d8.html">D8</a></nav></div></header>
<div id="app"></div>
<script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const LETTERS="ABCD";

/* Moteur de quiz : mode « learn » (correction immédiate) ou « exam » (correction à la fin) */
function Quiz(el,questions,cfg){
  cfg=cfg||{};
  let qs,i,ans,timer,deadline;
  function start(list){
    qs=(list||questions).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:shuffle(q.opts.map((t,k)=>({t,ok:k===q.a})))}));
    i=0;ans=[];
    clearInterval(timer);
    if(cfg.minutes){deadline=Date.now()+cfg.minutes*60000;timer=setInterval(tick,1000)}
    render();
  }
  function tick(){const r=deadline-Date.now();const t=el.querySelector(".qz-time");if(t)t.textContent=fmt(r);if(r<=0){clearInterval(timer);finish(true)}}
  const fmt=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,"0")}`};
  function render(){
    if(i>=qs.length)return finish(false);
    const q=qs[i],a=ans[i],good=ans.filter(x=>x&&x.ok).length;
    el.innerHTML=`<div class="qz-top"><span>Question <b>${i+1}</b> / ${qs.length}${q.d&&cfg.showDom?` · <span class="en">${q.d}</span>`:""}</span>
      <span>${cfg.mode==="exam"?(cfg.minutes?`Temps restant <b class="qz-time">${fmt(deadline-Date.now())}</b>`:""):`Score <b>${good}</b> / ${ans.filter(Boolean).length}`}</span></div>
      <div class="qz-prog"><i style="width:${i/qs.length*100}%"></i></div>
      <p class="qz-q">${esc(q.q)}</p>
      <div class="opts">${q.opts.map((o,k)=>{
        let cls="opt";
        if(a){ if(cfg.mode==="exam"){if(a.k===k)cls+=" picked"} else {if(o.ok)cls+=" good";else if(a.k===k)cls+=" wrong"} }
        return `<button class="${cls}" type="button" data-k="${k}"${a&&cfg.mode!=="exam"?" disabled":""}><span class="k">${LETTERS[k]}</span><span>${esc(o.t)}</span></button>`}).join("")}</div>
      ${a&&cfg.mode!=="exam"?`<div class="fb ${a.ok?"ok":"ko"}"><b>${a.ok?"Bonne réponse.":"Pas tout à fait."}</b>${esc(q.ex)}</div>`:""}
      <div class="row" style="margin-top:14px">
        ${cfg.mode==="exam"?`<button class="btn primary" type="button" data-nav="next"${a?"":" disabled"}>${i+1<qs.length?"Valider et continuer":"Terminer l'examen"}</button><button class="btn" type="button" data-nav="stop">Arrêter et voir le résultat</button>`
          :`${a?`<button class="btn primary" type="button" data-nav="next">${i+1<qs.length?"Question suivante":"Voir mon score"}</button>`:""}`}
      </div>`;
  }
  el.addEventListener("click",e=>{
    const o=e.target.closest(".opt");
    if(o&&!o.disabled&&i<qs.length){const k=+o.dataset.k;if(cfg.mode!=="exam"&&ans[i])return;ans[i]={k,ok:qs[i].opts[k].ok};render();return}
    const n=e.target.closest("[data-nav]");if(!n||n.disabled)return;
    if(n.dataset.nav==="next"){i++;render()}
    else if(n.dataset.nav==="stop")finish(false);
    else if(n.dataset.nav==="again")start();
    else if(n.dataset.nav==="errors"){const wrong=qs.filter((q,k)=>!ans[k]||!ans[k].ok).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:q.opts.map(o=>o.t),a:q.opts.findIndex(o=>o.ok)}));start(wrong)}
  });
  function finish(timeout){
    clearInterval(timer);
    const total=qs.length,good=qs.filter((q,k)=>ans[k]&&ans[k].ok).length,pct=Math.round(good/total*100);
    const per={};qs.forEach((q,k)=>{if(!q.d)return;per[q.d]=per[q.d]||[0,0];per[q.d][1]++;if(ans[k]&&ans[k].ok)per[q.d][0]++});
    if(cfg.onDone)cfg.onDone({pct,good,total,per});
    const wrong=qs.map((q,k)=>({q,a:ans[k]})).filter(x=>!x.a||!x.a.ok);
    el.innerHTML=`<div class="qz-end">
      ${timeout?`<p class="note">Temps écoulé : les questions sans réponse comptent comme fausses.</p>`:""}
      <div class="score">${pct} %<small> · ${good} / ${total} bonnes réponses</small></div>
      <p style="margin:0">${pct>=80?"Excellent niveau : vous êtes prêt sur ce périmètre.":pct>=70?"Bon niveau, proche du seuil de réussite. Revoyez les erreurs ci-dessous.":"Niveau à consolider : relisez les concepts et les fiches, puis recommencez."}</p>
      ${Object.keys(per).length>1?`<div class="tblw"><table><thead><tr><th>Domaine</th><th>Score</th></tr></thead><tbody>${Object.keys(per).sort().map(d=>`<tr><td>${d}</td><td>${per[d][0]} / ${per[d][1]} (${Math.round(per[d][0]/per[d][1]*100)} %)</td></tr>`).join("")}</tbody></table></div>`:""}
      <div class="row"><button class="btn primary" type="button" data-nav="again">Recommencer</button>${wrong.length?`<button class="btn" type="button" data-nav="errors">Refaire seulement mes ${wrong.length} erreur${wrong.length>1?"s":""}</button>`:""}</div>
      ${wrong.length?`<h3 style="font-size:17px;margin-top:6px">Correction des erreurs</h3><div class="review">${wrong.map(x=>`<div><p style="margin:0 0 4px;font-weight:600">${esc(x.q.q)}</p><p style="margin:0">Bonne réponse : <strong>${esc(x.q.opts.find(o=>o.ok).t)}</strong>${x.a?` · votre réponse : <b>${esc(x.q.opts[x.a.k].t)}</b>`:" · sans réponse"}</p><p style="margin:4px 0 0;color:var(--muted)">${esc(x.q.ex)}</p></div>`).join("")}</div>`:""}
    </div>`;
  }
  return {start};
}
</script>
<script>const DOMD={"code": "D3", "name": "Architecture et ingénierie de sécurité", "en": "Security Architecture and Engineering", "w": 13, "pitch": "Concevoir des systèmes sûrs par construction : principes de conception, modèles formels, architectures, cryptographie et sécurité physique des sites.", "obj": [["3.1", "Mettre en œuvre des processus d'ingénierie fondés sur des principes de conception sécurisée"], ["3.2", "Comprendre les concepts fondamentaux des modèles de sécurité"], ["3.3", "Choisir les contrôles selon les exigences de sécurité des systèmes"], ["3.4", "Comprendre les capacités de sécurité des systèmes d'information (TPM, HSM, mémoire protégée)"], ["3.5", "Évaluer et atténuer les vulnérabilités des architectures (cloud, IoT, ICS, conteneurs, serverless…)"], ["3.6", "Choisir et déterminer les solutions cryptographiques"], ["3.7", "Comprendre les méthodes d'attaques cryptanalytiques"], ["3.8", "Appliquer les principes de sécurité à la conception des sites"], ["3.9", "Concevoir les contrôles de sécurité des sites et installations"], ["3.10", "Gérer le cycle de vie des systèmes d'information"]], "concepts": [["Principes de conception sécurisée", "Moindre privilège, défense en profondeur, réglages sûrs par défaut, défaillance sécurisée, séparation des tâches, simplicité, Zero Trust, privacy by design, responsabilité partagée, SASE. Les principes historiques de Saltzer et Schroeder (1975) restent la référence."], ["Modèles de machine à états et de flux", "Un système est sûr s'il démarre dans un état sûr et que chaque transition conserve cet état. Les modèles de flux d'information contrôlent comment l'information circule entre niveaux. La non-interférence garantit qu'un niveau haut n'influence pas ce que voit un niveau bas."], ["Bell-LaPadula", "Confidentialité, contrôle d'accès obligatoire. Simple security property : pas de lecture au-dessus (no read up). Star property : pas d'écriture en dessous (no write down). Strong star : lecture et écriture seulement à son niveau."], ["Biba", "Intégrité. Simple integrity : pas de lecture en dessous (no read down). Star integrity : pas d'écriture au-dessus (no write up). Invocation : un sujet ne peut pas invoquer un sujet de niveau supérieur."], ["Clark-Wilson", "Intégrité commerciale : l'utilisateur n'accède aux données contraintes (CDI) qu'à travers des procédures de transformation (TP) certifiées. Les UDI sont des données non contrôlées ; les IVP vérifient l'intégrité. Triplet d'accès sujet-programme-objet et séparation des tâches."], ["Autres modèles", "Brewer-Nash (muraille de Chine, conflits d'intérêts), Graham-Denning (8 règles de création et suppression de sujets et objets), Harrison-Ruzzo-Ullman (modification des droits), Take-Grant (graphe de transfert de droits), treillis (lattice, bornes supérieure et inférieure)."], ["Évaluation et assurance", "Common Criteria (ISO 15408) : Protection Profile (besoin), Security Target (prétentions du produit), EAL1 à EAL7. La certification évalue techniquement ; l'accréditation (ou autorisation) est la décision formelle de la direction d'accepter le système."], ["Capacités matérielles", "TPM : puce qui stocke clés et mesures de démarrage (secure boot, chiffrement de disque). HSM : module dédié à la génération et la protection des clés. Isolation des processus, mémoire protégée, anneaux de protection (ring 0 = noyau)."], ["Vulnérabilités d'architecture", "Bases de données : agrégation (des données anodines combinées deviennent sensibles) et inférence (déduire une information cachée) ; contre-mesures : polyinstanciation, perturbation. Virtualisation : évasion de VM. Conteneurs : images vulnérables, noyau partagé. Serverless et microservices : surface d'API, gestion des secrets."], ["Systèmes embarqués, IoT et ICS", "Ressources limitées, mots de passe par défaut, correctifs rares, longue durée de vie. Pour les ICS (SCADA, automates), la disponibilité et la sûreté priment ; on segmente fortement et on surveille passivement."], ["Cryptographie symétrique", "Une seule clé partagée. Rapide, adaptée aux gros volumes. AES (bloc 128 bits, clés 128/192/256), 3DES (obsolète), Blowfish, Twofish, ChaCha20 (flux). Problème : distribution des clés, n(n−1)/2 clés pour n personnes."], ["Modes de chiffrement", "ECB (à proscrire : mêmes blocs clairs = mêmes blocs chiffrés), CBC (chaînage avec IV), CTR (compteur, parallélisable), GCM (chiffrement authentifié : confidentialité et intégrité). Le choix du mode compte autant que l'algorithme."], ["Cryptographie asymétrique", "Paire de clés publique et privée. RSA (factorisation), ECC (courbes elliptiques, clés plus courtes à sécurité égale), Diffie-Hellman (échange de clés), ElGamal, DSA/ECDSA (signature). Lente, utilisée pour l'échange de clés et la signature."], ["Hachage, MAC et signature", "Hachage : empreinte à sens unique (SHA-2, SHA-3). HMAC : hachage avec clé secrète, prouve intégrité et origine entre deux parties. Signature numérique : hachage chiffré avec la clé privée de l'émetteur, apporte la non-répudiation."], ["PKI", "Autorité de certification (CA) qui signe, autorité d'enregistrement (RA) qui vérifie l'identité, certificats X.509, révocation par CRL ou OCSP (stapling). La racine reste hors ligne. Le pinning limite les certificats acceptés."], ["Attaques cryptanalytiques", "Force brute, texte chiffré seul, texte clair connu, texte clair choisi, texte chiffré choisi, analyse de fréquence, attaque des anniversaires (collisions de hachage), meet-in-the-middle (raison de l'échec du 2DES), canaux auxiliaires (temps, consommation), rejeu, pass-the-hash, attaques d'implémentation."], ["Conception des sites", "CPTED : surveillance naturelle, contrôle naturel des accès, renforcement territorial. Zones concentriques, salle serveurs au centre du bâtiment, sans fenêtres, pas au sous-sol (inondation) ni au dernier étage (toit)."], ["Énergie, climat et incendie", "Onduleurs et groupes électrogènes, double alimentation. Humidité 40 à 60 % (trop sèche : électricité statique ; trop humide : corrosion). Détection précoce, extinction par pré-action ou gaz. Feux de classe C (électrique) : pas d'eau tant que le courant n'est pas coupé."]], "schemas": [{"t": "Bell-LaPadula vs Biba", "kind": "stack", "items": [["Niveau haut", "BLP : on n'y lit pas (no read up) · Biba : on n'y écrit pas (no write up)"], ["Niveau du sujet", "lecture et écriture autorisées"], ["Niveau bas", "BLP : on n'y écrit pas (no write down) · Biba : on n'y lit pas (no read down)"]], "note": "BLP protège la confidentialité ; Biba en est le miroir pour l'intégrité."}, {"t": "Chiffrement hybride (ex. TLS)", "kind": "flow", "items": [["Asymétrique", "échange ou accord de clé (ECDHE)"], ["Clé de session", "symétrique, éphémère"], ["Symétrique", "AES-GCM pour les données"], ["Intégrité", "AEAD ou HMAC"]], "note": "L'asymétrique résout la distribution des clés ; le symétrique apporte la vitesse."}, {"t": "Signer et chiffrer", "kind": "flow", "items": [["Hacher le message", "SHA-256"], ["Signer", "empreinte + clé PRIVÉE de l'émetteur"], ["Chiffrer", "clé PUBLIQUE du destinataire"], ["Destinataire", "déchiffre avec sa privée, vérifie avec la publique de l'émetteur"]], "note": "Je signe avec MA privée ; je chiffre avec TA publique."}], "tables": [{"t": "Modèles de sécurité", "head": ["Modèle", "Protège", "Règles clés"], "rows": [["Bell-LaPadula", "Confidentialité", "No read up, no write down"], ["Biba", "Intégrité", "No read down, no write up"], ["Clark-Wilson", "Intégrité", "Transactions bien formées, triplet, séparation des tâches"], ["Brewer-Nash", "Conflits d'intérêts", "Accès dynamique selon l'historique"], ["Graham-Denning", "Gestion des droits", "8 règles sur sujets et objets"], ["Take-Grant", "Transfert de droits", "Graphe : take, grant, create, remove"]]}, {"t": "Algorithmes à connaître", "head": ["Algorithme", "Type", "Clé / taille", "Statut"], "rows": [["DES", "Symétrique (bloc 64)", "56 bits", "Cassé"], ["3DES", "Symétrique", "112 à 168 bits", "Obsolète"], ["AES", "Symétrique (bloc 128)", "128 / 192 / 256", "Standard"], ["RC4", "Symétrique (flux)", "Variable", "Cassé"], ["RSA", "Asymétrique", "2048 bits minimum", "Usuel"], ["ECC", "Asymétrique", "256 bits ≈ RSA 3072", "Recommandé"], ["Diffie-Hellman", "Échange de clés", "—", "Usuel (ECDHE)"], ["MD5 / SHA-1", "Hachage", "128 / 160 bits", "Obsolètes"], ["SHA-256 / SHA-3", "Hachage", "256 bits et plus", "Recommandés"]]}, {"t": "Perturbations électriques", "head": ["Terme", "Durée", "Nature"], "rows": [["Fault", "Momentanée", "Perte de courant"], ["Blackout", "Prolongée", "Perte de courant"], ["Sag", "Momentanée", "Tension basse"], ["Brownout", "Prolongée", "Tension basse"], ["Spike", "Momentanée", "Surtension"], ["Surge", "Prolongée", "Surtension"], ["Inrush", "Au démarrage", "Appel de courant initial"]]}], "scen": [["Un éditeur propose un algorithme de chiffrement propriétaire « secret, donc plus sûr ».", "Quelle est la MEILLEURE réponse ?", "Refuser et exiger un algorithme standard, public et éprouvé (AES, par exemple).", "Principe de Kerckhoffs : la sécurité doit reposer sur la clé, pas sur le secret de l'algorithme."], ["Des données de faible sensibilité, combinées dans un entrepôt, permettent de déduire les déplacements des dirigeants.", "De quel problème s'agit-il et quelle contre-mesure ?", "Agrégation et inférence ; contrôler l'accès aux combinaisons, polyinstanciation ou perturbation des résultats.", "La sensibilité d'un ensemble peut dépasser celle de chacun de ses éléments."], ["Un message doit être confidentiel ET prouver l'identité de son auteur de façon non répudiable.", "Quelle combinaison utiliser ?", "Signer avec la clé privée de l'émetteur, puis chiffrer avec la clé publique du destinataire (ou une clé de session protégée par celle-ci).", "La signature apporte origine et non-répudiation ; le chiffrement apporte la confidentialité."], ["Une architecture conteneurisée tourne avec des images téléchargées publiquement et des conteneurs exécutés en root.", "Que recommander EN PREMIER ?", "Utiliser des images de confiance analysées et signées, et exécuter les conteneurs avec le moindre privilège.", "Les conteneurs partagent le noyau de l'hôte : un conteneur root compromis menace tout l'hôte."], ["Un incendie se déclare dans la salle serveurs pendant les heures de travail.", "Quelle est la priorité ?", "Évacuer le personnel, puis laisser le système d'extinction et les secours agir.", "La sécurité des personnes passe toujours avant les équipements."], ["La clé privée de la CA émettrice d'une entreprise est soupçonnée d'être compromise.", "Que faire ?", "Révoquer le certificat de la CA, publier la révocation, réémettre une nouvelle hiérarchie et tous les certificats dépendants.", "Tous les certificats signés par une clé compromise perdent leur valeur de confiance."]], "quiz": [["Quelle propriété de Bell-LaPadula interdit d'écrire vers un niveau inférieur ?", ["Simple security property", "Star (*) property", "Strong star property", "Simple integrity property"], 1, "La propriété étoile (*) : no write down."], ["Quel modèle protège l'intégrité avec « no read down, no write up » ?", ["Bell-LaPadula", "Biba", "Brewer-Nash", "Take-Grant"], 1, "Biba est le modèle d'intégrité miroir de Bell-LaPadula."], ["Combien de clés symétriques faut-il pour 50 personnes communiquant deux à deux ?", ["100", "1 225", "2 450", "2 500"], 1, "n(n−1)/2 = 50 × 49 / 2 = 1 225."], ["Quel mode de chiffrement est à proscrire car il révèle les motifs des données ?", ["CBC", "GCM", "ECB", "CTR"], 2, "ECB chiffre chaque bloc indépendamment : des blocs clairs identiques donnent des blocs chiffrés identiques."], ["Pour vérifier une signature numérique, le destinataire utilise :", ["Sa clé privée", "Sa clé publique", "La clé publique de l'émetteur", "La clé privée de l'émetteur"], 2, "La signature est faite avec la clé privée de l'émetteur et vérifiée avec sa clé publique."], ["Quelle attaque explique pourquoi le double DES n'apporte presque aucun gain ?", ["Attaque des anniversaires", "Meet-in-the-middle", "Analyse de fréquence", "Rejeu"], 1, "L'attaque par le milieu réduit l'effort à peine au-dessus du simple DES."], ["Le principe de Kerckhoffs affirme que :", ["L'algorithme doit rester secret", "Seule la clé doit rester secrète", "Les clés doivent faire 256 bits", "Le chiffrement asymétrique est supérieur"], 1, "Un système doit rester sûr même si tout est public, sauf la clé."], ["Quel modèle traite des conflits d'intérêts ?", ["Clark-Wilson", "Brewer-Nash", "Biba", "Graham-Denning"], 1, "Brewer-Nash (Chinese Wall) adapte dynamiquement les accès."], ["Dans Common Criteria, le document qui décrit les prétentions de sécurité d'un produit est :", ["Le Protection Profile", "La Security Target", "L'EAL", "La Target of Evaluation"], 1, "La Security Target décrit ce que le produit prétend faire ; le Protection Profile exprime un besoin."], ["Quel système d'extinction convient le mieux à une salle serveurs utilisant l'eau ?", ["Wet pipe", "Deluge", "Pré-action", "Sprinkler classique"], 2, "Le pré-action exige deux conditions avant de libérer l'eau, ce qui limite les déclenchements accidentels."], ["Une baisse de tension prolongée est appelée :", ["Sag", "Brownout", "Fault", "Spike"], 1, "Brownout = tension basse prolongée ; sag = momentanée."], ["Quel composant stocke les mesures de démarrage et des clés sur la carte mère ?", ["HSM", "TPM", "BIOS", "GPU"], 1, "Le TPM est soudé à la carte mère et sert au secure boot et au chiffrement de disque."], ["Quelle contre-mesure lutte contre l'inférence dans une base de données ?", ["Indexation", "Polyinstanciation", "Normalisation", "Réplication"], 1, "La polyinstanciation crée plusieurs versions d'un enregistrement selon le niveau d'habilitation."], ["Un HMAC fournit :", ["Confidentialité seule", "Intégrité et authentification de l'origine, sans non-répudiation", "Non-répudiation", "Disponibilité"], 1, "La clé est partagée : les deux parties peuvent produire le HMAC, donc pas de non-répudiation."], ["Quel algorithme sert principalement à l'échange de clés ?", ["AES", "SHA-256", "Diffie-Hellman", "RC4"], 2, "Diffie-Hellman permet à deux parties d'établir une clé partagée sur un canal non sûr."], ["La décision formelle de la direction d'accepter un système pour l'exploiter s'appelle :", ["Certification", "Accréditation (autorisation)", "Évaluation", "Validation"], 1, "La certification est l'évaluation technique ; l'accréditation est la décision de la direction."], ["Dans le modèle de responsabilité partagée IaaS, qui corrige le système d'exploitation invité ?", ["Le fournisseur", "Le client", "Les deux à parts égales", "Personne"], 1, "En IaaS, le client gère l'OS, les applications et les données."], ["Une attaque qui mesure la consommation électrique d'une carte à puce pour retrouver la clé est :", ["Force brute", "Canal auxiliaire", "Texte clair choisi", "Rejeu"], 1, "Les attaques par canaux auxiliaires exploitent temps, consommation ou émissions."], ["L'humidité recommandée dans une salle informatique est d'environ :", ["10 à 20 %", "40 à 60 %", "70 à 80 %", "90 %"], 1, "Trop sec favorise l'électricité statique ; trop humide favorise la corrosion."], ["Quelle stratégie CPTED utilise l'aménagement pour guider les personnes vers les entrées contrôlées ?", ["Surveillance naturelle", "Contrôle naturel des accès", "Renforcement territorial", "Maintenance"], 1, "Le contrôle naturel des accès oriente les flux par l'aménagement (chemins, clôtures, végétation)."]], "glo": [["Fail secure / Fail safe", "Défaillance sécurisée / sans danger", "Protège les actifs / protège les personnes."], ["Reference monitor", "Moniteur de référence", "Contrôle abstrait de tous les accès."], ["Trusted computing base (TCB)", "Base informatique de confiance", "Ensemble des composants qui assurent la sécurité."], ["Security kernel", "Noyau de sécurité", "Implémentation du moniteur de référence."], ["Covert channel", "Canal caché", "Communication non prévue (temporelle ou de stockage)."], ["Aggregation / Inference", "Agrégation / Inférence", "Combinaison de données / déduction d'une information."], ["Polyinstantiation", "Polyinstanciation", "Versions multiples selon le niveau."], ["Key escrow", "Séquestre de clés", "Dépôt d'une copie de clé chez un tiers."], ["Work factor", "Facteur de travail", "Effort nécessaire pour casser un chiffrement."], ["Nonrepudiation", "Non-répudiation", "Impossibilité de nier une action."], ["Side-channel attack", "Attaque par canal auxiliaire", "Exploite temps, énergie ou émissions."], ["Hardware security module (HSM)", "Module matériel de sécurité", "Protège et utilise les clés."], ["Accreditation / Authorization", "Accréditation / Autorisation", "Décision formelle de la direction."], ["Mantrap / Access control vestibule", "Sas", "Double porte contre le talonnage."]], "check": ["Je récite les règles de Bell-LaPadula et Biba sans les confondre.", "J'explique Clark-Wilson (CDI, UDI, TP, IVP).", "Je connais Brewer-Nash, Graham-Denning et Take-Grant.", "Je calcule le nombre de clés symétriques et asymétriques.", "Je sais quelle clé sert à signer, vérifier, chiffrer et déchiffrer.", "Je distingue hachage, HMAC et signature.", "Je connais les modes ECB, CBC, CTR et GCM.", "Je cite 6 attaques cryptanalytiques.", "Je distingue certification et accréditation, PP, ST et EAL.", "Je connais les classes de feu, les systèmes d'extinction et les perturbations électriques.", "Je sais expliquer agrégation et inférence."]};const META={"count": 20, "prev": {"href": "d2.html", "label": "D2 · Sécurité des actifs"}, "next": {"href": "d4.html", "label": "D4 · Sécurité des réseaux et communications"}};</script>

$$("[data-rev]").forEach(b=>b.addEventListener("click",()=>{const a=b.closest(".scen").querySelector(".ans");a.hidden=!a.hidden;b.textContent=a.hidden?"Voir la réponse":"Masquer la réponse"}));

Quiz($("#qz"),d.quiz.map(([q,o,a,ex])=>({q,opts:o,a,ex,d:K})),{mode:"learn",onDone:r=>{
  if(r.total!==d.quiz.length)return;
  const prev=store.get(qKey,null);const best=Math.max(r.pct,prev?prev.best:0);
  store.set(qKey,{best,last:r.pct,date:new Date().toISOString().slice(0,10)});$("#st-quiz").textContent=best+" %";
}}).start();
// Glossaire
function glo(){const q=norm($("#gs").value.trim());const rows=d.glo.filter(g=>!q||norm(g.join(" ")).includes(q));
  $("#gb").innerHTML=rows.length?rows.map(g=>`<tr><td>${esc(g[0])}</td><td>${esc(g[1])}</td><td>${esc(g[2])}</td></tr>`).join(""):`<tr><td colspan="3" style="font-weight:400;color:var(--muted)">Aucun terme trouvé.</td></tr>`}
$("#gs").addEventListener("input",glo);glo();
// Checklist
function ck(){const v=$$(".chk input").filter(i=>i.checked).map(i=>+i.dataset.k);store.set(cKey,v);
  $("#ck-m").style.width=(v.length/d.check.length*100)+"%";$("#ck-txt").textContent=`${v.length} / ${d.check.length} validés`;$("#st-chk").textContent=`${v.length} / ${d.check.length}`}
$$(".chk input").forEach(i=>i.addEventListener("change",ck));ck();
})();
</script>
</body></html>

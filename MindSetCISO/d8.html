<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>CISSP D8 · Sécurité du développement logiciel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap">
<style>/* Layout : portail de révision — barre de navigation fixe, en-tête de domaine, sections empilées avec sommaire */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#101B2B; --muted:#5A6879; --line:#D7DEE7;
  --accent:#1F4E9E; --accent-soft:#E3EBF8; --on-accent:#FFFFFF;
  --ok:#2E7D46; --ok-soft:#E3F2E8; --bad:#B3262F; --bad-soft:#FBE7E8; --warn:#B0680A;
  --hl:#FFF4D6; --hl-ink:#6B4B00;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-quote:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}

/* Barre du portail */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.pbar-in{display:flex;align-items:center;gap:14px;padding-block:9px;overflow-x:auto;scrollbar-width:none}
.pbar-in::-webkit-scrollbar{display:none}
.logo{font-family:var(--f-disp);font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo span{color:var(--accent)}
.pnav{display:flex;gap:4px}
.pnav a{font-family:var(--f-mono);font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);padding:5px 9px;border-radius:6px;white-space:nowrap}
.pnav a:hover{background:var(--sunk);color:var(--ink)}
.pnav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

/* En-tête de page */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero-in{padding-block:26px 18px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.hero h1 .code{color:var(--accent);margin-right:10px}
.en{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pitch{max-width:72ch;margin:0;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.stat{display:flex;flex-direction:column;gap:2px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:150px;text-decoration:none;color:var(--ink)}
.stat b{font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
a.stat:hover{border-color:var(--accent)}
.toc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.toc::-webkit-scrollbar{display:none}
.toc a{font-size:13px;font-weight:500;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)}
.toc a:hover{color:var(--ink);border-color:var(--accent)}

main{padding-block:10px 60px}
.sec{padding-top:34px;scroll-margin-top:60px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h .n{font-family:var(--f-mono);font-size:13px;color:var(--accent);margin-right:8px}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}

/* Objectifs */
.obj{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:8px}
.obj li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.obj b{font-family:var(--f-mono);color:var(--accent);font-size:13px}

/* Concepts */
.concepts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.concept h3{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
.concept h3 i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.concept p{margin:0;font-size:14.5px}

/* Schémas */
.schemas{display:flex;flex-direction:column;gap:14px}
.schema h3{font-size:18px;margin-bottom:12px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 130px;min-width:0;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:7px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.flow .st b{font-family:var(--f-disp);font-size:15px}
.flow .st span{font-size:12.5px;color:var(--muted)}
.flow .ar{align-self:center;color:var(--muted);font-family:var(--f-mono)}
.cycle-back{margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:4px}
.stack .ly{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:14px}
.stack .ly b{font-family:var(--f-disp);font-size:15px}
.stack .ly span{color:var(--muted)}
.note{margin:10px 0 0;font-size:13px;color:var(--hl-ink);background:var(--hl);display:inline-block;padding:4px 10px;border-radius:6px}

/* Tableaux */
.tables{display:flex;flex-direction:column;gap:14px}
.tables h3{font-size:18px;margin-bottom:10px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td:first-child{font-weight:600}

/* Scénarios */
.scens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.scen .sit{margin:0;font-size:14.5px}
.scen .q{margin:0;font-weight:600;font-family:var(--f-disp);font-size:16px;color:var(--accent)}
.scen .ans{background:var(--ok-soft);border-radius:7px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.scen .ans p{margin:0}
.scen .why{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:13.5px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Quiz */
.quiz{max-width:820px}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--muted)}
.qz-prog{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:14px}
.qz-prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qz-q{font-family:var(--f-disp);font-size:20px;font-weight:600;margin:0 0 14px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--bg);border-left:4px solid var(--muted);font-size:14.5px}
.fb.ok{border-left-color:var(--ok)}.fb.ko{border-left-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.qz-end{display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1}
.score small{font-size:18px;color:var(--muted);font-weight:500}
.review{display:flex;flex-direction:column;gap:8px}
.review div{background:var(--bg);border-radius:7px;padding:10px 12px;font-size:14px}
.review b{color:var(--bad)}

/* Glossaire */
.glo-s{max-width:320px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.glo td:first-child{font-family:var(--f-mono);font-size:13px}

/* Checklist */
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-width:820px}
.chk label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14.5px}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;max-width:820px;margin-bottom:10px}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1 1 220px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pager a.next{text-align:right}
.foot{margin-top:30px;font-size:12px;color:var(--muted)}

@media (max-width:760px){
  .hero h1{font-size:26px}
  .concepts,.scens{grid-template-columns:minmax(0,1fr)}
  .stack .ly{grid-template-columns:minmax(0,1fr);gap:2px}
  .flow .ar{display:none}
  .flow .st{flex-basis:100%}
  .stat{min-width:0;flex:1 1 40%}
}
</style>
</head><body>
<header class="pbar"><div class="wrap pbar-in"><a class="logo" href="index.html">CISO <span>Portail</span></a><nav class="pnav" aria-label="Modules"><a href="index.html">Portail</a><a href="mindset.html">Mindset 150</a><a href="d1.html">D1</a><a href="d2.html">D2</a><a href="d3.html">D3</a><a href="d4.html">D4</a><a href="d5.html">D5</a><a href="d6.html">D6</a><a href="d7.html">D7</a><a href="d8.html" aria-current="page">D8</a></nav></div></header>
<div id="app"></div>
<script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const LETTERS="ABCD";

/* Moteur de quiz : mode « learn » (correction immédiate) ou « exam » (correction à la fin) */
function Quiz(el,questions,cfg){
  cfg=cfg||{};
  let qs,i,ans,timer,deadline;
  function start(list){
    qs=(list||questions).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:shuffle(q.opts.map((t,k)=>({t,ok:k===q.a})))}));
    i=0;ans=[];
    clearInterval(timer);
    if(cfg.minutes){deadline=Date.now()+cfg.minutes*60000;timer=setInterval(tick,1000)}
    render();
  }
  function tick(){const r=deadline-Date.now();const t=el.querySelector(".qz-time");if(t)t.textContent=fmt(r);if(r<=0){clearInterval(timer);finish(true)}}
  const fmt=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,"0")}`};
  function render(){
    if(i>=qs.length)return finish(false);
    const q=qs[i],a=ans[i],good=ans.filter(x=>x&&x.ok).length;
    el.innerHTML=`<div class="qz-top"><span>Question <b>${i+1}</b> / ${qs.length}${q.d&&cfg.showDom?` · <span class="en">${q.d}</span>`:""}</span>
      <span>${cfg.mode==="exam"?(cfg.minutes?`Temps restant <b class="qz-time">${fmt(deadline-Date.now())}</b>`:""):`Score <b>${good}</b> / ${ans.filter(Boolean).length}`}</span></div>
      <div class="qz-prog"><i style="width:${i/qs.length*100}%"></i></div>
      <p class="qz-q">${esc(q.q)}</p>
      <div class="opts">${q.opts.map((o,k)=>{
        let cls="opt";
        if(a){ if(cfg.mode==="exam"){if(a.k===k)cls+=" picked"} else {if(o.ok)cls+=" good";else if(a.k===k)cls+=" wrong"} }
        return `<button class="${cls}" type="button" data-k="${k}"${a&&cfg.mode!=="exam"?" disabled":""}><span class="k">${LETTERS[k]}</span><span>${esc(o.t)}</span></button>`}).join("")}</div>
      ${a&&cfg.mode!=="exam"?`<div class="fb ${a.ok?"ok":"ko"}"><b>${a.ok?"Bonne réponse.":"Pas tout à fait."}</b>${esc(q.ex)}</div>`:""}
      <div class="row" style="margin-top:14px">
        ${cfg.mode==="exam"?`<button class="btn primary" type="button" data-nav="next"${a?"":" disabled"}>${i+1<qs.length?"Valider et continuer":"Terminer l'examen"}</button><button class="btn" type="button" data-nav="stop">Arrêter et voir le résultat</button>`
          :`${a?`<button class="btn primary" type="button" data-nav="next">${i+1<qs.length?"Question suivante":"Voir mon score"}</button>`:""}`}
      </div>`;
  }
  el.addEventListener("click",e=>{
    const o=e.target.closest(".opt");
    if(o&&!o.disabled&&i<qs.length){const k=+o.dataset.k;if(cfg.mode!=="exam"&&ans[i])return;ans[i]={k,ok:qs[i].opts[k].ok};render();return}
    const n=e.target.closest("[data-nav]");if(!n||n.disabled)return;
    if(n.dataset.nav==="next"){i++;render()}
    else if(n.dataset.nav==="stop")finish(false);
    else if(n.dataset.nav==="again")start();
    else if(n.dataset.nav==="errors"){const wrong=qs.filter((q,k)=>!ans[k]||!ans[k].ok).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:q.opts.map(o=>o.t),a:q.opts.findIndex(o=>o.ok)}));start(wrong)}
  });
  function finish(timeout){
    clearInterval(timer);
    const total=qs.length,good=qs.filter((q,k)=>ans[k]&&ans[k].ok).length,pct=Math.round(good/total*100);
    const per={};qs.forEach((q,k)=>{if(!q.d)return;per[q.d]=per[q.d]||[0,0];per[q.d][1]++;if(ans[k]&&ans[k].ok)per[q.d][0]++});
    if(cfg.onDone)cfg.onDone({pct,good,total,per});
    const wrong=qs.map((q,k)=>({q,a:ans[k]})).filter(x=>!x.a||!x.a.ok);
    el.innerHTML=`<div class="qz-end">
      ${timeout?`<p class="note">Temps écoulé : les questions sans réponse comptent comme fausses.</p>`:""}
      <div class="score">${pct} %<small> · ${good} / ${total} bonnes réponses</small></div>
      <p style="margin:0">${pct>=80?"Excellent niveau : vous êtes prêt sur ce périmètre.":pct>=70?"Bon niveau, proche du seuil de réussite. Revoyez les erreurs ci-dessous.":"Niveau à consolider : relisez les concepts et les fiches, puis recommencez."}</p>
      ${Object.keys(per).length>1?`<div class="tblw"><table><thead><tr><th>Domaine</th><th>Score</th></tr></thead><tbody>${Object.keys(per).sort().map(d=>`<tr><td>${d}</td><td>${per[d][0]} / ${per[d][1]} (${Math.round(per[d][0]/per[d][1]*100)} %)</td></tr>`).join("")}</tbody></table></div>`:""}
      <div class="row"><button class="btn primary" type="button" data-nav="again">Recommencer</button>${wrong.length?`<button class="btn" type="button" data-nav="errors">Refaire seulement mes ${wrong.length} erreur${wrong.length>1?"s":""}</button>`:""}</div>
      ${wrong.length?`<h3 style="font-size:17px;margin-top:6px">Correction des erreurs</h3><div class="review">${wrong.map(x=>`<div><p style="margin:0 0 4px;font-weight:600">${esc(x.q.q)}</p><p style="margin:0">Bonne réponse : <strong>${esc(x.q.opts.find(o=>o.ok).t)}</strong>${x.a?` · votre réponse : <b>${esc(x.q.opts[x.a.k].t)}</b>`:" · sans réponse"}</p><p style="margin:4px 0 0;color:var(--muted)">${esc(x.q.ex)}</p></div>`).join("")}</div>`:""}
    </div>`;
  }
  return {start};
}
</script>
<script>const DOMD={"code": "D8", "name": "Sécurité du développement logiciel", "en": "Software Development Security", "w": 10, "pitch": "Intégrer la sécurité dans la fabrication du logiciel : cycle de développement, écosystème d'outils, tests, logiciels acquis et règles de codage sécurisé.", "obj": [["8.1", "Comprendre et intégrer la sécurité dans le cycle de développement (méthodologies, modèles de maturité, exploitation, changement, équipes intégrées)"], ["8.2", "Identifier et appliquer les contrôles dans les écosystèmes de développement (langages, bibliothèques, outils, IDE, CI/CD, SOAR, SCM, tests)"], ["8.3", "Évaluer l'efficacité de la sécurité logicielle (audit, journalisation des changements, analyse de risque)"], ["8.4", "Évaluer l'impact sécurité des logiciels acquis (COTS, open source, tiers, services gérés, cloud)"], ["8.5", "Définir et appliquer des lignes directrices et normes de codage sécurisé (faiblesses du code, API, SDN)"]], "concepts": [["SDLC", "Initiation et besoins, conception, développement ou acquisition, tests, mise en œuvre, exploitation et maintenance, retrait. La sécurité commence dès l'expression des besoins : exigences de sécurité, analyse de risque, modélisation des menaces."], ["Modèles de développement", "Cascade (Waterfall, séquentiel, peu de retours), spirale (itérations guidées par le risque), prototypage, RAD, Agile (Scrum, itérations courtes, user stories), DevOps et DevSecOps (intégration développement, sécurité et exploitation, automatisation)."], ["Modèles de maturité", "CMM/CMMI : Initial, Reproductible (Managed), Défini, Géré quantitativement, Optimisé. OWASP SAMM (gouvernance, conception, implémentation, vérification, exploitation). BSIMM (observation des pratiques). IDEAL : Initiating, Diagnosing, Establishing, Acting, Learning."], ["Équipes intégrées et changements", "Product owner, développeurs, testeurs, sécurité et exploitation travaillent ensemble (IPT). Gestion des versions, des demandes de changement, de la configuration et des mises en production."], ["Écosystème et chaîne CI/CD", "Dépôts de code (contrôle d'accès, revue obligatoire, branches protégées), gestion des secrets, intégration continue (tests automatisés, SAST, SCA), livraison continue, signature des artefacts, environnements séparés."], ["Composants tiers", "Bibliothèques open source, SDK, API, conteneurs. SBOM pour l'inventaire, SCA pour les vulnérabilités et licences, sources de confiance, mises à jour régulières. Attaques : typosquatting de paquets, confusion de dépendances, dépôts compromis."], ["Codage sécurisé", "Validation des entrées côté serveur (liste autorisée), encodage des sorties, requêtes paramétrées, gestion sûre des erreurs, moindre privilège du code, cryptographie standard, pas de secrets dans le code. Référentiels : OWASP ASVS, CERT, CWE Top 25."], ["Faiblesses courantes", "Dépassement de tampon (vérifier les bornes, langages sûrs), injection SQL et commande, XSS (stocké, réfléchi, DOM), CSRF (jetons anti-CSRF, SameSite), TOCTOU (condition de course entre vérification et usage), désérialisation non sûre, références directes non contrôlées (IDOR)."], ["Code malveillant", "Bombe logique (déclenchée par une condition), porte dérobée (backdoor), cheval de Troie, ver, virus (polymorphe, furtif, multipartite), ransomware, rootkit. Les maintenance hooks oubliés en production sont des portes dérobées."], ["Programmation objet", "Encapsulation (masquer l'état interne), héritage, polymorphisme, abstraction. Une bonne conception vise une forte cohésion (un module fait une chose) et un faible couplage (peu de dépendances)."], ["Langages et exécution", "Compilé (code machine, plus rapide, source non livrée), interprété (exécuté à la volée, source visible), bytecode et machine virtuelle (Java, .NET). Langages à mémoire sûre (Rust, Go, Java) réduisent les dépassements de tampon."], ["Bases de données", "Propriétés ACID : Atomicité, Cohérence, Isolation, Durabilité. Contrôles : vues, droits par rôle, chiffrement, journaux de transactions, verrouillage (concurrence), polyinstanciation contre l'inférence. Risques NoSQL : injections spécifiques, absence de schéma."], ["Sécurité des API", "Authentification forte (OAuth 2.0, mTLS), autorisation par objet (contre BOLA), limitation de débit, validation stricte des schémas, inventaire et versionnement, passerelle API, journalisation. Référence : OWASP API Security Top 10."], ["Tests et efficacité", "Tests unitaires, d'intégration, de régression, d'acceptation ; SAST, DAST, IAST, fuzzing, revue de code, tests de cas d'abus. Mesurer : densité de défauts, délai de correction, couverture des tests de sécurité."], ["Logiciels acquis", "COTS, open source, développement sous-traité, SaaS. Évaluer : réputation et pratiques de l'éditeur, résultats de tests, certifications, contrat (correctifs, responsabilité, séquestre du code source), droit d'audit, plan de sortie."], ["IA et nouveaux usages", "Assistants de code et applications LLM : vérifier le code généré, protéger les données envoyées, contrer l'injection de prompt et l'empoisonnement, superviser les décisions. Les principes classiques s'appliquent : moindre privilège, validation, journalisation."]], "schemas": [{"t": "SDLC sécurisé", "kind": "flow", "items": [["Besoins", "exigences de sécurité"], ["Conception", "modélisation des menaces"], ["Développement", "codage sécurisé, SAST"], ["Tests", "DAST, fuzzing, pentest"], ["Déploiement", "durcissement, signature"], ["Exploitation", "correctifs, surveillance"], ["Retrait", "données, accès, certificats"]], "note": "Shift left : chaque défaut corrigé tôt coûte beaucoup moins cher."}, {"t": "Niveaux CMM", "kind": "stack", "items": [["5 · Optimisé", "amélioration continue"], ["4 · Géré quantitativement", "mesuré et contrôlé"], ["3 · Défini", "processus standardisés"], ["2 · Reproductible", "pratiques de base gérées"], ["1 · Initial", "imprévisible, héroïque"]], "note": "« Il Répète, Définit, Gère, Optimise »."}, {"t": "Pipeline DevSecOps", "kind": "flow", "items": [["Commit", "détection de secrets"], ["Build", "SAST, SCA, SBOM"], ["Test", "DAST, tests de sécurité"], ["Release", "signature des artefacts"], ["Deploy", "IaC analysée, environnements séparés"], ["Run", "surveillance, RASP"]], "note": "Le pipeline lui-même doit être protégé : accès, secrets, intégrité."}], "tables": [{"t": "Modèles de développement", "head": ["Modèle", "Principe", "Sécurité"], "rows": [["Cascade", "Phases séquentielles", "Facile à documenter, rigide face aux nouvelles menaces"], ["Spirale", "Itérations pilotées par l'analyse de risque", "Risque évalué à chaque boucle"], ["Agile / Scrum", "Sprints courts, backlog", "Sécurité dans la définition de « terminé » et les user stories"], ["DevOps / DevSecOps", "Intégration continue, automatisation", "Contrôles automatisés dans le pipeline"]]}, {"t": "Faiblesses et contre-mesures", "head": ["Faiblesse", "Effet", "Contre-mesure"], "rows": [["Injection SQL", "Lecture ou modification de la base", "Requêtes paramétrées, moindre privilège"], ["XSS", "Script exécuté chez la victime", "Encodage des sorties, CSP"], ["CSRF", "Action à l'insu d'un utilisateur connecté", "Jeton anti-CSRF, cookies SameSite"], ["Dépassement de tampon", "Exécution de code arbitraire", "Vérification des bornes, langages sûrs, ASLR, DEP"], ["TOCTOU", "Condition de course", "Opérations atomiques, verrouillage"], ["IDOR / BOLA", "Accès aux données d'autrui", "Contrôle d'autorisation sur chaque objet"]]}, {"t": "Propriétés ACID", "head": ["Propriété", "Signification"], "rows": [["Atomicité", "Tout ou rien"], ["Cohérence", "La base reste dans un état valide"], ["Isolation", "Les transactions concurrentes ne s'influencent pas"], ["Durabilité", "Une transaction validée persiste même après une panne"]]}], "scen": [["Une équipe Agile livre toutes les deux semaines et la sécurité n'intervient qu'au pentest annuel.", "Quelle est la MEILLEURE amélioration ?", "Intégrer la sécurité dans chaque sprint : exigences dans les user stories, critères de « terminé », SAST et SCA automatiques, champion sécurité dans l'équipe.", "Un test annuel arrive trop tard pour des livraisons bimensuelles."], ["Une vulnérabilité critique est annoncée dans une bibliothèque open source très répandue.", "Que faire EN PREMIER ?", "Identifier où la bibliothèque est utilisée grâce au SBOM ou à la SCA, puis prioriser les correctifs selon l'exposition.", "On ne peut corriger que ce que l'on sait localiser."], ["Un développeur a laissé une clé d'accès cloud dans un dépôt Git public.", "Que faire ?", "Révoquer immédiatement la clé, analyser son utilisation, nettoyer l'historique et mettre en place la détection de secrets.", "Supprimer le fichier ne suffit pas : l'historique conserve la clé et des robots l'exploitent en quelques minutes."], ["L'entreprise veut acheter un logiciel métier à un petit éditeur local.", "Quelles garanties exiger ?", "Pratiques de développement sécurisé, résultats de tests, engagement contractuel de correction, séquestre du code source et plan de réversibilité.", "Si l'éditeur disparaît, le séquestre permet de maintenir le logiciel."], ["Un ancien développeur a laissé un accès de maintenance non documenté dans l'application.", "De quoi s'agit-il et que faire ?", "D'une porte dérobée (maintenance hook) ; la supprimer, revoir le code et imposer une revue obligatoire avant mise en production.", "Les accès de développement doivent disparaître avant la production."], ["Les testeurs utilisent une copie de la base clients réelle.", "Que recommander ?", "Utiliser des données masquées ou synthétiques et séparer strictement les environnements.", "Les environnements de test sont moins protégés que la production."]], "quiz": [["À quelle phase du SDLC la sécurité doit-elle commencer ?", ["Tests", "Déploiement", "Initiation et expression des besoins", "Maintenance"], 2, "Les exigences de sécurité sont définies dès le départ."], ["Quel modèle de développement est piloté par l'analyse de risque à chaque itération ?", ["Cascade", "Spirale", "RAD", "Big bang"], 1, "Le modèle en spirale évalue le risque à chaque boucle."], ["Quel est le niveau 3 du CMM ?", ["Initial", "Reproductible", "Défini", "Optimisé"], 2, "Initial, Reproductible, Défini, Géré, Optimisé."], ["La meilleure défense contre l'injection SQL est :", ["Le chiffrement de la base", "Les requêtes paramétrées", "Un pare-feu réseau", "La compression"], 1, "Elles séparent le code SQL des données saisies."], ["Une condition de course entre la vérification et l'utilisation d'une ressource est :", ["XSS", "TOCTOU", "CSRF", "IDOR"], 1, "Time Of Check to Time Of Use."], ["Le CSRF est contré efficacement par :", ["Un antivirus", "Des jetons anti-CSRF et des cookies SameSite", "Le chiffrement au repos", "Le RAID"], 1, "Le jeton prouve que la requête vient bien de l'application."], ["Un code malveillant déclenché à une date précise est :", ["Un ver", "Une bombe logique", "Un rootkit", "Un adware"], 1, "La bombe logique attend une condition."], ["En conception objet, on recherche :", ["Faible cohésion, fort couplage", "Forte cohésion, faible couplage", "Forte cohésion, fort couplage", "Faible cohésion, faible couplage"], 1, "Des modules focalisés et peu dépendants sont plus sûrs et maintenables."], ["Dans ACID, la propriété « tout ou rien » est :", ["Cohérence", "Isolation", "Atomicité", "Durabilité"], 2, "Une transaction est entièrement exécutée ou entièrement annulée."], ["Le SBOM est :", ["Un outil de chiffrement", "L'inventaire des composants d'un logiciel", "Un test d'intrusion", "Un modèle de maturité"], 1, "Software Bill of Materials."], ["Le séquestre du code source protège principalement contre :", ["Le vol de code", "La défaillance de l'éditeur", "Les injections", "Le phishing"], 1, "Le client récupère le code si l'éditeur disparaît."], ["Les maintenance hooks laissés en production sont :", ["Des contrôles de sécurité", "Des portes dérobées", "Des tests unitaires", "Des API documentées"], 1, "Ils permettent de contourner les contrôles d'accès."], ["Quel risque est en tête de l'OWASP Top 10 2021 ?", ["Injection", "Broken Access Control", "XSS", "Security Misconfiguration"], 1, "Le contrôle d'accès défaillant est A01:2021."], ["Un langage interprété se distingue d'un langage compilé car :", ["Il est toujours plus sûr", "Il est exécuté à la volée et son code source est souvent visible", "Il ne peut pas avoir de failles", "Il est plus rapide"], 1, "Le code interprété est lu au moment de l'exécution."], ["Valider les entrées côté client uniquement est :", ["Suffisant", "Insuffisant, car contournable", "Recommandé par OWASP", "Interdit"], 1, "L'attaquant contrôle le client ; la validation doit se faire côté serveur."], ["Quel modèle de maturité est publié par l'OWASP ?", ["CMMI", "SAMM", "ITIL", "COBIT"], 1, "OWASP SAMM : Software Assurance Maturity Model."], ["Le premier risque de l'OWASP API Security Top 10 est :", ["Injection", "Broken Object Level Authorization", "Manque de chiffrement", "Journalisation insuffisante"], 1, "BOLA : accès aux objets d'autres utilisateurs."], ["La protection contre le dépassement de tampon inclut :", ["ASLR et DEP", "DNSSEC", "SPF", "RAID"], 0, "La randomisation de l'espace mémoire et la prévention d'exécution des données compliquent l'exploitation."], ["Qui doit être impliqué dans une équipe de produit intégrée (IPT) ?", ["Uniquement les développeurs", "Développeurs, sécurité, exploitation, métier et tests", "Uniquement la direction", "Uniquement les testeurs"], 1, "L'intégration des compétences permet d'intégrer la sécurité dès le départ."], ["Le typosquatting de paquets consiste à :", ["Publier un paquet malveillant au nom proche d'un paquet légitime", "Chiffrer un dépôt", "Saturer un registre", "Modifier un DNS"], 0, "Une faute de frappe à l'installation fait télécharger le paquet piégé."]], "glo": [["Software development life cycle (SDLC)", "Cycle de vie du développement logiciel", "Étapes de fabrication d'un logiciel."], ["Shift left", "Décalage vers la gauche", "Intégrer la sécurité plus tôt."], ["Software bill of materials (SBOM)", "Nomenclature logicielle", "Inventaire des composants."], ["Software composition analysis (SCA)", "Analyse de composition", "Vulnérabilités et licences des dépendances."], ["Logic bomb", "Bombe logique", "Code déclenché par une condition."], ["Maintenance hook / Backdoor", "Point d'entrée de maintenance / porte dérobée", "Accès qui contourne les contrôles."], ["Time of check to time of use (TOCTOU)", "Condition de course vérification-usage", "Faille d'exécution concurrente."], ["Cohesion / Coupling", "Cohésion / Couplage", "Focalisation / dépendance d'un module."], ["Source code escrow", "Séquestre du code source", "Dépôt du code chez un tiers."], ["Commercial off-the-shelf (COTS)", "Logiciel du commerce", "Produit acheté tel quel."], ["Integrated product team (IPT)", "Équipe produit intégrée", "Équipe pluridisciplinaire."], ["Definition of done", "Définition de « terminé »", "Critères pour qu'une tâche soit finie."], ["Runtime application self-protection (RASP)", "Autoprotection à l'exécution", "L'application détecte et bloque les attaques."], ["Dependency confusion", "Confusion de dépendances", "Paquet public pris pour un paquet interne."]], "check": ["Je cite les phases du SDLC et où intégrer la sécurité.", "Je compare cascade, spirale, Agile et DevSecOps.", "Je cite les 5 niveaux CMM et je connais SAMM.", "Je connais les propriétés ACID.", "J'explique injection SQL, XSS, CSRF, TOCTOU et dépassement de tampon avec leur parade.", "Je distingue bombe logique, porte dérobée, ver, virus et rootkit.", "Je sais ce qu'est un SBOM et pourquoi il compte.", "Je connais les garanties à exiger pour un logiciel acquis (dont le séquestre).", "J'explique forte cohésion et faible couplage.", "Je connais les principaux risques des API (BOLA)."]};const META={"count": 18, "prev": {"href": "d7.html", "label": "D7 · Opérations de sécurité"}, "next": {"href": "index.html", "label": "Retour au CISO Portail"}};</script>
<script>(function(){
const d=DOMD, M=META, K=d.code;
const qKey="cp-quiz-"+K, cKey="cp-chk-"+K;

function schemaHTML(s){
  let body;
  if(s.kind==="stack")body=`<div class="stack">${s.items.map(([a,b])=>`<div class="ly"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div>`;
  else body=`<div class="flow">${s.items.map(([a,b],k)=>`${k?`<span class="ar" aria-hidden="true">→</span>`:""}<div class="st"><b>${esc(a)}</b>${b?`<span>${esc(b)}</span>`:""}</div>`).join("")}</div>${s.kind==="cycle"?`<div class="cycle-back">↺ puis retour à « ${esc(s.items[0][0])} » : c'est un cycle continu</div>`:""}`;
  return `<div class="card schema"><h3>${esc(s.t)}</h3>${body}${s.note?`<p class="note">${esc(s.note)}</p>`:""}</div>`;
}
const SECS=[["objectifs","Objectifs officiels"],["concepts","Concepts clés"],["schemas","Schémas"],["comparatifs","Comparatifs"],["scenarios","Scénarios d'examen"],["quiz","Quiz"],["glossaire","Glossaire FR-EN"],["checklist","Checklist"]];
const qb=store.get(qKey,null), ch=store.get(cKey,[]);

document.getElementById("app").innerHTML=`
<section class="hero"><div class="wrap hero-in">
  <div class="eyebrow">Domaine ${K.slice(1)} sur 8 · ${d.w} % de l'examen</div>
  <h1><span class="code">${K}</span>${esc(d.name)}</h1>
  <div class="en">${esc(d.en)}</div>
  <p class="pitch">${esc(d.pitch)}</p>
  <div class="stats">
    <a class="stat" href="mindset.html#${K}"><b>${M.count}</b><span>fiches Mindset liées →</span></a>
    <div class="stat"><b id="st-quiz">${qb?qb.best+" %":"—"}</b><span>meilleur score au quiz</span></div>
    <div class="stat"><b id="st-chk">${ch.length} / ${d.check.length}</b><span>points de checklist validés</span></div>
  </div>
  <nav class="toc" aria-label="Sommaire">${SECS.map(([id,l])=>`<a href="#${id}">${l}</a>`).join("")}</nav>
</div></section>
<main class="wrap">
  <section class="sec" id="objectifs"><div class="sec-h"><h2><span class="n">01</span>Objectifs officiels de l'(ISC)²</h2><p>Plan du domaine (version 2024)</p></div>
    <ol class="obj">${d.obj.map(([c,t])=>`<li><b>${c}</b><span>${esc(t)}</span></li>`).join("")}</ol></section>
  <section class="sec" id="concepts"><div class="sec-h"><h2><span class="n">02</span>Concepts clés</h2><p>${d.concepts.length} notions expliquées</p></div>
    <div class="concepts">${d.concepts.map(([t,x],k)=>`<article class="concept"><h3><i>${String(k+1).padStart(2,"0")}</i>${esc(t)}</h3><p>${esc(x)}</p></article>`).join("")}</div></section>
  <section class="sec" id="schemas"><div class="sec-h"><h2><span class="n">03</span>Schémas</h2><p>Les mécanismes à visualiser</p></div>
    <div class="schemas">${d.schemas.map(schemaHTML).join("")}</div></section>
  <section class="sec" id="comparatifs"><div class="sec-h"><h2><span class="n">04</span>Tableaux comparatifs</h2><p>Les notions que l'examen fait confondre</p></div>
    <div class="tables">${d.tables.map(t=>`<div class="card"><h3>${esc(t.t)}</h3><div class="tblw"><table><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`).join("")}</div></section>
  <section class="sec" id="scenarios"><div class="sec-h"><h2><span class="n">05</span>Scénarios d'examen</h2><p>Réfléchissez en manager, puis révélez la réponse</p></div>
    <div class="scens">${d.scen.map(([s,q,a,w],k)=>`<article class="scen"><span class="eyebrow">Scénario ${k+1}</span><p class="sit">${esc(s)}</p><p class="q">${esc(q)}</p>
      <div class="ans" hidden><p><strong>Réponse attendue :</strong> ${esc(a)}</p><p class="why">${esc(w)}</p></div>
      <div><button class="btn" type="button" data-rev>Voir la réponse</button></div></article>`).join("")}</div></section>
  <section class="sec" id="quiz"><div class="sec-h"><h2><span class="n">06</span>Quiz du domaine</h2><p>${d.quiz.length} questions · correction immédiate · ordre des réponses mélangé</p></div>

    <div class="card"><div class="tblw"><table class="glo"><thead><tr><th>Anglais (examen)</th><th>Français</th><th>Définition</th></tr></thead><tbody id="gb"></tbody></table></div></div></section>

  <nav class="pager">
    ${M.prev?`<a href="${M.prev.href}"><small>← Précédent</small>${esc(M.prev.label)}</a>`:""}
    ${M.next?`<a class="next" href="${M.next.href}"><small>Suivant →</small>${esc(M.next.label)}</a>`:""}
  </nav>
  <p class="foot">Votre progression (quiz, checklist) est enregistrée dans ce navigateur et visible sur le CISO Portail. Formation CISSP · SANOGO Souleymane.</p>
</main>`;

// Scénarios
$$("[data-rev]").forEach(b=>b.addEventListener("click",()=>{const a=b.closest(".scen").querySelector(".ans");a.hidden=!a.hidden;b.textContent=a.hidden?"Voir la réponse":"Masquer la réponse"}));
// Quiz
Quiz($("#qz"),d.quiz.map(([q,o,a,ex])=>({q,opts:o,a,ex,d:K})),{mode:"learn",onDone:r=>{
  if(r.total!==d.quiz.length)return;
  const prev=store.get(qKey,null);const best=Math.max(r.pct,prev?prev.best:0);
  store.set(qKey,{best,last:r.pct,date:new Date().toISOString().slice(0,10)});$("#st-quiz").textContent=best+" %";
}}).start();
// Glossaire
function glo(){const q=norm($("#gs").value.trim());const rows=d.glo.filter(g=>!q||norm(g.join(" ")).includes(q));
  $("#gb").innerHTML=rows.length?rows.map(g=>`<tr><td>${esc(g[0])}</td><td>${esc(g[1])}</td><td>${esc(g[2])}</td></tr>`).join(""):`<tr><td colspan="3" style="font-weight:400;color:var(--muted)">Aucun terme trouvé.</td></tr>`}
$("#gs").addEventListener("input",glo);glo();
// Checklist
function ck(){const v=$$(".chk input").filter(i=>i.checked).map(i=>+i.dataset.k);store.set(cKey,v);
  $("#ck-m").style.width=(v.length/d.check.length*100)+"%";$("#ck-txt").textContent=`${v.length} / ${d.check.length} validés`;$("#st-chk").textContent=`${v.length} / ${d.check.length}`}
$$(".chk input").forEach(i=>i.addEventListener("change",ck));ck();
})();
</script>

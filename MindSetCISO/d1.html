<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>CISSP D1 · Sécurité et gestion des risques</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap">
<style>/* Layout : portail de révision — barre de navigation fixe, en-tête de domaine, sections empilées avec sommaire */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#101B2B; --muted:#5A6879; --line:#D7DEE7;
  --accent:#1F4E9E; --accent-soft:#E3EBF8; --on-accent:#FFFFFF;
  --ok:#2E7D46; --ok-soft:#E3F2E8; --bad:#B3262F; --bad-soft:#FBE7E8; --warn:#B0680A;
  --hl:#FFF4D6; --hl-ink:#6B4B00;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-quote:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}

/* Barre du portail */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.pbar-in{display:flex;align-items:center;gap:14px;padding-block:9px;overflow-x:auto;scrollbar-width:none}
.pbar-in::-webkit-scrollbar{display:none}
.logo{font-family:var(--f-disp);font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo span{color:var(--accent)}
.pnav{display:flex;gap:4px}
.pnav a{font-family:var(--f-mono);font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);padding:5px 9px;border-radius:6px;white-space:nowrap}
.pnav a:hover{background:var(--sunk);color:var(--ink)}
.pnav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

/* En-tête de page */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero-in{padding-block:26px 18px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.hero h1 .code{color:var(--accent);margin-right:10px}
.en{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pitch{max-width:72ch;margin:0;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.stat{display:flex;flex-direction:column;gap:2px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:150px;text-decoration:none;color:var(--ink)}
.stat b{font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
a.stat:hover{border-color:var(--accent)}
.toc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.toc::-webkit-scrollbar{display:none}
.toc a{font-size:13px;font-weight:500;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)}
.toc a:hover{color:var(--ink);border-color:var(--accent)}

main{padding-block:10px 60px}
.sec{padding-top:34px;scroll-margin-top:60px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h .n{font-family:var(--f-mono);font-size:13px;color:var(--accent);margin-right:8px}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}

/* Objectifs */
.obj{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:8px}
.obj li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.obj b{font-family:var(--f-mono);color:var(--accent);font-size:13px}

/* Concepts */
.concepts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.concept h3{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
.concept h3 i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.concept p{margin:0;font-size:14.5px}

/* Schémas */
.schemas{display:flex;flex-direction:column;gap:14px}
.schema h3{font-size:18px;margin-bottom:12px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 130px;min-width:0;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:7px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.flow .st b{font-family:var(--f-disp);font-size:15px}
.flow .st span{font-size:12.5px;color:var(--muted)}
.flow .ar{align-self:center;color:var(--muted);font-family:var(--f-mono)}
.cycle-back{margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:4px}
.stack .ly{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:14px}
.stack .ly b{font-family:var(--f-disp);font-size:15px}
.stack .ly span{color:var(--muted)}
.note{margin:10px 0 0;font-size:13px;color:var(--hl-ink);background:var(--hl);display:inline-block;padding:4px 10px;border-radius:6px}

/* Tableaux */
.tables{display:flex;flex-direction:column;gap:14px}
.tables h3{font-size:18px;margin-bottom:10px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td:first-child{font-weight:600}

/* Scénarios */
.scens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.scen .sit{margin:0;font-size:14.5px}
.scen .q{margin:0;font-weight:600;font-family:var(--f-disp);font-size:16px;color:var(--accent)}
.scen .ans{background:var(--ok-soft);border-radius:7px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.scen .ans p{margin:0}
.scen .why{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:13.5px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Quiz */
.quiz{max-width:820px}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--muted)}
.qz-prog{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:14px}
.qz-prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qz-q{font-family:var(--f-disp);font-size:20px;font-weight:600;margin:0 0 14px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--bg);border-left:4px solid var(--muted);font-size:14.5px}
.fb.ok{border-left-color:var(--ok)}.fb.ko{border-left-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.qz-end{display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1}
.score small{font-size:18px;color:var(--muted);font-weight:500}
.review{display:flex;flex-direction:column;gap:8px}
.review div{background:var(--bg);border-radius:7px;padding:10px 12px;font-size:14px}
.review b{color:var(--bad)}

/* Glossaire */
.glo-s{max-width:320px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.glo td:first-child{font-family:var(--f-mono);font-size:13px}

/* Checklist */
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-width:820px}
.chk label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14.5px}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;max-width:820px;margin-bottom:10px}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1 1 220px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pager a.next{text-align:right}
.foot{margin-top:30px;font-size:12px;color:var(--muted)}

@media (max-width:760px){
  .hero h1{font-size:26px}
  .concepts,.scens{grid-template-columns:minmax(0,1fr)}
  .stack .ly{grid-template-columns:minmax(0,1fr);gap:2px}
  .flow .ar{display:none}
  .flow .st{flex-basis:100%}
  .stat{min-width:0;flex:1 1 40%}
}
</style>
</head><body>
<header class="pbar"><div class="wrap pbar-in"><a class="logo" href="index.html">CISO <span>Portail</span></a><nav class="pnav" aria-label="Modules"><a href="index.html">Portail</a><a href="mindset.html">Mindset 150</a><a href="d1.html" aria-current="page">D1</a><a href="d2.html">D2</a><a href="d3.html">D3</a><a href="d4.html">D4</a><a href="d5.html">D5</a><a href="d6.html">D6</a><a href="d7.html">D7</a><a href="d8.html">D8</a></nav></div></header>
<div id="app"></div>
<script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const LETTERS="ABCD";

/* Moteur de quiz : mode « learn » (correction immédiate) ou « exam » (correction à la fin) */
function Quiz(el,questions,cfg){
  cfg=cfg||{};
  let qs,i,ans,timer,deadline;
  function start(list){
    qs=(list||questions).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:shuffle(q.opts.map((t,k)=>({t,ok:k===q.a})))}));
    i=0;ans=[];
    clearInterval(timer);
    if(cfg.minutes){deadline=Date.now()+cfg.minutes*60000;timer=setInterval(tick,1000)}
    render();
  }
  function tick(){const r=deadline-Date.now();const t=el.querySelector(".qz-time");if(t)t.textContent=fmt(r);if(r<=0){clearInterval(timer);finish(true)}}
  const fmt=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,"0")}`};
  function render(){
    if(i>=qs.length)return finish(false);
    const q=qs[i],a=ans[i],good=ans.filter(x=>x&&x.ok).length;
    el.innerHTML=`<div class="qz-top"><span>Question <b>${i+1}</b> / ${qs.length}${q.d&&cfg.showDom?` · <span class="en">${q.d}</span>`:""}</span>
      <span>${cfg.mode==="exam"?(cfg.minutes?`Temps restant <b class="qz-time">${fmt(deadline-Date.now())}</b>`:""):`Score <b>${good}</b> / ${ans.filter(Boolean).length}`}</span></div>
      <div class="qz-prog"><i style="width:${i/qs.length*100}%"></i></div>
      <p class="qz-q">${esc(q.q)}</p>
      <div class="opts">${q.opts.map((o,k)=>{
        let cls="opt";
        if(a){ if(cfg.mode==="exam"){if(a.k===k)cls+=" picked"} else {if(o.ok)cls+=" good";else if(a.k===k)cls+=" wrong"} }
        return `<button class="${cls}" type="button" data-k="${k}"${a&&cfg.mode!=="exam"?" disabled":""}><span class="k">${LETTERS[k]}</span><span>${esc(o.t)}</span></button>`}).join("")}</div>
      ${a&&cfg.mode!=="exam"?`<div class="fb ${a.ok?"ok":"ko"}"><b>${a.ok?"Bonne réponse.":"Pas tout à fait."}</b>${esc(q.ex)}</div>`:""}
      <div class="row" style="margin-top:14px">
        ${cfg.mode==="exam"?`<button class="btn primary" type="button" data-nav="next"${a?"":" disabled"}>${i+1<qs.length?"Valider et continuer":"Terminer l'examen"}</button><button class="btn" type="button" data-nav="stop">Arrêter et voir le résultat</button>`
          :`${a?`<button class="btn primary" type="button" data-nav="next">${i+1<qs.length?"Question suivante":"Voir mon score"}</button>`:""}`}
      </div>`;
  }
  el.addEventListener("click",e=>{
    const o=e.target.closest(".opt");
    if(o&&!o.disabled&&i<qs.length){const k=+o.dataset.k;if(cfg.mode!=="exam"&&ans[i])return;ans[i]={k,ok:qs[i].opts[k].ok};render();return}
    const n=e.target.closest("[data-nav]");if(!n||n.disabled)return;
    if(n.dataset.nav==="next"){i++;render()}
    else if(n.dataset.nav==="stop")finish(false);
    else if(n.dataset.nav==="again")start();
    else if(n.dataset.nav==="errors"){const wrong=qs.filter((q,k)=>!ans[k]||!ans[k].ok).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:q.opts.map(o=>o.t),a:q.opts.findIndex(o=>o.ok)}));start(wrong)}
  });
  function finish(timeout){
    clearInterval(timer);
    const total=qs.length,good=qs.filter((q,k)=>ans[k]&&ans[k].ok).length,pct=Math.round(good/total*100);
    const per={};qs.forEach((q,k)=>{if(!q.d)return;per[q.d]=per[q.d]||[0,0];per[q.d][1]++;if(ans[k]&&ans[k].ok)per[q.d][0]++});
    if(cfg.onDone)cfg.onDone({pct,good,total,per});
    const wrong=qs.map((q,k)=>({q,a:ans[k]})).filter(x=>!x.a||!x.a.ok);
    el.innerHTML=`<div class="qz-end">
      ${timeout?`<p class="note">Temps écoulé : les questions sans réponse comptent comme fausses.</p>`:""}
      <div class="score">${pct} %<small> · ${good} / ${total} bonnes réponses</small></div>
      <p style="margin:0">${pct>=80?"Excellent niveau : vous êtes prêt sur ce périmètre.":pct>=70?"Bon niveau, proche du seuil de réussite. Revoyez les erreurs ci-dessous.":"Niveau à consolider : relisez les concepts et les fiches, puis recommencez."}</p>
      ${Object.keys(per).length>1?`<div class="tblw"><table><thead><tr><th>Domaine</th><th>Score</th></tr></thead><tbody>${Object.keys(per).sort().map(d=>`<tr><td>${d}</td><td>${per[d][0]} / ${per[d][1]} (${Math.round(per[d][0]/per[d][1]*100)} %)</td></tr>`).join("")}</tbody></table></div>`:""}
      <div class="row"><button class="btn primary" type="button" data-nav="again">Recommencer</button>${wrong.length?`<button class="btn" type="button" data-nav="errors">Refaire seulement mes ${wrong.length} erreur${wrong.length>1?"s":""}</button>`:""}</div>
      ${wrong.length?`<h3 style="font-size:17px;margin-top:6px">Correction des erreurs</h3><div class="review">${wrong.map(x=>`<div><p style="margin:0 0 4px;font-weight:600">${esc(x.q.q)}</p><p style="margin:0">Bonne réponse : <strong>${esc(x.q.opts.find(o=>o.ok).t)}</strong>${x.a?` · votre réponse : <b>${esc(x.q.opts[x.a.k].t)}</b>`:" · sans réponse"}</p><p style="margin:4px 0 0;color:var(--muted)">${esc(x.q.ex)}</p></div>`).join("")}</div>`:""}
    </div>`;
  }
  return {start};
}
</script>
<script>const DOMD={"code": "D1", "name": "Sécurité et gestion des risques", "en": "Security and Risk Management", "w": 16, "pitch": "Le domaine le plus lourd de l'examen et le socle du raisonnement CISSP : gouvernance, risque, conformité, éthique et continuité. Ici, on pense comme un dirigeant.", "obj": [["1.1", "Comprendre, respecter et promouvoir l'éthique professionnelle"], ["1.2", "Comprendre et appliquer les concepts de sécurité (CIA, authenticité, non-répudiation)"], ["1.3", "Évaluer et appliquer les principes de gouvernance de la sécurité"], ["1.4", "Comprendre les exigences légales, réglementaires et de conformité"], ["1.5", "Comprendre les exigences des différents types d'enquêtes"], ["1.6", "Élaborer et mettre en œuvre politiques, normes, procédures et guides"], ["1.7", "Identifier, analyser et prioriser les exigences de continuité d'activité (BIA)"], ["1.8", "Contribuer aux politiques de sécurité du personnel"], ["1.9", "Comprendre et appliquer les concepts de gestion des risques"], ["1.10", "Comprendre et appliquer la modélisation des menaces"], ["1.11", "Appliquer la gestion des risques de la chaîne d'approvisionnement (SCRM)"], ["1.12", "Établir un programme de sensibilisation, formation et éducation"]], "concepts": [["Triade CIA et au-delà", "Confidentialité, intégrité, disponibilité forment le noyau. On y ajoute l'authenticité (l'origine est celle annoncée) et la non-répudiation (l'auteur ne peut nier son action). L'examen parle parfois du « Parkerian hexad » qui ajoute possession, authenticité et utilité."], ["Gouvernance vs management", "La gouvernance (conseil, direction) fixe la direction, les objectifs et le niveau de risque acceptable. Le management planifie et exécute. Le CISO fait le lien entre les deux et rend compte."], ["Rôles de sécurité", "Haute direction : responsabilité finale. CISO : programme de sécurité. Propriétaire des données : classification et accès. Dépositaire : opérations quotidiennes. Utilisateur : respect des règles. Auditeur : vérification indépendante."], ["Cadres de contrôle", "ISO 27001 (exigences du SMSI, certifiable), ISO 27002 (guide des 93 mesures, version 2022), NIST CSF 2.0 (6 fonctions), NIST SP 800-53 (catalogue de contrôles), COBIT (gouvernance IT), CIS Controls (priorités techniques)."], ["Processus de gestion des risques", "Établir le contexte, identifier les actifs, menaces et vulnérabilités, analyser, évaluer, traiter, accepter le résiduel, surveiller et communiquer. C'est un cycle continu, pas un projet ponctuel."], ["Analyse quantitative", "On chiffre : AV (valeur de l'actif), EF (facteur d'exposition, en %), SLE = AV × EF, ARO (occurrences annuelles), ALE = SLE × ARO. La valeur d'un contrôle = ALE avant – ALE après – coût annuel du contrôle."], ["Analyse qualitative", "Échelles de vraisemblance et d'impact, ateliers, méthode Delphi (avis anonymes répétés jusqu'au consensus). Plus rapide, plus subjective. L'approche hybride combine les deux."], ["Traitement du risque", "Réduire (atténuer par des contrôles), transférer (assurance, externalisation contractuelle), éviter (arrêter l'activité), accepter (décision documentée de la direction). Le rejet ou déni du risque n'est jamais acceptable."], ["NIST RMF (SP 800-37)", "Sept étapes : Prepare, Categorize (FIPS 199), Select (SP 800-53), Implement, Assess, Authorize (ATO par un responsable), Monitor. Utilisé pour autoriser l'exploitation d'un système."], ["Modélisation des menaces", "STRIDE (catégories de menaces), PASTA (7 étapes orientées risque métier), DREAD (notation), VAST (à l'échelle agile), arbres d'attaque. On identifie ce qui peut mal tourner avant de concevoir les contrôles."], ["Lois et réglementations", "Pénal, civil, administratif. Données personnelles : loi ivoirienne 2013-450 (ARTCI), RGPD, Convention de Malabo. Cybercriminalité : loi 2013-451, Convention de Budapest. Secteur financier : exigences BCEAO, PCI DSS pour les cartes."], ["Propriété intellectuelle", "Brevet (invention, publié, environ 20 ans), droit d'auteur (œuvre, automatique), marque (signe distinctif, renouvelable), secret d'affaires (protégé tant qu'il reste secret, par NDA et contrôles)."], ["Types d'enquêtes", "Administrative (interne, règles de l'entreprise), pénale (État, au-delà du doute raisonnable), civile (litige, prépondérance de la preuve), réglementaire (régulateur), standards de l'industrie. Le niveau de preuve exigé diffère."], ["Continuité : BIA", "Le BIA identifie les processus critiques, leurs dépendances et l'impact d'une interruption dans le temps. Il fixe MTD, RTO, RPO et WRT, et précède toute stratégie de continuité."], ["Sécurité du personnel", "Vérifications avant embauche, NDA, politique d'usage acceptable, séparation des tâches, rotation, congés obligatoires, procédure de départ, gestion des prestataires et des tiers."], ["Supply chain (SCRM)", "Évaluer les fournisseurs, exiger des garanties contractuelles (SLA, droit d'audit), vérifier l'intégrité des composants (SBOM, signatures), surveiller en continu, prévoir la sortie."], ["Sensibilisation, formation, éducation", "Sensibilisation : tous, changer les comportements. Formation : compétences liées au poste. Éducation : expertise approfondie. Mesurer l'efficacité (taux de clic, signalements)."]], "schemas": [{"t": "Le cycle de gestion des risques", "kind": "cycle", "items": [["Contexte", "périmètre, appétit pour le risque"], ["Identifier", "actifs, menaces, vulnérabilités"], ["Analyser", "quantitatif ou qualitatif"], ["Évaluer", "prioriser selon l'appétit"], ["Traiter", "réduire, transférer, éviter, accepter"], ["Surveiller", "KRI, revues, nouveaux risques"]], "note": "La communication avec les parties prenantes accompagne chaque étape."}, {"t": "Hiérarchie documentaire", "kind": "stack", "items": [["Politique", "intention de la direction, obligatoire, stable"], ["Normes", "exigences obligatoires précises (ex. AES-256)"], ["Baselines", "niveau minimal de configuration"], ["Procédures", "étapes détaillées, obligatoires"], ["Guides", "recommandations facultatives"]], "note": "Seuls les guides sont facultatifs."}, {"t": "NIST RMF en 7 étapes", "kind": "flow", "items": [["Prepare", ""], ["Categorize", "FIPS 199"], ["Select", "SP 800-53"], ["Implement", ""], ["Assess", ""], ["Authorize", "ATO"], ["Monitor", "continu"]], "note": "Mnémo : « Pour Chaque Système, Installer, Auditer, Autoriser, Monitorer »."}], "tables": [{"t": "Les quatre traitements du risque", "head": ["Traitement", "Principe", "Exemple"], "rows": [["Réduire", "Mettre des contrôles pour baisser vraisemblance ou impact", "MFA, segmentation, sauvegardes"], ["Transférer", "Faire porter l'impact financier par un tiers", "Cyber-assurance, clause contractuelle"], ["Éviter", "Supprimer l'activité à l'origine du risque", "Ne plus stocker les cartes bancaires"], ["Accepter", "Décision documentée de vivre avec le risque", "Note signée par la direction, revue annuelle"]]}, {"t": "Types de droit et niveaux de preuve", "head": ["Type", "Parties", "Niveau de preuve", "Sanction"], "rows": [["Pénal", "État contre individu", "Au-delà du doute raisonnable", "Prison, amende"], ["Civil", "Personne contre personne", "Prépondérance de la preuve", "Dommages-intérêts"], ["Administratif", "Régulateur contre organisation", "Selon le texte", "Amende, retrait d'agrément"]]}, {"t": "Indicateurs de continuité", "head": ["Sigle", "Signification", "À retenir"], "rows": [["MTD", "Durée maximale d'interruption tolérable", "Fixée par le métier"], ["RTO", "Délai pour restaurer le système", "RTO + WRT ≤ MTD"], ["WRT", "Temps pour vérifier et reprendre le travail", "Après la restauration"], ["RPO", "Perte de données maximale acceptable", "Détermine la fréquence des sauvegardes"]]}], "scen": [["Un audit révèle qu'un serveur métier critique n'a plus de support éditeur et ne peut pas être corrigé. Le responsable informatique propose d'attendre le projet de remplacement prévu dans 18 mois.", "Quelle est la MEILLEURE action du CISO ?", "Documenter le risque, proposer des contrôles compensatoires (isolement, surveillance) et faire formellement accepter le risque résiduel par le propriétaire métier ou la direction.", "Le CISO ne décide pas seul et ne laisse pas le risque implicite. Il éclaire, propose, puis fait signer celui qui assume l'impact."], ["La direction demande au CISO de ne pas mentionner une fuite de données dans le rapport au conseil pour éviter la panique.", "Que doit faire le CISO ?", "Refuser de dissimuler l'incident, rappeler les obligations légales de notification et rapporter fidèlement au conseil.", "Le code d'éthique place la protection de la société et l'honnêteté avant les intérêts de l'employeur."], ["Un projet veut héberger les données clients chez un fournisseur cloud étranger dans 3 semaines.", "Que faire EN PREMIER ?", "Identifier la classification des données et les exigences légales applicables (localisation, transfert transfrontalier, régulateur).", "On ne peut ni évaluer le fournisseur ni choisir les contrôles sans connaître les obligations qui s'appliquent."], ["Un nouvel actif vaut 200 M FCFA. Une inondation en détruirait 25 %. Elle survient une fois tous les 10 ans. Une protection coûte 3 M FCFA par an.", "La protection est-elle justifiée ?", "SLE = 50 M ; ARO = 0,1 ; ALE = 5 M FCFA. Si la protection élimine le risque, elle crée 2 M FCFA de valeur par an : elle est justifiée.", "On compare toujours le coût annuel du contrôle à la réduction d'ALE qu'il apporte."], ["Le comité de direction trouve le programme de sécurité trop coûteux et ne voit pas sa valeur.", "Quelle est la MEILLEURE approche ?", "Présenter les risques en langage métier : impacts financiers, réglementaires et réputationnels, avec quelques KRI et un lien avec les objectifs stratégiques.", "La direction finance ce qu'elle comprend. Les métriques techniques ne suffisent pas."], ["Un employé licencié pour faute doit être reçu par les RH à 10 h.", "Quand ses accès doivent-ils être retirés ?", "Pendant l'entretien, ou juste avant, de façon coordonnée avec les RH, puis escorter la personne.", "Un employé mécontent informé de son départ avec ses accès actifs représente un risque immédiat."], ["Un fournisseur critique refuse le droit d'audit dans son contrat.", "Que doit faire le CISO ?", "Exiger des garanties alternatives (rapport SOC 2 Type II, certification ISO 27001) et escalader le risque résiduel à la direction pour décision.", "On ne transfère jamais la responsabilité au fournisseur ; on obtient des preuves ou on fait accepter le risque."]], "quiz": [["Qui porte la responsabilité ultime de la sécurité de l'information dans une organisation ?", ["Le CISO", "La haute direction", "Le responsable informatique", "L'auditeur interne"], 1, "La haute direction est responsable en dernier ressort ; le CISO conseille et pilote le programme."], ["Un actif vaut 400 000 $, l'EF est de 50 % et l'ARO de 0,2. Quelle est l'ALE ?", ["20 000 $", "40 000 $", "80 000 $", "200 000 $"], 1, "SLE = 400 000 × 0,5 = 200 000 $ ; ALE = 200 000 × 0,2 = 40 000 $."], ["Souscrire une cyber-assurance est un exemple de :", ["Réduction du risque", "Acceptation du risque", "Transfert du risque", "Évitement du risque"], 2, "L'assurance transfère l'impact financier à un tiers ; la responsabilité reste à l'organisation."], ["Quel document est facultatif ?", ["Politique", "Norme", "Procédure", "Guide"], 3, "Les guides (guidelines) sont des recommandations ; politiques, normes, baselines et procédures sont obligatoires."], ["Selon le code d'éthique (ISC)², quel canon passe en premier ?", ["Servir ses mandants avec diligence", "Protéger la société, le bien commun et l'infrastructure", "Faire progresser la profession", "Agir honorablement et légalement"], 1, "Les canons sont ordonnés : protéger la société vient en premier."], ["Quelle méthode qualitative recueille des avis anonymes en plusieurs tours jusqu'au consensus ?", ["Delphi", "STRIDE", "Monte-Carlo", "FMEA"], 0, "La méthode Delphi utilise des réponses anonymes et itératives pour éviter l'influence de groupe."], ["Quelle étape du NIST RMF aboutit à l'autorisation d'exploiter (ATO) ?", ["Select", "Assess", "Authorize", "Monitor"], 2, "L'étape Authorize : un responsable accepte le risque et autorise l'exploitation du système."], ["Due diligence correspond surtout à :", ["Agir pour corriger", "Connaître et évaluer les risques", "Transférer le risque", "Former les utilisateurs"], 1, "Due diligence = recherche et évaluation ; due care = action raisonnable pour protéger."], ["Quel est le niveau de preuve requis dans une affaire pénale ?", ["Prépondérance de la preuve", "Preuve claire et convaincante", "Au-delà du doute raisonnable", "Simple soupçon"], 2, "Le pénal exige le niveau le plus élevé : au-delà du doute raisonnable."], ["Quelle protection de propriété intellectuelle exige une publication de l'invention ?", ["Secret d'affaires", "Brevet", "Marque", "Droit d'auteur"], 1, "Le brevet est publié en échange d'un monopole temporaire d'environ 20 ans."], ["Quel est le premier livrable de la planification de la continuité d'activité ?", ["Le plan de reprise informatique", "L'analyse d'impact sur l'activité (BIA)", "Le choix du site de secours", "Le test sur table"], 1, "Le BIA identifie les processus critiques et fixe les délais avant toute stratégie."], ["Le RPO détermine principalement :", ["La durée maximale d'interruption", "La fréquence des sauvegardes", "Le choix du site de secours", "Le temps de vérification après reprise"], 1, "Le RPO est la perte de données acceptable, donc l'intervalle maximal entre sauvegardes."], ["Dans STRIDE, le « R » correspond à une menace sur :", ["La confidentialité", "La disponibilité", "La non-répudiation", "L'autorisation"], 2, "Repudiation : un acteur nie avoir effectué une action ; la contre-mesure est la non-répudiation (journaux, signatures)."], ["Quel est le facteur de succès le plus important d'un programme de sécurité ?", ["Un budget technologique élevé", "Le soutien de la haute direction", "Un SOC 24/7", "La certification ISO 27001"], 1, "Sans soutien de la direction, ni budget ni application des politiques ne tiennent."], ["Les congés obligatoires sont avant tout un contrôle :", ["Préventif", "Détectif", "Correctif", "Compensatoire"], 1, "L'absence de la personne permet de détecter des fraudes qu'elle dissimulait."], ["Une organisation arrête un service pour ne plus porter un risque. C'est :", ["Réduire", "Accepter", "Éviter", "Transférer"], 2, "Supprimer l'activité à l'origine du risque, c'est l'éviter."], ["Que doit faire EN PREMIER un nouveau CISO arrivant dans une organisation ?", ["Acheter un SIEM", "Comprendre la mission, les actifs et les risques métier", "Réécrire toutes les politiques", "Lancer un test d'intrusion"], 1, "On aligne le programme sur la mission avant de choisir des contrôles."], ["Quel référentiel décrit les exigences d'un SMSI certifiable ?", ["ISO 27002", "ISO 27001", "NIST SP 800-53", "COBIT"], 1, "ISO 27001 contient les exigences certifiables ; ISO 27002 est le guide des mesures."], ["Valeur d'un contrôle : ALE avant 50 000 $, ALE après 10 000 $, coût annuel 15 000 $.", ["25 000 $", "35 000 $", "40 000 $", "65 000 $"], 0, "50 000 – 10 000 – 15 000 = 25 000 $ de valeur annuelle."], ["Le risque résiduel doit être accepté par :", ["Le CISO", "L'administrateur système", "Le propriétaire de l'actif ou la direction", "L'auditeur externe"], 2, "Celui qui supporte l'impact décide : propriétaire ou direction."]], "glo": [["Risk appetite", "Appétit pour le risque", "Niveau de risque qu'une organisation est prête à poursuivre."], ["Risk tolerance", "Tolérance au risque", "Écart acceptable autour de l'appétit pour le risque."], ["Residual risk", "Risque résiduel", "Risque restant après les contrôles."], ["Due care", "Diligence raisonnable (agir)", "Agir comme une personne prudente le ferait."], ["Due diligence", "Diligence préalable (connaître)", "Rechercher et évaluer avant d'agir."], ["Safeguard / Countermeasure", "Mesure préventive / contre-mesure", "Contrôle mis en place avant / en réponse à une menace."], ["Exposure factor (EF)", "Facteur d'exposition", "Pourcentage de l'actif perdu lors d'un incident."], ["Annualized rate of occurrence (ARO)", "Taux d'occurrence annuel", "Nombre d'incidents attendus par an."], ["Senior management", "Haute direction", "Responsable final de la sécurité."], ["Stakeholder", "Partie prenante", "Personne ou groupe concerné par une décision."], ["Business impact analysis (BIA)", "Analyse d'impact sur l'activité", "Mesure l'effet d'une interruption dans le temps."], ["Maximum tolerable downtime (MTD)", "Durée maximale d'interruption tolérable", "Au-delà, l'organisation subit un dommage grave."], ["Threat agent / Threat actor", "Agent de menace", "Entité qui réalise la menace."], ["Supply chain risk management (SCRM)", "Gestion des risques de la chaîne d'approvisionnement", "Maîtrise des risques liés aux fournisseurs."], ["Awareness", "Sensibilisation", "Changer les comportements de tous."], ["Compliance", "Conformité", "Respect des lois, règlements et contrats."]], "check": ["Je calcule SLE, ALE et la valeur d'un contrôle sans hésiter.", "Je cite les 4 canons du code d'éthique dans l'ordre.", "Je distingue politique, norme, baseline, procédure et guide.", "Je connais les 4 traitements du risque et qui accepte le résiduel.", "Je sais expliquer due care et due diligence avec un exemple.", "Je connais les étapes du NIST RMF et les 6 fonctions du NIST CSF 2.0.", "Je distingue droit pénal, civil et administratif et leurs niveaux de preuve.", "Je sais définir MTD, RTO, RPO et WRT et leur relation.", "Je connais les 4 formes de propriété intellectuelle.", "Je sais expliquer STRIDE et citer une autre méthode de modélisation.", "Je connais les lois de protection des données applicables à mon pays."]};const META={"count": 36, "prev": {"href": "mindset.html", "label": "Mindset CISO 150"}, "next": {"href": "d2.html", "label": "D2 · Sécurité des actifs"}};</script>
<script>(function(){
const d=DOMD, M=META, K=d.code;
const qKey="cp-quiz-"+K, cKey="cp-chk-"+K;

function schemaHTML(s){
  let body;
  if(s.kind==="stack")body=`<div class="stack">${s.items.map(([a,b])=>`<div class="ly"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div>`;
  else body=`<div class="flow">${s.items.map(([a,b],k)=>`${k?`<span class="ar" aria-hidden="true">→</span>`:""}<div class="st"><b>${esc(a)}</b>${b?`<span>${esc(b)}</span>`:""}</div>`).join("")}</div>${s.kind==="cycle"?`<div class="cycle-back">↺ puis retour à « ${esc(s.items[0][0])} » : c'est un cycle continu</div>`:""}`;
  return `<div class="card schema"><h3>${esc(s.t)}</h3>${body}${s.note?`<p class="note">${esc(s.note)}</p>`:""}</div>`;
}
const SECS=[["objectifs","Objectifs officiels"],["concepts","Concepts clés"],["schemas","Schémas"],["comparatifs","Comparatifs"],["scenarios","Scénarios d'examen"],["quiz","Quiz"],["glossaire","Glossaire FR-EN"],["checklist","Checklist"]];
const qb=store.get(qKey,null), ch=store.get(cKey,[]);

document.getElementById("app").innerHTML=`
<section class="hero"><div class="wrap hero-in">
  <div class="eyebrow">Domaine ${K.slice(1)} sur 8 · ${d.w} % de l'examen</div>
  <h1><span class="code">${K}</span>${esc(d.name)}</h1>
  <div class="en">${esc(d.en)}</div>
  <p class="pitch">${esc(d.pitch)}</p>
  <div class="stats">
    <a class="stat" href="mindset.html#${K}"><b>${M.count}</b><span>fiches Mindset liées →</span></a>
    <div class="stat"><b id="st-quiz">${qb?qb.best+" %":"—"}</b><span>meilleur score au quiz</span></div>
    <div class="stat"><b id="st-chk">${ch.length} / ${d.check.length}</b><span>points de checklist validés</span></div>
  </div>
  <nav class="toc" aria-label="Sommaire">${SECS.map(([id,l])=>`<a href="#${id}">${l}</a>`).join("")}</nav>
</div></section>
<main class="wrap">
  <section class="sec" id="objectifs"><div class="sec-h"><h2><span class="n">01</span>Objectifs officiels de l'(ISC)²</h2><p>Plan du domaine (version 2024)</p></div>
    <ol class="obj">${d.obj.map(([c,t])=>`<li><b>${c}</b><span>${esc(t)}</span></li>`).join("")}</ol></section>
  <section class="sec" id="concepts"><div class="sec-h"><h2><span class="n">02</span>Concepts clés</h2><p>${d.concepts.length} notions expliquées</p></div>
    <div class="concepts">${d.concepts.map(([t,x],k)=>`<article class="concept"><h3><i>${String(k+1).padStart(2,"0")}</i>${esc(t)}</h3><p>${esc(x)}</p></article>`).join("")}</div></section>
  <section class="sec" id="schemas"><div class="sec-h"><h2><span class="n">03</span>Schémas</h2><p>Les mécanismes à visualiser</p></div>
    <div class="schemas">${d.schemas.map(schemaHTML).join("")}</div></section>
  <section class="sec" id="comparatifs"><div class="sec-h"><h2><span class="n">04</span>Tableaux comparatifs</h2><p>Les notions que l'examen fait confondre</p></div>
    <div class="tables">${d.tables.map(t=>`<div class="card"><h3>${esc(t.t)}</h3><div class="tblw"><table><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`).join("")}</div></section>
  <section class="sec" id="scenarios"><div class="sec-h"><h2><span class="n">05</span>Scénarios d'examen</h2><p>Réfléchissez en manager, puis révélez la réponse</p></div>
    <div class="scens">${d.scen.map(([s,q,a,w],k)=>`<article class="scen"><span class="eyebrow">Scénario ${k+1}</span><p class="sit">${esc(s)}</p><p class="q">${esc(q)}</p>
      <div class="ans" hidden><p><strong>Réponse attendue :</strong> ${esc(a)}</p><p class="why">${esc(w)}</p></div>
      <div><button class="btn" type="button" data-rev>Voir la réponse</button></div></article>`).join("")}</div></section>
  <section class="sec" id="quiz"><div class="sec-h"><h2><span class="n">06</span>Quiz du domaine</h2><p>${d.quiz.length} questions · correction immédiate · ordre des réponses mélangé</p></div>
    <div class="card quiz" id="qz"></div></section>
  <section class="sec" id="glossaire"><div class="sec-h"><h2><span class="n">07</span>Glossaire français-anglais</h2><input class="glo-s" id="gs" type="search" placeholder="Chercher un terme…" aria-label="Chercher un terme"></div>
    <div class="card"><div class="tblw"><table class="glo"><thead><tr><th>Anglais (examen)</th><th>Français</th><th>Définition</th></tr></thead><tbody id="gb"></tbody></table></div></div></section>
  <section class="sec" id="checklist"><div class="sec-h"><h2><span class="n">08</span>Checklist « Je sais… »</h2><p id="ck-txt"></p></div>

  <nav class="pager">

  </nav>
  <p class="foot">Votre progression (quiz, checklist) est enregistrée dans ce navigateur et visible sur le CISO Portail. Formation CISSP · SANOGO Souleymane.</p>
</main>`;

// Scénarios
$$("[data-rev]").forEach(b=>b.addEventListener("click",()=>{const a=b.closest(".scen").querySelector(".ans");a.hidden=!a.hidden;b.textContent=a.hidden?"Voir la réponse":"Masquer la réponse"}));
// Quiz
Quiz($("#qz"),d.quiz.map(([q,o,a,ex])=>({q,opts:o,a,ex,d:K})),{mode:"learn",onDone:r=>{
  if(r.total!==d.quiz.length)return;
  const prev=store.get(qKey,null);const best=Math.max(r.pct,prev?prev.best:0);
  store.set(qKey,{best,last:r.pct,date:new Date().toISOString().slice(0,10)});$("#st-quiz").textContent=best+" %";
}}).start();
// Glossaire
function glo(){const q=norm($("#gs").value.trim());const rows=d.glo.filter(g=>!q||norm(g.join(" ")).includes(q));
  $("#gb").innerHTML=rows.length?rows.map(g=>`<tr><td>${esc(g[0])}</td><td>${esc(g[1])}</td><td>${esc(g[2])}</td></tr>`).join(""):`<tr><td colspan="3" style="font-weight:400;color:var(--muted)">Aucun terme trouvé.</td></tr>`}
$("#gs").addEventListener("input",glo);glo();
// Checklist
function ck(){const v=$$(".chk input").filter(i=>i.checked).map(i=>+i.dataset.k);store.set(cKey,v);
  $("#ck-m").style.width=(v.length/d.check.length*100)+"%";$("#ck-txt").textContent=`${v.length} / ${d.check.length} validés`;$("#st-chk").textContent=`${v.length} / ${d.check.length}`}
$$(".chk input").forEach(i=>i.addEventListener("change",ck));ck();
})();
</script>
</body></html>

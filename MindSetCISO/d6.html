<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>CISSP D6 · Évaluation et tests de sécurité</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap">
<style>/* Layout : portail de révision — barre de navigation fixe, en-tête de domaine, sections empilées avec sommaire */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#101B2B; --muted:#5A6879; --line:#D7DEE7;
  --accent:#1F4E9E; --accent-soft:#E3EBF8; --on-accent:#FFFFFF;
  --ok:#2E7D46; --ok-soft:#E3F2E8; --bad:#B3262F; --bad-soft:#FBE7E8; --warn:#B0680A;
  --hl:#FFF4D6; --hl-ink:#6B4B00;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-quote:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}

/* Barre du portail */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.pbar-in{display:flex;align-items:center;gap:14px;padding-block:9px;overflow-x:auto;scrollbar-width:none}
.pbar-in::-webkit-scrollbar{display:none}
.logo{font-family:var(--f-disp);font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo span{color:var(--accent)}
.pnav{display:flex;gap:4px}
.pnav a{font-family:var(--f-mono);font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);padding:5px 9px;border-radius:6px;white-space:nowrap}
.pnav a:hover{background:var(--sunk);color:var(--ink)}
.pnav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

/* En-tête de page */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero-in{padding-block:26px 18px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.hero h1 .code{color:var(--accent);margin-right:10px}
.en{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pitch{max-width:72ch;margin:0;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.stat{display:flex;flex-direction:column;gap:2px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:150px;text-decoration:none;color:var(--ink)}
.stat b{font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
a.stat:hover{border-color:var(--accent)}
.toc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.toc::-webkit-scrollbar{display:none}
.toc a{font-size:13px;font-weight:500;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)}
.toc a:hover{color:var(--ink);border-color:var(--accent)}

main{padding-block:10px 60px}
.sec{padding-top:34px;scroll-margin-top:60px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h .n{font-family:var(--f-mono);font-size:13px;color:var(--accent);margin-right:8px}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}

/* Objectifs */
.obj{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:8px}
.obj li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.obj b{font-family:var(--f-mono);color:var(--accent);font-size:13px}

/* Concepts */
.concepts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.concept h3{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
.concept h3 i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.concept p{margin:0;font-size:14.5px}

/* Schémas */
.schemas{display:flex;flex-direction:column;gap:14px}
.schema h3{font-size:18px;margin-bottom:12px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 130px;min-width:0;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:7px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.flow .st b{font-family:var(--f-disp);font-size:15px}
.flow .st span{font-size:12.5px;color:var(--muted)}
.flow .ar{align-self:center;color:var(--muted);font-family:var(--f-mono)}
.cycle-back{margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:4px}
.stack .ly{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:14px}
.stack .ly b{font-family:var(--f-disp);font-size:15px}
.stack .ly span{color:var(--muted)}
.note{margin:10px 0 0;font-size:13px;color:var(--hl-ink);background:var(--hl);display:inline-block;padding:4px 10px;border-radius:6px}

/* Tableaux */
.tables{display:flex;flex-direction:column;gap:14px}
.tables h3{font-size:18px;margin-bottom:10px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td:first-child{font-weight:600}

/* Scénarios */
.scens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.scen .sit{margin:0;font-size:14.5px}
.scen .q{margin:0;font-weight:600;font-family:var(--f-disp);font-size:16px;color:var(--accent)}
.scen .ans{background:var(--ok-soft);border-radius:7px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.scen .ans p{margin:0}
.scen .why{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:13.5px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Quiz */
.quiz{max-width:820px}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--muted)}
.qz-prog{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:14px}
.qz-prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qz-q{font-family:var(--f-disp);font-size:20px;font-weight:600;margin:0 0 14px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--bg);border-left:4px solid var(--muted);font-size:14.5px}
.fb.ok{border-left-color:var(--ok)}.fb.ko{border-left-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.qz-end{display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1}
.score small{font-size:18px;color:var(--muted);font-weight:500}
.review{display:flex;flex-direction:column;gap:8px}
.review div{background:var(--bg);border-radius:7px;padding:10px 12px;font-size:14px}
.review b{color:var(--bad)}

/* Glossaire */
.glo-s{max-width:320px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.glo td:first-child{font-family:var(--f-mono);font-size:13px}

/* Checklist */
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-width:820px}
.chk label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14.5px}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;max-width:820px;margin-bottom:10px}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1 1 220px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pager a.next{text-align:right}
.foot{margin-top:30px;font-size:12px;color:var(--muted)}

@media (max-width:760px){
  .hero h1{font-size:26px}
  .concepts,.scens{grid-template-columns:minmax(0,1fr)}
  .stack .ly{grid-template-columns:minmax(0,1fr);gap:2px}
  .flow .ar{display:none}
  .flow .st{flex-basis:100%}
  .stat{min-width:0;flex:1 1 40%}
}
</style>
</head><body>
<header class="pbar"><div class="wrap pbar-in"><a class="logo" href="index.html">CISO <span>Portail</span></a><nav class="pnav" aria-label="Modules"><a href="index.html">Portail</a><a href="mindset.html">Mindset 150</a><a href="d1.html">D1</a><a href="d2.html">D2</a><a href="d3.html">D3</a><a href="d4.html">D4</a><a href="d5.html">D5</a><a href="d6.html" aria-current="page">D6</a><a href="d7.html">D7</a><a href="d8.html">D8</a></nav></div></header>
<div id="app"></div>
<script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const LETTERS="ABCD";

/* Moteur de quiz : mode « learn » (correction immédiate) ou « exam » (correction à la fin) */
function Quiz(el,questions,cfg){
  cfg=cfg||{};
  let qs,i,ans,timer,deadline;
  function start(list){
    qs=(list||questions).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:shuffle(q.opts.map((t,k)=>({t,ok:k===q.a})))}));
    i=0;ans=[];
    clearInterval(timer);
    if(cfg.minutes){deadline=Date.now()+cfg.minutes*60000;timer=setInterval(tick,1000)}
    render();
  }
  function tick(){const r=deadline-Date.now();const t=el.querySelector(".qz-time");if(t)t.textContent=fmt(r);if(r<=0){clearInterval(timer);finish(true)}}
  const fmt=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,"0")}`};
  function render(){
    if(i>=qs.length)return finish(false);
    const q=qs[i],a=ans[i],good=ans.filter(x=>x&&x.ok).length;
    el.innerHTML=`<div class="qz-top"><span>Question <b>${i+1}</b> / ${qs.length}${q.d&&cfg.showDom?` · <span class="en">${q.d}</span>`:""}</span>
      <span>${cfg.mode==="exam"?(cfg.minutes?`Temps restant <b class="qz-time">${fmt(deadline-Date.now())}</b>`:""):`Score <b>${good}</b> / ${ans.filter(Boolean).length}`}</span></div>
      <div class="qz-prog"><i style="width:${i/qs.length*100}%"></i></div>
      <p class="qz-q">${esc(q.q)}</p>
      <div class="opts">${q.opts.map((o,k)=>{
        let cls="opt";
        if(a){ if(cfg.mode==="exam"){if(a.k===k)cls+=" picked"} else {if(o.ok)cls+=" good";else if(a.k===k)cls+=" wrong"} }
        return `<button class="${cls}" type="button" data-k="${k}"${a&&cfg.mode!=="exam"?" disabled":""}><span class="k">${LETTERS[k]}</span><span>${esc(o.t)}</span></button>`}).join("")}</div>
      ${a&&cfg.mode!=="exam"?`<div class="fb ${a.ok?"ok":"ko"}"><b>${a.ok?"Bonne réponse.":"Pas tout à fait."}</b>${esc(q.ex)}</div>`:""}
      <div class="row" style="margin-top:14px">
        ${cfg.mode==="exam"?`<button class="btn primary" type="button" data-nav="next"${a?"":" disabled"}>${i+1<qs.length?"Valider et continuer":"Terminer l'examen"}</button><button class="btn" type="button" data-nav="stop">Arrêter et voir le résultat</button>`
          :`${a?`<button class="btn primary" type="button" data-nav="next">${i+1<qs.length?"Question suivante":"Voir mon score"}</button>`:""}`}
      </div>`;
  }
  el.addEventListener("click",e=>{
    const o=e.target.closest(".opt");
    if(o&&!o.disabled&&i<qs.length){const k=+o.dataset.k;if(cfg.mode!=="exam"&&ans[i])return;ans[i]={k,ok:qs[i].opts[k].ok};render();return}
    const n=e.target.closest("[data-nav]");if(!n||n.disabled)return;
    if(n.dataset.nav==="next"){i++;render()}
    else if(n.dataset.nav==="stop")finish(false);
    else if(n.dataset.nav==="again")start();
    else if(n.dataset.nav==="errors"){const wrong=qs.filter((q,k)=>!ans[k]||!ans[k].ok).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:q.opts.map(o=>o.t),a:q.opts.findIndex(o=>o.ok)}));start(wrong)}
  });
  function finish(timeout){
    clearInterval(timer);
    const total=qs.length,good=qs.filter((q,k)=>ans[k]&&ans[k].ok).length,pct=Math.round(good/total*100);
    const per={};qs.forEach((q,k)=>{if(!q.d)return;per[q.d]=per[q.d]||[0,0];per[q.d][1]++;if(ans[k]&&ans[k].ok)per[q.d][0]++});
    if(cfg.onDone)cfg.onDone({pct,good,total,per});
    const wrong=qs.map((q,k)=>({q,a:ans[k]})).filter(x=>!x.a||!x.a.ok);
    el.innerHTML=`<div class="qz-end">
      ${timeout?`<p class="note">Temps écoulé : les questions sans réponse comptent comme fausses.</p>`:""}
      <div class="score">${pct} %<small> · ${good} / ${total} bonnes réponses</small></div>
      <p style="margin:0">${pct>=80?"Excellent niveau : vous êtes prêt sur ce périmètre.":pct>=70?"Bon niveau, proche du seuil de réussite. Revoyez les erreurs ci-dessous.":"Niveau à consolider : relisez les concepts et les fiches, puis recommencez."}</p>
      ${Object.keys(per).length>1?`<div class="tblw"><table><thead><tr><th>Domaine</th><th>Score</th></tr></thead><tbody>${Object.keys(per).sort().map(d=>`<tr><td>${d}</td><td>${per[d][0]} / ${per[d][1]} (${Math.round(per[d][0]/per[d][1]*100)} %)</td></tr>`).join("")}</tbody></table></div>`:""}
      <div class="row"><button class="btn primary" type="button" data-nav="again">Recommencer</button>${wrong.length?`<button class="btn" type="button" data-nav="errors">Refaire seulement mes ${wrong.length} erreur${wrong.length>1?"s":""}</button>`:""}</div>
      ${wrong.length?`<h3 style="font-size:17px;margin-top:6px">Correction des erreurs</h3><div class="review">${wrong.map(x=>`<div><p style="margin:0 0 4px;font-weight:600">${esc(x.q.q)}</p><p style="margin:0">Bonne réponse : <strong>${esc(x.q.opts.find(o=>o.ok).t)}</strong>${x.a?` · votre réponse : <b>${esc(x.q.opts[x.a.k].t)}</b>`:" · sans réponse"}</p><p style="margin:4px 0 0;color:var(--muted)">${esc(x.q.ex)}</p></div>`).join("")}</div>`:""}
    </div>`;
  }
  return {start};
}
</script>
<script>const DOMD={"code": "D6", "name": "Évaluation et tests de sécurité", "en": "Security Assessment and Testing", "w": 12, "pitch": "Prouver que les contrôles fonctionnent : stratégie d'audit, tests techniques, collecte de données de sécurité, analyse des résultats et rapport à la direction.", "obj": [["6.1", "Concevoir et valider les stratégies d'évaluation, de test et d'audit (internes, externes, tierces, sur site, cloud, hybrides)"], ["6.2", "Réaliser les tests des contrôles de sécurité (vulnérabilités, intrusion, journaux, transactions synthétiques, code, cas d'abus, couverture, interfaces, simulation d'attaques)"], ["6.3", "Collecter les données des processus de sécurité (gestion des comptes, revues de direction, KPI/KRI, sauvegardes, formation, PRA/PCA)"], ["6.4", "Analyser les résultats des tests et produire le rapport (remédiation, gestion des exceptions, divulgation éthique)"], ["6.5", "Conduire ou faciliter les audits de sécurité"]], "concepts": [["Évaluation, test et audit", "Le test vérifie un contrôle précis. L'évaluation (assessment) examine un ensemble de contrôles et propose des améliorations. L'audit vérifie formellement la conformité à un référentiel, avec indépendance et preuves."], ["Audits internes, externes et tiers", "Interne : par l'organisation (souvent l'audit interne rattaché au comité d'audit). Externe : par un cabinet mandaté par l'organisation. Tierce partie : mandaté par un tiers (client, régulateur) ou pour fournir une attestation à des tiers (SOC)."], ["Scan de vulnérabilités", "Automatisé, large, fréquent. Authentifié (plus complet) ou non authentifié (vue de l'attaquant). Notation CVSS, références CVE et CWE. Faux positifs à valider ; faux négatifs à craindre."], ["Test d'intrusion", "Exploitation contrôlée pour démontrer l'impact. Phases : planification et autorisation écrite, reconnaissance, découverte et scan, exploitation, post-exploitation et pivot, rapport. Règles d'engagement : périmètre, horaires, techniques, contacts."], ["Équipes rouge, bleue, violette", "Red team : simule un adversaire réel sur la durée, objectifs précis. Blue team : défend et détecte. Purple team : collaboration pour améliorer la détection. Breach and attack simulation (BAS) : automatisation de scénarios."], ["Revue de code et analyse", "Revue manuelle par les pairs, inspection formelle de Fagan (planification, présentation, préparation, inspection, reprise, suivi), SAST, DAST, IAST, analyse de composition (SCA)."], ["Fuzzing", "Envoi d'entrées malformées ou aléatoires pour provoquer des plantages. Mutation (on modifie des entrées valides) ou génération (on crée selon un modèle du format). Très efficace contre les dépassements de mémoire."], ["Tests de cas d'abus et de couverture", "Misuse cases : scénarios de l'attaquant. Couverture de code : instructions, branches, conditions, fonctions, boucles testées. Une couverture élevée ne garantit pas l'absence de failles."], ["Tests d'interface", "API, interfaces utilisateur, interfaces physiques et réseau. On teste les entrées inattendues, l'authentification, les erreurs et les limites de débit."], ["Journalisation et revue", "Collecte centralisée, intégrité des journaux, horloges synchronisées, conservation adaptée. Revue automatisée par le SIEM et revue humaine des événements à haut risque. Échantillonnage et seuils de bruit (clipping level)."], ["Surveillance synthétique et réelle", "Transactions synthétiques : scripts qui simulent un utilisateur pour tester disponibilité et performance. RUM (real user monitoring) : mesure passive de l'expérience des vrais utilisateurs."], ["Données de processus de sécurité", "Revue des comptes, vérification des sauvegardes, taux de formation, résultats des tests de PRA, revues de direction. Ces données alimentent KPI et KRI."], ["KPI et KRI", "KPI : performance des contrôles (délai de correction, taux de couverture EDR). KRI : signal précoce d'exposition (comptes à privilèges non revus, systèmes en fin de support). Ils doivent être simples, mesurables et liés à une décision."], ["Rapports SOC", "Basés sur SSAE 18. SOC 1 : contrôles impactant les états financiers. SOC 2 : critères de services de confiance (sécurité, disponibilité, intégrité du traitement, confidentialité, vie privée), diffusion restreinte. SOC 3 : version publique. Type I : conception à une date ; Type II : efficacité sur une période (souvent 6 à 12 mois)."], ["Rapport et remédiation", "Constats priorisés par le risque, recommandations, réponse et plan d'action de la direction, gestion formelle des exceptions (risque accepté et daté). Synthèse pour la direction, détail technique pour les équipes."], ["Divulgation éthique", "Quand un test révèle une faille chez un éditeur ou un tiers : divulgation coordonnée (responsable), délai raisonnable de correction, pas de publication prématurée. Programmes de bug bounty encadrés."]], "schemas": [{"t": "Phases d'un test d'intrusion", "kind": "flow", "items": [["Planification", "autorisation écrite, règles d'engagement"], ["Reconnaissance", "OSINT, cartographie"], ["Scan", "ports, services, vulnérabilités"], ["Exploitation", "preuve d'impact"], ["Post-exploitation", "élévation, pivot, persistance"], ["Rapport", "constats, risques, correctifs"]], "note": "Sans autorisation écrite signée par la direction, ce n'est pas un test : c'est une attaque."}, {"t": "Du constat à la clôture", "kind": "cycle", "items": [["Constat", "preuve et contexte"], ["Priorisation", "selon le risque réel"], ["Plan d'action", "responsable et échéance"], ["Remédiation", "ou exception acceptée"], ["Vérification", "nouveau test"]], "note": "Une exception est une acceptation de risque formelle, avec date de revue."}], "tables": [{"t": "Scan de vulnérabilités vs test d'intrusion", "head": ["Critère", "Scan de vulnérabilités", "Test d'intrusion"], "rows": [["Objectif", "Recenser les failles connues", "Prouver l'exploitabilité et l'impact"], ["Méthode", "Automatisée", "Manuelle et outillée"], ["Fréquence", "Continue ou mensuelle", "Annuelle ou après changement majeur"], ["Profondeur", "Large et superficielle", "Étroite et profonde"], ["Risque pour la production", "Faible", "Plus élevé, à encadrer"]]}, {"t": "SAST, DAST, IAST et fuzzing", "head": ["Technique", "Quand", "Vue", "Atout"], "rows": [["SAST", "Développement, sur le code", "Boîte blanche", "Trouve tôt, pointe la ligne"], ["DAST", "Application en fonctionnement", "Boîte noire", "Voit le comportement réel"], ["IAST", "Pendant les tests, agent instrumenté", "Hybride", "Moins de faux positifs"], ["Fuzzing", "Tests de robustesse", "Boîte noire ou grise", "Trouve plantages et corruptions mémoire"]]}, {"t": "Rapports SOC", "head": ["Rapport", "Contenu", "Diffusion"], "rows": [["SOC 1 Type I / II", "Contrôles impactant le reporting financier", "Client et ses auditeurs"], ["SOC 2 Type I / II", "Sécurité, disponibilité, intégrité, confidentialité, vie privée", "Restreinte (NDA)"], ["SOC 3", "Résumé de SOC 2 sans détail", "Publique"]]}], "scen": [["Un responsable métier demande un test d'intrusion de son application « dès ce soir » par un prestataire.", "Que faire EN PREMIER ?", "Obtenir une autorisation écrite de la direction compétente, définir le périmètre et les règles d'engagement, et prévenir les équipes et l'hébergeur.", "Sans cadre formel, le test peut être illégal et provoquer une panne ou un faux incident."], ["Un fournisseur cloud remet un rapport SOC 2 Type I daté de deux ans.", "Est-ce suffisant ?", "Non : demander un SOC 2 Type II récent couvrant la période et le périmètre des services utilisés, et lire les exceptions.", "Le Type I ne prouve que la conception à une date ; le Type II prouve le fonctionnement dans la durée."], ["Le tableau de bord présenté au conseil contient 40 indicateurs techniques.", "Que recommander ?", "Réduire à quelques KRI et KPI liés aux risques métier majeurs, avec tendances et décisions attendues.", "La direction a besoin de décider, pas de lire des données brutes."], ["Un scan révèle 3 000 vulnérabilités sur le parc.", "Comment prioriser ?", "Selon le risque : criticité des actifs, exposition à Internet, exploitation active connue, puis score CVSS.", "Corriger par ordre de CVSS seul ignore le contexte et les menaces réelles."], ["L'équipe découvre, lors d'un test, une faille non publiée dans un logiciel du marché.", "Quelle est la conduite éthique ?", "Informer l'éditeur de manière confidentielle et coordonner la divulgation, sans publier avant correction ou délai raisonnable.", "La divulgation responsable protège les autres clients de l'éditeur."], ["L'auditeur interne rend compte au DSI dont il audite les processus.", "Quel est le problème ?", "Un défaut d'indépendance : l'audit doit rendre compte au comité d'audit ou au conseil.", "Un auditeur dépendant de l'audité ne peut pas rapporter librement."]], "quiz": [["Quelle est la PREMIÈRE étape d'un test d'intrusion ?", ["La reconnaissance", "L'obtention d'une autorisation écrite", "Le scan de ports", "L'exploitation"], 1, "Tout commence par l'autorisation formelle et le périmètre."], ["Quel rapport SOC est destiné au grand public ?", ["SOC 1", "SOC 2 Type II", "SOC 3", "SOC 2 Type I"], 2, "SOC 3 est un résumé public."], ["Un rapport de Type II évalue :", ["La conception des contrôles à une date", "L'efficacité opérationnelle des contrôles sur une période", "Les seuls contrôles financiers", "La conformité RGPD"], 1, "Type II = fonctionnement sur une période."], ["L'analyse du code source sans l'exécuter est :", ["DAST", "SAST", "Fuzzing", "RUM"], 1, "Static Application Security Testing."], ["Un test où le testeur dispose du code source et de l'architecture est en :", ["Boîte noire", "Boîte grise", "Boîte blanche", "Double aveugle"], 2, "Boîte blanche = connaissance complète."], ["Le fuzzing consiste à :", ["Lire le code", "Envoyer des entrées malformées ou aléatoires", "Scanner les ports", "Analyser les journaux"], 1, "Il cherche des plantages et comportements inattendus."], ["Quelle équipe simule un adversaire réel ?", ["Blue team", "Red team", "White team", "Green team"], 1, "La red team attaque ; la blue team défend."], ["Une transaction synthétique sert à :", ["Mesurer l'expérience des vrais utilisateurs", "Simuler un utilisateur pour tester disponibilité et performance", "Chiffrer les transactions", "Remplacer un test d'intrusion"], 1, "C'est une surveillance active scriptée."], ["Un KRI est avant tout :", ["Un indicateur de performance passée", "Un indicateur d'alerte sur l'évolution du risque", "Un indicateur financier", "Un indicateur de satisfaction"], 1, "Key Risk Indicator : signal précoce d'exposition."], ["À qui l'audit interne doit-il rendre compte pour rester indépendant ?", ["Au DSI", "Au CISO", "Au comité d'audit ou au conseil", "Aux équipes auditées"], 2, "L'indépendance exige un rattachement au plus haut niveau."], ["Un niveau de seuil (clipping level) sert à :", ["Filtrer les événements sous un seuil pour réduire le bruit", "Chiffrer les journaux", "Limiter la bande passante", "Bloquer les attaques"], 0, "Par exemple, n'alerter qu'après 5 échecs de connexion."], ["Quelle méthode de revue de code est la plus formelle ?", ["Revue par-dessus l'épaule", "Inspection de Fagan", "Programmation en binôme", "Revue par e-mail"], 1, "L'inspection de Fagan suit des étapes et rôles définis."], ["Un faux négatif dans un scan de vulnérabilités signifie :", ["Une alerte sans vulnérabilité", "Une vulnérabilité présente non détectée", "Un scan échoué", "Une vulnérabilité corrigée"], 1, "C'est le plus dangereux : la faille reste invisible."], ["Dans quel type de test les testeurs et l'équipe de défense travaillent-ils ensemble, informés l'un de l'autre ?", ["Double aveugle", "Aveugle", "Ciblé (targeted)", "Clandestin"], 2, "En test ciblé, tout le monde est informé et collabore. En aveugle, seuls les testeurs manquent d'informations ; en double aveugle, la défense n'est pas prévenue non plus."], ["La couverture de code mesure :", ["Le nombre de vulnérabilités", "La part du code exercée par les tests", "La qualité des commentaires", "Le temps d'exécution"], 1, "Instructions, branches ou conditions effectivement testées."], ["Un scan authentifié :", ["Est moins complet qu'un scan non authentifié", "Voit les configurations et correctifs internes", "Est interdit", "Remplace le pentest"], 1, "Avec des identifiants, le scanner inspecte le système de l'intérieur."], ["Le référentiel américain sur lequel reposent les rapports SOC est :", ["ISO 27001", "SSAE 18", "PCI DSS", "NIST CSF"], 1, "Les rapports SOC suivent la norme d'attestation SSAE 18."], ["Une exception à une recommandation d'audit doit être :", ["Ignorée", "Formellement acceptée par le propriétaire du risque avec une date de revue", "Corrigée par l'auditeur", "Supprimée du rapport"], 1, "C'est une acceptation de risque documentée."], ["Quel indicateur est un KPI ?", ["Nombre de systèmes en fin de support", "Délai moyen de correction des vulnérabilités critiques", "Nombre de comptes à privilèges non revus", "Exposition à une nouvelle menace"], 1, "Il mesure la performance d'un processus de sécurité."], ["Le meilleur moyen de valider une sauvegarde est :", ["Vérifier le journal de sauvegarde", "Effectuer une restauration de test", "Compter les fichiers", "Chiffrer la sauvegarde"], 1, "Seule la restauration prouve que la sauvegarde est utilisable."]], "glo": [["Assessment", "Évaluation", "Examen d'un ensemble de contrôles."], ["Audit trail", "Piste d'audit", "Traces permettant de reconstituer les actions."], ["Rules of engagement", "Règles d'engagement", "Cadre autorisé d'un test."], ["Black / Grey / White box", "Boîte noire / grise / blanche", "Niveau de connaissance du testeur."], ["Misuse case", "Cas d'abus", "Scénario d'utilisation malveillante."], ["Code coverage", "Couverture de code", "Part du code testée."], ["Synthetic transaction", "Transaction synthétique", "Simulation scriptée d'un utilisateur."], ["Real user monitoring (RUM)", "Surveillance des utilisateurs réels", "Mesure passive de l'expérience."], ["Clipping level", "Seuil de bruit", "Seuil avant alerte."], ["Key performance / risk indicator", "Indicateur clé de performance / de risque", "KPI / KRI."], ["Attestation", "Attestation", "Opinion d'un auditeur sur des contrôles."], ["Responsible disclosure", "Divulgation responsable", "Signalement coordonné d'une faille."], ["Breach and attack simulation (BAS)", "Simulation de brèches et d'attaques", "Tests automatisés de scénarios d'attaque."], ["False positive / negative", "Faux positif / négatif", "Alerte à tort / attaque non vue."]], "check": ["Je distingue test, évaluation et audit.", "Je distingue audits interne, externe et tierce partie.", "Je compare scan de vulnérabilités et test d'intrusion.", "Je connais les phases d'un pentest et l'importance de l'autorisation.", "Je compare SAST, DAST, IAST et fuzzing.", "Je distingue SOC 1, 2, 3 et Type I, II.", "Je distingue KPI et KRI avec des exemples.", "Je connais les équipes rouge, bleue et violette.", "Je sais prioriser des vulnérabilités par le risque.", "Je connais les principes de la divulgation responsable."]};const META={"count": 16, "prev": {"href": "d5.html", "label": "D5 · Gestion des identités et des accès"}, "next": {"href": "d7.html", "label": "D7 · Opérations de sécurité"}};</script>
<script>(function(){
const d=DOMD, M=META, K=d.code;
const qKey="cp-quiz-"+K, cKey="cp-chk-"+K;

function schemaHTML(s){
  let body;
  if(s.kind==="stack")body=`<div class="stack">${s.items.map(([a,b])=>`<div class="ly"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div>`;
  else body=`<div class="flow">${s.items.map(([a,b],k)=>`${k?`<span class="ar" aria-hidden="true">→</span>`:""}<div class="st"><b>${esc(a)}</b>${b?`<span>${esc(b)}</span>`:""}</div>`).join("")}</div>${s.kind==="cycle"?`<div class="cycle-back">↺ puis retour à « ${esc(s.items[0][0])} » : c'est un cycle continu</div>`:""}`;
  return `<div class="card schema"><h3>${esc(s.t)}</h3>${body}${s.note?`<p class="note">${esc(s.note)}</p>`:""}</div>`;
}
const SECS=[["objectifs","Objectifs officiels"],["concepts","Concepts clés"],["schemas","Schémas"],["comparatifs","Comparatifs"],["scenarios","Scénarios d'examen"],["quiz","Quiz"],["glossaire","Glossaire FR-EN"],["checklist","Checklist"]];
const qb=store.get(qKey,null), ch=store.get(cKey,[]);

document.getElementById("app").innerHTML=`
<section class="hero"><div class="wrap hero-in">
  <div class="eyebrow">Domaine ${K.slice(1)} sur 8 · ${d.w} % de l'examen</div>
  <h1><span class="code">${K}</span>${esc(d.name)}</h1>
  <div class="en">${esc(d.en)}</div>
  <p class="pitch">${esc(d.pitch)}</p>
  <div class="stats">
    <a class="stat" href="mindset.html#${K}"><b>${M.count}</b><span>fiches Mindset liées →</span></a>
    <div class="stat"><b id="st-quiz">${qb?qb.best+" %":"—"}</b><span>meilleur score au quiz</span></div>
    <div class="stat"><b id="st-chk">${ch.length} / ${d.check.length}</b><span>points de checklist validés</span></div>
  </div>
  <nav class="toc" aria-label="Sommaire">${SECS.map(([id,l])=>`<a href="#${id}">${l}</a>`).join("")}</nav>
</div></section>
<main class="wrap">
  <section class="sec" id="objectifs"><div class="sec-h"><h2><span class="n">01</span>Objectifs officiels de l'(ISC)²</h2><p>Plan du domaine (version 2024)</p></div>
    <ol class="obj">${d.obj.map(([c,t])=>`<li><b>${c}</b><span>${esc(t)}</span></li>`).join("")}</ol></section>
  <section class="sec" id="concepts"><div class="sec-h"><h2><span class="n">02</span>Concepts clés</h2><p>${d.concepts.length} notions expliquées</p></div>
    <div class="concepts">${d.concepts.map(([t,x],k)=>`<article class="concept"><h3><i>${String(k+1).padStart(2,"0")}</i>${esc(t)}</h3><p>${esc(x)}</p></article>`).join("")}</div></section>
  <section class="sec" id="schemas"><div class="sec-h"><h2><span class="n">03</span>Schémas</h2><p>Les mécanismes à visualiser</p></div>
    <div class="schemas">${d.schemas.map(schemaHTML).join("")}</div></section>
  <section class="sec" id="comparatifs"><div class="sec-h"><h2><span class="n">04</span>Tableaux comparatifs</h2><p>Les notions que l'examen fait confondre</p></div>
    <div class="tables">${d.tables.map(t=>`<div class="card"><h3>${esc(t.t)}</h3><div class="tblw"><table><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`).join("")}</div></section>
  <section class="sec" id="scenarios"><div class="sec-h"><h2><span class="n">05</span>Scénarios d'examen</h2><p>Réfléchissez en manager, puis révélez la réponse</p></div>
    <div class="scens">${d.scen.map(([s,q,a,w],k)=>`<article class="scen"><span class="eyebrow">Scénario ${k+1}</span><p class="sit">${esc(s)}</p><p class="q">${esc(q)}</p>
      <div class="ans" hidden><p><strong>Réponse attendue :</strong> ${esc(a)}</p><p class="why">${esc(w)}</p></div>
      <div><button class="btn" type="button" data-rev>Voir la réponse</button></div></article>`).join("")}</div></section>
  <section class="sec" id="quiz"><div class="sec-h"><h2><span class="n">06</span>Quiz du domaine</h2><p>${d.quiz.length} questions · correction immédiate · ordre des réponses mélangé</p></div>
    <div class="card quiz" id="qz"></div></section>
  <section class="sec" id="glossaire"><div class="sec-h"><h2><span class="n">07</span>Glossaire français-anglais</h2><input class="glo-s" id="gs" type="search" placeholder="Chercher un terme…" aria-label="Chercher un terme"></div>
    <div class="card"><div class="tblw"><table class="glo"><thead><tr><th>Anglais (examen)</th><th>Français</th><th>Définition</th></tr></thead><tbody id="gb"></tbody></table></div></div></section>
  <section class="sec" id="checklist"><div class="sec-h"><h2><span class="n">08</span>Checklist « Je sais… »</h2><p id="ck-txt"></p></div>

  <nav class="pager">

  </nav>
  <p class="foot">Votre progression (quiz, checklist) est enregistrée dans ce navigateur et visible sur le CISO Portail. Formation CISSP · SANOGO Souleymane.</p>
</main>`;

// Scénarios
$$("[data-rev]").forEach(b=>b.addEventListener("click",()=>{const a=b.closest(".scen").querySelector(".ans");a.hidden=!a.hidden;b.textContent=a.hidden?"Voir la réponse":"Masquer la réponse"}));
// Quiz
Quiz($("#qz"),d.quiz.map(([q,o,a,ex])=>({q,opts:o,a,ex,d:K})),{mode:"learn",onDone:r=>{
  if(r.total!==d.quiz.length)return;
  const prev=store.get(qKey,null);const best=Math.max(r.pct,prev?prev.best:0);
  store.set(qKey,{best,last:r.pct,date:new Date().toISOString().slice(0,10)});$("#st-quiz").textContent=best+" %";
}}).start();
// Glossaire
function glo(){const q=norm($("#gs").value.trim());const rows=d.glo.filter(g=>!q||norm(g.join(" ")).includes(q));
  $("#gb").innerHTML=rows.length?rows.map(g=>`<tr><td>${esc(g[0])}</td><td>${esc(g[1])}</td><td>${esc(g[2])}</td></tr>`).join(""):`<tr><td colspan="3" style="font-weight:400;color:var(--muted)">Aucun terme trouvé.</td></tr>`}
$("#gs").addEventListener("input",glo);glo();
// Checklist
function ck(){const v=$$(".chk input").filter(i=>i.checked).map(i=>+i.dataset.k);store.set(cKey,v);
  $("#ck-m").style.width=(v.length/d.check.length*100)+"%";$("#ck-txt").textContent=`${v.length} / ${d.check.length} validés`;$("#st-chk").textContent=`${v.length} / ${d.check.length}`}
$$(".chk input").forEach(i=>i.addEventListener("change",ck));ck();
})();
</script>
</body></html>

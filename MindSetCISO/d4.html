<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>CISSP D4 · Sécurité des réseaux et communications</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap">
<style>/* Layout : portail de révision — barre de navigation fixe, en-tête de domaine, sections empilées avec sommaire */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#101B2B; --muted:#5A6879; --line:#D7DEE7;
  --accent:#1F4E9E; --accent-soft:#E3EBF8; --on-accent:#FFFFFF;
  --ok:#2E7D46; --ok-soft:#E3F2E8; --bad:#B3262F; --bad-soft:#FBE7E8; --warn:#B0680A;
  --hl:#FFF4D6; --hl-ink:#6B4B00;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-quote:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C121B; --surface:#141D29; --sunk:#1A2533; --ink:#E6ECF3; --muted:#97A5B7; --line:#26344A;
  --accent:#7FA9F5; --accent-soft:#1B2A44; --on-accent:#0C121B;
  --ok:#6FD38C; --ok-soft:#163323; --bad:#FF7A7A; --bad-soft:#3A1A1D; --warn:#F0B955;
  --hl:#3A3016; --hl-ink:#F4D58A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}

/* Barre du portail */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.pbar-in{display:flex;align-items:center;gap:14px;padding-block:9px;overflow-x:auto;scrollbar-width:none}
.pbar-in::-webkit-scrollbar{display:none}
.logo{font-family:var(--f-disp);font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo span{color:var(--accent)}
.pnav{display:flex;gap:4px}
.pnav a{font-family:var(--f-mono);font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);padding:5px 9px;border-radius:6px;white-space:nowrap}
.pnav a:hover{background:var(--sunk);color:var(--ink)}
.pnav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

/* En-tête de page */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero-in{padding-block:26px 18px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.hero h1 .code{color:var(--accent);margin-right:10px}
.en{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pitch{max-width:72ch;margin:0;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.stat{display:flex;flex-direction:column;gap:2px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:150px;text-decoration:none;color:var(--ink)}
.stat b{font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
a.stat:hover{border-color:var(--accent)}
.toc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.toc::-webkit-scrollbar{display:none}
.toc a{font-size:13px;font-weight:500;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)}
.toc a:hover{color:var(--ink);border-color:var(--accent)}

main{padding-block:10px 60px}
.sec{padding-top:34px;scroll-margin-top:60px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h .n{font-family:var(--f-mono);font-size:13px;color:var(--accent);margin-right:8px}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}

/* Objectifs */
.obj{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:8px}
.obj li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.obj b{font-family:var(--f-mono);color:var(--accent);font-size:13px}

/* Concepts */
.concepts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.concept h3{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
.concept h3 i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.concept p{margin:0;font-size:14.5px}

/* Schémas */
.schemas{display:flex;flex-direction:column;gap:14px}
.schema h3{font-size:18px;margin-bottom:12px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 130px;min-width:0;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:7px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.flow .st b{font-family:var(--f-disp);font-size:15px}
.flow .st span{font-size:12.5px;color:var(--muted)}
.flow .ar{align-self:center;color:var(--muted);font-family:var(--f-mono)}
.cycle-back{margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:4px}
.stack .ly{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:14px}
.stack .ly b{font-family:var(--f-disp);font-size:15px}
.stack .ly span{color:var(--muted)}
.note{margin:10px 0 0;font-size:13px;color:var(--hl-ink);background:var(--hl);display:inline-block;padding:4px 10px;border-radius:6px}

/* Tableaux */
.tables{display:flex;flex-direction:column;gap:14px}
.tables h3{font-size:18px;margin-bottom:10px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td:first-child{font-weight:600}

/* Scénarios */
.scens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.scen .sit{margin:0;font-size:14.5px}
.scen .q{margin:0;font-weight:600;font-family:var(--f-disp);font-size:16px;color:var(--accent)}
.scen .ans{background:var(--ok-soft);border-radius:7px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.scen .ans p{margin:0}
.scen .why{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:13.5px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Quiz */
.quiz{max-width:820px}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--muted)}
.qz-prog{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:14px}
.qz-prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qz-q{font-family:var(--f-disp);font-size:20px;font-weight:600;margin:0 0 14px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--bg);border-left:4px solid var(--muted);font-size:14.5px}
.fb.ok{border-left-color:var(--ok)}.fb.ko{border-left-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.qz-end{display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1}
.score small{font-size:18px;color:var(--muted);font-weight:500}
.review{display:flex;flex-direction:column;gap:8px}
.review div{background:var(--bg);border-radius:7px;padding:10px 12px;font-size:14px}
.review b{color:var(--bad)}

/* Glossaire */
.glo-s{max-width:320px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.glo td:first-child{font-family:var(--f-mono);font-size:13px}

/* Checklist */
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-width:820px}
.chk label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14.5px}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;max-width:820px;margin-bottom:10px}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1 1 220px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pager a.next{text-align:right}
.foot{margin-top:30px;font-size:12px;color:var(--muted)}

@media (max-width:760px){
  .hero h1{font-size:26px}
  .concepts,.scens{grid-template-columns:minmax(0,1fr)}
  .stack .ly{grid-template-columns:minmax(0,1fr);gap:2px}
  .flow .ar{display:none}
  .flow .st{flex-basis:100%}
  .stat{min-width:0;flex:1 1 40%}
}
</style>
</head><body>
<header class="pbar"><div class="wrap pbar-in"><a class="logo" href="index.html">CISO <span>Portail</span></a><nav class="pnav" aria-label="Modules"><a href="index.html">Portail</a><a href="mindset.html">Mindset 150</a><a href="d1.html">D1</a><a href="d2.html">D2</a><a href="d3.html">D3</a><a href="d4.html" aria-current="page">D4</a><a href="d5.html">D5</a><a href="d6.html">D6</a><a href="d7.html">D7</a><a href="d8.html">D8</a></nav></div></header>
<div id="app"></div>
<script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const LETTERS="ABCD";

/* Moteur de quiz : mode « learn » (correction immédiate) ou « exam » (correction à la fin) */
function Quiz(el,questions,cfg){
  cfg=cfg||{};
  let qs,i,ans,timer,deadline;
  function start(list){
    qs=(list||questions).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:shuffle(q.opts.map((t,k)=>({t,ok:k===q.a})))}));
    i=0;ans=[];
    clearInterval(timer);
    if(cfg.minutes){deadline=Date.now()+cfg.minutes*60000;timer=setInterval(tick,1000)}
    render();
  }
  function tick(){const r=deadline-Date.now();const t=el.querySelector(".qz-time");if(t)t.textContent=fmt(r);if(r<=0){clearInterval(timer);finish(true)}}
  const fmt=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,"0")}`};
  function render(){
    if(i>=qs.length)return finish(false);
    const q=qs[i],a=ans[i],good=ans.filter(x=>x&&x.ok).length;
    el.innerHTML=`<div class="qz-top"><span>Question <b>${i+1}</b> / ${qs.length}${q.d&&cfg.showDom?` · <span class="en">${q.d}</span>`:""}</span>
      <span>${cfg.mode==="exam"?(cfg.minutes?`Temps restant <b class="qz-time">${fmt(deadline-Date.now())}</b>`:""):`Score <b>${good}</b> / ${ans.filter(Boolean).length}`}</span></div>
      <div class="qz-prog"><i style="width:${i/qs.length*100}%"></i></div>
      <p class="qz-q">${esc(q.q)}</p>
      <div class="opts">${q.opts.map((o,k)=>{
        let cls="opt";
        if(a){ if(cfg.mode==="exam"){if(a.k===k)cls+=" picked"} else {if(o.ok)cls+=" good";else if(a.k===k)cls+=" wrong"} }
        return `<button class="${cls}" type="button" data-k="${k}"${a&&cfg.mode!=="exam"?" disabled":""}><span class="k">${LETTERS[k]}</span><span>${esc(o.t)}</span></button>`}).join("")}</div>
      ${a&&cfg.mode!=="exam"?`<div class="fb ${a.ok?"ok":"ko"}"><b>${a.ok?"Bonne réponse.":"Pas tout à fait."}</b>${esc(q.ex)}</div>`:""}
      <div class="row" style="margin-top:14px">
        ${cfg.mode==="exam"?`<button class="btn primary" type="button" data-nav="next"${a?"":" disabled"}>${i+1<qs.length?"Valider et continuer":"Terminer l'examen"}</button><button class="btn" type="button" data-nav="stop">Arrêter et voir le résultat</button>`
          :`${a?`<button class="btn primary" type="button" data-nav="next">${i+1<qs.length?"Question suivante":"Voir mon score"}</button>`:""}`}
      </div>`;
  }
  el.addEventListener("click",e=>{
    const o=e.target.closest(".opt");
    if(o&&!o.disabled&&i<qs.length){const k=+o.dataset.k;if(cfg.mode!=="exam"&&ans[i])return;ans[i]={k,ok:qs[i].opts[k].ok};render();return}
    const n=e.target.closest("[data-nav]");if(!n||n.disabled)return;
    if(n.dataset.nav==="next"){i++;render()}
    else if(n.dataset.nav==="stop")finish(false);
    else if(n.dataset.nav==="again")start();
    else if(n.dataset.nav==="errors"){const wrong=qs.filter((q,k)=>!ans[k]||!ans[k].ok).map(q=>({q:q.q,ex:q.ex,d:q.d,opts:q.opts.map(o=>o.t),a:q.opts.findIndex(o=>o.ok)}));start(wrong)}
  });
  function finish(timeout){
    clearInterval(timer);
    const total=qs.length,good=qs.filter((q,k)=>ans[k]&&ans[k].ok).length,pct=Math.round(good/total*100);
    const per={};qs.forEach((q,k)=>{if(!q.d)return;per[q.d]=per[q.d]||[0,0];per[q.d][1]++;if(ans[k]&&ans[k].ok)per[q.d][0]++});
    if(cfg.onDone)cfg.onDone({pct,good,total,per});
    const wrong=qs.map((q,k)=>({q,a:ans[k]})).filter(x=>!x.a||!x.a.ok);
    el.innerHTML=`<div class="qz-end">
      ${timeout?`<p class="note">Temps écoulé : les questions sans réponse comptent comme fausses.</p>`:""}
      <div class="score">${pct} %<small> · ${good} / ${total} bonnes réponses</small></div>
      <p style="margin:0">${pct>=80?"Excellent niveau : vous êtes prêt sur ce périmètre.":pct>=70?"Bon niveau, proche du seuil de réussite. Revoyez les erreurs ci-dessous.":"Niveau à consolider : relisez les concepts et les fiches, puis recommencez."}</p>
      ${Object.keys(per).length>1?`<div class="tblw"><table><thead><tr><th>Domaine</th><th>Score</th></tr></thead><tbody>${Object.keys(per).sort().map(d=>`<tr><td>${d}</td><td>${per[d][0]} / ${per[d][1]} (${Math.round(per[d][0]/per[d][1]*100)} %)</td></tr>`).join("")}</tbody></table></div>`:""}
      <div class="row"><button class="btn primary" type="button" data-nav="again">Recommencer</button>${wrong.length?`<button class="btn" type="button" data-nav="errors">Refaire seulement mes ${wrong.length} erreur${wrong.length>1?"s":""}</button>`:""}</div>
      ${wrong.length?`<h3 style="font-size:17px;margin-top:6px">Correction des erreurs</h3><div class="review">${wrong.map(x=>`<div><p style="margin:0 0 4px;font-weight:600">${esc(x.q.q)}</p><p style="margin:0">Bonne réponse : <strong>${esc(x.q.opts.find(o=>o.ok).t)}</strong>${x.a?` · votre réponse : <b>${esc(x.q.opts[x.a.k].t)}</b>`:" · sans réponse"}</p><p style="margin:4px 0 0;color:var(--muted)">${esc(x.q.ex)}</p></div>`).join("")}</div>`:""}
    </div>`;
  }
  return {start};
}
</script>
<script>const DOMD={"code": "D4", "name": "Sécurité des réseaux et communications", "en": "Communication and Network Security", "w": 13, "pitch": "Comprendre comment circule l'information pour savoir où l'attaquer et où la défendre : modèles en couches, protocoles, équipements, canaux sécurisés et architectures modernes.", "obj": [["4.1", "Appliquer les principes de conception sécurisée aux architectures réseau (OSI, TCP/IP, IPv6, segmentation, SDN, sans-fil, cellulaire, CDN)"], ["4.2", "Sécuriser les composants réseau (équipements, supports de transmission, NAC, terminaux)"], ["4.3", "Mettre en œuvre des canaux de communication sécurisés (voix, vidéo, collaboration, accès distant, données, réseaux tiers)"]], "concepts": [["Modèle OSI", "Sept couches : 1 Physique (bits, câbles), 2 Liaison (trames, MAC, switch), 3 Réseau (paquets, IP, routeur), 4 Transport (segments, TCP/UDP), 5 Session, 6 Présentation (format, chiffrement), 7 Application. Chaque couche ajoute son en-tête (encapsulation)."], ["Modèle TCP/IP", "Quatre couches : Accès réseau (OSI 1-2), Internet (3), Transport (4), Application (5-7). C'est le modèle réellement utilisé ; l'examen demande de faire la correspondance."], ["TCP et UDP", "TCP : orienté connexion, poignée de main SYN, SYN-ACK, ACK, fiable, ordonné. UDP : sans connexion, rapide, sans garantie (DNS, VoIP, streaming). Le SYN flood abuse de la poignée de main TCP."], ["IPv4 et IPv6", "IPv6 : adresses de 128 bits, IPsec intégré à la conception, pas de NAT nécessaire, autoconfiguration. Risque : IPv6 actif mais non surveillé, tunnels IPv6 dans IPv4 qui contournent les contrôles."], ["Équipements", "Hub (couche 1, diffuse tout), switch (2, adresses MAC, VLAN), routeur (3), pare-feu (3 à 7), proxy (7), répartiteur de charge, passerelle. Un switch couche 3 route aussi."], ["Pare-feu", "Filtrage de paquets (sans état, couche 3-4), à états (stateful, suit les connexions), proxy applicatif (couche 7), NGFW (inspection applicative, IPS, identité), WAF (applications web). Architecture en DMZ à un ou deux pare-feu (screened subnet)."], ["Segmentation", "VLAN, sous-réseaux, DMZ, micro-segmentation, réseaux d'administration séparés. Objectif : limiter les mouvements latéraux et réduire la surface d'attaque."], ["Sans-fil", "802.11 ; WEP (RC4, cassé), WPA (TKIP, obsolète), WPA2 (AES-CCMP), WPA3 (SAE, protection contre dictionnaire hors ligne). Mode Entreprise : 802.1X avec RADIUS. Attaques : evil twin, désauthentification, wardriving."], ["Autres liaisons sans fil", "Bluetooth (bluejacking : messages non sollicités ; bluesnarfing : vol de données), NFC, Zigbee, réseaux cellulaires 4G/5G, satellite. Chacun a sa surface d'attaque et ses contrôles."], ["IPsec", "AH : intégrité et authentification de l'origine, sans confidentialité. ESP : confidentialité, plus intégrité. Mode transport : charge utile seule (hôte à hôte). Mode tunnel : paquet entier encapsulé (site à site). IKE négocie les associations de sécurité (SA)."], ["TLS et VPN", "TLS 1.2 et 1.3 sécurisent HTTPS et de nombreux protocoles. VPN : IPsec, TLS (SSL VPN), WireGuard. Split tunnel : seul le trafic interne passe dans le VPN, plus pratique mais plus risqué."], ["Protocoles d'authentification réseau", "PAP (mot de passe en clair, à proscrire), CHAP (défi-réponse), EAP (cadre extensible : EAP-TLS par certificat, PEAP). RADIUS (UDP, chiffre seulement le mot de passe), TACACS+ (TCP, chiffre tout, sépare AAA), Diameter."], ["NAC et 802.1X", "Le contrôle d'accès réseau vérifie identité et conformité avant connexion. 802.1X : supplicant (poste), authenticator (switch ou borne), serveur d'authentification (RADIUS)."], ["SDN, SD-WAN et SASE", "SDN sépare plan de contrôle et plan de données, programmable par logiciel. SD-WAN optimise les liaisons inter-sites. SASE combine réseau et sécurité en service cloud (ZTNA, SWG, CASB, FWaaS)."], ["CDN et convergence", "Un CDN rapproche le contenu des utilisateurs et absorbe les DDoS. La convergence (voix, vidéo, données sur IP) concentre les risques : VoIP avec SIP sécurisé et SRTP, segmentation de la voix."], ["Attaques réseau", "Usurpation IP ou MAC, empoisonnement ARP et DNS, MITM, détournement de session, SYN flood, smurf (ICMP vers broadcast), amplification DNS/NTP, VLAN hopping, attaques BGP. Défenses : chiffrement, authentification, filtrage d'entrée et de sortie."], ["Supports de transmission", "Paire torsadée (sensible aux interférences, écoutable), coaxial, fibre optique (pas d'émissions électromagnétiques, difficile à écouter, longue distance). Le blindage et la protection physique des câbles comptent."]], "schemas": [{"t": "Les 7 couches OSI", "kind": "stack", "items": [["7 · Application", "HTTP, DNS, SMTP, SSH · WAF, proxy"], ["6 · Présentation", "formats, chiffrement, compression"], ["5 · Session", "établissement des sessions, RPC"], ["4 · Transport", "TCP, UDP · ports, segments"], ["3 · Réseau", "IP, ICMP, IPsec · routeurs"], ["2 · Liaison", "Ethernet, ARP, 802.1X · switchs, VLAN"], ["1 · Physique", "câbles, ondes, hubs, répéteurs"]], "note": "De 1 à 7 : « Pour Le Réseau, Tout Se Passe Automatiquement »."}, {"t": "Poignée de main TCP", "kind": "flow", "items": [["SYN", "client → serveur"], ["SYN-ACK", "serveur → client"], ["ACK", "client → serveur"], ["Connexion établie", ""]], "note": "Le SYN flood envoie des SYN sans jamais terminer la poignée de main."}, {"t": "Authentification 802.1X", "kind": "flow", "items": [["Supplicant", "le poste ou l'objet"], ["Authenticator", "switch ou borne Wi-Fi"], ["Serveur RADIUS", "vérifie l'identité"], ["Accès", "VLAN autorisé ou quarantaine"]], "note": "EAP-TLS, par certificat, est la méthode la plus robuste."}], "tables": [{"t": "Ports à connaître", "head": ["Port", "Protocole", "Alternative sécurisée"], "rows": [["20/21", "FTP", "SFTP (22) ou FTPS (990)"], ["22", "SSH / SFTP", "—"], ["23", "Telnet", "SSH (22)"], ["25", "SMTP", "SMTP + STARTTLS (587)"], ["53", "DNS", "DNSSEC, DoT (853)"], ["80", "HTTP", "HTTPS (443)"], ["88", "Kerberos", "—"], ["110 / 143", "POP3 / IMAP", "995 / 993"], ["161/162", "SNMP", "SNMPv3"], ["389", "LDAP", "LDAPS (636)"], ["445", "SMB", "SMB 3 chiffré, jamais exposé sur Internet"], ["3389", "RDP", "Via VPN ou bastion"]]}, {"t": "Générations de pare-feu", "head": ["Type", "Couche", "Force", "Limite"], "rows": [["Filtrage de paquets", "3-4", "Rapide, simple", "Sans état, facilement trompé"], ["Stateful", "3-4", "Suit les connexions", "Ne voit pas le contenu applicatif"], ["Proxy applicatif", "7", "Inspection profonde", "Plus lent, un proxy par protocole"], ["NGFW", "3-7", "Applications, identité, IPS", "Coût, complexité"], ["WAF", "7 (HTTP)", "Protège les applications web", "Spécialisé web"]]}, {"t": "RADIUS vs TACACS+", "head": ["Critère", "RADIUS", "TACACS+"], "rows": [["Transport", "UDP", "TCP"], ["Chiffrement", "Mot de passe seulement", "Toute la charge utile"], ["AAA", "Authentification et autorisation combinées", "Séparées"], ["Usage type", "Accès réseau, Wi-Fi, VPN", "Administration des équipements"]]}], "scen": [["Un audit montre que le réseau d'entreprise est plat : postes, serveurs et caméras dans le même sous-réseau.", "Quelle est la MEILLEURE première mesure ?", "Segmenter le réseau en zones selon la sensibilité et filtrer les flux entre zones, en commençant par isoler les actifs critiques et les objets connectés.", "Un réseau plat permet à une seule compromission de se propager partout."], ["Le Wi-Fi d'entreprise utilise une clé partagée connue de tous, y compris d'anciens employés.", "Que recommander ?", "Passer en WPA2 ou WPA3 Entreprise avec 802.1X et authentification individuelle, et isoler un réseau invités.", "Une clé partagée ne peut pas être révoquée pour une seule personne et ne trace rien."], ["Les commerciaux en déplacement se connectent au VPN en split tunnel.", "Quel est le risque ?", "Le poste est simultanément exposé à Internet et connecté au réseau interne, ce qui peut servir de pont à un attaquant.", "Le full tunnel ou une approche ZTNA avec contrôle du poste réduit ce risque."], ["Des routeurs sont administrés en Telnet depuis le réseau bureautique.", "Que faire EN PREMIER ?", "Remplacer Telnet par SSH et restreindre l'administration à un réseau dédié ou à un bastion.", "Telnet transmet les identifiants en clair."], ["Un DDoS volumétrique sature le lien Internet de 1 Gbit/s.", "Pourquoi le pare-feu local ne suffit-il pas et que faire ?", "Le lien sature avant le pare-feu ; il faut un filtrage en amont par l'opérateur, un service anti-DDoS ou un CDN.", "La protection doit se situer là où la capacité est suffisante."], ["On découvre du trafic IPv6 sur le réseau alors que la politique ne prévoit que de l'IPv4.", "Quel est le risque ?", "Un canal non surveillé et non filtré qui contourne les contrôles ; il faut soit le désactiver, soit l'intégrer à la surveillance et au filtrage.", "Ce que l'on ne surveille pas devient un angle mort."]], "quiz": [["À quelle couche OSI fonctionne un switch classique ?", ["Couche 1", "Couche 2", "Couche 3", "Couche 4"], 1, "Le switch commute sur les adresses MAC, en couche Liaison."], ["Quel composant IPsec assure la confidentialité ?", ["AH", "ESP", "IKE", "SA"], 1, "ESP chiffre ; AH n'apporte qu'intégrité et authentification."], ["Quel mode IPsec encapsule le paquet IP entier, typiquement entre deux sites ?", ["Transport", "Tunnel", "Agressif", "Principal"], 1, "Le mode tunnel protège tout le paquet d'origine."], ["Quelle est la séquence de la poignée de main TCP ?", ["SYN, ACK, FIN", "SYN, SYN-ACK, ACK", "ACK, SYN, SYN-ACK", "SYN, FIN, ACK"], 1, "SYN → SYN-ACK → ACK."], ["Quel protocole Wi-Fi utilise SAE ?", ["WEP", "WPA", "WPA2", "WPA3"], 3, "WPA3 remplace la clé pré-partagée par SAE, plus résistant aux attaques par dictionnaire."], ["TACACS+ se distingue de RADIUS car il :", ["Utilise UDP", "Chiffre toute la charge utile et sépare les fonctions AAA", "Ne gère pas l'autorisation", "Est réservé au Wi-Fi"], 1, "TACACS+ utilise TCP, chiffre tout et sépare authentification, autorisation et traçabilité."], ["Dans 802.1X, le switch joue le rôle de :", ["Supplicant", "Authenticator", "Serveur d'authentification", "Proxy"], 1, "Le switch ou la borne est l'authenticator ; RADIUS est le serveur."], ["Quel port utilise RDP ?", ["22", "443", "3389", "445"], 2, "RDP écoute sur 3389 ; il ne doit pas être exposé directement sur Internet."], ["Quel support est le plus difficile à écouter ?", ["Paire torsadée", "Coaxial", "Fibre optique", "Wi-Fi"], 2, "La fibre n'émet pas de rayonnement électromagnétique exploitable."], ["Quelle attaque associe une fausse adresse MAC à l'adresse IP de la passerelle ?", ["DNS poisoning", "ARP poisoning", "Smurf", "SYN flood"], 1, "L'empoisonnement ARP permet d'intercepter le trafic du réseau local."], ["Une attaque smurf utilise :", ["Des paquets ICMP vers une adresse de diffusion avec l'IP source usurpée", "Des requêtes DNS", "Des SYN incomplets", "Des trames 802.11"], 0, "Les réponses ICMP de tout le réseau inondent la victime."], ["Quel protocole d'authentification envoie le mot de passe en clair ?", ["CHAP", "PAP", "EAP-TLS", "Kerberos"], 1, "PAP est à proscrire."], ["Le SDN repose sur la séparation :", ["Du plan de contrôle et du plan de données", "Des VLAN", "Des couches 2 et 3", "Du LAN et du WAN"], 0, "Le contrôleur centralisé programme les équipements qui transmettent les données."], ["DNSSEC garantit :", ["La confidentialité des requêtes DNS", "L'authenticité et l'intégrité des réponses DNS", "La disponibilité du DNS", "Le chiffrement du trafic web"], 1, "DNSSEC signe les enregistrements ; il ne chiffre rien."], ["Le bluesnarfing consiste à :", ["Envoyer des messages non sollicités", "Voler des données via Bluetooth", "Brouiller le Wi-Fi", "Usurper une borne"], 1, "Le bluejacking envoie des messages ; le bluesnarfing vole des données."], ["Quel pare-feu suit l'état des connexions ?", ["Filtrage de paquets", "Stateful", "Hub", "Répéteur"], 1, "Le pare-feu à états garde une table des connexions établies."], ["Une architecture de DMZ entre deux pare-feu est aussi appelée :", ["Screened subnet", "Bastion host", "Honeynet", "Extranet"], 0, "Le sous-réseau filtré se trouve entre le pare-feu externe et le pare-feu interne."], ["Quel enregistrement DNS aide à lutter contre l'usurpation d'expéditeur en publiant une politique de traitement ?", ["MX", "DMARC", "CNAME", "PTR"], 1, "DMARC indique quoi faire des mails échouant à SPF et DKIM."], ["Dans le modèle TCP/IP, la couche Internet correspond à quelle couche OSI ?", ["2", "3", "4", "7"], 1, "Internet (IP) = couche Réseau OSI."], ["Le VLAN hopping vise à :", ["Saturer un switch", "Accéder à un VLAN non autorisé via le trunking ou le double étiquetage", "Casser WPA2", "Usurper DNS"], 1, "Désactiver la négociation de trunk et éviter le VLAN natif par défaut le préviennent."]], "glo": [["Encapsulation", "Encapsulation", "Ajout des en-têtes à chaque couche."], ["Stateful inspection", "Inspection à états", "Filtrage tenant compte des connexions."], ["Screened subnet / DMZ", "Sous-réseau filtré / zone démilitarisée", "Zone pour les services exposés."], ["Bastion host", "Hôte bastion", "Machine durcie exposée ou d'administration."], ["Split tunneling", "Tunnel partagé", "Seul le trafic interne passe dans le VPN."], ["Supplicant", "Demandeur", "Équipement qui demande l'accès en 802.1X."], ["Evil twin", "Jumeau maléfique", "Fausse borne Wi-Fi imitant une vraie."], ["Spoofing", "Usurpation", "Falsification d'une identité réseau."], ["Man-in-the-middle (MITM)", "Homme du milieu", "Interception active d'une communication."], ["Egress / Ingress filtering", "Filtrage sortant / entrant", "Contrôle du trafic qui sort / entre."], ["Network access control (NAC)", "Contrôle d'accès réseau", "Vérifie identité et conformité avant connexion."], ["Software-defined networking (SDN)", "Réseau défini par logiciel", "Contrôle centralisé et programmable."], ["Secure access service edge (SASE)", "SASE", "Réseau et sécurité livrés en service cloud."], ["Content delivery network (CDN)", "Réseau de diffusion de contenu", "Serveurs répartis proches des utilisateurs."]], "check": ["Je cite les 7 couches OSI dans l'ordre et un protocole par couche.", "Je fais la correspondance OSI ↔ TCP/IP.", "Je connais les ports essentiels et leurs alternatives sécurisées.", "Je distingue AH et ESP, mode transport et mode tunnel.", "Je compare WEP, WPA, WPA2 et WPA3.", "Je connais les 3 rôles de 802.1X.", "Je distingue RADIUS et TACACS+.", "Je compare les générations de pare-feu et le WAF.", "Je cite 6 attaques réseau et leur parade.", "J'explique SDN, SD-WAN et SASE."]};const META={"count": 19, "prev": {"href": "d3.html", "label": "D3 · Architecture et ingénierie de sécurité"}, "next": {"href": "d5.html", "label": "D5 · Gestion des identités et des accès"}};</script>
<script>(function(){

function schemaHTML(s){

const qb=store.get(qKey,null), ch=store.get(cKey,[]);

document.getElementById("app").innerHTML=`
<section class="hero"><div class="wrap hero-in">
  <div class="eyebrow">Domaine ${K.slice(1)} sur 8 · ${d.w} % de l'examen</div>

function ck(){const v=$$(".chk input").filter(i=>i.checked).map(i=>+i.dataset.k);store.set(cKey,v);
